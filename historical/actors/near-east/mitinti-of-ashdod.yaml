    lang: en
    script: Latn
    cite:
      - id: mitinti-of-ashdod-name
        says: The prism names Mitinti, king of Ashdod.
        source: luckenbill-annals-sennacherib
        at: p. 33, Oriental Institute prism col. III 32
        quote: to Mitinti, king of Ashdod,
