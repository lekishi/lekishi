summary:
  Tadukhipa, daughter of Tushratta, married to Amenhotep III shortly before his death; her dowry
  list was found at Amarna.
types: [person]
names:
  - form: Tadukhipa
    lang: akk
    script: Latn
    cite:
      - id: tadukhipa-name
        says: Niebuhr says Nimmuria married Tushratta's daughter Tadukhipa shortly before his death.
        source: niebuhr-tell-el-amarna-period
