# yaml-language-server: $schema=../../schema/event.schema.json
summary: On the 16th day the army reaches the town of Yehem.
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: year 23, I Shemu 16
  cite:
    - id: yehem-date
      says: The annals date this to year 23, I Shemu 16.
      source: breasted-ancient-records
      at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 16 (Yehem)"
      quote: Year 23, first month of the third season, on the sixteenth day, he arrived at the city of Yehem.
places:
  - place: yehem
    role: waypoint
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: yehem-arrival
    says: The annals record the arrival at Yehem.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 16 (Yehem)"
    quote: Year 23, first month of the third season, on the sixteenth day, he arrived at the city of Yehem.
notes:
  The annals date by regnal year and the civil calendar, and the conversion to a BCE year depends
  on which chronology of the Eighteenth Dynasty is used. The window spans the dates usually given for
  year 23 of Thutmose III, from about 1482 BCE (a higher chronology) to about 1457 BCE (the lower one
  most used today); Breasted's own 1906 table is within it. It is an editorial bound that a cited chronology
  must replace before approval.
