notes:
  The bureau's page on the 難波宮跡 at 大阪市中央区法円坂. It reports that excavations from 1961 confirmed
  two palaces of the Asuka and Nara periods, the later built from 726 (神亀3年) and the earlier from 650,
  and that the palace's central area is a national Historic Site. It is a modern site identification,
  not a source statement of the eighth century.
