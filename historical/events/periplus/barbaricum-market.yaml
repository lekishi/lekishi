# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At Barbaricum, at the middle mouth of the Indus, ships anchor while their cargoes go up the river
  to the king at Minnagara, under Parthian princes who keep driving each other out.
types: [exchange]
part_of: [periplus-voyage]
date:
  value: 58..62
  mode: window
  calendar: julian
  as_written: no date; the text speaks of the present
  cite:
    - id: barbaricum-market-time
      says:
        The Periplus describes this as present at the time of the voyage it was written from, which
        it does not date; Schoff puts that voyage between the summers of 58 and 62 CE.
      basis: interpretation
      attributed_to: W. H. Schoff (1912)
      sources:
        - source: periplus-erythraean-sea
          at: 38–39
        - source: schoff-periplus
          at: Date and Authorship of the Periplus
places:
  - place: barbaricum
    role: site
cite:
  - id: barbaricum-market-account
    says: The Periplus says ships anchor at Barbaricum while their cargoes go up the river to the king.
    source: periplus-erythraean-sea
    at: 38–39
    quote:
      The ships lie at anchor at Barbaricum, but all their cargoes are carried up to the metropolis
      by the river, to the King.
