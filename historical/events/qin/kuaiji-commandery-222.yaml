# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 222 BCE 王翦 settled the Chu lands south of the Yangzi; the annals record the lord of 越 submitting and Qin setting up the 會稽 commandery."
types: [campaign, founding]
date:
  value: "222 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十五年（降越君，置會稽郡）; 始皇帝二十五年（置會稽郡）"
  cite:
    - says: "The annals record the settling of the lands south of the Yangzi, the submission of the lord of 越, and the commandery in 二十五年 (222 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十五年（置會稽郡）"
      quote: "王翦遂定荊江南地；降越君，置會稽郡。"
    - says: "The comprehensive mirror records the lords of the 百越 submitting."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十五年（王翦悉定荊江南地）"
      quote: "王翦悉定荊江南地，降百越之君，置會稽郡。"
places:
  - place: kuaiji-jun
    role: site
    note: "The commandery set up; its extent is not asserted."
participants:
  - actor: wang-jian
    role: leader
  - actor: chu-state
    role: subject
    note: "The former Chu lands."
notes: "The annals say the lord of 越 (越君), the mirror the lords of the 百越; the record keeps both. The biography of 王翦 adds that he went on south against the lords of the 百越."
