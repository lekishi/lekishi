# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Sailing west to the wooded promontory of Soloeis, the fleet founds a sanctuary of Poseidon there."
types: [founding]
part_of: [hanno-voyage]
date:
  value: 570 BCE..470 BCE
  mode: window
  calendar: julian
  as_written: "ἔνθα Ποσειδῶνος ἱερὸν ἱδρυσάμενοι"
  cite:
    - id: soloeis-sanctuary-time
      says: "The account dates none of its stages; this one belongs to the undated voyage, whose window the cited commentators set between about 570 and 470 BCE."
      basis: interpretation
      attributed_to: W. H. Schoff (1913); J. Bostock and H. T. Riley (1855)
      sources:
        - source: hanno-periplus
          at: "3–4"
        - source: schoff-hanno
          at: Carthaginian Chronology
places:
  - place: soloeis
    role: site
participants:
  - actor: hanno
    role: leader
notes: "The Greek ἱερόν is a sanctuary; Schoff's translation says an altar to Neptune. Religion is the interaction here, not conquest."
cite:
  - id: soloeis-sanctuary-account
    says: "The account says the fleet came west to Soloeis and founded a sanctuary of Poseidon there; Schoff translates it as an altar to Neptune."
    source: hanno-periplus
    at: "3–4"
    quote: "Ἔνθα Ποσειδῶνος ἱερὸν ἱδρυσάμενοι πάλιν ἐπέβημεν πρὸς ἥλιον ἀνίσχοντα"
