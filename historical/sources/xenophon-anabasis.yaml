notes:
  Xenophon's own account of the march of Cyrus the Younger's Greek mercenaries inland in 401 BCE,
  the battle of Cunaxa, and the retreat to the Black Sea and Thrace until 399 BCE. It gives the
  march stage by stage with distances in parasangs and halts in days, the closest thing to an
  attested itinerary the period has, but no absolute dates; the years are modern scholarship's.
