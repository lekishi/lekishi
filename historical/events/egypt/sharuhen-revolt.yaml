# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Before the campaign, by the annals' account, the Asiatics have fallen into strife and the people
  of Sharuhen, from Yeraza to "the marshes of the earth", have begun to revolt against the king.
types: [occurrence]
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: Now, at that period (before year 22, IV Peret 25)
places:
  - place: sharuhen
    role: site
  - place: yeraza
    role: context
participants:
  - actor: egypt-new-kingdom
    role: subject
cite:
  - id: sharuhen-revolt-basis
    says: The annals describe the disagreement among the Asiatics and the revolt from Sharuhen.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the revolt (Sharuhen)"
    quote:
      Now, at that period the Asiatics had fallen into disagreement, each man fighting against his
      neighbor. Now, it happened that the tribes - the people, who were there in the city of Sharuhen; behold,
      from Yeraza to the marshes of the earth, they had begun to revolt against his majesty.
notes:
  The passage is damaged and Breasted's rendering is tentative. The annals date by regnal year and
  the civil calendar, and the conversion to a BCE year depends on which chronology of the Eighteenth Dynasty
  is used. The window spans the dates usually given for year 23 of Thutmose III, from about 1482 BCE (a
  higher chronology) to about 1457 BCE (the lower one most used today); Breasted's own 1906 table is within
  it. It is an editorial bound that a cited chronology must replace before approval.
