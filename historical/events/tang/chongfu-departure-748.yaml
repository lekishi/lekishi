summary: In the spring of 天寶七載 榮叡 and 普照 come from 同安郡 to 鑒眞 at 崇福寺, and a ship and supplies are prepared as in 天寶二載. Fourteen monks and lay followers, eighteen sailors and others, thirty-five in all, leave 崇福寺 on the twenty-seventh day of the sixth month and board at 揚州's 新河.
