summary: >-
  Devānaṃpiya Tissa, king of Lanka in the Ceylon chronicles, Aśoka's ally though they never met, who exchanges
  embassies with him and receives Mahinda's mission.
types: [person]
names:
  - form: Devânampiya Tissa
    lang: pi
    script: Latn
    cite:
      - id: devanampiya-tissa-name
        says: >-
          Smith's retelling says Devānampiya Tissa ascended the throne of Ceylon in the year of the Third
          Council.
        source: smith-asoka-1920
        at: ch. VI, The Ceylonese Legend of Asoka
        quote: King Devânampiya Tissa (Tishya) ascended the throne of Ceylon
roles:
  - role: ruler
