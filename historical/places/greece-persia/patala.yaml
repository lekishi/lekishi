summary:
  Patala at the head of the Indus delta, which Alexander found deserted in 325 BCE and made the
  base for exploring the river's mouths.
types: [settlement]
names:
  - form: Πάταλα
    lang: grc
    script: Grek
    roman: Patala
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: patala-greek-name
        says: Pleiades records the ancient Greek name Πάταλα for this place.
        source: pleiades
        at: place 59987, name /places/59987/patala, dump 2026-10-21
      - id: patala-name
        says: Arrian records Alexander finding Patala deserted.
        source: arrian-anabasis
        at: VI.17
        quote:
          and when he arrived at Patala, he found both the country and the city deserted by the inhabitants
          and tillers of the soil.
        role: supporting
