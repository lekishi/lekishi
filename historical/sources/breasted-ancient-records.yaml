notes: Breasted's translations of the royal inscriptions. The Karnak annals of Thutmose III give the
  first campaign day by day in regnal years and civil-calendar months, from Tharu through Gaza,
  Yehem and the Aruna road to the battle and siege of Megiddo, with the booty lists. The annals
  say the daily record was kept on a leather roll in the temple of Amun.
