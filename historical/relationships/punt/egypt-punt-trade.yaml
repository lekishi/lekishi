# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  Trade between Egypt and Punt in incense, myrrh, ebony, ivory, gold and animals, renewed directly
  by Hatshepsut's expedition after centuries in which the goods came through intermediaries.
types: [trade]
from: egypt-new-kingdom
to: people-of-punt
directionality: mutual
date:
  value: 1505 BCE..1458 BCE
  mode: window
  calendar: regnal
  as_written: the queen's reign
cite:
  - id: egypt-punt-trade-basis
    says: Maspero says the relations with the aromatic regions had been suspended for centuries.
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the incense trade"
    quote:
      But the relations maintained in former times with the people of these aromatic regions had been
      suspended for centuries.
notes:
  "The relationship covers the trade the expedition renewed; the older contacts of the Old and Middle
  Kingdoms are not dated here. Maspero gives no regnal year for the expedition, only that Hatshepsut reigned
  at least eight years after it. Her reign converts to BCE according to the chronology used: its start
  is put between about 1505 and 1479 BCE and its end between about 1483 and 1458 BCE. The window spans
  her reign in those placements. It is an editorial bound that a cited chronology must replace before
  approval."
