# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Stephen crosses the Alps by mons Iovis, the Great St Bernard, and reaches the Frankish passes,
  giving thanks once he is inside them.
types: [journey]
part_of: [stephen-journey-753]
date:
  value: 753-11-15..754-01-06
  mode: window
  calendar: julian
  as_written: jam monte Jovis transmeato
  cite:
    - id: great-st-bernard-crossing-753-time
      says: Neither source dates the crossing; it falls between the departure from Pavia and the meeting at Ponthion.
      source: liber-pontificalis
      at: Unde et cum nimia celeritate Deo praevio, ad Francorum coniunxit clusas. Quas ingressus … confestim laudes omnipotenti Deo reddidit
places:
  - place: great-st-bernard-pass
    role: waypoint
participants:
  - actor: stephen-ii
    role: leader
cites:
  places:
    - id: great-st-bernard-crossing-753-place
      says: The continuations of Fredegar report the news reaching Pepin that the pope, having already crossed mons Iovis, was hastening to him.
      source: fredegar-continuations
      at: CXIX
      quote: quod Stephanus papa de partibus Romae cum magno apparatu et multis muneribus, jam monte Jovis transmeato, ad ejus properaret adventum
notes:
  The life names no pass, only the Frankish clusae; the continuations name mons Iovis, which the
  place record identifies with the Great St Bernard. The crossing is a stop on the way, not a dated
  day.
