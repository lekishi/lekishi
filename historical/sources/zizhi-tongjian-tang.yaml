notes:
  "The Song comprehensive mirror's Tang annals for 天寶三載 to 乾元二年 (744–759). The chapter uses it for
  the dated notices: 和義公主's marriage, 高仙芝's 石國 raid and his presentation of captives, the battle
  at 恆羅斯城 and 李嗣業's retreat, 高仙芝's execution, the western troops of 至德二載, the 香積寺 battle,
  the 廣州 report of 乾元元年, and 李嗣業's death. A notice's month is the month heading it is entered
  under; the mirror sometimes gathers a frontier episode under the month its report arrived, so the
  chapter dates such notices to the year."
