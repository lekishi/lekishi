# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Pselchis, the Ethiopian town in Lower Nubia to which Petronius drove the invaders back and which
  he then took, by Strabo's account; Pliny lists it first among the towns taken.
types: [settlement]
names:
  - form: Ψελχίς
    lang: grc
    script: Grek
    roman: Pselchis
    scheme: other
    cite:
      - id: pselchis-name
        says:
          Strabo names Pselchis as the Ethiopian city to which Petronius first compelled the invaders
          to retreat.
        source: strabo-geography
        at: XVII.1.54 (C819–821)
        quote:
          Petronius, marching with less than 10,000 infantry and 800 horse against an army of 30,000
          men, first compelled them to retreat to Pselchis, an Ethiopian city.
  - form: Pselcis
    lang: la
    script: Latn
    note: Pliny's spelling.
    cite:
      - id: pselchis-pliny-name
        says: Pliny lists Pselcis first among the towns Petronius took.
        source: pliny-natural-history
        at: VI.35 (§181)
        quote:
          That general took the following cities, the only ones we now find mentioned there, in the following
          order; Pselcis, Primis, Abuncis, Phthuris, Cambusis, Atteva, and Stadasis
at:
  - interpretation: approximate_point
    precision: site
    point: [32.74935, 23.19571]
    notes:
      Pleiades' representative point, taken from the Barrington Atlas. The site of Dakka was moved
      or flooded by Lake Nasser; the point keeps the ancient location.
    cite:
      - id: pselchis-identification
        says:
          Pleiades places Pselchis (Barrington Atlas 81 C2) at the site of modern Dakka in Lower Nubia
          and gives this representative point (CC BY 3.0).
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 795846 (reprLatLong, version 14), dump 2026-10-21
external_ids:
  - system: pleiades
    id: "795846"
    url: https://pleiades.stoa.org/places/795846
    license: CC-BY-3.0
