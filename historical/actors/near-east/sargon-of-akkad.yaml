# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Sargon (Sharru-kin) of Akkad, king of Agade, whose own inscriptions say Enlil gave him the lands
  from the Upper Sea to the Lower Sea, and whom later chronicles and legend made the model conqueror.
  Scholars of 1906–1918 disagreed on who he was and when he reigned.
types: [person]
names:
  - form: Sargon
    lang: en
    script: Latn
    cite:
      - id: sargon-of-akkad-name
        says: King names the early Babylonian king Sharru-kin, or Sargon of Akkad.
        source: king-legends-babylon-egypt
        at: Lecture I
        quote: the early Babylonian king Sharru-kin, or Sargon of Akkad
  - form: Sharru-kin
    lang: akk
    script: Latn
    note: The Akkadian name as King writes it in 1918.
    claim: sargon-of-akkad-name
  - form: Sargina
    lang: en
    script: Latn
    note: Smith's 1880 reading of the name.
    cite:
      - says: The legend opens with the king naming himself Sargina, king of Agané.
        source: smith-chaldean-genesis
        at: chapter XVII (the Legend of Sargon), line 1
        quote: Sargina the powerful king the king of Agané am I.
roles:
  - role: ruler
    note:
      King of Agade (Akkad); the reign's dates depend on the chronology, which the reign event records
      as a dispute.
    cite:
      says: The chronicle calls Sargon king of Agade.
      source: livius-abc-20
      at: tablet A, line 1
cite:
  - says: King quotes Sargon's own inscriptions, copied at Nippur from his statues.
    source: king-legends-babylon-egypt
    at: Lecture I
    quote: One of the recently published Nippur inscriptions contains copies of a number of his texts
  - says:
      King in 1910 held that the later texts gave Shar-Gani-sharri the name of Sharru-Gi of Kish, so
      that the traditional Sargon's deeds were Shar-Gani-sharri's.
    role: conflicting
    basis: interpretation
    attributed_to: L. W. King (1910)
    source: king-sumer-akkad
    at: chapter VIII (the empire of Akkad)
    quote: in the later texts Shar-Gani-sharri has adopted Sharru-Gi's name, but nothing more
  - says: King and Hall in 1906 identified the Shargani-shar-ali of a mace-head with Sargon, king of Agade.
    role: alternative
    basis: interpretation
    attributed_to: L. W. King and H. R. Hall (1906)
    source: king-hall-history
    at: chapter I (prehistoric Egypt)
    quote: Shargani-shar-ali (i.e. Sargon, King of Agade)
dispute:
  status: disputed
  summary:
    Who Sargon was. King and Hall (1906) took the Shargani-shar-ali of the inscriptions to be Sargon;
    King (1910) argued that the traditional Sargon was Shar-Gani-sharri carrying the name of an earlier
    king of Kish, Sharru-Gi; by 1918 King quotes Sargon's own inscriptions as Sharru-kin's. The chapter
    follows the 1918 reading and keeps the earlier ones as claims.
notes:
  The deeds of the later tradition (chronicle, omens and legend) are recorded as what those texts
  say. Shar-Gani-sharri is not a separate actor here.
