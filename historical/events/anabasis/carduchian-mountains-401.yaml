# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The Greeks leave the Tigris plain for the mountains of the Carduchians, who fight them through
  seven days of march to the Centrites.
types: [journey]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE
  mode: window
  calendar: julian
  as_written: the last seven days spent in traversing the country of the Carduchians
  cite:
    - id: carduchian-mountains-401-time
      says:
        Grote dates the Greeks' entry into Armenia, at the end of the Carduchian march, to December
        401 BCE.
      basis: interpretation
      attributed_to: George Grote
      sources:
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            It was about six months afterwards, in the month of September or October of the same year,
            that the battle of Kunaxa was fought
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: extremely cold at the season when they entered it,—December
places:
  - place: kardouchoi
    role: site
participants:
  - actor: cyreans
    role: participant
  - actor: carduchians
    role: participant
cites:
  summary:
    - id: carduchian-mountains-401-days
      says: Xenophon calls the seven days in the Carduchian country one long battle.
      source: xenophon-anabasis
      at: IV.3
      quote:
        seeing that the last seven days spent in traversing the country of the Carduchians had been
        one long continuous battle
