<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renderer spike · Rust + wgpu (wasm)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Cinzel:wght@600&display=swap">
<style>
  html,body{margin:0;height:100%;background:linear-gradient(#8fb9cf 0%,#c9dde6 38%,#dfe9ec 100%);overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lbl{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;pointer-events:none}
  .lbl b{display:block;font:500 15px "Noto Serif JP","Hiragino Mincho ProN",serif;color:#f3ead7;text-shadow:0 0 3px #0b1114,0 0 6px #0b1114,0 1px 0 #0b1114}
  .lbl i{display:block;font:600 8.5px "Cinzel",serif;letter-spacing:.16em;color:#b9af9c;font-style:normal;text-shadow:0 0 3px #0b1114,0 0 5px #0b1114}
  .lbl::after{content:"";display:block;width:1px;height:14px;margin:2px auto 0;background:rgba(243,234,215,.7)}
  .lbl.sea b{font:600 11px "Cinzel",serif;letter-spacing:.3em;color:#eaf4f7;opacity:.8} .lbl.sea::after{display:none}
  #stats{position:absolute;left:10px;top:10px;background:rgba(10,14,18,.8);color:#f3ead7;font:11px/1.5 ui-monospace,monospace;padding:8px 10px;border-radius:4px;border:1px solid rgba(210,169,79,.4);white-space:pre}
</style>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="stats">loading…</div>
<script type="module">
// Page glue for the Rust/wgpu probe: JS decodes the shared assets (browser
// image decoders are free), hands raw arrays to wasm, and exposes the same
// window.spike API the harness drives on the other spikes.
import init, { Probe } from "./pkg/lekishi_wgpu_probe.js"
const T0 = performance.now()
const [spec, HM] = await Promise.all([fetch("../shared/scene.json").then(r => r.json()), fetch("../shared/height.json").then(r => r.json())])
async function pixels(src) { const img = new Image(); img.src = src; await img.decode(); const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const x = c.getContext("2d"); x.drawImage(img, 0, 0); return { w: img.width, h: img.height, d: x.getImageData(0, 0, img.width, img.height).data } }
const [hm, tex] = await Promise.all([pixels("../shared/height.png"), pixels("../shared/terrain-color.jpg")])
const E = new Float32Array(hm.w * hm.h); for (let i = 0; i < E.length; i++) E[i] = hm.d[i * 4] * 256 + hm.d[i * 4 + 1] - 1000
const canvas = document.getElementById("c")
const dpr = Math.min(devicePixelRatio, 2)
function fit() { canvas.width = Math.round((canvas.clientWidth || innerWidth) * dpr); canvas.height = Math.round((canvas.clientHeight || innerHeight) * dpr) }
fit()
await init()
const probe = await new Probe(canvas, JSON.stringify(spec), JSON.stringify(HM), E, hm.w, hm.h, new Uint8Array(tex.d), tex.w, tex.h)
addEventListener("resize", () => { fit(); probe.resize(canvas.width, canvas.height); render() })

// ---- labels ----
const box = document.getElementById("labels"), els = spec.places.filter(p => p.name).map(p => { const e = document.createElement("div"); e.className = "lbl " + (p.kind === "sea" ? "sea" : ""); e.innerHTML = `<b>${p.name}</b>${p.rom ? `<i>${p.rom}</i>` : ""}`; box.appendChild(e); const w = probe.world(p.lon, p.lat); return { p, e, w } })
function placeLabels() { const w = canvas.clientWidth, h = canvas.clientHeight; for (const { p, e, w: pos } of els) { const [nx, ny, nz] = probe.project(pos[0], (p.kind === "sea" ? 0 : pos[1]) + (p.selected ? 6 : 3), pos[2]); e.style.left = ((nx + 1) / 2 * w) + "px"; e.style.top = ((1 - ny) / 2 * h) + "px"; e.style.display = nz < 1 ? "" : "none" } }

// ---- render, stats, API ----
let frameMs = 0, fps = 0, frames = 0, tAcc = 0, last = performance.now(), loadMs = 0, trees = probe.trees()
function render() { const t = performance.now(); probe.render(); frameMs = frameMs * 0.9 + (performance.now() - t) * 0.1; placeLabels() }
function loop() { const now = performance.now(); frames++; tAcc += now - last; last = now; if (tAcc >= 1000) { fps = frames * 1000 / tAcc; frames = 0; tAcc = 0; overlay() } render(); requestAnimationFrame(loop) }
const bundleKB = Math.round(((await (await fetch("./pkg/lekishi_wgpu_probe_bg.wasm", { method: "HEAD" })).headers.get("content-length") || 0) / 1024) + 68)
function stats() { return { fps: +fps.toFixed(1), frameMs: +frameMs.toFixed(2), drawCalls: probe.draw_calls(), triangles: probe.triangles(), memoryMB: performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null, loadMs, bundleKB, trees, houses: probe.houses(), engine: "wgpu 24 / wasm (WebGL2 backend)" } }
function overlay() { const s = stats(); document.getElementById("stats").textContent = `rust + wgpu 24 → wasm (WebGL2 backend)\nfps ${s.fps}  frame ${s.frameMs} ms\ndraw calls ${s.drawCalls}  tris ${s.triangles}\nmem ${s.memoryMB ?? "n/a"} MB  load ${s.loadMs} ms\nbundle ${s.bundleKB} KB  trees ${s.trees}  houses ${s.houses}` }
render(); loadMs = Math.round(performance.now() - T0); overlay(); loop()
window.spike = {
  ready: Promise.resolve(),
  orbit(t) { probe.orbit(t); render() },
  playhead(t) { probe.playhead(t); render() },
  setQuality(level) { trees = probe.set_quality(level === "phone"); render() },
  stats,
}
</script>
