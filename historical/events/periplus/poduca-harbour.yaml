# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Poduca, among the chief harbours of the east coast, where local ships coast to Damirica, single-log
  sangara sail, and great colandia make the voyage to Chryse and the Ganges.
types: [exchange]
part_of: [periplus-voyage]
date:
  value: 58..62
  mode: window
  calendar: julian
  as_written: no date; the text speaks of the present
  cite:
    - id: poduca-harbour-time
      says:
        The Periplus describes this as present at the time of the voyage it was written from, which
        it does not date; Schoff puts that voyage between the summers of 58 and 62 CE.
      basis: interpretation
      attributed_to: W. H. Schoff (1912)
      sources:
        - source: periplus-erythraean-sea
          at: "60"
        - source: schoff-periplus
          at: Date and Authorship of the Periplus
places:
  - place: poduca
    role: site
cite:
  - id: poduca-harbour-account
    says: The Periplus says the very large ships that sail to Chryse and the Ganges are called colandia.
    source: periplus-erythraean-sea
    at: "60"
    quote:
      but those which make the voyage to Chryse and to the Ganges are called colandia, and are very
      large.
