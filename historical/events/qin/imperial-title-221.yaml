# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Having first united the realm in 221 BCE, the king of Qin ordered his ministers to discuss a new title. The chancellor 綰, the grand secretary 劫 and the chief of justice 斯 proposed 泰皇; the king took 皇 and the ancient 帝 and was called 皇帝, abolished posthumous names, and made himself the First Emperor, his heirs to be numbered to the ten-thousandth generation."
types: [council]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（秦王初并天下）; 秦始皇二十六年（初并天下，立為皇帝）; 始皇帝二十六年（乃更號曰皇帝）"
  cite:
    - says: "The annals record the order to discuss the title and the choice of 皇帝 after the first unification in 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（號曰皇帝）"
      quote: "王曰：「去『泰』，著『皇』，采上古『帝』位號，號曰『皇帝』；他如議。」"
    - says: "The six-states table records the unification and the title under 秦始皇二十六年."
      role: supporting
      source: shiji
      at: "卷十五 六國年表 秦始皇二十六年（初并天下，立為皇帝）"
      quote: "二十六。王賁擊齊，虜王建。初并天下，立為皇帝。"
    - says: "The comprehensive mirror records the new title under 始皇帝二十六年."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十六年（乃更號曰皇帝）"
      quote: "王初并天下，自以為德兼三皇，功過五帝，乃更號曰「皇帝」"
places:
  - place: xianyang
    role: other
    note: "The sources name no place for the debate; it is shown at the capital as a display placement that asserts no site."
participants:
  - actor: qin-king-zheng
    role: leader
  - actor: wang-wan
    role: participant
  - actor: li-si
    role: participant
notes: "The annals' edict justifies each conquest by a broken agreement, state by state; the chapter records that justification as the edict's, not as a cause. The grand secretary 劫 is named in the edict only and has no actor record."
cite:
  - says: "The annals record the proposal of 泰皇 by 綰, 劫 and 斯."
    role: supporting
    source: shiji
    at: "卷六 秦始皇本紀 二十六年（丞相綰、御史大夫劫、廷尉斯等皆曰）"
    quote: "丞相綰、御史大夫劫、廷尉斯等皆曰"
