# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The Greeks reach the sea at Trapezus, sacrifice their vowed thank-offerings, hold games on the
  hillside, and stay about thirty days raiding the Colchians.
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 400 BCE
  mode: window
  calendar: julian
  as_written: Here they halted about thirty days
  cite:
    - id: trapezus-400-time
      says:
        Grote dates the sight of the sea, two stages before Trapezus, to the first half of February
        400 BCE.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: IV.8
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: in the first half of February, the time of Xenophon’s visit
    - id: trapezus-400-text
      says: Xenophon records the thirty-day halt.
      source: xenophon-anabasis
      at: IV.8
      quote: Here they halted about thirty days in the villages of the Colchians
      role: supporting
places:
  - place: trapezus
    role: site
participants:
  - actor: cyreans
    role: participant
cites:
  summary:
    - id: trapezus-400-games
      says: Xenophon records the games at Trapezus.
      source: xenophon-anabasis
      at: IV.8
      quote: They instituted also a gymnastic contest on the mountain side, just where they were quartered
  places:
    - id: trapezus-400-place
      says: Xenophon records the arrival at Trapezus.
      source: xenophon-anabasis
      at: IV.8
      quote: and reached the sea at Trapezus
