# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  高闕, the gap in the mountains north of the river bend that the Qin had made a frontier post, through
  which 衛青 rode against the 右賢王 in 124 BCE. Its site is not fixed by the sources cited here.
types: [fortification]
names:
  - form: 高闕
    lang: lzh
    script: Hani
    roman: Gaoque
    scheme: pinyin
    cite:
      - id: gaoque-name
        says: The 漢書 annals record the 大將軍 衛青 leading six generals out of 朔方 and 高闕 in 元朔五年.
        source: hanshu
        at: 卷六 武帝紀 元朔五年
        quote: 大將軍衛青將六將軍兵十餘萬人出朔方、高闕
at:
  - interpretation: unknown
    precision: unspecified
    notes: The pass is placed in the 陰山 or 狼山 range in modern scholarship, which is not cited here; no position is asserted.
    cite:
      - id: gaoque-unplaced
        says: The cited entry names 高闕 and states no site for it, so no position is asserted.
        source: hanshu
        at: 卷六 武帝紀 元朔五年
