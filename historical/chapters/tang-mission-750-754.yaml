    - japan-tang-embassy: The diplomatic mission from Japan to Tang
    - kibi-appointment-751: 吉備真備 is appointed vice-envoy, 751
    - court-audience-752: The envoys pay court, 752
    - sekito-752: The 節刀 grant and promotions, 752
    - tang-new-year-audience-753: The Tang New Year audience at 蓬萊宮含元殿, 753
