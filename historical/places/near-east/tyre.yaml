# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Tyre, the Phoenician island city that refused Alexander entry and fell to him in 332 BCE after
  a seven-month siege and the building of a mole from the mainland.
types: [settlement, port]
names:
  - form: Τύρος
    lang: grc
    script: Grek
    roman: Tyre
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: tyre-greek-name
        says: Pleiades records the ancient Greek name Τύρος for this place.
        source: pleiades
        at: place 678437, name /places/678437/tyros, dump 2026-10-21
      - id: tyre-name
        says: Arrian records the capture of Tyre.
        source: arrian-anabasis
        at: II.24
        quote: Thus then was Tyre captured in the month Hecatombaion, when Anicetus was archon at Athens.
        role: supporting
  - form: Tyre
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: tyre-name
at:
