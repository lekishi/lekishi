# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  蘇州黃泗浦, the place from which the four ships put to sea on 天寶十二載十一月十五日 (753), named in the
  biography as 蘇州黃泗浦. Its excavators identify it with the 黃泗浦遺址 at 張家港; the anchorage the
  ships left from is not located within the site.
types: [port]
names:
  - form: 蘇州黃泗浦
    lang: lzh
    script: Hani
    roman: Suzhou Huangsipu
    scheme: pinyin
    cite:
      - id: huangsipu-name
        says: The biography names 蘇州黃泗浦 as the place the four ships left on 天寶十二載十一月十五日.
        source: toseiden
        at: 十一月十五日壬子，四舟同發
  - form: 黃泗浦
    lang: lzh
    script: Hani
    claim: huangsipu-name
at:
  - interpretation: approximate_point
    precision: locality
    point: [120.61228, 31.85329]
    notes:
      An approximate placement at the 黃泗浦遺址 in 張家港, the excavated port settlement its excavators
      identify with the biography's 黃泗浦. The identification is a modern archaeological one, not a
      source statement, and the point marks the site, not the anchorage the ships left from.
    cite:
      - id: huangsipu-identification
        says:
          The excavators of the 黃泗浦遺址 (南京博物院, from 2008) identified it, after the artificial ancient
          waterway was uncovered in 2018 and compared with the written sources, as the place in the
          biography from which 鑒眞's sixth crossing set out. The point is the site's modern coordinate
          from Wikidata (CC0).
        basis: interpretation
        attributed_to: 南京博物院考古研究所 (林留根, 周润垦)
        sources:
          - source: chinanews-huangsipu-2019
            at: 第7段
          - source: wikidata
            at: Q133305745 (P625), revision 2328693819
modern:
  - form: 張家港市
    lang: zh-Hans
    script: Hani
    note: The modern city in which the 黃泗浦遺址 lies, recorded for orientation.
notes: The name is a compound of prefecture and waterway. Both attested forms are recorded. The
  placement is the excavated site's, as its excavators identify it; until 2026-10-21 the record
  carried only a label anchor at central 蘇州.
