title: The march of the Ten Thousand
summary: In 401 BCE Cyrus the Younger led Greek mercenaries inland from Sardis to take his brother's
  throne and was killed at Kunaxa. Follow Xenophon's stage-by-stage account of the march up the
  Euphrates and the Greeks' retreat through the mountains and snow of Armenia to the Black Sea.
window: 401 BCE..399 BCE
story:
  summary: "The march of the Ten Thousand, 401–399 BCE, as Xenophon tells it in the Anabasis: Cyrus's
    march from Sardis to Babylonia, the battle and his death, the seizure of the generals, and the
    retreat north to Trapezus, along the Black Sea coast, and into Thrace and Spartan service."
  span: 401 BCE..399 BCE
  coverage: "Episode window 401–399 BCE, from Cyrus's departure from Sardis to Thibron taking the
    army into his forces at Pergamus. Included: each stage Xenophon describes with its halts, the
    reviews and the mutiny, the battle, the seizure of the generals and the election of new ones,
    the retreat through the Carduchian country and Armenia, the sea at Theches, the coastal march
    and voyage, Byzantium, and the service with Seuthes. Excluded: Cyrus's earlier career and the
    war at Miletus, the speeches, Xenophon's later life, and the war Thibron fought. No route
    geometry is drawn: the campaign event carries the span and its stages are separate events at
    their places. Places carry the Pleiades representative point as an approximate point; Peltae,
    Ceramon-agora, Caystru-pedion, Thymbrium, Thapsacus, Corsote, Charmande and Kunaxa are
    unlocated."
  notes: "Step order is presentation order and follows Xenophon's sequence. Xenophon gives distances
    in stages and parasangs and halts in days, but no years; every year and season here is George
    Grote's reckoning, cited as his interpretation, and most stages are dated only to the window
    between two of his anchors. This chapter is a draft for testing data and engine work, and has
    not been reviewed for publication."
