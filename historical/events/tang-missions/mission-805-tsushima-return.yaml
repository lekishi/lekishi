cites:
  summary:
    - id: mission-805-tibet
      says: The report says 吐蕃 lies five hundred 里 from 長安 and the capital has no rest from its fear.
      source: nihon-koki
      at: 卷第十二 延暦廿四年六月乙巳 藤原葛野麻呂奏
      quote: 今長安城。去吐蕃界五百里。内疑節度。外嫌吐蕃。京師騷動。
