    lang: es
    script: Latn
    cite:
      id: nazca-lines-name
      says:
        The nomination describes the lines and geoglyphs of Nasca and Pampas de Jumana in Peru's coastal
        desert over an area of 450 km².
      source: poverty-point-nomination
      at: PDF p. 130, 3.2 Comparative analysis (Nasca)
  - form: Nazca Lines
    lang: en
    script: Latn
    role: alternate
    cite:
      id: nazca-lines-name-alternate
      says: Wikidata labels the item Nazca Lines in English.
      source: wikidata
      at: Q2620036 (label, en), revision 2552547514
