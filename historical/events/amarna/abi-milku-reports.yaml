# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Abi-Milku of Tyre praises the king as the Sun rising over the earth and reports that Zimrida
  of Sidon passes every word from Egypt to Aziru.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1380 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
places:
  - place: tyre
    role: start
  - place: sidon
    role: context
participants:
  - actor: abi-milku
    role: leader
  - actor: zimrida-of-sidon
    role: subject
  - actor: aziru
    role: subject
cite:
  - id: abi-milku-zimrida
    says: Abi-milki reports Zimrida's daily reports to Aziru.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Abi-milki of Tyre"
notes:
  "Abi-Milku calls the king the son of the heavenly Sun-god (Aten), which puts the letter under Akhenaten.
  The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
