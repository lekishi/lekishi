# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Publius Cornelius Scipio the younger, son of the consul of 218 BCE, later called Africanus; Livy
  follows most authorities in crediting him with saving his wounded father at the Ticinus.
types: [person]
names:
  - form: Africanus
    lang: la
    script: Latn
    cite:
      - id: scipio-africanus-name-livy
        says: Livy says the young man who saved the consul is the one later called Africanus for his
          victory over Hannibal.
        source: livy
        at: "21.46.8"
        quote: Africanus ob egregiam victoriam de Hannibale Poenisque appellatus
notes: The chapter's only claim about him is the disputed rescue at the Ticinus; his later career is
  outside it.
