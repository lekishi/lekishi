# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Puduhepa, queen of Hatti, wife of Hattusili III, priestess from Kizzuwatna, whose seal with the
  sun-goddess of Arinna was on the reverse of the silver tablet and who corresponded with the Egyptian
  court.
types: [person]
names:
  - form: Putukhipa
    lang: en
    script: Latn
    note: Garstang's 1910 form; modern Puduhepa.
    cite:
      - id: puduhepa-name
        says: Garstang names Putukhipa, princess of Qizwadna, as Hattusil's queen.
        source: garstang-land-of-hittites
        at: "ch. VI, pp. 346–352: Hattusil and Putukhipa"
  - form: Puduhepa
    lang: en
    script: Latn
    role: alternate
    note: The modern form.
roles:
  - role: ruler
    note: Great queen of Hatti, who sealed the treaty with the king.
