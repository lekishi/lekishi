summary:
  縛喝, called the little 王舍城, with the 納縛伽藍 and its relics, where 玄奘 read the 毗婆沙論 with 般若羯羅 for
  more than a month.
types: [settlement]
names:
  - form: 縛喝
    lang: lzh
    script: Hani
    roman: Fuhe
    scheme: pinyin
    cite:
      - id: balkh-name
        says: The biography records the 設 naming 縛喝, north of the 縛芻河, called the little 王舍城.
        source: cien-zhuan
        at: 卷二（弟子所部有縛喝國）
        quote: 弟子所部有縛喝國，北臨縛芻河，人謂小王舍城
      - id: balkh-xiyu
        says: The 西域記 opens its account of the country with this sentence.
        role: supporting
        source: xiyu-ji
        at: 卷第一 縛喝國
        quote: 縛喝國。東西八百餘里。南北四百餘里。
