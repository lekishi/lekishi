# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  In 武乙's thirty-fourth year, the Bamboo Annals record, 季歷, the leader of 周, came to the 商 court,
  and the king gave him thirty li of land, ten pairs of jade and eight horses. It is the first
  recorded meeting of the two houses whose war ends this period.
types: [mission]
date:
  value: 1300 BCE..1046 BCE
  mode: window
  calendar: regnal
  as_written: 武乙 三十四年
  cite:
    - id: jili-visit-date
      says: >-
        The Bamboo Annals date the visit to 武乙's thirty-fourth year and give no absolute year. The
        window is the span of the 殷 capital under the 夏商周斷代工程's chronology.
      basis: interpretation
      attributed_to: 夏商周斷代工程《夏商周年表》(2000)
      source: ourchinastory-xszc-chronology
      at: paragraph 3
participants:
  - actor: zhou-ji-li
    role: guest
  - actor: wu-yi
    role: host
notes: >-
  The entry names no place. The Bamboo Annals record 武乙 living at 殷, but the record does not put
  the visit there, because the entry itself does not.
cite:
  - id: jili-visit-entry
    says: The Bamboo Annals record 季歷's visit to the court in 武乙's thirty-fourth year and the king's gifts.
    source: guben-zhushu-jinian
    at: 武乙 三十四年（周王季歷來朝）
    quote: 三十四年，周王季歴來朝，王賜地三十里，玉十珏，馬八匹。
