summary: The Pāṇḍyas of the far south, frontagers named in Rock Edicts II and XIII.
types: [state]
names:
  - form: Pandya
    lang: en
    script: Latn
    cite:
      - id: pandyas-name
        says: Smith's comment on Rock Edict II identifies the Pandya.
        source: smith-asoka-1920
        at: ch. IV, The Rock Edicts (comment on Rock Edict II)
        quote: >-
          The kingdom of the Pâṇḍyas corresponded roughly with the modern Madura and Tinnevelly Districts
notes: >-
  Recorded as a state because the edicts name them as kingdoms beyond the frontier; Smith is unsure whether
  some are peoples or countries.
