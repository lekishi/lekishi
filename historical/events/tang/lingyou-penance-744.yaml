summary: Sent back to his own temple in 揚州 under the commissioner's order that he not be let go abroad, 鑒眞 will not forgive 靈祐, who stands each night in penance for sixty days until the temple officers come together to apologize.
types: [occurrence]
date:
  value: 744..745
  mode: window
  calendar: chinese_lunisolar
  cite:
    - id: lingyou-penance-time
      says: The biography records the sixty days of penance after his return, without a date of its own.
      source: toseiden
      at: 其靈祐日日懺謝，［乞］歡喜，每夜一更立至五更謝罪。遂終六十日
places:
  - place: yangzhou
    role: site
participants:
  - actor: jianzhen
    role: subject
  - actor: lingyou
    role: participant
notes: The biography dates the lectures to 天寶三載 and gives no further year until 天寶七載, so this event is an occurrence window over 744–745 rather than a dated instant.
cites:
  summary:
    - id: lingyou-penance-order
      says: The biography records the commissioner's order to keep him at his own temple.
      source: toseiden
      at: 依舊令住本寺，約束三綱防護，曰︰「勿令更向他國。」
