# yaml-language-server: $schema=../../schema/event.schema.json
summary: "As Livy tells it, in the reign of Ancus Marcius the rich Lucumo, son of Demaratus of
  Corinth, could win no honour at Tarquinii and moved to Rome with his wife Tanaquil. At the
  Janiculum an eagle took his cap and set it back on his head, which Tanaquil read as an omen of
  greatness; in Rome he took the name Lucius Tarquinius Priscus."
types: [journey]
date:
  value: 639 BCE..615 BCE
  mode: window
  calendar: julian
  as_written: Anco regnante (Livy)
  cite:
    id: tarquinius-moves-reign
    says: Livy dates the move to the reign of Ancus Marcius; Dionysius dates Ancus's accession to
      639/638 BCE and Tarquinius's own to 615/614 BCE.
    basis: interpretation
    attributed_to: Lekishi editorial reckoning on Dionysius's Olympiad dates for the reigns
    sources:
      - source: livy
        at: "1.34.1"
        quote: "Anco regnante Lucumo, vir inpiger ac divitiis potens, Romam commigravit"
      - source: dionysius-roman-antiquities
        at: "3.46"
        quote: Tarquinius took over the sovereignty about the second year of the forty-first Olympiad
places:
  - place: tarquinii
    role: start
    cite:
      id: tarquinius-moves-start
      says: Livy tells that Lucumo, unhonoured at Tarquinii, resolved to leave it.
      source: livy
      at: "1.34.5"
      quote: "consilium migrandi ab Tarquiniis cepit."
  - place: rome
    role: end
    cite:
      id: tarquinius-moves-end
      says: Livy tells that they took up their goods and moved to Rome, and that at the Janiculum an
        eagle lifted his cap and set it back on his head.
      source: livy
      at: "1.34.7"
      quote: "sublatis itaque rebus amigrant Romam. ad Ianiculum forte ventum erat."
participants:
  - actor: tarquinius-priscus
    role: leader
notes: Tradition, not record. The tradition names the two ends and the Janiculum and no route; the
  chapter draws no line between them.
