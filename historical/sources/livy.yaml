notes:
  "Latin history of Rome from its founding, written under Augustus; the issued year is approximate.
  Books 21–30, on the war with Hannibal, date from the 20s BCE, about two centuries after the
  events. There Livy uses Polybius and the Roman annalists (he names Fabius Pictor, Cincius
  Alimentus, and Coelius Antipater) and often reports where they disagree, which the chapters keep.
  He dates by consular years and records Roman religious and political measures that Polybius
  omits. Book I, on the kings, was written about seven centuries after the dates it gives, from
  earlier annalists, and Livy says himself that the time before the founding is told in poets'
  tales; a chapter citing it labels it as tradition."
