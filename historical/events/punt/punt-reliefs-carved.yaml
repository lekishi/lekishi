# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "Hatshepsut has the story of the expedition carved on the west wall of the middle colonnade of
  her temple at Deir el-Bahari: the fleet under sail, the arrival, the meeting, the barter and the loading
  of the ships."
types: [other]
date:
  value: 1473 BCE..1458 BCE
  mode: window
  calendar: regnal
  as_written: after the return of the fleet
  cite:
    - id: punt-reliefs-carved-shaw
      says: On Shaw's chronology Hatshepsut reigned 1473–1458 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: deir-el-bahari
    role: site
participants:
  - actor: hatshepsut
    role: leader
cite:
  - id: reliefs-basis
    says:
      Maspero says the queen had the history of the expedition carved on the colonnade of her funerary
      chapel.
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the reliefs"
    quote:
      Hâtshopsîtû commanded the history of the expedition to be carved on the wall of the colonnades
      which lay on the west side of the middle platform of her funerary chapel
notes: "Kept because the reliefs are the record of the expedition. Maspero gives no regnal year for
  the expedition, only that Hatshepsut reigned at least eight years after it. The window is her
  reign on Shaw's chronology (The Oxford History of Ancient Egypt, 2000), 1473–1458 BCE."
