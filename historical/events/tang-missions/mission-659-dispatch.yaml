    role: site
    note:
      The entry names no place. A court act happens at the court, so the record anchors it at the court's
      seat for display only; it asserts no site for the act.
participants:
  - actor: sakaibe-no-iwashiki
    role: leader
    note: 大使.
  - actor: tsumori-no-kisa
    role: leader
    note: 副使 in 難波吉士男人書; leads the second ship.
  - actor: emishi
    role: subject
    note: Two 蝦夷 of 道奧 are taken to be shown to the emperor.
  - actor: japan-state
