# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  Hatti's overlordship of Amurru, broken by Amurru's revolt after Kadesh and restored by Hattusili
  III with Benteshina as vassal king.
types: [rulership]
from: hatti
to: amurru-kingdom
date:
  value: 1275 BCE..1258 BCE
  mode: window
  calendar: regnal
  as_written: after Kadesh, renewed under Hattusili III
  cite:
    - id: hatti-amurru-overlordship-shaw
      says: On Shaw's chronology Ramesses II reigned 1279–1213 BCE, so his year 5 falls in 1275–1274
        BCE and his year 21 in 1259–1258 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Nineteenth Dynasty"
cite:
  - id: hatti-amurru-basis
    says:
      Garstang says Hattusil reinstated Put-akhi as chief of the Amorites under the same terms of vassalage
      as before.
    source: garstang-land-of-hittites
    at: "ch. VI, pp. 346–352: Put-akhi restored, fn. 814"
notes: "Ramesses II's regnal years are converted on Shaw's chronology (The Oxford History of Ancient
  Egypt, 2000), which puts his reign at 1279–1213 BCE; each regnal year spans two BCE years.
  Garstang's 1910 dates (Kadesh 1288 B.C., the treaty about 1271 B.C.) and Sayce's 1890 dates (1383
  and 1354 B.C.) follow older schemes."
