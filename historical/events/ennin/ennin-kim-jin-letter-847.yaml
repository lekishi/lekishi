      says: The letter received on the 9th says the Japanese monks are thought to be at 赤山 in 登州 and that the writers mean to go there to take them aboard.
      source: nitto-guho-junrei-gyoki
      at: 卷四 會昌七年六月九日
      quote: 日本國僧人等。今在登州赤山。便擬往彼相取。
