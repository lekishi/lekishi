# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "Hatshepsut's expedition to Punt: five galleys sail down the Red Sea to the land of incense,
  trade with its people, and return to Thebes with myrrh and living incense trees for Amun."
types: [journey]
date:
  value: 1473 BCE..1458 BCE
  mode: window
  calendar: regnal
  as_written: later on, in the queen's reign
  cite:
    - id: punt-expedition-shaw
      says: On Shaw's chronology Hatshepsut reigned 1473–1458 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: red-sea
    role: context
  - place: punt
    role: end
  - place: thebes
    role: context
    note:
      The fleet returned to the temple landing at Thebes, which the return step records; the port it
      sailed from is unknown, so the expedition has no start.
participants:
  - actor: hatshepsut
    role: leader
  - actor: punt-royal-envoy
    role: leader
  - actor: egypt-new-kingdom
    role: participant
  - actor: people-of-punt
    role: participant
cite:
  - id: punt-expedition-basis
    says: Maspero says the queen sent five galleys under a royal envoy on the Red Sea for incense.
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the fleet"
    quote:
      Hâtshopsîtû chose out five well-built galleys, and manned them with picked crews. She caused
      them to be laden with such merchandise as would be most attractive to the barbarians, and placing
      the vessels under the command of a royal envoy
  - id: punt-expedition-after
    says: Maspero says Hatshepsut reigned at least eight years after the expedition.
    role: supporting
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: after the expedition"
    quote: Hâtshopsîtû reigned for at least eight years after this memorable expedition
notes: "An umbrella for the episodes. It draws no route: Maspero says the port of departure and the
  course are unrecorded. Maspero gives no regnal year for the expedition, only that Hatshepsut
  reigned at least eight years after it. The window is her reign on Shaw's chronology (The Oxford
  History of Ancient Egypt, 2000), 1473–1458 BCE."
