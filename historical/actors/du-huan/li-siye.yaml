# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  李嗣業 of 京兆高陵, the long-blade commander who cleared the road for 高仙芝's retreat after
  怛邏斯 in 751, led the van at 香積寺 in 757, and died of an arrow wound in the camp before 相州 in
  the first month of 乾元二年 (759).
types: [person]
names:
  - form: 李嗣業
    lang: lzh
    script: Hani
    roman: Li Siye
    scheme: pinyin
    cite:
      - id: li-siye-name
        says: His biography names him 李嗣業, courtesy name 嗣業, of 京兆高陵.
        source: xin-tangshu-tang-west
        at: 卷一三八 李嗣業傳（李嗣業，字嗣業）
        quote: 李嗣業，字嗣業，京兆高陵人。
roles:
  - role: soldier
    note: 右威衛將軍 at 怛邏斯 (the mirror); later 鎮西、北庭行營節度使.
    cite:
      - id: li-siye-role
        says: The mirror calls him 右威衛將軍 when he urged 高仙芝 to slip away by night.
        source: zizhi-tongjian-tang
        at: 卷二一六 唐紀三十二 天寶十載（右威衞將軍李嗣業勸仙芝宵遁）
        quote: 右威衞將軍李嗣業勸仙芝宵遁
