# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  After Kadesh the Amorites throw off their Hittite allegiance; their chief Benteshina is deposed
  but escapes punishment.
types: [occurrence]
date:
  value: 1300 BCE..1258 BCE
  mode: window
  calendar: regnal
  as_written: after the battle of Kadesh
participants:
  - actor: amurru-kingdom
    role: participant
  - actor: benteshina
    role: subject
  - actor: hatti
    role: participant
cite:
  - id: amurru-revolt-basis
    says:
      Garstang says the Amorites threw off their allegiance after Kadesh and their chief Put-akhi was
      deposed.
    source: garstang-land-of-hittites
    at: "ch. VI, pp. 343–346: the Amorites"
notes:
  "Garstang reads this from Winckler's first account of the Boghazköy tablets. The record has no
  place, since the sources name the land and not a city. Ramesses II's regnal years convert to BCE according
  to the chronology used: his accession is put at about 1304, 1290 or 1279 BCE (the low date most used
  today). The window spans those dates for the year in question. Garstang's 1910 dates (Kadesh 1288 B.C.,
  the treaty about 1271 B.C.) fall inside it; Sayce's 1890 dates (1383 and 1354 B.C.) follow an older
  scheme and fall outside. It is an editorial bound that a cited chronology must replace before approval."
