summary: Waiting on the 登州 coast for the crossing, 圓仁 shaves his head and puts on a monk's robes again, two years after laicization.
types: [occurrence]
date:
  value: 847-08-15
  calendar: chinese_lunisolar
  as_written: 會昌七年八月十五日
  cite:
    - id: ennin-robes-restored-847-time
      says: The diary records shaving his head and putting on black robes again on the 15th.
      source: nitto-guho-junrei-gyoki
      at: 卷四 會昌七年八月十五日
      quote: 十五日剃頭。再披緇服。
participants:
  - actor: ennin
    role: subject
notes: The ship had anchored on the 登州 coast on 七月廿一日; the diary does not name where it lay in the eighth month, so the event carries no place.
