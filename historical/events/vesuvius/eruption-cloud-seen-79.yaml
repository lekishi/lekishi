# yaml-language-server: $schema=../../schema/event.schema.json
summary: "At Misenum, at about the seventh hour, Pliny's mother points out to the elder Pliny a
  cloud of unusual size and shape rising across the bay, like an umbrella pine; it was later known
  to come from Vesuvius."
types: [occurrence]
date:
  value: "79-08-24"
  calendar: julian
  as_written: Nonum Kal. Septembres hora fere septima
  cite:
    - id: cloud-seen-day
      says: "Pliny tells that on the ninth day before the Kalends of September, at about the seventh
        hour, his mother showed his uncle the cloud."
      source: pliny-letters
      at: "6.16.4"
      quote: Nonum Kal. Septembres hora fere septima mater mea indicat ei apparere nubem inusitata et magnitudine et specie.
    - id: eruption-cloud-seen-79-year
      says: "Foster's translation of Dio dates the chapters on the eruption, by a sidenote, to A.D.
        79."
      basis: interpretation
      attributed_to: H. B. Foster (1906)
      role: supporting
      source: cassius-dio
      at: "LXVI.16 (A.D. 79), translator's sidenote"
      quote: A.D. 79 (a.u. 832)
    - id: eruption-cloud-seen-79-dio-autumn
      says: "Dio, in Foster's translation, says the fire began just at the end of autumn."
      role: conflicting
      source: cassius-dio
      at: LXVI.21 (A.D. 79)
      quote: A great fire was suddenly created just at the end of autumn.
places:
  - place: misenum
    role: site
  - place: vesuvius
    role: context
    note: The cloud rose from it.
participants:
  - actor: pliny-the-elder
    role: witness
  - actor: pliny-the-younger
    role: witness
cite:
  - id: cloud-pine
    says: "Pliny compares the cloud to an umbrella pine, rising on a long trunk and spreading into
      branches."
    source: pliny-letters
    at: "6.16.5"
    quote: cuius similitudinem et formam non alia magis arbor quam pinus expresserit.
notes: "Pliny the Younger's account, written about twenty-five years later for Tacitus; he was at
  Misenum, and tells his uncle's last hours from those who were with him. The year is an
  interpretation; Pliny gives the day and not the year."
dispute:
  status: disputed
  summary: "Pliny's letter gives the ninth day before the Kalends of September (24 August), and the
    chapter shows that day. Dio, in Foster's translation, puts the outbreak at the end of autumn;
    translators render the phrase differently, so whether Dio conflicts with Pliny turns on the
    Greek. Modern arguments for an autumn date from the finds at Pompeii are not cited here."
