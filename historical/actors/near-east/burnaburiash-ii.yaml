# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Burnaburiash II, Kassite king of Babylon after Kadashman-Enlil I, who complained to Akhenaten
  about thin gifts, the Assyrian embassy and the merchants robbed in Canaan.
types: [person]
names:
  - form: Burnaburiash
    lang: akk
    script: Latn
    cite:
      - id: burnaburiash-ii-name
        says: Niebuhr says Burnaburiash succeeded Kadashman-Bel about the time of Nimmuria's death.
        source: niebuhr-tell-el-amarna-period
        at: "ch. III: Burnaburiash"
        quote:
          About the time of Nimmuria's death Kadashman-Bel of Babylonia also died, and Burnaburiash,
          probably his brother or cousin, was prepared on his accession to maintain the traditional friendship
          with Egypt.
  - form: Burnaburiash II
    lang: en
    script: Latn
    role: alternate
    note: The modern form.
roles:
  - role: ruler
