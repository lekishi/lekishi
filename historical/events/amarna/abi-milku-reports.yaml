# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Abi-Milku of Tyre praises the king as the Sun rising over the earth and reports that Zimrida
  of Sidon passes every word from Egypt to Aziru.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1352 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
  cite:
    - id: abi-milku-reports-shaw
      says: On Shaw's chronology Amenhotep IV (Akhenaten) reigned 1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: tyre
    role: start
  - place: sidon
    role: context
participants:
  - actor: abi-milku
    role: leader
  - actor: zimrida-of-sidon
    role: subject
  - actor: aziru
    role: subject
cite:
  - id: abi-milku-zimrida
    says: Abi-milki reports Zimrida's daily reports to Aziru.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Abi-milki of Tyre"
notes: "Abi-Milku calls the king the son of the heavenly Sun-god (Aten), which puts the letter under
  Akhenaten. The letters are undated but for a few dockets. Their reigns follow Shaw's chronology
  (The Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV
  (Akhenaten) 1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built
  about 1380 B.C.) follow an older, higher scheme."
