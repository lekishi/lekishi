# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The weapons of the realm were gathered at 咸陽 and melted into bells, bell-stands and twelve bronze figures of a thousand 石 each, set up in the palace."
types: [other]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（收天下兵，聚之咸陽）; 秦始皇二十七年（為金人十二）"
  cite:
    - says: "The annals record the weapons gathered and melted after the unification of 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（收天下兵）"
      quote: "收天下兵，聚之咸陽，銷以為鐘鐻，金人十二，重各千石，置廷宮中。"
places:
  - place: xianyang
    role: site
    note: "Where the weapons were gathered."
participants:
  - actor: qin-state
    role: leader
notes: "An act of state with no place in the event vocabulary: it is neither a campaign nor a founding. 咸陽 is where the weapons were gathered; the palace the figures stood in is not located."
dispute:
  status: disputed
  summary: "The annals record the twelve figures after the unification of 二十六年 (221 BCE); the six-states table records them under 二十七 (220 BCE). The chapter publishes the annals' year and keeps the table's as a claim."
cite:
  - says: "The six-states table records the twelve figures under 秦始皇二十七年."
    role: conflicting
    source: shiji
    at: "卷十五 六國年表 秦始皇二十七年（為金人十二）"
    quote: "為金人十二。"
