notes: The Book of Changes. Its line statements are generally held to have been compiled in the
  Western 周 period; no issued year is given because none is relied on. The 既濟 hexagram's
  third line names 高宗's war on 鬼方, which the chapter cites as an early reference to that war, not as
  a chronicle of it.
