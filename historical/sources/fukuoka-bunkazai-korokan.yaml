notes:
  The city's entry for the national Historic Site 鴻臚館跡 at 福岡市中央区城内. It describes the 鴻臚館,
  called 筑紫館 before the Heian period, as the reception house for foreign envoys from the late
  Asuka to the late Heian period and the place where the 遣唐使, the 遣新羅使 and travelling monks made
  ready for the crossing; excavation from 1987 confirmed its location in the 福岡城 grounds. It is a
  modern site identification, not a source statement of the seventh to ninth centuries.
