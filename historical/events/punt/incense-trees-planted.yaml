# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The incense trees are planted in a sacred garden at Deir el-Bahari, in square pits cut in the
  rock and filled with earth. Naville found the pits with soil and roots still in them.
types: [occurrence]
part_of:
  - punt-expedition
date:
  value: 1473 BCE..1458 BCE
  mode: window
  calendar: regnal
  as_written: after the return of the fleet
  cite:
    - id: incense-trees-planted-shaw
      says: On Shaw's chronology Hatshepsut reigned 1473–1458 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: deir-el-bahari
    role: site
participants:
  - actor: hatshepsut
    role: leader
cite:
  - id: planted-basis
    says: Maspero says the trees were planted in a sacred garden at Deîr el-Baharî.
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the incense garden"
    quote:
      The trees were planted at Deîr el-Baharî, where a sacred garden was prepared for them, square
      trenches being cut in the rock and filled with earth, in which the sycomore, by frequent watering,
      came to flourish well.
  - id: planted-naville
    says: Maspero says Naville found the trenches still filled with mould and roots.
    role: supporting
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the incense garden, note"
    quote:
      Naville found these trenches still filled with vegetable mould, and in several of them roots,
      which gave every indication of the purpose to which the trenches were applied.
notes: "Maspero gives no regnal year for the expedition, only that Hatshepsut reigned at least eight
  years after it. The window is her reign on Shaw's chronology (The Oxford History of Ancient Egypt,
  2000), 1473–1458 BCE."
