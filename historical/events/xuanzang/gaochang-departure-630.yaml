summary:
  麹文泰 gives 玄奘 four novices, thirty robes, gold, silver and silk for twenty years, thirty horses
  and twenty-five men, and letters to twenty-four kingdoms and to the 葉護可汗; the whole city sees him off.
types: [journey, exchange]
date:
  value: 629..630
  mode: window
  calendar: chinese_lunisolar
  as_written: 發日，王與諸僧、大臣、百姓等傾都送出城西
  cite:
