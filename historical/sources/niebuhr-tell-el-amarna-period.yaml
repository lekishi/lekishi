  notes: Published in 1903, so public domain in the United States. Niebuhr died in 1927, but the
    English is the translation of Miss Jane Hutchison, whose dates are not recorded (Project
    Gutenberg and Wikisource give none), so its term in life-plus-70 countries is not established.
    Until her dates are found the records cite it without quotation. The letters are given in
    Niebuhr's paraphrasing translations, which follow Winckler's 1896 edition and are superseded in
    detail.
notes: A short popular account of the Amarna tablets, with long quotations from the letters of the
  kings of Babylon, Mitanni, Assyria and Alashiya and of the vassals of Syria and Canaan. It gives
  no tablet numbers beyond the British Museum edition's for a few letters, and its identifications
  (Alashiya in Cilicia, the Habiri as the Hebrews) are of its time.
