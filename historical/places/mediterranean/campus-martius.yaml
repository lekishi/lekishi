summary:
  The Campus Martius, the plain of Mars beside the Tiber, outside the early city. Livy tells that
  Servius Tullius assembled all the citizens there under arms to close the first census with a
  lustrum.
types: [landform]
names:
  - form: Campus Martius
    lang: la
    script: Latn
    cite:
      - id: campus-martius-name
        says:
          Livy tells that Servius ordered every Roman citizen, horse and foot, to assemble in the
          Campus Martius at first light.
        source: livy
        at: "1.44.1"
        quote: "in campo Martio prima luce adessent."
