# yaml-language-server: $schema=../../schema/place.schema.json
summary: 括州, the Tang prefecture five survivors of 石布's ship escaped to in 659.
types: [region]
names:
  - form: 括州
    lang: lzh
    script: Hani
    roman: Kuozhou
    scheme: pinyin
    cite:
      - id: kuozhou-name
        says: 伊吉博德's account says the five escaped in an islander's boat to 括州.
        source: nihon-shoki
        at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
        quote: 盜乘嶋人之船，逃到括州。
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [119.916667, 28.45]
    notes:
      Label anchor at the modern city of 麗水 (Wikidata Q58294). It is not an asserted historical coordinate.
      括州 was later renamed 處州; the modern seat is 麗水.
    cite:
      - id: kuozhou-anchor
        says:
          The label anchor is placed at the coordinate recorded in Wikidata (CC0); no historical coordinate
          is asserted.
        source: wikidata
        at: Q58294 (P625), revision 2526612704
modern:
  - form: 麗水市
    lang: zh
    script: Hani
    note: Modern name recorded for orientation; the cited passages do not state a site identification.
