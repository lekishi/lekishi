# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The peoples who fought with the Hittite king at Kadesh, among them, in the poem's list, Masu,
  Keshkesh, Pidasa, Malunna, Arathu, Qazauadana, Kadesh, Akerith, Leka and Khilibu (Aleppo).
types: [community]
names:
  - form: the Hittites and their helpers
    lang: en
    script: Latn
    cite:
      - id: hittite-allies-name
        says: The poem lists the peoples who ringed Pharaoh in.
        source: petrie-victory-of-ramses
        at: the stanza "Then the king he lashed each horse"
        quote:
          And the flower of the Hittites, and their helpers, in a ring--- Men of Masu, Keshkesh, Pidasa,
          Malunna, Arathu, Qazauadana, Kadesh, Akerith, Leka and Khilibu--- Cut off the way behind
notes:
  A coalition named by the Egyptian poem. Which Anatolian lands the names stand for is argued; Sayce
  and Garstang read them as Mysians, Dardanians, Lycians and others.
