# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Each time Qin destroyed a state, the annals record, it had the state's palaces copied and built on the slope north of 咸陽 overlooking the 渭, filled with the women, bells and drums taken from the conquered courts."
types: [process]
date:
  value: "230 BCE..221 BCE"
  mode: duration
  calendar: chinese_lunisolar
  as_written: "秦每破諸侯 (each time Qin destroyed a state)"
  cite:
    - says: "The annals record the copying of each conquered state's palaces, in the account of 二十六年 (221 BCE), as a practice of each conquest."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（秦每破諸侯，寫放其宮室）"
      quote: "秦每破諸侯，寫放其宮室，作之咸陽北阪上，南臨渭，自雍門以東至涇、渭，殿屋複道周閣相屬。所得諸侯美人鐘鼓，以充入之。"
places:
  - place: xianyang
    role: site
    note: "The slope north of the capital; no site is asserted."
participants:
  - actor: qin-state
    role: leader
notes: "The notice describes a practice across the conquests, not a dated act, so the event spans the conquest years 230–221 BCE as a duration; the chapter does not date any single palace. The historical geography repeats the account under its 咸陽 entry."
