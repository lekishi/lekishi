    lang: grc
    script: Grek
    roman: Sestos
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: sestos-greek-name
        says: Pleiades records the ancient Greek name Σηστός for this place.
        source: pleiades
        at: place 501609, name /places/501609/sestos, dump 2026-10-21
      - id: sestos-name
        says: Herodotus places the bridgehead on the foreland between Sestos and Madytos, opposite Abydos.
        source: herodotus
        at: VII.33
        quote:
          Now there is in the Chersonese of the Hellespont between the city of Sestos and Madytos, a
          broad foreland running down into the sea right opposite Abydos
        role: supporting
