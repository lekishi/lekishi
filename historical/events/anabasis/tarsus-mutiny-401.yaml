# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At Tarsus the army halts twenty days; the Greeks, suspecting that the march is against the king,
  refuse to go further until Clearchus brings them round and Cyrus raises their pay.
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE
  mode: window
  calendar: julian
  as_written: At Tarsus Cyrus and his army halted for twenty days
  cite:
    - id: tarsus-mutiny-401-time
      says:
        Grote dates the start of the march from Sardis to about March or April 401 BCE and the battle
        of Kunaxa to about September or October of the same year; the stage falls between them.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: I.3
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote: was commenced about March or April in the year 401 B.C.
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            It was about six months afterwards, in the month of September or October of the same year,
            that the battle of Kunaxa was fought
    - id: tarsus-mutiny-401-text
      says: Xenophon records the twenty-day halt at Tarsus.
      source: xenophon-anabasis
      at: I.3
      quote: At Tarsus Cyrus and his army halted for twenty days
      role: supporting
places:
  - place: tarsus
    role: site
participants:
  - actor: cyreans
    role: participant
  - actor: clearchus
    role: leader
  - actor: cyrus-the-younger
    role: participant
cites:
  summary:
    - id: tarsus-mutiny-401-refusal
      says:
        Xenophon records the soldiers refusing to go further because they suspected the march was against
        the king.
      source: xenophon-anabasis
      at: I.3
      quote:
        the soldiers refusing to advance further, since the suspicion ripened in their minds, that
        the expedition was in reality directed against the king
