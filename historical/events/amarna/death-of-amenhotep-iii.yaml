# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Amenhotep III dies. Tushratta writes that he wept that day and touched neither food nor drink,
  and sends Pirizzi and Bubri to Akhenaten to convey his grief.
types: [occurrence]
date:
  value: 1380 BCE..1350 BCE
  mode: window
  calendar: regnal
  as_written: the end of the reign of Amenophis III
participants:
  - actor: amenhotep-iii
    role: subject
  - actor: tushratta
    role: witness
  - actor: pirizzi
    role: participant
cite:
  - id: mourning-basis
    says: Niebuhr quotes Tushratta's description of his grief.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the death of Nimmuria"
  - id: mourning-envoys
    says: Niebuhr says Tushratta sent Pirizzi and Bubri with lamentations to Napkhuria.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Pirizzi and Bubri"
notes:
  "The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
