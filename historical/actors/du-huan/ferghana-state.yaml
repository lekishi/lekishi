# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  拔汗那, renamed 寧遠 by the Tang court in 天寶三載, whose king 阿悉爛達干 married the Tang princess
  和義公主. Its troops were on the road during the 751 retreat, and in 757 its soldiers came east with
  the western contingents.
types: [state]
names:
  - form: 拔汗那
    lang: lzh
    script: Hani
    roman: Bahanna
    scheme: pinyin
    cite:
      - id: ferghana-state-name
        says: The mirror records 拔汗那 troops blocking the road of the retreat in 751.
        source: zizhi-tongjian-tang
        at: 卷二一六 唐紀三十二 天寶十載（拔汗那部衆在前）
        quote: 道路阻隘，拔汗那部衆在前，人畜塞路
  - form: 寧遠
    lang: lzh
    script: Hani
    cite:
      - id: ferghana-state-ningyuan
        says: The western-regions entry records the Tang court renaming the kingdom 寧遠 in 天寶三載.
        source: xin-tangshu-tang-west
        at: 卷二二一下 西域下 寧遠（天寶三載，改其國號寧遠）
        quote: 天寶三載，改其國號寧遠，帝以外家姓賜其王曰竇，又封宗室女為和義公主降之。
notes: The kingdom is an actor; the land is the place record 拔汗那.
