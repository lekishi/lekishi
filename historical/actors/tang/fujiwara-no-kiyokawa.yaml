notes: The 779 notice is a report made about twenty-five years after the voyage and is published as
  such. No birth or death year is asserted; the notice only says he died in Tang after more than ten
  years.
cites:
  summary:
    - id: kiyokawa-fate
      says:
        The chronicle's 寶龜十年二月 notice records that 清河's ship was driven to 驩州 on the return, that he
        alone survived, and that he remained in Tang and died there more than ten years later.
      source: shoku-nihongi
      at: 卷第卅五 寶龜十年二月乙亥
