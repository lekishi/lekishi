      says: The biography names 祥彥, 道興, 德清, 榮叡, 普照 and 思託 among seventeen monks, with eighty-five artisans, on the one ship.
      source: toseiden
      at: 僧祥彥、道興、德清、榮叡、普照、思託等一十七人
