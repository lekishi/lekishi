notes:
  The entry describes 出羽国 as the old province covering present-day Yamagata Prefecture and Akita
  Prefecture except 鹿角市 and 小坂町. It records the province's creation in 712 and its northward
  extension, with 雄勝郡 set up and the 出羽柵 moved to 秋田 in 733. It is a modern reference
  identification, not a source statement of the eighth century.
