# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  大宰府, the Kyushu regional government seat. The 東征傳 records 鑒眞 entering it on 天寶十二載十二月廿六日
  (753), and the chronicle reports the mission's ships and personnel through the 大宰府's reports in
  天平勝寶六年正月 (754).
types: [settlement]
names:
  - form: 大宰府
    lang: ja
    script: Hani
    roman: Dazaifu
    scheme: hepburn
    cite:
      - id: dazaifu-name
        says: The biography names 大宰府 as the place 鑒眞 entered on 天寶十二載十二月廿六日.
        source: toseiden
        at: 天寶十二載 十二月廿六日辛卯
at:
  - interpretation: approximate_point
    precision: locality
    point: [130.5151, 33.5145]
    notes:
      An approximate placement at the 大宰府政庁跡, the excavated site of the government seat's central
      compound, designated a Special Historic Site as 大宰府跡. The biography names 大宰府 without a
      building; the point marks the compound, not where 鑒眞 was received.
    cite:
      - id: dazaifu-identification
        says:
          The government office ruins at 太宰府市観世音寺 are the site of the 大宰府's administrative complex,
          the seat of the court's power in Kyushu from the late seventh to the late twelfth century.
          The point is the site's modern coordinate from Wikidata (CC0), which records the 特別史跡
          大宰府跡 designation.
        basis: interpretation
        attributed_to: 太宰府市 (Dazaifu City Japan Heritage Utilization Council)
        sources:
          - source: dazaifu-heritage-seicho
            at: Dazaifu Government Office Ruins
          - source: wikidata
            at: Q144845 (P625), revision 2513348828
modern:
  - form: 大宰府政庁跡
    lang: ja
    script: Hani
    note:
      The excavated site of the government compound, in 太宰府市; recorded as the identification the
      placement rests on.
notes:
  The 大宰府 is both a place in the voyage and the office whose reports the chronicle quotes. This
  record is the place; the office's reports are cited on the events they report.
