# yaml-language-server: $schema=../schema/chapter.schema.json
title: The 周 conquest of 商 at 牧野
summary: >-
  How 周 overthrew 商: 武王's review of the lords at 孟津, the crossing, the dawn battle at 牧野, the
  death of 紂, the first enfeoffments, the rising of 武庚 and the three overseers, and the new city
  at 洛邑. The year of the battle is one of the most argued dates in Chinese history.
window: 1048 BCE..1018 BCE
story:
  summary: >-
    The 周 conquest of 商 and its settlement, from the review at 孟津 to the founding of 成周 at 洛邑,
    on windows set by the 夏商周斷代工程's 1046 BCE and the Bamboo Annals' 1027 BCE for the battle.
  span: 1048 BCE..1018 BCE
  coverage: >-
    The conquest and the first settlement of the east as the Han annals, the Book of Documents and
    the Bamboo Annals tell it: 孟津, 牧野, the fall of 紂, the enfeoffment of 武庚, 魯 and the other
    states, the planning and building of 洛邑, and the rising of 武庚, 管叔 and 蔡叔. Excluded until
    their sources are read: the 利簋 and 何尊 bronzes, 周公's eastern campaigns beyond the annals'
    summary, and the conquest of 奄. Every date is a window; the battle's year is disputed.
  notes: >-
    Step order is presentation order and follows the annals. The two 孟津 events are dated relative
    to the battle: the review two years before it, the crossing in the winter before it, so their
    windows are the battle's window shifted back. The events after 武王's death share one window that playback cannot order. This
    is a draft for data and engine testing; no release decision has been taken.
  steps:
    - mengjin-review: 武王 reviews eight hundred lords at 孟津 and turns back
    - mengjin-crossing: 武王 crosses the river at 孟津
    - muye-battle: Dawn on 甲子 at 牧野
    - zhou-shang-conquest: 周 against 商
    - di-xin-death: 紂 dies in the fire on the 鹿臺 — or is taken alive
    - shang-altar-proclamation: 武王 at the 商 altar of the soil
    - wu-geng-enfeoffed: 武庚 keeps the 殷 people under two overseers
    - zhou-enfeoffments: 武王 enfeoffs his ministers and brothers
    - zhou-lu-enfeoffment: 周 grants 魯 to 周公
    - luoyi-planned: 武王 plans a city at 洛邑
    - sanjian-rebellion: 武庚, 管叔 and 蔡叔 rise, and 周公 puts them down
    - sanjian-against-zhou: 武庚 against 周
    - weizi-song: 微子 continues 殷 at 宋
    - song-successor-of-shang: 宋 continues 商
    - chengzhou-founding: 成周 is built at 洛邑
