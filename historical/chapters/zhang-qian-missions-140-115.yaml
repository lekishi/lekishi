# yaml-language-server: $schema=../schema/chapter.schema.json
title: 張騫's missions to the west, 140–115 BCE
summary:
  Some time between 140 BCE and 135 BCE 張騫 leaves through 隴西 to find the 月氏, is held by the 匈奴 for ten years, reaches 大宛, 康居, the
  大月氏 and 大夏, and comes home after thirteen years with two of a hundred men. Then the search for a
  road through 蜀, the war years, and his mission to 烏孫, from which his deputies opened the west.
window: 140 BCE..115 BCE
story:
  summary:
    "張騫's missions, 140–115 BCE: the first mission to the 月氏 and the long captivity, the countries he
    reached and the return, the search for 身毒 from 蜀, his years as a soldier, and the mission to 烏孫
    with its deputies sent on to the west."
  span: 140 BCE..115 BCE
  coverage:
    "張騫's two missions as the 史記's 大宛列傳 records them, with the 匈奴列傳 and the 西南夷列傳 for dates,
    and his two campaigns of 123 and 121 BCE, which this chapter shares with the Han–匈奴 wars.
    Excluded: the deputies' own journeys, the embassies after his death, 李廣利's war on 大宛, and the
    countries he described but did not reach (安息, 條枝, 奄蔡, 身毒). The first mission's dates are
    windows: the sources date only the departure (建元中) and the return. 康居, the 月氏 court, the 匈奴
    court and 羌中 have no position, so the map cannot draw the journey through them. 羌中 is the
    land he meant to cross on the way home, not the place of the second capture, which the source
    does not name."
  notes:
    "Step order is presentation order and follows the 大宛列傳's narrative; the events of the first
    mission share one wide window because the source gives no years between departure and return.
    The return of 126 BCE is dated by joining the 大宛列傳 to the 匈奴列傳. The 烏孫 mission's return is
    a window until the 漢書's table of officials is cited."
  steps:
    - zhang-qian-departure: 張騫 leaves through 隴西 for the 月氏, 建元 years
    - zhang-qian-captured: Caught and held by the 匈奴 for more than ten years
    - zhang-qian-dayuan: Escape west to 大宛
    - zhang-qian-yuezhi: Through 康居 to the 大月氏 and 大夏
    - zhang-qian-recaptured: Caught again on the way home, meaning to cross 羌中
    - zhang-qian-return-126: Home after thirteen years, two of a hundred, 127–126 BCE
    - dingxiang-sorties-123: As 校尉 under 衛青, made 博望侯, 123 BCE
    - shu-envoys-122: Envoys from 蜀 look for 身毒, 122 BCE
    - youbeiping-battle-121: Late to 李廣's battle out of 右北平, 121 BCE
    - wusun-mission-departure: Sent to 烏孫 with three hundred men
    - wusun-audience: The 昆莫 receives him and will not commit
    - deputy-envoys: Deputies sent on to 大宛, 康居, the 月氏, 大夏 and beyond
    - zhang-qian-final-return: Home with 烏孫's envoys; made 大行, dies a year later
