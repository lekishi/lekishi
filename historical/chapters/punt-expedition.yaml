title: Hatshepsut's expedition to Punt
summary: At Amun's command Hatshepsut sends five galleys down the Red Sea to Punt, the land of incense.
  Her envoy trades with the chief Parihu for myrrh, ebony, ivory and thirty-one living incense trees,
  and the fleet comes home to a festival at Thebes; the trees are planted at Deir el-Bahari. Maspero
  gives no year, so the atlas places it in the queen's reign, 1473 BCE to 1458 BCE on Shaw's
  chronology.
window: 1473 BCE..1458 BCE
story:
  summary: 'Hatshepsut''s expedition to Punt: the command, the voyage, the meeting with Parihu, the barter,
    and the incense garden at Deir el-Bahari.'
  span: 1473 BCE..1458 BCE
  coverage: 'The expedition as Maspero retells the Deir el-Bahari reliefs and their texts in his History
    of Egypt (English translation, vol. IV). Excluded: the reliefs'' own captions in translation, the
    commander''s name, the later Punt expeditions, and the archaeology of the Red Sea ports. Punt and
    the Ilim are unlocated; the Elephant River is only Maspero''s proposed landing, shown as an anchor.'
  notes: Every BCE date is Hatshepsut's reign on Shaw's chronology (The Oxford History of Ancient Egypt,
    2000); Maspero gives no year. Step order is the order of the reliefs.
  steps:
  - amun-commands-punt-voyage: Amun commands the voyage
  - punt-expedition: Five galleys for the land of incense
  - punt-fleet-sails: Down the Red Sea
  - punt-landing: Up the river to a village on piles
  - meeting-with-parihu: '"Have you come down by way of the sky?"'
  - punt-trade: 'The barter: thirty-one incense trees'
  - egypt-punt-trade: Egypt and Punt trade again
  - punt-fleet-at-ilim: A giraffe from the Ilim
  - punt-fleet-returns-to-thebes: Home to a festival at Thebes
  - incense-measured-for-amun: Measuring the incense for Amun
  - incense-trees-planted: The incense garden at Deir el-Bahari
  - punt-reliefs-carved: The story carved on the colonnade
include:
- punt-expedition
