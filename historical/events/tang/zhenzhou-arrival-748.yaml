summary: The ship anchors at the river mouth of 振州. The vice-prefect 馮崇債 sends four hundred soldiers to meet the party, receives 鑒眞 in his house, holds an ordination in the prefect's hall, and lodges the monks at the prefecture's 大雲寺.
types: [journey, exchange]
date:
  value: 748-11..748-12
  mode: window
  calendar: chinese_lunisolar
  cite:
