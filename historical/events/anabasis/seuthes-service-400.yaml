# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  From Perinthus the army takes service with the Thracian prince Seuthes, campaigning for him through
  the winter as far as Salmydessus on the Black Sea, and is paid only in part.
types: [campaign]
part_of: [cyrus-expedition-401]
date:
  value: 400 BCE..399 BCE
  mode: window
  calendar: julian
  as_written: Seuthes met them
  cite:
    - id: seuthes-service-400-time
      says:
        Grote dates the crossing to Byzantium to October or November 400 BCE and reads Xenophon's 'mid-winter'
        in Seuthes's service as probably December.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: VII.3
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            and ultimately brought them across the Bosphorus of Thrace to Byzantium, in October or November,
            400 B.C.
        - source: grote-history-of-greece
          at: vol. IX, ch. LXXI, note 271
          quote: Probably the month of December.
places:
  - place: perinthus
    role: start
  - place: salmydessus
    role: waypoint
participants:
  - actor: seuthes
    role: host
  - actor: cyreans
    role: participant
  - actor: xenophon
    role: leader
cites:
  places:
    - id: seuthes-service-400-perinthus
      says: Xenophon records the army going to Perinthus.
      source: xenophon-anabasis
      at: VII.2
      quote: and the Hellenes proceeded to Perinthus.
    - id: seuthes-service-400-salmydessus
      says: Xenophon records the march reaching Salmydessus.
      source: xenophon-anabasis
      at: VII.5
      quote: and reached Salmydessus.
      role: supporting
