# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  Egypt's overlordship of Amurru, which Abdi-Ashirta and Aziru served on paper while taking their
  neighbours' lands, until Aziru was summoned to Egypt.
types: [rulership]
from: egypt-new-kingdom
to: amurru-kingdom
date:
  value: 1410 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: the reigns of Amenophis III and IV
cite:
  - id: amurru-overlordship
    says: Aziru writes to the king as his servant.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Aziru's reply"
    quote:
      '"To the great king, my lord, my god, my sun; Aziru, thy servant. Seven times and again seven
      times, &c. Oh, lord, I am indeed thy servant'
notes:
  "The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
