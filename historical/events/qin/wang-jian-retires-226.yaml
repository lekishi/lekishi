# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Asked how many men he would need to take Chu, 李信 said two hundred thousand and 王翦 six hundred thousand. The king called 王翦 old and timid and sent 李信; 王翦, his advice unused, pleaded illness and retired to 頻陽. The comprehensive mirror dates the exchange to 226 BCE; the annals record only that 王翦 retired that year."
types: [occurrence, council]
date:
  value: "226 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十一年（王翦謝病老歸）; 始皇帝二十一年（王翦因謝病歸頻陽）"
  cite:
    - says: "The annals record 王翦 pleading illness and old age and going home in 二十一年 (226 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十一年（王翦謝病老歸）"
      quote: "王翦謝病老歸。"
    - says: "The comprehensive mirror records the exchange and the retirement to 頻陽 in 始皇帝二十一年."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十一年（王問於將軍李信）"
      quote: "李信曰：「不過用二十萬。」王以問王翦，王翦曰：「非六十萬人不可。」"
places:
  - place: pinyang
    role: end
    note: "Where he retired."
participants:
  - actor: wang-jian
    role: subject
  - actor: li-xin
    role: participant
  - actor: qin-king-zheng
    role: leader
notes: "The biography of 王翦 tells the exchange without a year. The mirror's transcription corrects the colleague's name from 蒙恬 to 蒙武 in this entry; see the first Chu invasion."
cite:
  - says: "The biography records the exchange and the retirement."
    role: supporting
    source: shiji-six-states
    at: "卷七十三 白起王翦列傳（王翦言不用，因謝病）"
    quote: "王翦言不用，因謝病，歸老於頻陽。"
