# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Vercingetorix withdrew to Alesia, the oppidum of the Mandubii, with about 80,000 men and
  thirty days' grain, and sent his cavalry out to raise all Gaul. Caesar enclosed the town with one
  line of works facing in and another facing out. A relief army of, by Caesar's count, 8,000 horse
  and about 250,000 foot attacked the outer line; it broke after Caesar himself, known by the colour
  of his cloak, led the reserve, and Vercassivellaunus was taken in the rout."
types: [campaign]
date:
  value: 52 BCE
  mode: window
  calendar: julian
  as_written: "the year of book VII (one commentary a year, from 58 BCE)"
  cite:
    id: alesia-siege-52-year
    says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by
      the consuls of 58 BCE, so each book is one year from 58 BCE."
    sources:
      - source: caesar-gallic-war
        at: "1.6"
        quote: "L. Pisone, A. Gabinio consulibus."
      - source: caesar-gallic-war
        at: "8.48"
        quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
places:
  - place: alesia
    role: site
    cite:
      id: alesia-place
      says: "Caesar tells that Vercingetorix began to march to Alesia, a town of the Mandubii."
      source: caesar-gallic-war
      at: "7.68"
      quote: "protinusque Alesiam, quod est oppidum Mandubiorum, iter facere coepit"
participants:
  - actor: julius-caesar
    role: leader
  - actor: vercingetorix
    role: leader
cite:
  - id: alesia-relief
    says: "Caesar reports the relief army mustered in the land of the Aedui as 8,000 cavalry and
      about 250,000 infantry."
    source: caesar-gallic-war
    at: "7.76"
    quote: Coactis equitum VIII milibus et peditum circiter CCL haec in Aeduorum finibus recensebantur
  - id: alesia-rout
    says: "Caesar tells that the enemy turned and fled, the cavalry met them, and there was a great
      slaughter."
    role: supporting
    source: caesar-gallic-war
    at: "7.88"
    quote: Hostes terga vertunt; fugientibus equites occurrunt. Fit magna caedes.
notes: "Caesar's own account. The relief army's size is his figure and is widely thought inflated;
  the event says whose number it is."
