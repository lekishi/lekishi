# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The three divisions come together again at Calpe Haven in Asiatic Thrace, after the Arcadians
  are mauled by the Bithynian Thracians and Cheirisophus dies.
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 400 BCE
  mode: window
  calendar: julian
  as_written: reached Calpe Haven
  cite:
    - id: calpe-400-time
      says:
        Grote dates the sight of the sea to February 400 BCE and the crossing to Byzantium to October
        or November 400 BCE; the halt at Calpe lies between.
      basis: interpretation
      attributed_to: George Grote
      sources:
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: in the first half of February, the time of Xenophon’s visit
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            and ultimately brought them across the Bosphorus of Thrace to Byzantium, in October or November,
            400 B.C.
    - id: calpe-400-text
      says: Xenophon records Cheirisophus's division reaching Calpe Haven.
      source: xenophon-anabasis
      at: VI.3
      quote:
        As to Cheirisophus, that general prosecuted his march along the seaboard, and without check
        reached Calpe Haven.
      role: supporting
places:
  - place: kalpe
    role: site
participants:
  - actor: cyreans
    role: participant
  - actor: xenophon
    role: leader
