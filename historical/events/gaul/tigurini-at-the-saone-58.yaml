# yaml-language-server: $schema=../../schema/event.schema.json
summary: "When three quarters of the Helvetii had crossed the slow-flowing Arar (Saône) on rafts, Caesar left camp in the third watch with three legions and cut down the canton of the Tigurini still on the near bank. He notes that the same canton had killed the consul L. Cassius and his own father-in-law's grandfather fifty years before."
types: [campaign]
date:
  value: 58 BCE
  mode: window
  calendar: julian
  as_written: "the year of book I (one commentary a year, from 58 BCE)"
  cite:
    id: tigurini-at-the-saone-58-year
    says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by the consuls of 58 BCE, so each book is one year from 58 BCE."
    sources:
      - source: caesar-gallic-war
        at: "1.6"
        quote: "L. Pisone, A. Gabinio consulibus."
      - source: caesar-gallic-war
        at: "8.48"
        quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
places:
  - place: saone
    role: site
    cite:
      id: tigurini-saone-place
      says: Caesar tells that a quarter of the Helvetii were still on the near side of the Arar when he attacked.
      source: caesar-gallic-war
      at: "1.12"
      quote: quartam vero partem citra flumen Ararim reliquam esse
participants:
  - actor: julius-caesar
    role: leader
  - actor: helvetii
    role: subject
cite:
  - id: tigurini-saone-attack
    says: Caesar tells that he fell on them unready and encumbered and cut down a great part of them; the rest fled into the woods.
    source: caesar-gallic-war
    at: "1.12"
    quote: Eos impeditos et inopinantes adgressus magnam partem eorum concidit
notes: "Caesar's own account. He gives no place on the river; the place is the river, and the event asserts no crossing point."
