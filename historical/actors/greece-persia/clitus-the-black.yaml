# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Clitus son of Dropidas, the Companion who saved Alexander at the Granicus and whom Alexander
  killed in a drunken quarrel at Maracanda in 328 BCE.
types: [person]
names:
  - form: Clitus
    lang: en
    script: Latn
    note: Arrian's form; he is often called Cleitus the Black to tell him from others of the name.
    cite:
      - id: clitus-the-black-name
        says: Arrian names Clitus son of Dropidas.
        source: arrian-anabasis
        at: IV.8
        quote: Here also I shall give an account of the tragic fate of Clitus, son of Dropidas
roles:
  - role: soldier
    note: Commander of the royal squadron of the Companion cavalry.
