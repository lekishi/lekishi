notes:
  The city's page on the Special Historic Site 藤原宮跡. It describes 藤原宮 as the palace of the
  capital 藤原京 (694–710) where 持統, 文武 and 元明 reigned, at the centre of the capital, about 925 m
  east to west and 907 m north to south, and notes the 大宝律令 of 701 among the events of its time. It
  is a modern site identification, not a source statement of the eighth century.
