# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  From the Phasis the Greeks fight their way through the Taochians, whose stores are in strongholds,
  and the Chalybes, and reach the city of Gymnias, whose governor gives them a guide.
types: [journey]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE..400 BCE
  mode: window
  calendar: julian
  as_written: they marched into the country of the Taochians
  cite:
    - id: phasis-to-gymnias-400-time
      says:
        Grote dates the entry into Armenia to December 401 BCE and the sight of the sea to the first
        half of February 400 BCE; this stretch lies between.
      basis: interpretation
      attributed_to: George Grote
      sources:
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: extremely cold at the season when they entered it,—December
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: in the first half of February, the time of Xenophon’s visit
    - id: phasis-to-gymnias-400-text
      says: Xenophon records the march into the Taochian country.
      source: xenophon-anabasis
      at: IV.7
      quote:
        After this they marched into the country of the Taochians five stages--thirty parasangs--and
        provisions failed
      role: supporting
places:
  - place: phasis-armenia
    role: start
  - place: taochoi
    role: waypoint
  - place: gymnias
    role: end
participants:
  - actor: cyreans
    role: participant
cites:
  places:
    - id: phasis-to-gymnias-400-phasis
      says: Xenophon records the Greeks reaching the Phasis.
      source: xenophon-anabasis
      at: IV.6
      quote: to the banks of the river Phasis
    - id: phasis-to-gymnias-400-gymnias
      says: Xenophon records the city of Gymnias.
      source: xenophon-anabasis
      at: IV.7
      quote: which went by the name of Gymnias
      role: supporting
