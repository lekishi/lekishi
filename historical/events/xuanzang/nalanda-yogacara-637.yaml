summary:
  戒賢 lectures on the 瑜伽師地論 for fifteen months to thousands; over five years 玄奘 hears it three times
  with the other treatises and learns Sanskrit grammar.
types: [process, exchange]
date:
  value: 636..642
  mode: window
  calendar: chinese_lunisolar
  as_written: 如是鑽研諸部及學梵書，凡經五歲
  cite:
    - id: nalanda-yogacara-637-time
      says: The biography records five years of study without dates.
      source: cien-zhuan
      at: 卷三（如是鑽研諸部及學梵書）
      quote: 如是鑽研諸部及學梵書，凡經五歲
places:
  - place: nalanda
    role: site
participants:
  - actor: xuanzang
    role: participant
  - actor: silabhadra
    role: leader
notes:
  The biography gives no date for this stop. The window is the chapter's reckoning from the stays
  and seasons the biography reports between the 貞觀三年 departure and the 貞觀十九年 return; the biography's own
  chronology is not consistent (see the chapter notes), so the window is wide and the stop must never
  be shown at a midpoint.
cite:
  - id: nalanda-yoga-three
    says: The biography records 玄奘 hearing the 瑜伽 three times.
    source: cien-zhuan
    at: 卷三（法師在寺聽《瑜伽》三遍）
    quote: 法師在寺聽《瑜伽》三遍
