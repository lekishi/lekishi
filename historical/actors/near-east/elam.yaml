# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Elam, the land and kingdom east of Babylonia, whose army Hammurabi defeated in his thirtieth
  year by the cited readings of his year-names.
types: [state]
names:
  - form: Elam
    lang: en
    script: Latn
    cite:
      - id: elam-name
        says: The Catholic Encyclopedia names Elam as the power that held Babylonia in vassalage until Hammurabi.
        basis: interpretation
        attributed_to: C. L. Souvay, Catholic Encyclopedia (1910)
        source: catholic-encyclopedia
        at: Hammurabi (Charles L. Souvay)
        quote: the latter country had been in a condition of vassalage to Elam
notes: One actor for Elam across the chapters that reach it; its kings and periods are not separated here.
