# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "The booty of Megiddo: 340 living prisoners and 83 hands; 2,041 mares, 191 foals and 6 stallions;
  924 chariots, two of them gold-wrought, of the foe and of the chief of Megiddo; their bronze armour,
  200 suits of armour, 502 bows; and 1,929 large cattle, 2,000 small cattle and 20,500 white small cattle."
types: [exchange]
part_of:
  - megiddo-campaign
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: after the siege of Megiddo
places:
  - place: megiddo
    role: site
participants:
  - actor: egypt-new-kingdom
    role: participant
  - actor: chief-of-megiddo
    role: subject
cite:
  - id: booty-basis
    says: The annals list the prisoners, horses, chariots, armour and bows taken at Megiddo.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the booty of Megiddo"
    quote:
      340 living prisoners; 83 hands; 2,041 mares; 191 foals; 6 stallions; a chariot, wrought with
      gold, its pole of gold, belonging to that foe; a beautiful chariot, wrought with gold, belonging to
      the chief of Megiddo; 892 chariots of his wretched army; total, 924 chariots
  - id: booty-cattle
    says: The annals list the cattle the army took.
    role: supporting
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the booty of Megiddo (cattle)"
    quote:
      Behold, the army of his majesty took 1,929 large cattle, 2,000 small cattle, 20,500 white small
      cattle.
notes:
  The counts are the annals' own and are reported as such, not as verified numbers. The annals date
  by regnal year and the civil calendar, and the conversion to a BCE year depends on which chronology
  of the Eighteenth Dynasty is used. The window spans the dates usually given for year 23 of Thutmose
  III, from about 1482 BCE (a higher chronology) to about 1457 BCE (the lower one most used today); Breasted's
  own 1906 table is within it. It is an editorial bound that a cited chronology must replace before approval.
