# yaml-language-server: $schema=../schema/chapter.schema.json
title: The Lapita expansion into Remote Oceania
summary: "Lapita pottery appears in the Bismarck Archipelago as early as 1521 BCE in one model, and over the next seven centuries the people who made it sailed into islands no one had ever reached, from Vanuatu and New Caledonia to Fiji, Tonga and Sāmoa. There are no texts: every date is a calibrated radiocarbon or U/Th range, and the scholars who model them disagree by up to two centuries. Follow the settlements as the dating has them."
window: 1521 BCE..771 BCE
story:
  summary: "The Lapita expansion, about 1521–801 BCE (3470–2750 cal BP): first pottery on Mussau and in the
    Bismarcks, the crossing into Remote Oceania, the first settlements on Efate, Naigani and Viti Levu, the
    founding of Nukuleka in Tonga and the reach to Mulifanua in Sāmoa."
  span: 1521 BCE..771 BCE
  coverage: "Dates: calibrated radiocarbon and U/Th ranges from six studies, converted to BCE years (BCE =
    BP − 1949), each kept with its probability and original figures in as_written. Where models disagree,
    the site-based Bayesian chronologies (Petchey et al. 2015, Nunn and Petchey 2013, Burley et al. 2012,
    Petchey and Kirch 2019) are the main reading and Denham et al.'s 2012 charcoal model is the
    conflicting one. Places: sites, islands and regions from GeoNames; Bourewa has only a label anchor on Viti
    Levu. Excluded: the pre-Lapita settlement of Near Oceania, the Lapita sites of New Caledonia and the
    Reefs, the obsidian sourcing finds (held back until the owner decides on Pofatu's terms), Polynesian
    Plainware, and any linguistic or genetic reconstruction."
  notes: "No event here is a documented moment: each is a modelled range of when an archaeological signal
    begins, at a stated probability. The crossing's source says only around 3000 BP, so its window
    is editorial, from the earliest cited model for Vanuatu to the end of Teouma's most likely start, the earliest
    latest bound among the settlements it precedes. Step order follows the expansion eastward, which the dates support only
    roughly: Naigani's range begins before Teouma's."
