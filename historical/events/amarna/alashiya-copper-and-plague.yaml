# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "The king of Alashiya sends 500 talents of copper and apologises that it is so little: the hand
  of Nergal, the god of pestilence, has slain the workers, and the Egyptian messenger has had to stay
  three years."
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1390 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis III or IV
  cite:
    - id: alashiya-copper-and-plague-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE and Amenhotep IV (Akhenaten)
        1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
participants:
  - actor: alashiya
    role: participant
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: alashiya-copper
    says: Niebuhr quotes the king of Alashia on the copper and the plague.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Alashia"
notes: "The king names neither himself nor the Egyptian king, so the reign is not known. The letters
  are undated but for a few dockets. Their reigns follow Shaw's chronology (The Oxford History of
  Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten) 1352–1336 BCE.
  Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) follow an
  older, higher scheme."
