# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Amenhotep III dies. Tushratta writes that he wept that day and touched neither food nor drink,
  and sends Pirizzi and Bubri to Akhenaten to convey his grief.
types: [occurrence]
date:
  value: 1352 BCE
  mode: window
  calendar: regnal
  as_written: the end of the reign of Amenophis III
  cite:
    - id: death-of-amenhotep-iii-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE, so his reign ends in 1352 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
participants:
  - actor: amenhotep-iii
    role: subject
  - actor: tushratta
    role: witness
  - actor: pirizzi
    role: participant
cite:
  - id: mourning-basis
    says: Niebuhr quotes Tushratta's description of his grief.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the death of Nimmuria"
  - id: mourning-envoys
    says: Niebuhr says Tushratta sent Pirizzi and Bubri with lamentations to Napkhuria.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Pirizzi and Bubri"
notes: "The letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The
  Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
