# Proposed contract v1 journey record (RFD 2, "Proposed: the journey record", draft PR #26).
# Not compiled yet: the compiler reads no historical/journeys/ folder until v1 lands, so this
# file is test data for that work and changes no chapter's digest.
title: 秦始皇's last tour, 211–210 BCE
summary: >-
  始皇 sets out from 咸陽 late in 211 BCE with 李斯 and 胡亥, reaches 雲夢, sails down the 江 to 錢唐,
  sacrifices on 會稽, comes back north along the sea to 瑯邪 and 之罘, falls ill at 平原津 and dies at
  沙丘. The death is hidden, and the cortege goes on by 井陘 and 九原 to 咸陽.
travellers:
  - actor: qin-king-zheng
    role: leader
  - actor: li-si
    role: participant
  - actor: hu-hai
    role: participant
stops:
  - event: last-tour-departure-211
    place: xianyang
  - event: yunmeng-210
    place: yunmeng
  - event: qiantang-crossing-210
    place: qiantang
    by: river
    cite:
      id: qin-shihuang-210-river
      says: The annals record 始皇 sailing down the 江 to 錢唐.
      source: shiji
      at: 卷六 秦始皇本紀 三十七年（過丹陽，至錢唐）
  - kuaiji-stele-210
  - event: coast-north-210
    place: langya
  - event: great-fish-210
    place: zhifu
  - pingyuan-illness-210
  - shihuang-death-210
  - event: cortege-return-210
    place: xianyang
cite:
  - id: qin-shihuang-210-sequence
    says: >-
      The annals narrate the departure, 雲夢, the river to 錢唐, 會稽, 吳 and 瑯邪, 之罘, 平原津, the
      death at 沙丘 and the cortege's road to 咸陽, in this order.
    source: shiji
    at: 卷六 秦始皇本紀 三十七年
notes: >-
  Test case for a journey that outlives its leader: after the death at 沙丘 the party is the
  cortege, and the travellers stay as listed. Two stops sit at 咸陽 (departure and return), so the
  map draws one vertex there. The stops between 雲夢 and 沙丘 share one window, so v0 orders only the
  departure, the death and the return; the rest rests on the journey's cite.
