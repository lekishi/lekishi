<style>
  html,body{margin:0;height:100%;background:#0b1016;overflow:hidden;font-family:system-ui,sans-serif}
  #cesiumContainer{position:absolute;inset:0}
  #cesiumContainer .cesium-widget,#cesiumContainer .cesium-widget canvas{width:100%;height:100%}
  .cesium-widget-credits{font-size:9px!important;opacity:.6}
  #stats{position:absolute;left:10px;top:10px;z-index:10;background:rgba(10,14,18,.8);color:#f3ead7;font:11px/1.5 ui-monospace,monospace;padding:8px 10px;border-radius:4px;border:1px solid rgba(210,169,79,.4);white-space:pre}

<div id="cesiumContainer"></div>
<div id="stats">loading…</div>
<script>
  // Measured before the 6 MB UMD bundle is even requested, so the report can
  // separate "script start → ready" from "page start → ready".
  window.__spikePageT0 = performance.now()
  window.CESIUM_BASE_URL = "/node_modules/cesium/Build/Cesium/"
  // main.js awaits at top level and the page's load event does not wait for
  // that, so the harness sees window.spike before the module finishes: install
  // the API shell now and let the module fill it in. Calls made before the
  // module is ready are queued or answered with a neutral value.
  {
    const impl = {}; let resolveReady
    window.spike = {
      ready: new Promise(r => { resolveReady = r }),
      fly: t => impl.fly?.(t),
      settled: ms => (impl.settled ? impl.settled(ms) : window.spike.ready.then(() => impl.settled(ms))),
      setQuality: l => impl.setQuality?.(l),
      stats: () => (impl.stats ? impl.stats() : { loading: true }),
      _install(api) { Object.assign(impl, api); api.ready.then(resolveReady) },
    }
  }
</script>
<script src="/node_modules/cesium/Build/Cesium/Cesium.js"></script>
