summary: The envoys board the first and fourth ships of the embassy to Tang; for want of a fair wind they wait three days. The diary opens here and does not name the anchorage.
types: [journey]
date:
  value: 838-06-13
  calendar: regnal
  as_written: 承和五年六月十三日午時
  cite:
    - id: ennin-embarkation-838-time
      says: The diary's first entry records the envoys boarding the first and fourth ships on 承和五年六月十三日 and waiting three days for a wind.
      source: nitto-guho-junrei-gyoki
      at: 卷一 承和五年六月十三日
      quote: 第一第四兩舶。諸使駕舶。緣無順風。停宿三箇日。
participants:
  - actor: ennin
    role: leader
  - actor: fujiwara-no-tsunetsugu
    role: leader
    note: The diary's 大使; the missions records hold his appointment.
notes: The diary dates its Japanese entries by 承和 and does not say where the ships lay. 圓仁 sailed on the first ship, the ambassador's.
