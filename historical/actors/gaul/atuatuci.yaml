# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "The Atuatuci, a Belgic people that Caesar says descended from the Cimbri and Teutoni.
  After the Sambre they withdrew into one stronghold, which Caesar took and sold, inhabitants and
  all, in 57 BCE."
types: [community]
names:
  - form: Atuatuci
    lang: la
    script: Latn
    cite:
      - id: atuatuci-name
        says: Caesar tells that the Atuatuci were coming with all their forces to help the Nervii and turned home when they heard of the battle.
        source: caesar-gallic-war
        at: "2.29"
        quote: "Atuatuci, de quibus supra diximus, cum omnibus copiis auxilio Nerviis venirent, hac
          pugna nuntiata ex itinere domum reverterunt"
