# A journey sketch written to the proposed journey shape (RFD 2, 2026-10-21).
# A counterexample, not a conforming record: a recurring route with no travellers probes the
# proposal's "one party's movement" definition rather than fitting it.
# Kept here, outside historical/journeys/, because the compiler reads that folder and the decided
# record (RFD 2, "Decided: the journey record") rejects this file. It records the finding.
title: Pliny's route from Alexandria to Muziris
summary: >-
  Up the Nile from Alexandria to Coptos in twelve days, across the desert by camel to Berenice in
  twelve, down the Red Sea to Ocelis in about thirty, and with the Hippalus wind to Muziris in
  forty; home again from December.
stops:
  - event: pliny-nile-leg
    place: alexandria-egypt
  - event: pliny-nile-leg
    place: coptos
    by: river
  - event: pliny-desert-leg
    place: berenice
    by: land
  - event: pliny-red-sea-leg
    place: ocelis
    by: sea
  - event: pliny-ocean-leg
    place: muziris
    by: sea
  - event: pliny-return-sailing
    place: berenice
    by: sea
cite:
  - id: pliny-india-route-sequence
    says: >-
      Pliny gives the route in this order: up the Nile to Coptos, by camel stations to Berenice,
      by sea to Ocelis or Cane, across with the Hippalus wind to Muziris, and the return from
      India in Tybis or before 6 Mechir.
    source: pliny-natural-history
    at: VI.26
notes: >-
  Findings for the journey review. The route has no travellers: Pliny describes a route anyone took
  every year, not a party, and the proposal assumes travellers. One event is two stops (the Nile
  leg's start and end), each choosing its place with `place:`, which the proposal allows; whether
  one event may be two stops is the open question. by: river, land and sea all occur, so the playhead would
  change from ship to party to ship. All stops share one window (48–77 CE), so v0 can check no
  order, as with Hanno.
