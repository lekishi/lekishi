# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Iarmuti, a land Sargon's Nippur inscriptions name between Mari and Ibla on his march west. L.
  W. King places it on the north Syrian or Cilician coast; the record asserts no position.
types: [region]
names:
  - form: Iarmuti
    lang: en
    script: Latn
    cite:
      - id: iarmuti-name
        says: Sargon's inscription names Iarmuti among the lands Enlil gave him.
        source: king-legends-babylon-egypt
        at: Lecture I
        quote:
          gave him the upper land, Mari, Iarmuti, and Ibla, as far as the Cedar Forest and the Silver
          Mountains
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      King (1918) says it must probably be sought on the north Syrian or possibly the Cilician coast,
      and reports Poebel's suggestion of the plain of Antioch. No cited source fixes it, so no coordinate
      is asserted.
    cite:
      - says: King places Iarmuti probably on the north Syrian or Cilician coast.
        basis: interpretation
        attributed_to: L. W. King (1918)
        source: king-legends-babylon-egypt
        at: Lecture I
        quote: we must probably seek it on the North Syrian or possibly the Cilician coast
notes: King takes Iarmuti to be the Iarimuta of the Amarna letters.
