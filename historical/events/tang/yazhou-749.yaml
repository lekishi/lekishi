summary: At 崖州, where 榮叡 and 普照 arrive after more than forty days by sea, the 遊奕大使 張雲 lodges the party at 開元寺. After a fire burns the temple, 鑒眞 rebuilds it with timber the 振州 vice-prefect sends, confers the precepts, and is put on a boat by the magistrate of 澄邁縣.
types: [founding, exchange]
date:
  value: 749..750
  mode: window
  calendar: chinese_lunisolar
  cite:
    - id: yazhou-time
      says: The biography records the stay at 崖州 after 萬安州, without a date of its own.
      source: toseiden
      at: 榮叡、普照師從海路經四十餘日，到崖州
