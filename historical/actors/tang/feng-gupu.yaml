summary:
  馮古璞, 都督 (governor-general) of 始安郡 (桂州), who met 鑒眞 outside the city walls, lodged him at
  開元寺 for a year and received the bodhisattva precepts from him.
types: [person]
names:
  - form: 馮古璞
    lang: lzh
    script: Hani
    roman: Feng Gupu
    scheme: pinyin
    cite:
      - id: feng-gupu-name
        says: The biography names 始安郡都督上黨公馮古璞 as the governor who received 鑒眞.
        source: toseiden
        at: 始安［郡］都督上黨公馮古璞等步出［城］外
roles:
  - role: official
    note: 都督 of 始安郡, titled 上黨公.
    cite:
      - id: feng-gupu-role
        says: The biography gives his office as 始安郡都督 and his title as 上黨公.
        source: toseiden
        at: 始安［郡］都督上黨公馮古璞
