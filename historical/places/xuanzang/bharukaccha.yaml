# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  跋祿羯呫婆, across the 耐秣陀河 on the western road; the Barygaza of the Periplus, the great market
  of north-western India on the gulf of Cambay, to which the goods of Ozene, Paethana and Tagara came
  down and the ships of Egypt and Arabia sailed in July.
types: [port, settlement]
names:
  - form: 跋祿羯呫婆
    lang: lzh
    script: Hani
    roman: Balujiechanpo
    scheme: pinyin
    cite:
      - id: bharukaccha-name
        says: The biography records 玄奘 crossing the 耐秣陀河 to reach 跋祿羯呫婆.
        source: cien-zhuan
        at: 卷四（自此西北行千餘里）
        quote: 自此西北行千餘里，渡耐秣陀河，至跋祿羯咕婆國
  - form: 跋祿羯咕婆
    lang: lzh
    script: Hani
    note: The spelling of this transcription of the biography.
    claim: bharukaccha-name
  - form: Barygaza
    lang: en
    script: Latn
    cite:
      - id: barygaza-name
        says:
          The Periplus names the gulf and market-town of Barygaza at the beginning of the kingdom of Nambanus
          and of all India.
        source: periplus-erythraean-sea
        at: "41"
        quote:
          Beyond the gulf of Baraca is that of Barygaza and the coast of the country of Ariaca, which
          is the beginning of the Kingdom of Nambanus and of all India.
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [72.9667, 21.7]
    notes:
      Label anchor at Bharuch as recorded in Wikidata (Q760153). It is not an asserted historical coordinate;
      the identification of 跋祿羯呫婆 with the modern place is the conventional modern reading, not a statement
      of the cited sources.
    cite:
      - id: bharukaccha-anchor
        says:
          The label anchor is placed at the coordinate recorded in Wikidata (CC0); no historical coordinate
          is asserted.
        source: wikidata
        at: Q760153 (P625), revision 2554081502
      - id: barygaza-location
        says: Pleiades places Barygaza on the Gulf of Cambay, with a representative point at Bharuch.
        role: supporting
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: 59737 (reprLatLong), dump 2026-10-21
modern:
