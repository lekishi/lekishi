summary: The governor 盧奐 meets 鑒眞 outside 廣州 and lodges him at 大雲寺, where he confers the precepts. The biography describes the river full of Brahman, Persian and Kunlun ships laden with aromatics and treasure. He stays one spring.
types: [exchange]
date:
  value: 749..750
  mode: window
  calendar: chinese_lunisolar
  as_written: 大和上住此一春
  cite:
    - id: guangzhou-stay-time
      says: The biography records one spring at 廣州 before the move to 韶州 in 天寶九載.
      source: toseiden
      at: 大和上住此一春，發向韶州
