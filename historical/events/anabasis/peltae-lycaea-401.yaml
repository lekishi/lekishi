# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At Peltae the army halts three days while the Arcadian general Xenias celebrates the Lycaea with
  sacrifice and games.
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE
  mode: window
  calendar: julian
  as_written: where he remained three days
  cite:
    - id: peltae-lycaea-401-time
      says:
        Grote dates the start of the march from Sardis to about March or April 401 BCE and the battle
        of Kunaxa to about September or October of the same year; the stage falls between them.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: I.2
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote: was commenced about March or April in the year 401 B.C.
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            It was about six months afterwards, in the month of September or October of the same year,
            that the battle of Kunaxa was fought
    - id: peltae-lycaea-401-text
      says: Xenophon records the three-day halt at Peltae.
      source: xenophon-anabasis
      at: I.2
      quote: to the populous city of Peltae, where he remained three days
      role: supporting
places:
  - place: peltae
    role: site
participants:
  - actor: cyreans
    role: participant
cites:
  summary:
    - id: peltae-lycaea-401-games
      says: Xenophon records Xenias celebrating the Lycaea with games at Peltae.
      source: xenophon-anabasis
      at: I.2
      quote: while Xenias, the Arcadian, celebrated the Lycaea with sacrifice, and instituted games.
