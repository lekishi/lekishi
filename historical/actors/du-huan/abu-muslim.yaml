# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  波悉林 of 呼羅珊, who in the western-regions entries raised a rising whose followers wore black,
  killed 末換 and set up 阿蒲羅拔. He is usually identified with Abū Muslim; the chapter keeps the
  sources' name and cites the identification only as Wikidata's.
types: [person]
names:
  - form: 波悉林
    lang: lzh
    script: Hani
    roman: Boxilin
    scheme: pinyin
    cite:
      - id: abu-muslim-name
        says: The western-regions entries name 波悉林 of 呼羅珊 raising troops whose followers all wore black.
        sources:
          - source: jiu-tangshu-tang-west
            at: 卷一九八 西戎 大食國（有呼羅珊木粗人並波悉林舉義兵）
            quote: 有呼羅珊木粗人並波悉林舉義兵，應者悉令著黑衣，旬月間眾盈數萬。
          - source: xin-tangshu-tang-west
            at: 卷二二一下 西域下 大食（有呼羅珊木鹿人並波悉林將討之）
            quote: 有呼羅珊木鹿人並波悉林將討之，徇眾曰：「助我者，皆黑衣。」
roles:
  - role: other
    note: Leader of the black-clad rising.
external_ids:
  - system: wikidata
    id: Q335210
    url: https://www.wikidata.org/wiki/Q335210
    license: CC0-1.0
    note: Abū Muslim, the usual identification of 波悉林; found on 2026-10-21.
notes:
  "The two histories disagree on his home: 舊唐書 prints 木粗 and 新唐書 木鹿. The chapter records both
  and does not tie either to the place record 末祿."
