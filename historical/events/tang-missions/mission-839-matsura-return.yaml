summary:
  常嗣 brings seven ships in to 生属嶋 in 松浦郡 of 肥前, eight with 宗雄's. To spare the harvest the court
  has the party come to the capital in stages, the goods by land.
types: [journey]
date:
  value: 839-08
  calendar: regnal
  as_written: 承和六年八月甲戌
  cite:
    - id: mission-839-matsura-time
      says: The chronicle records the court's order on 承和六年八月甲戌.
      source: shoku-nihon-koki
      at: 卷第八 承和六年八月甲戌
      quote: 知遣唐大使藤原常嗣朝臣等率七隻船。廻着肥前國松浦郡生属嶋。与先到録事大神宗雄船。總是八艘。
places:
