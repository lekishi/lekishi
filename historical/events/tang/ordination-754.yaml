# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  In the fourth month of 天平勝寶六年 (754) a precepts platform is erected in front of the 盧遮那殿;
  the biography records the emperor first receiving the bodhisattva precepts, then the empress and
  crown prince, more than 440 novices being ordained, and more than 80 senior monks re-ordaining.
types: [process, exchange]
date:
  value: 754-04
  mode: duration
  calendar: chinese_lunisolar
  as_written: 天平勝寶六年甲午 四月初，於盧遮那殿前立戒壇
  cite:
    - id: ordination-time
      says:
        The biography records a precepts platform at the 盧遮那殿 in the fourth month of 754, imperial
        ordinations, more than 440 novices ordained, and more than 80 senior monks re-ordaining.
      source: toseiden
      at: 其年四月初，於盧遮那殿前立戒壇…尋爲沙彌澄修等四百四十餘人授戒。又舊大僧…等八十餘人僧，捨舊戒、重受和上所授之戒
    - id: ordination-imperial-support
      says:
        The chronicle's notice of 鑒眞's death states that 聖武皇帝 received the precepts from him, without
        a date in that passage.
      role: supporting
      source: shoku-nihongi
      at: 卷第廿四 天平寶字七年五月戊申（聖武皇帝師之受戒焉）
places:
  - place: todaiji
    role: site
    note: The biography places the platform at the 盧遮那殿, where 鑒眞 had been installed.
participants:
  - actor: jianzhen
    role: leader
notes: The ordination account rests on the biography alone; the chronicle's accessible text does not
  record the 754 ordinations. The passage says 天皇 without naming the sovereign, and the chronicle's
  later notice says 聖武皇帝 received the precepts from 鑒眞 without a date, so the chapter names no
  individual as ordained. The biography's miracle material is excluded.
cites:
  participants:
    - id: ordination-participant
      says: The biography places 鑒眞 at the platform as the precept master.
      source: toseiden
      at: 其年四月初，於盧遮那殿前立戒壇
