# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Sardis, the former Lydian capital and the seat of the Persian governor in western Asia Minor.
  Xerxes wintered there in 481–480 BCE before the march on Hellas, Cyrus the Younger mustered his army
  there in 401 BCE, and it surrendered to Alexander in 334 BCE.
types: [capital]
names:
  - form: Σάρδεις
    lang: grc
    script: Grek
    roman: Sardis
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: sardis-greek-name
        says: Pleiades records the ancient Greek name Σάρδεις for this place.
        source: pleiades
        at: place 550867, name /places/550867/sardeis, dump 2026-10-21
      - id: sardis-name
        says: Herodotus records the army wintering at Sardis and setting out from it in spring for Abydos.
        source: herodotus
        at: VII.37
        quote:
          after they had passed the winter at Sardis, the army set forth from thence fully equipped,
          at the beginning of spring, to march to Abydos
        role: supporting
  - form: Sardis
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: sardis-name
