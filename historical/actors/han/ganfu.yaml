# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  甘父, called 堂邑父, a 胡 bondsman of the 堂邑 household who left 隴西 with 張騫, fed the party by
  shooting game, and was one of the two who returned thirteen years later; the court made him 奉使君.
types: [person]
names:
  - form: 堂邑父
    lang: lzh
    script: Hani
    roman: Tangyi Fu
    scheme: pinyin
    cite:
      - id: ganfu-name
        says: The 大宛列傳 records 堂邑父 escaping home with 張騫 and being made 奉使君.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（堂邑父為奉使君）
        quote: 漢拜騫為太中大夫，堂邑父為奉使君。
  - form: 甘父
    lang: lzh
    script: Hani
    note: His own name; 堂邑父 joins it to his master's surname.
    cite:
      - id: ganfu-own-name
        says: The 大宛列傳 records that 張騫 left 隴西 with 甘父, a 胡 bondsman of the 堂邑 household.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（與堂邑氏胡奴甘父俱出隴西）
        quote: 與堂邑氏（故）胡奴甘父俱出隴西
notes:
  The transcription marks （故） in the 史記 phrase as an editorial deletion; the 漢書 reads 堂邑氏奴甘父.
  The record quotes the 史記 transcription as it stands.
