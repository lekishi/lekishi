notes:
  The fifth-century BCE history of the wars between the Persians and the Hellenes. Books VII to IX
  narrate Xerxes' invasion of 480–479 BCE. It is the only continuous narrative of the campaign and
  gives no absolute dates beyond the Athenian archon of the year (Calliades, VIII.51); its army
  and fleet figures are its own and are reported as such, never as fact.
