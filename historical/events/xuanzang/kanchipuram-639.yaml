summary:
  At 建志補羅, the port for 僧伽羅, 玄奘 meets three hundred monks who have fled the king's death and famine
  there, and gives up the crossing.
types: [occurrence]
date:
  value: 636..642
  mode: window
  calendar: chinese_lunisolar
  as_written: 未去之間而彼王死，國內饑亂
  cite:
    - id: kanchipuram-639-time
      says: The biography records the meeting without a date.
      source: cien-zhuan
      at: 卷四（未去之間而彼王死）
      quote: 未去之間而彼王死，國內饑亂
places:
