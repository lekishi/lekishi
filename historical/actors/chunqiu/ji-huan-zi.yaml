# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  季桓子, head of the 季孫 house and master of 魯's government, who accepted the 齊 dancing girls and neglected
  the state, so that Confucius left.
types: [person]
names:
  - form: 季桓子
    lang: lzh
    script: Hani
    roman: Ji Huanzi
    scheme: pinyin
    cite:
      - id: ji-huan-zi-name
        says: >-
          The 論語 records that 季桓子 accepted the dancing girls 齊 sent and did not hold court for three days.
        source: lunyu
        at: 微子第十八（齊人歸女樂）
        quote: 齊人歸女樂，季桓子受之，三日不朝。
roles:
  - role: official
    note: Chief minister of 魯.
    cite:
      - id: ji-huan-zi-role
        says: The 論語 records that 季桓子 accepted the dancing girls and did not hold court for three days.
        source: lunyu
        at: 微子第十八（齊人歸女樂）
