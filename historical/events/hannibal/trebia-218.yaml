# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Around the winter solstice, on a snowy day, Sempronius leads the Romans unfed across the Trebia
  against Hannibal. Mago's ambush falls on their rear; both wings break and are driven to the river,
  and only about 10,000 cut their way through the centre to Placentia.
types: [occurrence]
date:
  value: "218 BCE"
  calendar: regnal
  as_written: περὶ χειμερινὰς τροπάς; brumae tempus
  cite:
    - id: trebia-time
      says: Both historians put the battle about the winter solstice, on a snowy, bitterly cold day.
      sources:
        - source: polybius
          at: "3.72.3"
          quote: οὔσης δὲ τῆς ὥρας περὶ χειμερινὰς τροπὰς καὶ τῆς ἡμέρας νιφετώδους καὶ ψυχρᾶς
            διαφερόντως
        - source: livy
          at: "21.54.7"
          quote: erat forte brumae tempus et nivalis dies in locis Alpibus Appenninoque interiectis
places:
  - place: trebia
    role: site
    note: The river is placed by a label anchor; the battlefield is not located.
  - place: placentia
    role: context
    note: The survivors withdrew there.
participants:
  - actor: ti-sempronius-longus
    role: leader
  - actor: hannibal
    role: leader
  - actor: mago-barca
    role: leader
    note: Commanded the ambush (Polybius 3.71).
notes:
  The winter solstice is an astronomical season, not a date in the Roman calendar of the year; the
  record keeps year precision. Sempronius reported to Rome that the storm had robbed them of victory
  (Polybius 3.75.1). Year only. The sources date by Roman consular year and by season; v0 has no
  Roman republican calendar, so the date is the Julian year the consular year falls in, and no month
  or day is asserted.
cite:
  - id: trebia-ambush
    says: Polybius records the Numidians rising from ambush and falling on the Roman centre from behind.
    source: polybius
    at: "3.74.1"
    quote:
      διαναστάντων τῶν ἐκ τῆς ἐνέδρας Νομάδων καὶ προσπεσόντων ἄφνω κατὰ νώτου τοῖς ἀγωνιζομένοις
      περὶ τὰ μέσα
  - id: trebia-breakthrough
    says:
      Polybius records the Roman front breaking through and withdrawing in order to Placentia, not
      fewer than ten thousand.
    role: supporting
    source: polybius
    at: "3.74.6"
    quote:
      τηροῦντες δὲ τὰς τάξεις ἁθρόοι μετʼ ἀσφαλείας ἀπεχώρησαν εἰς Πλακεντίαν, ὄντες οὐκ ἐλάττους
      μυρίων
  - id: trebia-elephants
    says: Polybius records that the rain and snow killed all the elephants but one and many men and
      horses.
    role: supporting
    source: polybius
    at: "3.74.11"
    quote:
      ὥστε τὰ μὲν θηρία διαφθαρῆναι πλὴν ἑνός, πολλοὺς δὲ καὶ τῶν ἀνδρῶν ἀπόλλυσθαι καὶ τῶν ἵππων
      διὰ τὸ ψῦχος
  - id: trebia-livy-cremona
    says: Livy records Scipio leading the army to Placentia and across the Po to Cremona so the two
      armies would not winter on one colony.
    role: supporting
    source: livy
    at: "21.56.9"
    quote:
      ab Scipione consule exercitus Placentiam est perductus, inde Pado traiecto Cremonam, ne duorum
      exercituum hibernis una colonia premeretur
