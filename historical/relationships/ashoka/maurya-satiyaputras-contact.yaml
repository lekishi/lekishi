summary: >-
  The edicts name the Satiyaputras among the southern frontagers beyond Aśoka's dominions, where he claims
  to have provided healing arrangements or won the conquest by the Law.
types: [contact]
from: maurya-empire
to: satiyaputras
notes: A claim of contact in the edicts, not a record of the frontagers' response.
cite:
  - id: maurya-satiyaputras-contact-basis
    says: The edict names them among the frontagers.
    source: asoka-inscriptions
    at: Rock Edict II, Girnar text
    quote: >-
      among his frontagers, the Choḷas, Pâṇdyas, the Satiyaputra, the Ketalaputra [KeraḶa-, Sh.]
