# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The fleet passes the Pillars of Heracles into the outer sea."
types: [journey]
part_of: [hanno-voyage]
date:
  value: 570 BCE..470 BCE
  mode: window
  calendar: julian
  as_written: "Ώς δ᾽ ἀναχθέντες τὰς Στήλας παρημείψαμεν"
  cite:
    - id: hanno-pillars-passage-time
      says: "The account dates none of its stages; this one belongs to the undated voyage, whose window the cited commentators set between about 570 and 470 BCE."
      basis: interpretation
      attributed_to: W. H. Schoff (1913); J. Bostock and H. T. Riley (1855)
      sources:
        - source: hanno-periplus
          at: "2"
        - source: schoff-hanno
          at: Carthaginian Chronology
places:
  - place: pillars-of-heracles
    role: waypoint
participants:
  - actor: hanno
    role: leader
cite:
  - id: hanno-pillars-account
    says: "The account says that after putting to sea the fleet passed the Pillars."
    source: hanno-periplus
    at: "2"
    quote: "Ώς δ᾽ ἀναχθέντες τὰς Στήλας παρημείψαμεν"
