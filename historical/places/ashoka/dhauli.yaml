# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  The rock on the hill at Dhauli, south of Bhubaneswar, on which a version of the Fourteen Rock Edicts
  is incised with the two Kalinga Edicts in place of Edicts XI to XIII, below the forepart of an elephant
  cut from the living rock.
types: [other]
names:
  - form: Dhauli
    lang: en
    script: Latn
    cite:
      - id: dhauli-name
        says: >-
          Smith places the northern Kalinga copy on a rock close to the summit of a hill near the village
          of Dhauli.
        source: smith-asoka-1920
        at: ch. III, The Monuments
        quote: >-
          close to the summit of a hill near the village of Dhauli (N. lat. 20° 15′, E. long. 85° 50′), about
          seven miles to the south of Bhuvanesvar
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [85.83333333, 20.18333333]
    notes: >-
      Label anchor at Wikidata's coordinate for Dhauli. Smith gives 20° 15′ N, 85° 50′ E for the rock.
    cite:
      - id: dhauli-anchor
        says: >-
          The coordinate is the modern position recorded in Wikidata (CC0); it is a map reference, not a historical
          claim.
        source: wikidata
        at: Q3498218 (P625), revision 2509581955
notes: >-
  The Dhauli Kalinga Edicts are addressed to the prince and high officers at Tosalī, which Smith places
  in the neighbourhood; Tosalī has its own record.
