# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Tushratta greets Amenhotep III as brother and son-in-law and asks for gold in great quantity,
  for war equipment and a dowry, since in Egypt, he says, gold is as plentiful as dust.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1410 BCE..1350 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis III
participants:
  - actor: tushratta
    role: participant
  - actor: amenhotep-iii
    role: participant
  - actor: mitanni
    role: participant
cite:
  - id: gold-basis
    says: Niebuhr quotes Letter VIII of the British Museum edition.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Letter VIII"
notes:
  "The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
