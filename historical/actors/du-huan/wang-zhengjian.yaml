summary: 王正見, the 北庭 military governor who, 經行記 says, campaigned against 碎葉 in 天寶七年 (748), leaving its walls broken and its quarters deserted.
types: [person]
names:
  - form: 王正見
    lang: lzh
    script: Hani
    roman: Wang Zhengjian
    scheme: pinyin
    cite:
      - id: wang-zhengjian-name
        says: 經行記, quoted under 石國, names the 北庭 military governor 王正見 attacking 碎葉 in 天寶七年.
        source: tongdian
        at: 卷一九三 邊防九 石國（又云：碎葉國）
        quote: 又有碎葉城，天寶七年，北庭節度使王正見薄伐，城壁摧毀，邑居零落。
roles:
  - role: official
    note: 北庭節度使 in 經行記; 舊唐書 卷一〇四 has him governing 安西 in 天寶十載.
