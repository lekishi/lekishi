# yaml-language-server: $schema=../schema/chapter.schema.json
title: Nebuchadnezzar II takes Jerusalem
summary: Nebuchadnezzar II of Babylon took Jerusalem twice. Follow his march west in 598 BCE, the
  capture of the city and Jehoiachin's exile in 597, Zedekiah's rebellion, the siege, the breach of the
  walls and the burning of the temple in 587 or 586, Gedaliah at Mizpah, the flight to Egypt, and the
  deportations, with the Babylonian Chronicle and the biblical books disagreeing on years, days and
  counts.
window: 598 BCE..586 BCE
story:
  summary: 'From Nebuchadnezzar''s march of his seventh year to Jehoiachin''s release in Babylon: two
    captures of Jerusalem, three deportations, and a governor murdered at Mizpah.'
  span: 598 BCE..561 BCE
  coverage: 'The capture of 597 BCE in the Babylonian Chronicle (ABC 5, rev. 11''–13'') and the books
    of Kings (2 Kings 24:1–17), the second siege and the fall (2 Kings 24:20–25:21, Jeremiah 34:7, 37:5–11,
    39:1–2, 52:4–30, 2 Chronicles 36), Gedaliah and the flight to Egypt (2 Kings 25:22–26, Jeremiah 40–43),
    and Jehoiachin''s release (2 Kings 25:27–30, Jeremiah 52:31–34). Excluded: Nebuchadnezzar''s other
    campaigns, Carchemish and his Egyptian war, the prophecies and speeches, Ezekiel''s visions, Daniel,
    the rabbinical legends, and the return under Persia. No route is drawn, and no territory.'
  notes: The texts date by regnal years and months, which the contract cannot hold as a calendar, so each
    date keeps its day as written and its BCE year as the cited sources convert it. The fall is 587 BCE
    in The Bible Journey and 586 in the Jewish Encyclopedia; the chapter keeps both as a window and a
    dispute.
  steps:
