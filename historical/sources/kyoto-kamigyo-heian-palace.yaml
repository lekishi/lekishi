notes:
  The ward's page on the 平安宮址. It describes 平安宮 as the 大内裏, the central precinct of 平安京,
  ten 町 north to south and eight east to west, with the 大極殿, the 内裏 and the offices; its remains
  lie buried under the city, the 内裏内郭回廊跡 and 豊楽殿跡 are national Historic Sites, and the area
  around the 大極殿 lay near today's 千本丸太町. It is a modern site identification, not a source
  statement of the ninth century.
