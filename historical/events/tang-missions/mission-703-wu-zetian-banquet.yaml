# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  則天武后 banquets 朝臣真人 (粟田眞人) in the 麟德殿 and gives him the title 司膳卿. The Tang histories describe
  his dress and say he read the classics and histories and wrote well.
types: [mission]
date:
  value: "703"
  calendar: chinese_lunisolar
  as_written: 長安三年（舊唐書）; 長安元年（新唐書）
  cite:
    - id: mission-703-banquet-time
      says: The 舊唐書 dates the embassy to 長安三年.
      source: jiu-tangshu
      at: 卷199上 東夷 日本國
      quote: 長安三年，其大臣朝臣真人來貢方物，
places:
  - place: changan
    role: site
    note: The histories name the 麟德殿, a hall of the 大明宮 in 長安.
participants:
  - actor: awata-no-mahito
    role: guest
  - actor: wu-zetian
    role: host
notes:
  The 新唐書 year is the appointment year, before the embassy sailed in 702; the record keeps the 舊唐書
  year as the date and the 新唐書 year as a conflicting claim.
dispute:
  status: disputed
  summary:
    "The two Tang histories date 粟田眞人's embassy differently: the 舊唐書 to 長安三年 (703), the 新唐書 to
    長安元年 (701), the year the embassy was appointed. The record publishes the 舊唐書 year and keeps the other
    as a conflicting claim without resolving it."
cites:
  summary:
    - id: mission-703-banquet-jiu
      says: The 舊唐書 records that 則天 banqueted him in the 麟德殿 and gave him the title 司膳卿.
      source: jiu-tangshu
      at: 卷199上 東夷 日本國
      quote: |-
        真人好讀經史，觧屬文，容止温雅。
        則天宴之於麟德殿，授司膳卿，放還本國。
    - id: mission-703-banquet-xin
      says: The 新唐書 dates 粟田's embassy to 長安元年.
      role: conflicting
      source: xin-tangshu
      at: 卷220 東夷 日本
      quote: 長安元年，其王文武立，改元曰大寶，遣朝臣真人粟田貢方物。
