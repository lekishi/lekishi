  - nebuchadnezzar-campaign-589-586: Zedekiah rebels and Nebuchadnezzar returns
  - jerusalem-siege-begins: The siege begins in the tenth month
  - lachish-azekah-hold-out: Lachish and Azekah hold out
  - egyptian-army-relieves-jerusalem: Pharaoh's army comes out and the siege is lifted
  - jerusalem-wall-breached: The city is broken up
