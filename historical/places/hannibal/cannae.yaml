# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Cannae (Κάννη), the razed Apulian town by the Aufidus whose citadel held the Roman supply depot
  that Hannibal seized in 216 BCE, and near which the battle was fought.
types: [settlement, fortification]
names:
  - form: Cannae
    lang: la
    script: Latn
    cite:
      - id: cannae-name-livy
        says: Livy writes that the consuls set out to make Cannae famous by a Roman disaster.
        source: livy
        at: "22.43.9"
        quote: ad nobilitandas clade Romana Cannas urgente fato profecti sunt
  - form: Κάννη
    lang: grc
    script: Grek
    cite:
      - id: cannae-name-polybius
        says: Polybius records Hannibal seizing the citadel of the town called Κάννη.
        source: polybius
        at: "3.107.2"
        quote: καταλαμβάνει τὴν τῆς Κάννης προσαγορευομένης πόλεως ἄκραν
at:
  - interpretation: approximate_point
    precision: locality
    point: [16.151666666, 41.296388888]
    notes: "An approximate placement at Canne della Battaglia, the hill site Pleiades identifies as
      Cannae. The battlefield is a separate question: the sources place it by the Aufidus, and on
      which bank is disputed, so the point is the town, not the battle."
    cite:
      - id: cannae-identification
        says:
          Pleiades locates the ancient place (Cannae) at the site whose modern coordinate Wikidata
          records; the point is the Wikidata coordinate (CC0), an approximate placement of the
          ancient town, not a surveyed site.
        basis: interpretation
        attributed_to: Pleiades
        sources:
          - source: pleiades
            at: place 442523 (Cannae), reprLatLong, dump 2026-10-21
          - source: wikidata
            at: Q568611 (P625), revision 2559139285
modern:
  - form: Canne della Battaglia
    lang: it
    script: Latn
    note: Modern name of the archaeological site.
external_ids:
  - system: wikidata
    id: Q568611
    license: CC0-1.0
  - system: pleiades
    id: "442523"
    license: CC BY 3.0
cites:
  summary:
    - id: cannae-razed
      says:
        Polybius says the town itself had been razed before, and that the citadel held the Romans'
        grain and supplies from the Canusium district.
      source: polybius
      at: "3.107.4"
      quote: τὴν μὲν οὖν πόλιν ἔτι πρότερον συνέβαινε κατεσκάφθαι
