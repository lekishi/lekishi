summary:
  At 迦畢試 玄奘 spends the summer retreat at the 沙落迦 monastery, said to have been built by a Han hostage
  prince, and debates for five days at the king's assembly.
types: [journey, council]
date:
  value: 629..630
  mode: window
  calendar: chinese_lunisolar
  as_written: 法師即於寺夏坐
  cite:
    - id: kapisa-retreat-630-time
      says: The biography records the summer retreat at 迦畢試 without a year.
      source: cien-zhuan
      at: 卷二（法師即於寺夏坐）
      quote: 法師即於寺夏坐
places:
  - place: kapisa
    role: site
participants:
  - actor: xuanzang
    role: leader
notes:
  The first summer retreat after the 貞觀三年 departure; the biography does not say which year it was.
  The biography gives no date for this stop. The window is the chapter's reckoning from the stays and
  seasons the biography reports between the 貞觀三年 departure and the 貞觀十九年 return; the biography's own chronology
  is not consistent (see the chapter notes), so the window is wide and the stop must never be shown at
  a midpoint.
