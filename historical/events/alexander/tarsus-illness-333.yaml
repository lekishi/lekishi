# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Alexander forces the Cilician Gates, reaches Tarsus before the satrap can burn it, and falls
  dangerously ill after bathing in the Cydnus.
types: [occurrence]
part_of: [alexander-campaigns-334]
date:
  value: 334 BCE..333 BCE
  mode: window
  calendar: julian
  as_written: Alexander therefore was seized with convulsions
  cite:
    - id: tarsus-illness-333-time
      says:
        Chinnock dates the crossing to the spring of 334 BCE and the battle of Issus to the end of October
        or beginning of November 333 BCE; this stage lies between.
      basis: conventional
      convention: Arrian's campaign seasons on the standard chronology of Alexander's reign
      sources:
        - source: arrian-anabasis
          at: II.4
        - source: arrian-anabasis
          at: I.11
          quote: (B.C. 334.) At the beginning of the spring he marched towards the Hellespont
        - source: arrian-anabasis
          at: II.11, note 266
          quote: B.C. 333; end of October or beginning of November.
    - id: tarsus-illness-333-text
      says: Arrian records Alexander's illness at Tarsus.
      source: arrian-anabasis
      at: II.4
      quote:
        Alexander therefore was seized with convulsions, accompanied with high fever and continuous
        sleeplessness.
      role: supporting
places:
  - place: tarsus
    role: site
participants:
  - actor: alexander-the-great
    role: subject
cites:
  summary:
    - id: tarsus-illness-333-cydnus
      says: Arrian reports that he bathed in the Cydnus while overheated.
      source: arrian-anabasis
      at: II.4
      quote:
        but other authors say that while he was very hot and in profuse perspiration he leaped into
        the river Cydnus and swam
