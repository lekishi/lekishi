# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "From Coptos across the desert to Berenice by camel, from watering-station to watering-station,
  mostly by night: twelve days."
types: [journey]
part_of: [pliny-india-route]
date:
  value: 48..77
  mode: window
  calendar: julian
  as_written: twelve days
  cite:
    - id: pliny-route-time
      says:
        Pliny describes the route as it runs as he writes; the Natural History was dedicated in 77 CE.
        Pliny's translators record Marcus's argument that the coincidence of 6 Mechir with the Ides of January
        shows the passage was written between 48 and 51 CE. The window encloses both readings.
      basis: interpretation
      attributed_to: J. Bostock and H. T. Riley (1855), citing Marcus
      sources:
        - source: pliny-natural-history
          at: VI.26
        - source: pliny-natural-history
          at: VI.26, note 36
places:
  - place: coptos
    role: start
  - place: berenice
    role: end
cite:
  - id: pliny-desert-leg-account
    says: Pliny says the whole journey from Coptos to Berenice takes twelve days, travelled mostly by night.
    source: pliny-natural-history
    at: VI.26
    quote: in consequence of which it takes twelve days to perform the whole journey from Coptos to Berenice.
