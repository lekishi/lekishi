# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  The brook of Kina, south of Megiddo, where the army came out of the pass and camped, and where
  the southern wing stood on the day of battle.
types: [landform]
names:
  - form: Kina
    lang: egy
    script: Latn
    cite:
      - id: kina-name
        says: The annals record the king arriving south of Megiddo on the bank of the brook of Kina.
        source: breasted-ancient-records
        at: "II, Annals of Thutmose III, first campaign: the exit from the pass (Kina)"
        quote:
          Behold, when the front had reached the exit upon this road, the shadow had turned, and when
          his majesty arrived at the south of Megiddo on the bank of the brook of Kina, the seventh hour was
          turning, measured by the sun.
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      The annals place the brook south of Megiddo. It is usually taken for the stream of the Wadi el-Lajjun,
      but no source read for this chapter says so, so no coordinate is asserted.
    cite:
      - id: kina-unlocated
        says: The annals give the brook of Kina only as south of Megiddo.
        source: breasted-ancient-records
        at: "II, Annals of Thutmose III, first campaign: the exit from the pass (Kina)"
