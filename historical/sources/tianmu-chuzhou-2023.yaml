notes:
  The article on the place names of 處州 says the prefecture set up in 589 had its seat at 括蒼縣, at the
  foot of the 括蒼 hills in present-day 古城村 of 蓮都區 in 麗水, that the Tang re-established it as 括州
  in 621, and that in 779 括州 was renamed 處州 and 括蒼縣 renamed 麗水. It reports a modern
  identification, not a source statement of the Tang period. Its title and names are given here in
  traditional forms; the article is published in simplified characters.
