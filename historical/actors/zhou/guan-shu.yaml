summary: >-
  管叔鮮, 武王's brother, enfeoffed at 管 and set with 蔡叔 to oversee 武庚 in 殷. After 武王's death he rose with 武庚 against 周公 and was put to death.
types: [person]
names:
  - form: 管叔鮮
    lang: lzh
    script: Hani
    roman: Guanshu Xian
    scheme: pinyin
    cite:
      - id: guan-shu-name
        says: The annals record that 武王 set his brothers 管叔鮮 and 蔡叔度 to assist 祿父 in governing 殷.
        source: shiji-yin-zhou
        at: 卷四 周本紀 武王（乃使其弟管叔鮮、蔡叔度相祿父治殷）
        quote: 武王為殷初定未集，乃使其弟管叔鮮、蔡叔度相祿父治殷。
roles:
