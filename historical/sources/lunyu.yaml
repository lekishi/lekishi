notes: >-
  The Analects, the sayings of Confucius collected by his disciples' schools. It gives no years and
  few places: it is cited for what happened at 匡, 陳 and 葉 and on the road, not for when. The 孔子世家
  of 史記 builds its itinerary partly from these passages.
