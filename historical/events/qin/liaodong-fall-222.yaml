# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 222 BCE Qin raised a great army under 王賁, attacked 遼東 and captured 喜, the last king of Yan, ending the state."
types: [campaign]
date:
  value: "222 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十五年（攻燕遼東，得燕王喜）; 燕王喜三十三年（秦拔遼東，虜燕王喜）"
  cite:
    - says: "The annals record 王賁 attacking 遼東 and capturing the king in 二十五年 (222 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十五年（攻燕遼東）"
      quote: "二十五年，大興兵，使王賁將，攻燕遼東，得燕王喜。"
    - says: "The hereditary house of Yan records Qin taking 遼東 and capturing the king in his thirty-third year."
      role: supporting
      source: shiji-six-states
      at: "卷三十四 燕召公世家 燕王喜三十三年（秦拔遼東）"
      quote: "三十三年，秦拔遼東，虜燕王喜，卒滅燕。"
    - says: "The comprehensive mirror records the same under 始皇帝二十五年."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十五年（使王賁攻遼東）"
      quote: "大興兵，使王賁攻遼東，虜燕王喜。"
places:
  - place: liaodong
    role: site
    note: "The region; the king's court there is not placed."
participants:
  - actor: wang-ben
    role: leader
  - actor: yan-king-xi
    role: subject
  - actor: yan-state
    role: subject
