# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  On the 4th day of the first month of the third season of year 23, the feast of his coronation,
  Thutmose III reaches Gaza, "the possession of the ruler".
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: year 23, I Shemu 4, the feast of the king's coronation
  cite:
    - id: gaza-date
      says: The annals date this to year 23, I Shemu 4, the feast of the king's coronation.
      source: breasted-ancient-records
      at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 4 (Gaza)"
      quote:
        Year 23, first month of the third season, on the fourth day, the day of the feast of the king's
        coronation, he arrived at the city, the possession of the ruler, Gaza.
places:
  - place: gaza
    role: waypoint
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: gaza-arrival
    says: The annals record the arrival at Gaza on the coronation feast.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 4 (Gaza)"
    quote:
      Year 23, first month of the third season, on the fourth day, the day of the feast of the king's
      coronation, he arrived at the city, the possession of the ruler, Gaza.
notes:
  The regnal year turns on the coronation anniversary, so year 22, IV Peret 25 and year 23, I Shemu
  4 are about ten days apart, not a year. The annals date by regnal year and the civil calendar, and the
  conversion to a BCE year depends on which chronology of the Eighteenth Dynasty is used. The window spans
  the dates usually given for year 23 of Thutmose III, from about 1482 BCE (a higher chronology) to about
  1457 BCE (the lower one most used today); Breasted's own 1906 table is within it. It is an editorial
  bound that a cited chronology must replace before approval.
