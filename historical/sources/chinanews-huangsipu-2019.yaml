notes:
  A news report on the excavation of the 黄泗浦遗址 at 張家港 by 南京博物院 from 2008. It reports that
  after the artificial ancient waterway was uncovered in 2018, the excavators identified the site, by
  comparison with the written sources, as the departure point of 鑒眞's sixth crossing recorded in the
  東征傳, and that the site was selected among the ten major archaeological discoveries of 2018. It
  reports a modern archaeological identification, not a source statement of the eighth century.
  Locators count the report's paragraphs.
