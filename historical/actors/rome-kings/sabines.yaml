# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The Sabines, the people of the hill country north-east of Rome. In Livy's tradition their women
  were seized at Rome's first games, their king Titus Tatius made war on Romulus, and the two
  peoples became one; Numa Pompilius came from the Sabine town of Cures.
types: [community]
names:
  - form: Sabini
    lang: la
    script: Latn
    cite:
      - id: sabines-name
        says: "Livy tells that the whole Sabine people came to Romulus's games with their wives and
          children."
        source: livy
        at: "1.9.9"
        quote: "iam Sabinorum omnis multitudo cum liberis ac coniugibus venit."
