# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Alexander reaches the Euphrates at Thapsacus, where Mazaeus withdraws from the bridges, crosses,
  and marches on toward the Tigris.
types: [occurrence]
part_of: [alexander-campaigns-334]
date:
  value: 331 BCE
  mode: window
  calendar: julian
  as_written: in the month Hecatombaion, in the archonship of Aristophanes
  cite:
    - id: thapsacus-crossing-331-text
      says:
        Arrian dates the arrival at Thapsacus by the Athenian month and archon; that month falls in
        331 BCE.
      source: arrian-anabasis
      at: III.7
      quote:
        Alexander arrived at Thapsacus in the month Hecatombaion, in the archonship of Aristophanes
        at Athens
    - id: thapsacus-crossing-331-time
      says:
        Chinnock converts the month Hecatombaion in the archonship of Aristophanes to June–July 331
        BCE.
      source: arrian-anabasis
      at: III.7, note 381
      quote: June-July, B.C. 331.
      basis: interpretation
      attributed_to: E. J. Chinnock
      role: supporting
places:
  - place: thapsacus
    role: site
participants:
  - actor: alexander-the-great
    role: leader
