# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The chronicle's 天平勝寶六年正月 report records that 吉備真備's ship reached 益久嶋 on 天平勝寶五年十二月七日, and
  that after leaving the island it drifted to 紀伊國牟漏埼.
types: [journey]
part_of: [return-voyage-753]
date:
  value: 753-12-07
  calendar: regnal
  as_written: 天平勝寶五年十二月七日（天平勝寶六年正月癸丑 大宰府奏）
  cite:
    - id: kibi-yaku-arrival-time
      says: The chronicle's 天平勝寶六年正月癸丑 report records that 吉備真備's ship reached 益久嶋 on 天平勝寶五年十二月七日.
      source: shoku-nihongi
      at: 卷第十九 天平勝寶六年正月癸丑
      quote: 癸丑。大宰府奏。入唐副使從四位上吉備朝臣眞備船。以去年十二月七日。來着益久嶋。
places:
  - place: yaku
    role: site
    note: The chronicle writes the island 益久嶋 where the biography writes 益救島.
participants:
  - actor: kibi-no-makibi
    role: leader
    note: The report names the ship as his.
notes:
  The date comes from a report made to the court in 天平勝寶六年正月 (754) about the previous year. The
  chapter records it as the chronicle reports it and does not merge it with the biography's
  second-ship event.
cites:
  participants:
    - id: kibi-yaku-arrival-participant
      says: The report names the ship as 吉備真備's.
      source: shoku-nihongi
      at: 卷第十九 天平勝寶六年正月癸丑
