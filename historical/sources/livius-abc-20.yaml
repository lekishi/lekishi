notes: "A late Babylonian chronicle of the kings of Akkad and after. Tablet A, lines 1–23, tell of
  Sargon: his rise, the crossing of the eastern sea, the conquest of the west in his eleventh year,
  Kazallu, the revolt of his old age, Subartu, and the soil of Babylon. The page notes that the
  mention of Babylon is an anachronism, and gives the middle-chronology dates 2334–2279 BCE for
  Sargon and 2323 for his eleventh year; those notes are cited as Livius' interpretation."
