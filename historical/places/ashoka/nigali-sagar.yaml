# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  Nigālī Sāgar in the Nepal Tarai, where a broken pillar, moved from its original place beside the stūpa
  of the Buddha Konākamana, records that Aśoka enlarged the stūpa a second time and later came in person.
types: [religious_site]
names:
  - form: Nigali Sagar
    lang: en
    script: Latn
    note: Smith writes Niglîva (Nigâlî) Sâgar.
    cite:
      - id: nigali-sagar-name
        says: >-
          Smith's table places the broken pillar on the west bank of Niglîva (Nigâlî) Sâgar, not in its original
          position.
        source: smith-asoka-1920
        at: ch. III, Existing Inscribed Pillars of Asoka
        quote: On west bank of Niglîva (Nigâlî) Sâgar, near Niglîva village in Nepalese Tarâi
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [83.095805555, 27.594916666]
    notes: >-
      Label anchor at Wikidata's coordinate for Nigali Sagar. The pillar has been moved a few miles from
      its original position, which is not known exactly.
    cite:
      - id: nigali-sagar-anchor
        says: >-
          The coordinate is the modern position recorded in Wikidata (CC0); it is a map reference, not a historical
          claim.
        source: wikidata
        at: Q55625203 (P625), revision 2489042193
