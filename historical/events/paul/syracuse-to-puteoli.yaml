# yaml-language-server: $schema=../../schema/event.schema.json
summary: "From Malta the ship puts in at Syracuse for three days, works round to Rhegium, and with a
  south wind reaches Puteoli the next day, where Paul stays seven days with the brethren."
types: [journey]
part_of:
  - paul-voyage-to-rome
date:
  value: "59..60"
  mode: window
  calendar: julian
  as_written: "Prat (1911): departure for Rome, 59; captivity at Rome, 60-62"
  cite:
    - id: syracuse-to-puteoli-date
      says: "Prat's chronology of 1911 dates the departure for Rome to 59 and the captivity at Rome
        from 60, so the voyage and the winter on Malta fall between."
      basis: interpretation
      attributed_to: F. Prat (1911)
      sources:
        - source: catholic-encyclopedia
          at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
          quote: "arrival of Festus, departure for Rome, 59"
        - source: catholic-encyclopedia
          at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
          quote: "captivity at Rome, 60-62"
places:
  - place: syracuse
    role: waypoint
  - place: rhegium
    role: waypoint
  - place: puteoli
    role: end
participants:
  - actor: paul-the-apostle
    role: subject
cite:
  - id: syracuse-three-days
    says: Acts tells that they landed at Syracuse and stayed three days.
    source: bible-kjv
    at: "Acts 28:12"
    quote: "And landing at Syracuse, we tarried there three days."
  - id: rhegium-puteoli
    says: "Acts tells that they came to Rhegium and, after a south wind, to Puteoli the next day."
    role: supporting
    source: bible-kjv
    at: "Acts 28:13"
    quote: "and came to Rhegium: and after one day the south wind blew, and we came the next day to
      Puteoli:"
notes: "Acts tells it, and the dates are Prat's 1911 reckoning, an interpretation: Acts gives no
  years."
