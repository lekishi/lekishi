summary:
  Busa, a noble and wealthy Apulian woman of Canusium who fed, clothed and paid the Roman survivors
  of Cannae, and whom the senate later honoured.
types: [person]
names:
  - form: Busa
    lang: la
    script: Latn
    cite:
      - id: busa-name-livy
        says: Livy names the Apulian woman Busa, of noble family and rich.
        source: livy
        at: "22.52.7"
        quote: mulier Apula nomine Busa, genere clara ac divitiis
