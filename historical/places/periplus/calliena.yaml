summary:
  Calliena (Kalyan), a lawful market-town under the elder Saraganus whose port was obstructed after
  Sandares took it, so that Greek ships landing there might be sent to Barygaza under guard.
types: [port]
names:
  - form: Calliena
    lang: en
    script: Latn
    cite:
      - id: calliena-name
        says: The Periplus says Calliena became a lawful market-town in the time of the elder Saraganus.
        source: periplus-erythraean-sea
        at: "52"
        quote: the city of Calliena, which in the time of the elder Saraganus became a lawful Market-town
at:
