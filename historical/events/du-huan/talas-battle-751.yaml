notes:
  "The mirror calls the city 恆羅斯城, 經行記 and 新唐書 怛邏斯 (城). The mirror's notice follows the
  fourth-month entries but carries no day; the chapter publishes the year. Army sizes are told as
  three myriads (the mirror) and two (both 李嗣業 biographies), and the chapter decides neither.
  The Arabic histories' account of the battle is not cited in this chapter. 杜環 is not named in any
  battle notice, so he is not a participant here."
dispute:
  status: disputed
  summary:
    The mirror gives the Tang army as thirty thousand men; the 李嗣業 biographies of 舊唐書 and
    新唐書 give twenty thousand. The chapter records both.
