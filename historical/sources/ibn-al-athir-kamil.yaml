notes:
  "The universal chronicle of ʿIzz al-Dīn Ibn al-Athīr (d. 1233), arranged by Hijra year. It is the
  Arabic account the chapter sets beside the Tang histories for the war of 751: under the year 133 it
  tells of a quarrel between the Ikhshīd of Farghāna and the king of al-Shāsh, a Chinese army sent at
  the Ikhshīd's request, and Ziyād b. Ṣāliḥ's victory over it at the river of Ṭarāz in Dhū l-Ḥijja
  133. It was written nearly five centuries after the events and names no earlier source for the
  notice, so it is a late witness, not a contemporary one."
