notes:
  "The Later Jin compilation of 945, used beside the mirror for 高仙芝's 石國 campaign, 李嗣業's part
  at 怛邏斯 and after, the dated court notices of 至德二載 and 乾元元年, 杜佑's presentation of 通典 in
  貞元十七年, and the western-regions account of 大食's change of house (白衣 to 黑衣) and of the
  乾元元年 raid on 廣州. It is a separate source from the 卷一九九上 record the Tang embassy chapter
  cites, so that chapter's approval is not reopened by this one."
