        says: The biography names the commander of the first beacon as 校尉王祥.
        source: cien-zhuan
        at: 卷一（將入見校尉王祥）
        quote: 將入見校尉王祥
roles:
  - role: soldier
    cite:
      - id: wang-xiang-role
        says: The biography records 王祥 sending 玄奘 on toward the fourth beacon.
        source: cien-zhuan
        at: 卷一（師從此路徑向第四烽）
        quote: 師從此路徑向第四烽
