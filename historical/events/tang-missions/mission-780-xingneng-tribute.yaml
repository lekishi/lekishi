# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The 新唐書 records an envoy 真人興能 presenting local products in 建中元年, a fine calligrapher whose paper,
  like cocoon silk, no one could identify.
types: [mission]
date:
  value: "780"
  calendar: chinese_lunisolar
  as_written: 建中元年
  cite:
    - id: mission-780-time
      says: The 新唐書 dates 真人興能's embassy to 建中元年.
      source: xin-tangshu
      at: 卷220 東夷 日本
      quote: 建中元年，使者真人興能獻方物。
places:
  - place: changan
    role: context
    note: The history names no place; the Tang court sat at 長安.
participants:
  - actor: tang-dynasty
    role: host
  - actor: japan-state
    role: guest
notes:
  The year fits 布勢清直's escort embassy, and 興能 is often read as 清直's personal name, but no cited source
  joins them, so the record does not.
cites:
  summary:
    - id: mission-780-paper
      says: The 新唐書 records that 興能 wrote a fine hand on paper like cocoon silk that no one knew.
      source: xin-tangshu
      at: 卷220 東夷 日本
      quote: 興能善書，其紙似蠒而澤，人莫識。
