# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Three days on, in the bay called the Horn of the South, the crew pursues the hairy people the interpreters call Gorillae on an island in a lake; the men escape, three women are taken, killed and flayed, and their skins brought to Carthage. Provisions failing, the fleet sails no further."
types: [occurrence]
part_of: [hanno-voyage]
date:
  value: 570 BCE..470 BCE
  mode: window
  calendar: julian
  as_written: "Τριταῖοι (on the third day)"
  cite:
    - id: southern-horn-capture-time
      says: "The account dates none of its stages; this one belongs to the undated voyage, whose window the cited commentators set between about 570 and 470 BCE."
      basis: interpretation
      attributed_to: W. H. Schoff (1913); J. Bostock and H. T. Riley (1855)
      sources:
        - source: hanno-periplus
          at: "17–18"
        - source: schoff-hanno
          at: Carthaginian Chronology
places:
  - place: notou-keras
    role: site
participants:
  - actor: hanno
    role: leader
  - actor: gorillai
    role: subject
notes: "The account's last stage and the turning point of the voyage. The violence is the account's own report."
dispute:
  status: disputed
  summary: "The Periplus says three women were taken and their skins brought to Carthage; Pliny says the skins of two were placed in the temple of Juno. The record keeps both counts."
cite:
  - id: southern-horn-account
    says: "The account says the crew took three women, who bit and scratched, killed and flayed them and brought the skins to Carthage, and sailed no further because provisions failed."
    source: hanno-periplus
    at: "18"
    quote: "Ἀποκτείναντες μέντοι αὐτάς ἐξεδείραμεν καὶ τὰς δορὰς ἐκομίσαμεν εἰς Καρχηδόνα. Οὐ γὰρ ἔτι ἐπλεύσαμεν προσωτέρω, τῶν σίτων ἡμᾶς ἐκλιπόντων."
  - id: southern-horn-pliny
    says: "Pliny says Hanno brought back the skins of two of these women, not three, and placed them in the temple of Juno."
    role: conflicting
    source: pliny-natural-history
    at: VI.36
    quote: "he placed the skins of two of these females in the temple of Juno, which were to be seen there until the capture of Carthage."
