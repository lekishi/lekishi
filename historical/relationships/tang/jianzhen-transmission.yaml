summary: "The transmission the biography itemizes: forty-eight items of texts, images, and ritual
  objects brought by 鑒眞, including the Tiantai texts, Xuanzang's 西域記, and calligraphy by 王羲之 and
  王獻之, together with the precept lineage he established. The relationship records a documented
  transfer, not an assessment of its later influence."
