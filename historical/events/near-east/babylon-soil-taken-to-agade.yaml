# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Sargon digs up the soil of the pit of Babylon and makes a counterpart of Babylon next to Agade,
  by the Chronicle of Early Kings, which says Marduk punished him for it with famine and rebellion. The
  Livius translation calls the mention of Babylon an anachronism; King (1910) cites a year-name of Shar-Gani-sharri
  founding temples in Babylon as proof the city existed.
types: [founding]
date:
  value: 2334 BCE..2279 BCE
  mode: window
  calendar: unknown
  as_written: not dated in the chronicle
  cite:
    - says: The Livius translation dates Sargon's reign to 2334–2279 BCE in the middle chronology.
      basis: interpretation
      attributed_to: Livius.org
      source: livius-abc-20
      at: tablet A, line 1, note
places:
  - place: babylon
    role: start
  - place: agade
    role: end
participants:
  - actor: sargon-of-akkad
    role: leader
cite:
  - says:
      The chronicle says Sargon dug up the dirt of the pit of Babylon and made a counterpart of Babylon
      next to Agade.
    source: livius-abc-20
    at: tablet A, lines 18–19
  - says: King notes that the late Chronicle records Sargon removing the soil from the trenches of Babylon.
    role: supporting
    basis: interpretation
    attributed_to: L. W. King (1910)
    source: king-sumer-akkad
    at: chapter VIII (the empire of Akkad)
    quote: The late Chronicle records that Sargon removed the soil from the trenches of Babylon
  - says:
      King cites the year Shar-Gani-sharri laid the foundations of temples in Babylon as proof the city
      existed then.
    role: supporting
    basis: interpretation
    attributed_to: L. W. King (1910)
    source: king-sumer-akkad
    at: chapter VIII (the empire of Akkad)
    quote: proving not only that the city of Babylon was in existence at this period
  - says: The Livius translation calls the chronicle's reference to Babylon in Sargon's reign an anachronism.
    role: conflicting
    basis: interpretation
    attributed_to: Livius.org
    source: livius-abc-20
    at: tablet A, introduction
  - says:
      The chronicle says Marduk, angry at the wrong, wiped out his family by famine and the subjects
      rebelled from east to west.
    role: conflicting
    source: livius-abc-20
    at: tablet A, lines 20–22
dispute:
  status: disputed
  summary:
    "Whether Babylon existed for Sargon to take soil from: the Livius translation calls it an anachronism,
    while King (1910) takes a year-name of Shar-Gani-sharri as proof the city stood then. The chronicle's
    account of Marduk's punishment is a religious explanation, kept as a claim about what the chronicle
    says."
part_of: [sargon-reign]
