notes:
  The entry describes 那津, also called 娜大津, as the ancient harbour of the 儺縣, presumed to have
  been at the mouth of the 那珂川 in 福岡市. It notes that the 續日本紀 has 博多大津 (博多津), and
  that whether it is the same as 那津 needs examination. It is a modern reference identification, not
  a source statement of the period.
