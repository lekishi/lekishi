# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Milkilu writes that the commissioner Yanhamu took three thousand talents from him and threatened
  his wife and sons, and asks for chariots to take them away.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1390 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reigns of Amenophis III and IV
  cite:
    - id: milkilu-accuses-yanhamu-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE and Amenhotep IV (Akhenaten)
        1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
participants:
  - actor: milkilu
    role: leader
  - actor: yanhamu
    role: subject
cite:
  - id: milkilu-basis
    says: Niebuhr quotes Milki-El on the deed done by Yanhamu.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Milki-El and Tagi"
notes: "The letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The
  Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
