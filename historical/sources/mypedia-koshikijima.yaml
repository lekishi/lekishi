notes:
  The entry describes the 甑島列島, the 上甑島, 中甑島 and 下甑島 group west of 串木野 in Kagoshima
  Prefecture, as having belonged to 薩摩国甑島郡, and records that 遣唐使 ships came ashore there. It is
  a modern reference identification, not a source statement of the eighth century.
