summary: >-
  魯, the state 武王 gave to 周公旦 at 曲阜, whose chronicle, the 春秋, dates the Spring and Autumn
  period, and whose lord Confucius served and left.
types: [state]
names:
  - form: 魯
    lang: lzh
    script: Hani
    roman: Lu
    scheme: pinyin
    cite:
      - id: lu-state-name
        says: The annals record 武王 enfeoffing 周公旦 at 曲阜, as 魯.
        source: shiji-yin-zhou
        at: 卷四 周本紀 武王（封弟周公旦於曲阜，曰魯）
        quote: 封弟周公旦於曲阜，曰魯。
notes: The state actor carries no roles; its lords are separate records where the chapters need them.
