notes:
  "玄奘's account of 138 countries, written down by 辯機 and presented to the throne in 貞觀二十年秋七月
  (646). It gives each country's name, size, distance and direction from the last, but no dates, and
  it describes countries 玄奘 only heard of beside those he visited. The chapter cites it for the
  countries' names; the order and dates of the journey come from the biography."
