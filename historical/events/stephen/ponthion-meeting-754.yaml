# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  On the feast of the Epiphany, 6 January 754, Pepin meets Stephen about three miles from his palace
  at Ponthion. He dismounts and prostrates himself with his wife, sons and nobles, and walks beside
  the pope's horse as his groom for a stretch, and they go to the palace together singing hymns.
types: [journey, mission]
part_of: [stephen-journey-753]
date:
  value: 754-01-06
  calendar: julian
  as_written: sexta Ianuarii mensis die, in Apparitionis domini Dei et salvatoris nostri Iesu Christi sacratissima solemnitate
  cite:
    - id: ponthion-meeting-754-time
      says: The life dates their arrival at the palace together to the 6th of January, the feast of the Epiphany.
      source: liber-pontificalis
      at: usque ad praefatum palatium pariter cum iamdicto rege omnes profecti sunt, sexta Ianuarii mensis die, in Apparitionis domini
places:
  - place: ponthion
    role: end
participants:
  - actor: pepin-the-short
    role: host
  - actor: stephen-ii
    role: guest
  - actor: bertrada-of-laon
    role: participant
  - actor: charlemagne
    role: participant
  - actor: carloman-i
    role: participant
cites:
  places:
    - id: ponthion-meeting-754-place
      says: The life says the king received the pope at his palace in the place called Ponticone, dismounting about three miles out.
      source: liber-pontificalis
      at: Ipseque in palatio suo, in loco qui vocatur Ponticone, ad fere trium milium spatium descendens de equo suo cum magna humilitate terrae prostratus
    - id: ponthion-meeting-754-quierzy
      says: The revised annals say instead that Pope Stephen came to King Pepin at the estate called Carisiacus (Quierzy).
      role: conflicting
      source: annales-qui-dicuntur-einhardi
      at: "s.a. 753: Eodem anno Stephanus papa venit ad Pippinum regem in villa quae vocatur Carisiacus"
  summary:
    - id: ponthion-meeting-754-strator
      says: The life says the king walked beside the pope's saddle in place of a groom for some distance.
      source: liber-pontificalis
      at: cui et vice stratoris usque in aliquantum locum iuxta eius sellarem properavit
dispute:
  status: disputed
  summary:
    The papal life puts the meeting at Ponthion, and the continuations of Fredegar have Charles bring
    the pope there; the revised annals, written after 814, put the pope's coming to the king at Quierzy.
    The chapter follows the two earlier sources and keeps the revised annals' reading as a
    conflicting claim.
notes:
  The life names the king's wife and sons without naming them; the participants are the editorial
  identification with Bertrada, Charles and Carloman.
