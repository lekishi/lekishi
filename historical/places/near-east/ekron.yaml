        at: p. 31, Oriental Institute prism col. II 73
        quote: The officials, nobles and people of Ekron,
  - form: Amqarruna
    lang: akk
    script: Latn
    note: The prism writes the name Am-ḳar-ru-na; the form is an editorial normalization.
    claim: ekron-name
