# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "Cassivellaunus, the British king whose territory lay beyond the Thames and whom the Britons chose to lead them against Caesar in 54 BCE; he sued for peace and gave hostages."
types: [person]
names:
  - form: Cassivellaunus
    lang: la
    script: Latn
    cite:
      - id: cassivellaunus-name
        says: Caesar tells that he forbade Cassivellaunus to harm Mandubracius or the Trinovantes.
        source: caesar-gallic-war
        at: "5.22"
        quote: "interdicit atque imperat Cassivellauno, ne Mandubracio neu Trinobantibus noceat."
roles:
  - role: ruler
    note: "King beyond the Thames, in Caesar's account."
