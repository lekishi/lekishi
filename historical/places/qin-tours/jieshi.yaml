summary: 碣石, on the 勃海 coast, where 始皇 had an inscription cut at the 碣石門 in 215 BCE and sent 盧生 to look for the immortals. The label anchor sits at the modern 碣石山 at 昌黎; it asserts no historical site.
types: [landform]
