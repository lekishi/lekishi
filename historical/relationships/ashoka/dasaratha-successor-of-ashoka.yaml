summary: Daśaratha, Aśoka's grandson, succeeds him in the eastern provinces.
types: [successor_of]
from: dasaratha
to: ashoka
notes: >-
  Smith calls the division of the empire between two grandsons little more than a guess; only the eastern
  succession is recorded.
cite:
  - id: dasaratha-succession-basis
    says: >-
      Smith thinks it nearly certain that in the east Aśoka was followed directly by Daśaratha.
    source: smith-asoka-1920
    at: ch. I, The History of Asoka
    quote: >-
      it appears to be nearly certain that in the cast he was followed directly by Dasaratha
