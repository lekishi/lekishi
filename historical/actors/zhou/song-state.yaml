# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  宋, the state at 商丘 that 周 gave to 微子 to continue the line of 殷 after the rebellion of 武庚.
types: [state]
names:
  - form: 宋
    lang: lzh
    script: Hani
    roman: Song
    scheme: pinyin
    cite:
      - id: song-state-name
        says: The annals record that 周公 put 微子開 in place of 武庚 as heir of 殷, with his state at 宋.
        source: shiji-yin-zhou
        at: 卷四 周本紀 成王（以微子開代殷後，國於宋）
        quote: 以微子開代殷後，國於宋。
notes: The state actor carries no roles; its lords are separate records where the chapters need them.
