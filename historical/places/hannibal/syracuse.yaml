# yaml-language-server: $schema=../../schema/place.schema.json
summary: Syracuse (Syracusae), the Greek city of eastern Sicily ruled by Hiero II, Rome's ally in the war.
types: [capital, port]
names:
  - form: Syracusae
    lang: la
    script: Latn
    cite:
      - id: syracuse-name-livy
        says: Livy records that Hiero, in his last old age, wished to leave Syracuse free.
        source: livy
        at: "24.4.2"
        quote: voluisse dicitur liberas Syracusas relinquere
at:
  - interpretation: approximate_point
    precision: locality
    point: [15.283333, 37.083333]
    notes: An approximate placement at ancient Syracuse, which Pleiades identifies as
      Syracusae/Syrakousai; the point is the city, not a building.
    cite:
      - id: syracuse-identification
        says: Pleiades locates the ancient place (Syracusae/Syrakousai) at the site whose modern
          coordinate Wikidata records; the point is the Wikidata coordinate (CC0), an approximate
          placement of the ancient town, not a surveyed site.
        basis: interpretation
        attributed_to: Pleiades
        sources:
          - source: pleiades
            at: place 462503 (Syracusae/Syrakousai), reprLatLong, dump 2026-10-21
          - source: wikidata
            at: Q4420718 (P625), revision 2549234714
modern:
  - form: Siracusa
    lang: it
    script: Latn
    note: Modern city on the site, recorded for orientation.
external_ids:
  - system: wikidata
    id: Q4420718
    license: CC0-1.0
  - system: pleiades
    id: "462503"
    license: CC BY 3.0
cites:
  summary:
    - id: syracuse-hiero
      says: Livy calls Hiero king of the Syracusans.
      source: livy
      at: "21.49.3"
      quote: ab Hierone rege Syracusanorum missae
