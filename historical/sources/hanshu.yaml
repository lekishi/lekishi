notes:
  The Eastern Han history of the Western Han. The 武帝紀 gives the absolute reign-year and season
  for each campaign, which the 史記 narrates relatively; the 張騫傳 parallels the 大宛列傳 with small
  differences that the records note where they matter. Its issue year is the conventional
  completion date after 班固's death in 92, by 班昭.
