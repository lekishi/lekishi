title: Aśoka and his edicts, 273–232 BCE
summary: >-
  From his succession in 273 BCE to his death, Aśoka had his Law of Piety cut into rocks and pillars
  from the Peshawar valley to Mysore. Follow the dated edicts, his tours to Bodh Gayā and Lumbinī,
  his claim of a conquest by the Law in the realms of five Greek kings, and the Ceylon chronicles'
  mission to Lanka.
window: 273 BCE..232 BCE
story:
  summary: >-
    The reign of Aśoka through his inscriptions, 273–232 BCE: his succession, the Kalinga war and his turn to the
    Law of Piety, the Minor Rock, Fourteen Rock and Kalinga Edicts, the tours of piety, the Pillar
    Edicts, the schism edicts, and, from the Ceylon chronicles, the council and the mission to
    Lanka.
  span: 304 BCE..229 BCE
  coverage: >-
    The inscriptions in V. A. Smith's 1920 translation, dated by their own regnal years and
    converted with Smith's chronology (consecration as year 1 in 269 BCE), with Smith's retellings
    of the Ceylon chronicles and the Aśokāvadāna as legend. Excluded: inscriptions found after
    1920 (Erragudi, Kandahar, Laghman, Gujarra, Ahraura, Sannati and others), which the cited
    edition does not contain; Chandragupta and the earlier Maurya history; the Kuṇāla and
    Tiṣyarakṣitā legends; and everything after Daśaratha's accession. No route is drawn, and the
    pillars moved by Fīrōz Tughlak are placed where they stand today.
  notes: >-
    Step order is presentation order, not a claim that one event caused another. Every BCE year is
    an interpretation: the inscriptions count years from the consecration, and Smith calls the
    Indian dates merely approximate. Each converted year is widened by three years either side,
    the error Smith allows his chronology of the reign. Events from the chronicles and the northern legend are
    marked as such and keep the chronicles' own years where Smith's table disagrees. The window opens at
    the succession, so the Taxila legend and Dionysios' embassy, which may fall in Bindusāra's
    reign, overlap it only in part.
