summary:
  Back at 那爛陀, 玄奘 writes the 會宗論 in three thousand verses to reconcile the 中觀 and 瑜伽 schools, and
  the 破惡見論 against a Hīnayāna attack on the Mahāyāna.
types: [other]
date:
  value: 641..643
  mode: window
  calendar: chinese_lunisolar
  as_written: 乃著《會宗論》三千頌
  cite:
    - id: huizong-treatise-642-time
      says: The biography records the treatise without a date.
      source: cien-zhuan
      at: 卷四（乃著《會宗論》三千頌）
      quote: 乃著《會宗論》三千頌
