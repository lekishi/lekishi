# yaml-language-server: $schema=../schema/chapter.schema.json
title: 杜環 and the 經行記
summary: In 751 a Tang army was routed by 大食 at 怛邏斯, and 杜環, who had followed it west, did not
  come home until 762, by merchant ship through 廣州. Follow the war that took him west, the 大食 lands
  his surviving fragments describe, and the 750s in which 大食 envoys and troops reached the Tang
  court and raided its southern port.
window: 750..762
story:
  summary: "杜環's west, 750–762: 高仙芝's 石國 raid and the defeat at 怛邏斯, the 大食 lands of 經行記 as
    通典 quotes it, the Tang–大食 contacts of 755–759, and 杜環's return through 廣州, with the 744
    marriage before it and the 801 presentation of 通典 after it."
  span: 744..801
  coverage: "Window 750–762: the 石國 raid and the 751 war (raid, presentation of captives, appeal,
    battle, 葛羅祿 defection, retreat), 杜環's journey west and back as 杜佑 records it, the 經行記
    fragments that describe things happening (the craftsmen and the weekly sermon at 亞俱羅, the 東道使
    at 末祿), the 大食 change of house as the Chinese entries tell it, 高仙芝's
    execution, the 大食 envoys and troops of 756–758, the 758 raid on 廣州 and 李嗣業's death. Context
    nodes outside the window, separately sourced: the 744 marriage of 和義公主 (disputed against 751),
    the 748 destruction of 碎葉, and the 801 presentation of 通典. Excluded: the Arabic accounts of the
    battle and of the change of house, the founding of Baghdad, paper-making at Samarkand, the 747
    小勃律 campaign, the 安祿山 rebellion beyond the notices that name 高仙芝, 李嗣業 or 大食, and every
    經行記 passage that only describes a land. No route is drawn: 杜環's route and the order of his
    stops are lost, and his surviving stops are at places the chapter does not locate."
  notes: "Step order is presentation order, not a claim that one event preceded or caused another;
    the 經行記 events are undated windows across 751–762 and are listed in the order 通典 quotes them,
    which is not 杜環's order. No event puts 杜環 at the battle of 751, because no source does.
    Identifications of 經行記's names with modern places (亞俱羅 with Kufa, 末祿 with Merv, 拂菻's
    royal city with Constantinople) are the usual readings but are not cited here: those places
    carry label anchors that assert no identification, and the places the sources do not locate
    (西海, 白石嶺, 苫國, 摩鄰, 相州) have none."
  steps:
