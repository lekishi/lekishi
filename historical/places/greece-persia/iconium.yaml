summary:
  Iconium, which Xenophon calls the last city of Phrygia, where Cyrus halted three days in 401
  BCE before marching through Lycaonia.
types: [settlement]
names:
  - form: Iconium
    lang: en
    script: Latn
    note: The form in the cited English translation; the gazetteer records no Greek form for this place.
    cite:
      - id: iconium-name
        says: Xenophon records the army reaching Iconium, the last city of Phrygia.
        source: xenophon-anabasis
        at: I.2
        quote:
          From this place he marched on three stages--twenty parasangs--to Iconium, the last city of
          Phrygia, where he remained three days.
at:
