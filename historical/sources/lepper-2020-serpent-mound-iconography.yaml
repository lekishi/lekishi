notes: Reviews the debate over Serpent Mound's age, reports Fletcher et al. (1996)'s AMS dates of
  920 ± 70 BP and their attribution of the mound to the Fort Ancient culture, and argues for a Late
  Prehistoric (Mississippian-period) origin.
