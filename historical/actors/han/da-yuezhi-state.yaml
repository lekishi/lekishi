# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  大月氏, the people driven west by the 匈奴 who had settled north of the 媯水 and made 大夏 their
  subject; 張騫 was sent to win them to an alliance and could not.
types: [state, community]
names:
  - form: 大月氏
    lang: lzh
    script: Hani
    roman: Da Yuezhi
    scheme: pinyin
    cite:
      - id: da-yuezhi-name
        says:
          The 大宛列傳 records that the 大月氏 were defeated by the 匈奴, moved west past 大宛, subdued 大夏,
          and set their royal court north of the 媯水.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（遂都媯水北，為王庭）
        quote: 乃遠去，過宛，西擊大夏而臣之，遂都媯水北，為王庭。
