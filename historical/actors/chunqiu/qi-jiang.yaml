summary: >-
  姜氏, the 齊 wife of 重耳, who killed the maid who overheard his followers' plan and had him made drunk and
  carried off.
types: [person]
names:
  - form: 姜氏
    lang: lzh
    script: Hani
    roman: Jiang Shi
    scheme: pinyin
    cite:
      - id: qi-jiang-name
        says: The 左傳 records that the silkworm maid told 姜氏 and that 姜氏 killed her.
        source: zuozhuan
        at: 僖公二十三年（以告姜氏）
        quote: 蠶妾在其上，以告姜氏。姜氏殺之
