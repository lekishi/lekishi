# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The king orders Megiddo surrounded with a ditch and a wall of green timber, named "Menkheperre
  is the Surrounder of the Asiatics", and watches from the fortification east of the city. The day-by-day
  record of the siege is kept on a leather roll in the temple of Amun.
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1457 BCE..1456 BCE
  mode: window
  calendar: regnal
  as_written: after year 23, I Shemu 21
  cite:
    - id: siege-of-megiddo-shaw
      says: On Shaw's chronology Thutmose III reigned 1479–1425 BCE, so his year 23 falls in
        1457–1456 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: megiddo
    role: site
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
  - actor: chief-of-kadesh
    role: subject
cite:
  - id: siege-basis
    says: The annals record the siege enclosure and its name.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the siege"
    quote:
      'They measured this city, surrounding it with an inclosure, walled about with green timber of
      all their pleasant trees. His majesty himself was upon the fortification east of this city, inspecting.
      It was walled about with its thick wall. Its name was made: "Menkheperre Thutmose III-is-the-Surrounder-of-the-Asiatics."'
  - id: siege-roll
    says: The annals say the siege was recorded day by day on a leather roll in the temple of Amun.
    role: supporting
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the siege (the leather roll)"
    quote:
      Now, all that his majesty did to this city, to that wretched foe and his wretched army, was recorded
      on each day by its the day's name. Then it was recorded upon a roll of leather in the temple of Amon
      this day.
notes: The annals give no length for the siege. Other inscriptions of the reign are often cited for
  seven months; none is read for this chapter yet. The annals date by regnal year and the civil
  calendar. The BCE years follow Shaw's chronology (The Oxford History of Ancient Egypt, 2000),
  which puts the accession of Thutmose III in 1479 BCE, so year 22 falls in 1458–1457 BCE and year
  23 in 1457–1456 BCE. Breasted's own 1906 table follows an older, higher chronology.
