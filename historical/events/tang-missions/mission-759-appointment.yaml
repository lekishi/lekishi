# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  高元度 is appointed envoy to bring back the ambassador 藤原清河, stranded in 唐 since 753. Within a month
  he leaves with the returning 渤海 envoy 揚承慶.
types: [mission]
date:
  value: 759-01
  calendar: regnal
  as_written: 天平寶字三年正月丁酉
  cite:
    - id: mission-759-appointment-time
      says: The chronicle records the appointment on 天平寶字三年正月丁酉.
      source: shoku-nihongi
      at: 卷第廿二 天平寶字三年正月丁酉
      quote: 丁酉。授正六位上高元度外從五位下。爲迎入唐大使使。
places:
  - place: heijo-palace
    role: site
    note:
      The entry names no place. A court act happens at the court, so the record anchors it at the court's
      seat for display only; it asserts no site for the act.
participants:
  - actor: ko-no-gendo
    role: leader
  - actor: fujiwara-no-kiyokawa
    role: subject
    note: The ambassador to be fetched.
cites:
  summary:
    - id: mission-759-leaves
      says: The chronicle records 高元度 leaving with the 渤海 envoy 揚承慶 on 天平寶字三年二月癸丑.
      source: shoku-nihongi
      at: 卷第廿二 天平寶字三年二月癸丑
      quote: 癸丑。揚承慶等歸蕃。高元度等亦相隨而去。
