notes:
  "Court-ordered chronicle of 833–850, the court record of the 834–839 embassy of 藤原常嗣: its appointment,
  two failed crossings, 小野篁's refusal and exile, and the return on hired Silla ships. The surviving text
  has gaps and misplaced passages, which the records note where they matter. 圓仁's diary tells the same
  embassy from on board and is cited by its own records."
