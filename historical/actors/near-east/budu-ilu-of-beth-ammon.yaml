# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Budu-ilu of Beth-Ammon, one of the kings of Amurru whom the prism lists bringing presents and
  heavy tribute to Sennacherib in 701 BCE.
types: [person]
names:
  - form: Budu-ilu
    lang: en
    script: Latn
    cite:
      - id: budu-ilu-of-beth-ammon-name
        says: The prism lists Budu-ilu among the kings who brought tribute.
        source: luckenbill-annals-sennacherib
        at: p. 30, Oriental Institute prism col. II 55
        quote: Budu-ilu, the Beth-Ammonite,
roles:
  - role: ruler
    note: Ruler of Beth-Ammon; the prism lists him among "kings of Amurru, all of them".
    cite:
      says: The prism lists Budu-ilu among the kings who brought tribute.
      source: luckenbill-annals-sennacherib
      at: p. 30, Oriental Institute prism col. II 55
      quote: Budu-ilu, the Beth-Ammonite,
