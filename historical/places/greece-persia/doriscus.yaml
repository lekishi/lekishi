summary:
  Doriscos in Thrace, a beach and plain at the mouth of the Hebros with a Persian royal fortress,
  where Xerxes numbered his army and the fleet was beached in 480 BCE.
types: [fortification]
names:
  - form: Doriscos
    lang: en
    script: Latn
    note: The form in the cited English translation; the gazetteer records no Greek form for this place.
    cite:
      - id: doriscus-name
        says: Herodotus describes Doriscos as a beach and plain in Thrace on the Hebros with a royal fortress.
        source: herodotus
        at: VII.59
        quote:
          "Now Doriscos is a sea-beach and plain of great extent in Thrace, and through it flows the
          great river Hebros: here a royal fortress had been built"
at:
