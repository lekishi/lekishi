# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  From Ocelis, with the Hippalus wind, across the open sea to Muziris, the nearest mart of India,
  in forty days; pirates hold Nitrias nearby, and Barace in the Neacyndi's country is the better port.
types: [journey]
part_of: [pliny-india-route]
date:
  value: 48..77
  mode: window
  calendar: julian
  as_written: forty days
  cite:
    - id: pliny-route-time
      says:
        Pliny describes the route as it runs as he writes; the Natural History was dedicated in 77 CE.
        Pliny's translators record Marcus's argument that the coincidence of 6 Mechir with the Ides of January
        shows the passage was written between 48 and 51 CE. The window encloses both readings.
      basis: interpretation
      attributed_to: J. Bostock and H. T. Riley (1855), citing Marcus
      sources:
        - source: pliny-natural-history
          at: VI.26
        - source: pliny-natural-history
          at: VI.26, note 36
places:
  - place: ocelis
    role: start
  - place: muziris
    role: end
  - place: bacare
    role: other
    note: Pliny's Barace, the more convenient port.
cite:
  - id: pliny-ocean-leg-account
    says: Pliny says that with the Hippalus wind Muziris can be reached in forty days.
    source: pliny-natural-history
    at: VI.26
    quote:
      If the wind, called Hippalus,32 happens to be blowing, it is possible to arrive in forty days
      at the nearest mart of India, Muziris33 by name.
