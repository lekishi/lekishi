notes:
  玄奘's answer of three years does not fit the stays the biography itself reports between 迦濕彌羅 and
  那爛陀, which add up to more; this is one of the inconsistencies behind the chapter's wide windows. The
  biography gives no date for this stop. The window is the chapter's reckoning from the stays and seasons
  the biography reports between the 貞觀三年 departure and the 貞觀十九年 return; the biography's own chronology
  is not consistent (see the chapter notes), so the window is wide and the stop must never be shown at
  a midpoint.
