# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  The pillar at Lauṛiyā near the Ararāj-Mahādeo temple in Champaran, north Bihar, carrying Pillar Edicts
  I to VI practically perfect; its capital is lost.
types: [other]
names:
  - form: Lauriya-Araraj
    lang: en
    script: Latn
    note: Smith writes Lauṛiyâ-Ararâj.
    cite:
      - id: lauriya-araraj-name
        says: >-
          Smith's table places the pillar at a hamlet of Lauṛiyâ about a mile south-west of the Ararâj-Mahadeo
          temple.
        source: smith-asoka-1920
        at: ch. III, Existing Inscribed Pillars of Asoka
        quote: of temple called Ararâj-Mahadeo, 20 miles NW. of Kesariyâ stûpa
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [84.68013, 26.55031]
    notes: >-
      Label anchor at Wikidata's coordinate for the settlement of Areraj; the pillar stands about a mile
      south-west of the temple there.
    cite:
      - id: lauriya-araraj-anchor
        says: >-
          The coordinate is the modern position recorded in Wikidata (CC0); it is a map reference, not a historical
          claim.
        source: wikidata
        at: Q582958 (P625), revision 2535891740
notes: >-
  Typed other: the place is an inscribed monument (a rock, boulder or pillar bearing Aśoka's edicts),
  which the v0 place types do not name.
