notes:
  "Caesar's own account of his eight years in Gaul, one book a year, written to be read in Rome: it
  is the commander's report, and its numbers and motives are his. Book VIII, for 51 BCE, is by his
  officer Aulus Hirtius, who says Caesar wrote one book for each year. Where the chapter reports a
  number, it says the number is Caesar's."
