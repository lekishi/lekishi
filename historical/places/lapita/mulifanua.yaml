summary: "Mulifanua on 'Upolu, Sāmoa: a submerged Lapita site found in 1973 in the spoil dredged for
  the inter-island ferry berth, the only Sāmoan site with dentate-stamped Lapita pottery."
types: [settlement]
names:
  - form: Mulifanua
    lang: en
    script: Latn
    cite:
      - id: mulifanua-name
        says:
          Petchey and Kirch say Lapita colonizers reached 'Upolu, where classic dentate-stamped Lapita
          ceramics of local manufacture were found at the submerged coastal site of Mulifanua (SU-17-1).
        source: petchey-kirch-2019
        at: Introduction
        quote:
          There is no doubt that Lapita colonizers reached the island of 'Upolu in Western Sāmoa, where
          classic dentate-stamped Lapita ceramics of local manufacture were found at the submerged coastal
          site of Mulifanua (SU-17-1)
at:
  - interpretation: approximate_point
    precision: locality
    point: [-172.046077, -13.843486]
    notes:
      The location Pofatu records for the Mulifanua dredge tailings (SU-17-1). The deposit is under
      the lagoon, so the point is approximate.
    cite:
      - id: mulifanua-location
        says: Pofatu records the Mulifanua dredge tailings, site SU-17-1, at this point.
        source: pofatu
        at: best1992_8c (location_latitude, location_longitude), v1.4
