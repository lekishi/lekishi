notes:
  "A page recalling the publication of the 夏商周斷代工程's 《夏商周年表》 on 9 November 2000. It
  reports the table's dates of about 1300 BCE for 盤庚's move to 殷 and 1046 BCE for the end of 商.
  Cited as the report of that project's chronology, one interpretation among several; the table
  itself has not been read for these records."
