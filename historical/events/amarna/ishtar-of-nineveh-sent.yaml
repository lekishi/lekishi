# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  With Amenhotep III ill, Tushratta sends the statue of Ishtar of Nineveh to Egypt, as it had been
  sent once before, so that the king may worship her and let her return.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1410 BCE..1350 BCE
  mode: window
  calendar: regnal
  as_written: late in the reign of Amenophis III
places:
  - place: nineveh
    role: start
  - place: thebes
    role: end
participants:
  - actor: tushratta
    role: leader
  - actor: amenhotep-iii
    role: host
cite:
  - id: ishtar-basis
    says: Niebuhr quotes the opening of Tushratta's letter sending Ishtar of Nineveh.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Ishtar of Nineveh"
    quote:
      '"The words of Ishtar of Nineveh, mistress of all lands. ''To Egypt, to the land that I love
      will I go, and there will I sojourn.'' Now I send her and she goes. Let my brother worship her and
      then let her go in gladness that she may return.'
  - id: ishtar-before
    says: Niebuhr says the statue had been taken from Nineveh to Thebes once before.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Ishtar of Nineveh (before)"
    quote:
      From Tushratta's answer also it appears that the statue of the goddess Ishtar had once before
      been taken from Nineveh to Thebes.
notes: "Nineveh was then within Tushratta's realm, by Niebuhr's account. The letters are undated but
  for a few dockets, and the reigns they fall in convert to BCE according to the chronology used: Amenhotep
  III's accession is put between about 1410 and 1388 BCE, and the end of Akhenaten's reign between about
  1362 and 1334 BCE. The window spans those placements for the reign in question; Niebuhr's 1903 dates
  (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall inside it. It is an editorial bound
  that a cited chronology must replace before approval."
