# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Rome, the city on the Tiber. In the tradition Livy tells, Romulus fortified the Palatine first,
  and the city grew hill by hill under its seven kings; it was the capital of the Roman state under
  the kings, the Republic and the Empire.
types: [capital, settlement]
names:
  - form: Roma
    lang: la
    script: Latn
    cite:
      - id: rome-name
        says: Livy names the city Roma, which grew on the ruins of Alba under Tullus Hostilius.
        source: livy
        at: "1.30.1"
        quote: "Roma interim crescit Albae ruinis."
at:
  - interpretation: approximate_point
    precision: locality
    point: [12.49126, 41.88998]
    notes:
      The gazetteer's representative point for the ancient city, near the Forum Romanum. It marks
      the city as a whole, not a building or the founding site, which the Palatine record carries.
    cite:
      - id: rome-location
        says: Pleiades gives this representative point for ancient Roma, with its location precision
          recorded as "related".
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 423025 (reprLatLong), dump 2026-10-21
external_ids:
  - system: pleiades
    id: "423025"
  - system: wikidata
    id: "Q220"
notes:
  Shared by every chapter set in or acting from Rome. The record is the city; the Roman state is a
  separate actor in each period (the kings, the Republic, the Empire).
