summary:
  闍爛達那, where 玄奘 studied four months with 旃達羅伐摩 on the way east and, on the way home, the royal
  seat of 烏地多 where he stayed a month.
types: [settlement]
names:
  - form: 闍爛達那
    lang: lzh
    script: Hani
    roman: Shelandana
    scheme: pinyin
    cite:
      - id: jalandhara-name
        says: The biography records 玄奘 reaching 闍爛連那.
        source: cien-zhuan
        at: 卷二（從此東北行百四五十里）
        quote: 從此東北行百四五十里，至闍爛連那國
      - id: jalandhara-xiyu
        says: The 西域記 opens its account of the country with this sentence.
        role: supporting
        source: xiyu-ji
        at: 卷第四 阇爛達羅國
        quote: 。
  - form: 闍蘭逢
    lang: lzh
    script: Hani
    note: The spelling of the return passage in this transcription.
    claim: jalandhara-name
