# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "秦舞陽, the Yan youth who accompanied 荊軻 to the Qin court carrying the map case and, the biography records, blanched with fear at the steps of the throne."
types: [person]
names:
  - form: "秦舞陽"
    lang: lzh
    script: Hani
    roman: "Qin Wuyang"
    scheme: pinyin
    cite:
      - says: "The biography records 秦舞陽 carrying the map case and his fear at the steps."
        source: shiji-six-states
        at: "卷八十六 刺客列傳（秦舞陽奉地圖柙）"
        quote: "荊軻奉樊於期頭函，而秦舞陽奉地圖柙，以次進。至陛，秦舞陽色變振恐"
roles:
  - role: envoy
    note: "Second member of the Yan embassy of 227 BCE."
    cite:
      - says: "The biography records him carrying the map case into the Qin court with 荊軻."
        source: shiji-six-states
        at: "卷八十六 刺客列傳（秦舞陽奉地圖柙）"
notes: "Not to be confused with the Qin state: 秦 is his surname."
