# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  "Zoscales, who the Periplus says governed the coast from the Calf-Eaters to the other Berber
  country: miserly and grasping, but upright and acquainted with Greek literature."
types: [person]
names:
  - form: Zoscales
    lang: en
    script: Latn
    cite:
      - id: zoscales-name
        says:
          The Periplus says the places from the Calf-Eaters to the other Berber country are governed by
          Zoscales.
        source: periplus-erythraean-sea
        at: "5"
        quote:
          These places, from the Calf-Eaters to the other Berber country, are governed by Zoscales, who
          is miserly in his ways and always striving for more, but otherwise upright, and acquainted with
          Greek literature.
roles:
  - role: ruler
    cite:
      - id: zoscales-role
        says:
          The Periplus says the places from the Calf-Eaters to the other Berber country are governed by
          Zoscales.
        source: periplus-erythraean-sea
        at: "5"
        quote:
          These places, from the Calf-Eaters to the other Berber country, are governed by Zoscales, who
          is miserly in his ways and always striving for more, but otherwise upright, and acquainted with
          Greek literature.
notes:
  Salt identified him with Za Hakale of the Abyssinian chronicle, whose dates Müller used to put
  the Periplus at 80–89 CE; Schoff doubts both the identification and the chronicle's dates.
