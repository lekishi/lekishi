summary:
  法全 of 玄法寺 transmits the 胎藏 teaching to 圓仁, from 會昌二年二月廿九日, and gives him ritual manuals
  to carry to a distant country.
types: [transmission]
from: faquan
to: ennin
date:
  value: 842-02..842-03
  mode: duration
  calendar: chinese_lunisolar
  as_written: 會昌二年二月廿九日 始受胎藏大法 — 三月 施胎藏大軌儀
cite:
  - id: faquan-ennin-transmission-basis
    says:
      The diary records beginning the 胎藏 teaching with 法全 and, the next month, 法全 giving him the 胎藏
      ritual manuals.
    sources:
      - source: nitto-guho-junrei-gyoki
        at: 卷三 會昌二年二月廿九日
        quote: 廿九日於玄法寺法全阿闍梨所。始受胎藏大法。
      - source: nitto-guho-junrei-gyoki
        at: 卷三 會昌二年三月
        quote: 施胎藏大軌儀三卷。
