summary:
  段秀實 of 汧陽, a detached commander in 751 who rebuked 李嗣業 during the night retreat from 怛邏斯
  for leaving the army behind, and then held off the pursuit and gathered the stragglers.
types: [person]
names:
  - form: 段秀實
    lang: lzh
    script: Hani
    roman: Duan Xiushi
    scheme: pinyin
    cite:
      - id: duan-xiushi-name
        says: The mirror names 段秀實 of 汧陽, a detached commander, rebuking 李嗣業 during the retreat.
        source: zizhi-tongjian-tang
        at: 卷二一六 唐紀三十二 天寶十載（別將汧陽段秀實聞嗣業之聲）
        quote: 將士相失，別將汧陽段秀實聞嗣業之聲，詬曰：「避敵先奔，無勇也；全己棄衆，不仁也。」
roles:
  - role: soldier
    note: 別將 in 751.
