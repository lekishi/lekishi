summary:
  Perinthus on the Propontis, where the army lay after leaving Byzantium in 400 BCE before taking
  service with Seuthes.
types: [settlement, port]
names:
  - form: Perinthus
    lang: en
    script: Latn
    note: The form in the cited English translation; the gazetteer records no Greek form for this place.
    cite:
      - id: perinthus-name
        says: Xenophon records the Greeks going to Perinthus.
        source: xenophon-anabasis
        at: VII.2
        quote: and with this answer Medosades departed, and the Hellenes proceeded to Perinthus.
at:
