notes:
  A free verse rendering of the Egyptian poem of the battle of Kadesh, from the ambush north-west
  of Kadesh to Ramesses' prayer to Amun and his charges. The 1914 editor's headnote says the poem
  was inscribed on the walls of five temples, one of them Karnak, beside reliefs of its scenes.
