summary: Dapur, "in the land of the Amorites", one of the cities Ramesses II took in his eighth year.
types: [settlement]
names:
  - form: Dapur
    lang: egy
    script: Latn
    note: Sayce also gives Tabor, an identification no longer accepted.
    cite:
      - id: dapur-name
        says: Sayce names Dapur among the cities captured in year 8.
        source: sayce-hittites
        at: "ch. II: the war after Kadesh"
        quote:
          in the eighth year of the Pharaoh's reign Palestine was overrun and certain cities captured,
          including Dapur or Tabor 'in the land of the Amorites,' while other campaigns were directed against
          Ashkelon, in the south, and the city of Tunep or Tennib, in the north.
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      Sayce gives only "in the land of the Amorites", and no gazetteer read for this chapter locates
      Dapur, so the record asserts no coordinate.
    cite:
      - id: dapur-unlocated
        says: Sayce places Dapur only in the land of the Amorites.
        source: sayce-hittites
        at: "ch. II: the war after Kadesh"
