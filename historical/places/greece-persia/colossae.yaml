summary:
  Colossae in Phrygia, on the Lycus above the Maeander valley, which Cyrus's army reached one stage
  after crossing the Maeander in 401 BCE.
types: [settlement]
names:
  - form: Colossae
    lang: en
    script: Latn
    note: The form in the cited English translation; the gazetteer records no Greek form for this place.
    cite:
      - id: colossae-name
        says: Xenophon records the army reaching Colossae one stage beyond the Maeander.
        source: xenophon-anabasis
        at: I.2
        quote: Crossing it, he marched through Phrygia a single stage, of eight parasangs, to Colossae
at:
