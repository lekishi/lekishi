notes:
  The entry describes the 天草諸島 of south-western Kumamoto Prefecture, with 天草下島, 天草上島, 長島
  and 大矢野島 as the main islands, and states that from the 律令 settlement the whole island group was
  the single district 肥後国天草郡 until 長島, 獅子島 and others passed to 薩摩国出水郡 in 1581. It is a
  modern reference identification, not a source statement of the eighth century.
