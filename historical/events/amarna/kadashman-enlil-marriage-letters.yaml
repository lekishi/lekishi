# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "Kadashman-Enlil I of Babylon and Amenhotep III argue over marriages: the Babylonian asks for
  an Egyptian princess and, refused, for any beautiful woman in her place; he complains his sister in the
  Egyptian harem has not been shown to his envoys."
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1410 BCE..1350 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis III
participants:
  - actor: kadashman-enlil-i
    role: participant
  - actor: amenhotep-iii
    role: participant
  - actor: kassite-babylonia
    role: participant
cite:
  - id: kadashman-reply
    says: Niebuhr quotes the Babylonian's reply to the refusal of a princess.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Kadashman-Bel"
  - id: kadashman-sister
    says: Niebuhr says Kadashman-Bel complained his sister had never been seen by his envoys.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Kadashman-Bel (the sister)"
notes:
  "No place: the letters went between Babylon and the Egyptian court, and Babylon is left to the
  Mesopotamian chapters. The letters are undated but for a few dockets, and the reigns they fall in convert
  to BCE according to the chronology used: Amenhotep III's accession is put between about 1410 and 1388
  BCE, and the end of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements
  for the reign in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about
  1380 B.C.) fall inside it. It is an editorial bound that a cited chronology must replace before approval."
