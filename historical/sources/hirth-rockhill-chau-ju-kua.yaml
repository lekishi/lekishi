notes:
  "Hirth and Rockhill's translation of 趙汝适's 諸蕃志 (1225). Note 14 to its 大秦 chapter (pp. 108–110)
  reads the fragments of 杜環's 經行記 in 通典: it takes 苫 for Sham (al-Shām, Syria), 拂菻 for Syria
  against the Constantinople reading, and 亞俱羅 for Kufa, from its Syriac name Akula. The chapter
  cites it as the modern identification of those names, a reading by its authors, not evidence of
  the eighth century."
