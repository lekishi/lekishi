# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Abdi-Heba of Jerusalem writes that Milkilu and Tagi have hired Habiru against him and that the
  royal cities will fall unless troops come this year.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1352 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
  cite:
    - id: abdi-heba-appeals-shaw
      says: On Shaw's chronology Amenhotep IV (Akhenaten) reigned 1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: jerusalem
    role: start
participants:
  - actor: abdi-heba
    role: leader
  - actor: milkilu
    role: subject
  - actor: tagi
    role: subject
  - actor: habiru
    role: subject
cite:
  - id: abdi-heba-basis
    says: Niebuhr quotes Abdikheba asking for troops or to be fetched to die before the king.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Abdikheba"
  - id: abdi-heba-foes
    says: Niebuhr names Milki-El and Tagi as his opponents who recruited Habiri.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Milki-El and Tagi"
notes: "Niebuhr does not say which king; Abdi-Heba's letters are usually put under Akhenaten. The
  letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The Oxford
  History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
