# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  The pillar near Lauṛiyā on the road from Bettiah to Nepal, Champaran, with Pillar Edicts I to VI practically
  perfect and its lion capital still in place.
types: [other]
names:
  - form: Lauriya-Nandangarh
    lang: en
    script: Latn
    cite:
      - id: lauriya-nandangarh-name
        says: >-
          Smith's table places the pillar near the large village of Lauṛiyâ on the direct road from Bettia
          to Nepal.
        source: smith-asoka-1920
        at: ch. III, Existing Inscribed Pillars of Asoka
        quote: on the direct road from Bettia to Nepal, 3 miles N. of Mathiah
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [84.408477777, 26.998477777]
    notes: Label anchor at Wikidata's coordinate for the village of Lauria Nandangarh.
    cite:
      - id: lauriya-nandangarh-anchor
        says: >-
          The coordinate is the modern position recorded in Wikidata (CC0); it is a map reference, not a historical
          claim.
        source: wikidata
        at: Q6501459 (P625), revision 2553975527
notes: >-
  Typed other: the place is an inscribed monument (a rock, boulder or pillar bearing Aśoka's edicts),
  which the v0 place types do not name.
