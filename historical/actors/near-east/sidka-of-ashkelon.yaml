summary:
  Sidka, king of Ashkelon, who the prism says had not submitted, and whom Sennacherib carried off
  to Assyria with his family and the gods of his house in 701 BCE.
types: [person]
names:
  - form: Sidka
    lang: en
    script: Latn
    cite:
      - id: sidka-of-ashkelon-name
        says: The prism names Sidka, king of Ashkelon, who had not submitted.
        source: luckenbill-annals-sennacherib
        at: p. 30, Oriental Institute prism col. II 60–61
        quote: But Sidka, king of Ashkelon, who had not submitted
roles:
