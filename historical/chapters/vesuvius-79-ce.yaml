# yaml-language-server: $schema=../schema/chapter.schema.json
title: Vesuvius
summary: "The eruption of Vesuvius in 79 CE as Pliny the Younger told it to Tacitus: the cloud seen
  from Misenum, his uncle's voyage into the ash and death at Stabiae, his own flight with his mother,
  and, from Dio, the burial of Herculaneum and Pompeii and Titus's relief for Campania."
window: 79..80
story:
  summary: "Two days on the Bay of Naples in 79 CE, told by an eyewitness writing twenty-five years
    later, and the aftermath as Cassius Dio tells it. The day of the eruption is disputed, and the
    chapter shows the dispute."
  span: 79..80
  coverage: "From the sighting of the cloud at Misenum to Titus's relief for the survivors the next
    year. Excluded: the earthquake of 62/63 that Seneca describes, the portents in Dio, the
    archaeology of Pompeii and Herculaneum, the deposits and phases of the eruption, and the fire
    at Rome in 80 as an event of its own. No ash fall, plume or affected area is drawn."
  notes: "The first four events are Pliny's account in letters 6.16 and 6.20, quoted in Latin; the
    last two are Dio's, quoted in Foster's English translation. Pliny gives the day and Dio the
    year (in his translator's sidenote); Dio's season, in Foster's translation, conflicts with
    Pliny's day, and the eruption events are marked disputed."
  steps:
    - eruption-cloud-seen-79: A cloud like a pine tree rises over the bay
    - pliny-sails-to-stabiae-79: The elder Pliny sails into the ash to Stabiae
    - death-of-pliny-the-elder-79: The elder Pliny dies on the shore at Stabiae
    - younger-pliny-flees-misenum-79: The younger Pliny and his mother flee Misenum
    - herculaneum-and-pompeii-buried-79: Herculaneum and Pompeii are buried
    - titus-relief-for-campania-80: Titus sends relief to Campania
