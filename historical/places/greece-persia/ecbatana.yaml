summary:
  Ecbatana, the Median royal city, where Alexander sent the Greek allies home in 330 BCE and where
  Hephaestion died in 324 BCE.
types: [capital]
names:
  - form: Ἐκβάτανα
    lang: grc
    script: Grek
    roman: Ecbatana
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: ecbatana-greek-name
        says: Pleiades records the ancient Greek name Ἐκβάτανα for this place.
        source: pleiades
        at: place 903021, name /places/903021/ekbatana, dump 2026-10-21
      - id: ecbatana-name
        says: Arrian records Alexander reaching Ecbatana and sending the Greek allies home.
        source: arrian-anabasis
        at: III.19
        quote:
          When Alexander reached Ecbatana, he sent the Thessalian cavalry and the other Grecian allies
          back to the sea
        role: supporting
  - form: Ecbatana
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: ecbatana-name
