# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "After his return 杜環 writes 經行記, an account of the lands its surviving fragments describe, from 拔汗那 and
  碎葉 to 大食, 苫國, 拂菻 and 摩鄰, and of their peoples, crafts and three laws (大食, 大秦 and 尋尋). The
  book is lost; it survives only where 杜佑 quotes it in 通典."
types: [founding]
date:
  value: 762..801
  mode: window
  calendar: chinese_lunisolar
  as_written: 寶應初……著經行記; 通典 貞元十七年獻
  cite:
    - id: jingxingji-composed-time
      says: 杜佑's preface says 杜環 came back in 寶應初 and wrote 經行記; 通典, which quotes it, was presented in 貞元十七年 (801).
      sources:
        - source: tongdian
          at: 卷一九一 邊防七 西戎總序（寶應初，因賈商船舶自廣州而回，著經行記）
        - source: jiu-tangshu-tang-west
          at: 卷一四七 杜佑傳（貞元十七年，自淮南使人詣闕獻之）
