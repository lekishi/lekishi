summary:
  Yabitiri, brought to Egypt as a boy and raised at the palace gate, writes that he now guards
  the gates of Gaza and Joppa for the king.
types: [other]
part_of:
  - amarna-letters-exchanged
date:
  value: 1390 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reigns of Amenophis III and IV
  cite:
    - id: yabitiri-at-gaza-and-joppa-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE and Amenhotep IV (Akhenaten)
        1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: gaza
    role: site
  - place: joppa
    role: site
participants:
  - actor: yanhamu
    role: witness
cite:
  - id: yabitiri-basis
    says: Yabitiri writes that he served at the palace gate and now guards the gates of Gaza and Joppa.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Yabitiri"
notes: "A vassal's statement of service, kept for its two places; Yabitiri himself is not given an
  actor record. The letters are undated but for a few dockets. Their reigns follow Shaw's chronology
  (The Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV
  (Akhenaten) 1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built
  about 1380 B.C.) follow an older, higher scheme."
