# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  On the next day, the 5th, the king leaves Gaza "in might, in power, and in triumph" to overthrow
  the foe.
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1457 BCE..1456 BCE
  mode: window
  calendar: regnal
  as_written: year 23, I Shemu 5
  cite:
    - id: thutmose-leaves-gaza-shaw
      says: On Shaw's chronology Thutmose III reigned 1479–1425 BCE, so his year 23 falls in
        1457–1456 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
    - id: gaza-departure-date
      role: supporting
      says: The annals date this to year 23, I Shemu 5.
      source: breasted-ancient-records
      at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 5 (departure from Gaza)"
      quote:
        Year 23, first month of the third season, on the fifth day; departure from this place in might,
        - in power, and in triumph, to overthrow that wretched foe, to extend the boundaries of Egypt
places:
  - place: gaza
    role: start
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: gaza-departure
    says: The annals record the departure from Gaza on the fifth day.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 5 (departure from Gaza)"
    quote:
      Year 23, first month of the third season, on the fifth day; departure from this place in might,
      - in power, and in triumph, to overthrow that wretched foe, to extend the boundaries of Egypt
notes: The annals date by regnal year and the civil calendar. The BCE years follow Shaw's chronology
  (The Oxford History of Ancient Egypt, 2000), which puts the accession of Thutmose III in 1479 BCE,
  so year 22 falls in 1458–1457 BCE and year 23 in 1457–1456 BCE. Breasted's own 1906 table follows
  an older, higher chronology.
