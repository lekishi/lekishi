---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  verify:
    # Everything that can fail a change: formatting, Svelte/TypeScript checks,
    # the unit and historical-contract tests, and the static build with its
    # build invariant. No service container, database, or BEAM runtime is
    # involved: the site is a static artifact.
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm first: setup-node resolves the pnpm store path for its cache, so the
      # package manager has to be on PATH. The pin lives in the `packageManager`
      # field of package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm lint

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run unit and contract tests
        run: pnpm test

      - name: Build the static artifact
        run: pnpm build

  e2e:
    # Builds the static artifact and runs the atlas browser checks against it
    # with no development server (RFD 4 AC4).
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      LEKISHI_SKIP_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the static artifact
        run: pnpm build

      - name: Browser checks against the static artifact
        run: pnpm e2e
