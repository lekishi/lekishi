# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Stephen reaches the monastery of St Maurice (Agaune), where it had been arranged that he would meet
  the Frankish king, and stays there some days.
types: [journey]
part_of: [stephen-journey-753]
date:
  value: 753-11-15..754-01-06
  mode: window
  calendar: julian
  as_written: In quo et aliquantis demorantes diebus
  cite:
    - id: saint-maurice-arrival-753-time
      says: The life gives no date; it says he stayed there some days before the king's men came.
      source: liber-pontificalis
      at: In quo et aliquantis demorantes diebus
places:
  - place: saint-maurice-agaune
    role: site
participants:
  - actor: stephen-ii
    role: leader
cites:
  places:
    - id: saint-maurice-arrival-753-place
      says: The life says he came safe to the venerable monastery of St Maurice, where he was to meet the Frankish king.
      source: liber-pontificalis
      at: ad venerabile monasterium sancti Christi martyris Mauricii, in quo et constitutus erat pariter se cum Francorum rege conveniri … advenit
notes: The king did not come; the planned meeting place became a stop where his escort met the pope.
