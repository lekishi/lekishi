# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The Carduchians, a mountain people north of the Tigris, independent of the Persian king, who
  fought the Greeks through seven days of their country in 401 BCE.
types: [community]
names:
  - form: the Carduchians
    lang: en
    script: Latn
    note: The form in the cited English translation.
    cite:
      - id: carduchians-name
        says: Xenophon records the Carduchians leaving their homes for the mountains as the Greeks came.
        source: xenophon-anabasis
        at: IV.1
        quote:
          Thereupon the Carduchians abandoned their dwelling places, and with their wives and children
          fled to the mountains
