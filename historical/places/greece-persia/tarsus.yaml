summary:
  Tarsus, the chief city of Cilicia and seat of its king Syennesis, where Cyrus's Greeks halted
  twenty days in 401 BCE and refused at first to march further.
types: [capital]
names:
  - form: Tarsus
    lang: en
    script: Latn
    note: The form in the cited English translation; the gazetteer records no Greek form for this place.
    cite:
      - id: tarsus-name
        says: Xenophon records the army reaching Tarsus, a large city of Cilicia.
        source: xenophon-anabasis
        at: I.2
        quote:
          Descending through this plain country, he advanced four stages--twenty-five parasangs--to Tarsus,
          a large and prosperous city of Cilicia.
