title: 玄奘's travels in India from 那爛陀, 636–643
summary: >-
  From 那爛陀, 玄奘 visits 王舍城 and studies five years under 戒賢, then goes east by 伊爛拏 and 瞻波 to
  三摩呾吒 and 耽摩栗底, south down the east coast to 馱那羯磔迦 and 建志補羅, north-west by 跋祿羯呫婆 and
  伐臘毗 to 缽伐多, and back to 那爛陀 and 勝軍 at 杖林山; 鳩摩羅王 summons him to 迦摩縷波, and he goes with
  戒日王 from 羯朱嗢祇羅 to the assembly at 曲女城 and the great distribution at 缽羅耶伽.
travellers:
  - actor: xuanzang
    role: leader
