# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  狐偃, 子犯 or 咎犯, 重耳's maternal uncle, who followed him through the exile, had him carried drunk out of
  齊, and swore the covenant at 郇.
types: [person]
names:
  - form: 狐偃
    lang: lzh
    script: Hani
    roman: Hu Yan
    scheme: pinyin
    cite:
      - id: hu-yan-name
        says: The 晉 house names 狐偃咎犯, 文公's maternal uncle, among his five worthy followers.
        source: shiji-chunqiu
        at: 卷三十九 晉世家 文公（狐偃咎犯，文公舅也）
        quote: 狐偃咎犯，文公舅也
  - form: 子犯
    lang: lzh
    script: Hani
    note: His courtesy name in the 左傳.
    cite:
      - id: hu-yan-zifan
        says: The 左傳 records 子犯 handing 重耳 a jade at the river.
        source: zuozhuan
        at: 僖公二十四年（子犯以璧授公子）
        quote: 及河，子犯以璧授公子
