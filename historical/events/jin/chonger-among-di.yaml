# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  重耳 lives among the 狄 for twelve years. They give him 季隗, a captive of the 廧咎如, who bears him two sons;
  he refuses an invitation home when 獻公 dies, and his brother 夷吾 takes the seat instead.
types: [process]
date:
  value: 655 BCE..644 BCE
  mode: duration
  calendar: chinese_lunisolar
  as_written: 處狄十二年
  cite:
    - id: chonger-among-di-span
      says: >-
        The stay runs from the flight in 655 BCE to the departure in 644 BCE, the table's years; the 左傳
        says twelve years.
      source: shiji-chunqiu
      at: 卷十四 十二諸侯年表 晉 惠公 七年（去翟之齊）
      quote: 七重耳聞管仲死，去翟之齊。
places:
  - place: di
    role: site
participants:
  - actor: chonger
    role: leader
  - actor: ji-wei
    role: participant
  - actor: di-people
    role: host
  - actor: hu-yan
    role: participant
  - actor: zhao-shuai
    role: participant
cite:
  - id: chonger-among-di-zuo
    says: The 左傳 records the 狄 giving 重耳 季隗, who bore him two sons, and that he stayed twelve years.
    source: zuozhuan
    at: 僖公二十三年（處狄十二年而行）
    quote: 公子取季隗，生伯鯈、叔劉。以叔隗妻趙衰，生盾。
  - id: chonger-among-di-years
    says: The 左傳 records that he stayed among the 狄 twelve years and then left.
    role: supporting
    source: zuozhuan
    at: 僖公二十三年（處狄十二年而行）
    quote: 處狄十二年而行。
