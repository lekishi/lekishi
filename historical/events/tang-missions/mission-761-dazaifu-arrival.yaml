# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  高元度 returns from 唐國, and the Tang crew under 沈惟岳 are lodged at 大宰府. The Tang emperor has asked
  for ox horn to make bows, since so many weapons were lost in the rebellion; the court orders 7,800 horns
  from six circuits and four new ships built in 安藝.
types: [journey]
date:
  value: 761-08
  calendar: regnal
  as_written: 天平寶字五年八月甲子
  cite:
    - id: mission-761-return-time
      says: The chronicle records 高元度's return on 天平寶字五年八月甲子.
      source: shoku-nihongi
      at: 卷第廿三 天平寶字五年八月甲子
      quote: 甲子。迎藤原河清使高元度等至自唐國。
places:
  - place: dazaifu
    role: end
    note: The notice says the Tang crew were lodged at 大宰府 (於大宰府安置).
participants:
  - actor: ko-no-gendo
    role: leader
  - actor: shen-weiyue
    role: guest
cites:
  summary:
    - id: mission-761-ox-horn
      says:
        The chronicle records the order for ships and 7,800 ox horns, made because the Tang emperor
        had asked for horn for bows.
      source: shoku-nihongi
      at: 卷第廿三 天平寶字五年十月辛酉
      quote: 初高元度自唐歸日。唐帝語之曰。屬祿山乱離。兵器多亡。今欲作弓。交要牛角。聞道。本國多有牛角。卿歸國。爲求使次相贈。故有此儲焉。
