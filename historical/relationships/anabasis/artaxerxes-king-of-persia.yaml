summary: Artaxerxes II as king of the Persians after the death of his father Darius II.
types: [rulership]
from: artaxerxes-ii
to: persian-empire
directionality: directed
notes: Xenophon gives no year for the accession, and none is asserted here.
cite:
  - id: artaxerxes-king-of-persia-basis
    says: Xenophon records Artaxerxes established as king after Darius's death.
    source: xenophon-anabasis
    at: I.1
    quote: Now when Darius was dead, and Artaxerxes was established in the kingdom
