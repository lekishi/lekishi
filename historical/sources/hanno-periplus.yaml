notes:
  A short Greek account of a Carthaginian voyage beyond the Pillars of Heracles, which its heading
  says Hanno dedicated in the precinct of Kronos at Carthage. It survives in a single medieval
  manuscript tradition and gives no date. Its stages are counted in days' sailing, not in years.
  Schoff's translation and the Greek he prints differ in places (section 8 reads two days in the
  Greek and twelve in the translation); the records quote both where they differ.
