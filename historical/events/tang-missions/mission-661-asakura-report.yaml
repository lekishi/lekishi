# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The envoys report to the court at 朝倉, where the empress is staying. The chronicle notes that
  耽羅's tribute to the court began at this time, and that the envoys went unrewarded because of a second
  slander by 韓智興's servant.
types: [mission]
date:
  value: 661-05-23
  calendar: chinese_lunisolar
  as_written: 五月二十三日，奉進朝倉之朝。
  cite:
    - id: mission-661-report-time
      says: 伊吉連博德書 dates the report to the 23rd of the fifth month.
      source: nihon-shoki
      at: 卷第廿六 齊明天皇七年五月 注 伊吉連博得書
      quote: 五月二十三日，奉進朝倉之朝。耽羅入朝，始於此時。
places:
  - place: asakura-palace
    role: site
participants:
  - actor: tsumori-no-kisa
    role: leader
  - actor: iki-no-hakatoko
    role: participant
  - actor: tamna
    role: guest
  - actor: japan-state
    role: host
notes: The court had moved to 朝倉橘廣庭宮 in 筑紫 for the Paekche relief war earlier that month (齊明天皇七年五月癸卯).
