# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  石布's ship is driven by contrary winds to an island in the southern sea called 爾加委, where the
  islanders kill most of those on board.
types: [occurrence]
date:
  value: 659-09-15
  calendar: chinese_lunisolar
  as_written: 十五日，日入之時
  cite:
    - id: mission-659-wreck-time
      says: 伊吉連博德書 dates the drift to sunset on the fifteenth of the ninth month.
      source: nihon-shoki
      at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
      quote: 十五日，日入之時，石布連船，橫遭逆風，飄到南海之嶋。嶋名爾加委。仍為嶋人所滅。
places:
  - place: nikawe-island
    role: site
participants:
  - actor: sakaibe-no-iwashiki
    role: subject
    note: The ambassador's ship.
notes:
  博德 says the ship was destroyed by the islanders (為嶋人所滅) and that five men escaped; 難波吉士男人書, quoted
  after it, says only that the ambassador's ship struck an island and capsized (觸嶋而覆). The two are kept
  as the chronicle gives them.
dispute:
  status: disputed
  summary: 伊吉博德 says the islanders destroyed the ship; 難波吉士男人 says it struck an island and capsized.
cites:
  notes:
    - id: mission-659-wreck-otohito
      says: 難波吉士男人書 reports that the ambassador's ship struck an island and capsized.
      role: conflicting
      source: nihon-shoki
      at: 卷第廿六 齊明天皇五年七月戊寅 注 難波吉士男人書
      quote: 向大唐大使，觸嶋而覆。
