# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Yanhamu, the Egyptian commissioner (rabisu) in Canaan, accused by Rib-Hadda and Milkilu and trusted
  by others.
types: [person]
names:
  - form: Yanhamu
    lang: akk
    script: Latn
    cite:
      - id: yanhamu-name
        says: Milki-El writes of the deed done by Yanhamu.
        source: niebuhr-tell-el-amarna-period
        at: "ch. IV: Milki-El and Tagi"
        quote:
          '"The king, my lord, shall know the deed done by Yanhamu after I had been dismissed by the
          king. Lo, he took three thousand talents from me and said to me, ''Give me thy wife and thy sons
          that I may slay them.'''
roles:
  - role: official
    note: Egyptian commissioner (rabisu) in Canaan.
