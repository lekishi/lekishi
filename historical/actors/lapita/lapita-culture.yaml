# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  "The Lapita cultural complex, named for its dentate-stamped pottery and its type site in New
  Caledonia: the first people to settle Remote Oceania, from the Bismarcks to Tonga and Sāmoa."
types: [culture]
names:
  - form: Lapita
    lang: en
    script: Latn
    note: An archaeologists' name taken from the type site, not one the people used.
    cite:
      - id: lapita-culture-name
        says:
          Petchey and Kirch say the Lapita culture is argued to have begun in the Bismarck Archipelago
          and to have reached its eastern-most extent in Tonga and Sāmoa around 2900–2750 BP.
        source: petchey-kirch-2019
        at: Introduction
        quote:
          This Lapita culture is argued to have begun in the Bismarck Archipelago possibly as early as
          3350 years ago, reaching its eastern-most extent in the Tongan and Sāmoan archipelagos around 2900–2750
          BP.
notes:
  An archaeological culture defined by its pottery, not a polity or a people with a recorded name.
  Participation in an event means only that the evidence is Lapita.
