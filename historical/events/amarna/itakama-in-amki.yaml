# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Vassals besieging rebel cities in the land of Amki write that Itakama, prince of Kadesh, came
  at the head of Hittites; Itakama answers that Namyawaza slandered him and gave the king's cities to
  the Habiru.
types: [campaign]
date:
  value: 1352 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
  cite:
    - id: itakama-in-amki-shaw
      says: On Shaw's chronology Amenhotep IV (Akhenaten) reigned 1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: kadesh
    role: context
participants:
  - actor: itakama
    role: leader
  - actor: hatti
    role: participant
  - actor: habiru
    role: subject
cite:
  - id: amki-basis
    says: The vassals write that Itakama came at the head of Hittites.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: the letters from Amki"
  - id: itakama-reply
    says: Itakama writes that Namyauza gave the king's cities in Kadesh and Ube to the Habiri.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Itakama's letter"
notes: "Amki, the Beqaa valley, is not placed. The letters are undated but for a few dockets. Their
  reigns follow Shaw's chronology (The Oxford History of Ancient Egypt, 2000): Amenhotep III
  1390–1352 BCE and Amenhotep IV (Akhenaten) 1352–1336 BCE. Niebuhr's 1903 dates (the archive about
  1400 B.C., Akhetaten built about 1380 B.C.) follow an older, higher scheme."
