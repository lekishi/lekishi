notes:
  The Book of Documents. 牧誓, 無逸, 召誥 and 洛誥 belong to the chapters scholarship generally holds
  to be early, but they are speeches set down and transmitted long after the events they frame, so
  the records cite them for what they say, not as eyewitness records. No issued year is given because
  the compilation has none that the records rely on.
