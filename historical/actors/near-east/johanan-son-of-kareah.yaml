# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Johanan son of Kareah, one of the captains who came to Gedaliah at Mizpah, and who after Gedaliah's
  murder led the remnant of Judah, Jeremiah among them, into Egypt.
types: [person]
names:
  - form: Johanan
    lang: en
    script: Latn
    cite:
      - id: johanan-son-of-kareah-name
        says: Jeremiah names Johanan son of Kareah among the captains.
        source: bible-kjv
        at: Jeremiah 43:5
        quote: But Johanan the son of Kareah, and all the captains of the forces
roles:
  - role: soldier
    note: A captain of the forces, as Jeremiah and the books of Kings call him.
    cite:
      says: The books of Kings list Johanan son of Careah among the captains of the armies.
      source: bible-kjv
      at: 2 Kings 25:23
      quote: Johanan the son of Careah
notes: The books of Kings spell his father's name Careah.
