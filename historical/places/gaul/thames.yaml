summary: The Tamesis (Thames), which Caesar says could be forded on foot in one place only, and with
  difficulty. He forced the crossing against Cassivellaunus in 54 BCE.
types: [landform]
names:
  - form: Tamesis
    lang: la
    script: Latn
    cite:
      - id: thames-name
        says: Caesar tells that he led the army to the river Tamesis, into the territory of
          Cassivellaunus.
        source: caesar-gallic-war
        at: "5.18"
        quote: Caesar cognito consilio eorum ad flumen Tamesim in fines Cassivellauni exercitum duxit
at:
