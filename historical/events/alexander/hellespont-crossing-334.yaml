# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Parmenio ferries the army from Sestos to Abydos, while Alexander sacrifices at Elaeus to Protesilaus,
  steers his own ship across, and goes up to Ilium to sacrifice to Athena.
types: [journey]
part_of: [alexander-campaigns-334]
date:
  value: 334 BCE
  mode: window
  calendar: julian
  as_written: At the beginning of the spring he marched towards the Hellespont
  cite:
    - id: hellespont-crossing-334-time
      says: Chinnock dates the march to the Hellespont to the spring of 334 BCE.
      source: arrian-anabasis
      at: I.11
      quote: (B.C. 334.) At the beginning of the spring he marched towards the Hellespont
      basis: interpretation
      attributed_to: E. J. Chinnock
    - id: hellespont-crossing-334-text
      says: Arrian records Parmenio ferrying the army from Sestus to Abydus.
      source: arrian-anabasis
      at: I.11
      quote:
        He then committed to Parmenio the duty of conveying the cavalry and the greater part of the
        infantry from Sestus to Abydus
      role: supporting
places:
  - place: sestos
    role: start
  - place: elaius
    role: waypoint
  - place: abydos-hellespont
    role: end
  - place: ilium
    role: site
participants:
  - actor: alexander-the-great
    role: leader
  - actor: parmenio
    role: participant
cites:
  places:
    - id: hellespont-crossing-334-elaeus
      says: Arrian records Alexander sacrificing at Elaeus.
      source: arrian-anabasis
      at: I.11
      quote: When he came to Elaeūs he offered sacrifice to Protesilaus upon the tomb of that hero
    - id: hellespont-crossing-334-ilium
      says: Arrian records the report of Alexander's sacrifice at Ilium.
      source: arrian-anabasis
      at: I.11
      quote: It is also said that he went up to Ilium and offered sacrifice to the Trojan Athena
      role: supporting
