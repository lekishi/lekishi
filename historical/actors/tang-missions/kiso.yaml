# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  喜娘, the daughter of the ambassador 藤原清河, who stayed in 唐; she came to Japan on the bow of the
  broken first ship in 778.
types: [person]
names:
  - form: 喜娘
    lang: ja
    script: Hani
    roman: Kiso
    scheme: hepburn
    cite:
      - id: kiso-name
        says: The chronicle names 前入唐大使藤原朝臣河清之女喜娘 among those on the bow of the first ship.
        source: shoku-nihongi
        at: 卷第卅五 寶龜九年十一月乙夘
        quote: 前入唐大使藤原朝臣河清之女喜娘
notes:
  The reading Kiso is conventional and an editorial reading aid. Her mother is not named in the sources
  read.
