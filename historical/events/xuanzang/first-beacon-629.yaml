summary:
  At the first beacon, eighty 里 on, arrows are shot at 玄奘 as he draws water; the commander 王祥 hears
  his purpose, lets him go and sends him to his kinsman at the fourth beacon.
types: [occurrence]
date:
  value: 629..630
  mode: window
  calendar: chinese_lunisolar
  as_written: 逕八十餘里，見第一烽
  cite:
