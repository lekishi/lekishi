notes:
  "Tang-court-centred history compiled in 945. One source for the whole work; each cite's locator
  names the 卷 and the entry. 卷一九九上 東夷 reports the Japanese embassies from the Tang side, at
  year granularity, and describes 朝臣仲滿 (阿倍仲麻呂) under his adopted name 朝衡. The annals (卷九,
  十), the biographies of 高仙芝, 李嗣業 and 杜佑 (卷一〇四, 一〇九, 一四七) and 卷一九八 西戎 are used for
  the 石國 campaign, 怛邏斯 and after, the court notices of 至德二載 and 乾元元年, the presentation of
  通典, and the western-regions account of 大食 and of the 乾元元年 raid on 廣州."
