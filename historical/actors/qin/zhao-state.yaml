summary: "趙, one of the six states Qin conquered. The annals record Qin's three-pronged attack in 229 BCE and the capture of its king at 邯鄲 in 228 BCE; the hereditary house of Zhao records 邯鄲 becoming Qin's in the tenth month of that year."
types: [state]
names:
  - form: "趙"
    lang: lzh
    script: Hani
    roman: Zhao
    scheme: pinyin
    cite:
      - says: "The annals record Qin raising a great army to attack 趙 in 十八年 (229 BCE)."
        source: shiji
        at: "卷六 秦始皇本紀 十八年（大興兵攻趙）"
        quote: "十八年，大興兵攻趙"
notes: "The state across its history; the chapter cites it for 229–228 BCE, and the kingdom of 代 that a Zhao prince set up afterwards is a separate actor (dai-state). The state actor carries no roles: the role vocabulary is person-oriented."
