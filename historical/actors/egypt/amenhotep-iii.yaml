# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Amenhotep III (Nebmaatre), king of Egypt of the Eighteenth Dynasty, whose foreign correspondence
  with Babylon, Mitanni and the vassals of Canaan was carried to Akhetaten.
types: [person]
names:
  - form: Nimmuria
    lang: akk
    script: Latn
    note: The cuneiform form of Nebmaatre.
    cite:
      - id: amenhotep-iii-name
        says: Niebuhr says the foreign kings address Amenophis III as Nimmuria, his throne name Neb-maat-Ra.
        source: niebuhr-tell-el-amarna-period
        at: "ch. III: the prenomen"
  - form: Amenhotep III
    lang: en
    script: Latn
    role: alternate
    note: The modern form.
roles:
  - role: ruler
