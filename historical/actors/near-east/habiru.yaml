# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The Habiru (Niebuhr's Habiri), bands of outsiders and fighters whom the vassals of Canaan accuse
  each other of hiring and whom Abdi-Heba feared would take the king's cities.
types: [community]
names:
  - form: Habiri
    lang: akk
    script: Latn
    note: Niebuhr's form.
    cite:
      - id: habiru-name
        says: Niebuhr identifies the Habiri with the Hebrews.
        source: niebuhr-tell-el-amarna-period
        at: "ch. IV: the Habiri"
notes:
  Niebuhr identifies them with the Hebrews; most later scholarship treats Habiru as a social term
  for uprooted people rather than an ethnic name. No source read here is cited for that, so the record
  keeps Niebuhr's claim as his.
