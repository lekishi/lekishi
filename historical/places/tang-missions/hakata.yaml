# yaml-language-server: $schema=../../schema/place.schema.json
summary: 博多大津, the harbour of 筑紫 that missions sailed from and returned to; 伊吉博德 calls it 筑紫大津之浦.
types: [port]
names:
  - form: 筑紫大津之浦
    lang: ja
    script: Hani
    roman: Tsukushi no Ōtsu no ura
    scheme: hepburn
    cite:
      - id: hakata-name
        says: 伊吉博德's account dates the departure from 筑紫大津之浦 to the eleventh day of the eighth month.
        source: nihon-shoki
        at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
        quote: 八月十一日，發自筑紫大津之浦。
  - form: 博多大津
    lang: ja
    script: Hani
    cite:
      - id: hakata-name-1
        says: The chronicle records the 776 ships pulling back to 博多大津.
        source: shoku-nihongi
        at: 卷第卅四 寶龜七年閏八月庚寅
        quote: 乃引還於博多大津。
  - form: 博多津
    lang: ja
    script: Hani
    cite:
      - id: hakata-name-2
        says: The chronicle records a returning 新羅 ship reaching 博多津 in 筑前國.
        source: shoku-nihon-koki
        at: 卷第八 承和六年十月丁巳
        quote: 皈着筑前國博多津。
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [130.414722, 33.591389]
    notes: Label anchor at 博多區 of 福岡 (Wikidata Q1330839). It is not an asserted historical coordinate.
    cite:
      - id: hakata-anchor
        says:
          The label anchor is placed at the coordinate recorded in Wikidata (CC0); no historical coordinate
          is asserted.
        source: wikidata
        at: Q1330839 (P625), revision 2550907041
modern:
