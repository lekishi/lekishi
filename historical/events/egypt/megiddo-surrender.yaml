# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The chiefs of the country come out to do obeisance, bringing silver, gold, lapis lazuli and malachite,
  grain, wine and cattle for the army, and the king appoints chiefs anew.
types: [occurrence]
part_of:
  - megiddo-campaign
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: after the siege of Megiddo
places:
  - place: megiddo
    role: site
participants:
  - actor: thutmose-iii
    role: host
  - actor: megiddo-coalition
    role: participant
cite:
  - id: surrender-basis
    says: The annals record the chiefs bringing their gifts and the king appointing chiefs anew.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the submission"
    quote:
      Behold, the chiefs of this country came to render their portions, to do obeisance to the fame
      of his majesty, to crave breath for their nostrils, because of the greatness of his power, because
      of the might of the fame of his majesty the country came to his fame, bearing their gifts, consisting
      of silver, gold, lapis lazuli, malachite
notes:
  The annals present the surrender as homage; who the chiefs were and what became of the chief of
  Kadesh is not said. The annals date by regnal year and the civil calendar, and the conversion to a BCE
  year depends on which chronology of the Eighteenth Dynasty is used. The window spans the dates usually
  given for year 23 of Thutmose III, from about 1482 BCE (a higher chronology) to about 1457 BCE (the
  lower one most used today); Breasted's own 1906 table is within it. It is an editorial bound that a
  cited chronology must replace before approval.
