# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Benteshina, king of Amurru, deposed after Kadesh and restored by Hattusili III, whose daughter
  he married.
types: [person]
names:
  - form: Put-akhi
    lang: en
    script: Latn
    note: Garstang's reading of an ideographic writing; he notes the name is also read Banti-shinni.
    cite:
      - id: benteshina-name
        says: Garstang names the Amorite chief Put-akhi and notes the other reading Banti-shinni.
        source: garstang-land-of-hittites
        at: "ch. VI, pp. 343–346: the Amorites, fn. 811"
  - form: Benteshina
    lang: en
    script: Latn
    role: alternate
    note: The modern reading.
roles:
  - role: ruler
    note: King of Amurru under Hittite overlordship.
