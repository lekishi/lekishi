summary:
  活國, south of the 縛芻河, seat of the 葉護可汗's eldest son 呾度設, husband of the king of 高昌's sister;
  玄奘 stayed there twice.
types: [settlement]
names:
  - form: 活國
    lang: lzh
    script: Hani
    roman: Huoguo
    scheme: pinyin
    cite:
      - id: kunduz-name
        says: The biography records 玄奘 crossing the 縛芻河 to reach 活國.
        source: cien-zhuan
        at: 卷二（自此數百里渡縛芻河）
        quote: 自此數百里渡縛芻河，至活國
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [68.8569, 36.7289]
    notes:
      Label anchor at Kunduz as recorded in Wikidata (Q108155). It is not an asserted historical coordinate;
