notes:
  The entry's history of the city of 蘇州 in 江蘇省 says the 吳 commandery was renamed 蘇州 in the Sui,
  and that at the height of the Tang, in 742, 吳縣 and the prefecture's other six counties held about
  630,000 people. It is a modern reference identification, not a source statement of the Tang period.
