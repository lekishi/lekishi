summary:
  玄奘 reaches the 菩提樹 as the rains retreat ends, weeps before it, and spends eight or nine days
  at the sites.
types: [journey]
date:
  value: 632..637
  mode: window
  calendar: chinese_lunisolar
  as_written: 法師至，禮菩提樹及慈氏菩薩所作成道時像
  cite:
    - id: bodh-gaya-636-time
      says: The biography records the visit at the end of the rains retreat, without a year.
      source: cien-zhuan
      at: 卷三（法師至，禮菩提樹及慈氏菩薩所作成）
      quote: 法師至，禮菩提樹及慈氏菩薩所作成道時像
places:
  - place: bodh-gaya
    role: site
participants:
  - actor: xuanzang
    role: leader
notes:
  The biography gives no date for this stop. The window is the chapter's reckoning from the stays
  and seasons the biography reports between the 貞觀三年 departure and the 貞觀十九年 return; the biography's own
  chronology is not consistent (see the chapter notes), so the window is wide and the stop must never
  be shown at a midpoint.
