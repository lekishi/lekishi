notes:
  "The Song comprehensive mirror's 始皇帝二十年 to 二十六年 (227–221 BCE): the 荊軻 attempt, the fall of
  薊, 大梁 and 臨淄, the Chu campaigns, and the imperial title. Its 卷六 (to 始皇帝十九年) is the
  existing `zizhi-tongjian` source. Its absolute years are given by its own year headings, and
  where it dates an act differently from the annals the records keep both."
