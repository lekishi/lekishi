# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Sandares, who took possession of Calliena, after which its port was obstructed and Greek ships
  might be sent on to Barygaza under guard.
types: [person]
names:
  - form: Sandares
    lang: en
    script: Latn
    cite:
      - id: sandares-name
        says:
          The Periplus says that since Calliena came into the possession of Sandares the port is much
          obstructed.
        source: periplus-erythraean-sea
        at: "52"
        quote: since it came into the possession of Sandares the port is much obstructed
roles:
  - role: ruler
    cite:
      - id: sandares-role
        says:
          The Periplus says that since Calliena came into the possession of Sandares the port is much
          obstructed.
        source: periplus-erythraean-sea
        at: "52"
        quote: since it came into the possession of Sandares the port is much obstructed
notes:
  Wilson identified him with Sundara Satakarni and dated the Periplus 83–84 CE (Schoff, Date of the
  Periplus).
