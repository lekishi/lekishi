# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  祖己, the 商 adviser the annals record counselling 武丁 after the pheasant omen, and later naming
  武丁's temple 高宗.
types: [person]
names:
  - form: 祖己
    lang: lzh
    script: Hani
    roman: Zu Ji
    scheme: pinyin
    cite:
      - id: zu-ji-name
        says: The annals record 祖己 telling the frightened king to set his government in order first.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝武丁（祖己曰）
        quote: 祖己曰：「王勿憂，先修政事。」
roles:
  - role: official
    note: An adviser at the 商 court; the annals give him no office title.
    cite:
      - id: zu-ji-role
        says: The annals record 祖己 instructing the king.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝武丁（祖己乃訓王曰）
