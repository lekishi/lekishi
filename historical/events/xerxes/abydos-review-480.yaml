# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At Abydos Xerxes sits on a throne of white stone on a hill and reviews the army and the fleet;
  a rowing contest is won by the Phoenicians of Sidon.
types: [occurrence]
part_of: [xerxes-invasion-480]
date:
  value: 480 BCE
  mode: window
  calendar: julian
  as_written: When Xerxes had come into the midst of Abydos
  cite:
    - id: abydos-review-480-time
      says: Grote dates the crossing of the Hellespont to the beginning of 480 BCE.
      source: grote-history-of-greece
      at: vol. V, ch. XXXIX
      quote:
        It was near the time when Xerxes was about to pass the Hellespont, in the beginning of 480
        B. C.
      basis: interpretation
      attributed_to: George Grote
    - id: abydos-review-480-text
      says: Herodotus records the review at Abydos.
      source: herodotus
      at: VII.44
      quote:
        When Xerxes had come into the midst of Abydos, he had a desire to see all the army; and there
        had been made purposely for him beforehand upon a hill in this place a raised seat of white stone
      role: supporting
places:
  - place: abydos-hellespont
    role: site
participants:
  - actor: xerxes
    role: leader
cites:
  summary:
    - id: abydos-review-480-contest
      says: Herodotus records the contest won by the Phoenicians of Sidon.
      source: herodotus
      at: VII.44
      quote:
        and when it had taken place and the Phenicians of Sidon were victorious, he was delighted both
        with the contest and with the whole armament
