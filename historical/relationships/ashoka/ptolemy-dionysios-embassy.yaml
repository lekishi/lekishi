      Smith says Dionysios was sent to India, no doubt to the Maurya court, by Ptolemy Philadelphos.
    source: smith-asoka-1920
    at: ch. I, The History of Asoka
    quote: >-
      The mission of Dionysios, who was sent to India, and no doubt to the Maurya court, by Ptolemy Philadelphos
