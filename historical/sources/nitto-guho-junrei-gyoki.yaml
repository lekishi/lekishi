notes: "圓仁's own day-by-day diary of his journey with the 838 embassy, his stay in 揚州, the 赤山
  法花院, the pilgrimage to 五臺山, the years in 長安 through the 會昌 persecution, the expulsion of
  845 and the return of 847. It is a first-person contemporary account, the best-dated itinerary of
  the period, but single-witness: it is evidence of what 圓仁 saw, heard and was told. Locators name
  the 卷 and the entry's date as the diary writes it. The diary keeps the 會昌 era into 847 (會昌七年)
  rather than 大中元年, and the 838 entries are dated by the Japanese era 承和五年."
