summary:
  班景倩, the 淮南道採訪使 (investigating commissioner of 淮南道) who in 743 acted on 如海's accusation,
  searched the temples of 揚州 and detained the Japanese monks.
types: [person]
names:
  - form: 班景倩
    lang: lzh
    script: Hani
    roman: Ban Jingqian
    scheme: pinyin
    cite:
      - id: ban-jingqian-name
        says: The biography names the 淮南道採訪使 班景倩 as the official who heard the accusation.
        source: toseiden
        at: 時淮南［道］採訪使班景倩聞卽大駭
roles:
  - role: official
    note: 淮南道採訪使, as the biography gives his office in 天寶二載.
    cite:
      - id: ban-jingqian-role
        says: The biography gives his office as 淮南道採訪使.
        source: toseiden
        at: 時淮南［道］採訪使班景倩
