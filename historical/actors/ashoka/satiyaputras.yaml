# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  The Satiyaputra, a southern frontager named only in Rock Edict II, which Smith places in the Satyamangalam
  country of Coimbatore.
types: [state]
names:
  - form: Satiyaputra
    lang: en
    script: Latn
    cite:
      - id: satiyaputras-name
        says: Smith's comment on Rock Edict II identifies the Satiyaputra.
        source: smith-asoka-1920
        at: ch. IV, The Rock Edicts (comment on Rock Edict II)
        quote: The Satiyaputra people, kingdom, or country is not mentioned elsewhere.
notes: >-
  Recorded as a state because the edicts name them as kingdoms beyond the frontier; Smith is unsure whether
  some are peoples or countries.
