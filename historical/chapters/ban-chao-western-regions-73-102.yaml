# yaml-language-server: $schema=../schema/chapter.schema.json
title: 班超 in the Western Regions, 73–102 CE
summary:
  In 73 CE 班超 leaves his copyist's desk for the 匈奴 war, burns the 匈奴 envoys' camp at 鄯善 with thirty-six
  men, and spends thirty-one years winning the oasis kingdoms one by one. He becomes 都護 at 龜茲, sends
  甘英 toward 大秦, and asks only to enter the 玉門關 alive.
window: 73..102
include: [western-regions-protectorate, yuezhi-tribute]
story:
  summary:
    "班超 in the Western Regions, 73–102 CE: the first battle at 蒲類海, the night attack at 鄯善, the
    submission of 于窴 and 疏勒, the loss of the 都護 陳睦, the long campaigns against 姑墨, 莎車 and the
    月氏, the protectorate at 龜茲, the conquest of 焉耆, 甘英's mission toward 大秦, and the return home."
  span: 73..102
  coverage:
    "班超's career in the 後漢書's biography (卷四十七) with the 西域傳 (卷八十八) for dates and for 甘英.
    Excluded: the minor revolts and executions the biography lists between campaigns, 李邑's
    accusations, 班勇's later campaigns, and the protectorate after 102 CE. The kingdoms carry label
    anchors at the modern oases usually identified with them; 條支 and 大秦 carry no position, so
    甘英's journey ends unlocated."
  notes:
    "Step order is presentation order. Several years are reconstructed from the biography's chain of
    relative years; the 莎車 campaign is a two-year window, and the seizure of 兜題 is disputed between
    the biography and the 西域傳. Months are the source's lunisolar months."
  steps:
    - puleihai-battle-73: 班超's first battle, at 蒲類海, 73 CE
    - shanshan-night-attack-73: The night attack on the 匈奴 envoys at 鄯善, 73 CE
    - yutian-submission-73: 于窴 submits after 班超 kills the shaman, 73 CE
    - shule-coup-74: 班超 makes 忠 king of 疏勒, 74 CE — a disputed date
    - chen-mu-killed-75: 焉耆 and 龜茲 kill the 都護 陳睦, 75 CE
    - ban-chao-turns-back-76: Recalled, 班超 turns back at 于窴, 75–76 CE
    - gumo-shicheng-78: The storming of 姑墨's 石城, 78 CE
    - fanchen-defeat-80: 徐幹 arrives; the rebel 番辰 is beaten, 80 CE
    - shache-surrender-88: The feint and the surrender of 莎車, 87–88 CE
    - yuezhi-attack-90: The 月氏 army of seventy thousand starves, 90 CE
    - yuezhi-tribute: The 月氏 send tribute every year
    - protector-general-91: 班超 becomes 都護 at 龜茲, 91 CE
    - western-regions-protectorate: The protectorate of the Western Regions under 班超
    - yanqi-conquest-94: The conquest of 焉耆, 94 CE
    - gan-ying-mission-97: 甘英 is sent toward 大秦 and turns back at 條支, 97 CE
    - ban-chao-petition-100: '"Only to enter the 玉門關 alive": 班超 asks to come home, 100 CE'
    - ban-chao-return-102: 班超 reaches 洛陽 and dies, 102 CE
