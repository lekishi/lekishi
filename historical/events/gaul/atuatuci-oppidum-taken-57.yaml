# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The Atuatuci, too late for the Sambre, gathered in one stronghold ringed by cliffs. When
  Caesar's siege tower moved, they surrendered, threw arms from the wall and kept some back, and
  attacked by night. Caesar sold the whole town the next day; the buyers counted 53,000 people."
types: [campaign]
date:
  value: 57 BCE
  mode: window
  calendar: julian
  as_written: "the year of book II (one commentary a year, from 58 BCE)"
  cite:
    id: atuatuci-oppidum-taken-57-year
    says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by
      the consuls of 58 BCE, so each book is one year from 58 BCE."
    sources:
      - source: caesar-gallic-war
        at: "1.6"
        quote: "L. Pisone, A. Gabinio consulibus."
      - source: caesar-gallic-war
        at: "8.48"
        quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
places:
  - place: atuatuci-oppidum
    role: site
    cite:
      id: atuatuci-oppidum-place
      says: Caesar tells that the Atuatuci abandoned their other towns and gathered everything in one stronghold.
      source: caesar-gallic-war
      at: "2.29"
      quote: cunctis oppidis castellisque desertis sua omnia in unum oppidum egregie natura munitum contulerunt.
participants:
  - actor: julius-caesar
    role: leader
  - actor: atuatuci
    role: subject
cite:
  - id: atuatuci-oppidum-sale
    says: "Caesar tells that he sold the whole town as booty, and the buyers reported 53,000 head."
    source: caesar-gallic-war
    at: "2.33"
    quote: Ab iis qui emerant capitum numerus ad eum relatus est milium LIII.
notes: "Caesar's own account. The stronghold is not identified, so the event has no position on the
  map."
