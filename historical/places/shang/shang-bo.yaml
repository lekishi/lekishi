# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  亳, the old seat of 成湯 that the Han annals say 盤庚 returned to south of the Yellow River, and that
  武乙 later left for the north. The annals give no position, the name was used for several places,
  and the record asserts no coordinate.
types: [capital]
names:
  - form: 亳
    lang: lzh
    script: Hani
    roman: Bo
    scheme: pinyin
    cite:
      - id: shang-bo-name
        says: The annals record that 盤庚 crossed to the south of the Yellow River and governed from 亳.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝盤庚（乃遂涉河南，治亳）
        quote: 乃遂涉河南，治亳，行湯之政，然後百姓由寧，殷道復興。
at:
  - interpretation: unknown
    precision: unspecified
    notes: The annals place 亳 south of the river and give nothing more; no identification is adopted.
    cite:
      - id: shang-bo-unknown
        says: The annals name 亳 as 成湯's former seat south of the Yellow River and state no position for it.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝盤庚（盤庚渡河南，復居成湯之故居）
notes: >-
  The record exists so that the annals' account of 盤庚's capital can be shown beside the Bamboo
  Annals' 殷; it is not an identification of any excavated city.
