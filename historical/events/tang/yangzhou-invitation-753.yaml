# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The envoys 藤原朝臣清河, 大伴宿禰胡麿, 吉備朝臣真備, and 安倍朝臣朝衡 come to 鑒眞 at 延光寺 in 揚州 and ask him to carry
  the precepts to Japan; the biography records his consent.
types: [mission, exchange]
date:
  value: 753-10-15
  calendar: chinese_lunisolar
  as_written: 天寶十二載十月十五日壬午
  cite:
    - id: yangzhou-invitation-time
      says:
        The biography records the envoys coming to 鑒眞 at 延光寺 on 天寶十二載十月十五日壬午 and asking him to carry
        the precepts to Japan.
      source: toseiden
      at: 天寶十二載，歲次癸巳，十月十五日壬午
places:
  - place: yangzhou
    role: site
    note: The biography names 延光寺 within 揚州.
participants:
  - actor: jianzhen
    role: host
  - actor: fujiwara-no-kiyokawa
    role: leader
  - actor: otomo-no-komaro
    role: participant
  - actor: kibi-no-makibi
    role: participant
  - actor: abe-no-nakamaro
    role: participant
    note: Named in the biography by his adopted name 安倍朝臣朝衡.
notes: The passage names the envoys with Tang titles and is the chapter's clearest documented
  encounter. The biography is a later, commemorative account; the encounter is published as what it
  reports.
cites:
  participants:
    - id: yangzhou-invitation-participants
      says: The same passage names 藤原朝臣清河, 大伴宿禰胡麿, 吉備朝臣真備, and 安倍朝臣朝衡 as the envoys who came.
      source: toseiden
      at: 天寶十二載，歲次癸巳，十月十五日壬午
