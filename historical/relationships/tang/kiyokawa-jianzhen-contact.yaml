summary:
  The encounter at 延光寺 in 揚州 on 天寶十二載十月十五日 (753), when the envoys asked 鑒眞 to carry the
  precepts to Japan and he consented. The relationship records the meeting and the request, not its
  outcome.
types: [contact]
from: fujiwara-no-kiyokawa
to: jianzhen
date:
  value: 753-10-15
  calendar: chinese_lunisolar
  as_written: 天寶十二載十月十五日壬午，來［至］延光寺
notes: The chapter records the encounter as contact; it does not assert that the meeting caused the
  transmission or any later development.
cite:
  - id: kiyokawa-jianzhen-contact-basis
    says:
