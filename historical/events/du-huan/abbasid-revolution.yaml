# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "In the western-regions entries, 波悉林 of 呼羅珊 raises an army whose followers wear black, captures
  and kills the 大食 ruler 末換, and sets up 阿蒲羅拔; from him on the house is called 黑衣大食. The
  Chinese entries do not date it: they place it between the 開元 embassies and the envoys of 至德初."
types: [process]
date:
  value: 713..756
  mode: window
  calendar: unknown
  as_written: 舊唐書不繫年（敘於開元初遣使之後、至德初遣使之前）
  cite:
    - id: abbasid-revolution-time
      says: The western-regions entry tells the rising after the 開元 embassies and before the envoys of 至德初, without a year.
      source: jiu-tangshu-tang-west
      at: 卷一九八 西戎 大食國（一云隋開皇中……至德初遣使朝貢）
      quote: 鼓行而西，生擒末換，殺之。遂求得奚深種阿蒲羅拔，立之。
participants:
  - actor: abu-muslim
    role: leader
    cite:
      - id: abbasid-revolution-leader
        says: Both histories name 波悉林 of 呼羅珊 as the leader of the black-clad rising.
        sources:
          - source: jiu-tangshu-tang-west
            at: 卷一九八 西戎 大食國（有呼羅珊木粗人並波悉林舉義兵）
          - source: xin-tangshu-tang-west
            at: 卷二二一下 西域下 大食（有呼羅珊木鹿人並波悉林將討之）
  - actor: marwan
    role: subject
  - actor: abu-al-abbas
    role: participant
  - actor: umayyad-dynasty
    role: subject
  - actor: abbasid-dynasty
    role: participant
notes:
  "The window is the entry's own placement and is deliberately wide: the Arabic histories date the
  change of house to AH 132 (750 CE), but they are not cited in this chapter, so the event does not
  borrow their year. 舊唐書 reads 木粗 and 新唐書 木鹿 for 波悉林's home; neither is tied to a place
  record."
