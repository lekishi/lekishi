# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "Gaius Iulius Caesar (100–44 BCE), consul in 59 BCE and proconsul of the Gallic provinces
  from 58 to 50 BCE, who conquered Gaul and wrote the commentaries on its war; he crossed the
  Rubicon in 49 BCE and ruled Rome as dictator until his murder."
types: [person]
names:
  - form: C. Iulius Caesar
    lang: la
    script: Latn
    note: The commentaries call him Caesar throughout; the full form is editorial.
    cite:
      - id: julius-caesar-name
        says: Hirtius writes that Caesar composed one commentary for each year of the war.
        source: caesar-gallic-war
        at: "8.48"
        quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
roles:
  - role: official
    note: "Proconsul in Gaul, 58–50 BCE, in his own account."
notes: "Shared by every chapter in which Caesar acts. In this chapter he is both the commander and
  the author of the main source, and the events say so where his numbers or motives are reported."
