notes:
  "The record names 奢羯羅 as context only: the biography places the forest east of 那羅僧訶城, which has
  no record. The biography gives no date for this stop. The window is the chapter's reckoning from the
  stays and seasons the biography reports between the 貞觀三年 departure and the 貞觀十九年 return; the biography's
  own chronology is not consistent (see the chapter notes), so the window is wide and the stop must never
  be shown at a midpoint."
