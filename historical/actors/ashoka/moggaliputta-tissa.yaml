# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  Moggaliputta Tissa (Smith's Tishya son of Moggali), Aśoka's spiritual director in the Ceylon chronicles,
  who expels the heretics, presides over the Third Council at Pāṭaliputra and sends out the missions.
types: [person]
names:
  - form: Tishya son of Moggali
    lang: en
    script: Latn
    note: Smith's rendering; the Pali is Moggaliputta Tissa.
    cite:
      - id: moggaliputta-name
        says: >-
          Smith's retelling calls the king's spiritual director Tishya son of Moggali (Mudgalya).
        source: smith-asoka-1920
        at: ch. VI, The Ceylonese Legend of Asoka
        quote: his spiritual direetor, Tishya son of Moggali (Mudgâlya)
roles:
  - role: monk
notes: >-
  Smith doubts the separate existence of the Ceylon chronicles' Tissa from the Upagupta of the northern
  legends.
