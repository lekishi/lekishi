notes: An article by a curator of the National Museum of China on how the date of the conquest was
  fixed. It reports that the 夏商周斷代工程's 2022 report dates the conquest to 20 January 1046 BCE, a
  date reached by astronomical calculation. Cited as the report of that project's chronology, which
  is one interpretation among several, not as a source statement.
