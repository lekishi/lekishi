summary:
  Watson Brake, an earthen mound complex of eleven mounds in northeastern Louisiana, about 80 km
  southwest of Poverty Point.
types:
  - other
names:
  - form: Watson Brake
    lang: en
    script: Latn
    cite:
      id: watson-brake-name
      says:
        The nomination names Watson Brake in northeastern Louisiana, about 80 km southwest of Poverty
        Point, with eleven earthen mounds.
      source: poverty-point-nomination
      at: PDF p. 116, 3.2 Comparative analysis, Table 3.2
at:
