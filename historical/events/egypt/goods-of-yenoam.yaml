# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "Afterwards the king takes the household goods of the foe in Yenoam, Nuges and Herenkeru, with
  the goods of the cities that submitted: lords, 87 children of the foe and the chiefs, 1,796 slaves,
  and furniture of ivory, ebony and gold, among them a statue of the foe in ebony and gold."
types: [exchange]
part_of:
  - megiddo-campaign
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: afterward
places:
  - place: yenoam
    role: site
  - place: nuges
    role: site
  - place: herenkeru
    role: site
participants:
  - actor: thutmose-iii
    role: leader
  - actor: chief-of-kadesh
    role: subject
cite:
  - id: yenoam-goods
    says: The annals list what was taken afterward from the foe's household in Yenoam, Nuges and Herenkeru.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the later list (Yenoam, Nuges, Herenkeru)"
    quote:
      List of that which was afterward taken by the king, of the household goods of that foe who was
      in the city of Yenoam, in Nuges, and in Herenkeru, together with all the goods of those cities which
      submitted themselves
notes:
  The annals date by regnal year and the civil calendar, and the conversion to a BCE year depends
  on which chronology of the Eighteenth Dynasty is used. The window spans the dates usually given for
  year 23 of Thutmose III, from about 1482 BCE (a higher chronology) to about 1457 BCE (the lower one
  most used today); Breasted's own 1906 table is within it. It is an editorial bound that a cited chronology
  must replace before approval.
