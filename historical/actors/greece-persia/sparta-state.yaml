# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The Lacedemonian state, whose kings and citizens led the Greek alliance against Xerxes on land
  and at sea. Xenophon's Ten Thousand later served its commanders.
types: [state]
names:
  - form: the Lacedemonians
    lang: en
    script: Latn
    note: The form in the cited English translation.
    cite:
      - id: sparta-state-name
        says: Herodotus records the allies insisting on a Lacedemonian leader.
        source: herodotus
        at: VIII.2
        quote:
          the allies said that they would not follow the lead of the Athenians, but unless a Lacedemonian
          were leader they would break up the expedition
