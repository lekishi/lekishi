# yaml-language-server: $schema=../../schema/relationship.schema.json
summary: >-
  The Maurya conquest and annexation of Kalinga in Aśoka's eighth year after consecration, and the province's
  government afterwards through Tosalī and Samāpā.
types: [conflict, changed_boundaries]
from: maurya-empire
to: place:kalinga
notes: >-
  No boundary is drawn. The relationship asserts no causation between the war and Aśoka's devotion to
  the Law; the edict asserts it of itself.
cite:
  - id: maurya-kalinga-basis
    says: Rock Edict XIII records the conquest and the annexation of the Kalingas.
    source: asoka-inscriptions
    at: Rock Edict XIII, Shāhbāzgaṛhi text
    quote: >-
      Directly after the Kalingas had been annexed began His Sacred Majesty’s zealous protection of the
      Law of Piety
