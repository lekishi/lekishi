# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Herenkeru, one of the three cities of the chief of Kadesh whose household goods the king took
  after Megiddo.
types: [settlement]
names:
  - form: Herenkeru
    lang: egy
    script: Latn
    cite:
      - id: herenkeru-name
        says: The annals list Herenkeru among the cities from which the foe's goods were taken.
        source: breasted-ancient-records
        at: "II, Annals of Thutmose III, first campaign: the later list (Yenoam, Nuges, Herenkeru)"
        quote:
          List of that which was afterward taken by the king, of the household goods of that foe who
          was in the city of Yenoam, in Nuges, and in Herenkeru, together with all the goods of those cities
          which submitted themselves
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      The annals give Herenkeru only in the booty list. No source read for this chapter locates it,
      so the record asserts no coordinate.
    cite:
      - id: herenkeru-unlocated
        says: The annals name Herenkeru without describing where it lay.
        source: breasted-ancient-records
        at: "II, Annals of Thutmose III, first campaign: the later list (Yenoam, Nuges, Herenkeru)"
