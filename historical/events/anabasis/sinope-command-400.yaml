# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Sailing from Cotyora, the army puts in at Harmene, the harbour of Sinope, where Cheirisophus
  rejoins it and is chosen sole commander after Xenophon declines.
types: [council]
part_of: [cyrus-expedition-401]
date:
  value: 400 BCE
  mode: window
  calendar: julian
  as_written: they chose Cheirisophus
  cite:
    - id: sinope-command-400-time
      says:
        Grote dates the sight of the sea to February 400 BCE and the crossing to Byzantium to October
        or November 400 BCE; the halt at Sinope lies between.
      basis: interpretation
      attributed_to: George Grote
      sources:
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: in the first half of February, the time of Xenophon’s visit
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            and ultimately brought them across the Bosphorus of Thrace to Byzantium, in October or November,
            400 B.C.
    - id: sinope-command-400-text
      says: Xenophon records the choice of Cheirisophus.
      source: xenophon-anabasis
      at: VI.1
      quote: Under these circumstances they chose Cheirisophus
      role: supporting
places:
  - place: sinope
    role: site
participants:
  - actor: cheirisophus
    role: leader
  - actor: xenophon
    role: participant
  - actor: cyreans
    role: participant
cites:
  places:
    - id: sinope-command-400-harbour
      says: Xenophon records the army mooring at Harmene near Sinope.
      source: xenophon-anabasis
      at: VI.1
      quote:
        And on the following day, arriving at Sinope, they came to moorings in the harbour of Harmene,
        near Sinope .
