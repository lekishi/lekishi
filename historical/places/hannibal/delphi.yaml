# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Delphi, the sanctuary of Apollo to which Rome sent Quintus Fabius Pictor after Cannae to ask how
  the gods might be appeased.
types: [religious_site, settlement]
names:
  - form: Delphi
    lang: la
    script: Latn
    cite:
      - id: delphi-name-livy
        says: Livy records Fabius Pictor being sent to the oracle at Delphi.
        source: livy
        at: "22.57.5"
        quote: Q. Fabius Pictor Delphos ad oraculum missus est
at:
  - interpretation: approximate_point
    precision: locality
    point: [22.501666666, 38.482222222]
    notes:
      An approximate placement at the archaeological site of Delphi, which Pleiades identifies with
      the ancient sanctuary town.
    cite:
      - id: delphi-identification
        says:
          Pleiades locates the ancient place (Delphi) at the site whose modern coordinate Wikidata
          records; the point is the Wikidata coordinate (CC0), an approximate placement of the
          ancient town, not a surveyed site.
        basis: interpretation
        attributed_to: Pleiades
        sources:
          - source: pleiades
            at: place 540726 (Delphi), reprLatLong, dump 2026-10-21
          - source: wikidata
            at: Q75459 (P625), revision 2546861454
modern:
  - form: Δελφοί
    lang: el
    script: Grek
    note: Modern name of the site and village, recorded for orientation.
external_ids:
  - system: wikidata
    id: Q75459
    license: CC0-1.0
  - system: pleiades
    id: "540726"
    license: CC BY 3.0
