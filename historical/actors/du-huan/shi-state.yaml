# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  石國, the kingdom on the 藥殺水 with its seat at 柘折城, which 高仙芝 raided in 750. Its prince's
  appeal to the western peoples and to 大食 is what the histories give as the cause of the 751 war.
types: [state]
names:
  - form: 石國
    lang: lzh
    script: Hani
    roman: Shiguo
    scheme: pinyin
    cite:
      - id: shi-state-name
        says: 通典's entry for 石國 says it lies on the 藥殺水 with its seat at 柘折城.
        source: tongdian
        at: 卷一九三 邊防九 石國
        quote: 石國，隋時通焉。居於藥殺水，都柘折城，方十餘里。
  - form: 石
    lang: lzh
    script: Hani
    note: The Song history's short form; it also gives 柘支, 柘折 and 赭時.
    cite:
      - id: shi-state-xin
        says: The western-regions entry heads it 石, also called 柘支, 柘折 and 赭時.
        source: xin-tangshu-tang-west
        at: 卷二二一下 西域下 石
        quote: 石，或曰柘支，曰柘折，曰赭時，漢大宛北鄙也。
notes: The state is distinct from its king (車鼻施) and from its seat, which is a place record.
