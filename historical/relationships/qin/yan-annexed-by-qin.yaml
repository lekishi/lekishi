    quote: "三十三年，秦拔遼東，虜燕王喜，卒滅燕。"
  - says: "The six-states table records Qin capturing the king, taking 遼東 and destroying Yan."
    role: supporting
    source: shiji
    at: "卷十五 六國年表 秦始皇二十五年（燕 三十三）"
    quote: "三十三。秦虜王喜，拔遼東，秦滅燕。"
