# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  志遠, the senior Tendai master of 大華嚴寺 at 五臺山. 圓仁 met him on 開成五年五月十六日 (840), presented
  the 延暦寺's thirty unresolved questions, and copied Tendai texts at his monastery.
types: [person]
names:
  - form: 志遠
    lang: lzh
    script: Hani
    roman: Zhiyuan
    scheme: pinyin
    cite:
      - id: zhiyuan-name
        says: The diary records meeting 志遠和上 at a lecture on 止觀 at 大花嚴寺 on the 16th.
        source: nitto-guho-junrei-gyoki
        at: 卷三 開成五年五月十六日
roles:
  - role: monk
    note: Head (首座) of the twelve cloisters of 大華嚴寺.
    cite:
      - id: zhiyuan-role
        says: The diary says the twelve cloisters of 大花嚴寺 all took 志遠 as their head.
        source: nitto-guho-junrei-gyoki
        at: 卷三 開成五年五月十六日
        quote: 大花嚴寺十二院。僧眾至多。皆以遠和上為首座。
