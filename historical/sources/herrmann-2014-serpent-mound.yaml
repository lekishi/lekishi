notes:
  "Models the radiocarbon ages from the soil buried under Serpent Mound for the maximum possible age
  of its burial, which is the earliest possible time of construction: after 321 BC, 95% probability
  range 381–44 BC (OxCal, IntCal13; §3.2, Fig. 2). In §4.1 the authors conclude that the mound was
  first constructed about 2,300 years ago, and note that it could have been built any time after
  300 BC. The text read gives no page numbers, so citations point to sections and the figure."
