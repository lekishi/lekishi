summary:
  The court sends 坂合部連石布 and 津守連吉祥 to 唐, with a man and a woman of the 蝦夷 of 道奧 to show the Tang
  emperor.
types: [mission]
date:
  value: 659-07
  calendar: regnal
  as_written: 齊明天皇五年秋七月丙子朔戊寅
  cite:
    - id: mission-659-dispatch-time
      says: The chronicle records the dispatch on 齊明天皇五年七月戊寅.
      source: nihon-shoki
      at: 卷第廿六 齊明天皇五年七月戊寅
      quote: 秋七月丙子朔戊寅，遣小錦下坂合部連石布、大仙下津守連吉祥，使於唐國。仍以道奧蝦夷男女二人示唐天子。
places:
