notes:
  The same Han-era history as the `shiji` source, for the chapters it does not cover. The 匈奴列傳
  gives the Han–匈奴 wars as a sequence anchored on 元朔二年 and 元鼎三年; the 衛將軍驃騎列傳 gives the two
  generals' campaigns with the court's citations of them; the 西南夷列傳 dates the search for a road to
  身毒 through 蜀 that 張騫's report began; the 大宛列傳 is the account of 張騫's two
  missions. It is kept apart from `shiji` so that adding these juan does not change a source an
  approved chapter reaches.
