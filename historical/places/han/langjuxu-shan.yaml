# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  狼居胥山, the mountain where 霍去病 made the 封 sacrifice in 119 BCE, after which he sacrificed at 姑衍
  and looked out over the 翰海. Its identification is disputed and the record carries no position.
types: [landform, religious_site]
names:
  - form: 狼居胥山
    lang: lzh
    script: Hani
    roman: Langjuxu Shan
    scheme: pinyin
    cite:
      - id: langjuxu-name
        says: The 匈奴列傳 records the 驃騎將軍 making the 封 sacrifice at 狼居胥山, the 禪 at 姑衍, and reaching the 翰海.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（驃騎封於狼居胥山）
        quote: 驃騎封於狼居胥山，禪姑衍，臨翰海而還。
at:
  - interpretation: unknown
    precision: unspecified
    notes: Modern proposals for the mountain range from the Khentii in Mongolia to ranges in Inner
      Mongolia; none is cited here and no position is asserted.
    cite:
      - id: langjuxu-shan-unplaced
        says: The cited entry names 狼居胥山 and states no site for it, so no position is asserted.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（驃騎封於狼居胥山）
notes:
  The 翰海 the army looked out on after the sacrifices is not a separate record; whether it was a lake,
  a sea or the desert is itself disputed.
