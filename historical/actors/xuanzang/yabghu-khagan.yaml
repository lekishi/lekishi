# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The 葉護可汗 of the Turks, whom 玄奘 met hunting near 素葉城 and who gave him an interpreter, letters
  and an escort to 迦畢試. The biography gives only the title.
types: [person]
names:
  - form: 葉護可汗
    lang: lzh
    script: Hani
    roman: Yehu Kehan
    scheme: pinyin
    cite:
      - id: yabghu-khagan-name
        says: The biography records 玄奘 meeting the 突厥葉護可汗 at 素葉城.
        source: cien-zhuan
        at: 卷二（至素葉城，逢突厥葉護可汗）
        quote: 至素葉城，逢突厥葉護可汗
roles:
  - role: ruler
    cite:
      - id: yabghu-khagan-role
        says: The biography records the 可汗 receiving the envoys of Tang and 高昌 in his tent.
        source: cien-zhuan
        at: 卷二（須臾，更引漢使及高昌使人入，通國）
        quote: 須臾，更引漢使及高昌使人入，通國書及信物
notes:
  The biography names him only by title. Modern readings identify him with a particular khagan whose
  dates bear on the year of 玄奘's departure; no such reading is cited yet, so the record makes no identification.
