# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  武庚祿父, 紂's son, whom 武王 enfeoffed over the remaining people of 殷 to continue its sacrifices, under the oversight of 管叔 and 蔡叔. After 武王's death he rebelled with them and was killed by 周公.
types: [person]
names:
  - form: 武庚祿父
    lang: lzh
    script: Hani
    roman: Wugeng Lufu
    scheme: pinyin
    cite:
      - id: wu-geng-name
        says: The annals record that 周 enfeoffed 紂's son 武庚祿父 to continue the sacrifices of 殷.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝辛（封紂子武庚祿父）
        quote: 封紂子武庚祿父，以續殷祀，令修行盤庚之政。
roles:
  - role: ruler
    note: Lord of the 殷 remnant under 周.
    cite:
      - id: wu-geng-role
        says: The annals record that 周 enfeoffed 紂's son 武庚祿父 to continue the sacrifices of 殷.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝辛（封紂子武庚祿父）
