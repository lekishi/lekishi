summary:
  The river Hydaspes (the Jhelum), where Alexander crossed against Porus and defeated him in 326
  BCE.
types: [landform]
names:
  - form: Ὑδάσπης
    lang: grc
    script: Grek
    roman: Hydaspes
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: hydaspes-river-greek-name
        says: Pleiades records the ancient Greek name Ὑδάσπης for this place.
        source: pleiades
        at: place 59837, name /places/59837/hydaspes, dump 2026-10-21
      - id: hydaspes-river-name
        says: Arrian records Alexander marching to the Hydaspes.
        source: arrian-anabasis
        at: V.8
        quote: and then marched towards the river Hydaspes.
        role: supporting
