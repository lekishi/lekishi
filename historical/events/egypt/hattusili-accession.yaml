# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Hattusili III takes the throne of Hatti after Muwatalli II. The treaty, in Brugsch's translation,
  says he placed himself on his father's throne after his brother's murder; Garstang reads a mutiny in
  which Mutallu was assassinated.
types: [occurrence]
date:
  value: 1300 BCE..1258 BCE
  mode: window
  calendar: regnal
  as_written: between year 5 and year 21 of Ramesses II
places:
  - place: hattusa
    role: context
participants:
  - actor: hattusili-iii
    role: leader
  - actor: muwatalli-ii
    role: subject
  - actor: hatti
    role: participant
cite:
  - id: accession-treaty
    says: The treaty says that after Mautal's murder Kheta-sira placed himself on the throne of his father.
    source: sayce-hittites
    at: "ch. II: the treaty, the succession"
    quote:
      To wit, in the time of Mautal, the great king of Kheta, his brother, after his murder Kheta-sira
      placed himself on the throne of his father as the great king of Kheta.
  - id: accession-garstang
    says:
      Garstang says a mutiny followed the disbanding of the army and Mutallu was assassinated, and that
      the sequence is his own interpretation.
    role: supporting
    source: garstang-land-of-hittites
    at: "ch. VI, pp. 343–346: Mutallu's death, fn. 812"
notes:
  "Both sources are early readings. Later readings of the Hittite texts tell the succession differently
  (a son of Muwatalli reigned before Hattusili seized the throne), but no source read for this chapter
  is cited for that, so the record reports what these two say. Ramesses II's regnal years convert to
  BCE according to the chronology used: his accession is put at about 1304, 1290 or 1279 BCE (the low
  date most used today). The window spans those dates for the year in question. Garstang's 1910 dates
  (Kadesh 1288 B.C., the treaty about 1271 B.C.) fall inside it; Sayce's 1890 dates (1383 and 1354 B.C.)
  follow an older scheme and fall outside. It is an editorial bound that a cited chronology must replace
  before approval."
