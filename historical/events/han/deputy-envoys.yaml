notes:
  "The destinations are context places: the source names where the deputies were sent, not where
  each arrived, and the record draws no line to them. 安息, 身毒 and the further
  countries the passage names are not recorded as places.
  The 漢書 lists only 大宛, 康居, 月氏 and 大夏."
