summary: The marriage alliance between the Tang court and 拔汗那 (寧遠) through 和義公主, with the renaming of the kingdom and the gift of the surname 竇 to its king.
types: [diplomacy]
from: tang-dynasty
to: ferghana-state
cite:
  - id: tang-ferghana-marriage-basis
    says: The western-regions entry records the renaming to 寧遠, the gift of the imperial mother's surname 竇, and the marriage of 和義公主.
    source: xin-tangshu-tang-west
    at: 卷二二一下 西域下 寧遠（天寶三載，改其國號寧遠）
    quote: 天寶三載，改其國號寧遠，帝以外家姓賜其王曰竇，又封宗室女為和義公主降之。
notes: Undated here because its sources disagree on the year; the dates and the dispute are on the marriage event.
