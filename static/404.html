<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Not found · Lekishi</title>
    <link rel="icon" href="/favicon.ico" />
    <!--
      The static host's not-found page, served as a plain file for any path the
      build does not contain. It cannot load the site's stylesheet or scripts,
      so its colours are the design tokens' values (src/app.css) written out.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1114;
        color: #f3ead7;
        font-family: "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
        padding: 1.5rem;
      }
      main {
        width: 100%;
        max-width: 32rem;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: #b9af9c;
        text-decoration: none;
        font-family: "Cinzel", Georgia, serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      .eyebrow {
        margin: 2.5rem 0 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #d2a94f;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-family: "Cinzel", Georgia, serif;
        font-size: 22px;
        line-height: 28px;
        font-weight: 600;
      }
      p.body {
        margin: 0.5rem 0 0;
        font-size: 13px;
        line-height: 20px;
        color: #b9af9c;
      }
      nav {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        height: 2.25rem;
        padding: 0 1rem;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      nav a.primary {
        background: #d2a94f;
        color: #1a1409;
      }
      nav a.secondary {
        border: 1px solid rgb(210 169 79 / 0.35);
        color: #f3ead7;
      }
      a:focus-visible {
        outline: 2px solid #f1cf7a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"
        ><img src="/images/logo.svg" width="22" height="22" alt="" />LEKISHI</a
      >
      <p class="eyebrow">404</p>
      <h1>This page is not part of the atlas</h1>
      <p class="body">
        The address may be mistyped, or older than the site's chapters. Search and every chapter are
        one step away.
      </p>
      <nav aria-label="Ways on">
        <a class="primary" href="/">Search the atlas</a>
        <a class="secondary" href="/#chapters">Chapters</a>
      </nav>
    </main>
  </body>
</html>
