# yaml-language-server: $schema=../../schema/event.schema.json
summary: "At Beroea the Jews receive the word readily and search the scriptures, until Jews from
  Thessalonica come and stir the people; Paul is sent off towards the sea while Silas and Timothy
  stay."
types: [mission]
part_of:
  - paul-second-journey
date:
  value: "50..53"
  mode: window
  calendar: julian
  as_written: "Prat (1911): second mission, 50-53"
  cite:
    - id: beroea-mission-date
      says: "Prat's chronology of 1911 dates Paul's second mission to 50–53."
      basis: interpretation
      attributed_to: F. Prat (1911)
      source: catholic-encyclopedia
      at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
      quote: "second mission, 50-53"
places:
  - place: beroea
    role: site
participants:
  - actor: paul-the-apostle
    role: leader
  - actor: silas
    role: participant
  - actor: timothy
    role: participant
cite:
  - id: beroea-arrival
    says: "Acts tells that the brethren sent Paul and Silas by night to Berea, where they went to
      the synagogue."
    source: bible-kjv
    at: "Acts 17:10"
    quote: "sent away Paul and Silas by night unto Berea: who coming thither went into the synagogue
      of the Jews."
  - id: beroea-leaves
    says: "Acts tells that the brethren sent Paul away towards the sea, while Silas and Timothy
      stayed."
    role: supporting
    source: bible-kjv
    at: "Acts 17:14"
    quote: "And then immediately the brethren sent away Paul to go as it were to the sea: but Silas
      and Timotheus abode there still."
notes: "Acts tells it, and the dates are Prat's 1911 reckoning, an interpretation: Acts gives no
  years."
