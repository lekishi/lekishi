notes:
  The entry describes 肥前国松浦郡 as the district of northern and western 肥前, made up of the 北松浦
  peninsula and the islands of 平戸島, 生月島, 鷹島, 福江島 and the 五島列島, its area spreading over
  present-day 松浦市, 平戸市, 佐世保市 and neighbouring districts and cities in Nagasaki and Saga
  Prefectures. It is a modern reference identification, not a source statement of the eighth century.
