# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The people of Punt, who lived in round huts on piles along a river bank, and traded incense trees,
  myrrh, ivory, ebony, gold, animals and slaves with the Egyptian fleet.
types: [community]
names:
  - form: the people of Pûanît
    lang: en
    script: Latn
    cite:
      - id: people-of-punt-name
        says: Maspero describes the inhabitants' huts on piles.
        source: maspero-history-of-egypt
        at: "vol. IV, ch. III: the village"
        quote:
          They were built upon piles, as a protection from the rise of the river and from wild animals,
          and access to them was gained by means of moveable ladders.
