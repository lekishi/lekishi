summary: >-
  師尚父, 太公望, 武王's tutor, who led the first charge at 牧野 and was the first lord enfeoffed, at 營丘, as 齊.
types: [person]
names:
  - form: 師尚父
    lang: lzh
    script: Hani
    roman: Shi Shangfu
    scheme: pinyin
    cite:
      - id: shi-shangfu-name
        says: The annals record 武王 sending 師尚父 with a hundred men to challenge the 商 army.
        source: shiji-yin-zhou
        at: 卷四 周本紀 武王（武王使師尚父與百夫致師）
        quote: 武王使師尚父與百夫致師，以大卒馳帝紂師。
roles:
  - role: soldier
    note: Commander at 牧野; later lord of 齊.
    cite:
      - id: shi-shangfu-role
        says: The annals record 武王 sending 師尚父 with a hundred men to challenge the 商 army.
        source: shiji-yin-zhou
        at: 卷四 周本紀 武王（武王使師尚父與百夫致師）
