# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  倭奴國, the polity of 倭 whose envoy came to the Han court in 57 CE and received a seal and cord.
  The 東夷列傳 places it at the far southern edge of 倭; the annals call its ruler 倭奴國主.
types: [state]
names:
  - form: 倭奴國
    lang: lzh
    script: Hani
    roman: Wonu guo
    scheme: pinyin
    cite:
      - id: wa-nu-state-name
        says: The 東夷列傳 records the 倭奴國 bringing tribute in 建武中元二年 and its envoy calling himself 大夫.
        source: hou-hanshu
        at: 卷八十五 東夷列傳 倭（建武中元二年）
        quote: 建武中元二年，倭奴國奉貢朝賀，使人自稱大夫，倭國之極南界也。
notes:
  How the name divides (倭の奴國, or a single 倭奴/委奴 polity) and which part of northern Kyūshū it
  ruled are modern questions the cited sources do not settle; the record takes the name as written.
  The seal's inscription writes it 委奴國.
