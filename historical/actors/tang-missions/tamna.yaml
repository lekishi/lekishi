summary:
  耽羅, the island state on present-day Jeju. The 659 envoys brought its prince 阿波伎 to court in 661,
  from which the chronicle dates its tribute; in 778 its people held a Japanese judge.
types: [state]
names:
  - form: 耽羅
    lang: lzh
    script: Hani
    roman: Tamna
    scheme: other
    cite:
      - id: tamna-name
        says: 伊吉連博德書 names the island 耽羅 and its prince 阿波伎.
        source: nihon-shoki
        at: 卷第廿六 齊明天皇七年五月 注 伊吉連博得書
        quote: 僅到耽羅之嶋。便即招慰嶋人王子阿波伎等九人
