---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  verify:
    # Everything that can fail a change: formatting, Svelte/TypeScript checks,
    # the unit and historical-contract tests, and the static build with its
    # build invariant. No service container, database, or BEAM runtime is
    # involved: the site is a static artifact.
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm first: setup-node resolves the pnpm store path for its cache, so the
      # package manager has to be on PATH. The pin lives in the `packageManager`
      # field of package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The globe tiles are painted from open elevation by
      # scripts/globe/build-tiles.py (numpy and Pillow, a few minutes). Cache the
      # fetched elevation and the built tiles by the builder's inputs, so a run
      # repaints them only when the builder changes; `pnpm build` skips an
      # up-to-date build by its own stamp.
      - name: Cache globe tiles
        uses: actions/cache@v4
        with:
          path: |
            .cache/globe
            static/globe
          key: globe-tiles-${{ hashFiles('scripts/globe/**') }}

      - name: Check formatting
        run: pnpm lint

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run unit and contract tests
        run: pnpm test

      - name: Build the static artifact
        run: pnpm build

  e2e:
    # Builds the static artifact and runs the atlas browser checks against it
    # with no development server (RFD 4 AC4).
    # Desktop benefits from two workers when each has two CPUs available.
    name: e2e (${{ matrix.project }})
    runs-on: ${{ matrix.runner || 'blacksmith-2vcpu-ubuntu-2404' }}
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, tablet-touch-chromium, phone-chromium]
        include:
          - project: desktop-chromium
            runner: blacksmith-4vcpu-ubuntu-2404
            workers: 2
    env:
      LEKISHI_SKIP_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The globe tiles are painted from open elevation by
      # scripts/globe/build-tiles.py (numpy and Pillow, a few minutes). Cache the
      # fetched elevation and the built tiles by the builder's inputs, so a run
      # repaints them only when the builder changes; `pnpm build` skips an
      # up-to-date build by its own stamp.
      - name: Cache globe tiles
        uses: actions/cache@v4
        with:
          path: |
            .cache/globe
            static/globe
          key: globe-tiles-${{ hashFiles('scripts/globe/**') }}

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the static artifact
        run: pnpm build

      - name: Browser checks against the static artifact
        run: pnpm e2e --project=${{ matrix.project }} --workers=${{ matrix.workers || 1 }}
