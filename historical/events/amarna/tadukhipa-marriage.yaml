# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Shortly before his death Amenhotep III marries Tadukhipa, daughter of Tushratta; the long inventory
  of her dowry is among the tablets.
types: [occurrence]
date:
  value: 1390 BCE..1352 BCE
  mode: window
  calendar: regnal
  as_written: shortly before the death of Amenophis III
  cite:
    - id: tadukhipa-marriage-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
participants:
  - actor: amenhotep-iii
    role: participant
  - actor: tadukhipa
    role: participant
  - actor: tushratta
    role: participant
cite:
  - id: tadukhipa-basis
    says: Niebuhr says Nimmuria married Tadukhipa shortly before his death and her dowry list was found.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Tadukhipa"
notes: "The letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The
  Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
