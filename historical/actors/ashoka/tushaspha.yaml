# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  Tuṣāspha, Aśoka's Yavana governor in Surāṣṭra, who, according to the later Girnar inscription of Rudradāman,
  equipped the Sudarśana lake with its watercourses.
types: [person]
names:
  - form: Tushaspha
    lang: en
    script: Latn
    note: Smith's Tushasphâ, which he takes for a Persian name.
    cite:
      - id: tushaspha-name
        says: >-
          Smith says that under Aśoka's Persian (Yavana) rājā Tushasphā the irrigation department equipped
          the Girnar lake with watercourses.
        source: smith-asoka-1920
        at: ch. II, Extent and Administration of the Empire
        quote: >-
          under Asoka's Persian (Yavana) Râjâ, Tushasphâ, had equipped it with the needful watercourses
roles:
  - role: official
    note: The source is Rudradāman's inscription of about 152 CE, four centuries later.
