# yaml-language-server: $schema=../../schema/relationship.schema.json
summary: "Qin's war on Yan: the defeat of the Yan and Dai armies west of the 易水 in 227 BCE, the fall of 薊 in 226 BCE, and the capture of the Yan king in 遼東 in 222 BCE. The relationship asserts no causation and draws no route."
types: [conflict]
from: qin-state
to: yan-state
notes: "The relationship records three dated Qin acts. The Yan embassy of 227 BCE is a separate diplomacy relationship. It carries no validity interval, because the sources establish separately dated acts and not a continuous war, and it carries no geometry. It asserts no causation."
cite:
  - says: "The annals record Qin defeating Yan west of the 易水 in 二十年."
    source: shiji
    at: "卷六 秦始皇本紀 二十年（秦軍破燕易水之西）"
    quote: "而使王翦、辛勝攻燕。燕、代發兵擊秦軍，秦軍破燕易水之西。"
  - says: "The annals record Qin taking 薊 and the Yan king withdrawing to 遼東 in 二十一年."
    role: supporting
    source: shiji
    at: "卷六 秦始皇本紀 二十一年（取燕薊城）"
    quote: "乃益發卒詣王翦軍，遂破燕太子軍，取燕薊城，得太子丹之首。燕王東收遼東而王之。"
  - says: "The annals record 王賁 attacking 遼東 and taking the Yan king in 二十五年."
    role: supporting
    source: shiji
    at: "卷六 秦始皇本紀 二十五年（攻燕遼東）"
    quote: "二十五年，大興兵，使王賁將，攻燕遼東，得燕王喜。"
