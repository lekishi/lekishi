# yaml-language-server: $schema=../../schema/event.schema.json
summary: At 瑯邪 徐巿 of 齊 and others told 始皇 of three sacred mountains in the sea, 蓬萊, 方丈 and 瀛洲, where immortals lived. 始皇 sent 徐巿 with several thousand boys and girls into the sea to find them.
types: [mission]
date:
  value: 219 BCE
  calendar: chinese_lunisolar
  as_written: 二十八年
  cite:
    - id: xu-fu-voyage-219-account
      says: The annals record 徐巿's petition and his dispatch into the sea with thousands of boys and girls.
      sources:
        - source: shiji
          at: 卷六 秦始皇本紀 二十八年（齊人徐巿等上書）
          quote: 既已，齊人徐巿等上書，言海中有三神山，名曰蓬萊、方丈、瀛洲，僊人居之。
        - source: shiji
          at: 卷六 秦始皇本紀 二十八年（遣徐巿）
          quote: 於是遣徐巿發童男女數千人，入海求僊人。
places:
  - place: langya
    role: start
participants:
  - actor: xu-fu
    role: leader
  - actor: qin-king-zheng
    role: other
    note: Sent him.
notes: The three mountains are not recorded as places, and no destination or route is drawn.
