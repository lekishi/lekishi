# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  After Kadesh the Amorites throw off their Hittite allegiance; their chief Benteshina is deposed
  but escapes punishment.
types: [occurrence]
date:
  value: 1275 BCE..1258 BCE
  mode: window
  calendar: regnal
  as_written: after the battle of Kadesh
  cite:
    - id: amurru-revolt-shaw
      says: On Shaw's chronology Ramesses II reigned 1279–1213 BCE, so his year 5 falls in 1275–1274
        BCE and his year 21 in 1259–1258 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Nineteenth Dynasty"
participants:
  - actor: amurru-kingdom
    role: participant
  - actor: benteshina
    role: subject
  - actor: hatti
    role: participant
cite:
  - id: amurru-revolt-basis
    says:
      Garstang says the Amorites threw off their allegiance after Kadesh and their chief Put-akhi was
      deposed.
    source: garstang-land-of-hittites
    at: "ch. VI, pp. 343–346: the Amorites"
notes: "Garstang reads this from Winckler's first account of the Boghazköy tablets. The record has
  no place, since the sources name the land and not a city. Ramesses II's regnal years are converted
  on Shaw's chronology (The Oxford History of Ancient Egypt, 2000), which puts his reign at
  1279–1213 BCE; each regnal year spans two BCE years. Garstang's 1910 dates (Kadesh 1288 B.C., the
  treaty about 1271 B.C.) and Sayce's 1890 dates (1383 and 1354 B.C.) follow older schemes."
