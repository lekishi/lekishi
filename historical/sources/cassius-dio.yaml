notes:
  Dio arranges his narrative by consular year. He tells the Kushite attack and Petronius's campaign
  under 22 BCE, Augustus's winters at Samos under 21–20 BCE, and Nero's unrealized plans against the
  Ethiopians in the epitome of Book LXIII. Written about two centuries after the events.
