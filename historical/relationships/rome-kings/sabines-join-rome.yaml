# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  In Livy's tradition the Sabines and the Romans make one state out of two after the war over the
  seized women, sharing the kingship and seating the government at Rome.
types: [alliance]
from: sabines
to: roman-kingdom
directionality: mutual
notes: Tradition, not record. Dated with the war, to the reign of Romulus; the relationship carries no date of its own.
cite:
  id: sabines-join-rome-basis
  says: Livy tells that the leaders made one state out of two, shared the kingship, and moved all
    government to Rome.
  source: livy
  at: "1.13"
  quote: "Nec pacem modo sed civitatem unam ex duabus faciunt. Regnum consociant: imperium omne
    conferunt Romam."
