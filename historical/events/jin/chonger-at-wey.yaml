# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  On the way from the 狄 to 齊, 重耳 passes through 衛, and 衛文公 refuses him courtesy. This is the order the
  左傳 and the 晉 house give; the table puts the visit in 637 BCE instead (`chonger-at-wey-637`).
types: [occurrence]
date:
  value: 644 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: (after leaving the 狄 in 惠公七年)
  cite:
    - id: chonger-at-wey-date
      says: >-
        The 左傳 and the 晉 house tell the 衛 visit straight after the departure from the 狄, which the table
        sets in 644 BCE.
      source: shiji-chunqiu
      at: 卷十四 十二諸侯年表 晉 惠公 七年（去翟之齊）
      quote: 七重耳聞管仲死，去翟之齊。
places:
  - place: wey-chuqiu
    role: site
    note: The 衛 capital in 644 BCE; the texts name only the state.
participants:
  - actor: chonger
    role: leader
  - actor: wey-wen-gong
    role: host
notes: >-
  A separate event from `chonger-at-wey-637` because the sources tell the visit at different times on
  different legs; the journey records follow one account each.
cite:
  - id: chonger-at-wey-zuo
    says: >-
      The 左傳 records that 重耳 passed through 衛 and that 衛文公 refused him courtesy, before 五鹿 and 齊.
    source: zuozhuan
    at: 僖公二十三年（過衛，衛文公不禮焉）
    quote: 過衛，衛文公不禮焉。
  - id: chonger-at-wey-jin
    says: "The 晉 house gives the same order: 衛, then 五鹿, then 齊."
    role: supporting
    source: shiji-chunqiu
    at: 卷三十九 晉世家 文公（過衞，衞文公不禮）
    quote: 過衞，衞文公不禮。去，過五鹿
