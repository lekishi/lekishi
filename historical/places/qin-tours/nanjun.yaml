summary: 南郡, the commandery on the middle 江 through which 始皇 travelled in 219 BCE before returning by 武關. The label anchor sits at the modern county of 江陵; it asserts no historical site.
types: [region]
names:
  - form: 南郡
    lang: lzh
    script: Hani
    roman: Nanjun
    scheme: pinyin
    cite:
      - id: nanjun-name
        says: The annals record 始皇 crossing the 淮水 to the south-west and going to 衡山 and 南郡.
        source: shiji
        at: 卷六 秦始皇本紀 二十八年（之衡山、南郡）
        quote: 乃西南渡淮水，之衡山、南郡
at:
