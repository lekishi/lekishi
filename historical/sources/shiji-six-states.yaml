notes:
  "The hereditary houses of 燕, 楚, 趙, 魏 and 齊 and the biographies of 王翦, 李牧 and 荊軻, cited
  for the six states' own accounts of their ends in 229–221 BCE. It is a second source record
  for the same work as `shiji`, which covers 卷六, 卷十五, 卷四十五 and 卷六十三 and belongs to an
  approved chapter: a separate record keeps that approval from going stale. The accounts often
  date the same act to a different year than the annals do, and the records keep each
  account's own dating rather than reconciling them."
