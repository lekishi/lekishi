# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  The Cholas, the southern frontagers on the Coromandel coast that Rock Edicts II and XIII name beyond
  Aśoka's dominions.
types: [state]
names:
  - form: Chola
    lang: en
    script: Latn
    cite:
      - id: cholas-name
        says: Smith's comment on Rock Edict II identifies the Chola.
        source: smith-asoka-1920
        at: ch. IV, The Rock Edicts (comment on Rock Edict II)
        quote: The kingdom of the Choḷas was on the SE. or Madras side of the peninsula
notes: >-
  Recorded as a state because the edicts name them as kingdoms beyond the frontier; Smith is unsure whether
  some are peoples or countries.
