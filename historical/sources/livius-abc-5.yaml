notes:
  'The Babylonian chronicle for Nebuchadnezzar II''s first eleven years. Rev. 11''–13'' record the
  march to the Hatti-land in Kislīmu of year 7, the seizing of "the city of Judah" on the second
  day of Addaru, the capture of its king and the appointment of a king of Nebuchadnezzar''s choice.
  The page converts the dates to December 598 and February/March 597 BCE; that conversion is
  cited as Livius'' interpretation. The chronicle''s portion for 594–557 BCE is lost, so it has no
  account of the fall of Jerusalem in 587/586.'
