# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Dasius of Brundisium, commander of the Roman garrison at Clastidium, who surrendered the town and
  its grain to Hannibal in 218 BCE for four hundred gold pieces, according to Livy.
types: [person]
names:
  - form: Dasius Brundisinus
    lang: la
    script: Latn
    cite:
      - id: dasius-name-livy
        says:
          Livy names Dasius of Brundisium, commander of the garrison, as bribed with four hundred
          gold pieces.
        source: livy
        at: "21.48.9"
        quote: nummis aureis quadringentis, Dasio Brundisino praefecto praesidii corrupto
notes: "Polybius tells the betrayal without the name: the man the Romans had trusted, a Brundisian
  (3.69.1)."
