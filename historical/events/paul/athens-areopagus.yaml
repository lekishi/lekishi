    role: leader
cite:
  - id: athens-waited
    says: Acts tells that while Paul waited at Athens his spirit was stirred to see the city full of idols.
    source: bible-kjv
    at: "Acts 17:16"
    quote: "Now while Paul waited for them at Athens, his spirit was stirred in him, when he saw the
      city wholly given to idolatry."
  - id: athens-areopagus
    says: Acts tells that Paul stood in the midst of the Areopagus and addressed the men of Athens.
    role: supporting
    source: bible-kjv
    at: "Acts 17:22"
    quote: "Then Paul stood in the midst of Mars’ hill, and said, Ye men of Athens"
