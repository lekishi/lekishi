# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  衛, the 周 state founded for 康叔 among the 殷 people, which lost 朝歌 to the 狄 and rebuilt at 楚丘 and later
  帝丘. Romanised Wey to keep it apart from 魏.
types: [state]
names:
  - form: 衛
    lang: lzh
    script: Hani
    roman: Wey
    scheme: pinyin
    cite:
      - id: wey-state-name
        says: The annals record that 周公 gave the remaining 殷 people to 康叔 as 衛.
        source: shiji-yin-zhou
        at: 卷四 周本紀 成王（以封武王少弟封為衛康叔）
        quote: 頗收殷餘民，以封武王少弟封為衛康叔。
notes: Not `wei-state`, which is 魏 in the six-states chapter.
