notes:
  Strabo's account of Egypt and the Ethiopians, written under Augustus and Tiberius. Book XVII.1.54
  is the fullest narrative of the Kushite attack on Syene and Petronius's campaign to Napata, which
  Strabo, a friend of the earlier prefect Aelius Gallus, had from Roman informants. It gives no
  years.
