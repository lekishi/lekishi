# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Tushratta asks Akhenaten for the golden statues his father promised, and receives wooden ones.
  He writes to Tiye to intercede, and the quarrel ends with Akhenaten threatening to close Egypt to the
  subjects of Mitanni.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1352 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: early in the reign of Amenophis IV
  cite:
    - id: golden-statues-dispute-shaw
      says: On Shaw's chronology Amenhotep IV (Akhenaten) reigned 1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
participants:
  - actor: tushratta
    role: participant
  - actor: akhenaten
    role: participant
  - actor: tiye
    role: participant
  - actor: keliya
    role: witness
  - actor: mitanni
    role: participant
cite:
  - id: statues-basis
    says: Niebuhr says Napkhuria sent wooden models instead of the golden images.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the golden images"
  - id: statues-teye
    says: Tushratta writes to Teye that her son had the statuettes made of wood.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the letter to Teye"
  - id: statues-end
    says:
      Niebuhr says Napkhuria threatened to close his land to the subjects of Mitani, and intercourse
      probably ceased.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the last letter"
notes: "The letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The
  Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
