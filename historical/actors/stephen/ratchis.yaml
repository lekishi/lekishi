summary:
  Ratchis, Aistulf's brother, once king of the Lombards and then a monk, who gathered forces against
  Desiderius after Aistulf's death in 756.
types: [person]
names:
  - form: Ratchisus
    lang: la
    script: Latn
    cite:
      - id: ratchis-name
        says: The life calls Ratchisus formerly king and later a monk, Aistulf's brother, who despised Desiderius.
        source: liber-pontificalis
        at: Huius personam dispectui habens Ratchisus, dudum rex et postmodum monachus, germanus praefati Aistulfi
