summary: 振州, the southern prefecture whose river mouth (振州江口) 鑒眞's ship reached in the winter of 748 after fourteen days adrift. The vice-prefect 馮崇債 lodged the party at its 大雲寺 for a year.
types: [region]
names:
  - form: 振州
    lang: lzh
    script: Hani
    roman: Zhenzhou
    scheme: pinyin
    cite:
      - id: zhenzhou-name
        says: The biography records the ship coming to anchor at 振州江口 three days after its first landfall.
        source: toseiden
        at: 夜發，經三日乃到振州江口泊舟
at:
  - interpretation: unknown
    precision: unspecified
    notes: The chronicle says only that the ship drifted to 日南. No modern identification is sourced here, so no coordinates are asserted. The identification of the prefecture's seat is listed as open work.
    cite:
      - id: zhenzhou-location
        says: The biography names 振州 and its river mouth without locating them, and no identification is sourced here, so the record carries no coordinates.
        source: toseiden
        at: 乃到振州江口泊舟
notes: The biography later calls the whole journey 大和上從南振州來至揚府. The chronicle's notice names the drift's end as 日南, which the event keeps as its own account.
