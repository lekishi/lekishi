# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  楚丘, the 衛 capital from 658 BCE, after the 狄 destroyed 朝歌, where 衛文公 refused 重耳 courtesy. The historical
  geography puts it east of 滑縣; the record asserts no point.
types: [capital]
names:
  - form: 楚丘
    lang: lzh
    script: Hani
    roman: Chuqiu
    scheme: pinyin
    cite:
      - id: wey-chuqiu-name
        says: The historical geography records that 衛文公 moved from 曹 to 楚丘.
        source: dushi-fangyu-jiyao-zhou
        at: 卷十六 北直七 大名府 滑縣（衛南廢縣）
        quote: 僖四年衛文公自曹遷於楚丘
at:
  - interpretation: unknown
    precision: unspecified
    notes: >-
      The geography places 楚丘 sixty 里 east of 滑縣, under a county since abolished, without a coordinate.
    cite:
      - id: wey-chuqiu-geography
        says: The historical geography places the abolished 衛南 county, the 春秋 楚丘, sixty 里 east of 滑縣.
        source: dushi-fangyu-jiyao-zhou
        at: 卷十六 北直七 大名府 滑縣（衛南廢縣）
        quote: 衛南廢縣，縣東六十里。春秋時楚丘地。
notes: >-
  The geography dates the move to 僖公四年; the Spring and Autumn entry in the 左傳 text records the walling
  of 楚丘 under 僖公二年. The record carries no date for the move.
