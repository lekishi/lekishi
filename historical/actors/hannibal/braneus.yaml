# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Braneus, the elder of two brothers disputing the kingship of the Allobroges' neighbours on the
  Island, restored by Hannibal's arbitration in 218 BCE.
types: [person]
names:
  - form: Braneus
    lang: la
    script: Latn
    cite:
      - id: braneus-name-livy
        says: Livy names the elder brother, who had ruled first, Braneus.
        source: livy
        at: "21.31.6"
        quote: maior et qui prius imperitarat, Braneus nomine
notes: Only Livy names him; Polybius tells the same story of two brothers without names (3.49.8).
