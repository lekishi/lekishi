# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Akhenaten receives an Assyrian embassy and sends gold to its prince, and Burnaburiash protests
  that the Assyrians are his vassals. Ashur-uballit I's own letter speaks of regular messengers.
types: [mission]
part_of:
  - amarna-letters-exchanged
date:
  value: 1352 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
  cite:
    - id: assyrian-embassy-to-egypt-shaw
      says: On Shaw's chronology Amenhotep IV (Akhenaten) reigned 1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
participants:
  - actor: middle-assyrian-kingdom
    role: participant
  - actor: akhenaten
    role: host
  - actor: burnaburiash-ii
    role: witness
  - actor: ashur-uballit-i
    role: participant
cite:
  - id: assyria-basis
    says: Niebuhr says Napkhuria sent gold to Assurnadinakhi and received an Assyrian embassy.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Assyria"
  - id: assyria-vassals
    says: Burnaburiash writes that the Assyrians are his vassals.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Assyria (the protest)"
notes: "The letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The
  Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
