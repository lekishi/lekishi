# yaml-language-server: $schema=../../schema/relationship.schema.json
summary: 石國's appeal for 大食's help against 高仙芝 after the 750 raid, through the western peoples (the mirror) or by the prince in person (the Song biography).
types: [diplomacy]
from: shi-state
to: dashi
date:
  value: 751
  mode: window
  calendar: chinese_lunisolar
  as_written: 天寶十載
cite:
  - id: shi-dashi-appeal-basis
    says: The mirror and the Song biography both record the 石國 prince's flight leading to 大食's war on 高仙芝.
    sources:
      - source: zizhi-tongjian-tang
        at: 卷二一六 唐紀三十二 天寶十載（石國王子逃詣諸胡）
        quote: 石國王子逃詣諸胡，具告仙芝欺誘貪暴之狀。諸胡皆怒，潛引大食慾共攻四鎭。
      - source: xin-tangshu-tang-west
        at: 卷一三五 高仙芝傳（其王子走大食，乞兵攻仙芝於怛邏斯城）
        quote: 其王子走大食，乞兵攻仙芝於怛邏斯城，以直其冤。
notes: The sources tell the appeal as what brought 大食 against 高仙芝; the relationship records the appeal and leaves causation unasserted, because no cited scholarship argues it. Who carried the appeal is disputed on the event.
