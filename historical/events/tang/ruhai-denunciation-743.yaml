summary: While a ship is built on the 東河 and provisions are laid in at 既濟寺, 道航 says the less learned, such as 如海, should stay behind. 如海 tells the 淮南道採訪使 班景倩 that 道航 is in league with pirates; the commissioner has the temples searched, the Japanese monks seized and the ship confiscated. 道航 is cleared by 李林宗's letters, and 如海 is laicized, beaten and sent home.
types: [occurrence]
date:
  value: "743"
  calendar: chinese_lunisolar
  as_written: 是歲，天寶二載癸未
  cite:
    - id: ruhai-denunciation-time
      says: The biography places the pirate raids and the accusation in 天寶二載.
      source: toseiden
      at: 是歲，天寶二載癸未，［當時］海賊大動繁多
places:
  - place: yangzhou
    role: site
    note: The biography names 既濟寺, 開元寺 and 大明寺 within 揚州 as the temples searched.
