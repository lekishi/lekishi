# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  昆莫, the title of the 烏孫 king who received 張騫 on his second mission with the rite due a 單于,
  and who, old and with his kingdom divided among his sons, would not commit to move east.
types: [person]
names:
  - form: 昆莫
    lang: lzh
    script: Hani
    roman: Kunmo
    scheme: pinyin
    note: A title (王號), not a personal name; the 漢書 gives his father's name as 難兜靡.
    cite:
      - id: kunmo-name
        says: The 大宛列傳 records 張騫 saying that the 烏孫 king is styled 昆莫.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（聞烏孫王號昆莫）
        quote: 臣居匈奴中，聞烏孫王號昆莫
