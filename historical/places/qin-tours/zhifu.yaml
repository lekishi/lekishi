summary: 之罘, the coastal hill 始皇 climbed in 219 and 218 BCE and again in 210 BCE, where he set up inscribed stones and, on the last tour, shot a great fish. The label anchor sits at the modern island 芝罘島; it asserts no historical site.
types: [landform]
names:
  - form: 之罘
    lang: lzh
    script: Hani
    roman: Zhifu
    scheme: pinyin
    cite:
      - id: zhifu-name
        says: The annals record 始皇 climbing 之罘 and setting up a stone praising Qin.
        source: shiji
        at: 卷六 秦始皇本紀 二十八年（登之罘）
        quote: 登之罘，立石頌秦德焉而去
