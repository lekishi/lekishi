        says: The western-regions entry says 大食 was called 黑衣大食 from 阿蒲羅拔 onward.
        source: jiu-tangshu
        at: 卷一九八 西戎 大食國（一云隋開皇中）
        quote: 末換已前謂之「白衣大食」，自阿蒲羅拔後改為「黑衣大食」。
