# yaml-language-server: $schema=../schema/chapter.schema.json
title: Kadesh and the treaty with Hatti, about 1274–1259 BCE
summary: Ramesses II meets the Hittite army at Kadesh on the Orontes in his fifth year, is caught by an
  ambush and, by his own poem, saves the day alone. Sixteen years later Hattusili III's envoys bring him
  a silver tablet with a treaty of peace and alliance, sealed in his 34th year by a marriage. The
  competing chronologies place it all between 1300 BCE and 1245 BCE.
window: 1300 BCE..1245 BCE
story:
  summary: 'Kadesh and the treaty: the ambush and the poem, the war after it, the Hittite succession,
    the silver tablet, and the marriage.'
  span: 1305 BCE..1907
  coverage: 'The battle and its aftermath as Sayce (1890) retells the Egyptian poem and reliefs and Garstang
    (1910) reads the first Boghazköy tablets; Brugsch''s translation of the treaty''s Karnak copy; the
    1914 verse translation of the poem. Excluded: the other army divisions and the Ne''arin relief force,
    the Hittite version of the treaty in its own words, the Marriage Stela, and the Hittite king''s letters
    to Ramesses. The Lake of Homs, Dapur and Tunip are unlocated.'
  notes: Every BCE date is an editorial window over the competing chronologies; the regnal years are the
    sources'. Garstang is cited without quotation until his text enters the public domain worldwide on
    2027-01-01. The 1906–1907 excavation is a modern step kept as the source of the Hittite side.
