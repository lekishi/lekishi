# yaml-language-server: $schema=../schema/chapter.schema.json
title: The Han–匈奴 wars, 133–119 BCE
summary:
  From the failed ambush at 馬邑 in 133 BCE to the battles north of the desert in 119 BCE. Follow 衛青
  to 蘢城, the 河南 land and the 右賢王's camp, 霍去病 past 焉支山 to 祁連山 and on to 狼居胥山, the 渾邪王's
  surrender, and the commanderies of 河西.
window: 133 BCE..119 BCE
include: [han-xiongnu-war, henan-transfer, hunye-submission, zhao-xin-defection]
story:
  summary:
    "The Han–匈奴 wars, 133–119 BCE: the end of the peace at 馬邑, 衛青's campaigns from 蘢城 to the
    右賢王, 霍去病's two rides of 121 BCE, the 渾邪王's surrender and the 河西 commanderies, and the
    battles north of the desert."
  span: 133 BCE..119 BCE
  coverage:
    "Fifteen years of the Western Han's war with the 匈奴, as the 史記's 匈奴列傳 and 衛將軍驃騎列傳 and the
    漢書 annals record it: twelve dated campaigns and occurrences, the defection of 趙信, the transfer of
    the 河南 land, and the 渾邪王's submission. Excluded: the 匈奴 raids the annals list in most years,
    the minor sorties, the later campaigns of 李廣利 and the wars after 119 BCE, and the earlier peace
    (和親) from 200 BCE. Most places carry label anchors or no position; the battlefields north of the
    desert are not located. No territory or front is drawn: the relationship records a change of
    control, not a boundary."
  notes:
    "Step order is presentation order. Years are Julian years for Han reign-years, which then began
    in the tenth month; each event's `as_written` keeps the source's year and season. The 河西
    commanderies are dated by the 漢書 annals and the conflicting 史記 account is kept as a dispute."
  steps:
    - mayi-ambush-133: The ambush at 馬邑 fails, 133 BCE
    - han-xiongnu-war: The Han and the 匈奴 at war, 133–119 BCE
    - longcheng-raid-129: 衛青 reaches 蘢城, 129 BCE
    - henan-recovery-127: 衛青 takes the 河南 land; the 朔方 commandery, 127 BCE
    - henan-transfer: The 河南 land passes to the Han
    - junchen-death-126: 軍臣單于 dies and 伊稚斜 seizes the throne, 127–126 BCE
    - youxianwang-rout-124: 衛青 routs the 右賢王 and is made 大將軍, 124 BCE
    - dingxiang-sorties-123: Two sorties from 定襄; 趙信 defects, 123 BCE
    - zhao-xin-defection: 趙信 joins the 單于 and counsels retreat north
    - yanzhi-campaign-121: 霍去病 rides past 焉支山, spring 121 BCE
    - qilian-campaign-121: 霍去病 crosses 居延 to 祁連山, summer 121 BCE
    - youbeiping-battle-121: 李廣 surrounded out of 右北平; 張騫 arrives late, 121 BCE
    - hunye-surrender-121: The 渾邪王 surrenders, autumn 121 BCE
    - hunye-submission: The 渾邪王's people become Han dependents
    - hexi-commanderies: The 河西 commanderies — a disputed date
    - mobei-battle-119: 衛青 and the 單于 north of the desert, 119 BCE
    - langjuxu-sacrifice-119: 霍去病 sacrifices at 狼居胥山, 119 BCE
