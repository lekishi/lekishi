notes:
  "The continuous biography of 玄奘 by his disciple 慧立, completed and annotated by 彥悰 in 688. It
  is the only narrative that gives the journey's order, the stays and their lengths, and the few
  dated anchors (the departure, the return to 長安, the audience at 洛陽). It is a devotional work
  by disciples: dreams, miracles and the guardian deity of the desert are its own, and the chapter
  records the movements and meetings it reports, not the wonders. Its chronology is not
  self-consistent: 卷一 dates the departure 貞觀三年秋八月, and 玄奘's own memorial in 卷五 says
  貞觀三年四月."
