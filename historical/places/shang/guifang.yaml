# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  鬼方, the land or people that the Book of Changes says 高宗 (武丁) fought for three years. The text
  gives no position, and the record asserts none.
types: [region]
names:
  - form: 鬼方
    lang: lzh
    script: Hani
    roman: Guifang
    scheme: pinyin
    cite:
      - id: guifang-name
        says: The third line of the 既濟 hexagram says that 高宗 attacked 鬼方 and overcame it in three years.
        source: zhouyi
        at: 既濟 九三
        quote: 九三：高宗伐鬼方，三年克之，小人勿用。
at:
  - interpretation: unknown
    precision: unspecified
    notes: The line names 鬼方 only. Where it lay is a question of later scholarship, none of which is adopted here.
    cite:
      - id: guifang-unknown
        says: The cited line names 鬼方 and states no position.
        source: zhouyi
        at: 既濟 九三
notes: >-
  鬼方 is recorded as a place because the war is drawn against it; it may equally be a people, and the
  record does not decide which.
