# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Rib-Hadda of Byblos writes again and again for troops against Abdi-Ashirta and the Habiru, warns
  he will abandon his city, and loses Simyra.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1390 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reigns of Amenophis III and IV
  cite:
    - id: rib-hadda-appeals-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE and Amenhotep IV (Akhenaten)
        1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: byblos
    role: start
  - place: simyra
    role: context
participants:
  - actor: rib-hadda
    role: leader
  - actor: abdi-ashirta
    role: subject
  - actor: habiru
    role: subject
  - actor: yanhamu
    role: subject
cite:
  - id: rib-hadda-habiri
    says: Rib-Addi asks to be rescued from Abd-Ashera, with whom all the Habiri side.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Rib-Addi to Amanappa"
  - id: rib-hadda-flee
    says: Rib-Addi warns he will forsake his city if no troops come.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Rib-Addi to Amanappa (the end)"
  - id: rib-hadda-simyra
    says: Rib-Addi writes that Simyra is lost to him.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Rib-Addi on Yanhamu"
notes: "The letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The
  Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
