# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  季康子, 季桓子's heir and chief minister of 魯, who called back 冉求 and then, in 484 BCE, sent gifts to bring
  Confucius home.
types: [person]
names:
  - form: 季康子
    lang: lzh
    script: Hani
    roman: Ji Kangzi
    scheme: pinyin
    cite:
      - id: ji-kang-zi-name
        says: The 孔子世家 records that 季康子 sent gifts to welcome Confucius back to 魯.
        source: shiji-chunqiu
        at: 卷四十七 孔子世家（以幣迎孔子）
        quote: 會季康子逐公華、公賓、公林，以幣迎孔子，孔子歸魯。
roles:
  - role: official
    note: Chief minister of 魯 from 492 BCE.
    cite:
      - id: ji-kang-zi-role
        says: The 孔子世家 records that 季康子 sent gifts to welcome Confucius back to 魯.
        source: shiji-chunqiu
        at: 卷四十七 孔子世家（以幣迎孔子）
