# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  In 226 BCE 新鄭, the former Han capital, revolted. The annals' notice records the revolt and,
  in the same year, 昌平君 being moved to 郢; the chapter publishes the revolt only and records no
  outcome.
types: [occurrence]
date:
  value: 226 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: 二十一年（新鄭反）
  cite:
    - id: xinzheng-revolt-time
      says: The annals record that in 二十一年 (226 BCE) 新鄭 revolted.
      source: shiji
      at: 卷六 秦始皇本紀 二十一年（新鄭反）
      quote: 新鄭反。昌平君徙於郢。
places:
  - place: xinzheng
    role: site
    note: The place the notice names as revolting.
notes:
  The notice records the revolt and the same year's 昌平君徙於郢; the chapter publishes the revolt
  alone and records no outcome or response, because the cited entry states none. The revolt is the
  episode's last event and is not presented as an effect of the annexation.
cites:
  places:
    - id: xinzheng-revolt-place
      says: The notice names 新鄭 as the place that revolted; it states no site for the city.
      source: shiji
      at: 卷六 秦始皇本紀 二十一年（新鄭反）
