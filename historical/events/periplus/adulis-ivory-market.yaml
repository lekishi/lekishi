# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Ships anchor off Mountain Island because of attacks from the land, and the ivory brought down
  from the Auxumites' city is sold at Adulis, under the rule of Zoscales.
types: [exchange]
part_of: [periplus-voyage]
date:
  value: 58..62
  mode: window
  calendar: julian
  as_written: no date; the text speaks of the present
  cite:
    - id: adulis-ivory-market-time
      says:
        The Periplus describes this as present at the time of the voyage it was written from, which
        it does not date; Schoff puts that voyage between the summers of 58 and 62 CE.
      basis: interpretation
      attributed_to: W. H. Schoff (1912)
      sources:
        - source: periplus-erythraean-sea
          at: 4–6
        - source: schoff-periplus
          at: Date and Authorship of the Periplus
places:
  - place: adulis
    role: site
  - place: axum
    role: context
participants:
  - actor: zoscales
    role: host
cite:
  - id: adulis-ivory-market-account
    says:
      The Periplus says all the ivory is brought to the Auxumites' city from beyond the Nile and thence
      to Adulis.
    source: periplus-erythraean-sea
    at: 4–6
    quote:
      to that place all the ivory is brought from the country beyond the Nile through the district
      called Cyeneum, and thence to Adulis.
