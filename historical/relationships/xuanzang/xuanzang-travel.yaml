summary:
  玄奘 travels from 長安 to India and back, 629–645, by the oases north of the 塔里木 basin and the Turks'
  lands on the way out and over the 蔥嶺 and 于闐 on the way home. The relationship records the documented
  movement only and draws no route.
types: [travel]
from: xuanzang
to: nalanda
date:
  value: 629..645
  mode: duration
  calendar: chinese_lunisolar
  as_written: 貞觀三年秋八月 — 貞觀十九年春正月
notes:
  "No geometry is attached: the stops are the dated events of the chapter, and the journey record
  that would order them waits on the journey kind (RFD 2)."
cite:
