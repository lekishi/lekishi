    precision: locality
    point: [-175.12674, -21.15191]
    notes:
      The modern village of Nukuleka on Tongatapu, which the cited study names for the site; the
      excavated site lies at the village, so the point is approximate.
    cite:
      - id: nukuleka-location
        says: GeoNames records Nukuleka at this point.
        source: geonames
        at: 4032395 (Nukuleka; latitude, longitude), dump 2026-10-21
