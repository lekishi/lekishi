# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Kammusu-nadbi of Moab, one of the kings of Amurru whom the prism lists bringing presents and
  heavy tribute to Sennacherib in 701 BCE.
types: [person]
names:
  - form: Kammusu-nadbi
    lang: en
    script: Latn
    cite:
      - id: kammusu-nadbi-of-moab-name
        says: The prism lists Kammusu-nadbi among the kings who brought tribute.
        source: luckenbill-annals-sennacherib
        at: p. 30, Oriental Institute prism col. II 56
        quote: Kammusu-nadbi, the Moabite,
roles:
  - role: ruler
    note: Ruler of Moab; the prism lists him among "kings of Amurru, all of them".
    cite:
      says: The prism lists Kammusu-nadbi among the kings who brought tribute.
      source: luckenbill-annals-sennacherib
      at: p. 30, Oriental Institute prism col. II 56
      quote: Kammusu-nadbi, the Moabite,
