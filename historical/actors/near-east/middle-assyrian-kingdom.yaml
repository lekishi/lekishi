# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Assyria on the middle Tigris, in the fourteenth century a small state that Babylon counted as
  its vassal, and which under Ashur-uballit I opened its own relations with Egypt.
types: [state]
names:
  - form: Assyria
    lang: en
    script: Latn
    cite:
      - id: middle-assyrian-kingdom-name
        says: Niebuhr says Akhenaten received an Assyrian embassy.
        source: niebuhr-tell-el-amarna-period
        at: "ch. III: Assyria"
        quote:
          Napkhuria sent a very large quantity of gold to the prince Assurnadinakhi and ostentatiously
          received an Assyrian embassy.
notes:
  One actor for the Middle Assyrian kingdom, about the fourteenth to the eleventh century BCE. The
  Neo-Assyrian empire (neo-assyrian-empire) is another actor.
