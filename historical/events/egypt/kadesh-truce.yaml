# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  After the battle the two kings come to terms and the Egyptian army withdraws. Sayce calls it
  a treaty soon broken; Garstang a truce sought by Muwatalli and readily accepted.
types: [council]
part_of:
  - battle-of-kadesh
date:
  value: 1300 BCE..1274 BCE
  mode: window
  calendar: regnal
  as_written: after the battle, year 5
places:
  - place: kadesh
    role: context
participants:
  - actor: ramesses-ii
    role: participant
  - actor: muwatalli-ii
    role: participant
cite:
  - id: truce-basis
    says: Sayce says a treaty was made but soon broken, and peace came sixteen years later.
    source: sayce-hittites
    at: "ch. II: Kadesh, the truce"
    quote:
      A treaty was accordingly made; but it was soon broken, and it was not until sixteen years later
      that peace was finally established between the two rival powers.
  - id: truce-garstang
    says:
      Garstang says Mutallu made overtures for a truce, which the Pharaoh accepted, and the Egyptian
      forces were withdrawn.
    role: supporting
    source: garstang-land-of-hittites
    at: "ch. VI, p. 343: the truce"
  - id: truce-later
    says:
      Garstang notes Müller's view that the poem's passage on the overtures refers to Hattusil's approach
      sixteen years later, and rejects it.
    role: alternative
    source: garstang-land-of-hittites
    at: "ch. VI, p. 343: fn. 809"
dispute:
  status: disputed
  summary:
    "Whether the poem's Hittite overtures belong to the day after Kadesh or to the treaty sixteen
    years later: Müller (1902) took the second view, Garstang (1910) the first."
notes: "Ramesses II's regnal years convert to BCE according to the chronology used: his accession is
  put at about 1304, 1290 or 1279 BCE (the low date most used today). The window spans those dates for
  the year in question. Garstang's 1910 dates (Kadesh 1288 B.C., the treaty about 1271 B.C.) fall inside
  it; Sayce's 1890 dates (1383 and 1354 B.C.) follow an older scheme and fall outside. It is an editorial
  bound that a cited chronology must replace before approval."
