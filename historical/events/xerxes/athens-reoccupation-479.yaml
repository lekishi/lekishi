# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Mardonios marches from Thessaly through Boeotia, finds Athens deserted again, its people on Salamis
  and in the ships, and takes it a second time, ten months after Xerxes; refused by the Athenians, he
  burns the city and withdraws to Boeotia.
types: [occurrence]
date:
  value: 479 BCE
  mode: window
  calendar: julian
  as_written:
    the capture of the city by the king had taken place ten months before the later expedition
    of Mardonios against it
  cite:
    - id: athens-reoccupation-479-time
      says: Grote dates Mardonios's reoccupation of Athens to May or June 479 BCE.
      source: grote-history-of-greece
      at: vol. V, ch. XLII
      quote:
        about ten months after the retreat of Xerxes, he entered the country without resistance, and
        again established the Persian head-quarters in Athens, May or June, 479 B. C.
      basis: interpretation
      attributed_to: George Grote
    - id: athens-reoccupation-479-text
      says: Herodotus places the second capture ten months after the first.
      source: herodotus
      at: IX.3
      quote:
        Now the capture of the city by the king had taken place ten months before the later expedition
        of Mardonios against it.
      role: supporting
places:
  - place: athens
    role: site
participants:
  - actor: mardonius
    role: leader
  - actor: persian-empire
    role: participant
cites:
  summary:
    - id: athens-reoccupation-479-burning
      says: Herodotus records Mardonios burning Athens as he withdrew.
      source: herodotus
      at: IX.13
      quote:
        he began to retire out of the country before the force of Pausanias arrived at the Isthmus,
        having first set fire to Athens
