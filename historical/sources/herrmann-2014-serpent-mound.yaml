notes:
  Models the radiocarbon ages from the soil buried under Serpent Mound and finds that it was buried,
  and construction began, after 321 BC, with a 95% probability range of 381–44 BC (OxCal, IntCal13);
  the abstract rounds this to about 2,300 years ago. The text read gives no page numbers, so citations
  point to the model and its figure.
