# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "As Livy tells it, Rome's neighbours refused intermarriage, so Romulus held games for Neptune
  Equester, the Consualia, invited the neighbouring peoples and the Sabines with their families,
  and at a signal the Roman youth seized the young women. Dionysius reports that some put this in
  Romulus's first year and Gnaeus Gellius in his fourth, which Dionysius thinks more probable."
types: [occurrence]
date:
  value: 749 BCE..748 BCE
  mode: window
  calendar: julian
  as_written: in the fourth year of Romulus's reign (Gnaeus Gellius, in Dionysius)
  cite:
    - id: sabine-women-gellius
      says:
        Dionysius reports that some put the seizure in the first year of Romulus's reign and Gnaeus
        Gellius in the fourth, which he thinks more probable; counted from Dionysius's own first
        year (752/751 BCE), the fourth is 749/748 BCE.
      source: dionysius-roman-antiquities
      at: "2.31"
      quote: Some state that these things happened in the first year of Romulus' reign, but Gnaeus
        Gellius says it was in the fourth, which is more probable.
places:
  - place: rome
    role: site
    cite:
      id: sabine-women-place
      says: Livy tells that the neighbours came to the games eager to see the new city, and that the
        Roman youth ran to seize the young women when the signal was given.
      source: livy
      at: "1.9"
      quote: signoque dato iuventus Romana ad rapiendas virgines discurrit.
participants:
  - actor: romulus
    role: leader
  - actor: sabines
    role: subject
    cite:
      id: sabine-women-sabines
      says: Livy tells that the whole Sabine people came with their wives and children.
      source: livy
      at: "1.9"
      quote: iam Sabinorum omnis multitudo cum liberis ac coniugibus venit.
notes:
  "Tradition, not record. The date is Gellius's, as Dionysius reports it, converted from Dionysius's
  Olympiad reckoning of Romulus's first year; the other report, Romulus's first year (752/751 BCE),
  is kept as an alternative. Livy gives no year."
dispute:
  status: disputed
  summary: Dionysius reports two datings, Romulus's first year and Gellius's fourth.
cite:
  - id: sabine-women-first-year
    says: Dionysius reports that some writers put the seizure in Romulus's first year (752/751 BCE).
    role: alternative
    source: dionysius-roman-antiquities
    at: "2.31"
    quote: Some state that these things happened in the first year of Romulus' reign,
