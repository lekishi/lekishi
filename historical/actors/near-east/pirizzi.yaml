# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Pirizzi, Tushratta's messenger, whose arrival with a Naharina letter at Thebes the docket records,
  and who carried the lament for Amenhotep III to Akhenaten.
types: [person]
names:
  - form: Pirizzi
    lang: akk
    script: Latn
    cite:
      - id: pirizzi-name
        says: The hieratic docket records the Naharina letter brought by the messenger Pirizzi.
        source: niebuhr-tell-el-amarna-period
        at: "ch. III: the docket"
        quote:
          '"[Received] in the two-[and-thirtieth year of the reign of Nimmuria], in the first winter
          month, on the tenth day, the Court being at the southern residence (Thebes), in the Residence Ka-em-Ekhut.
          Duplicate of the Naharina letter brought by the messenger Pirizzi and (another)."'
roles:
  - role: envoy
