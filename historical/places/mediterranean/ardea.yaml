summary:
  Ardea, the city of the Rutuli south of Rome. Livy tells that the Roman army was besieging it when
  the young men rode to Collatia, the night that began the story of Lucretia.
types: [settlement]
names:
  - form: Ardea
    lang: la
    script: Latn
    cite:
      - id: ardea-name
        says: Livy tells that the Rutuli held Ardea, a people rich for that region and age.
        source: livy
        at: "1.57.1"
        quote: "Ardeam Rutuli habebant"
at:
  - interpretation: approximate_point
    precision: site
    point: [12.54703, 41.60939]
    notes: The gazetteer's point for the ancient city at modern Ardea.
    cite:
