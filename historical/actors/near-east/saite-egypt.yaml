# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Egypt under the kings the books of Kings and Jeremiah call Pharaoh, whose army came out of Egypt
  while the Chaldeans besieged Jerusalem, and to whose land the remnant of Judah fled after Gedaliah's
  murder.
types: [state]
names:
  - form: Egypt
    lang: en
    script: Latn
    cite:
      - id: saite-egypt-name
        says: Jeremiah records Pharaoh's army coming out of Egypt.
        source: bible-kjv
        at: Jeremiah 37:5
        quote: Then Pharaoh’s army was come forth out of Egypt
notes:
  Jeremiah 44:30 names the king as Pharaohhophra; The Bible Journey identifies him as the pharaoh
  who came to Judah's aid. "Saite" names the modern period of the dynasty; the sources say Egypt. Earlier
  Egyptian states are separate actors.
