# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "The Arverni, the powerful people of the Massif Central, whose young noble Vercingetorix
  led the general revolt of 52 BCE; Caesar spared their prisoners after Alesia to win the state
  back."
types: [community]
names:
  - form: Arverni
    lang: la
    script: Latn
    cite:
      - id: arverni-name
        says: "Caesar tells that after Alesia he kept back the Aedui and the Arverni to win their
          states back, and gave the other captives to his soldiers."
        source: caesar-gallic-war
        at: "7.89"
        quote: "Reservatis Aeduis atque Arvernis, si per eos civitates reciperare posset"
