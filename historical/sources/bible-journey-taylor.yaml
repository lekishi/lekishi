notes: "A popular reference that follows the biblical narrative with BCE dates. It dates Zedekiah's
  rebellion to 589 BCE, the breach of Jerusalem's walls to July 587, Gedaliah's appointment to 587
  and his murder to 586, and Nebuchadnezzar's reign to 604–562. Those years are its authors'
  chronology, cited as interpretation, and differ from the Jewish Encyclopedia's 586 and 561."
