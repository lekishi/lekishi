<script type="module">
import * as THREE from "three"
const T0 = performance.now()
const spec = await (await fetch("../shared/scene.json")).json()

// ---- shared helpers (identical in both spikes) ----

// ---- heightmap ----

// ---- renderer, scene, camera ----
const canvas = document.getElementById("c")
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap

const [tx0, tz0] = toXZ(spec.camera.target.lon, spec.camera.target.lat)

resize(); placeCamera(); addEventListener("resize", () => { resize(); render() })
scene.add(new THREE.HemisphereLight(new THREE.Color(spec.hemisphere.sky), new THREE.Color(spec.hemisphere.ground), spec.hemisphere.intensity))
const az = spec.sun.azimuthDeg * Math.PI / 180, el = spec.sun.elevationDeg * Math.PI / 180
const sun = new THREE.DirectionalLight(new THREE.Color(spec.sun.color), spec.sun.intensity)

// ---- terrain with the shared texture ----

const geo = new THREE.PlaneGeometry(Wu, Hu, cols - 1, rows - 1); geo.rotateX(-Math.PI / 2)
const pos = geo.attributes.position
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) pos.setY(r * cols + c, E[r * cols + c] * YS)
geo.computeVertexNormals(); triangles += (cols - 1) * (rows - 1) * 2
const tex = new THREE.TextureLoader().load("../shared/terrain-color.jpg"); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4
const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0 })); terrain.receiveShadow = true; terrain.castShadow = true; scene.add(terrain)
const water = new THREE.Mesh(new THREE.PlaneGeometry(Wu + 9000, Hu + 9000), new THREE.MeshStandardMaterial({ color: new THREE.Color(spec.water.color), transparent: true, opacity: spec.water.opacity, roughness: 0.22, metalness: 0.08 }))
water.rotation.x = -Math.PI / 2; water.position.y = 0.06; water.receiveShadow = true; scene.add(water)
const deep = new THREE.Mesh(new THREE.PlaneGeometry(Wu + 9000, Hu + 9000), new THREE.MeshStandardMaterial({ color: new THREE.Color("#1d5674"), roughness: 0.95, metalness: 0 })); deep.rotation.x = -Math.PI / 2; deep.position.y = -0.6; deep.receiveShadow = true; scene.add(deep)

// ---- vegetation (instanced; shared placement rule) ----
const P = spec.palette, TR = spec.trees
const pts = []
for (let r = 2; r < rows - 2; r += TR.sampleEvery) for (let c = 2; c < cols - 2; c += TR.sampleEvery) {
  const e = hAt(c, r); if (e < TR.minElev || e > TR.maxElev) continue; const sl = slopeAt(c, r); if (sl > TR.maxSlope) continue
  if (fbm(c * 0.03 + 5, r * 0.03 + 7) < TR.noiseThreshold) continue; if (hash(c, r) > TR.dropFraction) continue
  pts.push([(c + hash(r, c) * 1.6 - 0.8) * U - Wu / 2, (r + hash(c * 3, r) * 1.6 - 0.8) * U - Hu / 2, e, sl])
}
const coneG = new THREE.ConeGeometry(0.95, 3.4, 6); coneG.translate(0, 1.9, 0); const ballG = new THREE.SphereGeometry(1.25, 6, 5); ballG.translate(0, 2.0, 0); const trunkG = new THREE.CylinderGeometry(0.18, 0.26, 1.6, 5); trunkG.translate(0, 0.8, 0)
const vegetation = new THREE.Group(); scene.add(vegetation)
function inst(g, color, list, scaleFn) { const m = new THREE.InstancedMesh(g, new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.9 }), list.length); const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), T = new THREE.Vector3(); list.forEach((p, i) => { const s = scaleFn(p); T.set(p[0], hLerp(p[0], p[1]) * YS - 0.1, p[1]); S.set(s, s, s); M.compose(T, Q, S); m.setMatrixAt(i, M) }); m.castShadow = true; m.receiveShadow = true; vegetation.add(m); triangles += g.index ? g.index.count / 3 * list.length : g.attributes.position.count / 3 * list.length; return m }
function buildVegetation(fraction) { vegetation.clear(); const list = fraction < 1 ? pts.filter((p, i) => i % 2 === 0) : pts; const con = list.filter(p => p[2] > TR.coniferAbove || p[3] > TR.coniferSlope), bro = list.filter(p => !(p[2] > TR.coniferAbove || p[3] > TR.coniferSlope)); inst(coneG, P.conifer, con, p => 0.75 + hash(p[0], p[1]) * 0.5); inst(ballG, P.broadleaf, bro, p => 0.7 + hash(p[1], p[0]) * 0.5); inst(trunkG, P.trunk, list, p => 0.8 + hash(p[0] * 2, p[1]) * 0.4); return list.length }
let treeCount = buildVegetation(1)

// ---- houses ----
const wall = new THREE.MeshStandardMaterial({ color: new THREE.Color(P.wall), roughness: 0.9 }), roof = new THREE.MeshStandardMaterial({ color: new THREE.Color(P.roof), roughness: 0.9 }), thatch = new THREE.MeshStandardMaterial({ color: new THREE.Color(P.thatch), roughness: 1 })
const boxG = new THREE.BoxGeometry(1.4, 0.9, 1.1); boxG.translate(0, 0.45, 0); const roofG = new THREE.ConeGeometry(1.05, 0.8, 4); roofG.rotateY(Math.PI / 4); roofG.translate(0, 1.3, 0); roofG.scale(1, 1, 0.8)
let houseCount = 0
for (const pl of spec.places) { if (!pl.village) continue; const [cx, cz] = toXZ(pl.lon, pl.lat); let placed = 0, k = 0; while (placed < pl.village && k < 200) { k++; const a = hash(pl.seed + k, 3) * 6.28, rr = 1.5 + hash(k, pl.seed) * 7; const x = cx + Math.cos(a) * rr, z = cz + Math.sin(a) * rr * 0.8; const e = hLerp(x, z); if (e < 4 || e > 90) continue; const g = new THREE.Group(); g.position.set(x, e * YS, z); g.rotation.y = hash(k, 9) * 6.28; const sc = 1.5 + hash(k, 2) * 0.7; g.scale.setScalar(sc); const b = new THREE.Mesh(boxG, wall); b.castShadow = b.receiveShadow = true; const rf = new THREE.Mesh(roofG, hash(k, 5) > 0.5 ? roof : thatch); rf.castShadow = true; g.add(b, rf); scene.add(g); placed++; houseCount++; triangles += 12 + 6 } }

// ---- ships and route ----
function ship(s) { const g = new THREE.Group(); const [x, z] = toXZ(s.lon, s.lat); g.position.set(x, 0.35, z); g.rotation.y = s.headingRad; g.scale.setScalar(s.scale)
  const hull = new THREE.Mesh(new THREE.BoxGeometry(7, 1.3, 2.4), new THREE.MeshStandardMaterial({ color: new THREE.Color(P.hull), roughness: .8 })); hull.position.y = 0.4; hull.castShadow = true; g.add(hull)
  const deckM = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.5, 2.0), new THREE.MeshStandardMaterial({ color: new THREE.Color(P.deck), roughness: .9 })); deckM.position.y = 1.25; g.add(deckM)
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 1.6), new THREE.MeshStandardMaterial({ color: new THREE.Color(P.wall), roughness: .9 })); cabin.position.set(-1.2, 2.05, 0); g.add(cabin)
  const croof = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.7, 4), roof); croof.rotation.y = Math.PI / 4; croof.position.set(-1.2, 3.0, 0); croof.scale.set(1, 1, 0.75); g.add(croof)
  for (const mxp of [1.9, -0.2]) { const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 7, 6), new THREE.MeshStandardMaterial({ color: 0x3a2616 })); mast.position.set(mxp, 4.5, 0); g.add(mast); const sail = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.6), new THREE.MeshStandardMaterial({ color: new THREE.Color(P.sail), side: THREE.DoubleSide, roughness: 1 })); sail.position.set(mxp + 0.3, 5.0, 0); sail.rotation.y = Math.PI / 2 - 0.25; sail.castShadow = true; g.add(sail) }
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.8), new THREE.MeshStandardMaterial({ color: new THREE.Color(P.flag), side: THREE.DoubleSide })); flag.position.set(2.0, 8.4, 0); flag.rotation.y = Math.PI / 2; g.add(flag)
  scene.add(g); triangles += 60; return g }
const ships = spec.ships.map(ship)
const routePts = spec.route.map(p => { const [x, z] = toXZ(p.lon, p.lat); return new THREE.Vector3(x, 0.5, z) })
const curve = new THREE.CatmullRomCurve3(routePts)
const nD = 34, dashG = new THREE.BoxGeometry(2.6, 0.12, 0.9)
const dashes = new THREE.InstancedMesh(dashG, new THREE.MeshStandardMaterial({ color: new THREE.Color(P.route), emissive: 0x8a6a1e, roughness: .6 }), nD)
{ const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(1, 1, 1), T = new THREE.Vector3(); for (let i = 0; i < nD; i++) { const u = (i + 0.5) / nD, p = curve.getPointAt(u), tg = curve.getTangentAt(u); T.set(p.x, 0.5, p.z); Q.setFromUnitVectors(new THREE.Vector3(1, 0, 0), new THREE.Vector3(tg.x, 0, tg.z).normalize()); M.compose(T, Q, S); dashes.setMatrixAt(i, M) } scene.add(dashes); triangles += 12 * nD }
const ship2Start = ships[0].position.clone(), ship2Heading = spec.ships[0].headingRad
function setPlayhead(t) { if (t <= 0) { ships[0].position.copy(ship2Start); ships[0].rotation.y = ship2Heading; return } const u = 0.6 + 0.4 * Math.min(1, t); const p = curve.getPointAt(u), tg = curve.getTangentAt(u); ships[0].position.set(p.x, 0.35, p.z); ships[0].rotation.y = Math.atan2(-tg.z, tg.x) }

// ---- labels ----
const box = document.getElementById("labels"), els = spec.places.filter(p => p.name).map(p => { const e = document.createElement("div"); e.className = "lbl " + (p.kind === "sea" ? "sea" : ""); e.innerHTML = `<b>${p.name}</b>${p.rom ? `<i>${p.rom}</i>` : ""}`; box.appendChild(e); return { p, e } })
function placeLabels() { const w = canvas.clientWidth, h = canvas.clientHeight; for (const { p, e } of els) { const [x, z] = toXZ(p.lon, p.lat); const v = new THREE.Vector3(x, (p.kind === "sea" ? 0 : hLerp(x, z) * YS) + (p.selected ? 6 : 3), z).project(camera); e.style.left = ((v.x + 1) / 2 * w) + "px"; e.style.top = ((1 - v.y) / 2 * h) + "px"; e.style.display = v.z < 1 ? "" : "none" } }

// ---- render, stats, API ----
let frameMs = 0, fps = 0, frames = 0, tAcc = 0, last = performance.now(), drawCalls = 0, loadMs = 0
function render() { const t = performance.now(); renderer.render(scene, camera); const dt = performance.now() - t; frameMs = frameMs * 0.9 + dt * 0.1; drawCalls = renderer.info.render.calls; placeLabels() }
function loop() { const now = performance.now(); frames++; tAcc += now - last; last = now; if (tAcc >= 1000) { fps = frames * 1000 / tAcc; frames = 0; tAcc = 0; overlay() } render(); requestAnimationFrame(loop) }
const bundleKB = Math.round((await (await fetch("/node_modules/three/build/three.module.js", { method: "HEAD" })).headers.get("content-length") || 0) / 1024)
function stats() { return { fps: +fps.toFixed(1), frameMs: +frameMs.toFixed(2), drawCalls, triangles: renderer.info.render.triangles || triangles, memoryMB: performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null, loadMs, bundleKB, trees: treeCount, houses: houseCount, engine: "three " + THREE.REVISION } }
function overlay() { const s = stats(); document.getElementById("stats").textContent = `three r${THREE.REVISION}\nfps ${s.fps}  frame ${s.frameMs} ms\ndraw calls ${s.drawCalls}  tris ${s.triangles}\nmem ${s.memoryMB ?? "n/a"} MB  load ${s.loadMs} ms\nbundle ${s.bundleKB} KB  trees ${s.trees}  houses ${s.houses}` }
window.spike = {
  ready: new Promise(r => { tex.onUpdate = null; const start = () => { render(); loadMs = Math.round(performance.now() - T0); overlay(); r(); loop() }; if (tex.image) start(); else { const i = setInterval(() => { if (tex.image) { clearInterval(i); start() } }, 30) } }),
  orbit(t) { orbitT = t; placeCamera(); render() },
  playhead(t) { setPlayhead(t); render() },
  setQuality(level) { const phone = level === "phone"; renderer.shadowMap.enabled = !phone; sun.castShadow = !phone; treeCount = buildVegetation(phone ? 0.5 : 1); scene.traverse(o => { if (o.material) o.material.needsUpdate = true }); render() },
  stats,
}
