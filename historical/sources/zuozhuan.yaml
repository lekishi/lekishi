notes: >-
  The Zuo commentary on the Spring and Autumn annals of 魯, compiled in the fourth century BCE,
  the fullest narrative of the 春秋 states. Its years are 魯 years: 魯僖公's first year is 659 BCE and
  魯定公's is 509 BCE in the table of the twelve lords' count. Entries are located by 魯 year and
  by a phrase. It tells some stories, such as 重耳's exile, out of their year, under the year the
  story closes.
