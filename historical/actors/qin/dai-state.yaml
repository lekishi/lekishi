# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "代, the kingdom the Zhao prince 嘉 set up in the north after 邯鄲 fell in 228 BCE. The annals record it joining Yan's army, and 王賁 capturing its king in 222 BCE; the hereditary house of Zhao counts its end as the end of Zhao."
types: [state]
names:
  - form: "代"
    lang: lzh
    script: Hani
    roman: Dai
    scheme: pinyin
    cite:
      - says: "The annals record 趙公子嘉 making himself king of 代 and joining his army to Yan's."
        source: shiji
        at: "卷六 秦始皇本紀 十九年（自立為代王）"
        quote: "趙公子嘉率其宗數百人之代，自立為代王，東與燕合兵，軍上谷。"
notes: "Recorded as a separate actor from 趙 because the sources give it its own king and its own regnal count (代王嘉元年 in the six-states table); the hereditary house of Zhao treats it as Zhao's continuation (秦滅趙 at its end). The record keeps both readings."
