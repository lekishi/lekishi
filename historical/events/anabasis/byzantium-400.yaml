# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The army crosses to Byzantium at the Spartan admiral Anaxibius's request; when he sends it out
  of the city unpaid and the gates are shut, the soldiers break back in, and Xenophon calms them.
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 400 BCE
  mode: window
  calendar: julian
  as_written: the whole body of troops crossed to Byzantium
  cite:
    - id: byzantium-400-time
      says: Grote dates the crossing to Byzantium to October or November 400 BCE.
      source: grote-history-of-greece
      at: vol. IX, ch. LXIX
      quote:
        and ultimately brought them across the Bosphorus of Thrace to Byzantium, in October or November,
        400 B.C.
      basis: interpretation
      attributed_to: George Grote
    - id: byzantium-400-text
      says: Xenophon records the crossing.
      source: xenophon-anabasis
      at: VII.1
      quote: After this the whole body of troops crossed to Byzantium.
      role: supporting
places:
  - place: chrysopolis
    role: start
  - place: byzantium
    role: site
participants:
  - actor: cyreans
    role: participant
  - actor: xenophon
    role: leader
cites:
  summary:
    - id: byzantium-400-gates
      says: Xenophon records the soldiers rushing the gates of Byzantium.
      source: xenophon-anabasis
      at: VII.1
      quote:
        the soldiers snatched up their arms and made a rush full speed at the gates, with the intention
        of getting inside the fortification again.
