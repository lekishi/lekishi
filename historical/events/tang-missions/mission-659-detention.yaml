# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  A servant of 韓智興 slanders the envoys and they are sentenced to exile; 博德 pleads and they are
  pardoned. The court then orders that, because there will be a campaign in the east next year, the 倭
  envoys may not go home, and they are confined in the western capital.
types: [occurrence]
date:
  value: 659-12-03
  calendar: chinese_lunisolar
  as_written: 十二月三日
  cite:
    - id: mission-659-detention-time
      says: 伊吉連博德書 dates the slander to the third of the twelfth month.
      source: nihon-shoki
      at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
      quote: 十二月三日，韓智興傔人西漢大麻呂，枉讒我客。客等獲罪唐朝，已決流罪。
places:
  - place: changan
    role: site
    note: 博德 names 西京, the western capital 長安.
participants:
  - actor: iki-no-hakatoko
    role: participant
    note: Pleads for the envoys.
  - actor: tang-dynasty
    role: host
notes:
  The campaign in the east (海東之政) is the Tang–Silla attack on Paekche of 660. The record states the
  detention order as 博德 reports it and asserts no further causation.
cites:
  summary:
    - id: mission-659-detention-order
      says:
        伊吉連博德書 records the order that the envoys could not return because of next year's campaign in
        the east, and their confinement in 西京.
      source: nihon-shoki
      at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
      quote: 「國家，來年必有海東之政。汝等倭客，不得東歸。」遂逗西京，幽置別處。閉戶防禁，不許東西。困苦經年。
