# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The hairy people on an island in the Horn of the South whom the account's interpreters called
  Gorillae; the crew took three women, killed them and brought their skins to Carthage. Whether
  they were people or apes is not known, and the record does not decide.
types: [community]
names:
  - form: Γορίλλαι
    lang: grc
    script: Grek
    roman: Gorillai
    scheme: unspecified-editorial
    cite:
      - id: gorillai-name
        says: The account says the island was full of wild people, mostly women with hairy bodies,
          whom the interpreters called Gorillae.
        source: hanno-periplus
        at: "18"
        quote: Πολὺ δὲ πλείους ἦσαν γυναῖκες, δασεῖται τοῖς σώμασιν· ἃς οἱ ἑρμηνέες ἐκάλουν Γορίλλας.
notes: The account describes them as people (ἄνθρωποι, γυναῖκες). The record does not identify them
  with any species or people; the community type records only how the account presents them.
