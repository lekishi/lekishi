# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Massalia (Livy's Massilia), the Greek city near the Rhône's eastern mouth, Rome's ally, near which
  Publius Scipio landed his army in 218 BCE.
types: [settlement, port]
names:
  - form: Massilia
    lang: la
    script: Latn
    cite:
      - id: massalia-name-livy
        says: Livy records Publius Scipio sailing along the coast to Massilia.
        source: livy
        at: "21.26.3"
        quote: pervenit Massiliam
  - form: Μασσαλία
    lang: grc
    script: Grek
    cite:
      - id: massalia-name-polybius
        says: Polybius records Publius reaching the region of Μασσαλία on the fifth day from Pisa.
        source: polybius
        at: "3.41.4"
        quote: ἧκε πεμπταῖος ἀπὸ Πισῶν εἰς τοὺς κατὰ Μασσαλίαν τόπους
at:
  - interpretation: approximate_point
    precision: locality
    point: [5.369889, 43.296346]
    notes:
      An approximate placement at the ancient city under modern Marseille, which Pleiades identifies
      as Massalia/Massilia. Scipio's landing was at the Rhône mouth, not in the city's harbour.
    cite:
      - id: massalia-identification
        says:
          Pleiades locates the ancient place (Massalia/Massilia) at the site whose modern coordinate
          Wikidata records; the point is the Wikidata coordinate (CC0), an approximate placement of
          the ancient town, not a surveyed site.
        basis: interpretation
        attributed_to: Pleiades
        sources:
          - source: pleiades
            at: place 148127 (Massalia/Massilia), reprLatLong, dump 2026-10-21
          - source: wikidata
            at: Q15141121 (P625), revision 2516944618
modern:
  - form: Marseille
    lang: fr
    script: Latn
    note: Modern city on the site, recorded for orientation.
external_ids:
  - system: wikidata
    id: Q15141121
    license: CC0-1.0
  - system: pleiades
    id: "148127"
    license: CC BY 3.0
