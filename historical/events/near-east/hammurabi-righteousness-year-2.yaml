# yaml-language-server: $schema=../../schema/event.schema.json
summary: Hammurabi's second year is named for his establishing "the heart of the land in righteousness".
types: [other]
part_of: [hammurabi-reign]
date:
  value: 1792 BCE..1750 BCE
  mode: window
  calendar: regnal
  as_written: the year in which Hammurabi established the heart of the land in righteousness (year 2)
  cite:
    - says: The Louvre dates Hammurabi's reign, and the stele, to -1792/-1750, the modern middle chronology.
      basis: interpretation
      attributed_to: Musée du Louvre
      source: louvre-code-of-hammurabi
      at: "caption: Code de Hammurabi, -1792 / -1750"
participants:
  - actor: hammurabi
    role: leader
cite:
  - says: The Hastings dictionary gives the second year-name.
    source: hastings-dictionary-bible
    at: Assyria and Babylonia, Chronology, (a) Year-names
    quote: the year in which Hammurabi established the heart of the land in righteousness
notes:
  The year-name records an act of justice, not a conquest; the chapter does not say what the act
  was. The text dates the event by the year-name of Hammurabi's second year. No cited source converts
  that year to a BCE year, so the date is the reign's window in the middle chronology the Louvre uses;
  a regnal calendar with a cited epoch would narrow it to one year. The year depends on the chronology,
  which the reign records as a dispute.
