notes:
  "Josephus commanded the Jewish forces in Galilee, surrendered to Vespasian at Jotapata in 67, and
  watched the siege of Jerusalem from the Roman side; he wrote the history in Rome under Flavian
  patronage within a decade of the war. He is an eyewitness for much of it and an interested party
  for all of it, and his numbers are his. He dates events by Macedonian months and the regnal years
  of Nero, Agrippa and Vespasian; Whiston adds the Hebrew month in brackets. Modern editions also
  cite Niese's running paragraph numbers, which these book, chapter and section locators do not
  give."
