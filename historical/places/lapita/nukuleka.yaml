summary:
  "Nukuleka on Tongatapu, Tonga: the founder settlement of the first Lapita voyagers into Polynesia,
  dated by U/Th on coral files to 2838±8 BP."
types: [settlement]
names:
  - form: Nukuleka
    lang: en
    script: Latn
    cite:
      - id: nukuleka-name
        says:
          Burley, Weisler and Zhao say earlier studies document Nukuleka in Tonga as a founder colony
          for the first settlement of Polynesia by Lapita peoples.
        source: burley-2012-nukuleka
        at: Abstract
        quote:
          Previous studies document Nukuleka in the Kingdom of Tonga as a founder colony for first settlement
          of Polynesia by Lapita peoples.
at:
