# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The Romans storm the upper city; John and Simon flee and are later taken, the city is
  burned and its walls thrown down except three towers of Herod's palace, and the tenth legion is
  left to garrison the ruins."
types: [occurrence]
date:
  value: "70"
  mode: window
  calendar: julian
  as_written: "in the second year of the reign of Vespasian, on the eighth day of the month Gorpeius
    [Elul]"
  cite:
    - id: jerusalem-taken-70-year
      says: "Whiston's note dates the seventeenth of Panemus, during the same siege, to A.D. 70."
      basis: interpretation
      attributed_to: W. Whiston (1737)
      source: josephus-jewish-war
      at: "6.2.1, Whiston's note 5"
      quote: "the seventeenth of Panemuns. [Footnote Tamuz,] A.D. 70"
    - id: jerusalem-taken-date
      says: Josephus dates the taking of Jerusalem to the eighth of Gorpiaeus in the second year of Vespasian.
      role: supporting
      source: josephus-jewish-war
      at: "6.10.1"
      quote: "And thus was Jerusalem taken, in the second year of the reign of Vespasian, on the
        eighth day of the month Gorpeius [Elul]."
places:
  - place: jerusalem
    role: site
participants:
  - actor: titus
    role: leader
  - actor: john-of-gischala
    role: subject
  - actor: simon-bar-giora
    role: subject
  - actor: judaean-rebels
    role: participant
cite:
  - id: jerusalem-taken
    says: Josephus tells that Jerusalem was taken in the second year of Vespasian.
    source: josephus-jewish-war
    at: "6.10.1"
    quote: "And thus was Jerusalem taken, in the second year of the reign of Vespasian"
notes: "Josephus's account: he was a commander on the Jewish side until Jotapata and on the Roman
  side after, and his numbers are his. The year is an interpretation; Josephus dates by month and
  regnal year."
