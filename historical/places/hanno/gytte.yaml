# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Gytta, the second of the five cities by the sea the account says the fleet settled a day's sail
  beyond the elephant marsh. No site is known.
types: [settlement]
names:
  - form: Γύττη
    lang: grc
    script: Grek
    roman: Gyttē
    scheme: unspecified-editorial
    cite:
      - id: gytte-name
        says: The account names five cities the fleet settled by the sea beyond the marsh — Karikon
          teichos, Gytte, Akra, Melitta and Arambys.
        source: hanno-periplus
        at: "5"
        quote: κατῳκίσαμεν πόλεις πρὸς τῇ θαλάττῃ καλουμένας Καρικόν τε τείχος καὶ Γύττην καὶ Ἄκραν καὶ Μέλιτταν καὶ Ἄραμβυν.
  - form: Gytta
    lang: en
    script: Latn
    cite:
      - id: gytte-translation
        says: Schoff's translation writes the name Gytta.
        role: supporting
        source: hanno-periplus
        at: "5"
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      No site is known and none is drawn. Schoff gives Müller's guess and calls the five locations
      uncertain. Pleiades lists Gytte as a name of "Cottae?", a site by Cape Spartel; that
      identification is kept as an alternative and not drawn.
    cite:
      - id: gytte-unlocated
        says:
          The account places Gytte a day's sail beyond the marsh, which locates it on no map; the record asserts no
          coordinate.
        source: hanno-periplus
        at: "5"
      - id: gytte-mueller
        says: "Schoff calls the five colonies' locations uncertain and reports Müller's guess: The second perhaps at Mogador, 31° 30'."
        basis: interpretation
        role: alternative
        attributed_to: K. Müller, as reported by W. H. Schoff (1913)
        source: schoff-hanno
        at: The Geography of the Voyage of Hanno, § 5
        quote: "The second perhaps at Mogador, 31° 30'."
      - id: gytte-cottae
        says: Pleiades lists Gytte among the names of Cottae?, a site by Cape Spartel near Tangier.
        basis: interpretation
        role: alternative
        attributed_to: Pleiades
        source: pleiades
        at: 275615 (names), dump 2026-10-21
external_ids:
  - system: pleiades
    id: "275615"
    url: https://pleiades.stoa.org/places/275615
    license: CC BY 3.0
    note: Pleiades' Cottae?, which lists Gytte as a name; an identification, not asserted here.
dispute:
  status: disputed
  summary:
    The site is unidentified. The record draws nothing and keeps each commentator's identification
    as an alternative.
