# yaml-language-server: $schema=../../schema/place.schema.json
summary: 壹伎嶋, the island off 肥前 where two of the 837 ships were blown back.
types: [landform]
names:
  - form: 壹伎嶋
    lang: ja
    script: Hani
    roman: Iki
    scheme: hepburn
    cite:
      - id: iki-name
        says: The 大宰府 report says the first and fourth ships were driven to 壹伎嶋.
        source: shoku-nihon-koki
        at: 卷第六 承和四年七月癸未
        quote: 第一第四舶。忽遇逆風。流着壹伎嶋。
  - form: 壹岐嶋
    lang: ja
    script: Hani
    cite:
      - id: iki-name-1
        says: The chronicle lists 壹岐嶋 among the places given guards and beacons in 664.
        source: nihon-shoki
        at: 卷第廿七 天智天皇三年 是歲
        quote: 是歲，於對馬嶋、壹岐嶋、筑紫國等，置防與烽。
at:
  - interpretation: approximate_point
    precision: region
    point: [129.716667, 33.783333]
    notes:
      A region-level placement standing for the whole island of 壹伎嶋, the present-day 壱岐島. The point
      is the island's modern coordinate; it asserts no harbour or landing place on the island.
    cite:
      - id: iki-identification
        says:
          The reference work identifies 壱岐国 as the 西海道 island that is present-day 壱岐市, where guards
          and beacons were placed in antiquity. The point is the island's modern coordinate from
          Wikidata (CC0), placed to stand for the island as a whole.
        basis: interpretation
        attributed_to: 山川出版社「山川 日本史小辞典 改訂新版」「壱岐国」
        sources:
          - source: yamakawa-nihonshi-iki
            at: 壱岐国
          - source: wikidata
            at: Q494914 (P625), revision 2551775883
