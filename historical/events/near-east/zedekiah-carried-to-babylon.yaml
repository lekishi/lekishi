# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Zedekiah, blinded and bound, is carried to Babylon, where Jeremiah says he was put in prison
  till the day of his death.
types: [journey]
part_of: [nebuchadnezzar-campaign-589-586]
date:
  value: 587 BCE..586 BCE
  mode: window
  calendar: regnal
  as_written: ninth day of the fourth month, eleventh year of Zedekiah (Jeremiah 39:2)
  cite:
    - says: The Bible Journey dates the breach of Jerusalem's walls to July 587 BCE.
      basis: interpretation
      attributed_to: Chris and Jenifer Taylor, The Bible Journey
      source: bible-journey-taylor
      at: Jerusalem falls to the Babylonians, note on 2 Kings 25:1-21
    - says: The Jewish Encyclopedia dates the yielding of the wall to 586.
      role: supporting
      basis: interpretation
      attributed_to: E. G. Hirsch and I. M. Price, Jewish Encyclopedia (1905)
      source: jewish-encyclopedia
      at: Nebuchadnezzar, Biblical Data (E. G. H., I. M. P.)
      quote: At the end of eighteen months (586) the wall yielded.
places:
  - place: riblah
    role: start
  - place: babylon
    role: end
participants:
  - actor: zedekiah
    role: subject
cite:
  - says: Jeremiah records Zedekiah carried in chains to Babylon and imprisoned there until his death.
    source: bible-kjv
    at: Jeremiah 52:11
    quote:
      the king of Babylon bound him in chains, and carried him to Babylon, and put him in prison till
      the day of his death
notes: No route is drawn between Riblah and Babylon.
