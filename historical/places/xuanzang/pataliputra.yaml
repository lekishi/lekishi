        says: The biography records 玄奘 staying seven days at the little town by the old palace.
        source: cien-zhuan
        at: 卷三（法師在小城停七日）
        quote: 法師在小城停七日，巡禮聖跡
  - form: 拘蘇摩補羅
    lang: lzh
