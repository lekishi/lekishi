# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The envoys worship the gods of heaven and earth south of 蓋山 and pay court, and 多治比縣守 receives
  the 節刀. With the embassy sail the students 阿倍仲麻呂 and 吉備眞備 and the monk 玄昉.
types: [mission]
date:
  value: 717-03
  calendar: regnal
  as_written: 養老元年三月己酉
  cite:
    - id: mission-717-sekito-time
      says: The chronicle records the 節刀 grant on 養老元年三月己酉.
      source: shoku-nihongi
      at: 卷第七 養老元年三月己酉
      quote: 己酉。遣唐押使從四位下多治比眞人縣守賜節刀。
places:
  - place: heijo-palace
    role: context
    note:
      The entry names no place. The court sat here in this reign, so the record names its seat as
      context; it asserts no site for the act.
participants:
  - actor: tajihi-no-agatamori
    role: leader
  - actor: kibi-no-makibi
    role: participant
    note: Sails as a student (留學).
    cite:
      - id: mission-717-makibi
        says: 吉備眞備's obituary records that in 靈龜二年, aged 22, he went to 唐 with the envoys and stayed to study.
        source: shoku-nihongi
        at: 卷第卅三 寶龜六年十月壬戌
        quote: 靈龜二年。年廿二。從使入唐。留學受業。研覽經史。該渉衆藝。
  - actor: genbo
    role: participant
    note: Sails as a student monk.
    cite:
      - id: mission-717-genbo
        says: 玄昉's obituary records that he went to 唐 to study in 靈龜二年.
        source: shoku-nihongi
        at: 卷第十六 天平十八年六月己亥
        quote: 靈龜二年入唐學問。
notes:
  The students' sailing with this embassy is stated in their obituaries, which give the year as 靈龜二年
  (the year of appointment), not in the entry itself.
