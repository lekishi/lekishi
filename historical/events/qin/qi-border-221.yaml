# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 221 BCE, the annals record, the king of Qi and his chancellor 后勝 sent troops to guard Qi's western border and cut off contact with Qin."
types: [occurrence]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（發兵守其西界，不通秦）"
  cite:
    - says: "The annals record king 建 and 后勝 guarding the western border in 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（齊王建與其相后勝發兵守其西界）"
      quote: "二十六年，齊王建與其相后勝發兵守其西界，不通秦。"
participants:
  - actor: qi-king-jian
    role: leader
  - actor: hou-sheng
    role: leader
  - actor: qi-state
    role: subject
notes: "The border is not located, so the event carries no place. The hereditary house of Qi records instead that 后勝, bribed by Qin, kept the king from preparing for war; the chapter keeps both accounts on their own events."
