    lang: grc
    script: Grek
    roman: Psyttaleia
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: psyttaleia-greek-name
        says: Pleiades records the ancient Greek name Ψυττάλεια for this place.
        source: pleiades
        at: place 580094, name /places/580094/psyttaleia, dump 2026-10-21
