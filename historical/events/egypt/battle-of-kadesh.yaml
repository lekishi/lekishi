# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The battle of Kadesh on the Orontes in the fifth year of Ramesses II, between the Egyptian army
  and the Hittite king with his allies. The Egyptian poem tells it as Pharaoh's victory; Sayce and Garstang
  read it as a check or an indecisive battle after which Kadesh stayed Hittite.
types: [campaign]
date:
  value: 1275 BCE..1274 BCE
  mode: window
  calendar: regnal
  as_written: year 5 of Ramesses II
  cite:
    - id: battle-of-kadesh-shaw
      says: On Shaw's chronology Ramesses II reigned 1279–1213 BCE, so his year 5 falls in 1275–1274
        BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Nineteenth Dynasty"
places:
  - place: kadesh
    role: site
  - place: orontes
    role: context
participants:
  - actor: ramesses-ii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
  - actor: muwatalli-ii
    role: leader
  - actor: hatti
    role: participant
  - actor: hittite-allies-at-kadesh
    role: participant
cite:
  - id: kadesh-poem-victory
    says: The poem, inscribed by Ramesses' order, tells the battle as his victory.
    source: petrie-victory-of-ramses
    at: the stanza "Then all this came to pass"
    quote:
      Then all this came to pass, I was changed in my heart Like Monthu, god of war, was I made, With
      my left hand hurled the dart, With my right I swung the blade
  - id: kadesh-check
    says: Sayce suggests the poem may cover a check to Egyptian arms, since Kadesh was not attacked.
    role: alternative
    source: sayce-hittites
    at: "ch. II: Kadesh, the outcome"
    quote:
      The act of personal prowess upon which the heroic poem of Pentaur was built may have covered
      what had really been a check to the Egyptian arms. At all events, it is significant that no attempt
      was made to capture Kadesh
  - id: kadesh-indecisive
    says:
      "Garstang judges the battle indecisive: Egyptian losses prevented any pursuit and Kadesh, where
      the Hittite king had taken refuge, was not assailed."
    role: alternative
    source: garstang-land-of-hittites
    at: "ch. VI, p. 343: the battle of Kadesh"
dispute:
  status: disputed
  summary:
    The Egyptian poem presents a victory won by the king alone. Sayce (1890) and Garstang (1910)
    both note that Kadesh was not taken and read the battle as a check or a draw. The records keep the
    poem's account and the two readings side by side.
notes: "An umbrella for the episodes of the battle. Ramesses II's regnal years are converted on
  Shaw's chronology (The Oxford History of Ancient Egypt, 2000), which puts his reign at 1279–1213
  BCE; each regnal year spans two BCE years. Garstang's 1910 dates (Kadesh 1288 B.C., the treaty
  about 1271 B.C.) and Sayce's 1890 dates (1383 and 1354 B.C.) follow older schemes."
