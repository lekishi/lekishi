notes:
  "Greek history of Rome's rise written by Polybius of Megalopolis from about 167 BCE onward; the issued
  year is approximate. Book 3 is the earliest surviving continuous account of 219–216 BCE. Polybius
  says he walked the Alpine route himself (3.48.12) and read Hannibal's bronze tablet at Lacinium
  (3.33.18, 3.56.4), which he follows for troop numbers. He wrote two generations after the events
  and was close to the Scipios; his account is evidence of what he reports, and where Livy differs
  both accounts are kept. Book 7 preserves the text of Hannibal's oath with Philip V's envoys, and
  book 10 gives Laelius' account of the Ticinus rescue."
