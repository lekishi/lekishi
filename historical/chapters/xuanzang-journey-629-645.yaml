# yaml-language-server: $schema=../schema/chapter.schema.json
title: 玄奘's journey to India
summary: In 629 the monk 玄奘 left 長安 without leave to find the Yogācāra texts in India. Follow him across
  the 莫賀延磧 to 高昌, over the 凌山 to the Western Turks' khagan, through 睹貨羅 and 健陀邏 to 那爛陀, around India's
  holy places and courts, and back over the 蔥嶺 and the southern rim of the 流沙 to his reception at 長安 in
  645, with the biography's own gaps and contradictions kept visible.
window: 629..645
story:
  summary: 玄奘's journey from his departure in 629 to his return, audience and first translation work in
    645, following the order of 慧立's biography, with a coda for the 西域記 of 646 and his death in 664.
  span: 629..664
  coverage: Primary window 629–645, with two coda steps at 646 and 664. Only the departure, the 645 return
    and the two coda steps carry month or day dates in the sources; the first stops in the Tang
    northwest sit in a 629 window, and every stop between is placed in an editorial window reckoned from the biography's stated stays, and the windows
    overlap on purpose. Many sites have no cited identification, so most stops carry display anchors or
    no position at all, and no route geometry is drawn.
  notes: Step order follows the biography's narrative order, which is presentation order, not a claim
    that the dates are known to fall in that sequence. The biography's own durations do not add up to
    its summary figures, so the windows are deliberately wide. The departure month (八月 in the narrative,
    四月 in the later memorial, 貞觀初 in the 舊唐書) and the death year (麟德元年 in the biography, 顯慶六年 in the 舊唐書)
    are recorded as disputes rather than merged.
  steps:
  - xuanzang-departure-629: 玄奘 leaves 長安 for India, 629; the sources disagree on the month, and the 舊唐書
      says only 貞觀初
  - xuanzang-travel: 玄奘 travels from 長安 to India and back, 629–645
  - qinzhou-stop-629: 玄奘 goes with the monk 孝達 of 秦州, who is returning home, and stays one night in 秦州,
      629
  - lanzhou-stop-629: At 蘭州 玄奘 stays one night and joins men of 涼州 returning official horses, 629
  - liangzhou-lectures-629: At 涼州 玄奘 stays more than a month and lectures on the 涅槃, 攝論 and 般若, 629
  - liangzhou-order-629: The governor 李大亮, under orders to stop anyone leaving for the west, orders 玄奘
      back to the capital, 629
  - guazhou-stay-629: At 瓜州 玄奘 waits more than a month for a way west
  - yumen-crossing-629: By night 玄奘 and 石盤陀 reach the river and see 玉門關
  - first-beacon-629: At the first beacon, eighty 里 on, arrows are shot at 玄奘 as he draws water
  - fourth-beacon-629: At the fourth beacon the officer 王伯隴 gives 玄奘 a large water skin and tells him
      to bypass the fifth and draw water at 野馬泉
  - mohoyan-crossing-629: Crossing the 莫賀延磧 alone, 玄奘 misses 野馬泉 and spills his water
  - yiwu-arrival-629: At 伊吾 three Chinese monks greet 玄奘, and an envoy of 高昌 who is there carries the
      news to his king
  - gaochang-arrival-630: 麹文泰 sends for 玄奘, who crosses the southern desert in six days and reaches the
      royal city of 高昌 at midnight
  - gaochang-brotherhood-630: 麹文泰 tries to keep 玄奘 by force
  - qu-wentai-brotherhood: 麹文泰 and 玄奘 swear to be brothers before the queen mother of 高昌
  - gaochang-departure-630: 麹文泰 gives 玄奘 four novices, thirty robes, gold, silver and silk for twenty
      years, thirty horses and twenty-five men
  - agni-stop-630: The king of 阿耆尼 meets 玄奘 but, resentful of 高昌's raids, gives no horses
  - kucha-stay-630: At 屈支 玄奘 debates 木叉鞠多 on the 俱舍 and waits more than sixty days for the snow road over
      凌山 to open
  - baluka-stop-630: Past a band of two thousand Turkish raiders who fall out among themselves, 玄奘 reaches
      跋祿迦 and stays one night
  - lingshan-crossing-630: The crossing of 凌山 takes seven days over ice and snow
  - issyk-kul-630: Out of the mountains 玄奘 reaches the great lake 大清池 and follows its shore north-west
  - suyab-khagan-630: At 素葉城 玄奘 meets the 葉護可汗 out hunting and is received in his golden tent with the
      envoys of Tang and 高昌
  - gaochang-turks-letters: 麹文泰 sends the 葉護可汗 silk, fruit and a letter commending 玄奘 as his brother and
      asking for horses and escorts through the western countries
  - talas-stop-630: 玄奘 passes 呾邏斯城, west of the khagan's summer grounds at the 千泉
  - chach-stop-630: 玄奘 passes 赭時 on the 葉河
  - samarkand-630: At 颯秣建 the fire-worshipping king receives 玄奘 coldly, then takes the precepts
  - iron-gate-630: 玄奘 passes through 鐵門, the defile with iron-bound gates at the Turks' frontier, into
      睹貨羅
  - kunduz-stay-630: At 活國 玄奘 finds the khagan's son 呾度設 widowed and ill
  - balkh-stay-630: At 縛喝, the little 王舍城, 玄奘 sees the relics of the 納縛伽藍 and reads the 毗婆沙論 with 般若羯羅
      for more than a month
  - bamiyan-630: At the capital of 梵衍那 the king hosts 玄奘 for days
  - kapisa-retreat-630: At 迦畢試 玄奘 spends the summer retreat at the 沙落迦 monastery, said to have been built
      by a Han hostage prince
  - nagarahara-631: 玄奘 enters northern India at 那揭羅喝, sees the 佛頂骨 and goes alone, past robbers, to the
      cave of the Buddha's shadow
  - purushapura-631: At 布路沙布邏, capital of 健陀邏, 玄奘 visits 迦膩色迦王's great stūpa
  - pushkalavati-631: 玄奘 crosses a great river to 布色羯邏伐底城 and its stūpas
  - taxila-631: Crossing the 信度河, 玄奘 reaches 呾叉始羅 and the stūpa of the thousand heads
  - kashmir-stay-631: The king of 迦濕彌羅 meets 玄奘 with a thousand followers, lodges him at the 闍耶因陀羅寺 and
      gives him twenty copyists
  - sakala-robbery-633: East of 奢羯羅, in the 波羅奢 forest, fifty robbers strip 玄奘's party and drive them
      to a dry pond to be killed
  - cinabhukti-stay-633: At the 突舍薩那寺 in 至那僕底 玄奘 studies the 對法論 and others with 毗膩多缽臘婆 for fourteen months
  - jalandhara-stay-634: At the 那伽羅馱那寺 in 闍爛達那 玄奘 studies four months with 旃達羅伐摩
  - mathura-634: At 秣菟羅 玄奘 sees the stūpas of the Buddha's disciples, each venerated by its own school
  - srughna-stay-634: In 窣祿勤那 玄奘 spends a winter and half a spring hearing the 經部毗婆沙 from 闍耶鞠多
  - matipura-stay-635: In 秣底補羅 玄奘 spends half a spring and a summer studying with 蜜多斯那, a disciple of
      德光
  - sankasya-635: At 劫比他 玄奘 sees the 三寶階, the stair of the Buddha's descent
  - kanyakubja-stay-635: At the 跋達羅毗訶羅寺 in 羯若鞠闍 玄奘 stays three months reading with 毗離耶犀那
  - ganges-pirates-635: Going down the 殑伽河 from 阿踰陀 with eighty others, 玄奘 is seized by river pirates
      who worship 突伽 and want him as an autumn sacrifice
  - prayaga-635: 玄奘 reaches 缽羅耶伽 between the rivers, with the field where kings give away their treasure
  - kausambi-635: At 憍賞彌 玄奘 sees the sandalwood image of 鄔陀衍那王
  - sravasti-635: At 室羅伐悉底 玄奘 visits the ruined 逝多林
  - kapilavastu-636: 玄奘 reaches the ruined city of 劫比羅伐窣堵 and the palace of 淨飯王
  - kusinagara-636: At 拘尸那揭羅 玄奘 sees the 娑羅林 where the Buddha entered nirvāṇa
  - sarnath-636: From 婆羅痆斯 玄奘 goes to the 鹿野伽藍, where the Buddha first preached
  - vaisali-636: 玄奘 crosses the 殑伽河 to the ruined city of 吠舍釐
  - pataliputra-636: At the small town among the ruins of 波吒釐子 玄奘 spends seven days at 無憂王's sites
  - bodh-gaya-636: 玄奘 reaches the 菩提樹 as the rains retreat ends, weeps before it, and spends eight or
      nine days at the sites
  - nalanda-arrival-636: Four monks of 那爛陀 come for 玄奘 and two hundred more escort him in
  - rajagriha-visit-637: From 那爛陀 玄奘 visits 王舍城, the 鷲峰 and the cave of the first council
  - nalanda-yogacara-637: 戒賢 lectures on the 瑜伽師地論 for fifteen months to thousands
  - silabhadra-teaching: 戒賢 teaches 玄奘 the 瑜伽師地論 at 那爛陀
  - hiranyaparvata-stay-638: At 伊爛拏 玄奘 stays a year reading the 毗婆沙 and the 順正理
  - champa-638: 玄奘 goes east along the 殑伽河 to 瞻波
  - pundravardhana-638: 玄奘 crosses the 殑伽河 to 奔那伐彈那
  - samatata-638: At 三摩呾吒 by the sea 玄奘 hears of six countries further east and does not go
  - tamralipti-638: At the port of 耽摩栗底 玄奘 plans to sail for 僧伽羅
  - dhanyakataka-stay-639: At 馱那羯磔迦 玄奘 studies the 大眾部 abhidharma for months with 蘇部底 and 蘇利耶, and they
      study Mahāyāna with him
  - kanchipuram-639: At 建志補羅, the port for 僧伽羅, 玄奘 meets three hundred monks who have fled the king's
      death and famine there, and gives up the crossing
  - bharukaccha-640: Going north-west with seventy monks of 僧伽羅, 玄奘 crosses the 耐秣陀河 to 跋祿羯呫婆
  - valabhi-640: 玄奘 reaches 伐臘毗, whose king is 戒日王's son-in-law
  - parvata-stay-640: At 缽伐多 玄奘 stays two years studying the 正量部 abhidharma
  - nalanda-return-641: 玄奘 returns to 那爛陀 and pays his respects to 戒賢
  - yashtivana-stay-641: 玄奘 studies two years with the lay teacher 勝軍 at 杖林山
  - jayasena-teaching: 勝軍 teaches 玄奘 for two years at 杖林山
  - huizong-treatise-642: Back at 那爛陀, 玄奘 writes the 會宗論 in three thousand verses to reconcile the 中觀
      and 瑜伽 schools
  - kamarupa-invitation-642: 鳩摩羅王 of 迦摩縷波 demands 玄奘 and threatens to trample 那爛陀 if 戒賢 refuses
  - bhaskaravarman-invitation: 鳩摩羅王 invites 玄奘 to 迦摩縷波 under threat and keeps him a month before taking
      him to 戒日王
  - kajangala-meeting-642: 戒日王, back from campaigning, demands 玄奘 from 鳩摩羅王, who brings him up the 殑伽河
      with his army
  - kanyakubja-assembly-642: '戒日王 calls the religious of the five Indias to 曲女城 to hear 玄奘''s treatise:
      eighteen kings'
  - harsha-patronage: '戒日王''s patronage: the meeting at 羯朱嗢祇羅 and the 曲女城 assembly'
  - prayaga-distribution-643: 玄奘 goes with 戒日王 to the field of giving at 缽羅耶伽 for the sixth great distribution,
      held every five years over seventy-five days
  - prayaga-departure-643: 玄奘 refuses 戒日王's and 鳩摩羅王's offers to stay or to go home by sea, saying he
      promised the king of 高昌 to return by the north
  - kausambi-return-643: Seven days through the forest from 缽羅耶伽, 玄奘 is at 憍賞彌 again
  - jalandhara-return-643: At 闍爛達那, the royal seat of the north, 玄奘 stays a month before 烏地多王 sends him
      on
  - taxila-return-643: 玄奘 is at 呾叉始羅 again and stays seven days
  - indus-loss-643: Crossing the 信度河, 玄奘 rides an elephant while the books go by boat
  - udakhand-stay-643: At 烏鐸迦漢荼 玄奘 waits more than fifty days while copies of the lost texts are made
      in 烏仗那
  - kapisa-return-643: At 迦畢試 the king holds a seven-day distribution before 玄奘 leaves for the snow mountains
  - hindu-kush-crossing-643: With an escort from 迦畢試, 玄奘 crosses the snow mountains, on foot after the
      first week, over a pass where birds cannot fly
  - kunduz-return-643: At 活國 玄奘 meets the grandson of the 葉護可汗, now ruling 睹貨羅, and stays a month at his
      camp
  - wakhan-643: 玄奘 passes through 達摩悉鐵帝 on the 縛芻河
  - pamir-643: 玄奘 crosses the 波謎羅川, the high valley in the middle of the 蔥嶺 with its great lake
  - tashkurgan-644: At 朅盤陀 玄奘 stays more than twenty days
  - kashgar-644: Out of the 蔥嶺, 玄奘 reaches 佉沙
  - karghalik-644: 玄奘 crosses the 徙多河 and a ridge to 斫句迦, with its many Mahāyāna books
  - khotan-arrival-644: The king of 瞿薩旦那 meets 玄奘 on the road and lodges him at a 薩婆多 monastery in the
      capital
  - khotan-memorial-644: 'From 于闐 玄奘 sends a memorial to the emperor with 馬玄智 and a caravan: he left without
      leave'
  - taizong-reply-644: The emperor's welcome reaches 于闐 after seven or eight months, with orders that
      敦煌 and 鄯善 meet 玄奘 in the desert
  - niya-644: From 媲摩 玄奘 goes two hundred 里 into the desert to 泥壤城, at the edge of the 流沙
  - cherchen-644: 玄奘 crosses the 流沙 to the deserted old kingdom of 折摩馱那
  - loulan-644: 玄奘 reaches the deserted old kingdom of 納縛波, the land of 樓蘭, and soon after Tang territory
  - shazhou-memorial-644: At 沙州 玄奘 sends another memorial
  - changan-arrival-645: Hurrying to see the emperor before the eastern campaign, 玄奘 arrives at the 漕
      canal before the officials are ready, 645
  - hongfu-procession-645: 'The books and images are carried in procession from 朱雀街 to the 弘福寺: 150 relics,
      seven images, and 657 texts in 520 bundles, 645'
  - luoyang-audience-645: At the 儀鸞殿 of the 洛陽宮 the emperor receives 玄奘 and questions him about the west,
      645
  - taizong-audience: 太宗 receives 玄奘 at 洛陽, pardons the unauthorized departure, and commissions the 西域記
      and the translation at 弘福寺
  - hongfu-translation-645: 玄奘 returns from 洛陽 to 長安 and settles at the 弘福寺 to begin translating, with
      the scholars 房玄齡 assembles, 645
  - xuanzang-texts-transmission: 玄奘 brings 657 Indian texts in 520 bundles, relics and images to 長安 and
      translates them at the 弘福寺
  - xiyu-ji-presented-646: 'Coda — 646: 玄奘 presents the 大唐西域記 in twelve 卷 with the first translations'
  - xuanzang-death-664: 'Coda — 664: 玄奘 dies at the 玉華寺; the 舊唐書 gives 顯慶六年'
