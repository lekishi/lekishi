notes:
  The entry describes 筑紫 as the ancient general name for 九州 and, in a narrower sense, for northern
  九州 centred on the later provinces of 筑前 and 筑後 (present-day Fukuoka Prefecture), the 筑紫国
  that the 律令 settlement divided into those two provinces. It is a modern reference identification,
  not a source statement of the seventh to ninth centuries.
