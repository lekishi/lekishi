# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  阿倍仲麻呂, who came as a student with the 717 embassy, stays in 唐 under the name 朝衡 and holds Tang
  offices, among them 左補闕 and companion to the Prince of 儀.
types: [membership]
from: abe-no-nakamaro
to: tang-dynasty
notes:
  The histories give no dates for the offices beyond 上元中 for the last; the relationship carries none.
  His attempted return of 753 is in the 750–754 embassy.
cite:
  - id: nakamaro-tang-service-basis
    says: The 舊唐書 records that 朝臣仲滿 admired China, stayed, took the name 朝衡, and served as 左補闕 and 儀王友.
    source: jiu-tangshu
    at: 卷199上 東夷 日本國
    quote: 其偏使朝臣仲滿，慕中國之風，因留不去，改姓名爲朝衡，仕歷左補闕、儀王友。
