notes:
  The entry describes 対馬国 as an island of 西海道, present-day 対馬市 in Nagasaki Prefecture, made up
  of the 上県 and 下県 districts, with guards and beacons placed there from 664. It is a modern
  reference identification, not a source statement of the seventh to ninth centuries.
