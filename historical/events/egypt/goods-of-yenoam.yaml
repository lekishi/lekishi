summary:
  "Afterwards the king takes the household goods of the foe in Yenoam, Nuges and Herenkeru, with
  the goods of the cities that submitted: lords, 87 children of the foe and the chiefs, 1,796 slaves,
  and furniture of ivory, ebony and gold, among them a statue of the foe in ebony and gold."
types: [exchange]
part_of:
