# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  Rock Edict XIII: Aśoka declares the conquest by the Law of Piety the chief conquest and claims it has
  been won among all his neighbours as far as six hundred leagues, where Antiochos dwells and beyond him
  the four kings Ptolemy, Antigonos, Magas and Alexander, and in the south among the Cholas and Pāṇḍyas;
  he asks his sons not to seek new conquests.
types: [mission]
date:
  value: 259 BCE..253 BCE
  mode: window
  calendar: julian
  as_written: undated; part of the Fourteen Rock Edicts
  cite:
    - id: dhamma-conquest-time
      says: >-
        The edict is undated; Smith's chronology puts the completion of the Fourteen Rock Edicts in 256
        BCE.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      source: smith-asoka-1920
      at: ch. I, Chronology of the Maurya Period
      quote: Completion of Fourteen Rock Edicts
    - id: dhamma-conquest-256-error-bound
      says: >-
        Smith holds that the error in his dates for the reign cannot exceed three years, so the
        support runs three years either side of his year.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      role: supporting
      source: smith-asoka-1920
      at: ch. I, The History of Asoka
      quote: the error in any case cannot exceed three years
places:
  - place: shahbazgarhi
    role: other
    note: The text Smith translates.
participants:
  - actor: ashoka
    role: leader
  - actor: antiochus-ii
    role: other
  - actor: ptolemy-ii
    role: other
  - actor: antigonus-gonatas
    role: other
  - actor: magas-of-cyrene
    role: other
  - actor: alexander-of-rock-edict-xiii
    role: other
  - actor: cholas
    role: other
  - actor: pandyas
    role: other
notes: >-
  The kings are named in the edict, which claims the conquest by the Law among their realms and records
  no reception at their courts. That envoys carried the teaching among the peoples named is Smith's
  reading of the edict's dūta, envoys or missioners. Western sources on these kings say nothing of it in
  the cited material.
cite:
  - id: dhamma-conquest-kings
    says: The edict names Antiochos and the four kings to the north of him.
    source: asoka-inscriptions
    at: Rock Edict XIII, Shāhbāzgaṛhi text
    quote: >-
      where the king of the Greeks named Antiochos dwells, and to the north of that Antiochos [where dwell]
      the four (4) kings named severally Ptolemy, Antigonos, Magas, and Alexander
  - id: dhamma-conquest-envoys
    says: >-
      Smith reads the next sentence as showing that Aśoka's envoys carried his teaching among all the peoples
      named.
    basis: interpretation
    attributed_to: Vincent A. Smith (1920)
    role: supporting
    source: smith-asoka-1920
    at: ch. IV, The Rock Edicts (comment on Rock Edict XIII)
    quote: >-
      The next sentence shows that Asoka's envoys or missioners, dûta, carried on his propaganda among all
      the peoples named.
