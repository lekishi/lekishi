summary: "The Jews in arms against Rome from 66 to 73 CE: not one army but rival parties (the Temple
  priests around Eleazar son of Ananias, the Zealots, John of Gischala, Simon son of Giora, the
  Sicarii) who also fought each other."
types: [community]
names:
  - form: the seditious
    lang: en
    script: Latn
    note: "Josephus calls them the seditious, the innovators or the robbers; the record's name is
      editorial."
    cite:
      - id: judaean-rebels-name
        says: Josephus calls the rebel party of Gischala the seditious part of the people.
        source: josephus-jewish-war
        at: "4.2.1"
        quote: the seditious part of the people of Gischala were under his management
notes: "One record for the several rebel parties, so the chapter can show the conflict with Rome;
  the parties are named in the events."
