summary: "Vercingetorix, son of Celtillus, a young Arvernian noble who raised the revolt of 52 BCE, was given the supreme command of the Gallic states, held Gergovia against Caesar, and surrendered at Alesia."
types: [person]
names:
  - form: Vercingetorix
    lang: la
    script: Latn
    cite:
      - id: vercingetorix-name
        says: "Caesar introduces Vercingetorix as the son of Celtillus, an Arvernian, a young man of the greatest power."
        source: caesar-gallic-war
        at: "7.4"
        quote: "Vercingetorix, Celtilli filius, Arvernus, summae potentiae adulescens"
roles:
  - role: soldier
    note: Commander of the Gallic coalition in 52 BCE.
