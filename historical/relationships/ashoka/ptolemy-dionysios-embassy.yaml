summary: Ptolemy II's embassy to India by his envoy Dionysios.
types: [diplomacy, travel]
from: ptolemy-ii
to: maurya-empire
notes: >-
  Smith infers the destination; whether Bindusāra or Aśoka received the envoy is open.
