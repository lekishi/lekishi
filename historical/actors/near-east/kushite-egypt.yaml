# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  'Egypt under its Kushite kings: the prism''s "Egyptian kings" with the bowmen, chariots and horses
  of the king of Meluhha (Ethiopia), who came to Ekron''s aid and fought Sennacherib at Eltekeh in 701
  BCE.'
types: [state]
names:
  - form: Meluhha
    lang: akk
    script: Latn
    cite:
      - id: kushite-egypt-name
        says:
          The prism records Ekron calling on the Egyptian kings and the forces of the king of Meluhha,
          which Luckenbill renders Ethiopia.
        source: luckenbill-annals-sennacherib
        at: p. 31, Oriental Institute prism col. II 79–80
        quote:
          and called upon the Egyptian kings, the bowmen, chariots and horses of the king of Meluhha
          (Ethiopia)
  - form: Ethiopia
    lang: en
    script: Latn
    cite:
      - says: The books of Kings call Tirhakah king of Ethiopia.
        source: bible-kjv
        at: 2 Kings 19:9
        quote: Tirhakah king of Ethiopia
notes:
  The prism presents the Egyptian kings and the king of Meluhha as one allied force, so the chapter
  records one actor. It does not decide how the Kushite kings ruled Egypt; Luckenbill names Shabaka as
  the king in 701 BCE (p. 14).
