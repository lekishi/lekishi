# yaml-language-server: $schema=../../schema/event.schema.json
summary: When the ships decide to sail straight for home, 圓仁, 惟正, 惟曉 and 丁雄滿 go ashore to stay in Tang; the ambassador gives them gold, and the nine ships sail without them.
types: [occurrence]
date:
  value: 839-04-05
  calendar: chinese_lunisolar
  as_written: 開成四年四月五日辰時
  cite:
    - id: ennin-stays-ashore-839-time
      says: The diary records the four going ashore to stay and the ambassador giving them twenty large 兩 of gold.
      source: nitto-guho-junrei-gyoki
      at: 卷一 開成四年四月五日
      quote: 請益僧。惟正。惟曉。水手丁雄滿四人。下船留住岸上。節下賜金廿大兩。
places:
  - place: haizhou
    role: site
participants:
  - actor: ennin
    role: leader
  - actor: weizheng
    role: participant
  - actor: weixiao
    role: participant
  - actor: tei-yuman
    role: participant
  - actor: fujiwara-no-tsunetsugu
    role: other
notes: The plan, made with the interpreter 金正南 at 楚州, was to hide in the hills and go on to 天台 and 長安. Found the same day, the monks first claimed to be Silla monks.
cites:
  notes:
    - id: ennin-stays-ashore-plan
      says: "The diary states the plan: to stay with a household, hide in the hills after the ships left, then go to 天台 and 長安."
      source: nitto-guho-junrei-gyoki
      at: 卷一 開成四年四月五日
      quote: 到密州界。留住人家。朝貢船發。隱居山裏。便向天台。兼往長安。
