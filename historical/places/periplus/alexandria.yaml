# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Alexandria, the port of Egypt on the Mediterranean, which the Periplus names as the city that
  now receives goods from abroad and from Egypt, and from which Pliny's route to India begins.
types: [capital, port]
names:
  - form: Alexandria
    lang: en
    script: Latn
    cite:
      - id: alexandria-name
        says:
          The Periplus compares Eudaemon Arabia in its prime to Alexandria, which now receives goods from
          abroad and from Egypt.
        source: periplus-erythraean-sea
        at: "26"
        quote: just as Alexandria now receives the things brought both from abroad and from Egypt
at:
  - interpretation: approximate_point
    precision: locality
    point: [29.909773, 31.201435]
    notes:
      The gazetteer's representative point; an identification by the gazetteer, not a statement of
      the Periplus.
    cite:
      - id: alexandria-location
        says: Pleiades locates ancient Alexandria in the Nile Delta at this representative point.
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: 727070 (reprLatLong), dump 2026-10-21
external_ids:
  - system: pleiades
    id: "727070"
    url: https://pleiades.stoa.org/places/727070
    license: CC BY 3.0
notes: "A shared place: other chapters on Hellenistic and Roman Egypt should reuse this record."
