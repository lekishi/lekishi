notes:
  The city's history of 出水. Its section on the 飛鳥・奈良・平安 periods says the name 出水 first appears
  in the 續日本紀 entry on a 遣唐使 ship that came to 出水 in 778, and that the 出水郡 of the time had
  five 郷 according to the 和名類聚抄. The page gives the 續日本紀's completion as "養老4年（797）", an
  evident slip it is not cited for. It is a modern local identification, not a source statement of the
  eighth century.
