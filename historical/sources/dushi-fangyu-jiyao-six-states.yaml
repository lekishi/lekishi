notes: "A historical geography of China completed in 1692 by 顧祖禹, organized by the Ming
  prefectures. It is a second source record for the same work as `dushi-fangyu-jiyao`, which
  covers the juan the approved Han chapter cites; a separate record keeps that approval from
  going stale. Its identifications are early-modern scholarship relative to the 229–221 BCE
  events, recorded as that work's statements, never as the primary entries'."
