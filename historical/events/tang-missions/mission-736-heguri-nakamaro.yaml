# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  In 735 a '熟崑崙' from 欽州 in 唐 smuggles 廣成's party out, and back in 唐 they meet 阿倍仲滿 (阿倍仲麻呂), who
  petitions for them; the emperor lets them go home by way of 渤海 and gives them a ship and provisions.
types: [occurrence]
date:
  value: 735..738
  mode: window
  calendar: regnal
  as_written: 至七年。有唐國欽州熟崑崙到彼。便被偸載。出來既歸唐國。逢本朝學生阿倍仲滿。
  cite:
    - id: mission-736-heguri-time
      says: 平郡廣成's report dates the rescue to 天平七年 and the meeting with 阿倍仲滿 after it.
      source: shoku-nihongi
      at: 卷第十三 天平十一年十一月辛夘
      quote: 至七年。有唐國欽州熟崑崙到彼。便被偸載。出來既歸唐國。逢本朝學生阿倍仲滿。便奏得入朝。請取渤海路歸朝。天子許之。給船粮發遣。
places:
  - place: changan
    role: context
    note:
      The report says only 唐國; the petition to the emperor puts them at the court in 長安, which the record
      keeps as context.
participants:
  - actor: heguri-no-hironari
    role: leader
  - actor: abe-no-nakamaro
    role: participant
    note: Named 本朝學生阿倍仲滿.
notes: The meeting is undated; the window runs from the rescue (天平七年) to the sailing from 登州 in 天平十年三月.
