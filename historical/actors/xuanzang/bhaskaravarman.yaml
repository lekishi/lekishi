# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  鳩摩羅王, king of 迦摩縷波 in eastern India, who threatened to trample 那爛陀 unless 玄奘 came, and then sailed
  up the 殑伽河 with him to meet 戒日王.
types: [person]
names:
  - form: 鳩摩羅王
    lang: lzh
    script: Hani
    roman: Jiumoluo Wang
    scheme: pinyin
    cite:
      - id: bhaskaravarman-name
        says: The biography names the king of 迦摩縷波 as 鳩摩羅王.
        source: cien-zhuan
        at: 卷四（往東印度迦摩縷波國向鳩摩羅王談法）
        quote: 往東印度迦摩縷波國向鳩摩羅王談法師德義
roles:
  - role: ruler
    cite:
      - id: bhaskaravarman-role
        says: The biography records his army of twenty thousand elephants and thirty thousand boats.
        source: cien-zhuan
        at: 卷五（即命嚴象軍二萬）
        quote: 即命嚴象軍二萬，乘船三萬艘
