notes:
  "Lecture I quotes, after A. Poebel's Historical Texts (1914), Sargon's own inscriptions copied by
  an ancient scribe from his statues at Nippur: the lands Enlil gave him from the Upper Sea to the
  Lower Sea, the march to Mari, Iarmuti, Ibla, the Cedar Forest and the Silver Mountains, and the
  5,400 men who ate bread before him daily. King's identifications of those places are cited as
  his interpretation."
