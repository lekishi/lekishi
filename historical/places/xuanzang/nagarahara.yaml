# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  那揭羅喝, the first kingdom of northern India on the outward road, with the 佛頂骨城 and the cave of
  the Buddha's shadow at 燈光城.
types: [settlement]
names:
  - form: 那揭羅喝
    lang: lzh
    script: Hani
    roman: Najieluohe
    scheme: pinyin
    cite:
      - id: nagarahara-name
        says: The biography records 玄奘 coming down from the ridge and crossing a river to reach 那揭羅喝.
        source: cien-zhuan
        at: 卷二（從此南二十餘里）
        quote: 從此南二十餘里，下嶺渡河，至那揭羅喝國
      - id: nagarahara-xiyu
        says: The 西域記 opens its account of the country with this sentence.
        role: supporting
        source: xiyu-ji
        at: 卷第二 那揭羅曷國
        quote: 那揭羅曷國東西六百餘里，南北二百五六十里。
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      No anchor could be read from Wikidata on 2026-10-21; the record asserts no coordinate until one
      is cited.
    cite:
      - id: nagarahara-unlocated
        says: The biography names 那揭羅喝 but the cited passages state no site for it.
        source: cien-zhuan
        at: 卷二（從此南二十餘里）
