  - kanyakubja-assembly-642
  - prayaga-distribution-643
cite:
  - id: xuanzang-india-sequence
    says: >-
      The biography narrates 玄奘's settling at 那爛陀, his visit to 王舍城, his circuit of eastern, southern
      and western India back to 那爛陀, his years with 勝軍, and his going to 迦摩縷波, to 戒日王, to 曲女城 and
      to 缽羅耶伽, in this order.
    source: cien-zhuan
    at: 卷三（法師於那爛陀寺安置已）— 卷五（至二十一日，發引向缽羅耶伽國就大）
