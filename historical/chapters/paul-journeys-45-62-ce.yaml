title: Paul's journeys
summary: "Paul's journeys as Acts tells them, from 45 to 62 CE: three missions from Antioch through Cyprus, Anatolia,
  Macedonia and Greece, the council at Jerusalem, arrest and two years' custody at Caesarea, and the
  voyage to Rome by way of a shipwreck on Malta. Dated by a 1911 chronology, as an interpretation."
window: 45..62
story:
  summary: "The Acts of the Apostles follows Paul from Antioch on three missions and finally to Rome
    as a prisoner. Acts gives places, seasons and lengths of stay but no years; every year here is F.
    Prat's 1911 reckoning and says so."
  span: 45..62
  coverage: "From the sending of Barnabas and Saul from Antioch to Paul's two years in Rome, as Acts
    13–28 tells it. Excluded: Paul's conversion and early years (Acts 9–12), his letters as a source,
    the trials before Felix, Festus and Agrippa as separate events, minor stops that the gazetteer
    does not locate or that Acts only names in passing (Samothrace, Amphipolis, Apollonia, Assos,
    Mitylene, Chios, Samos, Cos, Rhodes, Patara, Ptolemais, Crete's Lasea and Phoenix), and the
    tradition of his death. No route is drawn; journeys are events with their stops as places."
  notes: "Every event is told by Acts, and its words are quoted from the King James Version. The
    years are an interpretation: Acts names no year, so each event takes the window that F. Prat's
    chronology in the Catholic Encyclopedia (1911) gives for its stage of Paul's life. That reckoning
    is a century old, and a modern chronology anchored on Gallio's proconsulship is a gap the
    feasibility note records."
