license:
  status: recorded
  license_id: other
  attribution_text: Pofatu database (Hermann, Forkel et al.), release v1.4; terms unresolved (CC BY 4.0 or CC BY-NC 4.0)
  redistribution: permitted_with_attribution
  quotation_permitted: false
  reviewed_by: Lekishi editorial preparation
  reviewed_at: "2026-10-21T23:30:00Z"
  notes:
    The terms conflict at the pinned commit a79d299, read 2026-10-21. dist/metadata.json, the Zenodo v1.4
    release and pofatu.clld.org state CC BY 4.0; the repository's LICENSE file states CC BY-NC 4.0. Both allow
    attributed, non-commercial sharing, which is all a draft does, so the record claims no more than that
    and quotes nothing from the release. Under the register's rule a source with a possible non-commercial
    term is not adopted by default; the chapters citing it need the owner's recorded decision, or the
    maintainers' resolution, before they are approved.
notes:
  A compilation of geochemical sourcing studies of Pacific stone and obsidian artefacts. Each contribution
  is a published study; a sample row gives the artefact's site and coordinates. Coordinates are the contributors'
  site locations, sometimes per test pit, and are used as approximate site points.
