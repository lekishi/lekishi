# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Ramesses II mounts his chariot and drives into the enemy, then finds himself alone among 2,500
  Hittite chariots. He prays to Amun, and, by the poem, charges six times and scatters them before his
  army comes up.
types: [campaign]
part_of:
  - battle-of-kadesh
date:
  value: 1275 BCE..1274 BCE
  mode: window
  calendar: regnal
  as_written: year 5 of Ramesses II
  cite:
    - id: ramesses-alone-at-kadesh-shaw
      says: On Shaw's chronology Ramesses II reigned 1279–1213 BCE, so his year 5 falls in 1275–1274
        BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Nineteenth Dynasty"
places:
  - place: kadesh
    role: site
  - place: orontes
    role: context
    note: The poem places the king's camp on the western bank, by the city's northern wall.
participants:
  - actor: ramesses-ii
    role: leader
  - actor: hatti
    role: participant
  - actor: hittite-allies-at-kadesh
    role: participant
cite:
  - id: alone-basis
    says: Sayce retells the king finding himself alone with 2,500 chariots around him.
    source: sayce-hittites
    at: "ch. II: Kadesh, the king alone"
    quote:
      Then he looked behind him, and behold he was alone. The bravest heroes of the Hittite host beset
      his retreat, and 2500 hostile chariots were around him.
  - id: alone-prayer
    says: The poem gives Pharaoh's prayer to Amun.
    role: supporting
    source: petrie-victory-of-ramses
    at: the stanza "Then spake Pharaoh"
    quote: 'Then spake Pharaoh, and he cried: "Father Ammon, where are you? Shall a sire forget his son?'
  - id: alone-charges
    says: Sayce says the king charged the Hittite host six times.
    role: supporting
    source: sayce-hittites
    at: "ch. II: Kadesh, the six charges"
    quote: Six times did he charge the Hittite host, and six times they broke and were slaughtered.
notes: "This is the poem's account, composed for the king. It is reported as what the poem says, not
  as a verified sequence. Ramesses II's regnal years are converted on Shaw's chronology (The Oxford
  History of Ancient Egypt, 2000), which puts his reign at 1279–1213 BCE; each regnal year spans two
  BCE years. Garstang's 1910 dates (Kadesh 1288 B.C., the treaty about 1271 B.C.) and Sayce's 1890
  dates (1383 and 1354 B.C.) follow older schemes."
