# yaml-language-server: $schema=../../schema/event.schema.json
summary: "At Corinth Paul lodges and works as a tentmaker with Aquila and Priscilla, lately come
  from Rome, and stays a year and six months; when Gallio is proconsul of Achaia the Jews bring Paul
  before his tribunal, and Gallio refuses to judge a question of their law."
types: [mission]
part_of:
  - paul-second-journey
date:
  value: "50..53"
  mode: window
  calendar: julian
  as_written: "Prat (1911): second mission, 50-53"
  cite:
    - id: corinth-and-gallio-date
      says: "Prat's chronology of 1911 dates Paul's second mission to 50–53."
      basis: interpretation
      attributed_to: F. Prat (1911)
      source: catholic-encyclopedia
      at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
      quote: "second mission, 50-53"
places:
  - place: corinth
    role: site
participants:
  - actor: paul-the-apostle
    role: leader
  - actor: silas
    role: participant
  - actor: timothy
    role: participant
  - actor: aquila
    role: host
  - actor: priscilla
    role: host
  - actor: gallio
    role: other
cite:
  - id: corinth-aquila
    says: "Acts tells that at Corinth Paul found Aquila and Priscilla, come from Italy because
      Claudius had ordered all Jews to leave Rome."
    source: bible-kjv
    at: "Acts 18:2"
    quote: "because that Claudius had commanded all Jews to depart from Rome:"
  - id: corinth-eighteen-months
    says: Acts tells that Paul stayed a year and six months teaching.
    role: supporting
    source: bible-kjv
    at: "Acts 18:11"
    quote: "And he continued there a year and six months, teaching the word of God among them."
  - id: corinth-gallio
    says: Acts tells that when Gallio was proconsul of Achaia the Jews brought Paul to the judgment seat.
    role: supporting
    source: bible-kjv
    at: "Acts 18:12"
    quote: "And when Gallio was the deputy of Achaia, the Jews made insurrection with one accord
      against Paul, and brought him to the judgment seat,"
notes: "Acts tells it. Gallio's year as proconsul is the anchor most chronologies use for Paul; this
  chapter keeps Prat's 1911 window for the whole second mission and records a modern anchor as a
  gap."
