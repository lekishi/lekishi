# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  奄, where the Bamboo Annals say 盤庚 set out from when he moved to 殷. The historical geography
  identifies it with the old town east of 曲阜; the record cites that identification and asserts no
  coordinate.
types: [settlement]
names:
  - form: 奄
    lang: lzh
    script: Hani
    roman: Yan
    scheme: pinyin
    cite:
      - id: shang-yan-name
        says: The Bamboo Annals record 盤庚 moving from 奄 to 北蒙.
        source: guben-zhushu-jinian
        at: 盤庚（盤庚旬自奄遷于北蒙）
        quote: 盤庚旬自奄遷于北蒙，曰殷。
at:
  - interpretation: unknown
    precision: unspecified
    notes: >-
      The historical geography places 奄城 two li east of the 曲阜 county town and calls the old town
      the 奄 of the 商; it gives no coordinate, and the record does not turn the identification into
      one.
    cite:
      - id: shang-yan-identification
        says: The historical geography records 奄城 east of the 曲阜 county town as the ancient state of 奄.
        basis: interpretation
        attributed_to: 顧祖禹
        source: dushi-fangyu-jiyao-zhou
        at: 卷三十二 山東三 兗州府 曲阜縣（奄城）
        quote: 奄城，在城東二里。古奄國也。
notes: The identification is Qing scholarship and is cited as such.
