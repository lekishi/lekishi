notes:
  The temple's own account. It records that 鑒眞, after five years at 東大寺, was granted the former
  residence of 新田部親王 (present-day 奈良市五条町) and opened a training hall for the precepts there in
  759, and that its Nara-period 金堂 and 講堂 still stand. It is the institution's account of its own
  continuity, not a source statement of the eighth century.
