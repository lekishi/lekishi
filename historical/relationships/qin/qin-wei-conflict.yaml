# yaml-language-server: $schema=../../schema/relationship.schema.json
summary: "Qin's conquest of Wei in 225 BCE: 王賁 flooded 大梁 with the waters of the 河溝 until the walls failed and the king surrendered. The relationship asserts no causation and draws no route."
types: [conflict]
from: qin-state
to: wei-state
notes: "The flood's course is not drawn; the sources name the 河溝 and the city, not a channel. It carries no validity interval, because the sources establish separately dated acts and not a continuous war, and it carries no geometry. It asserts no causation."
cite:
  - says: "The annals record 王賁 attacking Wei and flooding 大梁 in 二十二年."
    source: shiji
    at: "卷六 秦始皇本紀 二十二年（引河溝灌大梁）"
    quote: "二十二年，王賁攻魏，引河溝灌大梁，大梁城壞，其王請降，盡取其地。"
