# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The chancellor 綰 urged that the emperor's sons be made kings of the distant lands of Yan, Qi and Chu. The chief of justice 李斯 argued that the Zhou fiefs had ended in war among kinsmen and that the realm should be commanderies and counties; the First Emperor agreed with him."
types: [council]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（丞相綰等言；廷尉李斯議曰）"
  cite:
    - says: "The annals record the proposal and 李斯's argument after the unification of 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（置諸侯不便）"
      quote: "今海內賴陛下神靈一統，皆為郡縣，諸子功臣以公賦稅重賞賜之，甚足易制。天下無異意，則安寧之術也。置諸侯不便。"
places:
  - place: xianyang
    role: other
    note: "The sources name no place; shown at the capital as a display placement that asserts no site."
participants:
  - actor: wang-wan
    role: participant
    note: "Proposed kings for the distant lands."
  - actor: li-si
    role: participant
    note: "Argued for commanderies."
  - actor: qin-king-zheng
    role: leader
    note: "Decided for 李斯."
notes: "The debate is the annals' account; the decision is recorded as the emperor's words, 廷尉議是."
cite:
  - says: "The annals record the emperor's decision."
    role: supporting
    source: shiji
    at: "卷六 秦始皇本紀 二十六年（廷尉議是）"
    quote: "賴宗廟，天下初定，又復立國，是樹兵也，而求其寧息，豈不難哉！廷尉議是。"
