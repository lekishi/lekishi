notes:
  The temple's own history of its founding. It records the casting of the Great Buddha completed in
  749, the Great Buddha Hall built two years later, and the eye-opening ceremony of 752, at the temple
  whose office is at 奈良市雑司町. It is the institution's account of its own continuity, not a source
  statement of the eighth century.
