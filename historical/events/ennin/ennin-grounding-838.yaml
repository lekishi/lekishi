# yaml-language-server: $schema=../../schema/event.schema.json
summary: Off the mouth of the Yangzi the first ship runs onto a shoal in a storm; the rudder breaks, the mast is cut away, and the hull breaks up on the sands. The ambassador leaves the ship the next day.
types: [occurrence]
date:
  value: 838-06-28
  calendar: regnal
  as_written: 承和五年六月廿八日酉戌
  cite:
    - id: ennin-grounding-838-time
      says: The diary records the ship suddenly running up onto a sandbank in the evening of the 28th.
      source: nitto-guho-junrei-gyoki
      at: 卷一 承和五年六月廿八日
      quote: 船舶卒然趍昇海渚。乍驚落帆。
participants:
  - actor: ennin
    role: leader
  - actor: fujiwara-no-tsunetsugu
    role: participant
notes: The diary's interpreter guesses they had passed 揚州掘港, but the shoal is not placed, so the event carries no place. On the 29th the ship broke apart; the next entry reports that the ambassador left it on 六月廿九日.
cites:
  notes:
    - id: ennin-grounding-ambassador
      says: The diary later learns that the ambassador left the ship on 六月廿九日.
      source: nitto-guho-junrei-gyoki
      at: 卷一 承和五年七月二日
      quote: 聞大使以六月廿九日未時。離船。
