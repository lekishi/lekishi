# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Eltekeh, near which the prism records Sennacherib defeating the Egyptian kings and the army of
  the king of Meluhha in 701 BCE, and which he then besieged and captured. The record asserts no position.
types: [settlement]
names:
  - form: Eltekeh
    lang: en
    script: Latn
    cite:
      - id: eltekeh-name
        says: The prism places the battle in the neighbourhood of Eltekeh.
        source: luckenbill-annals-sennacherib
        at: p. 31, Oriental Institute prism col. II 82
        quote: In the neighborhood of Eltekeh,
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      The prism names Eltekeh without locating it, and the Pleiades dump read for this chapter has
      no record of it. Its identification with an excavated site is debated, so the record asserts no coordinate.
    cite:
      - says: The prism names Eltekeh beside Timnah, without locating it.
        source: luckenbill-annals-sennacherib
        at: p. 32, Oriental Institute prism col. III 6
        quote: Eltekeh (and) Timnah
