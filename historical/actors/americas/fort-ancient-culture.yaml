# yaml-language-server: $schema=../../schema/actor.schema.json
summary: The Fort Ancient culture of the Late Prehistoric Ohio valley, to which one reading of the
  radiocarbon dates attributes Serpent Mound.
types: [culture]
names:
  - form: Fort Ancient culture
    lang: en
    script: Latn
    cite:
      id: fort-ancient-name
      says:
        Lepper reports that Fletcher and colleagues concluded from their dates that Serpent Mound was
        built by the Fort Ancient culture in the early Late Prehistoric period.
      source: lepper-2020-serpent-mound-iconography
      at: "p. 39, Radiocarbon Dates for Serpent Mound"
external_ids:
  - system: wikidata
    id: Q2040969
notes: An archaeological culture, not a polity. It appears here only as the builder named by the
  alternative account of Serpent Mound's age.
