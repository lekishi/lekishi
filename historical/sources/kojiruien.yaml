notes:
  The Meiji government's encyclopaedia of pre-modern Japan, which arranges quoted passages under each
  heading. Under 地部 津, 筑前國 博多津, it quotes the 伊吉連博德書 passage on 筑紫大津之浦 with the
  commentaries 日本書紀通證 (筑紫大津 is the 娜大津 named later in the chronicle) and 書紀集解 (博多津 of
  那珂郡 in 筑前國). These are early-modern identifications, not source statements of the seventh century.
