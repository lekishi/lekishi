summary:
  迦畢試, the kingdom north of the 黑嶺 whose kṣatriya king ruled ten countries; 玄奘 spent the summer
  retreat at the 沙落迦 monastery there in his outward journey and was feted again on his return.
types: [capital, settlement]
names:
  - form: 迦畢試
    lang: lzh
    script: Hani
    roman: Jiabishi
    scheme: pinyin
    cite:
      - id: kapisa-name
        says: The biography records 玄奘 crossing the 黑山 into 迦畢試.
        source: cien-zhuan
        at: 卷二（度黑山，至迦畢試境）
        quote: 度黑山，至迦畢試境
      - id: kapisa-xiyu
        says: The 西域記 opens its account of the country with this sentence.
        role: supporting
        source: xiyu-ji
        at: 卷第一 迦畢試國
        quote: 迦畢試國。周四千餘里。北背雪山。
at:
  - interpretation: unknown
    precision: unspecified
