# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  The trap rock near Shahbazgarhi in the Peshawar valley carrying all the Fourteen Rock Edicts but the
  twelfth, with the twelfth on a separate rock nearby. Like Mansehra it is written in Kharoṣṭhī, right
  to left.
types: [other]
names:
  - form: Shahbazgarhi
    lang: en
    script: Latn
    note: Smith writes Shâhbâzgaṛhi.
    cite:
      - id: shahbazgarhi-name
        says: >-
          Smith places the north-western set of inscriptions at Shâhbâgarhi in the Yûsufzai subdivision of
          the Peshawar District, about forty miles north-east of Peshawar.
        source: smith-asoka-1920
        at: ch. III, The Monuments
        quote: >-
          the ﬁrst set of inscriptions is found at Shâhbâgarhi in the Yûsufzai subdivision of the Peshawar
          District
at:
  - interpretation: approximate_point
    precision: site
    point: [72.16, 34.23555556]
    notes: >-
      The coordinate is the inscribed rock's modern position recorded in Wikidata (CC0).
    cite:
      - id: shahbazgarhi-anchor
        says: >-
          The coordinate is the modern position recorded in Wikidata (CC0); it is a map reference, not a historical
          claim.
        source: wikidata
        at: Q7461477 (P625), revision 2546869846
modern:
  - form: Shahbaz Garhi, Khyber Pakhtunkhwa
    lang: en
    script: Latn
    note: The modern village.
notes: >-
  The furthest of the rock edicts from the capital in Smith's account: more than a thousand miles in a
  direct line from Pāṭaliputra.
