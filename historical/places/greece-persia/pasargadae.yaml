summary:
  Pasargadae in Persis, the royal park with the tomb of Cyrus the Great, whose treasure Alexander
  took in 330 BCE and whose plundered tomb he had restored in 324 BCE.
types: [capital, religious_site]
names:
  - form: Pasargadae
    lang: en
    script: Latn
    note: The form in the cited English translation; the gazetteer records no Greek form for this place.
    cite:
      - id: pasargadae-name
        says: Arrian places the tomb of Cyrus in the royal park at Pasargadae.
        source: arrian-anabasis
        at: VI.29
        quote: The tomb of the famous Cyrus was in the royal park at Pasargadae
at:
  - interpretation: approximate_point
    precision: locality
    point: [53.17432, 30.19522]
    notes:
      "The gazetteer's representative point for the place (location precision: precise). It is the
      gazetteer's identification of the ancient place, not a position the ancient text states."
    cite:
      - id: pasargadae-location
        says:
