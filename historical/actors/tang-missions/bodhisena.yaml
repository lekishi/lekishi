# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  菩提 (Bodhisena), a Brahmin monk from India who came to Japan with the returning 733 embassy in
  736; later he opened the eyes of the Great Buddha at 東大寺.
types: [person]
names:
  - form: 菩提
    lang: lzh
    script: Hani
    roman: Bodhisena
    scheme: other
    cite:
      - id: bodhisena-name
        says: The chronicle names 波羅門僧菩提 among those given seasonal robes on 天平八年十月戊申.
        source: shoku-nihongi
        at: 卷第十二 天平八年十月戊申
        quote: 波羅門僧菩提
roles:
  - role: monk
notes:
  Bodhisena is the conventional Sanskrit restoration of 菩提僊那, an editorial reading aid. The eye-opening
  of 752 is not cited here and is not published by this record.
