# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  守君大石, 坂合部連石積 and others are sent to 大唐, probably, the compilers suggest, as escorts for the returning
  Tang envoys.
types: [mission]
date:
  value: "665"
  calendar: regnal
  as_written: 天智天皇四年 是歲
  cite:
    - id: mission-665-escort-time
      says: The chronicle records the dispatch under 天智天皇四年 是歲, without a month.
      source: nihon-shoki
      at: 卷第廿七 天智天皇四年 是歲
      quote: 是歲，遣小錦守君大石等於大唐，云云。
participants:
  - actor: japan-state
    role: host
  - actor: liu-degao
    role: guest
    note: The compilers suppose the party escorts his return.
notes:
  "The compilers' own gloss is hedged: 蓋送唐使人乎 ('perhaps escorts for the Tang envoys'). 劉德高 leaves
  in the twelfth month (是月，劉德高等罷歸). The entry names no place."
cites:
  notes:
    - id: mission-665-escort-gloss
      says: The note lists 坂合部連石積, 吉士岐彌 and 吉士針間 and supposes they escorted the Tang envoys.
      basis: interpretation
      attributed_to: The compilers of 日本書紀, in their own note
      source: nihon-shoki
      at: 卷第廿七 天智天皇四年 是歲
      quote: 等謂，小山坂合部連石積、大乙吉士岐彌、吉士針間。蓋送唐使人乎。
