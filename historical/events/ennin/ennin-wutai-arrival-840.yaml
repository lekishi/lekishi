summary: Entering the 停點普通院 at the foot of 五臺山, 圓仁 sees the central terrace, prostrates himself and weeps; he counts 2,300 里 and 44 days on the road from 赤山.
types: [journey]
date:
  value: 840-04-28
  calendar: chinese_lunisolar
  as_written: 開成五年四月廿八日
  cite:
    - id: ennin-wutai-arrival-840-time
      says: The diary records seeing the central terrace on the 28th and prostrating himself.
      source: nitto-guho-junrei-gyoki
      at: 卷二 開成五年四月廿八日
      quote: 望見中臺。伏地禮拜。
