notes:
  "Hagiographic biography written by 淡海三船 (真人元開) and dated 779. It is the only continuous
  narrative of the return voyage and the source of the transmission list and the ordination account.
  It is a later, commemorative account: it is evidence of what it reports, not proof that every
  reported event occurred as described, and its miracle material is excluded from the chapter."
