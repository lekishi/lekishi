# yaml-language-server: $schema=../../schema/journey.schema.json
title: Pepin's first Italian campaign, 754 or 755
summary: >-
  Pepin leads the Frankish host by Lyon and Vienne to the Maurienne, forces the Lombard clusae in
  the Susa valley, and besieges Aistulf in Pavia.
travellers:
  - actor: pepin-the-short
    role: leader
  - actor: frankish-kingdom
    role: participant
stops:
  - lyon-march-754
  - vienne-march-754
  - maurienne-camp-754
  - susa-clusae-battle-754
  - pavia-siege-754
cite:
  - id: pepin-campaign-754-sequence
    says: >-
      The continuations narrate the host's march by Lyon and Vienne to the Maurienne, the fight at the
      clusae of the Susa valley, and the camp before Ticinum, in this order.
    source: fredegar-continuations
    at: CXX
    quote: per Lugdunum Galliae et Viennam pergentes, usque Mauriennam pervenerunt … usque ad Ticinum peraccessit, castra metatus est
notes: >-
  The continuations give no start: the host is first named on the road at Lyon. The march shares
  its stops with the pope's return (stephen-return-754).
