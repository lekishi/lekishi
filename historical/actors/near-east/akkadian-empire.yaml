# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Akkad, the state of Sargon and his successors, ruled from Agade, which by Sargon's inscriptions
  held the lands from the Upper Sea to the Lower Sea.
types: [state]
names:
  - form: Akkad
    lang: en
    script: Latn
    cite:
      - id: akkadian-empire-name
        says: King calls Sargon Sargon of Akkad.
        source: king-legends-babylon-egypt
        at: Lecture I
        quote: Sharru-kin, or Sargon of Akkad
notes:
  '"Akkadian empire" is a modern name; the sources say Akkad or Agade. The land of Akkad in later
  Babylonian usage is not this actor.'
