# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Let go by Xerxes at Acanthos, the fleet sails through the canal cut across Athos, collects ships
  and men from the towns of Sithonia and Pallene, and reaches the Thermaic gulf.
types: [journey]
part_of: [xerxes-invasion-480]
date:
  value: 480 BCE
  mode: window
  calendar: julian
  as_written:
    The fleet, when it was let go by Xerxes and had sailed right through the channel made in
    Athos
  cite:
    - id: fleet-through-athos-480-time
      says: Grote dates the crossing that began the campaign to the beginning of 480 BCE.
      source: grote-history-of-greece
      at: vol. V, ch. XXXIX
      quote:
        It was near the time when Xerxes was about to pass the Hellespont, in the beginning of 480
        B. C.
      basis: interpretation
      attributed_to: George Grote
    - id: fleet-through-athos-480-text
      says: Herodotus records the fleet sailing through the Athos channel.
      source: herodotus
      at: VII.122
      quote: The fleet, when it was let go by Xerxes and had sailed right through the channel made in Athos
      role: supporting
places:
  - place: acanthus
    role: start
  - place: xerxes-canal
    role: waypoint
  - place: therma
    role: end
participants:
  - actor: persian-empire
    role: participant
cites:
  places:
    - id: fleet-through-athos-480-places
      says: Herodotus records the fleet sailing on to the Thermaic gulf.
      source: herodotus
      at: VII.122
      quote:
        having taken up a contingent from these cities also, sailed thence with a free course to the
        Thermaïc gulf
