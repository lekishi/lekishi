# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "The Carnutes, the Gallic people around Cenabum on the middle Loire, in whose territory
  Caesar says the druids met each year; their massacre of the Romans at Cenabum began the revolt of
  52 BCE."
types: [community]
names:
  - form: Carnutes
    lang: la
    script: Latn
    cite:
      - id: carnutes-name
        says: "Caesar tells that the Carnutes, led by Cotuatus and Conconnetodumnus, rushed to
          Cenabum at a signal."
        source: caesar-gallic-war
        at: "7.3"
        quote: "Carnutes Cotuato et Conconnetodumno ducibus, desperatis hominibus, Cenabum signo
          dato concurrunt"
