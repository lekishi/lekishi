# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Three men captured by Tang soldiers in the war to save Paekche (663) and made government bondsmen
  in China, among them 錦部刀良 of 讃岐, meet 粟田眞人's embassy after more than forty years and come home with
  it. The court gives them clothes and grain.
types: [occurrence]
date:
  value: 707-05
  calendar: regnal
  as_written: 慶雲四年五月癸亥
  cite:
    - id: mission-707-captives-time
      says: The chronicle records the gift to the returned captives on 慶雲四年五月癸亥.
      source: shoku-nihongi
      at: 卷第三 慶雲四年五月癸亥
      quote: 初救百濟也。官軍不利。刀良等被唐兵虜。沒作官戸。歴■餘年乃免。刀良至是遇我使粟田朝臣眞人等。隨而歸朝。憐其勤苦有此賜也。
participants:
  - actor: awata-no-mahito
    role: other
    note: The captives met his embassy and came back with it.
notes:
  The number of years is damaged in the transcription (歴■餘年). 'More than forty' is the span from
  663 to 707, an editorial reading aid, not the source's figure. The entry names 錦部刀良 of 讃岐, 生王五百足 of
  陸奥 and 許勢部形見 of 筑後.
