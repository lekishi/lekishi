    cite:
      - id: pengcheng-anchor
        says: The label anchor is placed at the coordinate Wikidata (CC0) records for the modern city of 徐州; no historical coordinate is asserted.
        source: wikidata
        at: Q57719 (P625), revision 2550387979
external_ids:
