summary:
  Hezekiah sends to the king of Assyria at Lachish, saying "I have offended", and the king lays
  on him three hundred talents of silver and thirty talents of gold, which Hezekiah pays from the temple
  and palace treasuries and the gold of the temple doors.
types: [mission]
part_of: [sennacherib-third-campaign-701]
date:
  value: 701 BCE
  mode: window
  calendar: regnal
  as_written: in the fourteenth year of king Hezekiah (the invasion; the passage dates no message)
  cite:
    - says: The prism numbers the campaign as Sennacherib's third and gives no year.
      source: luckenbill-annals-sennacherib
      at: p. 29, Oriental Institute prism col. II 37
      quote: In my third campaign I went against the Hittite-land.
    - says: Luckenbill dates the third campaign, and the siege of Jerusalem in it, to 701 BCE.
      role: supporting
      basis: interpretation
      attributed_to: D. D. Luckenbill (1924)
      source: luckenbill-annals-sennacherib
      at: p. 12 (introduction)
      quote: According to the Assyrian account this siege, conducted in 701, led to the submission of Hezekiah
    - says: The books of Kings date the invasion to the fourteenth year of king Hezekiah.
      role: supporting
      source: bible-kjv
      at: 2 Kings 18:13
      quote: Now in the fourteenth year of king Hezekiah
places:
  - place: jerusalem
    role: start
  - place: lachish
    role: end
participants:
  - actor: hezekiah
    role: leader
  - actor: sennacherib
    role: host
cite:
  - says:
      The books of Kings record Hezekiah's message to Lachish and the tribute of three hundred talents
      of silver and thirty of gold.
    source: bible-kjv
    at: 2 Kings 18:14
    quote:
      "I have offended; return from me: that which thou puttest on me will I bear. And the king of
      Assyria appointed unto Hezekiah king of Judah three hundred talents of silver and thirty talents of
      gold."
  - says: The books of Kings record Hezekiah stripping the gold from the temple doors to pay.
    source: bible-kjv
    at: 2 Kings 18:16
    quote: At that time did Hezekiah cut off the gold from the doors of the temple of the LORD
    role: supporting
  - says:
      The prism gives the tribute as thirty talents of gold and eight hundred of silver, brought after
      the king to Nineveh.
    role: conflicting
    source: luckenbill-annals-sennacherib
    at: p. 34, Oriental Institute prism col. III 41–48
    quote: In addition to the 30 talents of gold and 800 talents of silver,
dispute:
  status: disputed
  summary:
    The books of Kings put the payment at Lachish, at three hundred talents of silver and thirty
    of gold, before the Assyrian envoys come to Jerusalem. The prism has the tribute brought after Sennacherib
    to Nineveh, at thirty talents of gold and eight hundred of silver with much else. The chapter keeps
    both accounts, each on its own event, and does not reconcile the figures.
