story:
  summary: "The Erythraean Sea trade, 41–77 CE: the Taprobane embassy under Claudius, the Hippalus crossing, Pliny's route from Alexandria to Muziris, and the ports of the Periplus from Mussel Harbor to Poduca, with the goods that moved between them."
  span: 41..77
  coverage: "The Periplus of the Erythraean Sea (Schoff's 1912 translation), the ports and rulers it names that a gazetteer locates, and Pliny's Natural History VI.24 and VI.26. Dates: the Periplus is undated; every port follows Schoff's 58–62 CE for the voyage, with the other commentators' dates (40–70, 80–89, up to 246–247 CE) as alternatives on the voyage. Pliny's route shares a window of 48–77 CE between his translators' reading and his dedication. Places: Pleiades identifications for the ports, the shared Rome record's Wikidata point, and label anchors only for Egypt and Arabia; unlocated places (Leuke Kome, Sabbatha, Moscha, Rhapta and the far coast of Africa) are left out rather than drawn. Trade: one arc per pair of places the text links; where the text names only a country ('from Egypt', 'from Arabia'), the arc starts at that country's label anchor, never at a chosen port. Excluded: the African coast beyond Adulis, the Persian Gulf, the hearsay of the Ganges, Chryse and Thinae, and the Roman finds in India."
  notes: "The Periplus speaks in the present tense, so every port is one moment, Schoff's window, and the order of the steps is the text's coastal order, not time. Arcs 'from Egypt' and 'from Arabia' start at a label anchor for the country, which asserts no coordinate. Three places reuse ids other branches mint for the same place (bharukaccha, ujjayini, lanka) so that the duplicate surfaces as a build error and is merged, not left as two records."
