notes:
  The city museum's entry on the 近江大津宮錦織遺跡. It says 近江大津宮 was the short-lived capital of
  天智 from 667 to the 壬申 war of 672, that its location was long debated, and that the 1974
  discovery at 錦織 of a large post-built structure identified as the 内裏 south gate settled the
  debate for the time being (一応の終止符); parts of the palace site are a national Historic Site. It
  is a modern archaeological identification, not a source statement of the seventh century.
