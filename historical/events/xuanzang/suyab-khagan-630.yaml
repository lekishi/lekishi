    says: The biography records the khagan ordering letters and an escort as far as 迦畢試.
    source: cien-zhuan
    at: 卷二（作諸國書，令摩咄送法師到迦畢試國）
    quote: 作諸國書，令摩咄送法師到迦畢試國
