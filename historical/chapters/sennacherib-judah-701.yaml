# yaml-language-server: $schema=../schema/chapter.schema.json
title: Sennacherib's campaign to Judah
summary: In his third campaign, which Luckenbill dates to 701 BCE, Sennacherib of Assyria marched on the
  west. Follow Lulê's flight from Sidon, the tribute of the western kings, Ashkelon and Ekron, the battle
  at Eltekeh, the taking of Judah's walled cities, Lachish, and Hezekiah shut up in Jerusalem, told three
  ways.
window: 701 BCE
story:
  summary: 'Sennacherib''s third campaign, 701 BCE: the Phoenician and Philistine cities, the battle at
    Eltekeh, the taking of Judah''s walled cities and Lachish, Hezekiah shut up in Jerusalem and his tribute,
    and the withdrawal to Nineveh, in the prism''s, the books of Kings'' and Herodotus'' accounts.'
  span: 705 BCE..701 BCE
  coverage: 'Sennacherib''s third campaign as the Oriental Institute prism narrates it (col. II 37 to
    col. III 49), with the epigraph over the Lachish relief, the books of Kings (2 Kings 18:13–19:36)
    and Herodotus II.141. Excluded: Sennacherib''s other campaigns, the Babylonian background, Isaiah''s
    and Chronicles'' parallel tellings, Hezekiah''s illness and the Babylonian embassy, the speeches of
    the parley, Sennacherib''s murder, and any second western campaign. No route is drawn, and no territory:
    the accounts name the places but give no stages or extents.'
  notes: Step order is the prism's narrative order, with the books of Kings' episodes placed where Luckenbill
    sets them; it is not a claim about the order of events, which Luckenbill shows is uncertain. The year
    701 BCE is Luckenbill's dating; the prism numbers the campaign, and the books of Kings date it to
    Hezekiah's fourteenth year. Miraculous and legendary accounts are recorded as what their texts say.
  steps:
  - sennacherib-third-campaign-701: Sennacherib's third campaign, against the Hittite-land
  - lule-flight-701: Lulê of Sidon flees into the midst of the sea
  - sidon-cities-submit-701: Lulê's cities submit and Tuba'lu is enthroned
  - western-kings-tribute-701: The kings of Amurru bring tribute
  - sidka-deported-701: Sidka of Ashkelon is carried off to Assyria
  - sidka-cities-taken-701: Sidka's cities near Joppa are taken
  - padi-handed-to-hezekiah: Ekron hands its king Padi to Hezekiah
  - ekron-egypt-alliance-701: Ekron calls on the Egyptian kings
  - eltekeh-battle-701: The battle near Eltekeh
  - eltekeh-timnah-taken-701: Eltekeh and Timnah are taken
  - ekron-punished-701: Ekron is punished
  - padi-restored-701: Padi is brought out of Jerusalem and restored
  - judah-cities-taken-701: 46 of Hezekiah's walled cities are taken
  - lachish-booty-701: The booty of Lachish passes before the king
  - hezekiah-sends-to-lachish: 'Hezekiah sends to Lachish: "I have offended"'
  - rabshakeh-at-jerusalem-701: Rabshakeh at the conduit of the upper pool
  - jerusalem-shut-up-701: Hezekiah shut up in Jerusalem "like a caged bird"
  - judah-land-diminished-701: Judah's cities are given to the Philistine kings
  - libnah-701: The king wars against Libnah
  - tirhakah-advance-701: Word of Tirhakah king of Ethiopia
  - hezekiah-tribute-to-nineveh: Hezekiah's tribute follows the king to Nineveh
  - judah-submits-to-assyria-701: Judah's submission to Assyria
  - sennacherib-withdrawal-701: The withdrawal to Nineveh, told three ways
include: [assyria-judah-war-701]
