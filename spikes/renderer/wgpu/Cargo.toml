[package]
name = "lekishi-wgpu-probe"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "24", default-features = false, features = ["webgl", "wgsl"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Performance"] }
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
