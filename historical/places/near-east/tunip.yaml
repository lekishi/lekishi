# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Tunip (Tunep) in north Syria, against which Ramesses II campaigned after Kadesh, and whose Storm-god
  heads the treaty's list of the gods of Hatti.
types: [settlement]
names:
  - form: Tunep
    lang: egy
    script: Latn
    cite:
      - id: tunip-name
        says: The treaty's list of gods begins with Sutekh of the city of Tunep.
        source: sayce-hittites
        at: "ch. II: the treaty, the gods of Kheta"
        quote: Sutekh of the city] of Tunep
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      Sayce identifies Tunep with Tennib in north Syria; later scholarship has proposed other tells,
      and no gazetteer read for this chapter locates it, so the record asserts no coordinate.
    cite:
      - id: tunip-unlocated
        says: Sayce glosses Tunep as Tennib in north Syria without locating it.
        source: sayce-hittites
        at: "ch. II: the war after Kadesh"
        quote:
          in the eighth year of the Pharaoh's reign Palestine was overrun and certain cities captured,
          including Dapur or Tabor 'in the land of the Amorites,' while other campaigns were directed against
          Ashkelon, in the south, and the city of Tunep or Tennib, in the north.
