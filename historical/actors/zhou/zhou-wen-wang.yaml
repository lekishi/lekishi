# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  西伯昌, the 周 leader posthumously called 文王, whom 紂 imprisoned at 羑里 and then released as 西伯 with the right to make war. He built 豐 and moved there from below 岐, and died the next year; his son 發 conquered 商.
types: [person]
names:
  - form: 西伯昌
    lang: lzh
    script: Hani
    roman: Xibo Chang
    scheme: pinyin
    cite:
      - id: zhou-wen-wang-name
        says: The annals record that the 西伯 built 豐, moved his capital there, and died the next year, and that his heir 發 became 武王.
        source: shiji-yin-zhou
        at: 卷四 周本紀 西伯（明年，西伯崩）
        quote: 明年，西伯崩，太子發立，是為武王。
roles:
  - role: ruler
    note: Leader of 周 as the 商 king's 西伯.
    cite:
      - id: zhou-wen-wang-role
        says: The annals record that the 西伯 built 豐, moved his capital there, and died the next year, and that his heir 發 became 武王.
        source: shiji-yin-zhou
        at: 卷四 周本紀 西伯（明年，西伯崩）
