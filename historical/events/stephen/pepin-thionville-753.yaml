# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Coming through the Ardennes, Pepin is at the royal estate of Thionville on the Moselle when a
  messenger tells him the pope has crossed mons Iovis and is hurrying to him. He orders that the pope
  be received with joy and sends his son Charles to meet him and bring him to Ponthion.
types: [occurrence]
date:
  value: 753-11-15..754-01-06
  mode: window
  calendar: julian
  as_written: Theudone villa publica super Mosella resedisset
  cite:
    - id: pepin-thionville-753-time
      says: The continuations give no date; the news came after the pope had crossed the pass and before the meeting at Ponthion.
      source: fredegar-continuations
      at: CXIX
      quote: Per Arduennam silvam cum ipse rex veniens, et Theudone villa publica super Mosella resedisset, nuntius ad eum veniens dixit
places:
  - place: thionville
    role: site
participants:
  - actor: pepin-the-short
    role: leader
cites:
  summary:
    - id: pepin-thionville-753-orders
      says: The continuations say the king ordered him received with joy and great care and sent his son Charles to meet him and bring him to the royal estate of Ponthion.
      source: fredegar-continuations
      at: CXIX
      quote: cum gaudio et laetitia et ingenti cura recipere eum praecepit, et filio suo Carolo ei obviam ire praecepit, qui usque ad Pontem Ugone, villa publica, ad ejus praesentiam adducere deberet
notes: >-
  Migne's text of the annals adds in brackets, under 753, that the king kept Christmas at Thionville
  and Easter at Quierzy "this year". It is not used here: the bracketed words are an addition, and the
  annals' Christmas-to-Christmas year makes it unclear which Christmas is meant.
