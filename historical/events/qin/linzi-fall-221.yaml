# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 221 BCE 王賁 attacked Qi from the former Yan lands in the north. The hereditary house of Qi records the king following his chancellor's advice and surrendering without a fight, and Qin's army entering 臨淄 with no one among the people daring to resist."
types: [campaign]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（從燕南攻齊，得齊王建）; 王建四十四年（秦兵撃齊）; 始皇帝二十六年（王賁自燕南攻齊）"
  cite:
    - says: "The annals record 王賁 attacking Qi from the south of the Yan lands and capturing king 建 in 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（從燕南攻齊）"
      quote: "秦使將軍王賁從燕南攻齊，得齊王建。"
    - says: "The hereditary house of Qi records the surrender without a fight and Qin's army entering 臨淄."
      role: supporting
      source: shiji-six-states
      at: "卷四十六 田敬仲完世家 王建四十四年（秦兵卒入臨淄）"
      quote: "四十四年，秦兵撃齊。齊王聽相后勝計，不戰，以兵降秦。"
    - says: "The comprehensive mirror records the entry into 臨淄 and Qin's lure of a five-hundred-里 fief."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十六年（卒入臨淄）"
      quote: "王賁自燕南攻齊，卒入臨淄，民莫敢格者。秦使人誘齊王，約封以五百里之地。"
places:
  - place: linzi
    role: site
    note: "The capital entered."
participants:
  - actor: wang-ben
    role: leader
  - actor: qi-king-jian
    role: subject
  - actor: hou-sheng
    role: participant
    note: "Advised surrender."
  - actor: qi-state
    role: subject
notes: "The mirror adds that Qin lured the king with the promise of a fief of five hundred 里; the hereditary house does not record it."
