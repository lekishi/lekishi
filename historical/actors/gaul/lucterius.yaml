# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "Lucterius, a Cadurcan leader who fought with Vercingetorix and in 51 BCE held Uxellodunum with Drappes; he escaped the siege and was later handed to Caesar."
types: [person]
names:
  - form: Lucterius
    lang: la
    script: Latn
    cite:
      - id: lucterius-name
        says: "Hirtius tells that Lucterius, once powerful among his people and always the author of new plans, occupied Uxellodunum."
        source: caesar-gallic-war
        at: "8.32"
        quote: Ibi cum Lucterius apud suos cives quondam integris rebus multum potuisset
