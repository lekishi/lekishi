# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Abdi-liti of Arvad, one of the kings of Amurru whom the prism lists bringing presents and heavy
  tribute to Sennacherib in 701 BCE.
types: [person]
names:
  - form: Abdi-liti
    lang: en
    script: Latn
    cite:
      - id: abdi-liti-of-arvad-name
        says: The prism lists Abdi-liti among the kings who brought tribute.
        source: luckenbill-annals-sennacherib
        at: p. 30, Oriental Institute prism col. II 52
        quote: Abdi-liti, the Arvadite,
roles:
  - role: ruler
    note: Ruler of Arvad; the prism lists him among "kings of Amurru, all of them".
    cite:
      says: The prism lists Abdi-liti among the kings who brought tribute.
      source: luckenbill-annals-sennacherib
      at: p. 30, Oriental Institute prism col. II 52
      quote: Abdi-liti, the Arvadite,
