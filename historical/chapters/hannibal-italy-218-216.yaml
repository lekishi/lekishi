# yaml-language-server: $schema=../schema/chapter.schema.json
title: Hannibal's march into Italy
summary: After taking Saguntum in 219 BCE, Hannibal led a Carthaginian army in 218 BCE from New
  Carthage over the Pyrenees, the Rhône and the Alps into Italy, and in three years beat Rome at the
  Trebia, Lake Trasimene and Cannae. Follow the march stop by stop, the Roman answers to it, and the allies each side won and lost, with
  Polybius and Livy side by side where they disagree.
window: 219 BCE..216 BCE
include:
  - boii-hannibal-alliance-218
  - braneus-hannibal-alliance-218
  - hiero-rome-alliance
  - capua-leaves-rome-216
  - massalia-rome-alliance
story:
  summary: "Hannibal's war in its first three years, 218–216 BCE: the siege of Saguntum and the
    declaration of war, the march from New Carthage to the Po, the battles of the Ticinus, the Trebia,
    Trasimene and Cannae, the Roman dictatorships and rites, and the defection of Capua, with the 215
    BCE treaty with Philip V and the 205 BCE Lacinian inscription as labelled codas."
  span: 219 BCE..205 BCE
  coverage: "Main window 219–216 BCE: the 219 BCE siege of Saguntum and the winter that followed,
    then the war of 218–216 BCE. Included codas outside it: the treaty with Philip V (215 BCE) and the Lacinian
    inscription (205 BCE), which is the source of Polybius' troop figures. Excluded: the rest of the
    war after 216 BCE (Capua's siege, the Metaurus, Zama), the Sicilian and Sardinian theatres, and
    Livy's prodigy lists. No route is drawn: the march's stops are events with one place each, and
    the Rhône crossing, the Island, the Alpine pass, Kissa and the Silva Litana have no asserted
    coordinate. Towns are placed at Pleiades identifications with Wikidata coordinates; rivers,
    mountains and regions carry label anchors only."
  notes: "Step order is presentation order, not a claim that one event preceded or caused another;
    the Iberian events (Kissa, the Ebro naval battle) run alongside the Italian ones. Dates are
    Roman consular years at year precision: the sources' days (the Ides of March, the fourth day
    before the Nones of Sextilis) are kept as written and not converted. Disputed accounts are
    presented as disputed: the year of Saguntum, the army's size on arrival, the Ticinus rescue,
    Sempronius' route, Gerunium, the Cannae wings and losses, Mago's rings and the Philip treaty. This chapter is a draft for testing the data and the engine; no release
    decision has been taken for it."
