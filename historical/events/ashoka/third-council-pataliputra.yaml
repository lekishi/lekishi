# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  Moggaliputta Tissa expels the heretics from the Order and holds the Third Council at the Aśokārāma in
  Pāṭaliputra, which recites the scriptures for nine months. The Ceylon chronicles date it 236 years after
  the Buddha and seventeen and a half years after Aśoka's coronation; Smith's own table puts it about
  240 BCE.
types: [council]
date:
  value: 240 BCE
  mode: window
  calendar: julian
  as_written: cir. 240 (Smith); seventeen and a half years after the coronation (chronicles)
  cite:
    - id: council-time
      says: >-
        Smith's chronology puts the Buddhist Council at Pāṭaliputra about 240 BCE, in the thirtieth regnal
        year.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      source: smith-asoka-1920
      at: ch. I, Chronology of the Maurya Period
      quote: Buddhist Councll at Pâtaliputra.
    - id: council-chronicle-time
      says: >-
        Smith's retelling of the chronicles dates the council 236 years after the Buddha's death and seventeen
        and a half years after Aśoka's coronation, about 252–251 BCE on Smith's epoch.
      role: conflicting
      source: smith-asoka-1920
      at: ch. VI, The Ceylonese Legend of Asoka
      quote: >-
        These events happened in the year 236 after the death of Buddha, and seventeen and a half years
        after the coronation of King Asoka.
places:
  - place: pataliputra
    role: site
participants:
  - actor: moggaliputta-tissa
    role: leader
  - actor: ashoka
    role: host
  - actor: buddhist-sangha
    role: participant
notes: >-
  No inscription mentions a council. Smith associates it with the schism edicts and places it in Aśoka's
  last nine or ten years, against the chronicles' own date.
dispute:
  status: disputed
  summary: >-
    The chronicles date the council seventeen and a half years after the coronation (about 252–251 BCE
    on Smith's epoch), and their story of the missions follows from it. Smith links it to the schism edicts,
    which are later than the Pillar Edicts of 242 BCE, and dates it about 240 BCE. The chapter publishes
    Smith's date and keeps the chronicles' as a conflicting claim; the Lanka events keep the chronicles'
    own years.
cite:
  - id: council-basis
    says: >-
      The retelling says Tishya son of Moggali expelled the heretics and held the Third Council at Pāṭaliputra.
    source: smith-asoka-1920
    at: ch. VI, The Ceylonese Legend of Asoka
    quote: >-
      Tishya, the son of Moggali, having been persuaded to quit his retreat, expelled the heretics, produced
      the Kathâvatthu treatise
  - id: council-smith
    says: >-
      Smith assumes the council took place in the last nine or ten years of Aśoka's life.
    role: supporting
    source: smith-asoka-1920
    at: ch. V, The Pillar and Miscellaneous Inscriptions (comment on the Sârnâth edict)
    quote: took place at some time in the last nine or ten years of Asoka's life
