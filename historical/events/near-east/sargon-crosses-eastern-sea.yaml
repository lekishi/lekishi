# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Sargon crosses the sea in the east, by the Chronicle of Early Kings. The Legend of Sargon, in
  Smith's translation, says he advanced to the sea coast three times and Dilvun (Dilmun) submitted.
types: [campaign]
date:
  value: 2334 BCE..2279 BCE
  mode: window
  calendar: unknown
  as_written: not dated in the chronicle
  cite:
    - says: The Livius translation dates Sargon's reign to 2334–2279 BCE in the middle chronology.
      basis: interpretation
      attributed_to: Livius.org
      source: livius-abc-20
      at: tablet A, line 1, note
places:
  - place: dilmun
    role: context
    note: Named only in the legend.
participants:
  - actor: sargon-of-akkad
    role: leader
cite:
  - says: The chronicle says Sargon crossed the sea in the east.
    source: livius-abc-20
    at: tablet A, line 3
  - says: The legend says he advanced to the sea coast three times and Dilvun submitted.
    role: supporting
    source: smith-chaldean-genesis
    at: chapter XVII (the Legend of Sargon), line 17
    quote: To the sea coast three times I advanced, Dilvun (in the Persian Gulf) submitted
notes: Whether the chronicle's eastern sea and the legend's sea coast are the same is not decided here.
part_of: [sargon-reign]
