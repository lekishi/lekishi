# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  A detachment of Xerxes' army marches through Phocis to plunder the temple at Delphi; the Delphians
  flee except sixty men and the prophet, and the attackers turn back in fear and are pursued into Boeotia.
types: [occurrence]
date:
  value: 480 BCE
  mode: window
  calendar: julian
  as_written: others of them with guides had set forth to go to the temple at Delphi
  cite:
    - id: delphi-attack-480-time
      says:
        Grote counts four months from the departure from Asia to Xerxes' arrival at Athens, which the
        march on Delphi preceded, in 480 BCE.
      source: grote-history-of-greece
      at: vol. V, ch. XLI
      quote:
        Four months had elapsed since the departure from Asia when Xerxes reached Athens, the last
        term of his advance.
      basis: interpretation
      attributed_to: George Grote
    - id: delphi-attack-480-text
      says: Herodotus records the detachment setting out for Delphi.
      source: herodotus
      at: VIII.35
      quote:
        but others of them with guides had set forth to go to the temple at Delphi, keeping Parnassos
        on their right hand
      role: supporting
places:
  - place: delphi
    role: site
participants:
  - actor: persian-empire
    role: participant
notes:
  "Herodotus attributes the retreat to portents: sacred arms appearing before the temple, thunderbolts,
  falling rocks and two armed heroes (VIII.37–39). The record publishes the march and the retreat he reports
  and treats the portents as his account, not as events."
dispute:
  status: disputed
  summary:
    Herodotus's account of the repulse is miraculous, and Grote finds it hard to reconcile with
    Mardonios's words at IX.42 and with Plutarch's statement that the Medes burnt the temple. The record
    keeps Herodotus's account of a march and a retreat and asserts nothing about the portents.
cite:
  - id: delphi-attack-480-doubt
    says:
      Grote notes that Herodotus's account of the attack on Delphi is hard to reconcile with Mardonios's
      words at IX.42 and with Plutarch.
    source: grote-history-of-greece
    at: vol. V, ch. XLI
    quote:
      "upon the Delphian temple, seems not easy to reconcile with the words of Mardonius, Herodot.
      ix, 42: still less can it be reconciled with the statement of Plutarch (Numa, c. 9), who says that
      the Delphian temple was burnt by the Medes."
    basis: interpretation
    attributed_to: George Grote
    role: conflicting
cites:
  summary:
    - id: delphi-attack-480-flight
      says: Herodotus records the attackers' flight and pursuit into Boeotia.
      source: herodotus
      at: VIII.38
      quote:
        All these things having come together, there fell fear upon the Barbarians; and the Delphians
        having perceived that they were flying, came down after them and slew a great number of them; and
        those who survived fled straight to Boeotia.
