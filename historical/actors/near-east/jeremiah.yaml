# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Jeremiah, the prophet whose book records the siege and fall of Jerusalem, who went to Gedaliah
  at Mizpah and was taken into Egypt with the remnant of Judah.
types: [person]
names:
  - form: Jeremiah
    lang: en
    script: Latn
    cite:
      - id: jeremiah-name
        says: Jeremiah names the prophet among those taken to Egypt.
        source: bible-kjv
        at: Jeremiah 43:6
        quote: and Jeremiah the prophet, and Baruch the son of Neriah
notes:
  The book's narrative about him is cited as what it says; the chapter does not claim it was written
  by him.
