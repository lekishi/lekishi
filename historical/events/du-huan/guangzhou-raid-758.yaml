# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "大食 and 波斯 surround the city of 廣州; its prefect 韋利見 climbs the wall and flees, and the
  raiders plunder the granaries, burn the houses and leave by sea. 廣州's report reaches the court on
  the 癸巳 day of the ninth month of 乾元元年 (758); the raid itself is not dated."
types: [campaign]
date:
  value: 758
  mode: window
  calendar: chinese_lunisolar
  as_written: 乾元元年九月癸巳，廣州奏（資治通鑑）; 乾元元年（舊唐書 波斯傳）
  cite:
    - id: guangzhou-raid-time
      says: The mirror records 廣州's report of the raid on the 癸巳 day of the ninth month of 乾元元年.
      source: zizhi-tongjian-tang
      at: 卷二二〇 唐紀三十六 乾元元年九月癸巳（廣州奏）
      quote: 癸巳，廣州奏：大食、波斯圍州城，刺史韋利見逾城走，二國兵掠倉庫，焚廬舍，浮海而去。
    - id: guangzhou-raid-bosi
      says: The 波斯 entry records 波斯 and 大食 raiding 廣州 together in 乾元元年.
      role: supporting
      source: jiu-tangshu-tang-west
      at: 卷一九八 西戎 波斯國（乾元元年，波斯與大食同寇廣州）
      quote: 乾元元年，波斯與大食同寇廣州，劫倉庫，焚廬舍，浮海而去。
