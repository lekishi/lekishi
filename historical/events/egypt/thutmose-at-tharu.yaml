# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  On the 25th day of the fourth month of the second season of year 22, Thutmose III is at Tharu
  on the frontier, at the start of his first victorious campaign.
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: year 22, IV Peret 25
  cite:
    - id: tharu-date
      says: The annals date this to year 22, IV Peret 25.
      source: breasted-ancient-records
      at: "II, Annals of Thutmose III, first campaign: Year 22, IV Peret 25 (Tharu)"
      quote:
        Year 22, fourth month of the second season, on the twenty-fifth day his majesty was in Tharu
        on the first victorious expedition to extend the boundaries of Egypt with might.
places:
  - place: tjaru
    role: start
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: tharu-start
    says: The annals place the king at Tharu at the start of the first campaign.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: Year 22, IV Peret 25 (Tharu)"
    quote:
      Year 22, fourth month of the second season, on the twenty-fifth day his majesty was in Tharu
      on the first victorious expedition to extend the boundaries of Egypt with might.
notes:
  The annals date by regnal year and the civil calendar, and the conversion to a BCE year depends
  on which chronology of the Eighteenth Dynasty is used. The window spans the dates usually given for
  year 23 of Thutmose III, from about 1482 BCE (a higher chronology) to about 1457 BCE (the lower one
  most used today); Breasted's own 1906 table is within it. It is an editorial bound that a cited chronology
  must replace before approval.
