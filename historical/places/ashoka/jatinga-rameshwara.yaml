# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  Jatinga-Rāmeśvara, the third of the neighbouring Mysore localities of the Minor Rock Edicts. The cited
  sources give no position for it.
types: [other]
names:
  - form: Jatinga-Rameshwara
    lang: en
    script: Latn
    note: Smith writes Jatinga-Râmesvara and Jaṭṭinga-Râmeśvara.
    cite:
      - id: jatinga-name
        says: Smith lists Jatinga-Râmesvara between Siddapura and Brahmagiri.
        source: smith-asoka-1920
        at: ch. III, The Monuments (the Minor Rock Edicts)
        quote: Jatinga-Râmesvara, and Brahmagiri
at:
  - interpretation: unknown
    precision: unspecified
    notes: >-
      No coordinate is asserted. Smith says the three Mysore localities are all close to one another, which
      places it near Brahmagiri and Siddapura without locating it.
    cite:
      - id: jatinga-unlocated
        says: >-
          Smith says the three Mysore localities are all close to one another in the Chitaldurg district,
          and gives no position for Jatinga-Rāmeśvara.
        source: smith-asoka-1920
        at: ch. III, The Monuments (the Minor Rock Edicts)
        quote: all close to one another, in the Chitaldûrg District of northern Mysore
notes: >-
  Typed other: the place is an inscribed monument (a rock, boulder or pillar bearing Aśoka's edicts),
  which the v0 place types do not name.
