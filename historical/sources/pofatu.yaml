locator: dataset_row
kind: dataset
title: "Pofatu: a curated and open-access database for geochemical sourcing of archaeological materials"
edition:
  pofatu-data release v1.4, samples table (samples.csv) at commit a79d2999684f00f2f25542d046afa36f09030425,
  read 2026-10-21. A citation names the sample ID and the columns read.
author: A. Hermann, R. Forkel, A. McAlister et al. and the Pofatu contributors (Sci Data 7, 141, 2020)
language: en
identifiers:
  - system: url
    value: https://pofatu.clld.org/
  - system: url
    value: https://zenodo.org/records/21217159
  - system: doi
