# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Darius III's army, chosen ground and scythed chariots at Gaugamela are broken by Alexander's
  charge at the gap in the Persian line; Darius flees, and Alexander pursues him to Arbela the next day.
types: [occurrence]
part_of: [alexander-campaigns-334]
date:
  value: 331 BCE
  mode: window
  calendar: julian
  as_written: in the archonship of Aristophanes at Athens, in the month Pyanepsion
  cite:
    - id: gaugamela-331-time
      says: Chinnock converts the month Pyanepsion in the archonship of Aristophanes to September 331 BCE.
      source: arrian-anabasis
      at: III.15, note 426
      quote: September 331 B.C.
      basis: interpretation
      attributed_to: E. J. Chinnock
    - id: gaugamela-331-eclipse
      says: Chinnock dates the lunar eclipse seen before the battle to 20 September 331 BCE.
      source: arrian-anabasis
      at: III.7, note 384
      quote: This eclipse occurred September 20th, B.C. 331.
      basis: interpretation
      attributed_to: E. J. Chinnock
      role: supporting
    - id: gaugamela-331-text
      says: Arrian dates the battle by the Athenian month and archon.
      source: arrian-anabasis
      at: III.15
      quote:
        Such was the result of this battle, which was fought in the archonship of Aristophanes at Athens,
        in the month Pyanepsion
      role: supporting
places:
  - place: gaugamela
    role: site
  - place: arbela
    role: end
    note: Where Alexander pursued Darius the next day.
participants:
  - actor: alexander-the-great
    role: leader
  - actor: darius-iii
    role: leader
  - actor: parmenio
    role: participant
notes:
  Arrian notes that the battle is usually named after Arbela although it was fought at Gaugamela.
  Chinnock's September conflicts with his own date of 20 September for the eclipse eleven days earlier;
  the window is kept to the year.
cites:
  places:
    - id: gaugamela-331-places
      says: Arrian places the camp at Gaugamela, 600 stades from Arbela.
      source: arrian-anabasis
      at: III.8
      quote:
        With these forces Darius had encamped at Gaugamela, near the river Bumodus, about 600 stades
        distant from the city of Arbela
    - id: gaugamela-331-arbela
      says: Arrian records the pursuit to Arbela.
      source: arrian-anabasis
      at: III.15
      quote: He reached Arbela the next day, having pursued altogether about 600 stades from the battle-field.
      role: supporting
