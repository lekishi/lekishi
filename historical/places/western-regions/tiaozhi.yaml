# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  條支, the country on the western sea that 甘英 reached in 97 CE and from whose shore he turned back.
  The 西域傳 describes a hill-top city with the sea on three sides; its identification is disputed and
  the record carries no position.
types: [region]
names:
  - form: 條支
    lang: lzh
    script: Hani
    roman: Tiaozhi
    scheme: pinyin
    cite:
      - id: tiaozhi-name
        says: The 條支 entry describes a city on a hill, forty 里 round, with the western sea curving round it on three sides.
        source: hou-hanshu
        at: 卷八十八 西域傳 條支國
        quote: 條支國城在山上，周回四十餘里。臨西海，海水曲環其南及東北，三面路絕，唯西北隅通陸道。
at:
  - interpretation: unknown
    precision: unspecified
    notes: Proposals in modern scholarship include Characene at the head of the Persian Gulf and the
      Syrian coast; none is cited here, and the record asserts no position. Where 甘英 stood, and
      which sea he faced, stays unknown.
    cite:
      - id: tiaozhi-unplaced
        says: The 西域傳 describes 條支 by its sea and its hill-top city and states no position that fixes it.
        source: hou-hanshu
        at: 卷八十八 西域傳 條支國
