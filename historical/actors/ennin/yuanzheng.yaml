# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  元政, the esoteric master of the 翻經院 of 大興善寺 in 長安, from whom 圓仁 received the 金剛界 teaching
  and consecration beginning on 開成五年十月廿九日 (840).
types: [person]
names:
  - form: 元政
    lang: lzh
    script: Hani
    roman: Yuanzheng
    scheme: pinyin
    cite:
      - id: yuanzheng-name
        says: The diary records 圓仁 going to 大興善寺 and beginning to receive the 金剛界 teaching from 元政和尚.
        source: nitto-guho-junrei-gyoki
        at: 卷三 開成五年十月廿九日
        quote: 往大興善寺。入勑翻經院。參見元政和尚。始受金剛界大法。
roles:
  - role: monk
    cite:
      - id: yuanzheng-role
        says: The diary calls him the 阿闍梨 of the 翻經院 who understood the 金剛界.
        source: nitto-guho-junrei-gyoki
        at: 卷三 開成五年十月十六日
