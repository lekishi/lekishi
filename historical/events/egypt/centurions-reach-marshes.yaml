# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Two centurions Nero sent to find the sources of the Nile, helped by the king of Ethiopia and
  his letters to neighbouring kings, travel deep into Africa and reach huge marshes choked with vegetation,
  where they see two rocks from which a great body of water issues. Seneca heard their story from them.
types: [journey]
date:
  value: 54-10..65-04
  mode: window
  calendar: julian
  as_written:
    "Pliny: sent by the Emperor Nero … when he was contemplating an expedition against Æthiopia
    (no year)"
  cite:
    - id: nero-mission-bound
      says:
        Seneca, who died in April 65 CE, says he heard the officers' report himself, so the return falls
        within Nero's reign and before Seneca's death.
      source: seneca-natural-questions
      at: VI.8.3
      quote:
        I have myself heard from their own lips the story told by the two non-commissioned officers
        sent to investigate the sources of the Nile by our good Emperor Nero
places:
  - place: nile-marshes
    role: end
participants:
  - actor: kush-kingdom
    role: host
    note: The king of Ethiopia supplied assistance and letters of introduction.
  - actor: nero
    role: other
    note: Sent them.
  - actor: seneca
    role: witness
    note: Heard the report from the centurions; did not travel.
cite:
  - id: centurions-marshes
    says:
      Seneca reports the centurions' journey with the king of Ethiopia's help and their arrival at the
      marshes.
    source: seneca-natural-questions
    at: VI.8.3–4
    quote:
      The King of Ethiopia had supplied them with assistance and furnished letters of introduction
      to the neighbouring kings, and so they had penetrated into the heart of Africa and accomplished a
      long journey. “We came indeed,” I give their own words, “to huge marshes, the limit of which even
      the natives did not know, and no one else could hope to know; so completely was the river entangled
      with vegetable growth
  - id: centurions-rocks
    says: Seneca reports the centurions seeing two rocks from which an immense quantity of water issued.
    role: supporting
    source: seneca-natural-questions
    at: VI.8.4
    quote:
      There,” my informants went on, “we saw with our eyes two rocks from which an immense quantity
      of water issued.”
notes:
  The only first-hand account of the exploration. It names no place on the way and no distance, so
  the journey has an end and no drawn path. Whether these centurions were part of Pliny's praetorian mission
  is not stated.
