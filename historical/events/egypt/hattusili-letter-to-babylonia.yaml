# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The king of Babylonia asks about the treaty, and Hattusili III answers that he and the king of
  Egypt have made an alliance and become brothers against a common foe.
types: [exchange]
date:
  value: 1259 BCE..1245 BCE
  mode: window
  calendar: regnal
  as_written: after year 21 of Ramesses II
  cite:
    - id: hattusili-letter-to-babylonia-shaw
      says: On Shaw's chronology Ramesses II reigned 1279–1213 BCE, so his year 21 falls in
        1259–1258 BCE and his year 34 in 1246–1245 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Nineteenth Dynasty"
places:
  - place: hattusa
    role: start
participants:
  - actor: hattusili-iii
    role: leader
  - actor: kassite-babylonia
    role: participant
cite:
  - id: babylonia-letter-basis
    says: Garstang gives Hattusil's reply to the king of Babylonia about the alliance with Egypt.
    source: garstang-land-of-hittites
    at: "ch. VI, pp. 346–352: the letter to Babylonia, fn. 822"
notes: "Garstang translates from Winckler's first reading of the tablet; the record does not quote
  it. Ramesses II's regnal years are converted on Shaw's chronology (The Oxford History of Ancient
  Egypt, 2000), which puts his reign at 1279–1213 BCE; each regnal year spans two BCE years.
  Garstang's 1910 dates (Kadesh 1288 B.C., the treaty about 1271 B.C.) and Sayce's 1890 dates (1383
  and 1354 B.C.) follow older schemes."
