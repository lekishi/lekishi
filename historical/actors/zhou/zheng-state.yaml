summary: >-
  鄭, the 周 state founded for 桓公友 in 806 BCE, which moved east of 雒 before the fall of Western 周 and
  became a power of the early 春秋 period.
types: [state]
names:
  - form: 鄭
    lang: lzh
    script: Hani
    roman: Zheng
    scheme: pinyin
    cite:
      - id: zheng-state-name
        says: The 鄭 house records that 友 was first enfeoffed at 鄭 in 宣王's twenty-second year.
        source: shiji-chunqiu
        at: 卷四十二 鄭世家 桓公（友初封于鄭）
        quote: 宣王立二十二年，友初封于鄭。
