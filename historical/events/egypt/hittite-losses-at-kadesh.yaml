# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "The Hittite dead at Kadesh, by Garstang's reading of the Egyptian record: two princes of the
  royal blood, several chiefs, soldiers and charioteers, and the Kataonian chief, while the king of Aleppo
  is drowned crossing the moat and marshes around Kadesh."
types: [occurrence]
part_of:
  - battle-of-kadesh
date:
  value: 1300 BCE..1274 BCE
  mode: window
  calendar: regnal
  as_written: year 5 of Ramesses II
places:
  - place: kadesh
    role: site
participants:
  - actor: hatti
    role: subject
  - actor: hittite-allies-at-kadesh
    role: subject
cite:
  - id: losses-basis
    says:
      Garstang lists the Hittite princes and chiefs among the slain and says the king of Aleppo drowned
      in the moat.
    source: garstang-land-of-hittites
    at: "ch. VI, pp. 343–346: the result of the battle"
notes:
  "Garstang does not quote the reliefs' captions he draws on; the record reports his summary. Ramesses
  II's regnal years convert to BCE according to the chronology used: his accession is put at about 1304,
  1290 or 1279 BCE (the low date most used today). The window spans those dates for the year in question.
  Garstang's 1910 dates (Kadesh 1288 B.C., the treaty about 1271 B.C.) fall inside it; Sayce's 1890
  dates (1383 and 1354 B.C.) follow an older scheme and fall outside. It is an editorial bound that a
  cited chronology must replace before approval."
