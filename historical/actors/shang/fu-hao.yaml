# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  婦好, a consort of 武丁 known from oracle-bone inscriptions of his reign and from her tomb at 殷墟,
  the one royal tomb there found unlooted. No transmitted text names her. This record cites only the
  dataset that identifies her tomb; the inscriptions that record her leading campaigns and the
  excavation report are named in the chapter notes as the sources still to be read.
types: [person]
names:
  - form: 婦好
    lang: zh
    script: Hani
    roman: Fu Hao
    scheme: pinyin
    cite:
      - id: fu-hao-name
        says: Wikidata (CC0) names the tomb at 殷墟 the tomb of 婦好.
        basis: interpretation
        attributed_to: Wikidata contributors
        source: wikidata
        at: Q6112269 (label), revision 2551265098
notes: >-
  The name is a modern reading of the inscriptions. The record states nothing about her life that a
  read source does not support; her campaigns against 羌, 土方 and others, often told, wait on an
  oracle-bone corpus and the excavation report being read, as the chapter notes say.
