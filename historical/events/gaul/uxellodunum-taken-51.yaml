# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 51 BCE Lucterius and Drappes held Uxellodunum, an oppidum of the Cadurci strong by nature. The Romans cut the town off from its spring by mining under it; the defenders, thinking the gods had dried it, surrendered. Hirtius tells that Caesar cut off the hands of all who had borne arms and let them live, as a warning."
types: [campaign]
date:
  value: 51 BCE
  mode: window
  calendar: julian
  as_written: "the year of book VIII, the year before L. Paulus and C. Marcellus were consuls (50 BCE)"
  cite:
    - id: uxellodunum-year
      says: "Hirtius says the year after his book, the consulship of L. Paulus and C. Marcellus (50 BCE), had no great deeds in Gaul, so book VIII covers 51 BCE."
      source: caesar-gallic-war
      at: "8.48"
      quote: "propterea quod insequens annus, L. Paulo C. Marcello consulibus, nullas habet magnopere Galliae res gestas."
places:
  - place: uxellodunum
    role: site
    cite:
      id: uxellodunum-place
      says: "Hirtius tells that Lucterius occupied Uxellodunum, a town strongly fortified by nature."
      source: caesar-gallic-war
      at: "8.32"
      quote: "oppidum Uxellodunum, quod in clientela fuerat eius, egregie natura loci munitum, occupat suis et Drappetis copiis oppidanosque sibi coniungit."
participants:
  - actor: julius-caesar
    role: leader
  - actor: lucterius
    role: leader
cite:
  - id: uxellodunum-hands
    says: Hirtius tells that Caesar cut off the hands of all who had borne arms and spared their lives.
    source: caesar-gallic-war
    at: "8.44"
    quote: "Itaque omnibus qui arma tulerant manus praecidit vitamque concessit, quo testatior esset poena improborum."
notes: "Book VIII is by Hirtius, Caesar's officer, not by Caesar; the punishment is told by Caesar's own side."
