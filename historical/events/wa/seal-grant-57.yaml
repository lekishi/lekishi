# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  光武帝 gave the 倭奴國 envoy a seal and its cord (印綬). The 東夷列傳 records the gift in one phrase
  and does not describe the seal; the gold seal inscribed 漢委奴國王, found on 志賀島 in 1784, is
  identified with it by modern scholarship, not by the source.
types: [exchange]
date:
  value: 57
  calendar: chinese_lunisolar
  as_written: 建武中元二年……光武賜以印綬
  cite:
    - id: seal-grant-account
      says: The 東夷列傳 records that 光武 gave the 倭奴國 a seal and cord in the entry for 建武中元二年.
      source: hou-hanshu
      at: 卷八十五 東夷列傳 倭（建武中元二年）
      quote: 倭國之極南界也。光武賜以印綬。
places:
  - place: han-luoyang
    role: site
participants:
  - actor: guangwu-emperor
    role: leader
  - actor: wa-nu-state
    role: subject
notes:
  The date is the year of the entry; the emperor died on 二月戊戌 (29 March 57), so the gift fell
  before then. The record does not claim that the seal found in 1784 is this seal.
