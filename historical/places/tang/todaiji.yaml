# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  東大寺, the Nara temple where the biography records 鑒眞 being installed on 天平勝寶六年二月四日 (754),
  and where the chronicle's later notice places the transmission and the precept study.
types: [religious_site]
names:
  - form: 東大寺
    lang: ja
    script: Hani
    roman: Tōdai-ji
    scheme: hepburn
    cite:
      - id: todaiji-name
        says: The biography names 東大寺 as the temple where 鑒眞 was installed on 天平勝寶六年二月四日.
        source: toseiden
        at: 天平勝寶六年甲午 二月四日，入京…引入東大寺安置
at:
  - interpretation: approximate_point
    precision: locality
    point: [135.8397, 34.6892]
    notes:
      An approximate placement at 東大寺 in Nara, the temple whose Great Buddha Hall stood by 751 and
      whose precinct is the same today. The point marks the temple, not a building of 754.
    cite:
      - id: todaiji-identification
        says:
          東大寺 is the temple at 奈良市雑司町 whose Great Buddha was cast by 749, whose hall was built two
          years later, and whose eye-opening was held in 752. The point is the temple's modern coordinate
          from Wikidata (CC0).
        basis: interpretation
        attributed_to: 東大寺
        sources:
          - source: todaiji-history-nara
            at: 東大寺の創建
          - source: wikidata
            at: Q460367 (P625), revision 2543513396
external_ids:
  - system: wikidata
    id: Q460367
    url: https://www.wikidata.org/wiki/Q460367
    license: CC0-1.0
    note: External identifier found in the Wave 1A feasibility pass.
notes: The place is a named site in the cited passages. The placement rests on the temple's own
  continuity at its precinct; it is not a surveyed reconstruction of the eighth-century precinct.
