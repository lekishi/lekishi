summary:
  Abydos, the city on the Asian shore of the Hellespont where Xerxes reviewed his army and fleet
  before the crossing of 480 BCE and where his army crossed back by ship in the retreat. Distinct from
  Abydos in Egypt.
types: [settlement, port]
