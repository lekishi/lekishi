# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  至那僕底, whose name the 西域記 explains by Chinese hostages, where 玄奘 studied for fourteen months under
  毗膩多缽臘婆.
types: [region]
names:
  - form: 至那僕底
    lang: lzh
    script: Hani
    roman: Zhinapudi
    scheme: pinyin
    cite:
      - id: cinabhukti-name
        says: The biography records 玄奘 reaching 至那僕底 five hundred 里 east of 磔迦.
        source: cien-zhuan
        at: 卷二（從此東行五百餘里）
        quote: 從此東行五百餘里，到至那仆底國
      - id: cinabhukti-xiyu
        says: The 西域記 opens its account of the country with this sentence.
        role: supporting
        source: xiyu-ji
        at: 卷第四 至那僕底國
        quote: 至那僕底國周二千餘里。
at:
  - interpretation: unknown
    precision: unspecified
    notes: The kingdom's site is not identified in the cited sources; the record asserts no coordinate.
    cite:
      - id: cinabhukti-unlocated
        says: The biography names 至那僕底 but the cited passages state no site for it.
        source: cien-zhuan
        at: 卷二（從此東行五百餘里）
