    precision: unspecified
    point: [112.41094, 30.03414]
    notes: Label anchor at the modern county of 江陵 (Wikidata Q1363632). It is not an asserted historical coordinate.
    cite:
      - id: nanjun-anchor
        says: The label anchor is placed at the coordinate Wikidata (CC0) records for the modern county of 江陵; no historical coordinate is asserted.
        source: wikidata
        at: Q1363632 (P625), revision 2526582203
external_ids:
