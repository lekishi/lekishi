title: The campaigns of Alexander
summary: From the destruction of Thebes in 335 BCE to his death at Babylon in 323 BCE, Alexander
  crossed into Asia, defeated Darius III at Issus and Gaugamela, took Egypt and the Persian capitals,
  and marched through Bactria and Sogdiana to the Indus and back. Follow Arrian's account campaign by
  campaign.
window: 335 BCE..323 BCE
story:
  summary: "Alexander's campaigns, 335–323 BCE, as Arrian tells them: Thebes, the crossing into Asia
    and the Granicus, Asia Minor, Issus, Tyre and Gaza, Egypt and Siwa, Gaugamela, the Persian
    capitals and Darius's death, the wars in Bactria and Sogdiana, India to the Hyphasis, the
    Gedrosian desert, and the last years at Susa, Opis, Ecbatana and Babylon."
  span: 335 BCE..323 BCE
  coverage: "Episode window 335–323 BCE. Included: one event for each major stage Arrian narrates,
    from the destruction of Thebes to Alexander's death, with the battles, sieges and foundings he
    describes. Excluded: the Thracian and Illyrian campaigns of 335 BCE, the Lycian and Pamphylian
    marches, the Aegean war at sea, the Mardians, Areians and Drangians, the conspiracies of
    Philotas and of the pages, most Indian sieges and the Mallian campaign beyond its wound, Nearchus's
    voyage, and the Cossaeans. No route geometry is drawn: the campaign event carries the span and
    its stages are separate events at their places. Places carry the Pleiades representative point as
    an approximate point; the Sogdian rock, Thapsacus and Pura are unlocated. Babylon, Gaza and
    Pelusium are records shared with other chapters; Tyre, Susa and Memphis are carried here until
    their owners' records merge."
  notes: "Step order is presentation order and follows Arrian's sequence. Arrian dates by Athenian
    archons, months and Olympiads; every year BCE here is E. J. Chinnock's conversion in his 1884
    translation, cited as his interpretation, and many stages are dated only to the window between
    two of his anchors. The Gordian knot is presented as disputed, with Aristobulus's account as an
    alternative. This chapter is a draft for testing data and engine work, and has not been reviewed
    for publication."
