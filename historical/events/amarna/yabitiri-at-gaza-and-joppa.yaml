# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Yabitiri, brought to Egypt as a boy and raised at the palace gate, writes that he now guards
  the gates of Gaza and Joppa for the king.
types: [other]
part_of:
  - amarna-letters-exchanged
date:
  value: 1410 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: the reigns of Amenophis III and IV
places:
  - place: gaza
    role: site
  - place: joppa
    role: site
participants:
  - actor: yanhamu
    role: witness
cite:
  - id: yabitiri-basis
    says: Yabitiri writes that he served at the palace gate and now guards the gates of Gaza and Joppa.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Yabitiri"
notes:
  "A vassal's statement of service, kept for its two places; Yabitiri himself is not given an actor
  record. The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
