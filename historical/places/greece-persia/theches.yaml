summary:
  Mount Theches, the height from which the Greeks first saw the sea in 400 BCE and raised the cry
  'The sea!'.
types: [landform]
names:
  - form: Θήχης
    lang: grc
    script: Grek
    roman: Theches
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: theches-greek-name
        says: Pleiades records the ancient Greek name Θήχης for this place.
        source: pleiades
        at: place 857349, name /places/857349/Theches-M, dump 2026-10-21
      - id: theches-name
        says: Xenophon names the mountain the Greeks reached as Theches.
        source: xenophon-anabasis
        at: IV.7
        quote: On the fifth day they reached the mountain, the name of which was Theches .
        role: supporting
  - form: Theches
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: theches-name
