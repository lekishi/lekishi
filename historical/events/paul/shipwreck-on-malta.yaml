# yaml-language-server: $schema=../../schema/event.schema.json
summary: "On the fourteenth night the ship nears land, runs aground where two seas meet and breaks
  up; all reach shore on boards and wreckage. The island is Melita, where Publius receives them, and
  they winter three months before sailing in an Alexandrian ship, the Castor and Pollux."
types: [occurrence]
part_of:
  - paul-voyage-to-rome
date:
  value: "59..60"
  mode: window
  calendar: julian
  as_written: "Prat (1911): departure for Rome, 59; captivity at Rome, 60-62"
  cite:
    - id: shipwreck-on-malta-date
      says: "Prat's chronology of 1911 dates the departure for Rome to 59 and the captivity at Rome
        from 60, so the voyage and the winter on Malta fall between."
      basis: interpretation
      attributed_to: F. Prat (1911)
      sources:
        - source: catholic-encyclopedia
          at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
          quote: "arrival of Festus, departure for Rome, 59"
        - source: catholic-encyclopedia
          at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
          quote: "captivity at Rome, 60-62"
places:
  - place: melita
    role: site
participants:
  - actor: paul-the-apostle
    role: subject
cite:
  - id: wreck-aground
    says: Acts tells that they ran the ship aground where two seas met and the stern was broken by the waves.
    source: bible-kjv
    at: "Acts 27:41"
    quote: "And falling into a place where two seas met, they ran the ship aground"
  - id: wreck-melita
    says: Acts tells that once ashore they learned the island was called Melita.
    role: supporting
    source: bible-kjv
    at: "Acts 28:1"
    quote: "And when they were escaped, then they knew that the island was called Melita."
  - id: wreck-three-months
    says: Acts tells that after three months they left in an Alexandrian ship that had wintered at the island.
    role: supporting
    source: bible-kjv
    at: "Acts 28:11"
    quote: "And after three months we departed in a ship of Alexandria, which had wintered in the
      isle, whose sign was Castor and Pollux."
notes: "Acts tells it, and the dates are Prat's 1911 reckoning, an interpretation: Acts gives no
  years."
