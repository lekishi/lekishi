# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At Susa Alexander marries Barsine, daughter of Darius, and Parysatis, daughter of Ochus, and
  holds weddings for his Companions with Persian and Median brides.
types: [occurrence]
part_of: [alexander-campaigns-334]
date:
  value: 325 BCE..323 BCE
  mode: window
  calendar: julian
  as_written: In Susa also he celebrated both his own wedding and those of his companions
  cite:
    - id: susa-weddings-324-time
      says:
        Chinnock dates the march toward Persis to the winter of 325 BCE and Alexander's death to June
        323 BCE; this stage lies between.
      basis: interpretation
      attributed_to: E. J. Chinnock
      sources:
        - source: arrian-anabasis
          at: VI.28, note 814
          quote: B.C. 325.
        - source: arrian-anabasis
          at: VII.28, note 976
          quote: June, 323 B.C.
    - id: susa-weddings-324-text
      says: Arrian records the weddings at Susa.
      source: arrian-anabasis
      at: VII.4
      quote: In Susa also he celebrated both his own wedding and those of his companions.
      role: supporting
places:
  - place: susa
    role: site
participants:
  - actor: alexander-the-great
    role: leader
  - actor: hephaestion
    role: participant
cites:
  summary:
    - id: susa-weddings-324-brides
      says: Arrian records Alexander's own marriages at Susa.
      source: arrian-anabasis
      at: VII.4
      quote:
        He himself married Barsine, the eldest daughter of Darius, and according to Aristobulus, besides
        her another, Parysatis, the youngest daughter of Ochus.
