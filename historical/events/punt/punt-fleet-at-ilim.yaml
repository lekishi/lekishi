# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  On the way home the fleet touches at the coast of the Ilim, who add gold, ivory and skins, live
  leopards, a giraffe and unfamiliar plants to a cargo already full.
types: [exchange]
part_of:
  - punt-expedition
date:
  value: 1505 BCE..1458 BCE
  mode: window
  calendar: regnal
  as_written: later on, in the queen's reign
places:
  - place: ilim
    role: site
participants:
  - actor: punt-royal-envoy
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: ilim-cargo
    says: Maspero says the Ilîm added gold, ivory, skins, leopards and a giraffe.
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the return voyage"
    quote:
      it consisted not only of the inevitable gold, ivory, and skins, but also of live leopards and
      a giraffe, together with plants and fruits unknown on the banks of the Nile.
  - id: ilim-single
    says: Maspero says the completed text shows a single expedition that visited both Pûanît and the Ilîm.
    role: supporting
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the return voyage, note"
    quote:
      The completed text proves that there was but a single expedition, and that the explorers of Pûanît
      visited the Ilîm also.
notes:
  "Maspero notes that Lieblein and Meyer took the Ilim to have been reached by a separate overland
  party. Maspero gives no regnal year for the expedition, only that Hatshepsut reigned at least eight
  years after it. Her reign converts to BCE according to the chronology used: its start is put between
  about 1505 and 1479 BCE and its end between about 1483 and 1458 BCE. The window spans her reign in those
  placements. It is an editorial bound that a cited chronology must replace before approval."
