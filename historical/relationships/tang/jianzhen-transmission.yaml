  mode: duration
  calendar: chinese_lunisolar
  as_written: 合四十八部; 天平勝寶六年二月四日 引入東大寺安置
notes: The list is itemized in the biography and is published as the biography states it. The
  chapter does not claim that the items changed Japanese practice, and it does not reproduce the
  list in full.
