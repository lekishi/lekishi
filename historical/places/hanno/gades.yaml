# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Gades (Gadeira), the city beyond the strait in modern Cádiz, from which Pliny says Hanno sailed
  "to the extremity of Arabia" — an account of the voyage's extent that the Periplus itself does
  not support.
types: [settlement, port]
names:
  - form: Gades
    lang: la
    script: Latn
    cite:
      - id: gades-name
        says:
          Pliny writes that Hanno published an account of a voyage from Gades to the extremity of
          Arabia.
        source: pliny-natural-history
        at: II.67
        quote: Hanno published an account of a voyage which he made from Gades to the extremity of Arabia
at:
  - interpretation: approximate_point
    precision: locality
    point: [-6.29312066667, 36.5292776667]
    notes: The gazetteer's representative point for ancient Gades in modern Cádiz.
    cite:
      - id: gades-location
        says: Pleiades identifies Gadeira/Gades with modern Cádiz and gives this representative point.
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: 256177 (reprLatLong), dump 2026-10-21
external_ids:
  - system: pleiades
    id: "256177"
    url: https://pleiades.stoa.org/places/256177
    license: CC BY 3.0
notes: A shared place for any chapter on the Phoenician and Roman west.
