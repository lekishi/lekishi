# yaml-language-server: $schema=../../schema/relationship.schema.json
summary: 大食's embassies to the Tang court after 751, in 至德初, in 乾元元年 under the name 黑衣大食, and often in 寶應 and 大曆. The relationship records the embassies the entries name and no continuous exchange between them.
types: [diplomacy]
from: dashi
to: tang-dynasty
cite:
  - id: dashi-tang-envoys-basis
    says: The western-regions entry records envoys in 至德初 and frequent envoys in 寶應 and 大曆; the annals record 黑衣大食 envoys in the fifth month of 乾元元年.
    sources:
      - source: jiu-tangshu
        at: 卷一九八 西戎 大食國（至德初遣使朝貢……寶應、大曆中頻遣使來）
        quote: 寶應、大曆中頻遣使來。
      - source: jiu-tangshu
        at: 卷十 肅宗紀 乾元元年五月壬申朔（回紇、黑衣大食各遣使朝貢）
notes: Envoys from the same state across 756–779; the relationship carries no validity interval because the entries attest visits, not a continuous mission.
