summary: A letter from the traders of a 蘇州 ship bound for Japan, 金珍 among them, says they have turned north to fetch the Japanese monks believed to be at 赤山, and will wait for them.
types: [exchange]
date:
  value: 847-06-09
  calendar: chinese_lunisolar
  as_written: 會昌七年六月九日
  cite:
