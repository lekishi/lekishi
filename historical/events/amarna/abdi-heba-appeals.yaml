# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Abdi-Heba of Jerusalem writes that Milkilu and Tagi have hired Habiru against him and that the
  royal cities will fall unless troops come this year.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1380 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
places:
  - place: jerusalem
    role: start
participants:
  - actor: abdi-heba
    role: leader
  - actor: milkilu
    role: subject
  - actor: tagi
    role: subject
  - actor: habiru
    role: subject
cite:
  - id: abdi-heba-basis
    says: Niebuhr quotes Abdikheba asking for troops or to be fetched to die before the king.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Abdikheba"
    quote:
      Shall the royal cities fall a prey to the Habiri? If the Pidati do not come in the course of
      this year, let the king send messengers to fetch me and all my brethren that we may die in the presence
      of the king, our lord."
  - id: abdi-heba-foes
    says: Niebuhr names Milki-El and Tagi as his opponents who recruited Habiri.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Milki-El and Tagi"
    quote:
      Milki-El and his father-in-law Tagi, chiefs in the Philistian plain near Gath, were his principal
      opponents. They recruited troops from among the Habiri
notes:
  "Niebuhr does not say which king; Abdi-Heba's letters are usually put under Akhenaten. The letters
  are undated but for a few dockets, and the reigns they fall in convert to BCE according to the chronology
  used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end of Akhenaten's
  reign between about 1362 and 1334 BCE. The window spans those placements for the reign in question;
  Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall inside it.
  It is an editorial bound that a cited chronology must replace before approval."
