# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Mussel Harbor and Berenice, the two designated harbours at the boundary of Egypt, from which
  ships for Africa, Arabia and India set out.
types: [exchange]
part_of: [periplus-voyage]
date:
  value: 58..62
  mode: window
  calendar: julian
  as_written: no date; the text speaks of the present
  cite:
    - id: egyptian-ports-time
      says:
        The Periplus describes this as present at the time of the voyage it was written from, which
        it does not date; Schoff puts that voyage between the summers of 58 and 62 CE.
      basis: interpretation
      attributed_to: W. H. Schoff (1912)
      sources:
        - source: periplus-erythraean-sea
          at: "1"
        - source: schoff-periplus
          at: Date and Authorship of the Periplus
places:
  - place: myos-hormos
    role: site
  - place: berenice
    role: site
cite:
  - id: egyptian-ports-account
    says:
      The Periplus says both harbours are at the boundary of Egypt, bays opening from the Erythraean
      Sea.
    source: periplus-erythraean-sea
    at: "1"
    quote: The harbors of both are at the boundary of Egypt, and are bays opening from the Erythraean Sea.
