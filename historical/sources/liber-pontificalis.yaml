notes: The papal life of Stephen II, written in Rome during or soon after his pontificate. It is the
  only continuous narrative of the journey, with its dates (leaving Rome on the 14th of October of
  the seventh indiction, leaving Pavia on the 15th of November, the meeting at Ponthion at Epiphany).
  It is a Roman, partisan account written to justify the papacy's turn to the Franks, and it calls
  Aistulf "nefandus" throughout; it is evidence of what the papal court reported, not a neutral
  record.
