notes:
  The entry describes 隠岐国 as the old province formed by the island group in the Sea of Japan north
  of the 島根 peninsula, now in Shimane Prefecture, made up of the 島前 islands and 島後, with four
  districts under the 延喜式. It is a modern reference identification, not a source statement of the
  eighth century.
