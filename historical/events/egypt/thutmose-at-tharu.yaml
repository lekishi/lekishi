# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  On the 25th day of the fourth month of the second season of year 22, Thutmose III is at Tharu
  on the frontier, at the start of his first victorious campaign.
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1458 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: year 22, IV Peret 25
  cite:
    - id: thutmose-at-tharu-shaw
      says: On Shaw's chronology Thutmose III reigned 1479–1425 BCE, so his year 22 falls in
        1458–1457 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
    - id: tharu-date
      role: supporting
      says: The annals date this to year 22, IV Peret 25.
      source: breasted-ancient-records
      at: "II, Annals of Thutmose III, first campaign: Year 22, IV Peret 25 (Tharu)"
      quote:
        Year 22, fourth month of the second season, on the twenty-fifth day his majesty was in Tharu
        on the first victorious expedition to extend the boundaries of Egypt with might.
places:
  - place: tjaru
    role: start
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: tharu-start
    says: The annals place the king at Tharu at the start of the first campaign.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: Year 22, IV Peret 25 (Tharu)"
    quote:
      Year 22, fourth month of the second season, on the twenty-fifth day his majesty was in Tharu
      on the first victorious expedition to extend the boundaries of Egypt with might.
notes: The annals date by regnal year and the civil calendar. The BCE years follow Shaw's chronology
  (The Oxford History of Ancient Egypt, 2000), which puts the accession of Thutmose III in 1479 BCE,
  so year 22 falls in 1458–1457 BCE and year 23 in 1457–1456 BCE. Breasted's own 1906 table follows
  an older, higher chronology.
