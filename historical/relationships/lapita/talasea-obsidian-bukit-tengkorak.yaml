# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  "Obsidian from Talasea on New Britain reaches the Bukit Tengkorak rockshelter in Sabah, about
  3,600 km to the west: the long reach of the same sources in the other direction."
types: [trade]
from: place:talasea-obsidian
to: place:bukit-tengkorak
directionality: directed
causality: not_asserted
cite:
  - id: talasea-bukit-tengkorak
    says:
      Tykot and Chia's contribution documents long-distance exchange between Bukit Tengkorak, the Talaud
      group and Talasea.
    source: pofatu
    at: contribution tykot1996 (contribution_description), v1.4
notes:
  "Undated, and not a Lapita site: the rockshelter is in island South-east Asia. The atlas keeps
  the arc because it shows how far the same obsidian travelled; Pofatu's sample rows assign the flakes
  to groups A, B and C without naming which group is Talasea, so no single flake is cited."
