types: [person]
names:
  - form: 召公奭
    lang: lzh
    script: Hani
    roman: Zhaogong Shi
    scheme: pinyin
    cite:
      - id: zhao-gong-shi-name
        says: The annals record that 成王 had 召公 lay out 洛邑 again, as 武王 had intended.
        source: shiji-yin-zhou
        at: 卷四 周本紀 成王（使召公復營洛邑）
        quote: 成王在豐，使召公復營洛邑，如武王之意。
roles:
