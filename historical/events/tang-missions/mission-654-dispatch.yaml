# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  A second embassy under the 押使 高向玄理, with the ambassador 河邊臣麻呂 and the vice-envoy 惠日, leaves in
  two ships. It takes the Silla route and lands at 萊州.
types: [mission]
date:
  value: 654-02
  calendar: regnal
  as_written: 白雉五年二月
  cite:
    - id: mission-654-dispatch-time
      says: The chronicle dates the embassy to the second month of 白雉五年.
      source: nihon-shoki
      at: 卷第廿五 白雉五年二月
      quote: 二月，遣大唐押使大錦上高向史玄理，
    - id: mission-654-dispatch-variant
      says: A variant the chronicle quotes (或本) dates the sending of 高向玄理 to the fifth month.
      role: conflicting
      source: nihon-shoki
      at: 卷第廿五 白雉五年二月 注
      quote: 或本云，夏五月，遣大唐押使大花下高向玄理。
places:
  - place: naniwa
    role: context
    note:
      The entry names no place. The court sat here in this reign, so the record names its seat as
      context; it asserts no site for the act.
participants:
  - actor: takamuko-no-kuromaro
    role: leader
    note: 押使.
  - actor: kusushi-no-enichi
    role: participant
    note: 副使, on his second mission.
  - actor: japan-state
    role: host
notes:
  The record keeps the chronicle's main text, the second month, as its date; the variant reading
  (或本云，夏五月) stays visible as a conflicting claim, not merged.
dispute:
  status: disputed
  summary: The chronicle dates the embassy to the second month of 白雉五年; a variant it quotes gives the fifth.
cites:
  participants:
    - id: mission-654-envoys
      says: The entry names 高向史玄理 as 押使, 河邊臣麻呂 as 大使 and 藥師惠日 as 副使.
      source: nihon-shoki
      at: 卷第廿五 白雉五年二月
      quote: 大使小錦下河邊臣麻呂，副使大山下藥師惠日，
