# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At daybreak the king renews the fight, and the Hittite king sends a messenger to plead with him,
  calling him Ra-Hormakhis.
types: [campaign]
part_of:
  - battle-of-kadesh
date:
  value: 1275 BCE..1274 BCE
  mode: window
  calendar: regnal
  as_written: the morning after the battle, year 5
  cite:
    - id: kadesh-second-day-shaw
      says: On Shaw's chronology Ramesses II reigned 1279–1213 BCE, so his year 5 falls in 1275–1274
        BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Nineteenth Dynasty"
places:
  - place: kadesh
    role: site
participants:
  - actor: ramesses-ii
    role: leader
  - actor: muwatalli-ii
    role: leader
cite:
  - id: second-day-basis
    says: Sayce says the king wanted to renew the fight at daybreak the next morning.
    source: sayce-hittites
    at: "ch. II: Kadesh, the second day"
    quote: At daybreak the following morning he desired to renew the conflict.
  - id: second-day-messenger
    says: "Sayce quotes the poem: the Hittite king sent a messenger to entreat the king."
    role: supporting
    source: sayce-hittites
    at: "ch. II: Kadesh, the second day (the messenger)"
    quote:
      Then the king of the hostile people of the Hittites sent a messenger to pray piteously to the
      great name of the king
notes: "Ramesses II's regnal years are converted on Shaw's chronology (The Oxford History of Ancient
  Egypt, 2000), which puts his reign at 1279–1213 BCE; each regnal year spans two BCE years.
  Garstang's 1910 dates (Kadesh 1288 B.C., the treaty about 1271 B.C.) and Sayce's 1890 dates (1383
  and 1354 B.C.) follow older schemes."
