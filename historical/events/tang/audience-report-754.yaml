# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  大伴古麻呂 comes from Tang and reports to the court the New Year audience at 蓬萊宮含元殿 and the
  seating-order dispute, in 天平勝寶六年正月 (754). The entry names no place; the record places the act at
  the court's seat, 平城宮, whose palace site is identified; no source places the act there.
types: [mission]
date:
  value: 754-01
  calendar: regnal
  as_written: 天平勝寶六年正月丙寅 副使大伴宿祢古麻呂自唐國至
  cite:
    - id: audience-report-time
      says:
        The chronicle records 大伴宿祢古麻呂 coming from Tang and reporting the New Year audience on
        天平勝寶六年正月丙寅.
      source: shoku-nihongi
      at: 卷第十九 天平勝寶六年正月丙寅
places:
  - place: heijo-palace
    role: site
    note:
      The entry names no place. A court act happens at the court, whose seat in this period is 平城宮
      (the palace of 平城京); the record anchors it there for display only, not as a source-named site,
      and asserts no site for the act.
participants:
  - actor: otomo-no-komaro
    role: leader
notes: This is the court-side report event, distinct from the audience it describes; the report is
  the chapter's only account of the audience and is labelled as a self-report there. The day is a
  sexagenary day (丙寅) and is normalized to the month.
cites:
  participants:
    - id: audience-report-participant
      says: The entry names 古麻呂 as the reporting envoy.
      source: shoku-nihongi
      at: 卷第十九 天平勝寶六年正月丙寅
