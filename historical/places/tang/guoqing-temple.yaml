        says: The biography records the party reaching 國清寺 at dusk after crossing the ridge into 始豐縣.
        source: toseiden
        at: 明日度嶺，入［始豐縣］，日暮至國清寺
  - form: 天台山國清寺
    lang: lzh
    script: Hani
    cite:
      - id: guoqing-temple-name-alt
        says: The biography also names the temple as 天台山國清寺 when 榮叡 and 普照 give out that the provisions are for its monks.
        source: toseiden
        at: 云將供具往天台山國清寺，供養衆僧
