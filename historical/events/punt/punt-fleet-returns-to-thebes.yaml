# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "The fleet returns with chiefs of the coasts on board. Hatshepsut holds a festival: the Theban
  militia and the royal flotilla escort it to the temple landing, and a procession carries the goods,
  the incense trees, the animals and the giraffe to Amun."
types: [occurrence]
part_of:
  - punt-expedition
date:
  value: 1473 BCE..1458 BCE
  mode: window
  calendar: regnal
  as_written: later on, in the queen's reign
  cite:
    - id: punt-fleet-returns-to-thebes-shaw
      says: On Shaw's chronology Hatshepsut reigned 1473–1458 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: thebes
    role: end
  - place: karnak
    role: context
participants:
  - actor: hatshepsut
    role: host
  - actor: punt-royal-envoy
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: return-basis
    says: Maspero says the queen held a festival and the spoil was carried in procession to the god.
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the return"
    quote:
      The Queen inaugurated a solemn festival in honour of the explorers. The Theban militia was ordered
      out to meet them, the royal flotilla escorting them as far as the temple landing-place, where a procession
      was formed to carry the spoil to the feet of the god.
  - id: return-hostages
    says: Maspero takes the chiefs on board for young men given as pledges or commercial hostages.
    role: supporting
    source: maspero-history-of-egypt
    at: "vol. IV, ch. III: the return (the chiefs)"
    quote:
      The chiefs mentioned were probably young men of superior family, who had been confided to the
      officer in command of the squadron by local sheikhs, as pledges to the Pharaoh of good will or as
      commercial hostages.
notes: "The inscriptions present the chiefs as vassals bringing tribute; Maspero reads them as
  hostages for trade. Maspero gives no regnal year for the expedition, only that Hatshepsut reigned
  at least eight years after it. The window is her reign on Shaw's chronology (The Oxford History of
  Ancient Egypt, 2000), 1473–1458 BCE."
