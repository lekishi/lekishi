  as_written: 二十九年
  cite:
    - id: bolangsha-attack-218-account
      says: The annals record the attack at 博狼沙 and the ten-day search.
      source: shiji
      at: 卷六 秦始皇本紀 二十九年（至陽武博狼沙中）
      quote: 二十九年，始皇東游。至陽武博狼沙中，為盜所驚。求弗得，乃令天下大索十日。
