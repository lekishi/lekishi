# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "The Teouma cemetery in use: burials, cremations and secondary burials of the first settlers
  of Efate, from its earliest use to the last interment."
types: [process]
part_of: [lapita-expansion]
date:
  value: 991 BCE..771 BCE
  mode: duration
  calendar: julian
  as_written: most burials 2940–2720 cal BP; earliest use c. 2970, last interment c. 2770–2710 cal BP
  cite:
    - id: teouma-cemetery-time
      says:
        Petchey and colleagues date the majority of the burials to 2940–2720 cal BP, with earliest use
        about 2970 and the last interment about 2770–2710 cal BP, converted from cal BP as BCE = BP − 1949
        (1950 CE is 0 BP; there is no year zero).
      basis: interpretation
      attributed_to: F. Petchey, M. Spriggs, S. Bedford and F. Valentin (2015)
      source: petchey-2015-teouma
      at: 95 (abstract); 103
places:
  - place: teouma
    role: site
notes:
  The cemetery dates come from bone and shell artefacts dated directly; their range begins a little
  before the midden's most likely start, which the source treats as consistent, not as a conflict.
participants:
  - actor: lapita-culture
    role: participant
