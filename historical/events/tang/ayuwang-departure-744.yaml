summary: Moved by the two monks' resolve, 鑒眞 sends 法進 and two lay attendants ahead to 福州 to buy a ship. With 祥彥, 榮叡, 普照, 思託 and others, more than thirty, he takes leave of 阿育王寺; the prefect 盧同宰 sends provisions with them, and they lodge at 白泉寺 in 寧海縣.
types: [journey]
date:
  value: 744..745
  mode: window
  calendar: chinese_lunisolar
  cite:
    - id: ayuwang-departure-time
      says: The biography tells the departure after 榮叡's release, without a date of its own.
      source: toseiden
      at: 和上率諸門徒祥彥、榮叡、普照、思託等三十餘人，辭禮育王塔
places:
  - place: ayuwang-temple
    role: start
  - place: fuzhou
    role: context
    note: The intended port, where 法進 was sent to buy a ship; the party never reached it.
participants:
  - actor: jianzhen
    role: leader
  - actor: fajin
    role: participant
    note: Sent ahead to 福州 to buy a ship.
  - actor: xiangyan
    role: participant
  - actor: yoei
    role: participant
  - actor: fusho
    role: participant
  - actor: situo
    role: participant
notes: The biography dates the lectures to 天寶三載 and gives no further year until 天寶七載, so this event is an occurrence window over 744–745 rather than a dated instant. 白社村寺 and 白泉寺 in 台州寧海縣 are named in the biography and kept here rather than given records.
cites:
  participants:
    - id: ayuwang-departure-participants
      says: The biography records 法進 sent to 福州 and the disciples who left with 鑒眞.
      source: toseiden
      at: 乃遣僧法進及二近事，將輕貨往福州買舟; 和上率諸門徒祥彥、榮叡、普照、思託等三十餘人
