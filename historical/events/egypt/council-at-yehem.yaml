# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At Yehem the king holds a council of war. The chief of Kadesh is in Megiddo with the chiefs of
  every land as far as Naharin. The officers fear the narrow Aruna road and urge the roads by Taanach
  or north of Zefti; the king swears he will go by Aruna, and leads the way himself.
types: [council]
part_of:
  - megiddo-campaign
date:
  value: 1457 BCE..1456 BCE
  mode: window
  calendar: regnal
  as_written: after year 23, I Shemu 16, at Yehem
  cite:
    - id: council-at-yehem-shaw
      says: On Shaw's chronology Thutmose III reigned 1479–1425 BCE, so his year 23 falls in
        1457–1456 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
