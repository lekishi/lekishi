# yaml-language-server: $schema=../../schema/territory.schema.json
summary: "The places the sources record Qin holding after 王翦 took the land from 陳 south to 平輿 in 224 BCE."
controller: qin-state
date:
  value: "224 BCE..223 BCE"
  mode: duration
  calendar: chinese_lunisolar
  as_written: "二十三年（取陳以南至平輿）"
places:
  - place: xianyang
    role: seat
  - place: yingchuan
    gained: han-annexation-yingchuan
  - place: handan
    gained: handan-fall-228
  - place: dongyang-zhao
    gained: handan-fall-228
  - place: ji-yan
    gained: ji-fall-226
  - place: daliang
    gained: daliang-flood-225
  - place: chen
    gained: chu-campaign-224
  - place: pingyu
    gained: chu-campaign-224
cite:
  - says: "The annals record Qin taking the land from 陳 south to 平輿 in 二十三年 (224 BCE), and the king of Qin travelling to 郢陳."
    source: shiji
    at: "卷六 秦始皇本紀 二十三年（取陳以南至平輿）"
    quote: "取陳以南至平輿，虜荊王。秦王游至郢陳。"
notes: "The window runs to the year before the next change the annals record (遼東, 代 and 會稽 in 222 BCE). The capture of the Chu king falls in this window in every account; which year is disputed on the Chu snapshot chu-held-224."
