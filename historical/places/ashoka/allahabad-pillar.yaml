# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  The Allahabad pillar in the Fort at Prayāga, carrying Pillar Edicts I to VI, the Kauśāmbī schism edict
  addressed to the high officers of Kosambi, and the Queen's Edict. Smith thinks it was brought from Kauśāmbī,
  possibly by Fīrōz Tughlak.
types: [other]
names:
  - form: Allahabad pillar
    lang: en
    script: Latn
    cite:
      - id: allahabad-pillar-name
        says: >-
          Smith's table places the pillar in the Fort at Allahabad, evidently removed from Kauśāmbī.
        source: smith-asoka-1920
        at: ch. III, Existing Inscribed Pillars of Asoka
        quote: evidently removed from Kauśâmbî, possibly by Sultan Fîroz
at:
  - interpretation: approximate_point
    precision: site
    point: [81.875, 25.4311]
    notes: >-
      The coordinate is the pillar's modern position recorded in Wikidata (CC0). It is the present position;
      the original one is not established.
    cite:
      - id: allahabad-pillar-anchor
        says: >-
          The coordinate is the modern position recorded in Wikidata (CC0); it is a map reference, not a historical
          claim.
        source: wikidata
        at: Q4730345 (P625), revision 2517643491
notes: >-
  Smith argues that the Buddhist Kauśāmbī of the edict may have stood near Bharhut rather than at Kosam;
  the chapter keeps the pillar where it stands and names Kauśāmbī as context on the events.
