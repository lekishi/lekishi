# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Magilus, a chieftain of the Gauls of the Po plain who came to Hannibal at the Rhône in 218 BCE and
  pledged to share in the war against Rome.
types: [person]
names:
  - form: Μάγιλος
    lang: grc
    script: Grek
    cite:
      - id: magilus-name-polybius
        says:
          Polybius records the petty kings about Μάγιλος coming to Hannibal from the plains of the
          Po.
        source: polybius
        at: "3.44.5"
        quote:
          εἰσήγαγε τοὺς βασιλίσκους τοὺς περὶ Μάγιλον — οὗτοι γὰρ ἧκον πρὸς αὐτὸν ἐκ τῶν περὶ τὸν
          Πάδον πεδίων —
