summary: 黑衣大食 succeeding 白衣大食 as 大食's ruling house, in the western-regions entries' account of how 波悉林 of 呼羅珊 raised an army in black, killed 末換 and set up 阿蒲羅拔.
types: [successor_of]
from: abbasid-dynasty
to: umayyad-dynasty
cite:
  - id: abbasid-succession-basis
    says: The western-regions entry says 大食 was called 白衣大食 before 末換 and 黑衣大食 from 阿蒲羅拔 on.
    source: jiu-tangshu-tang-west
    at: 卷一九八 西戎 大食國（一云隋開皇中）
    quote: 末換已前謂之「白衣大食」，自阿蒲羅拔後改為「黑衣大食」。
notes: "Undated. Both histories tell the change as an alternative account of 大食's origins (舊唐書 一云, 新唐書 或曰), with no year, so its place after the 開元 embassies dates nothing; the Arabic histories' 750 is not cited. The rulers keep the sources' names: 末換, 阿蒲羅拔, and 阿蒲恭拂, who appears with the envoys of 至德初."
