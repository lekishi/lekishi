# yaml-language-server: $schema=../schema/chapter.schema.json
title: The embassy to Tang China
summary: In 750 the Japanese court appointed an embassy to Tang China. Follow 藤原朝臣清河's mission from
  the appointment and the audiences at court to the invitation to the monk 鑒眞, the return voyage
  that scattered its ships, and the ordinations of 754 — with the sources' own gaps and
  disagreements kept visible. A second story follows 鑒眞's earlier attempts to cross, 742–750, and
  a third follows 圓仁's diary of 838–847.
window: 750..754
include:
  - komaro-tang-contact
  - jianzhen-to-nara-753
  - kibi-no-makibi-753
  - fujiwara-no-kiyokawa-753
  - ennin-to-yangzhou-838
  - ennin-to-chishan-839
  - ennin-pilgrimage-840
  - ennin-expulsion-845
  - ennin-return-847
