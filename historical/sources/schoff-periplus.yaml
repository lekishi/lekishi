notes:
  Early twentieth-century scholarship. Schoff dates the voyage behind the Periplus to between the
  summers of 58 and 62 CE and lists the other commentators' dates in three groups (before Pliny, 40–70;
  after Salt's Za Hakale, 75–90; the second and third centuries). Every date taken from it is published
  as Schoff's or the commentator's interpretation.
