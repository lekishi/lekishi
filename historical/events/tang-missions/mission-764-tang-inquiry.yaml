summary:
  Silla envoys at 博多津 explain they have come because the Tang envoy 韓朝彩 asked whether 戒融, whom
  he had sent home through 渤海, arrived safely. 大宰府 answers that 戒融 came back by way of 渤海 the previous
  autumn.
types: [exchange]
date:
  value: 764-07
  calendar: regnal
  as_written: 天平寶字八年七月甲寅
  cite:
    - id: mission-764-inquiry-time
      says: The chronicle records the Silla envoys' arrival at 博多津 on 天平寶字八年七月甲寅.
      source: shoku-nihongi
      at: 卷第廿五 天平寶字八年七月甲寅
      quote: 唐國勅使韓朝彩自渤海來云。送日本國僧戒融。令達本郷已畢。若平安歸郷者。當有報信。
places:
  - place: hakata
    role: site
    note: The entry names 大宰博多津.
participants:
  - actor: silla
    role: guest
  - actor: kaiyu
    role: subject
notes: The Japanese reply calls 渤海 高麗國, as the chronicle often does.
