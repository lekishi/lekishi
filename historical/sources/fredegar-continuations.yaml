notes: A Frankish account written for Pepin's own kin, close in time to the events. It is the only
  source that names the Alpine pass (mons Iovis, the Great St Bernard), Thionville as the place where
  Pepin heard of the pope's coming, the assembly at Berny, and the armies' roads through Lyon,
  Vienne, the Maurienne, and in 756 through Chalon, Geneva, and the Mont Cenis. Its year headings
  are the transcription's editorial additions, not the continuator's.
