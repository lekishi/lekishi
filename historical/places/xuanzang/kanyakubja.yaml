summary:
  羯若鞠闍 (曲女城), the capital of 戒日王 on the 殑伽河, where 玄奘 studied three months on the way east and
  where 戒日王 later held the great debate assembly.
types: [capital, settlement]
names:
  - form: 羯若鞠闍
    lang: lzh
    script: Hani
    roman: Jieruojushe
    scheme: pinyin
    cite:
      - id: kanyakubja-name
        says: The biography records 玄奘 reaching 羯若鞠闍.
        source: cien-zhuan
        at: 卷二（從此西北行二百里）
        quote: 從此西北行二百里，至羯若鞠闍國
      - id: kanyakubja-xiyu
        says: The 西域記 opens its account of the country with this sentence.
        role: supporting
        source: xiyu-ji
        at: 卷第五 羯若鞠闍國
        quote: 。
  - form: 曲女城
    lang: lzh
    script: Hani
    roman: Qunü Cheng
    scheme: pinyin
    note: The Chinese name the biography gives.
    claim: kanyakubja-name
