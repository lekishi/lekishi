# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Uru-milki of Gubla (Byblos), one of the kings of Amurru whom the prism lists bringing presents
  and heavy tribute to Sennacherib in 701 BCE.
types: [person]
names:
  - form: Uru-milki
    lang: en
    script: Latn
    cite:
      - id: uru-milki-of-byblos-name
        says: The prism lists Uru-milki among the kings who brought tribute.
        source: luckenbill-annals-sennacherib
        at: p. 30, Oriental Institute prism col. II 53
        quote: Uru-milki, the Gublite,
roles:
  - role: ruler
    note: Ruler of Gubla (Byblos); the prism lists him among "kings of Amurru, all of them".
    cite:
      says: The prism lists Uru-milki among the kings who brought tribute.
      source: luckenbill-annals-sennacherib
      at: p. 30, Oriental Institute prism col. II 53
      quote: Uru-milki, the Gublite,
