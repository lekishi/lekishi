# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  郇, the old state west of 解 where 子犯 swore a covenant with the 秦 and 晉 officers, and where the 晉 army
  fell back before 重耳 entered it. The historical geography quotes rival identifications and asserts none;
  neither does the record.
types: [settlement]
names:
  - form: 郇
    lang: lzh
    script: Hani
    roman: Xun
    scheme: pinyin
    cite:
      - id: xun-name
        says: >-
          The 左傳 records that the 晉 army fell back to 郇 and that 狐偃 swore a covenant there with the 秦 and
          晉 officers.
        source: zuozhuan
        at: 僖公二十四年（盟于郇）
        quote: 師退，軍于郇。辛丑，狐偃及秦、晉之大夫盟于郇。
at:
  - interpretation: unknown
    precision: unspecified
    notes: >-
      The geography gives four identifications, from 解 east to 猗氏 south-west, and calls them all doubtful.
    cite:
      - id: xun-geography
        says: >-
          The historical geography records 郇 as the state of a son of 文王, the place of 子犯's covenant, and
          quotes several conflicting locations.
        source: dushi-fangyu-jiyao-zhou
        at: 卷四十一 山西三 平陽府 猗氏縣（郇城）
        quote: 郇城 在縣東北十五里，文王庶子所封郇國。
