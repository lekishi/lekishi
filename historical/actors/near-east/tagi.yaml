# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Tagi, father-in-law of Milkilu and a chief in the coastal plain, who wrote that his brother was
  too wounded to carry a message.
types: [person]
names:
  - form: Tagi
    lang: akk
    script: Latn
    cite:
      - id: tagi-name
        says: Niebuhr names Tagi as Milki-El's father-in-law.
        source: niebuhr-tell-el-amarna-period
        at: "ch. IV: Milki-El and Tagi"
        quote:
          Milki-El and his father-in-law Tagi, chiefs in the Philistian plain near Gath, were his principal
          opponents. They recruited troops from among the Habiri
roles:
  - role: ruler
