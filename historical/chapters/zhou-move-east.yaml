title: The fall of Western 周 and the move to 洛邑
summary: >-
  How the western 周 kingdom ended: the earthquake of 780 BCE and the omen, 幽王's new queen and heir,
  the beacon fires, the attack of 申 and the 犬戎 that killed him under 驪山 in 771 BCE, two rival kings,
  and 平王's move to 雒邑, with 秦 made a state for escorting him. The first chapter with absolute years
  from the sources' own count.
window: 780 BCE..760 BCE
story:
  summary: >-
    The end of Western 周 and the start of Eastern 周, 780 to 760 BCE, from the earthquake of 幽王's
    second year to the death of the rival king 攜王.
  span: 780 BCE..760 BCE
  coverage: >-
    The fall of Western 周 as the Han annals, the table of the twelve lords, the 秦, 晉 and 鄭 houses
    and the Bamboo Annals tell it: the omens, the change of queen and heir, the beacon fires, the
    death of 幽王, the two kings, the move east, and 秦's elevation. The years are absolute, from the
    table's count from 841 BCE. Excluded: the 宣王 reign before it, 鄭's own move east, and the
    bronze inscriptions of the period, which are not yet read. 申, 戲 and 攜 are unknown places.
  notes: >-
    Step order is presentation order and follows the annals, with the Bamboo Annals' events placed
    where their years fall. Two accounts run side by side and disagree on order: the annals make
    平王 king after his father's death, the Bamboo Annals before it. The beacon story is the annals'
    alone. This is a draft for data and engine testing; no release decision has been taken.
  steps:
    - sanchuan-earthquake: The three rivers shake and 岐山 collapses
    - baosi-made-queen: 幽王 makes 褒姒 queen and 伯服 heir
    - beacon-fires: The beacon fires lit to make 褒姒 laugh
    - pingwang-flees-shen: 宜臼 flees to 西申
    - youwang-killed: 申 and the 犬戎 kill 幽王 under 驪山
    - quanrong-against-zhou: The 犬戎 against 周
    - pingwang-enthroned: 宜臼 is made king as 平王
    - xie-wang-enthroned: 虢公翰 makes 攜王 king, and two kings reign
    - qin-made-lord: 秦襄公 is made a lord and given the land west of 岐
    - zhou-qin-enfeoffment: 周 makes 秦 a state
    - pingwang-moves-east: 平王 moves the court to 雒邑
    - zhou-capital-moves-east: The royal seat moves from 鎬 to 雒邑
    - xie-wang-killed: 晉文侯 kills 攜王
    - jin-against-xie-wang: 晉 against 攜王
