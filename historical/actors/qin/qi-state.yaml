summary: "齊, the last of the six states Qin conquered. The annals record its king and his chief minister guarding the western border and cutting off Qin in 221 BCE, and 王賁 attacking from the former Yan lands and capturing the king."
types: [state]
names:
  - form: "齊"
    lang: lzh
    script: Hani
    roman: Qi
    scheme: pinyin
    cite:
      - says: "The annals record 王賁 attacking 齊 from the south of the former Yan lands and capturing king 建 in 二十六年 (221 BCE)."
        source: shiji
        at: "卷六 秦始皇本紀 二十六年（從燕南攻齊）"
        quote: "秦使將軍王賁從燕南攻齊，得齊王建。"
notes: "The state across its history, the 田 house's 齊 in the period the chapter cites. The state actor carries no roles."
