# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  蘇州, the Tang prefecture at the mouth of the 長江 that the 734 fleet sailed from and the 778 ships
  waited at.
types: [region]
names:
  - form: 蘇州
    lang: lzh
    script: Hani
    roman: Suzhou
    scheme: pinyin
    cite:
      - id: suzhou-name
        says: 平群廣成's report says the four ships set out together from 蘇州.
        source: shoku-nihongi
        at: 卷第十三 天平十一年十一月辛夘
        quote: 四船同發從蘇州入海。
at:
  - interpretation: approximate_point
    precision: region
    point: [120.619444, 31.3]
    notes:
      A region-level placement standing for the prefecture, at modern 蘇州, the city that bore the
      prefecture's name from the Sui. The point is the modern city's coordinate; it places no harbour or river
      mouth the ships sailed from or waited at.
    cite:
      - id: suzhou-identification
        says:
          The city of 蘇州 in 江蘇省 took the name 蘇州 in the Sui, when the 吳 commandery was renamed, and
          under the Tang was the prefecture of 吳縣 and six other counties. The point is the modern city's
          coordinate from Wikidata (CC0), placed to stand for the prefecture.
        basis: interpretation
        attributed_to: 小学館 (日本大百科全書, 林和生)
        sources:
          - source: nipponica-suzhou
            at: 蘇州 歴史
          - source: wikidata
            at: Q42622 (P625), revision 2527812164
modern:
  - form: 蘇州市
    lang: zh
    script: Hani
    note:
      The modern city that bore the prefecture's name from the Sui; recorded as the identification the
      placement rests on.
