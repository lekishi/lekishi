notes:
  Court-ordered chronicle to 697, compiled in 720 and the earliest Japanese court record of the seventh-century
  missions to Tang. Locators name the volume and the entry's date expression; the entries carry month
  and sexagenary day, so v0 normalizes them to the month. The 659 mission is told in 伊吉連博德書, an envoy's
  own account the compilers quote in notes; it is cited as quoted there, not as an independent work. The
  compilers also give variant readings (或本云), which the records keep as such.
