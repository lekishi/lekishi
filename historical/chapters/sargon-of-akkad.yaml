title: Sargon of Akkad's campaigns
summary: Sargon of Akkad, king from 2334 BCE in the modern middle chronology, was remembered as the
  first king to rule from the Upper Sea to the Lower Sea. Follow his own inscriptions' march to the
  Cedar Forest and the Silver Mountains, and the later chronicle's conquests of the east, the west,
  Kazallu and Subartu, with his reign dated two thousand years apart and his very identity disputed by
  the scholars cited.
window: 2334 BCE..2279 BCE
story:
  summary: Sargon's reign as his Nippur inscriptions, the Chronicle of Early Kings, the Omens and the
    Legend of Sargon tell it.
  span: 2334 BCE..2279 BCE
  coverage: 'Sargon''s Nippur inscriptions as King (1918) quotes them after Poebel (1914); the Chronicle
    of Early Kings, tablet A lines 1–23, in the Livius translation (cite-only); the Omens of Sargon and
    the date-formulae of Shar-Gani-sharri as King (1910) reports them; and the Legend of Sargon in Smith''s
    translation (1880). Excluded: Naram-Sin and the later kings of Akkad, Lugal-zaggisi, the Sumerian
    King List, and the Sargon of Assyria. No route is drawn, and no territory.'
  notes: All dates are the middle-chronology window except the eleventh year, which the cited translation
    converts to 2323 BCE. Legend and omen are kept as claims about what those texts say. The identity
    of Sargon with Shar-Gani-sharri, held in 1906–1910, is kept as a dispute on the actor.
  steps:
  - sargon-reign: The reign, dated four ways
  - sargon-rise-to-power: Sargon comes to power
  - sargon-subjugates-southern-babylonia: Southern Babylonia subjugated
  - sargon-crosses-eastern-sea: Across the sea in the east
  - sargon-invades-elam: The invasion of Elam
  - sargon-conquers-the-west: 'Year 11: the western land conquered'
  - sargon-march-to-the-cedar-forest: To the Cedar Forest and the Silver Mountains
  - kazallu-destroyed: Kazallu turned into a ruin heap
  - revolt-against-sargon: The revolt of his old age
  - subartu-defeated: Subartu ambushed and defeated
  - babylon-soil-taken-to-agade: The soil of Babylon
