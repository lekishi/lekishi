# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Eleazus, king of the Frankincense Country, whose capital was Sabbatha and whose market-town was
  Cana.
types: [person]
names:
  - form: Eleazus
    lang: en
    script: Latn
    cite:
      - id: eleazus-name
        says: The Periplus says Cana is of the Kingdom of Eleazus, the Frankincense Country.
        source: periplus-erythraean-sea
        at: "27"
        quote: Cana, of the Kingdom of Eleazus, the Frankincense Country
roles:
  - role: ruler
    cite:
      - id: eleazus-role
        says: The Periplus says Cana is of the Kingdom of Eleazus, the Frankincense Country.
        source: periplus-erythraean-sea
        at: "27"
        quote: Cana, of the Kingdom of Eleazus, the Frankincense Country
notes:
  Schoff reports a king Eleazus in an inscription Glaser numbers 1619, ruling in 29 CE, and takes
  the name to be a title borne by several rulers.
