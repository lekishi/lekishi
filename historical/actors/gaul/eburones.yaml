summary: "The Eburones, a Belgic people mostly between the Meuse and the Rhine under the kings Ambiorix and Catuvolcus, who destroyed the force of Sabinus and Cotta in 54 BCE; Caesar set out to annihilate them in 53 BCE."
types: [community]
names:
  - form: Eburones
    lang: la
    script: Latn
    cite:
      - id: eburones-name
        says: "Caesar tells that he sent a legion and five cohorts into the Eburones, most of whom live between the Meuse and the Rhine under Ambiorix and Catuvolcus."
        source: caesar-gallic-war
        at: "5.24"
        quote: "in Eburones, quorum pars maxima est inter Mosam ac Rhenum, qui sub imperio Ambiorigis et Catuvolci erant, misit."
