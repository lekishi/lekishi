summary:
  Ziyād b. Ṣāliḥ, the commander Abū Muslim sent, in Ibn al-Athīr's account, against the Chinese army
  in 751; he defeated it at the river of Ṭarāz in Dhū l-Ḥijja 133. The Tang histories do not name
  大食's commander.
types: [person]
names:
  - form: Ziyād b. Ṣāliḥ
    lang: ar
    script: Latn
    note: Transliterated; the site's fonts draw no Arabic script yet.
    cite:
      - id: ziyad-ibn-salih-name
        says:
          Ibn al-Athīr says that when the news reached Abū Muslim, he sent Ziyād b. Ṣāliḥ to fight the
          Chinese army.
        source: ibn-al-athir-kamil
        at: vol. 5, p. 344, year 133 (the Ikhshīd of Farghāna and the king of al-Shāsh)
