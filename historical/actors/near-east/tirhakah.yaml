# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Tirhakah, whom the books of Kings call king of Ethiopia and report coming out to fight the king
  of Assyria while he warred against Libnah. Luckenbill argues he may have commanded his uncle Shabaka's
  troops in 701 BCE, years before he became king.
types: [person]
names:
  - form: Tirhakah
    lang: en
    script: Latn
    cite:
      - id: tirhakah-name
        says: The books of Kings name Tirhakah king of Ethiopia.
        source: bible-kjv
        at: 2 Kings 19:9
        quote: Tirhakah king of Ethiopia
notes:
  "The record carries no role: the passage calls him king, and the cited interpretation doubts that
  he was king in 701 BCE, so neither is asserted as a dated role."
