title: 圓仁's pilgrimage to 五臺山 and 長安, 840
summary: >-
  On foot from the 赤山 cloister by 文登, 登州, 萊州 and 青州 across the plain to 鎮州 and up into the
  hills to 五臺山; then, after two months on the mountain, south-west by 太原, 汾州 and 晉州, over the
  黃河 at 河中府, and by 同州 to 長安.
travellers:
  - actor: ennin
    role: leader
  - actor: weizheng
    role: participant
  - actor: weixiao
    role: participant
  - actor: tei-yuman
    role: participant
