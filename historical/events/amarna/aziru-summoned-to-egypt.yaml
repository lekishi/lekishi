# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The king sends the messenger Hani to Aziru with demands; Aziru vanishes over the hills, protests
  his loyalty, and is at last forced to go to Egypt, where he is held.
types: [mission]
date:
  value: 1380 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
participants:
  - actor: hani-messenger
    role: leader
  - actor: aziru
    role: subject
  - actor: akhenaten
    role: participant
cite:
  - id: hani-basis
    says: Niebuhr says Aziru vanished when Hani arrived.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Hani and Aziru"
    quote:
      When the messenger Hani arrived with this note, Aziru, evidently warned in good time, had promptly
      vanished over the hills, and none of the royal commands could be carried out.
  - id: aziru-reply
    says: Aziru replies that he is the king's servant.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Aziru's reply"
    quote:
      '"To the great king, my lord, my god, my sun; Aziru, thy servant. Seven times and again seven
      times, &c. Oh, lord, I am indeed thy servant'
  - id: aziru-arrest
    says: Niebuhr says Aziru at last went to Egypt and was held under provisional arrest.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Aziru in Egypt"
    quote:
      But finally he was forced to obey, and with heavy heart and well-filled treasure chests set off
      for Egypt. Apparently he relied on his principal ally Dudu, whom in his letters he always addresses
      as "father"; but this pleasant alliance did not avail to protect the disturber of the peace from provisional
      arrest.
notes: "Niebuhr does not name the king; the window is Akhenaten's. The letters are undated but for a
  few dockets, and the reigns they fall in convert to BCE according to the chronology used: Amenhotep
  III's accession is put between about 1410 and 1388 BCE, and the end of Akhenaten's reign between about
  1362 and 1334 BCE. The window spans those placements for the reign in question; Niebuhr's 1903 dates
  (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall inside it. It is an editorial bound
  that a cited chronology must replace before approval."
