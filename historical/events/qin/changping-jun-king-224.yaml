# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 224 BCE, the annals record, the Chu general 項燕 set up 昌平君 as king of Chu and rose against Qin south of the 淮."
types: [occurrence]
date:
  value: "224 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十三年（荊將項燕立昌平君為荊王）"
  cite:
    - says: "The annals record 項燕 setting up 昌平君 as king and rebelling south of the 淮 in 二十三年 (224 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十三年（立昌平君為荊王）"
      quote: "荊將項燕立昌平君為荊王，反秦於淮南。"
places:
  - place: huainan
    role: site
    note: "The land south of the 淮; it has no position."
participants:
  - actor: xiang-yan
    role: leader
  - actor: changping-jun
    role: subject
notes: "Only the annals record this; the table and the hereditary house of Chu, which put 項燕's death in this year, do not. The annals record 昌平君's death the next year."
