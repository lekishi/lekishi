summary: 鄒嶧山, the first mountain of the eastern tour of 219 BCE, where 始皇 set up a stone and debated the 封禪 rites with the 魯 scholars. The label anchor sits at the modern mountain 嶧山; it asserts no historical site.
types: [landform]
names:
  - form: 鄒嶧山
    lang: lzh
    script: Hani
    roman: Zou Yishan
    scheme: pinyin
    cite:
      - id: yishan-name
        says: The annals record 始皇 touring the eastern commanderies and climbing 鄒嶧山.
        source: shiji
        at: 卷六 秦始皇本紀 二十八年（上鄒嶧山）
        quote: 二十八年，始皇東行郡縣，上鄒嶧山
