# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Amurru, the kingdom of the Amorites in the Lebanon between Egypt's and Hatti's spheres, in whose
  land Dapur lay and which, by Garstang's reading, threw off Hittite allegiance after Kadesh.
types: [state]
names:
  - form: the land of the Amorites
    lang: en
    script: Latn
    cite:
      - id: amurru-kingdom-name
        says: Sayce places Dapur in the land of the Amorites.
        source: sayce-hittites
        at: "ch. II: the war after Kadesh"
        quote: Dapur or Tabor 'in the land of the Amorites,'
  - form: Amurru
    lang: akk
    script: Latn
    role: alternate
    note: The name in the cuneiform texts.
