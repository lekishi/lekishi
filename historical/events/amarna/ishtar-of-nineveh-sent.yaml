# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  With Amenhotep III ill, Tushratta sends the statue of Ishtar of Nineveh to Egypt, as it had been
  sent once before, so that the king may worship her and let her return.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1390 BCE..1352 BCE
  mode: window
  calendar: regnal
  as_written: late in the reign of Amenophis III
  cite:
    - id: ishtar-of-nineveh-sent-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: nineveh
    role: start
  - place: thebes
    role: end
participants:
  - actor: tushratta
    role: leader
  - actor: amenhotep-iii
    role: host
cite:
  - id: ishtar-basis
    says: Niebuhr quotes the opening of Tushratta's letter sending Ishtar of Nineveh.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Ishtar of Nineveh"
  - id: ishtar-before
    says: Niebuhr says the statue had been taken from Nineveh to Thebes once before.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Ishtar of Nineveh (before)"
notes: "Nineveh was then within Tushratta's realm, by Niebuhr's account. The letters are undated but
  for a few dockets. Their reigns follow Shaw's chronology (The Oxford History of Ancient Egypt,
  2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten) 1352–1336 BCE. Niebuhr's 1903
  dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) follow an older, higher
  scheme."
