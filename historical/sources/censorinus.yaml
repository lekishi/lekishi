notes:
  Censorinus dates the year of his writing (238 CE) in several eras, among them the years from the
  founding of Rome counted from the Parilia. His count is the Varronian era that gives the
  conventional 753 BCE; it is a later reckoning of the tradition, not a record of the founding.
