notes:
  The report on 赤岸, a village of 松港街道 in 霞浦縣, says the ship carrying 葛野麻呂 and 空海 came
  ashore on the tenth day of the eighth month of 804 at the sea mouth south of 赤岸鎭 of 長溪縣 in
  福州, the 赤岸鎭 being present-day 赤岸村, and that the archaeologist 游壽 established the landing
  place as 霞浦's 赤岸 in the 1980s. It reports a modern identification, not a source statement of
  the ninth century. Locators name the report's section headings, in traditional forms. The report is published in simplified
  characters; its title and names are given here in traditional forms, which the site's fonts draw,
  and the URL identifies the published text.
