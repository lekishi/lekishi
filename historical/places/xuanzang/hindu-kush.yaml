summary:
  The snow mountains north of 迦畢試 that 玄奘 crossed on the way home with an escort of a hundred men,
  a crossing of more than two weeks.
types: [landform]
names:
  - form: 雪山
    lang: lzh
    script: Hani
    roman: Xueshan
    scheme: pinyin
    cite:
      - id: hindu-kush-name
        says: The biography records the king of 迦畢試 sending an escort to take 玄奘 over the snow mountains.
        source: cien-zhuan
        at: 卷五（王遣一大臣將百餘人）
        quote: 王遣一大臣將百餘人，送法師度雪山
at:
  - interpretation: unknown
    precision: unspecified
    notes: A range; the biography names no pass, so the record asserts no coordinate.
