# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  Obsidian from Kutau/Bao on New Britain reaches Vorovoro off Vanua Levu, Fiji, about 3,400 km
  away.
types: [trade]
from: place:talasea-obsidian
to: place:vorovoro
directionality: directed
causality: not_asserted
cite:
  - id: talasea-vorovoro
    says:
      Ross-Sheppard and colleagues source an obsidian flake found near the Vorovoro Lapita site to the
      Kutau/Bao area of the Willaumez Peninsula, New Britain.
    sources:
      - source: pofatu
        at: ross-sheppard2013_1 (site_name, location_comment), v1.4
      - source: pofatu
        at: contribution ross-sheppard2013 (contribution_name, contribution_description), v1.4
notes:
  "Undated: the contribution dates no flake, only its Lapita context, so the arc is drawn on selection.
  The record asserts that obsidian from the source reached the site, not how: exchange, gift or settlers
  carrying it are all open. The contribution calls the flake a find in the vicinity of the site, not from
  a dated layer."
