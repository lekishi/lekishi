# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Padi, king of Ekron, whom Ekron's officials put in fetters and handed to Hezekiah, and whom Sennacherib
  brought out of Jerusalem in 701 BCE and set again on Ekron's throne.
types: [person]
names:
  - form: Padi
    lang: en
    script: Latn
    cite:
      - id: padi-of-ekron-name
        says: The prism names Padi as the king of Ekron.
        source: luckenbill-annals-sennacherib
        at: p. 31, Oriental Institute prism col. II 74
        quote: who had thrown Padi, their king,
roles:
  - role: ruler
    note: King of Ekron, deposed and then restored, as the prism records.
    cite:
      says: The prism names Padi as the king of Ekron.
      source: luckenbill-annals-sennacherib
      at: p. 31, Oriental Institute prism col. II 74
      quote: who had thrown Padi, their king,
