summary: George, imperial protoasecretis (head of the imperial secretaries), sent with John the
  silentiarius to the Frankish king. He sailed to Marseille, overtook Pepin near Pavia and asked
  in vain that Ravenna and the cities of the exarchate be given back to the emperor.
