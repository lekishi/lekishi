# yaml-language-server: $schema=../../schema/event.schema.json
summary: "From Troas by Samothrace to Neapolis and Philippi: Lydia is baptised; after Paul drives a
  spirit from a slave girl, he and Silas are beaten and jailed, released after an earthquake, and
  leave once Paul says they are Romans condemned unheard."
types: [mission]
part_of:
  - paul-second-journey
date:
  value: "50..53"
  mode: window
  calendar: julian
  as_written: "Prat (1911): second mission, 50-53"
  cite:
    - id: philippi-imprisonment-date
      says: "Prat's chronology of 1911 dates Paul's second mission to 50–53."
      basis: interpretation
      attributed_to: F. Prat (1911)
      source: catholic-encyclopedia
      at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
      quote: "second mission, 50-53"
places:
  - place: alexandria-troas
    role: start
  - place: neapolis-macedonia
    role: waypoint
  - place: philippi
    role: site
participants:
  - actor: paul-the-apostle
    role: leader
  - actor: silas
    role: participant
  - actor: lydia-of-thyatira
    role: host
cite:
  - id: philippi-route
    says: "Acts tells that from Troas they ran straight to Samothrace, the next day to Neapolis, and
      from there to Philippi."
    source: bible-kjv
    at: "Acts 16:11"
    quote: "Therefore loosing from Troas, we came with a straight course to Samothracia, and the
      next day to Neapolis;"
  - id: philippi-prison
    says: Acts tells that after many stripes they were cast into prison.
    role: supporting
    source: bible-kjv
    at: "Acts 16:23"
    quote: "And when they had laid many stripes upon them, they cast them into prison"
  - id: philippi-romans
    says: "Acts tells that Paul protested that they had been beaten openly and uncondemned, being
      Romans."
    role: supporting
    source: bible-kjv
    at: "Acts 16:37"
    quote: "They have beaten us openly uncondemned, being Romans, and have cast us into prison"
notes: "Acts tells it, and the dates are Prat's 1911 reckoning, an interpretation: Acts gives no
  years."
