# yaml-language-server: $schema=../../schema/territory.schema.json
summary: "代, where the Zhao prince 嘉 made himself king of Dai after 邯鄲 fell, held until Qin captured him in 222 BCE."
controller: dai-state
date:
  value: "228 BCE..223 BCE"
  mode: duration
  calendar: chinese_lunisolar
  as_written: "十九年（之代，自立為代王）; 二十五年（還攻代，虜代王嘉）"
places:
  - place: dai
    role: seat
    gained: dai-kingdom-228
cite:
  - says: "The annals record 嘉 going to 代 with several hundred of his clan and making himself king of Dai in 十九年 (228 BCE)."
    source: shiji
    at: "卷六 秦始皇本紀 十九年（之代，自立為代王）"
    quote: "趙公子嘉率其宗數百人之代，自立為代王，東與燕合兵，軍上谷。"
  - says: "The annals record Qin turning back from 遼東 to attack 代 and capturing its king in 二十五年 (222 BCE)."
    role: supporting
    source: shiji
    at: "卷六 秦始皇本紀 二十五年（虜代王嘉）"
    quote: "還攻代，虜代王嘉。"
notes: "上谷, where Dai and Yan camped their joined armies, is not listed: a camp is not a holding. The window ends the year before Qin's capture of the king, which the Qin snapshot of 222 BCE holds."
