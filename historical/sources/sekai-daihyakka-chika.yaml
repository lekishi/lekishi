notes:
  The entry describes 値嘉島 as a historical place name centred on the present-day 五島列島, the 値嘉郷
  of 肥前国松浦郡, joined in 876 with 庇羅 (平戸島) as a short-lived island unit, and a harbour the
  遣唐使 ships called at. It is a modern reference identification, not a source statement of the ninth
  century.
