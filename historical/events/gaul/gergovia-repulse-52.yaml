# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Caesar reached Gergovia, on a very high hill hard to approach from every side, and judged
  it could not be stormed. A surprise attack on the hill's flank carried his men to the walls, but
  they went too far, and Vercingetorix's counterattack threw them back. Caesar reports 46 centurions
  and nearly 700 soldiers lost, and raised the siege."
types: [campaign]
date:
  value: 52 BCE
  mode: window
  calendar: julian
  as_written: "the year of book VII (one commentary a year, from 58 BCE)"
  cite:
    id: gergovia-repulse-52-year
    says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by
      the consuls of 58 BCE, so each book is one year from 58 BCE."
    sources:
      - source: caesar-gallic-war
        at: "1.6"
        quote: "L. Pisone, A. Gabinio consulibus."
      - source: caesar-gallic-war
        at: "8.48"
        quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
places:
  - place: gergovia
    role: site
    cite:
      id: gergovia-place
      says: "Caesar tells that he reached Gergovia in five marches and, seeing the site, gave up
        hope of storming it."
      source: caesar-gallic-war
      at: "7.36"
      quote: Caesar ex eo loco quintis castris Gergoviam pervenit
participants:
  - actor: julius-caesar
    role: leader
  - actor: vercingetorix
    role: leader
cite:
  - id: gergovia-losses
    says: Caesar reports that slightly fewer than seven hundred soldiers were lost that day.
    source: caesar-gallic-war
    at: "7.51"
    quote: Eo die milites sunt paulo minus septingenti desiderati.
notes: "Caesar's own account of his one defeat by Vercingetorix; the losses are his figures."
