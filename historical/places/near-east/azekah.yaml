# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Azekah, which Jeremiah names with Lachish as the last defenced cities of Judah holding out against
  the king of Babylon's army. The record asserts no position.
types: [fortification]
names:
  - form: Azekah
    lang: en
    script: Latn
    cite:
      - id: azekah-name
        says: Jeremiah names Azekah beside Lachish.
        source: bible-kjv
        at: Jeremiah 34:7
        quote: against Lachish, and against Azekah
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      Jeremiah names Azekah without locating it, and the Pleiades dump read for this chapter has no
      record of it. The chapter cites no identification of the site, so it asserts no coordinate.
    cite:
      - says: Jeremiah names Azekah among the cities of Judah that remained, without locating it.
        source: bible-kjv
        at: Jeremiah 34:7
        quote: for these defenced cities remained of the cities of Judah
