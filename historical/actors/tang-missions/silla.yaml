# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  "新羅, the Korean kingdom through whose waters, ships and envoys the missions often passed: students
  came home by Silla in 623 and 640, the 654 embassy took the Silla route, and the 838 embassy came home
  on hired Silla ships."
types: [state]
names:
  - form: 新羅
    lang: lzh
    script: Hani
    roman: Silla
    scheme: other
    cite:
      - id: silla-name
        says: The chronicle names 新羅 as the route of the 654 embassy.
        source: nihon-shoki
        at: 卷第廿五 白雉五年二月
        quote: 取新羅道
notes: The romanization Silla is the conventional English form, an editorial reading aid.
