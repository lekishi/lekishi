# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  白石嶺, the pass 李嗣業 urged 高仙芝 to hold after the defeat at 怛邏斯 in 751 and where the retreat
  forced its way through the 拔汗那 troops. The sources name it without placing it, and the record
  asserts no position.
types: [landform]
names:
  - form: 白石嶺
    lang: lzh
    script: Hani
    roman: Baishi Ling
    scheme: pinyin
    cite:
      - id: baishi-ling-name
        says: 李嗣業's biography records his advice to hold 白石嶺 and his ride to it.
        source: xin-tangshu
        at: 卷一三八 李嗣業傳（不如守白石嶺以為後計）
        quote: 不如守白石嶺以為後計。……即馳守白石，路既隘，步騎魚貫而前。
at:
  - interpretation: unknown
    precision: unspecified
    notes: The sources name the pass on the road back from 怛邏斯 and give no distance or direction.
    cite:
      - id: baishi-ling-unknown
        says: The biography names 白石嶺 but states no distance or direction, so the record carries unknown geometry.
        source: xin-tangshu
        at: 卷一三八 李嗣業傳（不如守白石嶺以為後計）
notes: The comprehensive mirror tells the same retreat without naming the pass.
