# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Babylon under its first dynasty, the kings from Sumu-abu to Samsu-ditana, which under Hammurabi
  conquered Larsa and claimed the cities of Sumer and Akkad.
types: [state, dynasty]
names:
  - form: Babylon
    lang: en
    script: Latn
    cite:
      - id: first-dynasty-of-babylon-name
        says: The Catholic Encyclopedia calls Hammurabi's dynasty the first Babylonian dynasty.
        basis: interpretation
        attributed_to: C. L. Souvay, Catholic Encyclopedia (1910)
        source: catholic-encyclopedia
        at: Hammurabi (Charles L. Souvay)
        quote: the sixth king of the first Babylonian dynasty
notes:
  '"Old Babylonian" is the modern period name; the sources say Babylon or the First Dynasty. Later
  Babylonian states are separate actors.'
