# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Cotton fabrics about 6,000 years old from the Preceramic site of Huaca Prieta on the north coast
  of Peru carry indigo, the earliest known use of the dye anywhere.
types:
  - occurrence
date:
  value: 3985 BCE
  calendar: julian
  as_written: 6000-year-old cotton fabrics
  cite:
    - id: huaca-prieta-time
      says: Splitstoser and colleagues describe the dyed fabrics as 6,000 years old.
      basis: interpretation
      attributed_to: Splitstoser et al. 2016
      source: splitstoser-2016-indigo
      at: abstract
places:
  - place: huaca-prieta
    role: site
notes:
  The date is approximate and written as a single year because the record notation cannot yet mark
  a date as approximate. The source gives the age in years before its own publication (2016); the date
  converts it to civil years without a year zero and keeps the source's own expression in as_written.
