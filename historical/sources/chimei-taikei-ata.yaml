notes:
  The entry states that the 東征傳 places 秋妻屋浦, the landing place of the second ship that carried
  鑒眞, in 薩摩国阿多郡 and proposes its identification with present-day 坊津 (比定). It is a modern scholarly
  identification, not a source statement of the eighth century.
