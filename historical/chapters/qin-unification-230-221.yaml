# yaml-language-server: $schema=../schema/chapter.schema.json
title: Qin conquers the six states
summary: Between 230 BCE and 221 BCE Qin took Han, Zhao, Wei, Chu, Yan and Qi, and its king took the
  title of emperor. Follow the fall of 邯鄲, 荊軻's attempt on the king, the flooding of 大梁, the
  two Chu campaigns, the last stands at 遼東 and Dai, Qi's surrender, and the measures of 221 BCE.
window: 230 BCE..221 BCE
story:
  summary: "Qin's conquest of the six states, 230–221 BCE: the end of Han, Zhao and its remnant
    kingdom of Dai, Yan, Wei, Chu and Qi, and the title, commanderies and standards of the first
    emperor."
  span: 230 BCE..221 BCE
  coverage: "Episode window 230–221 BCE, from the annexation of Han to the measures of the first
    imperial year. Each of the six states has its campaign, the capture of its king, and its land
    passing to Qin; the court episodes the sources tie to the wars (李牧's death, 荊軻's embassy and
    attempt, 王翦's retirement and recall, the 安陵 exchange) are included; the 221 BCE measures are
    the imperial title, the water virtue, the debate on enfeoffment, the 36 commanderies, the unified
    standards, the melting of weapons and the moving of the wealthy to 咸陽. Excluded: the Han
    episode before 230 BCE, which the chapter qin-conquest-han-233-226 tells; omens, deaths of
    queens and other notices of the years; the 220 BCE tours and roads; and every campaign after
    221 BCE. No route, campaign path or border is drawn; territory is shown only as the places
    the sources record each state holding, tinted by year. No place carries an asserted
    coordinate: of the places this chapter adds, twenty-one carry region- or city-level label anchors at their modern
    identifications, and seven stay without a position because the sources name them and state no
    site."
  notes: "Step order is presentation order, not a claim that one event caused another; each
    state's annexation follows the events it summarizes. Where the sources disagree (the end of
    Zhao, 太子丹's death, the Wei king's fate, 李信's colleague, 項燕's end, the year of the Chu king's
    capture, and the year of the 36 commanderies) the chapter publishes one reading and keeps the
    others as conflicting claims; the records' dispute summaries say which. The seven conflicts carry
    no validity interval and are listed for the map rather than stepped through. Territory is
    shown as control by place: fifteen dated snapshots, listed under include, record which
    capitals and commanderies each state held, year by year, with no border drawn
    (rfd/0002/TERRITORIES.adoc)."
  steps:
    - han-conquest-230: 內史騰 takes Han and makes the 潁川 commandery, 230 BCE
    - han-annexation-yingchuan: Han's land becomes the 潁川 commandery
    - zhao-campaign-229: Qin's three columns march on Zhao, 229 BCE
    - li-mu-death-229: Zhao puts its general 李牧 to death, 229 BCE
    - handan-fall-228: 邯鄲 falls and the Zhao king is taken, 228 BCE — the accounts differ
    - zheng-handan-visit-228: The king of Qin at 邯鄲, 228 BCE
    - zhao-annexed-by-qin: Zhao's land passes to Qin
    - dai-kingdom-228: The Zhao prince 嘉 makes himself king of Dai, 228 BCE
    - yan-dai-alliance: Dai joins armies with Yan
    - wang-jian-zhongshan-228: 王翦 camps at 中山 facing Yan, 228 BCE
    - jing-ke-farewell: 荊軻 is seen off at the 易水, 228–227 BCE
    - yan-qin-embassy: The Yan embassy to 咸陽
    - jing-ke-attempt-227: 荊軻's attempt on the king of Qin, 227 BCE
    - yishui-battle-227: Qin defeats Yan and Dai west of the 易水, 227 BCE
    - ji-fall-226: 薊 falls and the Yan king withdraws to 遼東, 226 BCE
    - yan-dan-death-226: 太子丹 is killed, 226 BCE — the accounts differ
    - xinzheng-revolt-226: 新鄭, the former Han capital, revolts, 226 BCE
    - wang-jian-retires-226: 王翦 retires to 頻陽, 226 BCE
    - wang-ben-chu-226: 王賁 raids Chu, 226 BCE
    - daliang-flood-225: 王賁 floods 大梁 and Wei surrenders, 225 BCE — the king's fate is disputed
    - wei-annexed-by-qin: Wei's land passes to Qin
    - anling-exchange-225: The lord of 安陵 refuses Qin's exchange, 225 BCE
    - anling-qin-exchange: Qin's offer to 安陵
    - li-xin-chu-225: Chu routs 李信, 225 BCE
    - wang-jian-recalled: The king recalls 王翦 and sees him off at 霸上, 225–224 BCE
    - chu-campaign-224: 王翦's campaign against Chu, 224 BCE
    - zheng-yingchen-visit-224: The king of Qin at 郢陳, 224 BCE
    - changping-jun-king-224: 項燕 makes 昌平君 king of Jing, 224 BCE
    - xiang-yan-death: The death of 項燕 — 224 or 223 BCE
    - chu-king-captured: The Chu king 負芻 is captured, 223 BCE — the annals say 224
    - chu-annexed-by-qin: Chu's land passes to Qin
    - liaodong-fall-222: 王賁 takes 遼東 and the Yan king, 222 BCE
    - yan-annexed-by-qin: Yan's land passes to Qin
    - dai-fall-222: 王賁 captures the Dai king 嘉, 222 BCE
    - dai-annexed-by-qin: Dai's land passes to Qin
    - kuaiji-commandery-222: 王翦 settles the lands south of the 江 and sets up 會稽, 222 BCE
    - chu-jiangnan-kuaiji: The Chu lands south of the 江 become the 會稽 commandery
    - great-feast-222: A feast for all under heaven, fifth month of 222 BCE
    - qi-border-221: Qi closes its western border, 221 BCE
    - linzi-fall-221: 王賁 enters 臨淄 and Qi surrenders, 221 BCE
    - qi-king-exile-221: The Qi king is removed to 共, 221 BCE
    - qi-annexed-by-qin: Qi's land passes to Qin
    - kings-debate-221: The court rejects enfeoffing the king's sons, 221 BCE
    - imperial-title-221: The king takes the title 皇帝, 221 BCE
    - water-virtue-221: Qin adopts the virtue of water, 221 BCE
    - thirty-six-commanderies: The realm is divided into 36 commanderies — 221 or 220 BCE
    - standards-unified-221: Laws, measures, axle widths and script made one, 221 BCE
    - weapons-melted-221: The realm's weapons are melted into twelve bronze figures, 221 BCE
    - wealthy-moved-221: 120,000 wealthy households are moved to 咸陽, 221 BCE
    - conquered-palaces-copied: Copies of the conquered states' palaces rise at 咸陽, 230–221 BCE
