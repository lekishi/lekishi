# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The chiefs of "all the countries which are on the water of Egypt, and as far as Naharin", the
  Kharu and the Kode, whom the chief of Kadesh gathered at Megiddo with their horses and troops.
types: [community]
names:
  - form: the chiefs of the Kharu and the Kode
    lang: en
    script: Latn
    note: "Breasted's renderings: Kharu for Syria-Palestine, Kode for north Syria and Cilicia."
    cite:
      - id: megiddo-coalition-name
        says: The king says the chief of Kadesh has gathered the chiefs of all the countries as far as Naharin.
        source: breasted-ancient-records
        at: "II, Annals of Thutmose III, first campaign: the council at Yehem (the coalition)"
        quote:
          He has gathered to himself the chiefs of all the countries which are on the water of Egypt,
          and as far as Naharin, consisting of the countries of the Kharu, the Kode, their horses, their troops.
notes: A coalition, not a state. The annals name only its leaders by their cities.
