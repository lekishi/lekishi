# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The Lixitae, nomads pasturing flocks by the river Lixus, with whom the account says the fleet
  stayed some time as friends and from whom it took interpreters for the rest of the voyage.
types: [community]
names:
  - form: Λιξῖται
    lang: grc
    script: Grek
    roman: Lixitai
    scheme: unspecified-editorial
    cite:
      - id: lixitae-name
        says:
          The account says nomad people, the Lixitae, pastured their flocks by the Lixus, and the
          fleet stayed with them some time, becoming friends.
        source: hanno-periplus
        at: "6"
        quote: Παρὰ δ᾽ αὐτὸν νομάδες ἄνθρωποι Λιξῖται βυσκήματ᾽ ἔνεμον, παρ᾽ οἷς ἐμείναμεν ἄχρι τινός, φίλοι γενόμενοι.
notes: Known only from this account. The name is the river's, given by a Greek text; what the people
  called themselves is not recorded.
