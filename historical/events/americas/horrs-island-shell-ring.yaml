# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Hunter-gatherers on the Gulf coast of Florida build the shell ring and mound complex of Horr's
  Island, dated 4800–4000 BP.
types:
  - process
date:
  value: 2851 BCE..2051 BCE
  mode: duration
  calendar: julian
  as_written: 4800-4000 BP
  cite:
    - id: horrs-island-time
      says: The nomination dates Horr's Island to 4800–4000 BP.
      basis: interpretation
      attributed_to: Poverty Point World Heritage nomination (2013)
      source: poverty-point-nomination
      at: PDF p. 113, 3.2 Comparative analysis (Horr’s Island)
places:
  - place: horrs-island
    role: site
    note: The site has no cited coordinate and is not drawn.
notes:
  The source gives the age in years before present (BP, counted back from 1950); the date converts
  it to civil years without a year zero (N BP is N − 1949 BCE), keeps the source's own figures in as_written,
  and adds no precision of its own.
