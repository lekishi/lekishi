# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Aziru, son of Abdi-Ashirta, ruler of Amurru, who seized the lands of his neighbours, was summoned
  to Egypt and held there, and dealt with the Hittites.
types: [person]
names:
  - form: Aziru
    lang: akk
    script: Latn
    cite:
      - id: aziru-name
        says: Niebuhr calls Aziru, prefect of the land of the Amorites, the most dangerous of the chiefs.
        source: niebuhr-tell-el-amarna-period
        at: "ch. IV: Aziru"
        quote:
          Most dangerous of all the chiefs was Aziru, prefect of the land of the Amorites, whose territory
          included the district north of Damascus and part of the valley of the Orontes.
roles:
  - role: ruler
