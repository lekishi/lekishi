notes:
  "The Song history of 1060. It names the 石國 king 車鼻施 and records his execution, names 怛邏斯城
  as the place the prince's appeal brought 大食 against 高仙芝, gives 李嗣業's 白石嶺 plan, and has
  western-regions entries that reuse 經行記 (碎葉, 苫) without naming it. Where it repeats 經行記 it is
  cited as a supporting witness, not as independent evidence."
