summary: >-
  微子啓, 帝乙's eldest son, passed over for 紂 because his mother was of low rank. After the rebellion of 武庚, 周 gave him 宋 to carry on the line of 殷.
types: [person]
names:
  - form: 微子啓
    lang: lzh
    script: Hani
    roman: Weizi Qi
    scheme: pinyin
    cite:
      - id: weizi-qi-name
        says: The annals record that 帝乙's eldest son was 微子啓, whose mother's low rank kept him from the succession.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝乙（帝乙長子曰微子啓）
        quote: 帝乙長子曰微子啓，啓母賤，不得嗣。
roles:
  - role: ruler
    note: Lord of 宋.
    cite:
