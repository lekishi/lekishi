# yaml-language-server: $schema=../../schema/event.schema.json
summary: The ambassador's nine ships put in at 赤山浦, send to ask after 圓仁, and sail for Japan in the night of the 22nd; from the hill he sees that they are gone.
types: [journey]
date:
  value: 839-07-23
  calendar: chinese_lunisolar
  as_written: 開成四年七月廿三日
  cite:
    - id: ennin-embassy-departs-839-time
      says: The diary records seeing from the hilltop on the 23rd that all nine ships were gone and knowing they had left together in the night.
      source: nitto-guho-junrei-gyoki
      at: 卷二 開成四年七月廿三日
      quote: 山頭望見泊舶處。九隻船并不見。便知夜頭同發。
places:
  - place: chishan
    role: start
participants:
  - actor: fujiwara-no-tsunetsugu
    role: leader
  - actor: ennin
    role: witness
notes: The diary records the ships arriving on the 21st. The missions records carry the embassy's own return.
cites:
  notes:
    - id: ennin-embassy-arrives-chishan
      says: The diary records the ambassador's nine ships arriving at 赤山浦 on the 21st.
      source: nitto-guho-junrei-gyoki
      at: 卷二 開成四年七月廿一日
      quote: 本國相公已下九隻船來。泊此赤山浦。
