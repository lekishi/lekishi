# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Through the gates of Cilicia and Syria to Myriandus, a Phoenician port, where the army halts
  seven days and the generals Xenias and Pasion sail home.
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE
  mode: window
  calendar: julian
  as_written: Here they halted seven days
  cite:
    - id: myriandus-desertion-401-time
      says:
        Grote dates the start of the march from Sardis to about March or April 401 BCE and the battle
        of Kunaxa to about September or October of the same year; the stage falls between them.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: I.4
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote: was commenced about March or April in the year 401 B.C.
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            It was about six months afterwards, in the month of September or October of the same year,
            that the battle of Kunaxa was fought
    - id: myriandus-desertion-401-text
      says: Xenophon records the seven-day halt at Myriandus and the two generals sailing away.
      source: xenophon-anabasis
      at: I.4
      quote:
        Here they halted seven days, and here Xenias the Arcadian general, and Pasion the Megarian
        got on board a trader
      role: supporting
places:
  - place: issus
    role: start
  - place: myriandus
    role: site
participants:
  - actor: cyrus-the-younger
    role: participant
  - actor: cyreans
    role: participant
