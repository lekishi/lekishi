# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  The 狄, a people north of 晉 and 衛, whose land sheltered 重耳 for twelve years and whose raids drove 衛 from
  朝歌.
types: [community]
names:
  - form: 狄
    lang: lzh
    script: Hani
    roman: Di
    scheme: pinyin
    cite:
      - id: di-people-name
        says: The 左傳 records the 狄 attacking the 廧咎如 and giving two captured women to 重耳.
        source: zuozhuan
        at: 僖公二十三年（狄人伐廧咎如）
        quote: 狄人伐廧咎如，獲其二女，叔隗、季隗，納諸公子。
notes: The people, distinct from the place record `di` for their land.
