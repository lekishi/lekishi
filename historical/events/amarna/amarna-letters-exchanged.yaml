# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "The Amarna correspondence: letters in Babylonian cuneiform between the kings of Egypt and the
  great kings of Babylon, Mitanni, Assyria, Hatti and Alashiya, and from the vassals of Canaan and Syria,
  under Amenhotep III and Akhenaten."
types: [process]
date:
  value: 1390 BCE..1336 BCE
  mode: window
  calendar: regnal
  as_written: the reigns of Amenophis III and IV
  cite:
    - id: amarna-letters-exchanged-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE and Amenhotep IV (Akhenaten)
        1352–1336 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: akhetaten
    role: site
  - place: thebes
    role: site
participants:
  - actor: amenhotep-iii
    role: participant
  - actor: akhenaten
    role: participant
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: letters-archive
    says: Niebuhr says the tablets were part of the Egyptian state archives of Amenophis III and IV.
    source: niebuhr-tell-el-amarna-period
    at: "ch. I: the archive"
  - id: letters-language
    says: Niebuhr says the find showed Babylonian was the language of diplomacy about 1400 B.C.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. I: the language"
notes: "An umbrella for the letters; its parts are the dated exchanges. The letters are undated but
  for a few dockets. Their reigns follow Shaw's chronology (The Oxford History of Ancient Egypt,
  2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten) 1352–1336 BCE. Niebuhr's 1903
  dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) follow an older, higher
  scheme."
