  notes: The inscriptions are ancient and public domain. Smith's translation was published in 1920,
    before 1931, and Smith died in 1920; Wikisource marks the work public domain worldwide. The
    transcription is a Wikisource page and is quoted as the work, under the register's rule. Every
    quotation is Smith's English, never a reading of the Prakrit, and must be re-checked against
