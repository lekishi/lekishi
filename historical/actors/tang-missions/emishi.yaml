# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  蝦夷, the peoples of north-eastern Japan outside the court's rule. Two were taken to the Tang emperor
  in 659, and twenty escorted the Tang envoys into the capital in 779.
types: [community]
names:
  - form: 蝦夷
    lang: lzh
    script: Hani
    roman: Emishi
    scheme: hepburn
    cite:
      - id: emishi-name
        says: The chronicle records two 蝦夷 of 道奧 taken to show the Tang emperor.
        source: nihon-shoki
        at: 卷第廿六 齊明天皇五年七月戊寅
        quote: 仍以道奧蝦夷男女二人示唐天子
notes:
  The name is the court's exonym. 伊吉連博德書 records the envoys telling the emperor of three kinds of
  蝦夷; that is the envoys' account, not an ethnography the record endorses.
