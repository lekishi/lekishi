summary:
  The Ramesseum, the memorial temple of Ramesses II on the west bank at Thebes, one of the temples
  whose walls carry the Kadesh poem and reliefs.
types: [religious_site]
names:
  - form: the Ramesseum
    lang: en
    script: Latn
    note: The modern name.
    cite:
      - id: ramesseum-name
        says: Garstang lists the Ramesseum at Thebes among the temples with the Kadesh records.
        source: garstang-land-of-hittites
        at: "ch. VI: fn. 710"
at:
