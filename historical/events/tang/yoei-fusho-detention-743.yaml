summary: 榮叡 and 普照 are held from the fourth to the eighth month while 揚州 refers their case to the court. The court rules that they are foreign student monks free to go home at the state's expense; 玄朗 and 玄法 leave, but 榮叡 and 普照 refuse an official passage that would take no teacher with them.
