summary:
  At 瓜州 玄奘 waits more than a month for a way west; his horse dies, the warrant from 涼州 arrives
  and the clerk 李昌 tears it up, and he takes the young foreigner 石盤陀 as guide.
types: [journey]
date:
  value: 629..630
  mode: window
  calendar: chinese_lunisolar
  as_written: 乃晝伏夜行，遂至瓜州
  cite:
    - id: guazhou-stay-629-time
      says: The biography records the stay at 瓜州 without a date.
      source: cien-zhuan
      at: 卷一（乃晝伏夜行，遂至瓜州）
      quote: 乃晝伏夜行，遂至瓜州
