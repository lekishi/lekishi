# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  "Sparta as a member and the leader of the Hellenic alliance: the allies would follow no commander
  but a Lacedemonian, so the Spartan Eurybiades held the supreme command of the fleet."
types: [membership]
from: sparta-state
to: hellenic-alliance
directionality: directed
date:
  value: 480 BCE
  mode: window
  calendar: julian
  as_written: Those of the Hellenes who had been appointed to serve in the fleet
  cite:
    - id: hellenic-fleet-480-time
      says: Grote dates the allied fleet at Artemisium to about the latter part of June 480 BCE.
      source: grote-history-of-greece
      at: vol. V, ch. XL
      quote:
        the land-force under the Spartan king Leonidas, the naval force under the Spartan commander
        Eurybiadês, apparently about the latter part of the month of June.
      basis: interpretation
      attributed_to: George Grote
cite:
  - id: sparta-leads-hellenic-alliance-480-basis
    says:
      Herodotus records the Spartans furnishing the supreme commander because the allies would follow
      only a Lacedemonian.
    source: herodotus
    at: VIII.2
    quote:
      the commander who had the supreme power was furnished by the Spartans, namely Eurybiades son
      of Eurycleides, since the allies said that they would not follow the lead of the Athenians, but unless
      a Lacedemonian were leader they would break up the expedition
