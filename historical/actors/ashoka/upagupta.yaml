# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  Upagupta, the saint of Mathurā who, in the northern legend of the Aśokāvadāna, guides Aśoka on his pilgrimage
  to the holy places. Smith thinks he was a real person and probably converted Aśoka.
types: [person]
names:
  - form: Upagupta
    lang: sa
    script: Latn
    cite:
      - id: upagupta-name
        says: >-
          Smith's retelling of the northern legend says Aśoka sent for the saint Upagupta, son of Gupta the
          perfumer.
        source: smith-asoka-1920
        at: ch. VII, The Indian Legends of Asoka
        quote: he sent for the saint Upagupta, son of Gupta the perfumer
roles:
  - role: monk
