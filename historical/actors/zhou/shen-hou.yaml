# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  申侯, the lord of 申 and father of 幽王's set-aside queen, who brought 繒 and the 犬戎 against 幽王 and,
  with the lords, made his grandson 宜臼 king.
types: [person]
names:
  - form: 申侯
    lang: lzh
    script: Hani
    roman: Shen Hou
    scheme: pinyin
    cite:
      - id: shen-hou-name
        says: The annals record that 申侯, angered, attacked 幽王 with 繒 and the western 犬戎.
        source: shiji-yin-zhou
        at: 卷四 周本紀 幽王（申侯怒，與繒、西夷犬戎攻幽王）
        quote: 申侯怒，與繒、西夷犬戎攻幽王。
roles:
  - role: ruler
    note: Lord of 申.
    cite:
      - id: shen-hou-role
        says: The Bamboo Annals record that 申侯, 魯侯 and 許文公 made 平王 king at 申.
        source: guben-zhushu-jinian
        at: 晉紀 文侯 十年（立平王于申）
        quote: 先是申侯、魯侯及許文公立平王于申
