# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  渾邪王, the 匈奴 king of the west who, fearing the 單于's anger at his losses in 121 BCE, killed the
  休屠王 and surrendered to the Han with some forty thousand people.
types: [person]
names:
  - form: 渾邪王
    lang: lzh
    script: Hani
    roman: Hunye Wang
    scheme: pinyin
    cite:
      - id: hunye-name
        says: The 匈奴列傳 records that the 渾邪王 killed the 休屠王 and surrendered to the Han with both peoples.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（渾邪王殺休屠王）
        quote: 渾邪王殺休屠王，并將其眾降漢。凡四萬餘人，號十萬。
  - form: 昆邪王
    lang: lzh
    script: Hani
    note: The 漢書 annals' spelling.
    cite:
      - id: hunye-hanshu-name
        says: The 漢書 annals write 昆邪王 for the king who killed the 休屠王 and surrendered.
        source: hanshu
        at: 卷六 武帝紀 元狩二年 秋
        quote: 匈奴昆邪王殺休屠王，并將其眾合四萬餘人來降
