summary:
  玄奘 enters northern India at 那揭羅喝, sees the 佛頂骨 and goes alone, past robbers, to the cave of the
  Buddha's shadow.
types: [journey]
date:
  value: 630..631
  mode: window
  calendar: chinese_lunisolar
  as_written: 從此南二十餘里，下嶺渡河，至那揭羅喝國
  cite:
    - id: nagarahara-631-time
      says: The biography records 那揭羅喝 without a date.
      source: cien-zhuan
      at: 卷二（從此南二十餘里）
      quote: 從此南二十餘里，下嶺渡河，至那揭羅喝國
places:
  - place: nagarahara
    role: site
participants:
  - actor: xuanzang
    role: leader
notes:
  The biography gives no date for this stop. The window is the chapter's reckoning from the stays
  and seasons the biography reports between the 貞觀三年 departure and the 貞觀十九年 return; the biography's own
  chronology is not consistent (see the chapter notes), so the window is wide and the stop must never
  be shown at a midpoint.
