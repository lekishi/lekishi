    lang: grc
    script: Grek
    roman: Bactra
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: bactra-greek-name
        says: Pleiades records the ancient Greek name Βάκτρα for this place.
        source: pleiades
        at: place 961886, name /places/961886/baktra, dump 2026-10-21
      - id: bactra-name
        says: Arrian names Bactra as one of the largest cities of the Bactrians.
        source: arrian-anabasis
        at: III.29
        quote: he marched to Aornus and Bactra, which are the largest cities in the land of the Bactrians.
        role: supporting
