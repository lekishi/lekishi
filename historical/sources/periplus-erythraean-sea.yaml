notes:
  A merchant's handbook to the ports of the Red Sea, East Africa, Arabia and India, written in Greek
  by an unnamed author who had made the voyage. It gives ports, rulers, goods and sailing seasons, and
  no date; Schoff puts it about 60 CE, other commentators from 40 to 247 CE. Eggermont (1960) judged the
  edition Schoff translated untrustworthy; quotations are of the translation, not of the Greek.
