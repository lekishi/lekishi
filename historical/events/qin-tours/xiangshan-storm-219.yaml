# yaml-language-server: $schema=../../schema/event.schema.json
summary: 始皇 crossed the 淮水 south-west to 衡山 and 南郡 and sailed the 江 to the shrine of 湘山, where a great wind nearly stopped the crossing. Told that the goddess was 堯's daughter and 舜's wife, he raged and set three thousand convicts to cut down the hill's trees, leaving it red. He went home from 南郡 by 武關.
types: [journey]
date:
  value: 219 BCE
  calendar: chinese_lunisolar
  as_written: 二十八年
  cite:
    - id: xiangshan-storm-219-account
      says: The annals record the river journey to 湘山, the storm, the felling of the trees and the return by 武關.
      sources:
        - source: shiji
          at: 卷六 秦始皇本紀 二十八年（至湘山祠）
          quote: 浮江，至湘山祠。逢大風，幾不得渡。
        - source: shiji
          at: 卷六 秦始皇本紀 二十八年（伐湘山樹）
          quote: 於是始皇大怒，使刑徒三千人皆伐湘山樹，赭其山。上自南郡由武關歸。
