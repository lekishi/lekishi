# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  The vale of Tempe between Olympus and Ossa, the pass from Macedonia into Thessaly that a Greek
  force held briefly in 480 BCE and then abandoned.
types: [landform]
names:
  - form: Τέμπη
    lang: grc
    script: Grek
    roman: Tempe
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: tempe-greek-name
        says: Pleiades records the ancient Greek name Τέμπη for this place.
        source: pleiades
        at: place 541131, name /places/541131/tempe, dump 2026-10-21
      - id: tempe-name
        says: Herodotus describes Tempe as the pass from lower Macedonia into Thessaly.
        source: herodotus
        at: VII.173
        quote:
          and arrived at Tempe, the pass which leads from lower Macedonia into Thessaly by the river
          Peneios, going between the mountains of Olympos and Ossa
        role: supporting
  - form: Tempe
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: tempe-name
at:
  - interpretation: approximate_point
    precision: locality
    point: [22.56653, 39.87597]
    notes:
      "The gazetteer's representative point for the place (location precision: precise). It is the
      gazetteer's identification of the ancient place, not a position the ancient text states."
    cite:
      - id: tempe-location
        says:
          Pleiades identifies the place and gives its representative point as 39.8759666104, 22.5665332538
          (latitude, longitude), with location precision precise.
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 541131 (reprLatLong, locationPrecision), dump 2026-10-21
