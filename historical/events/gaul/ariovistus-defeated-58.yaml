# yaml-language-server: $schema=../../schema/event.schema.json
summary: "After a failed parley, Caesar fought Ariovistus's Germans in Alsace; the battle turned when P. Crassus sent in the third line, and the Germans fled to the Rhine, about fifty miles away in this text. Ariovistus escaped across the river in a small boat; Caesar's cavalry cut down the rest."
types: [campaign]
date:
  value: 58 BCE
  mode: window
  calendar: julian
  as_written: "the year of book I (one commentary a year, from 58 BCE)"
  cite:
    id: ariovistus-defeated-58-year
    says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by the consuls of 58 BCE, so each book is one year from 58 BCE."
    sources:
      - source: caesar-gallic-war
        at: "1.6"
        quote: "L. Pisone, A. Gabinio consulibus."
      - source: caesar-gallic-war
        at: "8.48"
        quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
places:
  - place: rhine
    role: end
    note: Where the defeated Germans fled; the battlefield is not identified.
    cite:
      id: ariovistus-rhine
      says: "Caesar tells that the enemy did not stop fleeing until they reached the Rhine, about fifty miles from the field."
      source: caesar-gallic-war
      at: "1.53"
      quote: nec prius fugere destiterunt quam ad flumen Rhenum milia passuum ex eo loco circiter L pervenerunt.
participants:
  - actor: julius-caesar
    role: leader
  - actor: ariovistus
    role: subject
    cite:
      id: ariovistus-escape
      says: Caesar tells that Ariovistus escaped in a small boat he found tied to the bank.
      source: caesar-gallic-war
      at: "1.53"
      quote: "In his fuit Ariovistus, qui naviculam deligatam ad ripam nactus ea profugit"
notes: "Caesar's own account. Manuscripts differ on the distance to the Rhine, fifty miles in this text and five in others; the battlefield is not identified, so the event has no site of its own."
