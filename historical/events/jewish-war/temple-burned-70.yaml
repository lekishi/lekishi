# yaml-language-server: $schema=../../schema/event.schema.json
summary: "After the Antonia falls the Romans fight through the Temple courts; on the tenth of Lous a
  soldier throws a burning brand into the sanctuary, and Josephus says Titus tried and failed to
  stop the fire."
types: [occurrence]
date:
  value: "70"
  mode: window
  calendar: julian
  as_written: "the tenth day of the month Lous, [Ab,]"
  cite:
    - id: temple-burned-70-year
      says: "Whiston's note dates the seventeenth of Panemus, three weeks before, to A.D. 70."
      basis: interpretation
      attributed_to: W. Whiston (1737)
      source: josephus-jewish-war
      at: "6.2.1, Whiston's note 5"
      quote: "the seventeenth of Panemuns. [Footnote Tamuz,] A.D. 70"
    - id: temple-burned-date
      says: "Josephus dates the burning to the tenth of Lous, the day the first temple was burned by
        the king of Babylon."
      role: supporting
      source: josephus-jewish-war
      at: "6.4.5"
      quote: "it was the tenth day of the month Lous, [Ab,] upon which it was formerly burnt by the
        king of Babylon"
places:
  - place: jerusalem
    role: site
participants:
  - actor: titus
    role: leader
  - actor: judaean-rebels
    role: participant
cite:
  - id: temple-burned
    says: "Josephus tells that the holy house was burned without Caesar's approval."
    source: josephus-jewish-war
    at: "6.4.7"
    quote: "And thus was the holy house burnt down, without Caesar's approbation."
notes: "Josephus's account, written under Titus's patronage; that Titus wanted the Temple saved is
  his claim. The year is an interpretation."
