summary: On the first eastern tour (219 BCE) 始皇 climbed 鄒嶧山, set up a stone, and debated with the scholars of 魯 an inscription praising Qin and the rites of 封禪 and of the sacrifices to mountains and rivers.
types: [occurrence]
date:
  value: 219 BCE
  calendar: chinese_lunisolar
  as_written: 二十八年
  cite:
    - id: yishan-stele-219-account
      says: The annals record the stone at 鄒嶧山 and the debate with the 魯 scholars.
      source: shiji
      at: 卷六 秦始皇本紀 二十八年（上鄒嶧山）
      quote: 上鄒嶧山。立石，與魯諸儒生議，刻石頌秦德，議封禪望祭山川之事。
