# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  大宛, the settled country of walled towns and blood-sweating horses about ten thousand 里 west of
  Han, the first country 張騫 reached after escaping the 匈奴. The 大宛列傳 gives its position only
  relative to its neighbours. The label anchor sits in the Fergana Valley, with which 大宛 is usually
  identified; it asserts no site or extent.
types: [region]
names:
  - form: 大宛
    lang: lzh
    script: Hani
    roman: Dayuan
    scheme: pinyin
    cite:
      - id: dayuan-name
        says: The 大宛列傳 places 大宛 south-west of the 匈奴 and due west of Han, about ten thousand 里 away.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（大宛在匈奴西南）
        quote: 大宛在匈奴西南，在漢正西，去漢可萬里。
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [71.75778, 40.90083]
    notes:
      Region-level label anchor in the Fergana Valley, with which 大宛 is usually identified. The
      identification is not cited here from a source and the anchor asserts no capital or extent.
    cite:
      - id: dayuan-anchor
        says:
          The label anchor is placed at the modern valley's coordinate recorded in Wikidata (CC0); no
          historical coordinate is asserted.
        source: wikidata
        at: Q486324 (P625), revision 2517983247
external_ids:
  - system: wikidata
    id: Q486324
    url: https://www.wikidata.org/wiki/Q486324
    license: CC0-1.0
    note: The item whose coordinate places the point.
