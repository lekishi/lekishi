# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Living among the 匈奴 with less watch kept on him, 張騫 escaped with his party toward the 月氏 and
  after some tens of days' travel westward reached 大宛. Its king, who had heard of the Han's wealth
  and wanted contact, gave him guides and interpreters.
types: [journey]
date:
  value: 140 BCE..127 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: 留騫十餘歲…居匈奴中，益寬…西走數十日至大宛
  cite:
    - id: zhang-qian-dayuan-time
      says: The 大宛列傳 records the escape, the tens of days westward, and the 大宛 king's welcome, without a year.
      source: shiji-han-frontiers
      at: 卷一百二十三 大宛列傳（西走數十日至大宛）
      quote: 居匈奴中，益寬，騫因與其屬亡鄉月氏，西走數十日至大宛。大宛聞漢之饒財，欲通不得，見騫，喜
places:
  - place: chanyu-court
    role: start
  - place: dayuan
    role: end
participants:
  - actor: zhang-qian
    role: leader
  - actor: ganfu
    role: participant
notes: The sources give no year. The window runs from the departure to the year before the return,
  which is all the text supports; the detention of more than ten years puts the escape late in it.
