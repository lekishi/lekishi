# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "In 230 BCE 內史騰 attacked Han, captured 韓王安, and took the whole territory, which Qin made a
  commandery named 潁川. The hereditary house records the capture and the annexation and ends its
  account with 韓遂亡; the comprehensive mirror records the capture and the commandery in 始皇帝十七年. The
  entries name no campaign site: the event carries no campaign site, and the commandery's label
  anchor sits at the modern city that carries the seat name the historical geography records (陽翟
  under its own 禹州), not at an established historical seat coordinate."
types: [campaign]
date:
  value: 230 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: 十七年（內史騰攻韓，得韓王安）; 始皇帝十七年（虜韓王安，以其地置潁川郡）; 王安九年（秦虜王安，盡入其地）
  cite:
    - id: han-conquest-time
      says:
        The annals record that in 十七年 (230 BCE) 內史騰 attacked Han, took 韓王安, and made the whole
        territory a commandery named 潁川.
      source: shiji
      at: 卷六 秦始皇本紀 十七年（內史騰攻韓）
      quote: 內史騰攻韓，得韓王安，盡納其地，以其地為郡，命曰潁川。
    - id: han-conquest-mirror
      says: The comprehensive mirror records the capture of 韓王安 and the land being made into 潁川郡.
      role: supporting
      source: zizhi-tongjian
      at: 卷六 秦紀一 始皇帝十七年（虜韓王安）
      quote: 虜韓王安，以其地置潁川郡。
    - id: han-conquest-house
      says:
        The hereditary house records that Qin captured 韓王安 and took the whole land as 潁州郡, and that
        Han thereupon perished.
      role: supporting
      source: shiji
      at: 卷四十五 韓世家 韓王安九年（秦虜王安）
      quote: 九年，秦虜王安，盡入其地，爲潁州郡。韓遂亡。
    - id: han-conquest-table
      says:
        The six-states table aligns 秦始皇帝十七年 (230 BCE) with 韓王安九年 and records the capture and the
        commandery.
      role: supporting
      source: shiji
      at: 卷十五 六國年表 秦始皇十七年（韓王安九年）
      quote: 十七。內史騰擊得韓王安，盡取其地，置潁川郡。
places:
  - place: yingchuan
    role: other
    note:
      The annexed land the sources name as the 潁川 commandery; the entries state no campaign site and
      no extent, so the event carries no site of its own.
participants:
  - actor: nei-shi-teng
    role: leader
    note: The annals name him leading the attack.
  - actor: han-king-an
    role: subject
    note: The annals record his capture.
notes: "The sources name no site for the campaign: the only place named is the commandery the
  annexation created, so the event carries no campaign site and the chapter draws no route, path, or
  territory. The commandery's label anchor sits at the modern 禹州市, the city that carries the name of
  the historical geography's 禹州, whose 州治 陽翟 it records as the commandery's seat; it is a label
  position, not an established historical seat coordinate, and it asserts no site or extent. The
  hereditary house's transcription reads 潁州郡 where the annals and the mirror read 潁川 (潁川郡); the
  variant is recorded on the commandery's record. The mirror's entry carries a text-critical
  correction of the officer's name, so the name is attributed to the annals."
cites:
  places:
    - id: han-conquest-places
      says:
        "The entries name no site for the campaign: the only place named is the 潁川 commandery the
        annexation created, and the event asserts no coordinate for it."
      source: shiji
      at: 卷六 秦始皇本紀 十七年（命曰潁川）
