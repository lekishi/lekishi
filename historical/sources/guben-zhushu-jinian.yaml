notes: "The 'old text' of the Bamboo Annals: a chronicle buried in a Wei tomb around 296 BCE, found
  in 281 CE, lost again, and reconstructed by 朱右曾 and then 王國維 from quotations in later works.
  Each entry is a quotation that a later book attributes to the annals, so an entry is evidence of
  that quotation, and its year is the reconstruction's placement. It often disagrees with the 史記,
  which is why the chapters cite both. The spurious 'current text' (今本) is not used."
