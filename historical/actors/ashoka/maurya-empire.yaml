# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  The Maurya empire, founded by Chandragupta and ruled from Pāṭaliputra, which under Aśoka reached from
  the north-western frontier to Mysore. Its frontagers in the edicts are the Greek king Antiochos in the
  west and the Cholas, Pāṇḍyas, Satiyaputra and Keralaputra in the south.
types: [state, dynasty]
names:
  - form: Maurya
    lang: en
    script: Latn
    cite:
      - id: maurya-name
        says: >-
          Smith calls Aśoka a son of Bindusāra and the third sovereign of the Maurya dynasty.
        source: smith-asoka-1920
        at: ch. I, The History of Asoka
        quote: a son of Bindusâra, and the third sovereign of the Maurya dynasty
notes: >-
  An empire and its ruling house in one record: the edicts speak of the king's dominions, not of a named
  state.
