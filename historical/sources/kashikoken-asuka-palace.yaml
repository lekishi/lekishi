notes:
  The museum's page on the 飛鳥宮跡 at 明日香村岡 and 飛鳥, excavated since 1959 by the institute. It
  says the superimposed palace remains are divided into periods I to III and, from excavated 木簡 and
  pottery dates, are thought to correspond to 舒明's 飛鳥岡本宮 (I), 皇極's 飛鳥板蓋宮 (II), and
  齊明's 後飛鳥岡本宮 with the 飛鳥浄御原宮 of 天武 and 持統 (III); the period I remains have been
  excavated only in small areas and their overall plan is unknown. It is a modern archaeological
  identification, not a source statement of the seventh century.
