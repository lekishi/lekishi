notes:
  The city's heritage page describes the government office ruins at 4-6-1 Kanzeonji, Dazaifu, as the
  site of the administrative complex of 大宰府, the seat of imperial power in Kyushu from the late
  seventh to the late twelfth century, whose foundations remain in a public park. It is a modern
  site identification, not a source statement of the eighth century.
