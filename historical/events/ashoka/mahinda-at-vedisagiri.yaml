# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  On his way to Lanka, Mahinda spends six months visiting his mother Devī at Vedisagiri, lodging in the
  monastery she had built, and converts her grand-nephew Bhaṇḍu.
types: [journey]
date:
  value: 255 BCE..249 BCE
  mode: window
  calendar: regnal
  as_written: on his way to Ceylon (chronicles)
  cite:
    - id: vedisagiri-time
      says: Smith's retelling puts the visit on Mahinda's way to Lanka, after the council.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      source: smith-asoka-1920
      at: ch. VI, The Ceylonese Legend of Asoka
      quote: >-
        Mahendra resolved, with the king's permission, to visit his mother and her relations on his way
        to Ceylon, and devoted six months to this purpose.
    - id: mahinda-at-vedisagiri-error-bound
      says: >-
        Smith holds that the error in his dates for the reign cannot exceed three years, so the
        support runs three years either side of his year.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      role: supporting
      source: smith-asoka-1920
      at: ch. I, The History of Asoka
      quote: the error in any case cannot exceed three years
places:
  - place: vidisa
    role: site
  - place: sanchi
    role: context
    note: Smith thinks the monastery is the buildings at Sāñchī.
participants:
  - actor: mahinda
    role: subject
  - actor: devi-of-vidisa
    role: host
notes: >-
  From the Ceylon chronicles in Smith's retelling, which he relates as legend. The BCE year converts the
  chronicle's regnal year with Smith's epoch, which the chronicles themselves do not use.
cite:
  - id: vedisagiri-basis
    says: The retelling says he found his mother at her home in Vedisagiri.
    source: smith-asoka-1920
    at: ch. VI, The Ceylonese Legend of Asoka
    quote: He found his mother at her home in Vedisagiri
