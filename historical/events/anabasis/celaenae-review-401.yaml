# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "At Celaenae Cyrus reviews and numbers his Greeks in the park: eleven thousand hoplites and about
  two thousand peltasts."
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE
  mode: window
  calendar: julian
  as_written: here Cyrus held a review, and numbered his Hellenes in the park
  cite:
    - id: celaenae-review-401-time
      says:
        Grote dates the start of the march from Sardis to about March or April 401 BCE and the battle
        of Kunaxa to about September or October of the same year; the stage falls between them.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: I.2
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote: was commenced about March or April in the year 401 B.C.
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            It was about six months afterwards, in the month of September or October of the same year,
            that the battle of Kunaxa was fought
    - id: celaenae-review-401-text
      says: Xenophon records the review at Celaenae.
      source: xenophon-anabasis
      at: I.2
      quote: and here Cyrus held a review, and numbered his Hellenes in the park
      role: supporting
places:
  - place: kelainai
    role: site
participants:
  - actor: cyrus-the-younger
    role: leader
  - actor: cyreans
    role: participant
cites:
  summary:
    - id: celaenae-review-401-count
      says: Xenophon gives the count of the Greek force at the review.
      source: xenophon-anabasis
      at: I.2
      quote: and found that they amounted in all to eleven thousand hoplites and about two thousand peltasts.
