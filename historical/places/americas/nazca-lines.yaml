      Label anchor at the coordinate Wikidata records for the Nazca Lines. The geoglyphs cover about
      450 km², and no extent is drawn.
    cite:
      id: nazca-lines-anchor
      says:
        The label anchor is placed at the coordinate recorded in Wikidata (CC0) for Q2620036; no historical
