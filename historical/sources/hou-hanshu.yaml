notes: The fifth-century history of the Eastern Han, written about three and a half centuries after
  the events it records for 57 CE and the 70s–100s. Its 西域傳 draws on 班勇's report of the 120s,
  which it names; its 東夷列傳 and 光武帝紀 entries for 57 CE are the records of the 倭奴國 embassy
  and the seal used here.
