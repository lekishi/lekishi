summary:
  馮崇債, the 別駕 (vice-prefect) of 振州 who in 748 sent soldiers to meet 鑒眞's party, lodged them at
  the prefecture's 大雲寺, and a year later escorted them with his own troops to 萬安州.
types: [person]
names:
  - form: 馮崇債
    lang: lzh
    script: Hani
    roman: Feng Chongzhai
    scheme: pinyin
    cite:
      - id: feng-chongzhai-name
        says: The biography names the 別駕 of 振州 as 馮崇債.
        source: toseiden
        at: 其別駕馮崇債遣兵四百餘人來迎
roles:
  - role: official
    note: 別駕 of 振州.
    cite:
      - id: feng-chongzhai-role
        says: The biography gives his office as 別駕 of the prefecture the party reached at 振州江口.
        source: toseiden
        at: 夜發，經三日乃到振州江口泊舟。其經紀人往報郡，其別駕馮崇債遣兵四百餘人來迎
