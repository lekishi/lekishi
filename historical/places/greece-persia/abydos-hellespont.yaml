    lang: grc
    script: Grek
    roman: Abydos
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: abydos-hellespont-greek-name
        says: Pleiades records the ancient Greek name Ἄβυδος for this place.
        source: pleiades
        at: place 501325, name /places/501325/abydos, dump 2026-10-21
      - id: abydos-hellespont-name
        says: Herodotus records Xerxes at Abydos before the crossing.
        source: herodotus
        at: VII.44
        quote: When Xerxes had come into the midst of Abydos, he had a desire to see all the army
        role: supporting
