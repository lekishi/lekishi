# yaml-language-server: $schema=../../schema/event.schema.json
summary: An edict orders laicized every monk and nun who practises spells or alchemy, has deserted the army, bears flogging scars, has broken the precepts or keeps a wife, and confiscates the clergy's money and estates.
types: [occurrence]
date:
  value: 842-10-09
  calendar: chinese_lunisolar
  as_written: 會昌二年十月九日
  cite:
    - id: huichang-decree-842-time
      says: The diary records the edict of 十月九日 ordering laicized those who have broken the precepts, keep wives or do not keep the discipline.
      source: nitto-guho-junrei-gyoki
      at: 卷三 會昌二年十月九日
      quote: 曾犯婬。養妻。不修戒行者。竝勒還俗。
places:
  - place: changan
    role: site
participants:
  - actor: tang-wuzong
    role: leader
  - actor: ennin
    role: witness
notes: The diary gives the edict's text as it heard it in 長安; it is the first step of what later histories call the 會昌 persecution.
