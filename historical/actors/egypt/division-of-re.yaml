# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The division of Re, one of the army divisions of Ramesses II at Kadesh, which the Hittite chariots
  struck and broke on the march.
types: [institution]
names:
  - form: the legion of Ra-Hormakhis
    lang: en
    script: Latn
    note: Sayce's phrase; the poem has the legion of Pra-Hormakhu.
    cite:
      - id: division-of-re-name
        says: Sayce says the chariots charged the legion of Ra-Hormakhis.
        source: sayce-hittites
        at: "ch. II: Kadesh, the ambush"
        quote:
          The chariots and horses charged 'the legion of Ra-Hormakhis,' and 'foot and horse gave way
          before them.'
notes:
  An army division named for the god Re, not a standing institution of state. The other divisions
  at Kadesh (of Amun, Ptah and Sutekh) are not in the sources read for this chapter.
