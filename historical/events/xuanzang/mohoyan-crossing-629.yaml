summary:
  Crossing the 莫賀延磧 alone, 玄奘 misses 野馬泉 and spills his water; he turns back, then west again,
  and goes four nights and five days without water until his horse finds grass and a pool. Two days later
  he reaches 伊吾.
types: [journey]
