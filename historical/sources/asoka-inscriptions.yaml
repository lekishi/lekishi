notes: The primary record of Aśoka's reign. A citation names the inscription and the site of the
  text Smith translates (for example "Rock Edict XIII, Shāhbāzgaṛhi text"). The regnal years are
  the inscriptions' own ("when I had been consecrated twelve years"); every BCE year is a conversion
  and comes from the separate Smith source. Inscriptions found after 1920 (Erragudi, Kandahar,
  Laghman, Gujarra and others) are not in this edition.
