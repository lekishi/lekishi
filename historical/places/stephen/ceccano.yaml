    cite:
      - id: ceccano-point
        says: The point is the coordinate Wikidata records for Ceccano; the identification with the place the sources name is editorial.
        source: wikidata
        at: Q116706 (P625), revision 2554403419
modern:
  - form: Ceccano
    lang: it
    script: Latn
    note: The modern town, with which the castellum is identified.
external_ids:
