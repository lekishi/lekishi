# yaml-language-server: $schema=../../schema/place.schema.json
summary: Cremona, the Roman colony founded north of the Po in 218 BCE, the partner of Placentia.
types: [settlement, fortification]
names:
  - form: Cremona
    lang: la
    script: Latn
    cite:
      - id: cremona-name-livy
        says: Livy names Cremona with Placentia as the new colonies by the Po.
        source: livy
        at: "21.25.2"
        quote: Placentiam Cremonamque colonias
  - form: Κρεμώνη
    lang: grc
    script: Grek
    cite:
      - id: cremona-name-polybius
        says: Polybius records the colony north of the Po being named Κρεμώνη.
        source: polybius
        at: "3.40.5"
        quote: τὴν δʼ ἄλλην ἐπὶ θάτερα, κατονομάσαντες Κρεμώνην
at:
  - interpretation: approximate_point
    precision: locality
    point: [10.024722222, 45.133333333]
    notes:
      An approximate placement at modern Cremona, which Pleiades identifies with the colony; the
      coordinate is the modern city's.
    cite:
      - id: cremona-identification
        says:
          Pleiades locates the ancient place (Cremona) at the site whose modern coordinate Wikidata
          records; the point is the Wikidata coordinate (CC0), an approximate placement of the
          ancient town, not a surveyed site.
        basis: interpretation
        attributed_to: Pleiades
        sources:
          - source: pleiades
            at: place 383628 (Cremona), reprLatLong, dump 2026-10-21
          - source: wikidata
            at: Q6231 (P625), revision 2537330762
modern:
  - form: Cremona
    lang: it
    script: Latn
    note: Modern city on the site, recorded for orientation.
external_ids:
  - system: wikidata
    id: Q6231
    license: CC0-1.0
  - system: pleiades
    id: "383628"
    license: CC BY 3.0
