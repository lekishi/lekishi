summary:
  The king of 迦濕彌羅 meets 玄奘 with a thousand followers, lodges him at the 闍耶因陀羅寺 and gives him twenty
  copyists; he studies with 僧稱 and stays two years.
types: [journey, exchange]
date:
  value: 631..633
  mode: window
  calendar: chinese_lunisolar
  as_written: 知足停留首尾二年，學諸經、論，禮聖跡已，乃辭
  cite:
    - id: kashmir-stay-631-time
      says: The biography records the two years in 迦濕彌羅 without dates.
      source: cien-zhuan
      at: 卷二（知足停留首尾二年）
      quote: 知足停留首尾二年，學諸經、論，禮聖跡已，乃辭
