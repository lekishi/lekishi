    precision: locality
    point: [34.8491898, 31.5655212]
    notes: The gazetteer's point for Lachish, after the Barrington Atlas.
    cite:
      - says: The Pleiades gazetteer records Lachish with a precise representative point.
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: places/687951 (reprLat, reprLong; locationPrecision precise), dump 2026-10-21
