# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Seven days from Gaza Alexander reaches Pelusium, garrisons it, and goes up the Nile to Memphis,
  where he sacrifices to Apis; Egypt passes to him without a fight.
types: [journey]
part_of: [alexander-campaigns-334]
date:
  value: 332 BCE..331 BCE
  mode: window
  calendar: julian
  as_written: on the seventh day he arrived at Pelusium
  cite:
    - id: egypt-332-time
      says:
        Chinnock dates the fall of Tyre to the end of July or beginning of August 332 BCE and the arrival
        at Thapsacus to June–July 331 BCE; this stage lies between.
      basis: interpretation
      attributed_to: E. J. Chinnock
      sources:
        - source: arrian-anabasis
          at: II.24, note 331
          quote: The end of July and beginning of August B.C. 332.
        - source: arrian-anabasis
          at: III.7, note 381
          quote: June-July, B.C. 331.
    - id: egypt-332-text
      says: Arrian records the arrival at Pelusium.
      source: arrian-anabasis
      at: III.1
      quote: and marching from Gaza, on the seventh day he arrived at Pelusium in Egypt.
      role: supporting
places:
  - place: gaza
    role: start
  - place: pelusium
    role: waypoint
  - place: memphis
    role: end
participants:
  - actor: alexander-the-great
    role: leader
cites:
  places:
    - id: egypt-332-memphis
      says: Arrian records Alexander reaching Memphis.
      source: arrian-anabasis
      at: III.1
      quote: Thence he crossed the stream and came to Memphis
