# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  衛青, the Han general from 平陽 who reached 蘢城 in 129 BCE, took the 河南 land in 127 BCE, was made
  大將軍 after routing the 右賢王 in 124 BCE, and fought the 單于 north of the desert in 119 BCE.
types: [person]
names:
  - form: 衛青
    lang: lzh
    script: Hani
    roman: Wei Qing
    scheme: pinyin
    cite:
      - id: wei-qing-name
        says: The biography opens by naming 大將軍衛青 as a man of 平陽.
        source: shiji-han-frontiers
        at: 卷一百十一 衛將軍驃騎列傳 篇首
        quote: 大將軍衛青者，平陽人也
roles:
  - role: soldier
    note: Campaigns as 車騎將軍 and, from 124 BCE, as 大將軍; the span is the campaigns the chapter cites.
    date:
      value: 129 BCE..119 BCE
      mode: duration
      calendar: chinese_lunisolar
      as_written: 元光六年（車騎將軍衛青出上谷）; 元狩四年（大將軍衛青將四將軍出定襄）
    cite:
      - id: wei-qing-campaigns
        says: The annals send 車騎將軍衛青 out of 上谷 in 元光六年 and 大將軍衛青 out of 定襄 in 元狩四年.
        sources:
          - source: hanshu
            at: 卷六 武帝紀 元光六年
            quote: 遣車騎將軍衛青出上谷
          - source: hanshu
            at: 卷六 武帝紀 元狩四年
            quote: 大將軍衛青將四將軍出定襄
