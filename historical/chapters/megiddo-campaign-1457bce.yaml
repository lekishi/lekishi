# yaml-language-server: $schema=../schema/chapter.schema.json
title: Thutmose III at Megiddo, about 1457 BCE
summary: Thutmose III leaves the frontier at Tharu late in his 22nd year and, in his 23rd, marches
  through Gaza to Yehem, takes the narrow Aruna pass against his officers' advice, routs the coalition
  of the chief of Kadesh before Megiddo, and besieges the city into submission. The annals date it day
  by day; on Shaw's chronology those regnal years fall in 1458 BCE to 1456 BCE.
window: 1458 BCE..1456 BCE
story:
  summary: 'Thutmose III at Megiddo: the first campaign of the annals, day by day from Tharu to the siege,
    with the booty and the chiefs'' submission.'
  span: 1458 BCE..1425 BCE
  coverage: 'The first campaign as the Karnak annals tell it in Breasted''s translation, from the king
    at Tharu to the goods of Yenoam, and the carving of the annals. Excluded: the later campaigns of the
    annals, the Gebel Barkal and Armant stelae that also tell of Megiddo, the topographical lists of Karnak,
    and the tale of the taking of Joppa. Yehem, Aruna, Zefti, the brook of Kina, Yeraza, Yenoam, Nuges
    and Herenkeru are unlocated, so no line is drawn through them.'
  notes: Every BCE date converts the source's regnal date on Shaw's chronology (The Oxford History of
    Ancient Egypt, 2000), which puts the accession of Thutmose III in 1479 BCE. Step order is presentation order; the day dates give the order within year 23, which
    the contract does not compare at sub-year precision.
