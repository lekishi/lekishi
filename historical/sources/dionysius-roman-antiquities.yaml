notes:
  Dionysius wrote in Rome under Augustus and dates every king's accession by Olympiad year, which
  makes his the only source that dates the tradition step by step. His dates are a Greek
  historian's synchronism of the Roman tradition, and he reports the competing founding dates of
  Timaeus, Cincius, Fabius and Cato beside his own.
