# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  Twenty years after his consecration Aśoka comes in person to Lumbinī, where the Buddha was born, sets
  up a stone pillar, and releases the village from religious cesses, leaving it to pay one-eighth of its
  produce.
types: [journey]
date:
  value: 252 BCE..246 BCE
  mode: window
  calendar: regnal
  as_written: when he had been consecrated twenty years (Rummindēī pillar)
  cite:
    - id: lumbini-time
      says: The pillar records the visit when the king had been consecrated twenty years.
      source: asoka-inscriptions
      at: Rummindēī pillar inscription
      quote: >-
        By His Sacred and Gracious Majesty the King when he had been consecrated twenty years, having come
        in person
    - id: lumbini-conversion
      says: Smith dates the inscription approximately to 249 BCE.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      role: supporting
      source: smith-asoka-1920
      at: >-
        ch. V, The Pillar and Miscellaneous Inscriptions (comment on the Rummindêî inscription)
      quote: The date of the inscription is approximately 249 B. C.
    - id: lumbini-visit-249-error-bound
      says: >-
        Smith holds that the error in his dates for the reign cannot exceed three years, so the
        support runs three years either side of his year.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      role: supporting
      source: smith-asoka-1920
      at: ch. I, The History of Asoka
      quote: the error in any case cannot exceed three years
places:
  - place: lumbini
    role: site
participants:
  - actor: ashoka
    role: leader
notes: >-
  A tax remission granted in person, recorded on a pillar that Smith thinks a local authority drafted.
  The place is identified beyond doubt in Smith's account.
cite:
  - id: lumbini-remission
    says: The pillar records the village's release from religious cesses.
    source: asoka-inscriptions
    at: Rummindēī pillar inscription
    quote: >-
      the village of Lurḿmini was released from religious cesses and required to pay [only] one-eighth as
      land revenue
