title: 玄奘's journey from 長安 to 那爛陀, 629–636
summary: >-
  玄奘 leaves 長安 without leave, goes by 秦州, 蘭州 and 涼州 to 瓜州, crosses the 莫賀延磧 alone to 伊吾
  and 高昌, follows the oases to 屈支, crosses the 凌山 to the 葉護可汗 at 素葉, goes south by 颯秣建 and
  the 鐵門 into 睹貨羅, over the Hindu Kush by 梵衍那 to 迦畢試, and through 健陀邏, 迦濕彌羅 and the
  Ganges plain to 那爛陀.
travellers:
  - actor: xuanzang
    role: leader
# Two events are not stops because their only place is context: the night crossing below
# 玉門關 (yumen-crossing-629), which he saw but bypassed, and the 波羅奢 forest robbery
# (sakala-robbery-633), east of 奢羯羅, not at it.
