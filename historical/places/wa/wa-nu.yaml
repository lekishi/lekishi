# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  The land of the 倭奴國, which the 東夷列傳 places at the far southern edge of 倭, across the sea
  south-east of 韓. The sources give no site for it, and the record carries no position.
types: [region]
names:
  - form: 倭奴國
    lang: lzh
    script: Hani
    roman: Wonu guo
    scheme: pinyin
    cite:
      - id: wa-nu-name
        says: The 東夷列傳 names the 倭奴國 and places it at the far southern edge of 倭.
        source: hou-hanshu
        at: 卷八十五 東夷列傳 倭（建武中元二年）
        quote: 倭奴國奉貢朝賀，使人自稱大夫，倭國之極南界也
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      The 東夷列傳 places 倭 in the great sea south-east of 韓 and the 倭奴國 at its southern edge, and
      names no site, so no position is asserted.
    cite:
      - id: wa-nu-unplaced
        says: The 倭 entry places 倭 among the mountains and islands of the great sea south-east of 韓 and states no site for the 倭奴國.
        source: hou-hanshu
        at: 卷八十五 東夷列傳 倭 篇首
        quote: 倭在韓東南大海中，依山島為居，凡百餘國。
