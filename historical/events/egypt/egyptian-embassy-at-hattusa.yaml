# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  An Egyptian embassy is received at the Hittite capital during the treaty negotiations, which,
  Garstang says, took many months.
types: [mission]
date:
  value: 1284 BCE..1258 BCE
  mode: window
  calendar: regnal
  as_written: about year 21 of Ramesses II
places:
  - place: hattusa
    role: end
participants:
  - actor: egypt-new-kingdom
    role: participant
  - actor: hattusili-iii
    role: host
cite:
  - id: egyptian-embassy-basis
    says:
      Garstang infers an exchange of copies from the reception of an Egyptian embassy in the Hittite
      capital.
    source: garstang-land-of-hittites
    at: "ch. VI, p. 347: the treaty, fn. 817"
notes:
  "Garstang does not name the envoys. Ramesses II's regnal years convert to BCE according to the
  chronology used: his accession is put at about 1304, 1290 or 1279 BCE (the low date most used today).
  The window spans those dates for the year in question. Garstang's 1910 dates (Kadesh 1288 B.C., the
  treaty about 1271 B.C.) fall inside it; Sayce's 1890 dates (1383 and 1354 B.C.) follow an older scheme
  and fall outside. It is an editorial bound that a cited chronology must replace before approval."
