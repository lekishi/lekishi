# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The Nervii, with the Atrebates and Viromandui, waited beyond the Sabis (Sambre) and fell
  on Caesar's legions as they fortified camp. Caesar took a shield and fought in the front line
  before the tenth legion and the baggage guard turned the battle. Caesar reports the Nervii's own
  envoys saying they were reduced from 600 senators to three and from 60,000 fighting men to barely
  500."
types: [campaign]
date:
  value: 57 BCE
  mode: window
  calendar: julian
  as_written: "the year of book II (one commentary a year, from 58 BCE)"
  cite:
    id: nervii-battle-sambre-57-year
    says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by
      the consuls of 58 BCE, so each book is one year from 58 BCE."
    sources:
      - source: caesar-gallic-war
        at: "1.6"
        quote: "L. Pisone, A. Gabinio consulibus."
      - source: caesar-gallic-war
        at: "8.48"
        quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
places:
  - place: sambre
    role: site
    cite:
      id: nervii-sambre-place
      says: Caesar learned that all the Nervii had settled beyond the Sabis to wait for the Romans.
      source: caesar-gallic-war
      at: "2.16"
      quote: trans id flumen omnes Nervios consedisse adventumque ibi Romanorum expectare
participants:
  - actor: julius-caesar
    role: leader
  - actor: nervii
    role: subject
cite:
  - id: nervii-sambre-losses
    says: "Caesar reports the envoys saying they had been reduced from 600 senators to three and
      from 60,000 men able to bear arms to barely 500."
    source: caesar-gallic-war
    at: "2.28"
    quote: "ex DC ad tres senatores, ex hominum milibus LX vix ad D, qui arma ferre possent, sese
      redactos esse dixerunt."
notes: "Caesar's own account; the losses are what he reports the envoys said, and the Nervii fight
  again in 54 and 53 BCE."
