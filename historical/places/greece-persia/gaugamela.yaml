# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Gaugamela, the place near the river Bumodus where Darius III camped and Alexander defeated him
  in 331 BCE. The battle is often named after Arbela, 600 stades away.
types: [settlement]
names:
  - form: Gaugamela
    lang: en
    script: Latn
    note: The form in the cited English translation; the gazetteer records no Greek form for this place.
    cite:
      - id: gaugamela-name
        says: Arrian places Darius's camp at Gaugamela, about 600 stades from Arbela.
        source: arrian-anabasis
        at: III.8
        quote:
          With these forces Darius had encamped at Gaugamela, near the river Bumodus, about 600 stades
          distant from the city of Arbela
at:
  - interpretation: approximate_point
    precision: locality
    point: [43.49432, 36.57332]
    notes:
      "The gazetteer's representative point for the place (location precision: precise). It is the
      gazetteer's identification of the ancient place, not a position the ancient text states."
    cite:
      - id: gaugamela-location
        says:
          Pleiades identifies the place and gives its representative point as 36.573315, 43.494324 (latitude,
          longitude), with location precision precise.
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 874478 (reprLatLong, locationPrecision), dump 2026-10-21
external_ids:
  - system: pleiades
    id: "874478"
    url: https://pleiades.stoa.org/places/874478
