# yaml-language-server: $schema=../schema/chapter.schema.json
title: The pope's journey to the Franks
summary: Threatened by the Lombard king Aistulf since he broke his peace with Rome in 752, Pope
  Stephen II left the city in the autumn of 753 and crossed the Alps in winter to seek the help of
  Pepin, king of the Franks. Follow him from Rome by Pavia and the Great St Bernard to the meeting
  at Ponthion at Epiphany 754, the winter and the anointing at Saint-Denis, and the return with
  the Frankish army, with the Roman and Frankish sources' disagreements kept visible.
window: 752..754
story:
  summary: Stephen II's journey of 753–754 from Rome to the Frankish king and back with Pepin's army,
    from the prelude of Aistulf's threats in 752–753 through the 756 campaign, the donation of the
    exarchate and the pope's burial in 757.
  span: 752..757
  coverage: Primary window 752–754, the prelude of 752–753 in Rome, the journey from the departure
    from Rome on 14 October 753 to the meeting at Ponthion on 6 January 754 and the winter at
    Saint-Denis, and the return with the first Italian campaign and Carloman's death (754 or 755, the
    sources disagree); the second campaign of 756, Aistulf's death and Stephen's burial in 757 form a
    coda. Excluded
    are the Frankish annals' other notices of these years (the Saxon campaign of 753, Grifo's death,
    Boniface's martyrdom), the earlier papal appeals to Charles Martel, and everything after April
    757. No route geometry is asserted; every place is a modern coordinate identified with the
    place the sources name.
  notes: Step order is presentation order, not a claim that one event preceded or caused another.
    Same-year events whose order the sources leave open (the anointing and the Quierzy assembly,
    Carloman's stay and death) are not ordered by the chapter. The coda steps are labelled in their
    captions.
