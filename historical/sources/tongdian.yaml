notes:
  "The institutional encyclopedia 杜佑 presented in 801. Its 西戎 section is the only witness of 經行記,
  the account of his kinsman 杜環: the 西戎總序 (卷一九一) records 杜環 following 高仙芝's western
  campaign, reaching 西海 in 天寶十載 and returning by merchant ship from 廣州 in 寶應初, and the
  entries for 疏勒 (卷一九二), 康居, 師子國, 大秦, 波斯, 石國 and 大食 (卷一九三) quote his descriptions. The
  經行記 itself is lost; the chapter cites the fragments where 通典 quotes them, never a modern
  compilation of them. Locators name the 卷, the entry and the fragment's opening words."
