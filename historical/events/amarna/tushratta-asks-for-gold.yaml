# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Tushratta greets Amenhotep III as brother and son-in-law and asks for gold in great quantity,
  for war equipment and a dowry, since in Egypt, he says, gold is as plentiful as dust.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1390 BCE..1352 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis III
  cite:
    - id: tushratta-asks-for-gold-shaw
      says: On Shaw's chronology Amenhotep III reigned 1390–1352 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
participants:
  - actor: tushratta
    role: participant
  - actor: amenhotep-iii
    role: participant
  - actor: mitanni
    role: participant
cite:
  - id: gold-basis
    says: Niebuhr quotes Letter VIII of the British Museum edition.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Letter VIII"
notes: "The letters are undated but for a few dockets. Their reigns follow Shaw's chronology (The
  Oxford History of Ancient Egypt, 2000): Amenhotep III 1390–1352 BCE and Amenhotep IV (Akhenaten)
  1352–1336 BCE. Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.)
  follow an older, higher scheme."
