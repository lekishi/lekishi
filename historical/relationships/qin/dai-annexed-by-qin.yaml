    source: shiji
    at: "卷六 秦始皇本紀 二十五年（還攻代，虜代王嘉）"
    quote: "還攻代，虜代王嘉。"
  - says: "The comprehensive mirror records 王賁 attacking Dai and capturing its king."
    role: supporting
    source: zizhi-tongjian-qin-ji-2
    at: "卷七 秦紀二 始皇帝二十五年（王賁攻代）"
    quote: "王賁攻代，虜代王嘉。"
