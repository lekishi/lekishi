summary:
  烏孫, the mounted people north-east of 大宛 who had served the 匈奴 and broken away under the 昆莫;
  張騫 went to them in his second mission to propose an alliance.
types: [state, community]
names:
  - form: 烏孫
    lang: lzh
    script: Hani
    roman: Wusun
    scheme: pinyin
    cite:
      - id: wusun-state-name
        says:
          The 大宛列傳 describes 烏孫 as a mobile country about two thousand 里 north-east of 大宛, with
          the customs of the 匈奴.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（烏孫在大宛東北可二千里）
        quote: 烏孫在大宛東北可二千里，行國，隨畜，與匈奴同俗。
