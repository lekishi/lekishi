# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  "The embassy of 藤原常嗣 from 日本國 to 唐, 834–839: appointed in 834, twice driven back, sailed in 838
  without its vice-envoy 小野篁, received in 唐 (開成四年 in the Tang histories), and home in 839 on nine hired
  Silla ships."
types: [diplomacy]
from: japan-state
to: tang-dynasty
date:
  value: 834..839
  mode: duration
  calendar: regnal
  as_written: 承和元年正月 任遣唐使; 承和六年十月 新羅船一隻皈着筑前國博多津
  cite:
    - id: japan-tang-mission-838-time
      says: The chronicle dates the appointment to 承和元年 and the last ship's return to 承和六年.
      source: shoku-nihon-koki
      at: 卷第三 承和元年正月庚午; 卷第八 承和六年十月丁巳
notes:
  Directional, no causation asserted. 圓仁's diary tells the same embassy from aboard the first ship;
  its stops are the ennin- events.
cite:
  - id: japan-tang-mission-838-basis
    says: The chronicle records the embassy from appointment to return, and the Tang histories its tribute.
    sources:
      - source: shoku-nihon-koki
        at: 卷第三 承和元年正月庚午; 卷第八 承和六年九月乙未
      - source: jiu-tangshu
        at: 卷199上 東夷 日本國（開成四年，又遣使朝貢）
