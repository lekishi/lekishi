# yaml-language-server: $schema=../schema/chapter.schema.json
title: The embassy to Tang China
summary: In 750 the Japanese court appointed an embassy to Tang China. Follow 藤原朝臣清河's mission from
  the appointment and the audiences at court to the invitation to the monk 鑒眞, the return voyage
  that scattered its ships, and the ordinations of 754 — with the sources' own gaps and
  disagreements kept visible.
window: 750..754
include: [komaro-tang-contact]
story:
  summary: The 750–754 embassy of 藤原朝臣清河, from appointment through the return voyage and the 754
    ordinations, with the included coda nodes of 758, 759, 763, and 779 presented after it.
  span: 750..779
  coverage: Primary mission window 750–754; included coda nodes outside it at 758, 759, 763, and 779,
    separately sourced and labelled; the outbound voyage of 752 is excluded, so no outward leg or
    route geometry exists in this chapter.
  notes: Step order is presentation order, not a claim that one event preceded or caused another.
    Uncertain occurrences (the two drifts) are not presented as continuous activity. The coda steps
    are labelled in their captions and in the records' editorial notes.
  steps:
