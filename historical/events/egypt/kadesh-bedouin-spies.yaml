# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "Near Kadesh two Bedouin are captured and tell Ramesses II that the Hittite king is far off in
  the north at Aleppo. The story is false: the Hittite army is lying hidden close by."
types: [occurrence]
part_of:
  - battle-of-kadesh
date:
  value: 1300 BCE..1274 BCE
  mode: window
  calendar: regnal
  as_written: year 5 of Ramesses II
places:
  - place: kadesh
    role: site
  - place: aleppo
    role: context
    note: Where the spies said the Hittite king was encamped.
participants:
  - actor: ramesses-ii
    role: subject
cite:
  - id: spies-basis
    says: Sayce tells of the two Bedouin spies and their false report.
    source: sayce-hittites
    at: "ch. II: Kadesh, the spies"
    quote:
      There two Beduin spies were captured, who averred that the Hittite king was far away in the north
      with his forces, encamped at Aleppo. But the intelligence was false.
notes:
  "Sayce takes the story from the Egyptian poem and the reliefs, which say the Bedouin were sent
  by the Hittite king to mislead Pharaoh. Ramesses II's regnal years convert to BCE according to the
  chronology used: his accession is put at about 1304, 1290 or 1279 BCE (the low date most used today).
  The window spans those dates for the year in question. Garstang's 1910 dates (Kadesh 1288 B.C., the
  treaty about 1271 B.C.) fall inside it; Sayce's 1890 dates (1383 and 1354 B.C.) follow an older scheme
  and fall outside. It is an editorial bound that a cited chronology must replace before approval."
