# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  五鹿, a 衛 town near the 齊 and 晉 borders where the hungry 重耳 begged food from a countryman and was handed
  a clod of earth. The historical geography puts it east of 元城; the record asserts no point.
types: [settlement]
names:
  - form: 五鹿
    lang: lzh
    script: Hani
    roman: Wulu
    scheme: pinyin
    cite:
      - id: wulu-name
        says: >-
          The 左傳 records that 重耳 left 衛 by 五鹿 and begged food from a countryman, who gave him a clod.
        source: zuozhuan
        at: 僖公二十三年（出於五鹿）
        quote: 出於五鹿，乞食於野人，野人與之塊。
at:
  - interpretation: unknown
    precision: unspecified
    notes: >-
      The geography places 五鹿 forty-five 里 east of the prefectural city and quotes 杜預 for 'east of 元城',
      without a coordinate.
    cite:
      - id: wulu-geography
        says: >-
          The historical geography identifies the 五鹿 of 重耳's exile with a walled site south-east of the prefectural
          city.
        source: dushi-fangyu-jiyao-zhou
        at: 卷十六 北直七 大名府（五鹿城）
        quote: 五鹿城，在府東南。春秋時衛地，亦與齊、晉接境。
