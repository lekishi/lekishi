# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The realm was divided into thirty-six commanderies, each with a governor, a commandant and a supervisor, and the people were renamed 黔首. The annals record it in 221 BCE; the six-states table under 220 BCE."
types: [other]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（分天下以為三十六郡）; 秦始皇二十七年（分為三十六郡）"
  cite:
    - says: "The annals record the division into thirty-six commanderies after the unification of 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（分天下以為三十六郡）"
      quote: "分天下以為三十六郡，郡置守、尉、監。更名民曰「黔首」。"
participants:
  - actor: qin-state
    role: leader
notes: "The thirty-six are not listed in the annals, and the chapter names no commandery beyond those its events create (潁川, 會稽). An institutional change with no place."
dispute:
  status: disputed
  summary: "The annals place the division in 二十六年 (221 BCE); the six-states table records it, with the renaming of the people, under 二十七 (220 BCE). The chapter publishes the annals' year and keeps the table's as a claim."
cite:
  - says: "The six-states table records the division and the renaming of the people under 秦始皇二十七年 (220 BCE)."
    role: conflicting
    source: shiji
    at: "卷十五 六國年表 秦始皇二十七年（分為三十六郡）"
    quote: "命民曰「黔首」。同天下書。分為三十六郡。"
