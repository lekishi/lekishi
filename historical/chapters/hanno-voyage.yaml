# yaml-language-server: $schema=../schema/chapter.schema.json
title: Hanno's voyage beyond the Pillars
summary: Sometime between 570 BCE and 470 BCE, as scholars date it, Carthage sent Hanno through the Pillars of Heracles
  with sixty ships to found cities on the Atlantic coast of Africa. Follow the account he dedicated at
  Carthage, stage by stage in days' sailing — the friendly Lixitae, the island of Cerne, the Chariot of
  the Gods — with every place it names identified differently by different scholars.
window: 570 BCE..470 BCE
include: [hanno-lixitae-contact, hanno-gorillai-conflict]
story:
  summary: "Hanno's voyage beyond the Pillars of Heracles, about 570–470 BCE: the Carthaginian resolution
    and departure, the colonies on the Moroccan coast, the stay with the Lixitae, Cerne, the voyage south
    past the burning coast to the Horn of the South, the dedication of the account at Carthage, and
    Pliny's later report of the skins in the temple of Juno."
  span: 570 BCE..146 BCE
  coverage: "The voyage as the Periplus of Hanno tells it, all eighteen sections, with Pliny's three notices
    (II.67, V.1, VI.36) as separate or conflicting accounts. Dates: the account has none, so every stage
    shares the voyage's window of about 570–470 BCE, the range of the cited commentators' readings; the
    skins' display runs to the fall of Carthage in 146 BCE. Places: drawn only where a gazetteer or
    commentator gives an identification with a coordinate (Carthage, the Pillars, Soloeis at Cape
    Spartel, Cerne at Mogador, the Chariot of the Gods at Mount Cameroon); every other place is
    unknown, with the identifications kept as alternatives. Excluded: Himilco's northern voyage, the
    later Carthaginian and Roman Atlantic voyages, and Pseudo-Scylax's Cerne."
  notes: "Step order follows the account's sections, which count days' sailing, not years; the atlas
    cannot place one stage before another in time, so the order is the story's, not the timeline's.
    Drawn positions are identifications attributed to their gazetteer or commentator. The drawn route
    would jump from Mogador to Mount Cameroon because the stages between them are unlocated; the
    journey record proposed for contract v1 breaks the line at every unlocated stop instead."
  steps:
    - hanno-voyage: Hanno's voyage, about 570–470 BCE — undated, its extent disputed
    - hanno-departure: Carthage sends Hanno with sixty ships
    - hanno-pillars-passage: Through the Pillars of Heracles
    - thymiaterium-founding: The first city, Thymiaterium
    - soloeis-sanctuary: A sanctuary of Poseidon at Soloeis
    - elephant-marsh: The marsh of elephants
    - five-cities-founding: Five cities by the sea
    - lixus-sojourn: Friends with the Lixitae at the river Lixus
    - hanno-lixitae-contact: The contact with the Lixitae, and the interpreters
    - cerne-founding: Cerne — two days' sail in the Greek, twelve in the translation
    - chretes-lake-repulse: Driven off with stones at the lake of the Chretes
    - crocodile-river: The river of crocodiles and hippopotami
    - cerne-return: Back to Cerne
    - aithiopes-coast: Twelve days along the coast of the Aithiopes
    - wooded-mountains: Fragrant mountains and fires by night
    - western-horn-landing: Drums in the night at the Horn of the West
    - burning-coast: The Chariot of the Gods
    - southern-horn-capture: The Horn of the South, and the turn for home
    - hanno-gorillai-conflict: The capture of the Gorillae
    - hanno-account-dedication: The account dedicated at Carthage
    - hanno-skins-temple: "Pliny: two skins in the temple of Juno until 146 BCE"
