# yaml-language-server: $schema=../schema/chapter.schema.json
title: Xerxes' invasion of Hellas
summary: After preparations begun about 483 BCE, Xerxes marched in the spring of 480 BCE from Sardis
  across the Hellespont into Europe, while his fleet kept pace along the coast. Follow the army and
  the fleet in parallel to Thermopylae and Artemisium, the burning of Athens and Salamis, and the
  next year's battles at Plataea and Mycale.
window: 483 BCE..479 BCE
story:
  summary: "Xerxes' invasion of Hellas, 480–479 BCE, as Herodotus tells it in books VII–IX: the
    preparations, the march of the land army and the voyage of the fleet side by side, the battles of
    480 BCE, the king's return, and the campaigns of 479 BCE that ended the invasion."
  span: 483 BCE..479 BCE
  coverage: "Episode window 483–479 BCE, from the start of the Athos canal to the Athenians' return
    from Sestos. Included: the muster and the heralds of 481 BCE, the Hellenic council, the canal and
    the bridges, each stage Herodotus describes on the march and on the voyage, the battles of 480 and
    479 BCE, Xerxes' return, Artabazos's sieges in Chalcidice, and the siege of Sestos. Excluded:
    Marathon and the earlier Persian expeditions, Gelon and the Sicilian embassies, the Carthaginian
    war at Himera, Herodotus's catalogue of the army's nations, and every event after the autumn of
    479 BCE. No route geometry is drawn: the campaign event carries the span and its stages are
    separate events at their places. Places carry the Pleiades representative point as an
    approximate point; Critalla is unlocated."
  notes: "Step order is presentation order, roughly chronological; the land army's and the fleet's
    steps interleave where Herodotus says they moved together. Herodotus gives no years, only the
    archonship of Calliades (VIII.51); every year and season here is George Grote's reckoning, cited
    as his interpretation, except the start of the Athos works, an editorial count back from his date
    for the march. The Gutenberg text of Macaulay's translation has one numeral that differs
    from the Greek (VIII.115), recorded in the event's notes. This chapter is a draft for testing data
    and engine work, and has not been reviewed for publication."
