# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  Leaving 陳 for home, Confucius passes 蒲 as 公叔氏 holds it in revolt. The disciple 公良孺 fights so hard that
  the people of 蒲 let Confucius go on an oath not to go to 衛. He goes straight to 衛, saying that a forced
  oath binds no one.
types: [occurrence]
date:
  value: 494 BCE..493 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: (after three years in 陳, before 靈公's death)
  cite:
    - id: pu-covenant-date
      says: >-
        The 孔子世家 tells 蒲 after the three years in 陳, which began in 496 BCE in the table, and before the
        death of 衛靈公 in 493 BCE.
      sources:
        - source: shiji-chunqiu
          at: 卷四十七 孔子世家（孔子居陳三歲）
          quote: 孔子居陳三歲
        - source: shiji-chunqiu
          at: 卷十四 十二諸侯年表 衛 出公 元年
          quote: 衛出公輒元年
places:
  - place: pu-wey
    role: site
participants:
  - actor: kongzi
    role: leader
notes: The table's 衛 column enters 出公's first year in 492 BCE, so 靈公 died in 493 BCE.
cite:
  - id: pu-covenant-basis
    says: >-
      The 孔子世家 records 蒲 in revolt stopping Confucius and releasing him on an oath not to go to 衛.
    source: shiji-chunqiu
    at: 卷四十七 孔子世家（會公叔氏以蒲畔）
    quote: 過蒲，會公叔氏以蒲畔，蒲人止孔子。
  - id: pu-covenant-oath
    says: The 孔子世家 records that he went to 衛 anyway and called the oath forced.
    role: supporting
    source: shiji-chunqiu
    at: 卷四十七 孔子世家（要盟也，神不聽）
    quote: 孔子遂適衞。子貢曰：「盟可負耶？」孔子曰：「要盟也，神不聽。」
