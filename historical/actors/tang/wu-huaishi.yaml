# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  呉懷實, the Tang general named in 大伴古麻呂's report of the 天寶十二載 (753) New Year audience as the
  officer who moved the Silla envoy's seat after 古麻呂 objected to the seating order.
types: [person]
names:
  - form: 呉懷實
    lang: lzh
    script: Hani
    roman: Wu Huaishi
    scheme: pinyin
    cite:
      - id: huaishi-name
        says:
          古麻呂's report names 呉懷實 as the general who, seeing 古麻呂's displeasure, moved the Silla envoy and
          placed the Japanese envoy above him.
        source: shoku-nihongi
        at: 卷第十九 天平勝寶六年正月丙寅
roles:
  - role: soldier
    note: Recorded as 將軍 (general) only at this audience; nothing further is published.
    date:
      value: "753"
      calendar: chinese_lunisolar
      as_written: 大唐天寶十二載正月朔 時將軍呉懷實見知古麻呂不肯色
    cite:
      - id: huaishi-role
        says: The same report records his office as 將軍 (general) and his intervention at the audience.
        source: shoku-nihongi
        at: 卷第十九 天平勝寶六年正月丙寅
notes:
  He appears only inside 古麻呂's self-report, which is labelled as a self-report on the audience
  event. The record therefore asserts only what that report names.
