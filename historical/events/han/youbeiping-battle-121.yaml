dispute:
  status: disputed
  summary:
    "The histories differ on how 李廣's column ended. The 衛將軍驃騎列傳 has him surrounded for two days,
    losing more than half his men, until 張騫's arrival made the 匈奴 withdraw; the 漢書 annals record
    that he lost all four thousand men and came back alone, and say nothing of 張騫 relieving him. The
    chapter publishes the 史記's account and keeps the annals' as a conflicting claim."
cite:
  - id: youbeiping-battle-account
    says: The 衛將軍驃騎列傳 records 李廣 surrounded for two days, losing more than half his men, the 匈奴 withdrawing when the 博望侯 arrived, and the 博望侯 condemned for delay.
    source: shiji-han-frontiers
    at: 卷一百十一 衛將軍驃騎列傳（郎中令與戰二日）
    quote: 匈奴左賢王將數萬騎圍郎中令，郎中令與戰二日，死者過半，所殺亦過當。博望侯至，匈奴兵引去。博望侯坐行留，當斬，贖為庶人。
  - id: youbeiping-battle-annals
    says: The 漢書 annals record that 李廣 killed more than three thousand 匈奴 but lost his whole force of four thousand and escaped alone, and that 張騫 was condemned for coming late.
    role: conflicting
    source: hanshu
    at: 卷六 武帝紀 元狩二年
    quote: 廣殺匈奴三千餘人，盡亡其軍四千人，獨身脫還，及公孫敖、張騫皆後期，當斬，贖為庶人。
notes:
  The place of the two-day battle is not named and is not recorded; the event is placed only at the
  commandery the two columns left from.
