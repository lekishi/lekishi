    lang: grc
    script: Grek
    roman: Thebes
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: thebes-boeotia-greek-name
        says: Pleiades records the ancient Greek name Θῆβαι for this place.
        source: pleiades
        at: place 541138, name /places/541138/thebai, dump 2026-10-21
      - id: thebes-boeotia-name
        says: Herodotus records the Greeks resolving to march on Thebes after Plataea.
        source: herodotus
        at: IX.86
        quote:
          forthwith they determined in common council to march upon Thebes and to ask the Thebans to
          surrender those who had taken the side of the Medes
        role: supporting
