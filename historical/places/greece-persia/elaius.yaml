summary:
  Elaius at the tip of the Thracian Chersonese, with the shrine of Protesilaos. The triremes that
  served the Athos canal works were based there.
types: [settlement]
names:
  - form: Ἐλαιοῦς
    lang: grc
    script: Grek
    roman: Elaius
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: elaius-greek-name
        says: Pleiades records the ancient Greek name Ἐλαιοῦς for this place.
        source: pleiades
        at: place 501411, name /places/501411/elaious, dump 2026-10-21
      - id: elaius-name
        says: Herodotus names Elaius in the Chersonese as the base for the canal works.
        source: herodotus
        at: VII.22
        quote:
          for triremes lay at anchor at Elaius in the Chersonese, and with this for their starting point
          men of all nations belonging to the army worked at digging
        role: supporting
  - form: Elaius
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: elaius-name
