# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  焉支山, the mountain 霍去病 passed by more than a thousand 里 in the spring of 121 BCE. A modern range
  in 甘肅 carries the name, but the record carries no position.
types: [landform]
names:
  - form: 焉支山
    lang: lzh
    script: Hani
    roman: Yanzhi Shan
    scheme: pinyin
    cite:
      - id: yanzhi-shan-name
        says: The 匈奴列傳 records the 驃騎將軍 riding out of 隴西 and passing 焉支山 by more than a thousand 里.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（過焉支山千餘里）
        quote: 漢使驃騎將軍去病將萬騎出隴西，過焉支山千餘里，擊匈奴
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      The 匈奴列傳 places 焉支山 only by the distance 去病 rode past it from 隴西. A modern range in 甘肅
      carries the name, but Wikidata records no coordinate for it, so no position is asserted.
    cite:
      - id: yanzhi-shan-unplaced
        says: The 匈奴列傳 names 焉支山 as a mountain 去病 passed by more than a thousand 里 and states no site for it.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（過焉支山千餘里）
