services:
  postgres:
    command: exec make postgres
    port: 5432
    platforms: [linux]
  web:
    command: >-
      until pg_isready -h "$PWD/.dev/postgres/socket" -p 5432 -U postgres;
      do sleep 0.2; done;
      exec make dev
    port: 4000
    health: /
    portal:
      title: Lekishi
      description: Phoenix development server
    review: false
    agent: control
    platforms: [linux]
