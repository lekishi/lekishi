# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  After Byblos and Sidon submit, Tyre refuses Alexander entry; he builds a mole from the mainland
  to the island city and takes it by land and sea after a long siege.
types: [occurrence]
part_of: [alexander-campaigns-334]
date:
  value: 332 BCE
  mode: window
  calendar: julian
  as_written: Tyre captured in the month Hecatombaion, when Anicetus was archon at Athens
  cite:
    - id: tyre-siege-332-time
      says:
        Chinnock converts the month Hecatombaion in the archonship of Anicetus to the end of July and
        beginning of August 332 BCE.
      source: arrian-anabasis
      at: II.24, note 331
      quote: The end of July and beginning of August B.C. 332.
      basis: interpretation
      attributed_to: E. J. Chinnock
    - id: tyre-siege-332-text
      says: Arrian dates the capture by the Athenian month and archon.
      source: arrian-anabasis
      at: II.24
      quote: Thus then was Tyre captured in the month Hecatombaion, when Anicetus was archon at Athens.
      role: supporting
places:
  - place: tyre
    role: site
participants:
  - actor: alexander-the-great
    role: leader
notes:
  Byblos and Sidon are not separate places in this chapter; their submission is part of this event's
  summary.
cites:
  summary:
    - id: tyre-siege-332-sidon
      says: Arrian records Byblus and Sidon submitting.
      source: arrian-anabasis
      at: II.15
      quote:
        He set out from Marathus and took possession of Byblus on terms of capitulation, as he did
        also of Sidon
    - id: tyre-siege-332-island
      says: Arrian describes Tyre as an island city with high walls.
      source: arrian-anabasis
      at: II.18
      quote: for the city was an island and fortified all round with lofty walls.
      role: supporting
