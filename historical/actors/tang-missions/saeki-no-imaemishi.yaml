summary:
  佐伯宿祢今毛人, appointed ambassador in 775, who stopped at the 羅城門 in 777 pleading illness and never
  sailed.
types: [person]
names:
  - form: 佐伯宿祢今毛人
    lang: ja
    script: Hani
    roman: Saeki no Imaemishi
    scheme: hepburn
    cite:
      - id: saeki-no-imaemishi-name
        says: The chronicle names 佐伯宿祢今毛人 as 遣唐大使 on 寶龜六年六月辛巳.
        source: shoku-nihongi
        at: 卷第卅三 寶龜六年六月辛巳
        quote: 以正四位下佐伯宿祢今毛人爲遣唐大使
roles:
  - role: envoy
    note: 大使, appointed 775; did not sail.
