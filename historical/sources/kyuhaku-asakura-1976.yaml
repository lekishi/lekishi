notes:
  The report of the third excavation season (December 1975) at the traditional site of 朝倉橘廣庭宮
  at 大字須川, then in 朝倉郡朝倉町. It concludes that after three seasons no palace remains exist in the
  traditional site at 須川, that the authors are nevertheless confident the palace lay within 朝倉郡,
  and that no evidence yet allows a closer location. It is a modern archaeological finding, not a
  source statement of the seventh century. Locators are the report's page numbers.
