# yaml-language-server: $schema=../schema/chapter.schema.json
title: The early Americas, to 100 CE
summary: From footprints at White Sands, made from about 21051 BCE, to the first Long Count dates in
  the last century BCE. Follow the earthworks of the Mississippi valley, the first cities of the
  Andes, the Olmec and early Maya centers, and the start of writing and calendars, site by site.
window: 21051 BCE..100
story:
  summary: "The Americas before 100 CE, site by site: early human presence at White Sands and Monte
    Verde, early plants and dyes, the Archaic earthworks and shell works of North America, Caral and
    Real Alto, Poverty Point, the Olmec and early Maya monumental centers, Chavín de Huántar and Monte
    Albán, the first writing and Long Count dates, Adena and Hopewell, Nasca and Teotihuacan."
  span: 21051 BCE..550
  coverage: "Sites and periods in North, Central and South America whose dated evidence begins before
    100 CE, from the human footprints at White Sands (about 23,000–21,000 years ago) to the Long Count
    stelae of Chiapa de Corzo (36 BCE) and Tres Zapotes (32 BCE). Four spans, the Mirador basin, the Nasca
    geoglyphs, the Hopewell earthworks and Teotihuacan, run past 100 CE and are included because they begin before
    it. Every date rests on cited archaeology: radiocarbon and luminescence ages, stylistic dating, or
    an epigraphic reading of a Long Count. Each place is a site point or a label anchor from
    Wikidata; two places (the Xihuatoxtla shelter and Horr's Island) carry no position, and the Clovis
    event names no site. No journey, route, territory or extent is drawn. Not covered: La Venta, Izapa, Cuicuilco,
    Paracas, Moche, Tiwanaku, the wider Archaic of South America, and every site after 100 CE."
  notes: "Step order is chronological by the start of each event's span and is not a claim that one
    event led to another. The chapter is a test of spans measured in centuries and millennia and of
    site-only placement: many dates are converted from years before present, and the notation cannot
    yet mark a date as approximate or open-ended; each record's notes say how its date was converted.
    Three dates are disputed (Poverty Point, the Cascajal block, Serpent Mound) and one reading
    conflicts with a museum guide (Tres Zapotes Stela C). This is a draft for testing the data and
    the engine; no release decision has been taken for it."
  steps:
    - white-sands-footprints: Footprints at White Sands, about 23,000–21,000 years ago
    - monte-verde-early-horizons: The earliest horizons at Monte Verde, about 18,500–14,500 cal BP
    - monte-verde-ii-camp: The Monte Verde II camp, about 14,500 cal BP
    - clovis-complex-age: Clovis, about 13,050–12,750 cal BP
    - xihuatoxtla-maize: Maize at the Xihuatoxtla shelter by 8,700 cal BP
    - huaca-prieta-indigo: Indigo-dyed cotton at Huaca Prieta, about 6200–6000 cal BP
    - indian-knoll-shell-heap: The shell heap of Indian Knoll, 5600–4600 BP
    - watson-brake-mounds: The mounds of Watson Brake, 5400–5000 BP
    - real-alto-mounds: Real Alto, the oldest earthen mounds in South America, 5000–3400 BP
    - horrs-island-shell-ring: The shell ring of Horr's Island, 4800–4000 BP
    - caral-supe-city: Caral in the Supe Valley, 2627–1977 BCE
    - poverty-point-earthworks: The earthworks of Poverty Point, 3700–3100 BP — dates disputed
    - paso-de-la-amada-ballcourt: The ball court at Paso de la Amada, about 1650 BCE
    - san-lorenzo-plateau: San Lorenzo and its leveled plateau, 3450–2850 BP
    - poverty-point-mound-a: Mound A at Poverty Point, raised in under three months
    - chavin-de-huantar-center: Chavín de Huántar, about 1200–400 BCE
    - formal-ceremonial-complexes: Formal ceremonial complexes spread, 1050–400 BCE
    - cascajal-block: The Cascajal block, early first millennium BCE — date and authenticity disputed
    - aguada-fenix-plateau: The plateau of Aguada Fénix, 1000–800 BCE
    - el-mirador-basin-network: The Mirador basin and its causeways, about 1000 BCE–150 CE
    - nasca-geoglyphs: The Nasca lines and geoglyphs, 2450–1450 BP
    - monte-alban-founding: Monte Albán is founded, about 500 BCE
    - serpent-mound-building: Serpent Mound, around 320 BCE — age disputed
    - grave-creek-mound-building: Grave Creek Mound, 2250–2150 BP
    - san-bartolo-early-writing: Early Maya writing at San Bartolo, 300–200 BCE
    - san-bartolo-seven-deer: The day 7 Deer at San Bartolo, 300–200 BCE
    - chiapa-de-corzo-stela-2: Stela 2 at Chiapa de Corzo, 36 BCE
    - tres-zapotes-stela-c: Stela C at Tres Zapotes, 32 BCE — year disputed
    - teotihuacan-metropolis: Teotihuacan, 1–550 CE
    - hopewell-earthworks-building: The Hopewell earthworks, 1–400 CE
