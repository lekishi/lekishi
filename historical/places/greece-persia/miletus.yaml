    lang: grc
    script: Grek
    roman: Miletus
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: miletus-greek-name
        says: Pleiades records the ancient Greek name Μίλητος for this place.
        source: pleiades
        at: place 599799, name /places/599799/miletos, dump 2026-10-21
      - id: miletus-name
        says: Arrian records the Persian king's garrison in Miletus.
        source: arrian-anabasis
        at: I.18
        quote: for Hegesistratus, to whom the king Darius had entrusted the command of the garrison in Miletus
        role: supporting
