summary:
  Muza, the lawful market-town on the Arabian shore near the mouth of the Red Sea, crowded with
  Arab ship-owners trading to Africa and Barygaza.
types: [port]
names:
  - form: Muza
    lang: en
    script: Latn
    cite:
      - id: muza-name
