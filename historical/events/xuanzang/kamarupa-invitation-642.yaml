summary:
  鳩摩羅王 of 迦摩縷波 demands 玄奘 and threatens to trample 那爛陀 if 戒賢 refuses; 玄奘 goes and stays more than
  a month.
types: [journey]
date:
  value: 641..643
  mode: window
  calendar: chinese_lunisolar
  as_written: 法師辭師，與使俱去。至彼，王見甚喜
  cite:
