summary:
  "戒日王 calls the religious of the five Indias to 曲女城 to hear 玄奘's treatise: eighteen kings, three
  thousand monks and two thousand brahmins and others. For eighteen days no one rises to refute it, and
  the Mahāyāna monks name him 大乘天."
types: [council]
date:
  value: 641..643
  mode: window
  calendar: chinese_lunisolar
  as_written: 法師自冬初共王逆河而進，至臘月方到會場
  cite:
    - id: kanyakubja-assembly-642-time
      says:
        The biography records the journey to the assembly from the beginning of winter to the twelfth
        month, without a year.
      source: cien-zhuan
      at: 卷五（法師自冬初共王逆河而進）
      quote: 法師自冬初共王逆河而進，至臘月方到會場
