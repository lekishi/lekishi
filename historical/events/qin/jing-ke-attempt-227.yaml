# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 227 BCE 荊軻, received as Yan's envoy in the 咸陽宮 with the head of 樊於期 and a map of 督亢, drew a dagger from the unrolled map and tried to stab the king of Qin. The king escaped round a pillar, drew his sword and wounded him; 荊軻 was killed and dismembered, and the king sent 王翦 against Yan."
types: [mission, occurrence]
date:
  value: "227 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十年（使荊軻刺秦王）; 秦始皇二十年（燕太子使荊軻刺王）; 始皇帝二十年（荊軻至咸陽）"
  cite:
    - says: "The annals record the attempt, the king discovering it, and 荊軻 dismembered, in 二十年 (227 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十年（使荊軻刺秦王）"
      quote: "二十年，燕太子丹患秦兵至國，恐，使荊軻刺秦王。秦王覺之，體解軻以徇"
    - says: "The six-states table records the attempt under 秦始皇二十年."
      role: supporting
      source: shiji
      at: "卷十五 六國年表 秦始皇二十年（燕太子使荊軻刺王）"
      quote: "二十。燕太子使荊軻刺王，覺之。王翦將擊燕。"
    - says: "The comprehensive mirror records the audience and the attempt under 始皇帝二十年."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十年（荊軻至咸陽）"
      quote: "荊軻奉圖以進於王，圖窮而匕首見，因把王袖而揕之"
places:
  - place: xianyang
    role: site
    note: "The biography names the 咸陽宮; the anchor is the capital's, not the palace's."
participants:
  - actor: jing-ke
    role: leader
  - actor: qin-wuyang
    role: participant
  - actor: qin-king-zheng
    role: host
  - actor: yan-dan
    role: other
    note: "Sent him."
notes: "The biography of the assassins is the full account; the annals and the table record the attempt in a line. The hereditary house of Yan records the map as of 督亢 and the head as 樊於期's; the chapter does not place 督亢."
cite:
  - says: "The biography records the audience in the 咸陽宮."
    role: supporting
    source: shiji-six-states
    at: "卷八十六 刺客列傳（見燕使者咸陽宮）"
    quote: "秦王聞之，大喜，乃朝服，設九賓，見燕使者咸陽宮。"
  - says: "The hereditary house of Yan records the map of 督亢 and the attempt."
    role: supporting
    source: shiji-six-states
    at: "卷三十四 燕召公世家（使荊軻獻督亢地圖於秦）"
    quote: "太子丹陰養壯士二十人，使荊軻獻督亢地圖於秦，因襲刺秦王。秦王覺，殺軻，使將軍王翦撃燕。"
