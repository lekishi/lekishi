# yaml-language-server: $schema=../../schema/place.schema.json
summary: 筑紫, the northern 九州 region where missions put in on their way home and where the 大宰府 sat.
types: [region]
names:
  - form: 筑紫
    lang: ja
    script: Hani
    roman: Tsukushi
    scheme: hepburn
    cite:
      - id: tsukushi-name
        says: The chronicle records the 653 envoys putting in at 筑紫 on their return.
        source: nihon-shoki
        at: 卷第廿五 白雉五年七月丁酉
        quote: 西海使吉士長丹等，共百濟、新羅送使泊于筑紫。
at:
  - interpretation: approximate_point
    precision: region
    point: [130.489, 33.5961]
    notes:
      A region-level placement standing for 筑紫 in its narrower sense, the later provinces of 筑前 and
      筑後. The point is the coordinate Wikidata records for 筑前, the northern half, on whose coast the
      ships put in; it asserts no harbour, and 筑紫 in its wider sense of all 九州 is not placed.
    cite:
      - id: tsukushi-identification
        says:
          The reference work describes 筑紫 as the ancient name for all 九州 and, more narrowly, for
          northern 九州 centred on the later 筑前 and 筑後, the 筑紫國 the 律令 settlement divided into those
          two provinces. The point is 筑前's coordinate from Wikidata (CC0), placed to stand for that
          region.
        basis: interpretation
        attributed_to: 平凡社「改訂新版 世界大百科事典」「筑紫」 (倉住靖彦)
        sources:
          - source: sekai-daihyakka-tsukushi
            at: 筑紫
          - source: wikidata
            at: Q1047664 (P625), revision 2462678915
