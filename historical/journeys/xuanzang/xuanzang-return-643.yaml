cite:
  - id: xuanzang-return-sequence
    says: >-
      The biography narrates the return from 缽羅耶伽 by the northern road, over the 蔥嶺, by 于闐 and
      沙州 to the arrival at 長安, in this order.
    source: cien-zhuan
    at: 卷五（今者還須北路而去）— 卷六（貞觀十九年春正月景子）
