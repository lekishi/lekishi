cite:
  - id: ennin-pilgrimage-sequence
    says: >-
      The diary records each day's walk in 里 from the 赤山 cloister to 五臺山, counting 2,300 里 and 44
      days of travel, and from 五臺山 to 長安, naming the stops in this order.
    sources:
      - source: nitto-guho-junrei-gyoki
        at: 卷二 開成五年二月十九日 — 四月廿八日
        quote: 自去二月十九日。離赤山院。直至此間。行二千三百餘里。
