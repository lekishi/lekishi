# yaml-language-server: $schema=../schema/chapter.schema.json
title: The Amarna letters, about 1360–1332 BCE
summary: 'The clay-tablet archive of Amenhotep III and Akhenaten: great kings in Babylon, Mitanni,
  Assyria and Alashiya bargain for gold and princesses, and the vassals of Canaan and Syria accuse one
  another while Aziru of Amurru builds a realm and the Hittites close in. Most letters are undated; the
  atlas places them in a broad editorial window, 1410 BCE to 1330 BCE, until a cited chronology replaces
  it.'
window: 1410 BCE..1330 BCE
story:
  summary: 'The Amarna letters: the brotherhood of great kings, the quarrel over the golden statues, and
    the vassals of Canaan between Egypt and Hatti.'
  span: 1410 BCE..1888
  coverage: 'The letters as Niebuhr (1899, English 1903) summarises and quotes them, and the find of 1888.
    Excluded: the Hittite king''s letters, Arzawa, the letters from Gezer, Lachish, Hazor and the other
    vassal towns Niebuhr only lists, and the numbering of the modern editions (Knudtzon''s EA numbers).
    Hinnatuni is unlocated; Babylon, Assur and the Mitannian capital are left to other chapters.'
  notes: 'The letters are undated but for dockets; every BCE date is an editorial window over the reigns
    of Amenhotep III and Akhenaten in the competing chronologies. Step order is presentation order: the
    great kings first, then the vassals.'
