    lang: la
    script: Latn
    cite:
      - id: ceccano-name
        says: The life names the Ciccanense castellum as a fort of the church's tenants.
        source: liber-pontificalis
        at: Ciccanense castellum, quod colonorum sanctae Dei ecclesiae existebat
at:
  - interpretation: approximate_point
    precision: locality
    point: [13.3333, 41.5667]
