# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  Unable to sleep after the conquest, 武王 tells 周公 that 周 must settle near the seat of heaven, and
  describes the land from the 洛 to the 伊, the old home of 夏. He lays out a 周 residence at 雒邑 and
  leaves.
types: [founding]
date:
  value: 1046 BCE..1027 BCE
  mode: window
  calendar: regnal
  as_written: (after the conquest, in the same passage)
  cite:
    - id: luoyi-plan-date-1046
      says: >-
        The 夏商周斷代工程 dates the conquest to 1046 BCE by astronomical calculation; its 2022 report gives
        20 January 1046 BCE. This is the window's early end.
      basis: interpretation
      attributed_to: 夏商周斷代工程《夏商周斷代工程報告》(2022)
      source: chinadaily-muye-2023
      at: paragraphs 1–2
    - id: luoyi-plan-date-1027
      says: >-
        The Bamboo Annals count 257 years from 武王's conquest to 幽王. Counted back from 幽王's death in
        771 BCE, that puts the conquest in 1027 BCE, the window's late end.
      role: alternative
      source: guben-zhushu-jinian
      at: 幽王（自武王滅殷，以至幽王，凡二百五十七年）
      quote: 自武王滅殷，以至幽王，凡二百五十七年。
places:
  - place: luoyi
    role: site
participants:
  - actor: zhou-wu-wang
    role: leader
  - actor: zhou-gong-dan
    role: participant
dispute:
  status: disputed
  summary: >-
    The year depends on the disputed year of the conquest. The record keeps the 夏商周斷代工程's
    1046 BCE as the editorial anchor and the Bamboo Annals' count, which gives 1027 BCE, as an
    alternative, and decides nothing between them.
cite:
  - id: luoyi-planned-land
    says: The annals record 武王 describing the land from the 洛 to the 伊 as the old home of 夏.
    source: shiji-yin-zhou
    at: 卷四 周本紀 武王（自洛汭延于伊汭）
    quote: 自洛汭延于伊汭，居易毋固，其有夏之居。
  - id: luoyi-planned-layout
    says: The annals record that he laid out a 周 residence at 雒邑 and then left.
    role: supporting
    source: shiji-yin-zhou
    at: 卷四 周本紀 武王（營周居于雒邑而後去）
    quote: 營周居于雒邑而後去。
