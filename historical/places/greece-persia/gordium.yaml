      - id: gordium-name
        says: Arrian records Alexander at Gordium wanting to see the palace of Gordius and Midas.
        source: arrian-anabasis
        at: II.3
        quote:
          When Alexander arrived at Gordium, he was seized with an ardent desire to go up into the citadel,
          which contained the palace of Gordius and his son Midas.
