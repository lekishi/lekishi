# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  From Arbela Alexander marches straight to Babylon, which opens its gates, and then to Susa, which
  surrenders with its treasure.
types: [journey]
part_of: [alexander-campaigns-334]
date:
  value: 331 BCE..330 BCE
  mode: window
  calendar: julian
  as_written: he advanced straight towards Babylon
  cite:
    - id: babylon-susa-331-time
      says:
        Chinnock dates Gaugamela to September 331 BCE and Darius's death to Hecatombaion (July) 330
        BCE; this stage lies between.
      basis: interpretation
      attributed_to: E. J. Chinnock
      sources:
        - source: arrian-anabasis
          at: III.15, note 426
          quote: September 331 B.C.
        - source: arrian-anabasis
          at: III.22, note 467
          quote: In the year B.C. 330, the first of Hecatombaion fell on the first of July.
    - id: babylon-susa-331-text
      says: Arrian records the march from Arbela to Babylon.
      source: arrian-anabasis
      at: III.16
      quote: for when Alexander started from Arbela, he advanced straight towards Babylon
      role: supporting
places:
  - place: arbela
    role: start
  - place: babylon
    role: waypoint
  - place: susa
    role: end
participants:
  - actor: alexander-the-great
    role: leader
cites:
  places:
    - id: babylon-susa-331-susa
      says: Arrian records the march to Susa.
      source: arrian-anabasis
      at: III.16
      quote: He then marched away to Susa
