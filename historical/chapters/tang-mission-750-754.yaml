    - yaku-arrival-753: The second ship reaches 益救島 (biography)
    - kibi-yaku-arrival-753: 吉備真備's ship reaches 益久嶋 (chronicle); the sources are not merged
    - yaku-departure-753: The second ship leaves 益救島
