notes: Early twentieth-century scholarship. Schoff identifies the voyage's places mostly after Karl
  Müller (Geographi Graeci Minores, 1855) and puts the voyage at about 470 BCE. Every
  identification and date taken from it is published as Schoff's interpretation, and the records
  keep the identifications later gazetteers prefer beside it.
