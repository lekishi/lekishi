summary:
  圓仁's return from 長安 to Japan. Expelled as a laicized foreign monk in 845, he is passed east and
  north to 登州, waits at 赤山, and sails on 金珍's ship in 847 to the 鴻臚館. The relationship
  records documented movement only and draws no route.
types: [travel]
from: ennin
to: korokan
