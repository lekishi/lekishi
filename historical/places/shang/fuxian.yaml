# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  傅險, where the annals say 武丁's searchers found the convict labourer 說 building walls. The annals
  give no position and the record asserts none.
types: [other]
names:
  - form: 傅險
    lang: lzh
    script: Hani
    roman: Fuxian
    scheme: pinyin
    cite:
      - id: fuxian-name
        says: The annals record that 說 was found at 傅險, labouring there as a convict.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝武丁（得說於傅險中）
        quote: 於是迺使百工營求之野，得說於傅險中。是時說為胥靡，筑於傅險。
at:
  - interpretation: unknown
    precision: unspecified
    notes: No position is stated in the cited entry, and no identification is adopted.
    cite:
      - id: fuxian-unknown
        says: The annals name 傅險 and state no position for it.
        source: shiji-yin-zhou
        at: 卷三 殷本紀 帝武丁（得說於傅險中）
notes: >-
  The place type is other because the annals do not say what 傅險 was (a settlement, a pass or a
  building site); the record keeps the name only.
