# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Charibael, lawful king of the Homerites and the Sabaites at Saphar, a friend of the emperors
  through continual embassies and gifts, who destroyed Eudaemon Arabia not long before the Periplus.
types: [person]
names:
  - form: Charibael
    lang: en
    script: Latn
    cite:
      - id: charibael-name
        says:
          The Periplus says Charibael, lawful king of two tribes, lives at Saphar and is a friend of the
          emperors.
        source: periplus-erythraean-sea
        at: "23"
        quote:
          in which lives Charibael, lawful king of two tribes, the Homerites and those living next to
          them, called the Sabaites; through continual embassies and gifts, he is a friend of the Emperors
roles:
  - role: ruler
    cite:
      - id: charibael-role
        says:
          The Periplus says Charibael, lawful king of two tribes, lives at Saphar and is a friend of the
          emperors.
        source: periplus-erythraean-sea
        at: "23"
        quote:
          in which lives Charibael, lawful king of two tribes, the Homerites and those living next to
          them, called the Sabaites; through continual embassies and gifts, he is a friend of the Emperors
notes:
  Schoff, after Glaser, identifies him with a king Kariba-il whose reign ran from about 40 to 70
  CE.
