  notes: "The inscriptions are ancient. The translation was published in 1924 and Luckenbill died in
    1927, so it is public domain in the United States and worldwide. ISAC labels its scan CC
    BY-NC-ND 4.0; that label covers the scan, so the records quote the 1924 work and never
    redistribute the scan. Quotations follow the printed translation and drop its footnote
    numbers. Re-check them against the printed edition before release."
notes: "Luckenbill's edition of Sennacherib's annals, centred on the Oriental Institute prism, a
  duplicate of the Taylor prism. The prism narrates the third campaign (col. II 37 to col. III 49)
  in the king's own voice. It gives no year, and Luckenbill's introduction dates the campaign to
  701 BCE; that date is cited as his interpretation. The volume also prints the epigraph over the
  Lachish relief (p. 156). It is a royal account: it records what Sennacherib claimed, not a
  neutral report."
