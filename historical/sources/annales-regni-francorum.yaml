notes:
  Year-by-year annals compiled at the court from the late 780s, so the entries for 753–756 are a
  retrospective account a generation later. They put Stephen's coming in 753, the anointing in 754,
  and Pepin's first Italian campaign and Stephen's return to Rome in 755, a year later than the
  order of the papal life suggests.
