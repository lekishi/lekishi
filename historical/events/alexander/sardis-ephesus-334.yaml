# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Sardis surrenders to Alexander without a fight; four days later he enters Ephesus, recalls its
  exiles, and restores the democracy.
types: [journey]
part_of: [alexander-campaigns-334]
date:
  value: 334 BCE..333 BCE
  mode: window
  calendar: julian
  as_written: On the fourth day Alexander arrived at Ephesus
  cite:
    - id: sardis-ephesus-334-time
      says:
        Chinnock dates the crossing to the spring of 334 BCE and the battle of Issus to the end of October
        or beginning of November 333 BCE; this stage lies between.
      basis: conventional
      convention: Arrian's campaign seasons on the standard chronology of Alexander's reign
      sources:
        - source: arrian-anabasis
          at: I.17
        - source: arrian-anabasis
          at: I.11
          quote: (B.C. 334.) At the beginning of the spring he marched towards the Hellespont
        - source: arrian-anabasis
          at: II.11, note 266
          quote: B.C. 333; end of October or beginning of November.
    - id: sardis-ephesus-334-text
      says: Arrian records the arrival at Ephesus.
      source: arrian-anabasis
      at: I.17
      quote: On the fourth day Alexander arrived at Ephesus
      role: supporting
places:
  - place: sardis
    role: start
  - place: ephesus
    role: end
participants:
  - actor: alexander-the-great
    role: leader
cites:
  places:
    - id: sardis-ephesus-334-sardis
      says: Arrian records the commandant and leading citizens of Sardis coming out to meet Alexander.
      source: arrian-anabasis
      at: I.17
      quote:
        and when he was about 70 stades distant from that city, he was met by Mithrines, the commandant
        of the garrison in the Acropolis, accompanied by the most influential of the citizens of Sardis.
