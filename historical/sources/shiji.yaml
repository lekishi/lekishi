notes:
  The Han-era history. The fixture uses the 秦始皇本紀 annals and the 六國年表 alignment for the
  absolute years, the 韓世家 for Han's own account, and the 老子韓非列傳 biography for the disputed death.
  The hereditary house's transcription reads 潁州郡 where the annals read 潁川, and dates the embassy to
  王安五年 where the table aligns the year with 王安六年; both variants are recorded rather than resolved.
