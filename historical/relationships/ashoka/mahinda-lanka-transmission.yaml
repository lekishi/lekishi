# yaml-language-server: $schema=../../schema/relationship.schema.json
summary: >-
  The transmission of the Buddhist Order to Lanka in the Ceylon chronicles: Mahinda's mission, the conversion
  of Devānaṃpiya Tissa, the bodhi branch and Saṅghamittā's ordination of the first nuns.
types: [transmission]
from: mahinda
to: place:lanka
notes: >-
  From the chronicles of the Mahāvihāra, which Smith relates as legend; no inscription of Aśoka mentions
  the Lanka mission.
cite:
  - id: lanka-transmission-basis
    says: >-
      Smith's retelling says the first discourse of the mission's leader converted the king and forty thousand
      followers.
    source: smith-asoka-1920
    at: ch. VI, The Ceylonese Legend of Asoka
    quote: >-
      The first discourse pronounced by the leader of the mission converted the king, with forty thousand
      of his followers.
