# yaml-language-server: $schema=../../schema/event.schema.json
summary: "A day's sail beyond the marsh the fleet settles five cities by the sea: Karikon teichos, Gytte, Akra, Melitta and Arambys."
types: [founding]
part_of: [hanno-voyage]
date:
  value: 570 BCE..470 BCE
  mode: window
  calendar: julian
  as_written: "ὅσον ἡμέρας πλοῦν (about a day's sail)"
  cite:
    - id: five-cities-founding-time
      says: "The account dates none of its stages; this one belongs to the undated voyage, whose window the cited commentators set between about 570 and 470 BCE."
      basis: interpretation
      attributed_to: W. H. Schoff (1913); J. Bostock and H. T. Riley (1855)
      sources:
        - source: hanno-periplus
          at: "5"
        - source: schoff-hanno
          at: Carthaginian Chronology
places:
  - place: karikon-teichos
    role: site
  - place: gytte
    role: site
  - place: akra
    role: site
  - place: melitta
    role: site
  - place: arambys
    role: site
participants:
  - actor: hanno
    role: leader
notes: "None of the five is located; the event has five sites and none of them is drawn."
cite:
  - id: five-cities-account
    says: "The account says the fleet passed the lake by about a day's sail and settled cities by the sea called Karikon teichos, Gytte, Akra, Melitta and Arambys."
    source: hanno-periplus
    at: "5"
    quote: "κατῳκίσαμεν πόλεις πρὸς τῇ θαλάττῃ καλουμένας Καρικόν τε τείχος καὶ Γύττην καὶ Ἄκραν καὶ Μέλιτταν καὶ Ἄραμβυν."
