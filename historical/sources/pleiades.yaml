notes:
  A scholarly gazetteer of ancient places. Its representative point and location precision are the
  gazetteer's identification of where a named ancient place was, so a coordinate taken from it is
  published as an interpretation attributed to Pleiades, never as a statement of the ancient text.
  A citation pins the dated dump, because places are edited daily and the dump is the reproducible
  read.
