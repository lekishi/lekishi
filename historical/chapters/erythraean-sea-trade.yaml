title: The Erythraean Sea trade, Rome to India
summary: "Between 41 and 77 CE, a Greek merchant of Roman Egypt wrote a handbook to every port from the Red Sea to southern India: who ruled each one, what it bought and sold, and when to sail. Pliny, writing at the same time, gives the route from Alexandria to Muziris in days. Follow the ports, the goods and the Hippalus wind, and the embassy that came from Taprobane to Claudius."
