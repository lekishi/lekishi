summary:
  玄奘 goes with 戒日王 to the field of giving at 缽羅耶伽 for the sixth great distribution, held every
  five years over seventy-five days, at which the king gives away all his treasure.
types: [exchange, council]
date:
  value: 641..643
  mode: window
  calendar: chinese_lunisolar
  as_written: 至二十一日，發引向缽羅耶伽國就大施場
  cite:
    - id: prayaga-distribution-643-time
      says:
        The biography records the start for 缽羅耶伽 on the twenty-first day after the assembly, without
        a year.
      source: cien-zhuan
      at: 卷五（至二十一日，發引向缽羅耶伽國就大）
      quote: 至二十一日，發引向缽羅耶伽國就大施場
places:
  - place: prayaga
    role: site
participants:
