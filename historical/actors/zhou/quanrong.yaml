# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  犬戎, the western people who, with 申 and 繒, attacked 幽王 and killed him at the foot of 驪山 in 771 BCE,
  and whose raids drove the 周 court east.
types: [community]
names:
  - form: 犬戎
    lang: lzh
    script: Hani
    roman: Quanrong
    scheme: pinyin
    cite:
      - id: quanrong-name
        says: The 秦 annals record that the western 戎 and the 犬戎 attacked 周 with 申侯 and killed 幽王 at the foot of 驪山.
        source: shiji-chunqiu
        at: 卷五 秦本紀 襄公 七年（西戎犬戎與申侯伐周）
        quote: 西戎犬戎與申侯伐周，殺幽王酈山下。
notes: >-
  Typed community because the sources name a people, not a state with a ruler or a seat.
