# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Yeraza, the place from which the revolt reached "to the marshes of the earth", in the annals'
  description of the rising before the first campaign.
types: [region]
names:
  - form: Yeraza
    lang: egy
    script: Latn
    cite:
      - id: yeraza-name
        says: The annals name Yeraza as one end of the region in revolt.
        source: breasted-ancient-records
        at: "II, Annals of Thutmose III, first campaign: the revolt (Yeraza)"
        quote:
          Now, it happened that the tribes - the people, who were there in the city of Sharuhen; behold,
          from Yeraza to the marshes of the earth, they had begun to revolt against his majesty.
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      The annals use the name only to bound the region in revolt, and no gazetteer read for this chapter
      locates it, so the record asserts no coordinate.
    cite:
      - id: yeraza-unlocated
        says: The annals give Yeraza only as a limit of the revolt.
        source: breasted-ancient-records
        at: "II, Annals of Thutmose III, first campaign: the revolt (Yeraza)"
