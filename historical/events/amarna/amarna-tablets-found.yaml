# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Villagers digging for marl near the ruins of Akhetaten find wooden chests of clay tablets. Some
  are broken up for sale; about eighty go to the British Museum, sixty stay at Boulaq and about 180 go
  to Berlin.
types: [other]
date:
  value: "1888"
  calendar: gregorian
  as_written: In the beginning of 1888
  cite:
    - id: tablets-found-date
      says: Niebuhr dates the find to the beginning of 1888.
      source: niebuhr-tell-el-amarna-period
      at: "ch. I: the find"
      quote:
        In the beginning of 1888 some fellahìn digging for marl not far from the ruins came upon a
        number of crumbling wooden chests, filled with clay tablets closely covered on both sides with writing.
places:
  - place: akhetaten
    role: site
cite:
  - id: tablets-found-basis
    says: Niebuhr tells of the fellahin finding the chests of tablets.
    source: niebuhr-tell-el-amarna-period
    at: "ch. I: the find"
    quote:
      In the beginning of 1888 some fellahìn digging for marl not far from the ruins came upon a number
      of crumbling wooden chests, filled with clay tablets closely covered on both sides with writing.
  - id: tablets-dispersal
    says: Niebuhr gives how the tablets were divided between London, Boulaq and Berlin.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. I: the dispersal"
    quote:
      about eighty of the best preserved of the Tell el Amarna tablets at once found their way to the
      British Museum. Some sixty were left in the museum at Boulak, and about one hundred and eighty were
      secured for the Berlin Museum
notes:
  A modern event, kept because it is how the correspondence became known. Later accounts often put
  the find in late 1887; the record keeps Niebuhr's date.
