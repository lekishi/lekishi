# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The alliance of Greek states that swore to resist Xerxes, met at the Isthmus in 481–480 BCE,
  and fought under Spartan command on land and sea.
types: [institution]
names:
  - form: those Hellenes who had the better mind about Hellas
    lang: en
    script: Latn
    note: Herodotus gives the alliance no name; the form is his description of its members.
    cite:
      - id: hellenic-alliance-name
        says: Herodotus records the Hellenes who resisted coming together and exchanging assurances.
        source: herodotus
        at: VII.145
        quote:
          when those Hellenes who had the better mind about Hellas came together to one place, and considered
          their affairs and interchanged assurances with one another
notes:
  The alliance is recorded as an institution because Herodotus describes it acting in common council;
  modern names for it (the Hellenic League) are not the source's.
