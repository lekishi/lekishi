# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "高仙芝 feigns a peace with 石國, then attacks it, carries off its king and people and kills the old
  and weak, taking a great haul of 瑟瑟, gold, horses and goods for himself. The mirror enters the raid
  under the twelfth month of 天寶九載 (750); 李嗣業's biography in 舊唐書 puts the campaign in 十載.
  Ibn al-Athīr tells a different story under the year 133: the Ikhshīd of Farghāna, quarrelling with
  the king of al-Shāsh, asked the king of China for help; a Chinese army besieged al-Shāsh, and its
  king surrendered to the king of China, who did him no harm."
types: [campaign]
date:
  value: 750-12
  calendar: chinese_lunisolar
  as_written: 天寶九載十二月（資治通鑑）; 九載（舊唐書 高仙芝傳、新唐書 高仙芝傳）; 十載（舊唐書 李嗣業傳）
  cite:
    - id: chach-raid-time
      says: The mirror enters 高仙芝's feigned peace and raid on 石國 among the notices of the twelfth month of 天寶九載.
      source: zizhi-tongjian
      at: 卷二一六 唐紀三十二 天寶九載十二月（安西四鎭節度使髙仙芝偽與石國約和）
      quote: 安西四鎭節度使髙仙芝偽與石國約和，引兵襲之，虜其王及部衆以歸，悉殺其老弱。
    - id: chach-raid-jiu
      says: 高仙芝's biography in 舊唐書 records the campaign against 石國 and the capture of its king in 九載.
      role: supporting
      source: jiu-tangshu
      at: 卷一〇四 高仙芝傳（九載，將兵討石國）
      quote: 九載，將兵討石國，平之，獲其國王以歸。
    - id: chach-raid-li-siye
      says: 李嗣業's biography in 舊唐書 puts his part in the conquest of 石國 in 十載.
      role: conflicting
      source: jiu-tangshu
      at: 卷一〇九 李嗣業傳（十載，又從平石國）
      quote: 十載，又從平石國，及破九國胡並背叛突騎施
