# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  唐招提寺, the Nara temple whose name the biography records being established on 寶字三年八月一日 (759),
  and which the chronicle's 763 notice calls the precept cloister made from 新田部親王's former
  residence.
types: [religious_site]
names:
  - form: 唐招提寺
    lang: ja
    script: Hani
    roman: Tōshōdai-ji
    scheme: hepburn
    cite:
      - id: toshodaiji-name
        says: The biography records the temple name being established on 寶字三年八月一日.
        source: toseiden
        at: 寶字三年八月一日，私立唐律招提名
at:
  - interpretation: approximate_point
    precision: locality
    point: [135.7848, 34.6756]
    notes:
      An approximate placement at 唐招提寺 in Nara, which still stands on the former residence of
      新田部親王 granted to 鑒眞 and keeps its Nara-period halls. The point marks the temple, not a
      building of 759.
    cite:
      - id: toshodaiji-identification
        says:
          唐招提寺 at 奈良市五条町 is the temple 鑒眞 opened in 759 on 新田部親王's former residence, and
          its Nara-period 金堂 and 講堂 still stand. The point is the temple's modern coordinate from
          Wikidata (CC0).
        basis: interpretation
        attributed_to: 唐招提寺
        sources:
          - source: toshodaiji-about
            at: 唐招提寺とは
          - source: wikidata
            at: Q973175 (P625), revision 2542534325
external_ids:
  - system: wikidata
    id: Q973175
    url: https://www.wikidata.org/wiki/Q973175
    license: CC0-1.0
    note: External identifier found in the Wave 1A feasibility pass.
notes: "Coda place: the founding is outside the primary 750–754 window and is separately sourced; it
  is recorded as an institutional coda node, not as a mission effect."
