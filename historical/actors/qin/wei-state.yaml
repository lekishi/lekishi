# yaml-language-server: $schema=../../schema/actor.schema.json
summary: "魏, one of the six states Qin conquered. The annals record 王賁 flooding its capital 大梁 in 225 BCE and taking all its land."
types: [state]
names:
  - form: "魏"
    lang: lzh
    script: Hani
    roman: Wei
    scheme: pinyin
    cite:
      - says: "The annals record 王賁 attacking 魏 in 二十二年 (225 BCE) and taking all its land."
        source: shiji
        at: "卷六 秦始皇本紀 二十二年（王賁攻魏）"
        quote: "王賁攻魏，引河溝灌大梁，大梁城壞，其王請降，盡取其地。"
notes: "魏 (Wei), not 衛 (Wey): the two states share a romanization, and 衛 is a separate actor. The state actor carries no roles."
