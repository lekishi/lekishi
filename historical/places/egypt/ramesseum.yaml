        says:
          Pleiades identifies the Ramesseum, the funerary temple of Ramesses II, and gives this representative
          point (CC BY 3.0).
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 963047542 (reprLatLong, version 11), dump 2026-10-21
