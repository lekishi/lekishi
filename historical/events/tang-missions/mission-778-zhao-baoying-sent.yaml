# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The emperor sends the eunuch 趙寳英 with return gifts to Japan. The envoys warn that the sea is
  dangerous; the emperor answers that duty requires it. They take their leave, and students go with them
  from the capital.
types: [mission]
date:
  value: 778-04-24
  calendar: chinese_lunisolar
  as_written: 廿四日。事畢拜辞。
  cite:
    - id: mission-778-leave-time
      says: 滋野 dates the leave-taking to the 24th of the fourth month; 繼人 gives the 22nd.
      source: shoku-nihongi
      at: 卷第卅五 寶龜九年十月乙未 小野滋野奏
      quote: 廿四日。事畢拜辞。奏云。本國行路遥遠。風漂无准。今中使云往。冐渉波涛。万一顛躓。恐乖王命。
places:
  - place: changan
    role: start
participants:
  - actor: zhao-baoying
    role: leader
  - actor: ono-no-iwane
    role: leader
cites:
  summary:
    - id: mission-778-zhao-sent
      says:
        繼人's report records 趙寳英 and four judges sent with Japan's envoys to bind good relations, and
        the students leaving the capital with them.
      role: supporting
      source: shoku-nihongi
      at: 卷第卅五 寶龜九年十一月乙夘 大伴繼人奏
      quote: 便領留學生起京。又差内使掖庭令趙寳英。判官四人。賚國土寳貨。隨使來朝。以結隣好。
