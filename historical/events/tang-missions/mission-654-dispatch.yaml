# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  A second embassy under the 押使 高向玄理, with the ambassador 河邊臣麻呂 and the vice-envoy 惠日, leaves in
  two ships. It takes the Silla route and lands at 萊州.
types: [mission]
date:
  value: 654-02
  calendar: regnal
  as_written: 白雉五年二月
  cite:
    - id: mission-654-dispatch-time
      says:
        The chronicle dates the embassy to the second month of 白雉五年; a variant (或本) gives the fifth
        month.
      source: nihon-shoki
      at: 卷第廿五 白雉五年二月
      quote: 二月，遣大唐押使大錦上高向史玄理，
places:
  - place: naniwa
    role: site
    note:
      The entry names no place of dispatch; the court of this reign sits at 難波, and the anchor is for
      display only.
participants:
  - actor: takamuko-no-kuromaro
    role: leader
    note: 押使.
  - actor: kusushi-no-enichi
    role: participant
    note: 副使, on his second mission.
  - actor: japan-state
    role: host
notes: The chronicle's variant reading (或本云，夏五月) is kept in the cite, not merged.
cites:
  participants:
    - id: mission-654-envoys
      says: The entry names 高向史玄理 as 押使, 河邊臣麻呂 as 大使 and 藥師惠日 as 副使.
      source: nihon-shoki
      at: 卷第廿五 白雉五年二月
      quote: 大使小錦下河邊臣麻呂，副使大山下藥師惠日，
