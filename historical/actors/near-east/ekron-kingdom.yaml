summary:
  Ekron, the Philistine city-kingdom whose officials, nobles and people deposed Padi, called on
  the Egyptian kings for aid, and were punished by Sennacherib in 701 BCE.
types: [state]
names:
  - form: Ekron
    lang: en
    script: Latn
    cite:
      - id: ekron-kingdom-name
        says: The prism names the officials, nobles and people of Ekron.
        source: luckenbill-annals-sennacherib
        at: p. 31, Oriental Institute prism col. II 73
        quote: The officials, nobles and people of Ekron,
notes: The city is the place record ekron; this record is its polity, which acts in the prism.
