# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  桓公, lord of 齊 and first leader of the 春秋 lords, who gave 重耳 a wife of his house and twenty teams of
  horses, and died in 643 BCE.
types: [person]
names:
  - form: 齊桓公
    lang: lzh
    script: Hani
    roman: Qi Huan Gong
    scheme: pinyin
    cite:
      - id: qi-huan-gong-name
        says: The 左傳 records that 齊桓公 gave 重耳 a wife and twenty teams of horses.
        source: zuozhuan
        at: 僖公二十三年（齊桓公妻之）
        quote: 及齊，齊桓公妻之，有馬二十乘。
roles:
  - role: ruler
    note: Lord of 齊 until 643 BCE.
    cite:
      - id: qi-huan-gong-role
        says: The 左傳 records that 齊桓公 gave 重耳 a wife and twenty teams of horses.
        source: zuozhuan
        at: 僖公二十三年（齊桓公妻之）
