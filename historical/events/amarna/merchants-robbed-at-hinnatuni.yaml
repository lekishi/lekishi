# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  A Babylonian trading company in the Canaanite city of Hinnatuni is attacked and plundered after
  the ambassador leaves; Burnaburiash II tells Akhenaten "Canaan is thy land" and demands the gold back
  and the murderers slain.
types: [occurrence]
date:
  value: 1380 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis IV
places:
  - place: hinnatuni
    role: site
participants:
  - actor: burnaburiash-ii
    role: participant
  - actor: kassite-babylonia
    role: subject
  - actor: akhenaten
    role: participant
cite:
  - id: hinnatuni-basis
    says: Niebuhr says Burnaburiash complained the company at Khinaton was attacked and plundered.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: the merchants of Burnaburiash"
    quote:
      King Burnaburiash complained that a Babylonian trading company established by his ambassador
      in the Canaanite city of Khinaton had, immediately after the ambassador's departure, been attacked
      and utterly plundered.
  - id: hinnatuni-canaan
    says: Burnaburiash writes that Canaan is the Egyptian king's land.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: the merchants of Burnaburiash (the demand)"
    quote:
      '"Canaan is thy land; thou art king of it," continues Burnaburiash. "It was in thy land that
      I suffered this injury; therefore restrain the doers of it.'
notes:
  "The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
