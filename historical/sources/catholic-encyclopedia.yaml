notes:
  A reference work of 1907–1912, cited as the scholarship of its day, never as current consensus.
  Each entry's datings are cited as its signing author's interpretation. Entries in use are
  "Hammurabi" by Charles L. Souvay (vol. 7, 1910), which lists the datings of Hammurabi's reign and
  identifies him with the Amraphel of Genesis 14; "St. Paul" by F. Prat (vol. 11, 1911), whose
  chronology of Paul's life comes from Acts, the letters and a few synchronisms with Roman history;
  and "Jerusalem (Before A.D. 71)" by B. Meistermann and "Flavius Josephus" by K. Hoeber (vol. 8,
  1910), for the years of the Jewish–Roman war.
