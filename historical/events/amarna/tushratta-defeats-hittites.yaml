# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Early in his reign, by his own letter, Tushratta avenges his murdered brother and destroys a
  Hittite army that invaded Mitanni, sending Amenhotep III a chariot, two horses, a youth and a maiden
  from the booty.
types: [campaign]
date:
  value: 1410 BCE..1350 BCE
  mode: window
  calendar: regnal
  as_written: the reign of Amenophis III
participants:
  - actor: tushratta
    role: leader
  - actor: mitanni
    role: participant
  - actor: hatti
    role: participant
cite:
  - id: tushratta-hittites
    says: Tushratta writes that Teshup delivered the Hittite army into his hand and sends booty.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Tushratta's first letter"
  - id: tushratta-accession
    says: Tushratta writes that he came to the throne young, after Pirhi had slain its lord.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Tushratta's first letter (the accession)"
notes:
  "A king's own claim in a letter meant to win favour. The letters are undated but for a few dockets,
  and the reigns they fall in convert to BCE according to the chronology used: Amenhotep III's accession
  is put between about 1410 and 1388 BCE, and the end of Akhenaten's reign between about 1362 and 1334
  BCE. The window spans those placements for the reign in question; Niebuhr's 1903 dates (the archive
  about 1400 B.C., Akhetaten built about 1380 B.C.) fall inside it. It is an editorial bound that a cited
  chronology must replace before approval."
