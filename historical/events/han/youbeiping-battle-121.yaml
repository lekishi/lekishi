summary:
  In the summer of 121 BCE 李廣 and 張騫 rode out of 右北平 by separate roads. In the 史記's account
  李廣, ahead with four thousand horse, was surrounded by the 左賢王's tens of thousands and fought for
  two days, losing more than half his men, until 張騫 arrived with ten thousand and the 匈奴 withdrew;
  the 漢書 annals instead record that 李廣 lost his whole force of four thousand and escaped alone. Both
  record 張騫 condemned for coming late and buying his life by becoming a commoner.
types: [campaign]
date:
  value: 121 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: 元狩二年（匈奴入鴈門…遣衛尉張騫、郎中令李廣皆出右北平）
  cite:
    - id: youbeiping-battle-time
      says: The 漢書 annals record 張騫 and 李廣 going out of 右北平 in 元狩二年.
      source: hanshu
      at: 卷六 武帝紀 元狩二年
      quote: 遣衛尉張騫、郎中令李廣皆出右北平。
