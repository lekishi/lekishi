    note: In Ibn al-Athīr only, the party that called in the Chinese army against al-Shāsh.
    cite:
      - id: chach-raid-ibn-al-athir
        says:
          Ibn al-Athīr says the Ikhshīd of Farghāna and the king of al-Shāsh quarrelled, the Ikhshīd
          asked the king of China for help and was sent a hundred thousand fighters, who besieged the
          king of al-Shāsh; he surrendered to the king of China's judgement, and the king of China did
          not harm him or his people.
        role: conflicting
        source: ibn-al-athir-kamil
        at: vol. 5, p. 344, year 133 (the Ikhshīd of Farghāna and the king of al-Shāsh)
notes:
  "The mirror's month is the month heading the notice stands under. Three of the four accounts give
  天寶九載; 李嗣業's biography gives 十載, perhaps counting to the presentation of the captives early in
  十載. The chapter publishes the mirror's month and keeps the biography's year as conflicting.
  Ibn al-Athīr's year 133 (August 750 to July 751) contains the mirror's month, but his account
  conflicts with the Tang one on what happened: a siege at 拔汗那's request in which the king was
  spared, against a feigned peace and a raid in which the king was carried off (and, in the mirror,
  later executed). The chapter keeps both and decides neither."
dispute:
  status: disputed
  summary:
    The mirror and both 高仙芝 biographies give 天寶九載; 李嗣業's biography in 舊唐書 gives 十載. The
    chapter publishes 天寶九載十二月 and keeps 十載 as a conflicting claim. Ibn al-Athīr tells the
    episode as a siege at the request of the Ikhshīd of Farghāna, after which the king of al-Shāsh
    surrendered and was spared.
