# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  趙信, a former 匈奴 lesser king made 翕侯 by the Han, who went over to the 單于 as 前將軍 in 123 BCE
  and advised him to withdraw north of the desert; the town the Han reached in 119 BCE bore his name.
types: [person]
names:
  - form: 趙信
    lang: lzh
    script: Hani
    roman: Zhao Xin
    scheme: pinyin
    cite:
      - id: zhao-xin-name
        says:
          The 匈奴列傳 records that 趙信 was a former 胡 lesser king whom the Han made 翕侯, and that he
          surrendered to the 匈奴 as 前將軍.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（趙信者，故胡小王）
        quote: 趙信者，故胡小王，降漢，漢封爲翕侯
