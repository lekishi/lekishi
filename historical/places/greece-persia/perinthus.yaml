        says:
          Pleiades identifies the place and gives its representative point as 40.971013, 27.952973 (latitude,
          longitude), with location precision precise.
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 511357 (reprLatLong, locationPrecision), dump 2026-10-21
