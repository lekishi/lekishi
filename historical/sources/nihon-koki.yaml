notes:
  Court-ordered chronicle of 792–833, of which ten of forty volumes survive; the rest are reconstructed
  from quotations. It records the 801–806 embassy of 藤原葛野麻呂, including the ambassador's own report of
  805 with the day-by-day route to 長安 and back.
