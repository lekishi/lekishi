# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  Dionysios, the envoy whom Ptolemy II Philadelphos sent to India. Smith thinks he went to the Maurya
  court and arrived under either Bindusāra or Aśoka.
types: [person]
names:
  - form: Dionysios
    lang: en
    script: Latn
    cite:
      - id: dionysios-name
        says: >-
          Smith says Dionysios was sent to India, no doubt to the Maurya court, by Ptolemy Philadelphos.
        source: smith-asoka-1920
        at: ch. I, The History of Asoka
        quote: >-
          The mission of Dionysios, who was sent to India, and no doubt to the Maurya court, by Ptolemy Philadelphos
roles:
  - role: envoy
notes: >-
  Known from classical writers whom Smith does not quote here; the chapter cites Smith's statement only.
