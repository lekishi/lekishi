# yaml-language-server: $schema=../../schema/event.schema.json
summary: 'Coming down to Troas on the Aegean, Paul sees in a night vision a man of Macedonia begging him to cross over and help; the narrative turns to "we" here.'
types: [occurrence]
part_of:
  - paul-second-journey
date:
  value: "50..53"
  mode: window
  calendar: julian
  as_written: "Prat (1911): second mission, 50-53"
  cite:
    - id: troas-macedonian-vision-date
      says: "Prat's chronology of 1911 dates Paul's second mission to 50–53."
      basis: interpretation
      attributed_to: F. Prat (1911)
      source: catholic-encyclopedia
      at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
      quote: "second mission, 50-53"
places:
  - place: alexandria-troas
    role: site
participants:
  - actor: paul-the-apostle
    role: leader
  - actor: silas
    role: participant
  - actor: timothy
    role: participant
cite:
  - id: troas-arrival
    says: Acts tells that they passed by Mysia and came down to Troas.
    source: bible-kjv
    at: "Acts 16:8"
    quote: And they passing by Mysia came down to Troas.
  - id: troas-vision
    says: "Acts tells that a man of Macedonia appeared to Paul in a vision, praying him to come
      over."
    role: supporting
    source: bible-kjv
    at: "Acts 16:9"
    quote: "There stood a man of Macedonia, and prayed him, saying, Come over into Macedonia, and
      help us."
notes: "Acts tells it, and the dates are Prat's 1911 reckoning, an interpretation: Acts gives no
  years."
