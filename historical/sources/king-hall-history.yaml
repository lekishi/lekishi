notes:
  "A survey by two British Museum curators of the excavations of their day. Chapter V summarizes
  Hammurabi's year-formulas for his thirtieth and thirty-first years and an early chronicle of his
  war on Rim-Sin; chapter VIII reads one of his letters as proof that Assyria was a Babylonian
  province. Its readings are cited as the authors' interpretation, and some have been overtaken."
