# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The annals record one standard for laws and measures, for weights and lengths, the same gauge for carts and the same script for writing."
types: [other]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（一法度衡石丈尺。車同軌。書同文字）; 秦始皇二十七年（同天下書）"
  cite:
    - says: "The annals record the standards after the unification of 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（車同軌。書同文字）"
      quote: "一法度衡石丈尺。車同軌。書同文字。"
participants:
  - actor: qin-state
    role: leader
notes: "An institutional change with no place. The six-states table records the common script (同天下書) under the next year; the chapter dates the event by the annals and keeps the table's year as a conflicting claim."
dispute:
  status: disputed
  summary: "The annals record the common laws, measures, axle width and script under 二十六年 (221 BCE); the six-states table records the common script (同天下書) under 二十七 (220 BCE). The chapter publishes the annals' year and keeps the table's as a claim."
cite:
  - says: "The six-states table records the common script under 秦始皇二十七年."
    role: conflicting
    source: shiji
    at: "卷十五 六國年表 秦始皇二十七年（同天下書）"
    quote: "同天下書。"
