notes: The encyclopaedia Pliny dedicated to Titus in 77 CE. Book II chapter 67 and book V chapter 1
  mention Hanno's voyage; book VI chapter 24 tells of the freedman of Annius Plocamus and the
  embassy from Taprobane under Claudius; book VI chapter 26 gives the route from Egypt to India
  "of late"; book VI chapter 36 reports the skins Hanno brought back. The translators' notes are
  nineteenth-century scholarship and are cited as interpretation, never as Pliny.
