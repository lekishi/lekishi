# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  朅盤陀, the mountain kingdom whose king claimed descent from the Han and the sun god, where 玄奘 stayed
  more than twenty days.
types: [capital, settlement]
names:
  - form: 朅盤陀
    lang: lzh
    script: Hani
    roman: Qiepantuo
    scheme: pinyin
    cite:
      - id: tashkurgan-name
        says: The biography records 玄奘 reaching 盤陀 five hundred 里 east of the 波謎羅川.
        source: cien-zhuan
        at: 卷五（從此川東出，登危履雪，行五百餘里）
        quote: 從此川東出，登危履雪，行五百餘里，至盤陀國
      - id: tashkurgan-xiyu
        says: The 西域記 opens its account of the country with this sentence.
        role: supporting
        source: xiyu-ji
        at: 卷十二 朅盤陁國
        quote: 朅盤陁國周二千餘里，國大都城基大石嶺，背徒多河，周二十餘里。
  - form: 盤陀
    lang: lzh
    script: Hani
    note: The spelling of this transcription of the biography.
    claim: tashkurgan-name
at:
