# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  The next year Confucius goes from 蔡 to 葉. Its lord asks about government; Confucius says it lies in
  drawing the distant and pleasing the near. When 葉公 asks 子路 what his master is like, 子路 does not answer.
types: [occurrence]
date:
  value: 490 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: (the year after the move to 蔡)
  cite:
    - id: kongzi-at-ye-date
      says: The 孔子世家 puts 葉 in the year after the move to 蔡, 491 BCE; so 490 BCE.
      source: shiji-chunqiu
      at: 卷四十七 孔子世家（明年，孔子自蔡如葉）
      quote: 明年，孔子自蔡如葉。
places:
  - place: ye
    role: site
participants:
  - actor: kongzi
    role: leader
  - actor: zi-lu
    role: participant
  - actor: ye-gong
    role: host
cite:
  - id: kongzi-at-ye-basis
    says: The 孔子世家 records 葉公's question and the answer.
    source: shiji-chunqiu
    at: 卷四十七 孔子世家（葉公問政）
    quote: 葉公問政，孔子曰：「政在來遠附邇。」
  - id: kongzi-at-ye-lunyu
    says: The 論語 records 葉公 asking 子路 about Confucius.
    role: supporting
    source: lunyu
    at: 述而第七（葉公問孔子於子路）
    quote: 葉公問孔子於子路，子路不對。
