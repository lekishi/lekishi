summary: "Decimus Iunius Brutus Albinus, the young officer Caesar put in command of the fleet
  against the Veneti in 56 BCE."
types: [person]
names:
  - form: D. Brutus
    lang: la
    script: Latn
    cite:
      - id: decimus-junius-brutus-name
        says: "Caesar tells that he put the young D. Brutus in command of the fleet and of the
