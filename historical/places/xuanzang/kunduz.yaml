      of the cited sources.
    cite:
      - id: kunduz-anchor
        says:
          The label anchor is placed at the coordinate recorded in Wikidata (CC0); no historical coordinate
          is asserted.
        source: wikidata
        at: Q108155 (P625), revision 2546707994
