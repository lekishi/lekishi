# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  In the same year, twenty years after his consecration, Aśoka comes in person to the stūpa of Konākamana,
  does reverence and sets up a stone pillar.
types: [journey]
date:
  value: 249 BCE
  mode: window
  calendar: regnal
  as_written: >-
    when he had been consecrated [twenty years] (Nigālī Sāgar pillar; the number is restored)
  cite:
    - id: nigali-visit-time
      says: >-
        The damaged pillar records a personal visit; the number of years is restored in brackets.
      source: asoka-inscriptions
      at: Nigālī Sāgar (Niglīva) pillar inscription
      quote: >-
        when he had been consecrated [twenty years], having come in person, did reverence
    - id: nigali-visit-conversion
      says: Smith assigns the inscription to the same year as the Rummindēī inscription.
      basis: interpretation
      attributed_to: Vincent A. Smith (1920)
      role: supporting
      source: smith-asoka-1920
      at: >-
        ch. V, The Pillar and Miscellaneous Inscriptions (comment on the Niglîva inscription)
      quote: >-
        This imperfect inscription evidently must be assigned to the same year as the Rummindêî inscription
places:
  - place: nigali-sagar
    role: site
participants:
  - actor: ashoka
    role: leader
notes: >-
  The year is a restoration of a damaged text. Smith reads this and Lumbinī as stages of one tour.
