# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Following the theory of the five phases, the First Emperor held that Zhou had ruled by fire and Qin by water, the phase that overcomes it. The annals record the year now beginning with the tenth month, black for clothing and banners, six as the measure of things, and the Yellow River renamed the 德水."
types: [other]
date:
  value: "221 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十六年（始皇推終始五德之傳）; 秦始皇二十七年（更命河為德水）"
  cite:
    - says: "The annals record the adoption of the water phase and its measures after the unification of 二十六年 (221 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十六年（始皇推終始五德之傳）"
      quote: "始皇推終始五德之傳，以為周得火德，秦代周德，從所不勝。方今水德之始，改年始，朝賀皆自十月朔。衣服旄旌節旗皆上黑。數以六為紀"
    - says: "The comprehensive mirror records the same under 始皇帝二十六年."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十六年（為水德）"
      quote: "始皇採用其說，以為周得火德，秦代周，從所不勝，為水德。"
participants:
  - actor: qin-king-zheng
    role: leader
notes: "An institutional change with no place. The six-states table records the renaming of the river under the next year (二十七); see the commanderies event for the same difference."
dispute:
  status: disputed
  summary: "The annals record the virtue of water under 二十六年 (221 BCE); the six-states table records the renaming of the 河 as 德水, which the annals give as part of the same measure, under 二十七 (220 BCE). The chapter publishes the annals' year and keeps the table's as a claim."
cite:
  - says: "The six-states table records the river renamed under 秦始皇二十七年 (220 BCE)."
    role: conflicting
    source: shiji
    at: "卷十五 六國年表 秦始皇二十七年（更命河為德水）"
    quote: "二十七更命河為「德水」。"
