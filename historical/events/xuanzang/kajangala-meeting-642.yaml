summary:
  戒日王, back from campaigning, demands 玄奘 from 鳩摩羅王, who brings him up the 殑伽河 with his army; at
  羯朱嗢祇羅 戒日王 comes by night to meet him and asks about the 秦王破陣樂 and the emperor of China.
types: [occurrence]
date:
  value: 641..643
  mode: window
  calendar: chinese_lunisolar
  as_written: 至羯朱咀隻羅國，遂即參及
  cite:
    - id: kajangala-meeting-642-time
      says: The biography records the meeting without a date.
      source: cien-zhuan
      at: 卷五（至羯朱咀隻羅國）
      quote: 至羯朱咀隻羅國，遂即參及
