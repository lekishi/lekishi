# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  匈奴, the steppe polity north of the Han frontier whose 單于 held 張騫 for more than ten years and
  whom the Han fought from 133 BCE. The 匈奴列傳 describes its 單于庭 facing 代 and 雲中, its left and
  right kings, and its movement with the grass and water.
types: [state, community]
names:
  - form: 匈奴
    lang: lzh
    script: Hani
    roman: Xiongnu
    scheme: pinyin
    cite:
      - id: xiongnu-name
        says:
          The 匈奴列傳 records that from 冒頓 the 匈奴 were at their strongest and became the rival state
          of the Middle Kingdom to the south.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（至冒頓而匈奴最彊大）
        quote: 然至冒頓而匈奴最彊大，盡服從北夷，而南與中國爲敵國
notes:
  The sources write the polity in Chinese only; no 匈奴 self-designation survives in them, and the
  record makes no claim about its language or about later peoples with similar names.
