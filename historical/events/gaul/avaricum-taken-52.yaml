# yaml-language-server: $schema=../../schema/event.schema.json
summary: "Against Vercingetorix's plan of burning every town the Romans could use, the Bituriges
  begged to keep Avaricum, their finest town. Caesar besieged it for weeks with a terrace and
  towers, stormed the wall in a rainstorm, and his soldiers, remembering Cenabum, spared no one: of
  about 40,000 people, Caesar says, barely 800 reached Vercingetorix."
types: [campaign]
date:
  value: 52 BCE
  mode: window
  calendar: julian
  as_written: "the year of book VII (one commentary a year, from 58 BCE)"
  cite:
    - id: avaricum-taken-52-year
      says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by the consuls of 58 BCE, so each book is one year from 58 BCE. Holmes's narrative of the war puts it in 52 BCE."
      basis: conventional
      convention: One commentary a year from the consuls of book I (58 BCE), as Hirtius says, on the standard chronology of the Gallic War
      sources:
        - source: caesar-gallic-war
          at: "1.6"
          quote: "L. Pisone, A. Gabinio consulibus."
        - source: caesar-gallic-war
          at: "8.48"
          quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
        - source: holmes-caesars-conquest-of-gaul
          at: "ch. VII, p. 129 (margin: 52 B.C.)"
          quote: "So runs the first sentence of the book in which he narrated the events of the most momentous year of his command."
places:
  - place: avaricum
    role: site
    cite:
      id: avaricum-place
      says: Caesar tells that the soldiers mounted the wall from every side at once.
      source: caesar-gallic-war
      at: "7.27"
      quote: Illi subito ex omnibus partibus evolaverunt murumque celeriter compleverunt.
participants:
  - actor: julius-caesar
    role: leader
  - actor: vercingetorix
    role: other
cite:
  - id: avaricum-dead
    says: Caesar reports that of about forty thousand people barely eight hundred escaped to Vercingetorix.
    source: caesar-gallic-war
    at: "7.28"
    quote: "Denique ex omni numero, qui fuit circiter milium XL, vix DCCC, qui primo clamore audito
      se ex oppido eiecerunt, incolumes ad Vercingetorigem pervenerunt."
notes: "Caesar's own account: he commanded the army and wrote the report, and the numbers in it are
  his."
