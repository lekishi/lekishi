# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Issus, the last city of Cilicia at the head of its gulf, where Cyrus's fleet met the army in
  401 BCE; Alexander defeated Darius III nearby in 333 BCE.
types: [settlement, port]
names:
  - form: Ισσός
    lang: grc
    script: Grek
    roman: Issi
    scheme: other
    note: The Greek form as the gazetteer records it, without an accent; the reading aid is Dakyns's form.
    cite:
      - id: issus-greek-name
        says: Pleiades records the ancient Greek name Ισσός for this place.
        source: pleiades
        at: place 658490, name /places/658490/issos, dump 2026-10-21
      - id: issus-name
        says: Xenophon names Issi as the last city in Cilicia.
        source: xenophon-anabasis
        at: I.4
        quote: and from the Psarus he marched a single stage--five parasangs--to Issi, the last city in Cilicia.
        role: supporting
  - form: Issi
    lang: en
    script: Latn
    role: alternate
    note: Dakyns's form; the city is usually called Issus in English.
    claim: issus-name
at:
  - interpretation: approximate_point
    precision: locality
    point: [36.15704, 36.85367]
    notes:
      "The gazetteer's representative point for the place (location precision: precise). It is the
      gazetteer's identification of the ancient place, not a position the ancient text states."
    cite:
      - id: issus-location
        says:
          Pleiades identifies the place and gives its representative point as 36.8536681114, 36.1570387516
          (latitude, longitude), with location precision precise.
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 658490 (reprLatLong, locationPrecision), dump 2026-10-21
