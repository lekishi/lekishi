# yaml-language-server: $schema=../schema/chapter.schema.json
title: Rome under the kings, as tradition tells it
summary: "The Roman tradition of the seven kings, from Romulus on the Palatine to the last Tarquin
  barred from the city: the Sabine women, Numa's peace, the fall of Alba Longa, Ostia, the census
  and Lucretia. It is legend written down centuries later, and every step says who tells it."
window: 753 BCE..507 BCE
story:
  summary: "Rome under the kings as Livy and Dionysius tell it, 753–509 BCE: a tradition, not a record.
    The founding and its competing dates, the Sabine war and union, the accessions of the seven
    kings by Dionysius's Olympiad years, Alba Longa, Ostia, Tarquinius's move from Tarquinii, the
    Servian census, Gabii, Lucretia, and the first consuls."
  span: 753 BCE..507 BCE
  coverage: "From the founding of Rome to the election of the first consuls, as the tradition tells it
    in Livy book I and Dionysius books I–V. Excluded: the tradition before the founding (Aeneas,
    Lavinium, Alba's kings, the twins' birth and exposure), the Horatii and Curiatii as an event of
    its own, the wars with Fidenae, Veii and the Latins, the temple of Jupiter Capitolinus, the
    Sibylline books, and the wars of Porsenna and the Tarquins after 509. Places are drawn where the
    gazetteer locates them; no route, territory or wall is drawn."
  notes: "Every event is tradition, not record, and says so: the sources were written about seven
    centuries after the dates they give. Absolute dates are the ancient reckonings, not
    measurements: the founding shows Varro's 753 BCE and keeps Dionysius's 752/751 and the other
    ancient dates beside it, every accession uses Dionysius's Olympiad year, and events inside a
    reign are dated to the whole reign. The contract has no evidence state for tradition yet; until
    the owner decides one, each record says it in words and the founding is marked disputed."
  steps:
    - rome-founding: Romulus founds Rome on the Palatine, 753 BCE by Varro's reckoning (tradition)
    - sabine-women-seized: The Sabine women are seized at the Consualia (tradition)
    - sabine-war-union: War with the Sabines ends in one state of two peoples (tradition)
    - sabines-join-rome: Sabines and Romans become one people
    - numa-called-from-cures: Numa Pompilius is brought from Cures to be king (tradition)
    - janus-closed-numa: Numa closes the shrine of Janus and sets the calendar (tradition)
    - tullus-hostilius-accession: Tullus Hostilius becomes king (tradition)
    - alba-longa-destroyed: Tullus destroys Alba Longa and brings the Albans to Rome (tradition)
    - albans-moved-to-rome: The Albans are moved to Rome
    - ancus-marcius-accession: Ancus Marcius becomes king (tradition)
    - ostia-founded: Ancus founds Ostia at the mouth of the Tiber (tradition)
    - tarquinius-moves-to-rome: Lucumo leaves Tarquinii for Rome (tradition)
    - tarquinius-priscus-accession: Tarquinius Priscus becomes king (tradition)
    - servius-tullius-accession: Servius Tullius takes the throne (tradition)
    - servian-census: Servius holds the first census in the Campus Martius (tradition)
    - tarquinius-superbus-accession: Tarquinius Superbus seizes the throne (tradition)
    - gabii-taken: Gabii is taken by Sextus Tarquinius's treachery (tradition)
    - lucretia-death: Lucretia dies at Collatia, and Brutus swears to end the kings (tradition)
    - kings-expelled: The king is barred from Rome and the first consuls are elected (tradition)
    - roman-republic-succeeds-kingdom: The Republic succeeds the kings
include:
  - rome-alba-war
  - numa-succeeds-romulus
  - tullus-succeeds-numa
  - ancus-succeeds-tullus
  - priscus-succeeds-ancus
  - servius-succeeds-priscus
  - superbus-succeeds-servius
