notes: The Han-era history's basic annals of the 殷 and 周 royal houses. They give reigns and regnal
  years but no absolute year before the 共和 regency of 841 BCE, so every date before that comes from a
  chronology that is cited separately. The annals were written about a thousand years after the 殷
  kings they describe and are evidence of the Han account, not of the events as they happened; the
  oracle-bone inscriptions and the excavated sites are the contemporary evidence. A separate source
  record from `shiji`, which the approved Qin chapter cites for other chapters of the work, so that
  adding these chapters reopens no approval.
