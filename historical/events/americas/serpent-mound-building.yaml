# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Serpent Mound, the largest surviving ancient effigy mound, is built in Ohio. One reading of soil-core
  dates puts its first construction around 320 BCE, in the Early Woodland (Adena) period; charcoal
  dates of 920 ± 70 BP point instead to the much later Fort Ancient culture.
types:
  - occurrence
date:
  value: 320 BCE
  calendar: julian
  as_written: likely built during the Early Woodland period, around 320 BC
  cite:
    - id: serpent-mound-time
      says:
        Romain and colleagues state that Herrmann and colleagues' radiocarbon dating found Serpent Mound
        was likely built during the Early Woodland period, around 320 BC, and present further evidence
        for that date.
      basis: interpretation
      attributed_to: Romain et al. 2017
      source: romain-2017-serpent-mound
      at: abstract
    - id: serpent-mound-time-model
      says:
        Herrmann and colleagues' model of the radiocarbon ages from the buried soil under the mound gives
        the earliest possible time of construction as after 321 BC (95% probability range 381–44 BC), a
        maximum age, and they conclude that the mound was first constructed about 2,300 years ago, not
        in Fort Ancient times, while allowing that it could have been built any time after 300 BC.
      basis: interpretation
      attributed_to: Herrmann et al. 2014
      role: supporting
      source: herrmann-2014-serpent-mound
      at: §3.2 and §4.1 (Initial construction), Fig. 2
    - id: serpent-mound-time-lepper
      says:
        Lepper reports Herrmann and colleagues' conclusion that Serpent Mound was first constructed
        2,300 years ago, during the Early Woodland (Adena) period, from dates on organic sediment in soil
        cores.
      basis: interpretation
      attributed_to: Herrmann et al. 2014, as reported by Lepper 2020
      role: supporting
      source: lepper-2020-serpent-mound-sediment
      at: p. 1
places:
  - place: serpent-mound
    role: site
participants:
  - actor: adena-culture
    role: other
    note: The builders in the main account.
  - actor: fort-ancient-culture
    role: other
    note: The builders in the conflicting account.
notes:
  "The National Park Service page leaves the age open: probably several hundred years before or after
  the Hopewell-era sites. The Fort Ancient dates are uncalibrated radiocarbon years and are kept as the
  source states them, in the dispute only. The main date is approximate and written as a single year
  because the record notation cannot yet mark a date as approximate. It is the construction date Romain
  and colleagues give. Herrmann and colleagues' model, which it rests on, dates only the earliest
  possible construction (after 321 BC, 381–44 BC at 95% probability) and gives no latest date, so that
  range is cited as support and not used as a window."
dispute:
  status: disputed
  summary:
    The age of Serpent Mound is contested. Herrmann and colleagues (2014) date its first construction
    to about 2,300 years ago, in the Adena period, from bulk-sediment dates in soil cores, and Romain
    and colleagues (2017) give it as around 320 BCE. Fletcher and colleagues (1996) obtained charcoal dates of 920 ± 70 BP from the mound and attributed it to the Fort
    Ancient culture, and Lepper argues that dates on bulk sediment cannot establish its age. The chapter
    shows the early date because it is the account that places the mound in this chapter's era, and marks
    it disputed.
cite:
  - id: serpent-mound-fort-ancient
    says:
      Lepper reports that Fletcher and colleagues dated charcoal in the mound to 920 ± 70 BP and concluded
      that the Fort Ancient culture built it in the early Late Prehistoric period.
    basis: interpretation
    attributed_to: Fletcher et al. 1996, as reported by Lepper 2020
    role: conflicting
    source: lepper-2020-serpent-mound-iconography
    at: p. 39, Radiocarbon Dates for Serpent Mound
  - id: serpent-mound-sediment-critique
    says:
      Lepper argues that the bulk-sediment dates are problematic and cannot establish when the mound
      was built.
    basis: interpretation
    attributed_to: Lepper 2020
    role: conflicting
    source: lepper-2020-serpent-mound-sediment
    at: pp. 1–2
cites:
  notes:
    id: serpent-mound-park
    says:
      The park page says only that Serpent Mound was probably built several hundred years before or
      after the Hopewell-era sites.
    source: nps-hopewell-world-heritage
    at: Is Serpent Mound part of the inscription?
    quote: Serpent Mound, probably built several hundred years before or after the Hopewell-era sites
