# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  'Aziru of Amurru seizes the lands of the chiefs on his northern border: he takes Nii and besieges
  Simyra, and Tunip writes to the king that "Tunip, thy city, weeps".'
types: [campaign]
date:
  value: 1410 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: the reigns of Amenophis III and IV
places:
  - place: simyra
    role: site
  - place: tunip
    role: context
participants:
  - actor: aziru
    role: leader
  - actor: amurru-kingdom
    role: participant
cite:
  - id: aziru-north
    says: Niebuhr says Tunip's letter tells of Aziru taking Nii and besieging Simyra.
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Aziru and Tunip"
    quote:
      The town of Tunip sent a truly pathetic letter to Pharaoh from which we learn that Aziru had
      already taken Nii, was besieging Simyra in Phœnicia
  - id: tunip-weeps
    says: Tunip's letter ends that the city weeps with no help.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. IV: Aziru and Tunip (the lament)"
    quote: But Tunip, thy city, weeps; her tears flow; nowhere is there help for us."
notes:
  "Nii is not placed. The letters are undated but for a few dockets, and the reigns they fall in
  convert to BCE according to the chronology used: Amenhotep III's accession is put between about 1410
  and 1388 BCE, and the end of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those
  placements for the reign in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten
  built about 1380 B.C.) fall inside it. It is an editorial bound that a cited chronology must replace
  before approval."
