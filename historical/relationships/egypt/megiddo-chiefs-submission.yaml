summary:
  "The chiefs of the country submit to Thutmose III after the siege of Megiddo, and he appoints
  chiefs anew: Egyptian rule over the Canaanite city-rulers as the annals present it."
types: [rulership]
from: egypt-new-kingdom
to: megiddo-coalition
cite:
  - id: submission-basis
    says: The annals record that the king appointed the chiefs anew.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the submission"
    quote:
      Each of the Kode among them bore the tribute southward. Behold, his majesty appointed the chiefs
      anew.
