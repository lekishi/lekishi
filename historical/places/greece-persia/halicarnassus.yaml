      - id: halicarnassus-name
        says: Arrian records the Persian force gathered in Halicarnassus.
        source: arrian-anabasis
        at: I.20
        quote: a considerable force, both of foreigners and of Grecian auxiliaries, had collected in Halicarnassus.
