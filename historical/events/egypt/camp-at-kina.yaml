# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The front of the army clears the pass as the shadow turns, and at the seventh hour the king reaches
  the brook of Kina south of Megiddo and pitches camp for battle in the morning.
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1457 BCE..1456 BCE
  mode: window
  calendar: regnal
  as_written: the seventh hour, after year 23, I Shemu 19
  cite:
    - id: camp-at-kina-shaw
      says: On Shaw's chronology Thutmose III reigned 1479–1425 BCE, so his year 23 falls in
        1457–1456 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Eighteenth Dynasty"
places:
  - place: kina-brook
    role: site
  - place: megiddo
    role: context
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: kina-camp
    says:
      The annals record the arrival at the brook of Kina at the seventh hour and the camp for the next
      day's battle.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: the exit from the pass (Kina)"
    quote:
      Behold, when the front had reached the exit upon this road, the shadow had turned, and when his
      majesty arrived at the south of Megiddo on the bank of the brook of Kina, the seventh hour was turning,
      measured by the sun.
notes: The annals do not say whether this was the 19th or the 20th day; the record leaves the day
  unstated. The annals date by regnal year and the civil calendar. The BCE years follow Shaw's
  chronology (The Oxford History of Ancient Egypt, 2000), which puts the accession of Thutmose III
  in 1479 BCE, so year 22 falls in 1458–1457 BCE and year 23 in 1457–1456 BCE. Breasted's own 1906
  table follows an older, higher chronology.
