  - key: jianzhen-crossings-742-753
    title: 鑒眞's attempts to cross, 742–750
    summary: 鑒眞's attempts to cross to Japan after 榮叡 and 普照 invited him in 742, from the
      denunciation of 743 to the storm of 748 that drove the ship to 振州, and the return north to
      揚州 by 750, as 唐大和上東征傳 tells them, with 續日本紀's differing account kept visible.
    window: 742..750
    span: 742..753
    coverage: The biography's account from the invitation of 742 to the return to 揚州 by 750; the
      embassy's visit of 753, where the envoys say they know of his five attempts, is a coda step
      outside that window. Undated episodes between 天寶三載 and 天寶七載 keep the windows their
      dated anchors allow. Several places on the 748 voyage, and 振州, 萬安州 and 崖州, have no
      identified location yet.
    notes: Step order is the biography's narrative order, not a claim that one event caused
      another. Where 續日本紀 differs (the year of the invitation, the place of the landfall, the
      cause of the blindness), the events carry the dispute.
