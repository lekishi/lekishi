          The biography names 多禰島 as the island the second ship set out for; the passage records no
          landing there.
        source: toseiden
        at: 十二月六日南風起，第一舟着石不動，第二舟發向多禰去
notes:
  The entry places the ships at sea near 阿兒奈波島 and names 多禰島 as the second ship's destination,
