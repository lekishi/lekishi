# A contract v1 journey record. The owner decided on 2026-10-21 that journeys are their own kind
# (RFD 2, "Decided: journeys are their own kind"); the record's shape is still proposed there
# ("Proposed: the journey record").
# A counterexample, not a conforming record: a population movement probes the proposal's
# "one party's movement" definition rather than fitting it.
# Not compiled yet: the compiler reads no historical/journeys/ folder until v1 lands, so this
# file is test data for that work and changes no chapter's digest.
title: The Lapita expansion from the Bismarcks to Sāmoa
summary: >-
  Lapita settlement moves out of the Bismarck Archipelago, across to the Santa Cruz Islands and
  Vanuatu, on to Fiji and then to Tonga and Sāmoa, over some five centuries of modelled dates.
travellers:
  - actor: lapita-culture
    role: participant
stops:
  - lapita-bismarck-appearance
  - event: lapita-remote-oceania-crossing
    place: vanuatu
    by: sea
    route: lapita-remote-oceania-crossing.geojson
    cite:
      id: lapita-crossing-route
      says: >-
        Petchey and colleagues say the culture spread through the Solomon Islands chain, perhaps by
        leapfrogging to the Reefs–Santa Cruz group, and on to Vanuatu.
      basis: interpretation
      attributed_to: F. Petchey et al. (2015), citing P. Sheppard and R. Walter (2006)
      source: petchey-2015-teouma
      at: "103"
  - event: teouma-settlement
    by: sea
  - event: naigani-settlement
    by: sea
  - event: bourewa-settlement
    by: sea
  - event: nukuleka-founding
    by: sea
  - event: mulifanua-settlement
    by: sea
cite:
  - id: lapita-expansion-sequence
    says: >-
      Petchey and Kirch say the culture began in the Bismarck Archipelago and reached its
      eastern-most extent in Tonga and Sāmoa; Petchey and colleagues order the settlement of
      Remote Oceania from the Solomons chain to Vanuatu, with Fiji and Tonga after.
    sources:
      - source: petchey-kirch-2019
        at: Introduction
      - source: petchey-2015-teouma
        at: 103–104
notes: >-
  A test of the journey shape against a population movement rather than one party's voyage, and a
  finding for the v1 review: no one travelled this route, and the stops are the first dated signals
  of settlement on each island group. The crossing's route is the one reconstructed_route case,
  drawn through the Reef–Santa Cruz group as the cited scholarship suggests; but its two ends
  (the Bismarcks and Vanuatu) are display anchors, so under the proposed drawing rules that leg
  breaks and the route is never drawn, a second finding. The stop order is the
  scholarship's, but the modelled windows overlap (Naigani's starts before Teouma's), so v0's
  partial ordering accepts it without proving it. by: sea is the only way between these islands.
  This may argue for a separate dispersal kind, with branches (New Caledonia, Fiji) rather than one
  ordered list.
