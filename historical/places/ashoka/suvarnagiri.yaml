# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  Suvarṇagiri, the seat of the southern viceroyalty from which the Mysore Minor Rock Edicts are addressed.
  Its position is not known; Smith suggests it lay near the ancient gold mines of the Raichur country.
types: [capital]
names:
  - form: Suvarṇagiri
    lang: pra
    script: Latn
    cite:
      - id: suvarnagiri-name
        says: >-
          The Brahmagiri text opens with the words of the prince and high officers of Suvarnagiri.
        source: asoka-inscriptions
        at: Minor Rock Edict I, Brahmagiri text
        quote: According to the words of the Prince and High officers of Suvarnagiri
at:
  - interpretation: unknown
    precision: unspecified
    notes: >-
      No coordinate. Smith says the position of Suvarṇagiri is not known and that the name means Golden
      Hill; his suggestion that it was in the Raichur district is a conjecture from the gold workings at
      Maski.
    cite:
      - id: suvarnagiri-unlocated
        says: Smith says the position of Suvarṇagiri is not known.
        source: smith-asoka-1920
        at: ch. II, Extent and Administration of the Empire
        quote: The position of Suvarṇagiri is not known.
notes: The name means Golden Hill.
