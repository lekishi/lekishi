# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  褒姒, the woman from 褒 whom 幽王 made queen in place of the lady of 申, and whose son 伯服 he made heir.
  The annals tell of the beacon fires lit to make her laugh; the 犬戎 carried her off when 幽王 died.
types: [person]
names:
  - form: 褒姒
    lang: lzh
    script: Hani
    roman: Bao Si
    scheme: pinyin
    cite:
      - id: bao-si-name
        says: The annals record that 褒姒 did not like to laugh, and that 幽王 tried every means to make her.
        source: shiji-yin-zhou
        at: 卷四 周本紀 幽王（褒姒不好笑）
        quote: 褒姒不好笑，幽王欲其笑萬方，故不笑。
