    - cestius-defeated-at-beth-horon-66: Cestius Gallus is routed at Beth-horon
    - vespasian-musters-at-ptolemais-67: Vespasian and Titus muster three legions at Ptolemais
    - jotapata-siege-67: The forty-seven-day siege of Jotapata
    - josephus-surrenders-67: Josephus surrenders and foretells Vespasian's rise
    - taricheae-and-the-lake-67: Taricheae and the battle on the Sea of Galilee
    - gamala-taken-67: Gamala falls
    - gischala-surrenders-67: Gischala surrenders and John escapes to Jerusalem
    - vespasian-proclaimed-emperor-69: The army proclaims Vespasian emperor
    - siege-of-jerusalem-70: Titus besieges Jerusalem at Passover
    - temple-burned-70: The Temple burns
    - jerusalem-taken-70: Jerusalem is taken and destroyed
