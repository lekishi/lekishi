# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Tuba'lu, whom the prism records Sennacherib seating on the royal throne over Lulê's cities in
  701 BCE, and who then appears among the western kings bringing tribute as "the Sidonite".
types: [person]
names:
  - form: Tuba'lu
    lang: en
    script: Latn
    cite:
      - id: tubalu-of-sidon-name
        says: The prism records Sennacherib seating Tuba'lu on the royal throne.
        source: luckenbill-annals-sennacherib
        at: p. 30, Oriental Institute prism col. II 47
        quote: Tuba'lu I seated on the royal throne
roles:
  - role: ruler
    note: Set on the throne by Sennacherib, as the prism records.
    cite:
      says: The prism records Sennacherib seating Tuba'lu on the royal throne.
      source: luckenbill-annals-sennacherib
      at: p. 30, Oriental Institute prism col. II 47
      quote: Tuba'lu I seated on the royal throne
