notes:
  "The Song comprehensive mirror. One source for the whole work; each cite's locator names the 卷 and
  the year entry. 卷六 秦紀一 is used for the 始皇帝十四年, 十六年, and 十七年 entries: the submission
  and embassy, the cession of 南陽, and the annexation with the 潁川 commandery. Its absolute years
  are the dating basis for the events the annals date by reign year. 卷二一五–二二一 唐紀三十一–三十七
  (744–759) are used for the dated notices of 杜環's west: 和義公主's marriage, 高仙芝's 石國 raid and
  his presentation of captives, the battle at 恆羅斯城 and 李嗣業's retreat, 高仙芝's execution, the
  western troops of 至德二載, the 香積寺 battle, the 廣州 report of 乾元元年, and 李嗣業's death. A
  notice's month is the month heading it is entered under; the mirror sometimes gathers a frontier
  episode under the month its report arrived, so such notices are dated to the year."
