# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  成王, 誦, 武王's son, who came to the throne as a child under 周公's regency, had 召公 lay out 洛邑 again as his father had intended, and returned to 宗周 after the eastern wars.
types: [person]
names:
  - form: 成王
    lang: lzh
    script: Hani
    roman: Cheng Wang
    scheme: pinyin
    cite:
      - id: zhou-cheng-wang-name
        says: The annals record that after 武王 died his heir 誦 came to the throne as 成王.
        source: shiji-yin-zhou
        at: 卷四 周本紀 武王（太子誦代立，是為成王）
        quote: 後而崩，太子誦代立，是為成王。
roles:
  - role: ruler
    note: King of 周 after 武王.
    cite:
      - id: zhou-cheng-wang-role
        says: The annals record that after 武王 died his heir 誦 came to the throne as 成王.
        source: shiji-yin-zhou
        at: 卷四 周本紀 武王（太子誦代立，是為成王）
