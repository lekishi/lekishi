# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  From Tyriaeum the army marches to Iconium, through Lycaonia and Cappadocia to Dana, over the
  pass into Cilicia, and down the plain to Tarsus.
types: [journey]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE
  mode: window
  calendar: julian
  as_written: he advanced four stages--twenty-five parasangs--to Tarsus
  cite:
    - id: tyriaeum-to-tarsus-401-time
      says:
        Grote dates the start of the march from Sardis to about March or April 401 BCE and the battle
        of Kunaxa to about September or October of the same year; the stage falls between them.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: I.2
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote: was commenced about March or April in the year 401 B.C.
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            It was about six months afterwards, in the month of September or October of the same year,
            that the battle of Kunaxa was fought
    - id: tyriaeum-to-tarsus-401-text
      says: Xenophon records the descent to Tarsus.
      source: xenophon-anabasis
      at: I.2
      quote: Descending through this plain country, he advanced four stages--twenty-five parasangs--to Tarsus
      role: supporting
places:
  - place: tyriaion
    role: start
  - place: iconium
    role: waypoint
  - place: tyana
    role: waypoint
  - place: tarsus
    role: end
participants:
  - actor: cyrus-the-younger
    role: leader
  - actor: cyreans
    role: participant
cites:
  places:
    - id: tyriaeum-to-tarsus-401-iconium
      says: Xenophon records the halt at Iconium.
      source: xenophon-anabasis
      at: I.2
      quote: to Iconium, the last city of Phrygia, where he remained three days.
    - id: tyriaeum-to-tarsus-401-dana
      says: Xenophon records the march through Cappadocia to Dana.
      source: xenophon-anabasis
      at: I.2
      quote:
        With the rest of the troops he continued his march through Cappadocia four stages--twenty-five
        parasangs--to Dana
      role: supporting
