summary:
  The rock in Sogdiana where Oxyartes's family and many Sogdianians took refuge, which Alexander
  took in the spring of 327 BCE; there he met Roxana.
types: [fortification, landform]
names:
  - form: πέτρα τοῦ Ὤξου
    lang: grc
    script: Grek
    roman: the rock in Sogdiana
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: sogdian-rock-greek-name
        says: Pleiades records the ancient Greek name πέτρα τοῦ Ὤξου for this place.
        source: pleiades
        at: place 60633, name /places/60633/petra-tou-oxou, dump 2026-10-21
      - id: sogdian-rock-name
        says: Arrian records Alexander advancing on the rock in Sogdiana.
        source: arrian-anabasis
        at: IV.18
        quote:
          he advanced towards the rock in Sogdiana, to which he was informed many of the Sogdianians
          had fled for refuge
        role: supporting
  - form: the rock in Sogdiana
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: sogdian-rock-name
at:
