# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "Through Armenia in winter: past the sources of the Tigris to the Teleboas, shadowed by the governor
  Tiribazus, then on through deep snow in which many men and animals are lost."
types: [journey]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE..400 BCE
  mode: window
  calendar: julian
  as_written: they marched through deep snow over a flat country
  cite:
    - id: armenia-snow-401-time
      says:
        Grote dates the entry into Armenia to December 401 BCE and the sight of the sea to the first
        half of February 400 BCE; the march through Armenia lies between.
      basis: interpretation
      attributed_to: George Grote
      sources:
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: extremely cold at the season when they entered it,—December
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: in the first half of February, the time of Xenophon’s visit
    - id: armenia-snow-401-text
      says: Xenophon records the march through deep snow.
      source: xenophon-anabasis
      at: IV.5
      quote: From this place they marched through deep snow over a flat country three stages--fifteen parasangs
      role: supporting
places:
  - place: kentrites-river
    role: start
  - place: teleboas-river
    role: waypoint
participants:
  - actor: cyreans
    role: participant
cites:
  places:
    - id: armenia-snow-401-teleboas
      says: Xenophon records the march to the Teleboas.
      source: xenophon-anabasis
      at: IV.4
      quote: and from this point they marched three stages--fifteen parasangs--to the river Teleboas.
