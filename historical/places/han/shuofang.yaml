# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  朔方, the commandery the Han set up in the 河南 land in 127 BCE, settling a hundred thousand people
  there, and from which 衛青 rode out against the 右賢王 in 124 BCE. The sources name the commandery
  and state no seat; the record carries no position.
types: [region]
names:
  - form: 朔方
    lang: lzh
    script: Hani
    roman: Shuofang
    scheme: pinyin
    cite:
      - id: shuofang-name
        says: The 漢書 annals record the Han setting up the 朔方 and 五原 commanderies in the 河南 land in 元朔二年.
        source: hanshu
        at: 卷六 武帝紀 元朔二年
        quote: 數河南地，置朔方、五原郡。
at:
  - interpretation: unknown
    precision: unspecified
    notes: The commandery's seat is not named in the cited entries and its site is debated; no position is asserted.
    cite:
      - id: shuofang-unplaced
        says: The cited entry names 朔方 and states no site for it, so no position is asserted.
        source: hanshu
        at: 卷六 武帝紀 元朔二年
