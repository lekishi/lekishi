# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The unnamed freedman of Annius Plocamus who, sailing around Arabia, was carried by a gale to
  Taprobane, learned the language in six months, and prompted its king to send an embassy to Rome.
types: [person]
names:
  - form: freedman of Annius Plocamus
    lang: en
    script: Latn
    note: Pliny gives no name; this is a descriptive label.
    cite:
      - id: plocamus-freedman-name
        says:
          Pliny says a certain freedman of Annius Plocamus, sailing around Arabia, was carried away by
          a gale.
        source: pliny-natural-history
        at: VI.24
        quote:
          A certain freedman of his, while sailing around Arabia, was carried away by a gale from the
          north beyond the coast of Carmania.
