summary:
  Taxila, the largest city between the Indus and the Hydaspes, whose king received Alexander in
  326 BCE.
types: [settlement]
names:
  - form: Τάξιλα
    lang: grc
    script: Grek
    roman: Taxila
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: taxila-greek-name
        says: Pleiades records the ancient Greek name Τάξιλα for this place.
        source: pleiades
        at: place 60083, name /places/60083/taxila, dump 2026-10-21
      - id: taxila-name
        says: Arrian describes Taxila as the largest city between the Indus and the Hydaspes.
        source: arrian-anabasis
        at: V.8
        quote:
          he arrived at Taxila, a large and prosperous city, in fact the largest of those situated between
          the rivers Indus and Hydaspes.
        role: supporting
