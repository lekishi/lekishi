notes:
  The type is other because the event vocabulary has no kind for writing a work. The biography gives
  no date for this stop. The window is the chapter's reckoning from the stays and seasons the biography
  reports between the 貞觀三年 departure and the 貞觀十九年 return; the biography's own chronology is not consistent
  (see the chapter notes), so the window is wide and the stop must never be shown at a midpoint.
