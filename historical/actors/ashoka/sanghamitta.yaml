# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  Saṅghamittā (Smith's Sanghamitrā), Aśoka's daughter in the Ceylon chronicles, who carries the branch
  of the bodhi tree to Lanka and ordains the first nuns there.
types: [person]
names:
  - form: Sanghamitrâ
    lang: sa
    script: Latn
    note: Smith's form; the Pali chronicles write Saṅghamittā.
    cite:
      - id: sanghamitta-name
        says: >-
          Smith's retelling says a daughter named Sanghamitrā was born two years after Mahendra.
        source: smith-asoka-1920
        at: ch. VI, The Ceylonese Legend of Asoka
        quote: Two years later a daughter named Sanghamitrâ was born.
roles:
  - role: monk
    note: A nun.
notes: Known only from the chronicles.
