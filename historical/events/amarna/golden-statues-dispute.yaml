# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Tushratta asks Akhenaten for the golden statues his father promised, and receives wooden ones.
  He writes to Tiye to intercede, and the quarrel ends with Akhenaten threatening to close Egypt to the
  subjects of Mitanni.
types: [exchange]
part_of:
  - amarna-letters-exchanged
date:
  value: 1380 BCE..1330 BCE
  mode: window
  calendar: regnal
  as_written: early in the reign of Amenophis IV
participants:
  - actor: tushratta
    role: participant
  - actor: akhenaten
    role: participant
  - actor: tiye
    role: participant
  - actor: keliya
    role: witness
  - actor: mitanni
    role: participant
cite:
  - id: statues-basis
    says: Niebuhr says Napkhuria sent wooden models instead of the golden images.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the golden images"
    quote:
      Immediately after this came the request that Napkhuria should send him the "golden images" (statuettes)
      that Nimmuria had promised him. And Napkhuria wasted no words, but sent by the messenger Hamashi—the
      wooden models!
  - id: statues-teye
    says: Tushratta writes to Teye that her son had the statuettes made of wood.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the letter to Teye"
    quote:
      I asked for golden statuettes. But now Napkhuria thy son has had them made of wood, though gold
      is as dust in thy land.
  - id: statues-end
    says:
      Niebuhr says Napkhuria threatened to close his land to the subjects of Mitani, and intercourse
      probably ceased.
    role: supporting
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: the last letter"
    quote:
      Napkhuria threatened to close his land against all subjects of Mitani, and, as no later document
      has been found, it is probable that at this point all intercourse ceased.
notes:
  "The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
