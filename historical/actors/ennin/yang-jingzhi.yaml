summary:
  楊敬之, 大理卿 in 長安, who sent 圓仁 off in 845 with letters to officials along the road; the diary
  records 圓仁 delivering them at 渭南, 華陰, 東都 and 鄭州.
types: [person]
names:
  - form: 楊敬之
    lang: lzh
    script: Hani
    roman: Yang Jingzhi
    scheme: pinyin
    cite:
      - id: yang-jingzhi-name
        says: The diary names 大理卿 楊敬之, who sent a messenger to ask when 圓仁 would leave the city.
        source: nitto-guho-junrei-gyoki
        at: 卷四 會昌五年五月十五日
roles:
  - role: official
    note: 大理卿; formerly 御史中丞.
    cite:
      - id: yang-jingzhi-role
        says: The diary gives his titles as 大理卿中散大夫賜紫金魚袋 and former 御史中丞.
        source: nitto-guho-junrei-gyoki
        at: 卷四 會昌五年五月十五日
