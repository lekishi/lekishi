# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Near the Ticinus, Scipio and Hannibal lead out their cavalry to reconnoitre and collide. The
  Numidians ride round and take the Romans in the rear; the consul is badly wounded and is rescued,
  by his seventeen-year-old son on most accounts, by a Ligurian slave on Coelius'.
types: [occurrence]
date:
  value: "218 BCE"
  calendar: regnal
  as_written: after Hannibal's descent; consul P. Cornelius (Livy 21.15.4)
  cite:
    - id: ticinus-time
      says: Polybius records both commanders leading out all their cavalry across the plain to
        reconnoitre.
      source: polybius
      at: "3.65.3"
      quote: τῇ δʼ ἐπαύριον πᾶσαν τὴν ἵππον ἀναλαβόντες ἀμφότεροι, Πόπλιος δὲ καὶ τῶν πεζῶν τοὺς
        ἀκοντιστάς, προῆγον διὰ τοῦ πεδίου
places:
  - place: ticinus
    role: site
    note: The river is placed by a label anchor; the battlefield is not located.
participants:
  - actor: p-cornelius-scipio
    role: leader
  - actor: hannibal
    role: leader
  - actor: scipio-africanus
    role: participant
    note: Rescued his father, on Polybius' and most of Livy's sources.
notes: Polybius has the rescue story from Laelius, Scipio Africanus' friend (10.3). Year only. The
  sources date by Roman consular year and by season; v0 has no Roman republican calendar, so the
  date is the Julian year the consular year falls in, and no month or day is asserted.
dispute:
  status: disputed
  summary:
    "Who rescued the wounded consul is disputed: Polybius and most of Livy's sources credit his son,
    the later Africanus; Coelius, as Livy reports, credits a Ligurian slave. The record publishes
    the son and keeps Coelius' version as a conflicting claim."
cite:
  - id: ticinus-rout
    says: Polybius records the Numidians riding round and falling on the rear, and the Romans breaking.
    source: polybius
    at: "3.65.10"
    quote: τῶν δὲ Νομάδων κυκλωσάντων καὶ κατόπιν ἐπιπεσόντων
  - id: ticinus-rescue-son
    says: Polybius and Livy record the consul's son, then about seventeen, saving his wounded father.
    role: supporting
    sources:
      - source: polybius
        at: "10.3.4"
        quote:
          συνθεασάμενος ἐν τῷ κινδύνῳ τὸν πατέρα περιειλημμένον ὑπὸ τῶν πολεμίων μετὰ δυεῖν ἢ τριῶν
          ἱππέων καὶ τετρωμένον ἐπισφαλῶς
      - source: livy
        at: "21.46.7"
        quote: auxitque pavorem consulis vulnus periculumque intercursu tum primum pubescentis fili
          propulsatum
  - id: ticinus-rescue-slave
    says:
      Livy reports that Coelius gives the rescue to a slave of Ligurian birth, though Livy prefers
      the son.
    role: conflicting
    source: livy
    at: "21.46.10"
    quote: servati consulis decus Coelius ad servum natione Ligurem delegat
