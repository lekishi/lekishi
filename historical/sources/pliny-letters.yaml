notes:
  "Pliny's two letters to Tacitus on the eruption of Vesuvius (6.16 and 6.20) were written about
  a quarter of a century after it, at the historian's request. The first tells his uncle's death
  from what Pliny saw at Misenum and heard from those who were with him; the second tells his own
  escape. The day of the eruption rests on 6.16."
