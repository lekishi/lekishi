summary: 鑒眞 buys a military ship from the 嶺南道採訪使 劉巨鱗 for eighty strings of cash and loads it with provisions, images and sutras. Seventeen monks and eighty-five artisans sail east from 揚州 in the twelfth month of 天寶二載, and a storm breaks the ship at 狼溝浦; the party wades ashore and stands in the winter tide.
types: [journey]
date:
  value: 743-12
  calendar: chinese_lunisolar
  as_written: 天寶二載十二月
  cite:
    - id: langgou-wreck-time
      says: The biography dates the sailing to the twelfth month of 天寶二載.
      source: toseiden
      at: 天寶二載十二月，舉帆東下，到［狼］溝浦，被惡風飄擊，舟破
