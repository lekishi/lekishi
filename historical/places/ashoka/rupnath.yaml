# yaml-language-server: $schema=../../schema/place.schema.json
summary: >-
  Rūpnāth in the Jabalpur district: a boulder in a wild glen of pools, still visited by pilgrims, carrying
  a version of the first Minor Rock Edict that orders the text to be written on rocks and on stone pillars.
types: [other]
names:
  - form: Rupnath
    lang: en
    script: Latn
    note: Smith writes Rûpnâth.
    cite:
      - id: rupnath-name
        says: Smith describes the Rûpnâth inscription in a wild and out-of-the-way glen.
        source: smith-asoka-1920
        at: ch. III, The Monuments (the Minor Rock Edicts)
        quote: The Rûpnâth inscription was placed in a singularly wild and out-of-the-way glen
at:
  - interpretation: approximate_point
    precision: site
    point: [80.032222222, 23.640555555]
    notes: >-
      The coordinate is the inscribed rock's modern position recorded in Wikidata (CC0).
    cite:
      - id: rupnath-anchor
        says: >-
          The coordinate is the modern position recorded in Wikidata (CC0); it is a map reference, not a historical
          claim.
        source: wikidata
        at: Q97945933 (P625), revision 2541120654
notes: >-
  Typed other: the place is an inscribed monument (a rock, boulder or pillar bearing Aśoka's edicts),
  which the v0 place types do not name.
