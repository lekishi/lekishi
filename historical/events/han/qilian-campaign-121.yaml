summary:
  In the summer of 121 BCE 霍去病 and 公孫敖 rode out of 北地 by separate roads. 公孫敖 lost his way; 霍去病
  went on alone, crossed 居延, passed the land of the 小月氏, and attacked 祁連山, taking more than
  thirty thousand heads and the surrender of 2,500 people.
types: [campaign]
date:
  value: 121 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: 元狩二年 夏
  cite:
    - id: qilian-campaign-time
      says: The 漢書 annals record 去病 and 公孫敖 going two thousand 里 out of 北地 and past 居延 in the summer of 元狩二年.
      source: hanshu
      at: 卷六 武帝紀 元狩二年 夏
      quote: 將軍去病、公孫敖出北地二千餘里，過居延，斬首虜三萬餘級。
    - id: qilian-campaign-account
      says: The 衛將軍驃騎列傳 records 公孫敖 losing his way and the 驃騎將軍 crossing 居延 to 祁連山.
      role: supporting
      source: shiji-han-frontiers
      at: 卷一百十一 衛將軍驃騎列傳（與合騎侯失道）
      quote: 而驃騎將軍出北地，已遂深入，與合騎侯失道，不相得，驃騎將軍踰居延至祁連山，捕首虜甚多。
