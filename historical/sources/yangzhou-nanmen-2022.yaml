notes:
  The city's report on the 南門遺址, part of the 揚州城遺址 (隋—宋), a national key protected site. It
  reports that the 1986 review and the 2007 excavation by the 揚州唐城考古工作隊 established that the
  south gate of the Tang 羅城 and of the later cities stood at the 南門, under the modern old city. It
  reports a modern archaeological identification, not a source statement of the eighth century.
  Locators count the report's sections.
  The report is published in simplified characters; its title, byline and names are given here in
  traditional forms, which the site's fonts draw, and the URL identifies the published text.
