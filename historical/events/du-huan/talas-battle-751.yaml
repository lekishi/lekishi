notes:
  "The mirror calls the city 恆羅斯城, 經行記 and 新唐書 怛邏斯 (城). The mirror's notice follows the
  fourth-month entries but carries no day; the chapter publishes the year. Army sizes are told as
  three myriads (the mirror) and two (both 李嗣業 biographies), and the chapter decides neither.
  Ibn al-Athīr's account is the Arabic side: written in the thirteenth century and naming no earlier
  source, it places the battle at the river of Ṭarāz (the 怛邏斯 river), dates it to Dhū l-Ḥijja 133,
  which agrees with the Chinese year, and gives a hundred thousand for the Chinese army. It does not
  mention the 葛羅祿 defection. Its month is not published, because the Chinese notices give only
  the year. 杜環 is not named in any battle notice, so he is not a participant here."
dispute:
  status: disputed
  summary:
    The mirror gives the Tang army as thirty thousand men; the 李嗣業 biographies of 舊唐書 and
    新唐書 give twenty thousand; Ibn al-Athīr gives the Chinese army as a hundred thousand, of whom
    about fifty thousand were killed and twenty thousand captured. The chapter records all three.
