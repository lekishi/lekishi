notes: >-
  A reworking of the Royal Frankish Annals made after 814. It adds detail and its own readings, and
  in one it disagrees with the papal life outright: it has Stephen come to Pepin at Quierzy
  (Carisiacus), where the life has the meeting at Ponthion. It also says Stephen wintered in Francia
  and that Carloman's body was carried back to Monte Cassino.
