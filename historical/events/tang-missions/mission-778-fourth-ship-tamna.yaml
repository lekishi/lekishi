      source: shoku-nihongi
      at: 卷第卅五 寶龜九年十一月壬子
      quote: 壬子。遣唐第四船來泊薩摩國甑嶋郡。其判官海上眞人三狩等漂着耽羅嶋。被嶋人略留。但録事韓國連源等。陰謀解纜而去。
