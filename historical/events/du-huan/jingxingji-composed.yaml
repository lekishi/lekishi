cites:
  places:
    - id: jingxingji-composed-places
      says: 通典 quotes 經行記's entries for 拔汗那, 康國, 師子國, 拂菻, 摩鄰, 波斯, 石國, 碎葉, 大食 (亞俱羅), 末祿 and 苫國.
      sources:
        - source: tongdian
          at: 卷一九二 邊防八 大宛（杜環經行記云）
        - source: tongdian
          at: 卷一九三 邊防九 康居、師子國、大秦、波斯、石國、大食（杜環經行記云）
  summary:
    - id: jingxingji-composed-laws
      says: 經行記 distinguishes three laws among the peoples on the overland road, 大食法, 大秦法 and 尋尋法.
      source: tongdian
      at: 卷一九三 邊防九 大秦（諸國陸行之所經也，胡則一種，法有數般）
      quote: 諸國陸行之所經也，胡則一種，法有數般。有大食法，有大秦法，有尋尋法。
notes: "The places are the lands the surviving fragments describe, as context: the book's order and
  杜環's route are lost, so they are not stops and no line joins them. 杜佑 says he left out the
  small states with nothing new to tell (其小國無異聞者，則不暇錄焉), so the fragments are a selection.
  經行記 is not a founding in any institutional sense; the type marks the making of a work."
