summary:
  "The embassy of 659 from 日本國 to 唐, told by 伊吉連博德: one ship lost at 爾加委, the other received by
  the emperor at 洛陽 with two 蝦夷, the envoys detained in 長安 through the Tang campaign against Paekche,
  and their return by 耽羅 in 661."
types: [diplomacy]
from: japan-state
to: tang-dynasty
date:
  value: 659..661
  mode: duration
  calendar: chinese_lunisolar
  as_written: 己未年七月三日 發自難波三津之浦 — 辛酉年五月二十三日 奉進朝倉之朝
  cite:
    - id: japan-tang-mission-659-time
      says: 伊吉連博德書 dates the departure to 己未年七月 and the report at 朝倉 to 辛酉年五月.
      source: nihon-shoki
      at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書; 齊明天皇七年五月 注 伊吉連博得書
notes:
  Directional; the detention is recorded as the Tang order 博德 reports, and the relationship asserts
  no further causation between the mission and the war.
cite:
  - id: japan-tang-mission-659-basis
    says: The chronicle and the envoy's account it quotes record the mission from dispatch to report.
    source: nihon-shoki
    at: 卷第廿六 齊明天皇五年七月戊寅; 齊明天皇七年五月
