title: 殷 under 武丁 and 婦好
summary: >-
  The 商 capital at 殷, from 盤庚's move about 1300 BCE to the eve of the 周 conquest: 武丁's silent years
  and his minister 傅說, the pheasant omen, the war on 鬼方, the tomb of 婦好, and the first meetings of 商
  and 周. Every date before 841 BCE comes from a modern chronology, and the texts disagree on where
  the capital was.
window: 1300 BCE..1046 BCE
story:
  summary: >-
    殷 as the 商 capital under a modern chronology, about 1300 to 1046 BCE: 盤庚's move to 殷, 武丁's
    reign and minister, the war on 鬼方, the burial of 婦好, the disputed move under 武乙, and the
    contacts and conflict with 周 that lead into the conquest.
  span: 1300 BCE..1046 BCE
  coverage: >-
    The 殷 capital from 盤庚 to the eve of the 周 conquest, as the Han annals, the Bamboo Annals, the
    Book of Documents and the Book of Changes tell it, with the tomb of 婦好 as the one excavated
    site. Every date is a window on the 夏商周斷代工程's chronology, because no source gives an absolute
    year before 841 BCE. Excluded until their sources are read: the oracle-bone inscriptions,
    婦好's campaigns, the excavation of 殷墟 from 1928 and of her tomb in 1976, and the 洹北 city.
    Only 殷墟 and the tomb carry coordinates; every other place is unknown.
  notes: >-
    Step order is presentation order. Every event of 武丁's reign shares one window, so playback
    cannot order them, and it must not: the sources give them no years. The 盤庚 and 武乙 events are
    disputes between the Han annals and the Bamboo Annals and are presented as disputes. This is a
    draft for data and engine testing; no release decision has been taken.
  steps:
    - pangeng-moves-to-yin: 盤庚 moves the capital to 殷 — or to 亳, as the Han annals tell it
    - yin-capital-relocation: The capital moves from 奄 to 殷
    - wuding-silent-years: 武丁 keeps silent for three years
    - fu-yue-found: 武丁 finds 傅說 at 傅險 and makes him minister
    - pheasant-omen: A pheasant on the cauldron, and 武丁's reform
    - gaozong-guifang-war: 高宗 attacks 鬼方 and wins after three years
    - fu-hao-burial: 婦好 is buried at 殷墟
    - wuyi-moves-north: Under 武乙, a move north of the river — or none
    - jili-visits-shang: 季歷 of 周 comes to the 商 court
    - zhou-shang-court-visit: 周 at the 商 court
    - wending-kills-jili: 文丁 kills 季歷
    - shang-zhou-killing-of-jili: 商 against 周
