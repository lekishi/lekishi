      says: The biography records 如海's accusation before the commissioner 班景倩, the search of the temples, and the seizure of 普照, 榮叡 and 道航.
      source: toseiden
      at: 時，如海大瞋，裹頭人州，上採訪廳告曰; 大明寺捉得日本僧普照
