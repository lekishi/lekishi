# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In a ship of Adramyttium the prisoners sail from Caesarea and touch at Sidon, where Julius
  lets Paul visit friends, then cross the sea off Cilicia and Pamphylia to Myra in Lycia, where the
  centurion moves them to an Alexandrian ship bound for Italy."
types: [journey]
part_of:
  - paul-voyage-to-rome
date:
  value: "59..60"
  mode: window
  calendar: julian
  as_written: "Prat (1911): departure for Rome, 59; captivity at Rome, 60-62"
  cite:
    - id: voyage-sidon-myra-date
      says: "Prat's chronology of 1911 dates the departure for Rome to 59 and the captivity at Rome
        from 60, so the voyage and the winter on Malta fall between."
      basis: interpretation
      attributed_to: F. Prat (1911)
      sources:
        - source: catholic-encyclopedia
          at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
          quote: "arrival of Festus, departure for Rome, 59"
        - source: catholic-encyclopedia
          at: "St. Paul, by F. Prat (vol. 11, 1911), Chronology"
          quote: "captivity at Rome, 60-62"
places:
  - place: caesarea-maritima
    role: start
  - place: sidon
    role: waypoint
  - place: myra
    role: end
participants:
  - actor: paul-the-apostle
    role: subject
cite:
  - id: voyage-sidon
    says: Acts tells that the next day they touched at Sidon.
    source: bible-kjv
    at: "Acts 27:3"
    quote: And the next day we touched at Sidon.
  - id: voyage-myra
    says: Acts tells that at Myra the centurion found a ship of Alexandria sailing to Italy and put them aboard.
    role: supporting
    source: bible-kjv
    at: "Acts 27:6"
    quote: And there the centurion found a ship of Alexandria sailing into Italy; and he put us therein.
notes: "Acts tells it, and the dates are Prat's 1911 reckoning, an interpretation: Acts gives no
  years."
