# yaml-language-server: $schema=../../schema/relationship.schema.json
summary: >-
  Aśoka's lay discipleship and his joining the Buddhist Order for a time, in his own words in the first
  Minor Rock Edict.
types: [membership]
from: ashoka
to: buddhist-sangha
notes: >-
  Smith reads saṃghe upayīte as becoming a monk for a time; he notes that some scholars understand it
  less definitely.
cite:
  - id: sangha-membership-basis
    says: >-
      The edict says he was a lay disciple for more than two and a half years and then joined the Order.
    source: asoka-inscriptions
    at: Minor Rock Edict I, Rūpnāth text
    quote: >-
      But it is more than a year since I joined the Order, and have exerted myself strenuously.
