# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Ramesses II has the poem of Kadesh and great reliefs of its scenes carved on the walls of his
  temples, among them Karnak, the Ramesseum, Abu Simbel and Abydos.
types: [other]
date:
  value: 1275 BCE..1213 BCE
  mode: window
  calendar: regnal
  as_written: after year 5 of Ramesses II
  cite:
    - id: kadesh-records-carved-shaw
      says: On Shaw's chronology Ramesses II reigned 1279–1213 BCE, so the span from his year 5
        (1275–1274 BCE) to the end of the reign is 1275–1213 BCE.
      basis: interpretation
      attributed_to: Lekishi editorial reckoning on Ian Shaw's chronology
      source: shaw-oxford-history-ancient-egypt
      at: "chronology table: Nineteenth Dynasty"
places:
  - place: karnak
    role: site
  - place: ramesseum
    role: site
  - place: abu-simbel
    role: site
  - place: abydos-egypt
    role: site
participants:
  - actor: ramesses-ii
    role: leader
cite:
  - id: records-poem
    says:
      The 1914 headnote says the poem was inscribed by Rameses' order on the walls of five temples,
      one at Karnak, with illustrations of its scenes.
    source: petrie-victory-of-ramses
    at: headnote
    quote:
      By order of Rameses, this poem was inscribed upon the walls of five temples, one of which was
      at Karnak. On these walls were also engraved enormous illustrations of the scenes of the poem
  - id: records-temples
    says: Garstang names the Karnak, Ramesseum, Abu Simbel and Abydos records of the reign.
    role: supporting
    source: garstang-land-of-hittites
    at: "ch. VI: fn. 710"
notes: Carving an inscription is not an event of the war; the record keeps where the story was
  published. The window runs from the battle to the end of the reign, 1213 BCE on Shaw's chronology.
