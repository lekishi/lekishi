# yaml-language-server: $schema=../../schema/actor.schema.json
summary: >-
  陳, the 周 state at 宛丘 whose lords claimed descent from 舜, where Confucius lived longest in his travels;
  楚 destroyed it in 479 BCE.
types: [state]
names:
  - form: 陳
    lang: lzh
    script: Hani
    roman: Chen
    scheme: pinyin
    cite:
      - id: chen-state-name
        says: The 孔子世家 records that 吳王夫差 attacked 陳 and took three towns while Confucius was there.
        source: shiji-chunqiu
        at: 卷四十七 孔子世家（吳王夫差伐陳）
        quote: 歲餘，吳王夫差伐陳，取三邑而去。
notes: The state; the city is the place `chen`, minted by the six-states chapter.
