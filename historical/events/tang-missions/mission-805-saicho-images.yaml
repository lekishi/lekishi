# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  葛野麻呂 returns the 節刀 and presents the Tang court's gifts; the monk 最澄, back with the embassy,
  is called to the palace to read sutras and presents Buddhist images from 唐.
types: [exchange]
date:
  value: 805-08
  calendar: regnal
  as_written: 延暦廿四年八月乙巳
  cite:
    - id: mission-805-saicho-time
      says: The chronicle records 最澄's reading and gift on 延暦廿四年八月乙巳.
      source: nihon-koki
      at: 卷第十三 延暦廿四年八月乙巳
      quote: 請入唐求法僧最澄於殿上。悔過讀經。最澄獻唐国佛像。
places:
  - place: heian-kyo
    role: site
    note: The entry says 殿上, the palace.
participants:
  - actor: saicho
    role: participant
  - actor: fujiwara-no-kadonomaro
    role: participant
cites:
  summary:
    - id: mission-805-sekito-return
      says: The chronicle records 葛野麻呂 returning the 節刀 on 延暦廿四年七月戊辰朔.
      source: nihon-koki
      at: 卷第十三 延暦廿四年七月戊辰朔
      quote: 秋七月戊辰朔。遣唐大使從四位上藤原朝臣葛野麻呂上節刀。
