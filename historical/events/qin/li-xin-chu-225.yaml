# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The first Qin invasion of Chu: 李信 attacked 平輿 and his colleague attacked 寢, breaking the Chu forces; 李信 then took 鄢郢 and turned west to join his colleague at 城父. The Chu army followed for three days and nights without rest, broke into two Qin camps, killed seven commandants and routed them."
types: [campaign]
date:
  value: "225 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "始皇帝二十二年（李信攻平輿）; undated in the biography of 王翦"
  cite:
    - says: "The comprehensive mirror records the invasion and the rout under 始皇帝二十二年 (225 BCE)."
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十二年（李信奔還）"
      quote: "大敗李信，入兩壁，殺七都尉；李信奔還。"
places:
  - place: pingyu
    role: waypoint
    note: "Attacked by 李信."
  - place: qin-chu
    role: waypoint
    note: "Attacked by his colleague; it has no position."
  - place: yanying
    role: waypoint
    note: "Taken by 李信; it has no position."
  - place: chengfu
    role: site
    note: "Where the two met and were routed, in the biography's sequence."
participants:
  - actor: li-xin
    role: leader
  - actor: meng-tian
    role: leader
    note: "The colleague the 史記 names; the mirror's editor reads 蒙武."
  - actor: chu-state
    role: subject
notes: "The biography of 王翦 tells the campaign without a year; the date is the mirror's. The places are listed in the biography's order and no route is drawn: the rout's site is not stated beyond the meeting at 城父."
dispute:
  status: disputed
  summary: "The 史記 biography names 蒙恬 as 李信's colleague; the comprehensive mirror's transcription prints 蒙〔武〕(恬), replacing 恬 with 武 on 梁玉繩's argument that 蒙恬 was not yet a general. The chapter publishes the 史記's 蒙恬 and records the editor's reading here; it quotes no bracketed text."
cite:
  - says: "The transcription of the comprehensive mirror emends 李信's colleague from 蒙恬 to 蒙武, following 梁玉繩; the emendation is the editor's reading, not the mirror's text, and is not quoted."
    role: conflicting
    source: zizhi-tongjian-qin-ji-2
    at: "卷七 秦紀二 始皇帝二十二年（李信攻平輿）"
  - says: "The biography records the attacks on 平與 and 寢, the taking of 鄢郢, the meeting at 城父, and the rout."
    role: supporting
    source: shiji-six-states
    at: "卷七十三 白起王翦列傳（李信攻平與，蒙恬攻寢）"
    quote: "李信攻平與，蒙恬攻寢，大破荊軍。信又攻鄢郢，破之，於是引兵而西，與蒙恬會城父。荊人因隨之，三日三夜不頓舍，大破李信軍，入兩壁，殺七都尉，秦軍走。"
