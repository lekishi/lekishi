summary: 'Waiting at Athens for Silas and Timothy, Paul disputes in the synagogue and the market place and is brought to the Areopagus, where he speaks of the altar "to the unknown god"; a few believe, among them Dionysius the Areopagite and Damaris.'
types: [occurrence]
part_of:
  - paul-second-journey
date:
  value: "50..53"
  mode: window
  calendar: julian
  as_written: "Prat (1911): second mission, 50-53"
  cite:
