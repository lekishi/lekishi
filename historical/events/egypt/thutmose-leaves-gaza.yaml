# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  On the next day, the 5th, the king leaves Gaza "in might, in power, and in triumph" to overthrow
  the foe.
types: [campaign]
part_of:
  - megiddo-campaign
date:
  value: 1482 BCE..1457 BCE
  mode: window
  calendar: regnal
  as_written: year 23, I Shemu 5
  cite:
    - id: gaza-departure-date
      says: The annals date this to year 23, I Shemu 5.
      source: breasted-ancient-records
      at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 5 (departure from Gaza)"
      quote:
        Year 23, first month of the third season, on the fifth day; departure from this place in might,
        - in power, and in triumph, to overthrow that wretched foe, to extend the boundaries of Egypt
places:
  - place: gaza
    role: start
participants:
  - actor: thutmose-iii
    role: leader
  - actor: egypt-new-kingdom
    role: participant
cite:
  - id: gaza-departure
    says: The annals record the departure from Gaza on the fifth day.
    source: breasted-ancient-records
    at: "II, Annals of Thutmose III, first campaign: Year 23, I Shemu 5 (departure from Gaza)"
    quote:
      Year 23, first month of the third season, on the fifth day; departure from this place in might,
      - in power, and in triumph, to overthrow that wretched foe, to extend the boundaries of Egypt
notes:
  The annals date by regnal year and the civil calendar, and the conversion to a BCE year depends
  on which chronology of the Eighteenth Dynasty is used. The window spans the dates usually given for
  year 23 of Thutmose III, from about 1482 BCE (a higher chronology) to about 1457 BCE (the lower one
  most used today); Breasted's own 1906 table is within it. It is an editorial bound that a cited chronology
  must replace before approval.
