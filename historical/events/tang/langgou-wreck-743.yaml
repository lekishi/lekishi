  - actor: fusho
    role: participant
  - actor: situo
    role: participant
notes: The twelfth lunisolar month of 天寶二載 falls early in 744 in the Julian calendar; the date keeps the source's month, and a comparison across calendars carries that caveat. The biography sums up his attempts as 五度裝束 (five times made ready) without numbering them, so the chapter does not number this or any attempt.
cites:
  participants:
