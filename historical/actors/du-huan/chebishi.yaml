# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  車鼻施, king of 石國, whom 高仙芝 took under a promised surrender in 天寶九載 (750) and presented at
  court, where the Song history says he was beheaded. His son's flight is what the histories give as
  the start of the 751 war.
types: [person]
names:
  - form: 車鼻施
    lang: lzh
    script: Hani
    roman: Chebishi
    scheme: pinyin
    cite:
      - id: chebishi-name
        says: 高仙芝's biography names the 石國 king 車鼻施, who agreed to surrender and was presented at court and beheaded.
        source: xin-tangshu-tang-west
        at: 卷一三五 高仙芝傳（九載，討石國，其王車鼻施約降）
        quote: 九載，討石國，其王車鼻施約降，仙芝為俘獻闕下，斬之，由是西域不服。
roles:
  - role: ruler
    note: King of 石國 until 750.
notes:
  The western-regions entry names an earlier 石國 prince 那俱車鼻施 enfeoffed as 懷化王 in 天寶初; the
  chapter does not decide whether he is the same man.
