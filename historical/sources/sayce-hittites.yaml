  notes: Sayce died in 1933 and the book was published in 1890, so it is public domain. The
    Egyptian texts it quotes are Brugsch's English translations (the treaty) and Sayce's own
    renderings of the Kadesh poem. Sayce's B.C. dates follow a chronology long abandoned and are
    not used for the records' dates.
notes: Chapter II tells the battle of Kadesh in Ramesses II's fifth year from the Egyptian poem and
  reliefs, the war that followed, and gives Brugsch's translation of the Karnak copy of the treaty
  of year 21 with Kheta-sira (Hattusili III), and the marriage of year 34. It predates the
  Boghazköy archive, so it has no Hittite-side text.
