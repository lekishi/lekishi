# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The fleet comes to another great, broad river full of crocodiles and hippopotami."
types: [occurrence]
part_of: [hanno-voyage]
date:
  value: 570 BCE..470 BCE
  mode: window
  calendar: julian
  as_written: "Ἐκεῖθεν πλέοντες (sailing thence)"
  cite:
    - id: crocodile-river-time
      says: "The account dates none of its stages; this one belongs to the undated voyage, whose window the cited commentators set between about 570 and 470 BCE."
      basis: interpretation
      attributed_to: W. H. Schoff (1913); J. Bostock and H. T. Riley (1855)
      sources:
        - source: hanno-periplus
          at: "10"
        - source: schoff-hanno
          at: Carthaginian Chronology
participants:
  - actor: hanno
    role: leader
notes: "The river is unnamed and has no place record. Schoff identifies it with the Senegal at about 16° 30′ N; not drawn."
cite:
  - id: crocodile-river-account
    says: "The account says the fleet came to another great and broad river full of crocodiles and hippopotami."
    source: hanno-periplus
    at: "10"
    quote: "εἰς ἕτερον ἤλθομεν ποταμὸν μέγαν καὶ πλατύν, γέμοντα κροκοδείλων καὶ ἵππων ποταμίων."
cites:
  notes:
    - id: crocodile-river-senegal
      says: "Schoff identifies the great river full of crocodiles and hippopotami with the Senegal at about 16° 30′ N."
      basis: interpretation
      attributed_to: W. H. Schoff (1913)
      source: schoff-hanno
      at: "The Geography of the Voyage of Hanno, § 10"
      quote: "The great river full of crocodiles and hippopotami is identified with the Senegal at about 16° 30' N."
