notes: The same entry notes a wall inscription left by the Japanese monk 靈仙 in 元和十五年.
cites:
  summary:
    - id: ennin-wutai-distance
      says: The diary counts more than 2,300 里 from 赤山院 and 44 days of actual travel.
      source: nitto-guho-junrei-gyoki
      at: 卷二 開成五年四月廿八日
      quote: 行二千三百餘里。除却虛日。在路行正得卌四日也。
