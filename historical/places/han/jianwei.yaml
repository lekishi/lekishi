# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  犍為, the commandery in 蜀 from which, on 張騫's advice, the court sent envoys by four roads to look
  for a way to 大夏 through 身毒. The source names the commandery and states no seat; the record
  carries no position.
types: [region]
names:
  - form: 犍為
    lang: lzh
    script: Hani
    roman: Qianwei
    scheme: pinyin
    cite:
      - id: jianwei-name
        says: The 大宛列傳 records the court ordering 張騫 to send secret envoys from 蜀 and 犍為 by four roads at once.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（乃令騫因蜀犍為發閒使）
        quote: 乃令騫因蜀犍為發閒使，四道并出
at:
  - interpretation: unknown
    precision: unspecified
    notes: The commandery's seat moved in the second century BCE, and the source names only the
      commandery; no position is asserted.
    cite:
      - id: jianwei-unplaced
        says: The cited entry names 犍為 and states no site for it, so no position is asserted.
        source: shiji-han-frontiers
        at: 卷一百二十三 大宛列傳（乃令騫因蜀犍為發閒使）
