  - key: ennin-diary-838-847
    title: 圓仁's diary, 838–847
    summary: 圓仁's journey of 838–847 as his diary, 入唐求法巡禮行記, tells it day by day, from the
      embassy's crossing and the wreck on the 海陵 coast, through the winter at the 赤山 cloister, the
      pilgrimage on foot to 五臺山 and the years of study in 長安, to the 會昌 persecution, his expulsion
      as a laicized foreign monk, and the voyage home on a Silla ship.
    window: 838..847
    span: 838..847
    coverage: The diary's own account, a single first-person witness, from the embarkation of 838 to
      the vows at 大宰府 at the end of 847, through selected entries; the 長安 years are covered by
      selected events only. Reports 圓仁 only heard, such as the date of the emperor's death, are
      marked on their records. Thirteen places, among them 鎮州, 汾州, 河中府, 同州 and the Silla
      islands of 847, have no identified location yet.
    notes: Step order is the diary's order, not a claim that one event caused another. 閏三月 of
      847 cannot be written in the date notation, so the stops of that month carry a window from
      the third to the fourth month.
