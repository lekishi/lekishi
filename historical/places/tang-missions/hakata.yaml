# yaml-language-server: $schema=../../schema/place.schema.json
summary: 博多大津, the harbour of 筑紫 that missions sailed from and returned to; 伊吉博德 calls it 筑紫大津之浦.
types: [port]
names:
  - form: 筑紫大津之浦
    lang: ja
    script: Hani
    roman: Tsukushi no Ōtsu no ura
    scheme: hepburn
    cite:
      - id: hakata-name
        says: 伊吉博德's account dates the departure from 筑紫大津之浦 to the eleventh day of the eighth month.
        source: nihon-shoki
        at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
        quote: 八月十一日，發自筑紫大津之浦。
  - form: 博多大津
    lang: ja
    script: Hani
    cite:
      - id: hakata-name-1
        says: The chronicle records the 776 ships pulling back to 博多大津.
        source: shoku-nihongi
        at: 卷第卅四 寶龜七年閏八月庚寅
        quote: 乃引還於博多大津。
  - form: 博多津
    lang: ja
    script: Hani
    cite:
      - id: hakata-name-2
        says: The chronicle records a returning 新羅 ship reaching 博多津 in 筑前國.
        source: shoku-nihon-koki
        at: 卷第八 承和六年十月丁巳
        quote: 皈着筑前國博多津。
at:
  - interpretation: approximate_point
    precision: region
    point: [130.385694, 33.5865]
    notes:
      A region-level placement standing for the harbour of 博多大津 on 博多灣, at the 鴻臚館跡, the
      excavated site of the 筑紫館 where missions made ready for the crossing. The cited page does not
      name 博多大津 or locate its anchorage; the point places neither, nor any landing.
    cite:
      - id: hakata-identification
        says:
          The 鴻臚館跡 at 福岡市中央区城内 is the site of the 鴻臚館, called 筑紫館 before the Heian period,
          the 大宰府's reception house for foreign envoys and the place where the 遣唐使 made ready to go
          abroad; excavation from 1987 confirmed its location. The point is the site's modern coordinate
          from Wikidata (CC0), placed to stand for the harbour area the missions used.
        basis: interpretation
        attributed_to: 福岡市 (経済観光文化局 文化財活用課)
        sources:
          - source: fukuoka-bunkazai-korokan
            at: 鴻臚館跡
          - source: wikidata
            at: Q11675677 (P625), revision 2557596639
modern:
  - form: 福岡市
    lang: ja
    script: Hani
    note: Modern city recorded for orientation; the 鴻臚館跡 lies in its 中央区, within the 福岡城跡.
