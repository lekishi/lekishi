# yaml-language-server: $schema=../../schema/journey.schema.json
title: Pepin's second Italian campaign, 756
summary: >-
  Pepin leads the host through Burgundy by Chalon and Janua (read as Geneva) to the Maurienne, over
  the Mont Cenis, through the clusae again, and lays siege to Pavia a second time.
travellers:
  - actor: pepin-the-short
    role: leader
  - actor: frankish-kingdom
    role: participant
stops:
  - chalon-march-756
  - geneva-march-756
  - maurienne-march-756
  - mont-cenis-crossing-756
  - susa-clusae-756
  - pavia-siege-756
cite:
  - id: pepin-campaign-756-sequence
    says: >-
      The continuations narrate the host's march by Chalon and Janua to the Maurienne, over the Mont
      Cenis to the clusae, and on to Ticinum, in this order.
    source: fredegar-continuations
    at: CXXI
    quote: per Cavalonnum urbem, et inde per Januam usque Mauriennam veniens … monte Cinisio transacto, usque ad Clusas … usque ad Ticinum iterum accessit
notes: >-
  Janua is usually Genoa; on this road it is read as Geneva, as the place record says. The pope is
  not on this journey: he was in Rome.
