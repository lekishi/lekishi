# yaml-language-server: $schema=../../schema/event.schema.json
summary: "The Helvetii set 28 March 58 BCE (in the Roman calendar of the day) as the date to gather on the Rhône and cross the Roman province. Caesar hurried to Genava, broke the bridge, put them off until the Ides of April, and in the meantime built a wall and ditch nineteen miles long from Lake Geneva to the Jura; their attempts to cross by boats and fords were beaten back."
types: [campaign]
date:
  value: 58 BCE
  mode: window
  calendar: julian
  as_written: "a. d. V. Kal. Apr. L. Pisone, A. Gabinio consulibus"
  cite:
    - id: helvetii-genava-date
      says: "Caesar gives the day the Helvetii set for their gathering on the bank of the Rhône as the fifth day before the Kalends of April, in the consulship of L. Piso and A. Gabinius (58 BCE)."
      source: caesar-gallic-war
      at: "1.6"
      quote: "Is dies erat a. d. V. Kal. Apr. L. Pisone, A. Gabinio consulibus."
places:
  - place: genava
    role: site
    cite:
      id: helvetii-genava-place
      says: Caesar tells that he reached Genava by forced marches and ordered the bridge there broken.
      source: caesar-gallic-war
      at: "1.7"
      quote: in Galliam ulteriorem contendit et ad Genavam pervenit.
participants:
  - actor: julius-caesar
    role: leader
  - actor: helvetii
    role: subject
cite:
  - id: helvetii-genava-wall
    says: Caesar tells that he drew a wall sixteen feet high and a ditch nineteen miles long from Lake Geneva to the Jura.
    source: caesar-gallic-war
    at: "1.8"
    quote: "a lacu Lemanno, qui in flumen Rhodanum influit, ad montem Iuram, qui fines Sequanorum ab Helvetiis dividit, milia passuum XVIIII murum in altitudinem pedum sedecim fossamque perducit."
notes: "The day is in the pre-Julian Roman calendar, which in 58 BCE ran ahead of the seasons; the chapter dates the event to the year and keeps the Roman date in its own words. The wall is Caesar's description; no line is drawn."
