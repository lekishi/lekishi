# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Shortly before his death Amenhotep III marries Tadukhipa, daughter of Tushratta; the long inventory
  of her dowry is among the tablets.
types: [occurrence]
date:
  value: 1410 BCE..1350 BCE
  mode: window
  calendar: regnal
  as_written: shortly before the death of Amenophis III
participants:
  - actor: amenhotep-iii
    role: participant
  - actor: tadukhipa
    role: participant
  - actor: tushratta
    role: participant
cite:
  - id: tadukhipa-basis
    says: Niebuhr says Nimmuria married Tadukhipa shortly before his death and her dowry list was found.
    source: niebuhr-tell-el-amarna-period
    at: "ch. III: Tadukhipa"
notes:
  "The letters are undated but for a few dockets, and the reigns they fall in convert to BCE according
  to the chronology used: Amenhotep III's accession is put between about 1410 and 1388 BCE, and the end
  of Akhenaten's reign between about 1362 and 1334 BCE. The window spans those placements for the reign
  in question; Niebuhr's 1903 dates (the archive about 1400 B.C., Akhetaten built about 1380 B.C.) fall
  inside it. It is an editorial bound that a cited chronology must replace before approval."
