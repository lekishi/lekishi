summary:
  休屠王, the 匈奴 king of the west whose 祭天金人, the gold figure for sacrificing to heaven, 霍去病
  took in the spring of 121 BCE, and whom the 渾邪王 killed that autumn before surrendering.
types: [person]
names:
  - form: 休屠王
    lang: lzh
    script: Hani
    roman: Xiutu Wang
    scheme: pinyin
    cite:
      - id: xiutu-name
        says: The 匈奴列傳 records 霍去病 taking the 休屠王's gold figure for sacrificing to heaven.
        source: shiji-han-frontiers
        at: 卷一百十 匈奴列傳（破得休屠王祭天金人）
        quote: 破得休屠王祭天金人
