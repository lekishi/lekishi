notes:
  The page states that 吉備真備 drifted to 紀伊国牟漏崎 on his return, that 紀州藩's 紀伊続風土記 considered 牟漏崎
  to be 太地の燈明崎, and that the place is marked as 吉備真備漂着之地. It reports a modern identification (比定),
  not a source statement of the eighth century.
