title: The Lapita expansion into Remote Oceania
summary: "Lapita pottery appears in the Bismarck Archipelago as early as 1521 BCE in one model, and over the next seven centuries the people who made it sailed into islands no one had ever reached, from Vanuatu and New Caledonia to Fiji, Tonga and Sāmoa. There are no texts: every date is a calibrated radiocarbon or U/Th range, and the scholars who model them disagree by up to two centuries. Follow the settlements as the dating has them, and the obsidian that travelled thousands of kilometres from New Britain."
window: 1521 BCE..771 BCE
include:
  [
    talasea-obsidian-lapita-site,
    talasea-obsidian-vatcha,
    talasea-obsidian-vorovoro,
    talasea-obsidian-bukit-tengkorak,
  ]
story:
  summary: "The Lapita expansion, about 1521–801 BCE (3470–2750 cal BP): first pottery on Mussau and in the
    Bismarcks, the crossing into Remote Oceania, the first settlements on Efate, Naigani and Viti Levu, the
    founding of Nukuleka in Tonga and the reach to Mulifanua in Sāmoa, with the obsidian that moved out
    from New Britain."
  span: 1521 BCE..771 BCE
  coverage: "Dates: calibrated radiocarbon and U/Th ranges from six studies, converted to BCE years (BCE =
    BP − 1949), each kept with its probability and original figures in as_written. Where models disagree,
    the site-based Bayesian chronologies (Petchey et al. 2015, Nunn and Petchey 2013, Burley et al. 2012,
    Petchey and Kirch 2019) are the main reading and Denham et al.'s 2012 charcoal model is the
    conflicting one. Places: archaeological sites from Pofatu, islands and regions from GeoNames; Bourewa
    has only a label anchor on Viti Levu. Obsidian: four sourced finds from Pofatu, undated. Excluded: the
    pre-Lapita settlement of Near Oceania, the Lapita sites of New Caledonia and the Reefs beyond those
    the obsidian names, Polynesian Plainware, and any linguistic or genetic reconstruction."
  notes: "No event here is a documented moment: each is a modelled range of when an archaeological signal
    begins, at a stated probability. The window for the crossing is a single year only because the
    contract has no 'about' marker; its source says around 3000 BP. The obsidian links are undated: the one
    the source calls exchange (Bukit Tengkorak) is a trade arc drawn only on selection, and the three that
    show only where obsidian ended up are provenance links the map does not draw. Step order follows the expansion eastward, which the dates support only
    roughly: Naigani's range begins before Teouma's."
