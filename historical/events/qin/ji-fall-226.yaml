# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In the winter of 226 BCE 王翦 took 薊, the Yan capital. The king of Yan and the crown prince withdrew east to 遼東 with their best troops, and 李信 pursued them."
types: [campaign]
date:
  value: "226 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十一年（取燕薊城）; 燕王喜二十九年（秦攻拔我薊）; 始皇帝二十一年冬十月（王翦拔薊）"
  cite:
    - says: "The annals record Qin breaking the crown prince's army and taking 薊 in 二十一年 (226 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十一年（取燕薊城）"
      quote: "乃益發卒詣王翦軍，遂破燕太子軍，取燕薊城，得太子丹之首。燕王東收遼東而王之。"
    - says: "The six-states table records Qin taking 薊 and the king moving to 遼東 in Yan's twenty-ninth year."
      role: supporting
      source: shiji
      at: "卷十五 六國年表 秦始皇二十一年（燕 二十九）"
      quote: "二十九。秦拔我薊，得太子丹。王徙遼東。"
    - says: "The comprehensive mirror dates the taking of 薊 to the tenth month, the first month of the year, and records the withdrawal and 李信's pursuit."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十一年（王翦拔薊）"
      quote: "冬，十月，王翦拔薊，燕王及太子率其精兵東保遼東，李信急追之。"
places:
  - place: ji-yan
    role: site
    note: "The capital taken."
  - place: liaodong
    role: context
    note: "Where the king withdrew."
participants:
  - actor: wang-jian
    role: leader
  - actor: li-xin
    role: participant
    note: "Pursued the king, in the mirror."
  - actor: yan-king-xi
    role: subject
  - actor: yan-state
    role: subject
notes: "The mirror's 冬十月 is the first month of the Qin year, so the event is dated to the year and the month is kept as written. The biography of the assassins says the city fell ten months after the attempt (十月而拔薊城), which may be the same expression read as a duration; the chapter does not decide."
