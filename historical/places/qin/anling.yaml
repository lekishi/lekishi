# yaml-language-server: $schema=../../schema/place.schema.json
summary: "安陵, the small fief of the lord of 安陵, whom the comprehensive mirror records refusing in 225 BCE the king of Qin's offer to exchange it for five hundred 里 of land. The record's label anchor sits at modern 鄢陵縣, in whose north-west the historical geography places the old city."
types: [settlement]
names:
  - form: "安陵"
    lang: lzh
    script: Hani
    roman: Anling
    scheme: pinyin
    cite:
      - says: "The comprehensive mirror records the king of Qin offering to exchange five hundred 里 of land for 安陵."
        source: zizhi-tongjian-qin-ji-2
        at: "卷七 秦紀二 始皇帝二十二年（欲以五百里地易安陵）"
        quote: "寡人欲以五百里地易安陵。"
at:
  - interpretation: display_anchor
    precision: unspecified
    point: [114.17633, 34.10083]
    notes: "Label anchor at modern 鄢陵縣, Wikidata Q1198943. It is not an asserted historical coordinate: the primary entries name the place and state no site, and the anchor places no wall, palace or battlefield. Region-level: the gazetteer quotes the 括地志 for a distance from the county seat, which the record does not use."
    cite:
      - says: "The historical geography records the old city of 安陵 north-west of its own 鄢陵縣, the fief of the lord of 安陵, and the king's offer."
        role: supporting
        source: dushi-fangyu-jiyao-six-states
        at: "卷四十七 河南二 開封府 鄢陵縣（安陵城）"
        quote: "秦始皇二十二年滅魏，欲以五百里地易安陵。"
      - says: "The label anchor is placed at the coordinate Wikidata (CC0) records for the modern place; no historical coordinate is asserted."
        source: wikidata
        at: "Q1198943 (P625), revision 2531866830"
modern:
  - form: "鄢陵縣"
    lang: zh-Hant
    script: Hani
    note: "Modern county recorded for orientation only."
notes: "The mirror's account comes from the 戰國策 tradition; the annals do not record it."
