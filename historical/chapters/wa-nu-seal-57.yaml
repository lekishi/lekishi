# yaml-language-server: $schema=../schema/chapter.schema.json
title: The 倭奴國 embassy and the seal, 57 CE
summary:
  In the first month of 57 CE an envoy from the 倭奴國, at the southern edge of 倭, came to the Han
  court at 洛陽, and 光武帝 gave him a seal and cord weeks before he died. Fifty years later 倭 came
  again; seventeen centuries later a gold seal inscribed 漢委奴國王 turned up on 志賀島.
window: 57..57
story:
  summary:
    "The 倭奴國 embassy of 57 CE as the 後漢書 records it, the seal and cord 光武帝 gave, his death, and
    two coda nodes: the 倭 embassy of 107 and the find of the gold seal on 志賀島 in 1784."
  span: 57..1784
  coverage:
    "The 後漢書's two notices of the embassy (光武帝紀 and 東夷列傳) and the 東夷列傳's entry for 107.
    The 1784 find is dated and placed from Wikidata alone. Excluded: the seal's inscription, reading
    and authenticity, which no cited source states; the 魏志倭人傳 and later embassies; the route by
    sea. The 倭奴國 has no position, so the map shows only 洛陽 and 志賀島."
  notes:
    "Step order is presentation order. The coda steps are labelled in their captions. The chapter
    never claims that the seal found in 1784 is the seal of 57 CE; the connection is modern
    scholarship's and is stated as such in the records."
  steps:
    - wa-nu-embassy-57: The 倭奴國 envoy comes to court at 洛陽, first month of 57 CE
    - seal-grant-57: 光武帝 gives the envoy a seal and cord
    - guangwu-death-57: 光武帝 dies at 洛陽, 29 March 57
    - wa-embassy-107: Coda — 107 CE, 帥升 of 倭 presents 160 captives
    - seal-found-1784: Coda — 1784, a gold seal inscribed 漢委奴國王 is found on 志賀島
