# yaml-language-server: $schema=../schema/chapter.schema.json
title: Rome and Kush on the Nile, 25 BCE–65 CE
summary: Between 25 BCE and 22 BCE Kush strikes Roman Egypt at Syene and Rome answers with a campaign to
  Napata; the Candace's envoys win terms from Augustus at Samos. Two generations later Nero's men go up
  the Nile to Meroë and the great marshes beyond.
window: 25 BCE..20 BCE
story:
  summary: 'Rome and Kush on the Nile, 25 BCE–65 CE: the Kushite attack on Syene, Petronius''s campaign
    to Napata, the siege of Premnis and the terms at Samos, then Nero''s praetorians to Meroë and his
    centurions to the marshes.'
  span: 25 BCE..67
  coverage: 'The war of 25–21 BCE as Strabo, Dio, Pliny and the Res Gestae tell it, and Nero''s exploration
    as Pliny, Seneca and Dio''s epitome tell it. Excluded: Cornelius Gallus''s settlement at Philae in
    29 BCE, whose trilingual stela has no public-domain translation read yet; the Meroë head of Augustus,
    pending a source for its find; the Meroitic side, which no source read here gives; and Aelius Gallus''s
    Arabian campaign. Pliny''s five unlocated towns of Petronius have no place records. Alexandria waits
    for the shared record.'
  notes: Step order is presentation order. The war's accounts give no years and are dated by window. Pliny's
    praetorians, Seneca's centurions and Dio's spies are three accounts kept apart, because the sources
    do not say they are one mission. Journeys (Petronius's march, the praetorians' road) wait on the journey
    record kind; their stops are listed in the chapter's notes.
  steps:
  - kush-attack-syene: The Kushites take Syene, Elephantine and Philae
  - petronius-at-pselchis: Petronius drives them back and takes Pselchis
  - petronius-takes-premnis: Premnis falls at the first onset
  - petronius-razes-napata: Napata, the Candace's royal seat, is razed
  - petronius-towns-pliny: Pliny's list of the towns taken
  - premnis-garrisoned: A garrison at Premnis, and prisoners for Caesar
  - candace-attacks-premnis: The Candace attacks Premnis
  - kush-rome-war: Kush and Rome at war on the Nile frontier
  - kush-envoys-at-samos: The Candace's envoys reach Augustus at Samos
  - kush-rome-samos-terms: The terms of Samos
  - nero-praetorians-sent: Coda — Nero sends praetorians up the Nile
  - nero-praetorians-itinerary: Coda — the road from Syene to Meroë, stage by stage
  - nero-praetorians-at-meroe: Coda — Meroë under a Candace
  - nero-plan-of-ethiopia: Coda — a plan of Ethiopia for Nero
  - centurions-reach-marshes: Coda — two centurions reach the great marshes
  - nero-kush-exploration: The king of Ethiopia helps Nero's men
  - nero-sends-spies-ethiopia: 'Coda — Dio''s epitome: spies instead of a war'
