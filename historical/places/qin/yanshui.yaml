        source: shiji-six-states
        at: "卷八十六 刺客列傳（丹匿衍水中）"
        quote: "其後李信追丹，丹匿衍水中，燕王乃使使斬太子丹，欲獻之秦。"
at:
  - interpretation: unknown
    precision: unspecified
    notes: "The sources name the river and state no location, and no source the chapter cites identifies it. A traditional identification with a modern river exists in later scholarship but is not cited here, so the record asserts no position."
