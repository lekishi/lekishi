# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 53 BCE Caesar bridged the Rhine a second time, a little above his first bridge, because
  the Germans had sent help to the Treveri and to keep Ambiorix from finding refuge across the
  river; the work, by now a known method, took a few days."
types: [campaign]
date:
  value: 53 BCE
  mode: window
  calendar: julian
  as_written: "the year of book VI (one commentary a year, from 58 BCE)"
  cite:
    - id: second-rhine-crossing-53-year
      says: "Hirtius writes that Caesar composed one commentary for each year, and book I is dated by the consuls of 58 BCE, so each book is one year from 58 BCE. Holmes's narrative of the war puts it in 53 BCE."
      basis: conventional
      convention: One commentary a year from the consuls of book I (58 BCE), as Hirtius says, on the standard chronology of the Gallic War
      sources:
        - source: caesar-gallic-war
          at: "1.6"
          quote: "L. Pisone, A. Gabinio consulibus."
        - source: caesar-gallic-war
          at: "8.48"
          quote: Scio Caesarem singulorum annorum singulos commentarios confecisse
        - source: holmes-caesars-conquest-of-gaul
          at: "ch. VI, p. 123 (margin: 53 B.C.)"
          quote: "he again threw a bridge across the Rhine, a little above the site of the former one"
places:
  - place: rhine
    role: site
    cite:
      id: second-rhine-place
      says: Caesar tells that he began to build a bridge a little above the place where he had taken the army across before.
      source: caesar-gallic-war
      at: "6.9"
      quote: His constitutis rebus paulum supra eum locum quo ante exercitum traduxerat facere pontem instituit.
participants:
  - actor: julius-caesar
    role: leader
notes: "Caesar's own account: he commanded the army and wrote the report, and the numbers in it are
  his."
