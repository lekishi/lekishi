title: The Jewish–Roman war
summary: "The first Jewish revolt against Rome as Josephus tells it, 66–73 CE: from the outbreak
  at Caesarea and the rout of Cestius at Beth-horon, through Vespasian's campaign in Galilee and
  Josephus's own surrender at Jotapata, to the siege and burning of Jerusalem and the fall of Masada."
window: 66..73
story:
  summary: "The war of 66–73 CE in Josephus's Jewish War: a history by a man who fought on both sides
    and wrote under the emperors who won it. The months and days are his; the years come from
    reference works of 1737 and 1910, and say so."
  span: 66..73
  coverage: "From the outbreak at Caesarea in 66 to the fall of Masada, as books II–VII of the Jewish
    War tell them. Excluded: the causes Josephus traces back to Pompey and Herod, the civil war
    among the rebel parties inside Jerusalem as events of their own, the sieges of Jerusalem's
    walls one by one, the wars of the year of the four emperors, the triumph at Rome (Josephus gives
    no year for it), and the aftermath at Alexandria and Cyrene. Places are drawn where the
    gazetteer locates them; no front, siege line or territory is drawn."
  notes: "Every event is Josephus's account. He commanded in Galilee until his surrender at Jotapata,
    watched the siege of Jerusalem from Titus's camp, and wrote in Rome under Flavian patronage; his
    numbers are his. He dates by Macedonian month and regnal year, and the records keep his words in
    as_written. The Julian years are interpretations from Whiston's notes (1737) and the Catholic
    Encyclopedia (1910), cited as such."
