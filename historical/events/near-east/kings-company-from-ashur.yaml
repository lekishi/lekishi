# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  In a letter to Sin-idinnam, Hammurabi orders 240 men of "the King's Company" who have left the
  country of Ashur and the district of Shitullum sent to him. King and Hall read it as proof that Assyria
  was then part of the Babylonian empire.
types: [other]
part_of: [hammurabi-reign]
date:
  value: 1792 BCE..1750 BCE
  mode: window
  calendar: unknown
  as_written: not dated; a letter to Sin-idinnam
  cite:
    - says: The Louvre dates Hammurabi's reign, and the stele, to -1792/-1750, the modern middle chronology.
      basis: interpretation
      attributed_to: Musée du Louvre
      source: louvre-code-of-hammurabi
      at: "caption: Code de Hammurabi, -1792 / -1750"
places:
  - place: ashur
    role: context
    note: The country the men had left; the letter names the country, not the city.
  - place: larsa
    role: context
    note: Sin-idinnam's seat.
participants:
  - actor: hammurabi
    role: leader
  - actor: sin-idinnam
    role: participant
cite:
  - says:
      King and Hall quote the letter ordering the dispatch of 240 men of the King's Company who have
      left the country of Ashur.
    basis: interpretation
    attributed_to: L. W. King and H. R. Hall (1906)
    source: king-hall-history
    at: chapter VIII (the Assyrian and Neo-Babylonian empires)
    quote:
      two hundred and forty men of ‘the King’s Company’ under the command of Nannar-iddina... who have
      left the country of Ashur and the district of Shitullum
  - says: They infer that Assyria formed an integral part of the Babylonian empire.
    role: supporting
    basis: interpretation
    attributed_to: L. W. King and H. R. Hall (1906)
    source: king-hall-history
    at: chapter VIII (the Assyrian and Neo-Babylonian empires)
    quote: the country formed an integral part of the Babylonian empire
notes:
  King and Hall's inference about Assyria is a reading of 1906; the chapter cites it as theirs and
  does not adopt it. The text dates the event by the year-name of Hammurabi's thirty-first or a later
  year. No cited source converts that year to a BCE year, so the date is the reign's window in the middle
  chronology the Louvre uses; a regnal calendar with a cited epoch would narrow it to one year. The year
  depends on the chronology, which the reign records as a dispute.
