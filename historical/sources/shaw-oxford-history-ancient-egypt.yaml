notes:
  The chronology the owner chose on 2026-10-22 for the Bronze Age chapters. Reign dates used - Hatshepsut
  1473–1458 BCE, Thutmose III 1479–1425 BCE, Amenhotep III 1390–1352 BCE, Amenhotep IV (Akhenaten)
  1352–1336 BCE, Seti I 1294–1279 BCE, Ramesses II 1279–1213 BCE. A regnal year is counted from the
  accession year, so year n of a king who came to the throne in year A BCE falls in A−n+1 to A−n BCE.
  The figures were read on 2026-10-22 from the reign-date tables of P. Lundström, Pharaohs of Ancient
  Egypt (pharaoh.se), which list them under Shaw beside Hornung, von Beckerath and others.
