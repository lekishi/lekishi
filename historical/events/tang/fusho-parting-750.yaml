summary: At 韶州 普照 takes leave of 鑒眞 to go north to 阿育王寺 in 明州. Holding his hand, 鑒眞 weeps that he vowed to cross the sea to transmit the precepts and has not reached Japan.
types: [occurrence]
date:
  value: "750"
  calendar: chinese_lunisolar
  as_written: 是歲，天寶九載也
  cite:
