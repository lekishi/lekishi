notes: >-
  The Han-era history's chapters on the 春秋 period: the 秦 annals, the table of the twelve lords,
  the hereditary houses of 魯, 蔡, 曹, 陳, 衛, 宋, 晉, 楚 and 鄭, and the lives of Confucius and his
  disciples. The table counts years continuously from the 共和 regency, whose first year is 841
  BCE, and is the ground for every absolute year in these chapters. The table's 公元前 column is the
  transcription's addition, not the work's. A separate source record from `shiji` and
  `shiji-yin-zhou`, so that adding these chapters reopens no approval.
