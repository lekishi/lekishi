# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Alashiya, a copper-exporting kingdom whose king wrote short business letters to Egypt and told
  of a plague. It is now usually identified with Cyprus; Niebuhr put it on the Cilician coast.
types: [state]
names:
  - form: Alashia
    lang: akk
    script: Latn
    note: Niebuhr's spelling.
    cite:
      - id: alashiya-name
        says: Niebuhr says a prince of Alashia wrote short business letters.
        source: niebuhr-tell-el-amarna-period
        at: "ch. III: Alashia"
notes:
  "Not placed: the identification with Cyprus is later than Niebuhr and no source read for this chapter
  states it."
