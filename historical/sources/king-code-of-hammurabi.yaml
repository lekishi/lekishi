notes:
  "The law code on the basalt stele now in the Louvre. Its prologue is a royal roll of the cities
  whose temples and people Hammurabi claims to have cared for, from Eridu and Ur to Ashur, Nineveh,
  Mari and Tuttul. It is the king's own claim of dominion, not a list of conquests with dates, and
  the records cite it as what the prologue says."
