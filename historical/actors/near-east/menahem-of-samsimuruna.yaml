summary:
  Menachem of Shamsimuruna, one of the kings of Amurru whom the prism lists bringing presents and
  heavy tribute to Sennacherib in 701 BCE.
types: [person]
names:
  - form: Menachem
    lang: en
    script: Latn
    cite:
      - id: menahem-of-samsimuruna-name
        says: The prism lists Menachem among the kings who brought tribute.
        source: luckenbill-annals-sennacherib
        at: p. 30, Oriental Institute prism col. II 50
        quote: From Menachem, the Shamsimurunite,
roles:
  - role: ruler
    note: Ruler of Shamsimuruna; the prism lists him among "kings of Amurru, all of them".
    cite:
      says: The prism lists Menachem among the kings who brought tribute.
      source: luckenbill-annals-sennacherib
      at: p. 30, Oriental Institute prism col. II 50
      quote: From Menachem, the Shamsimurunite,
