# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  忠, nephew of the former 疏勒 king 成, whom 班超 made king of 疏勒 in place of 龜茲's 兜題; he later
  went over to 莎車 and 康居, and 班超 had him killed at a feast.
types: [person]
names:
  - form: 忠
    lang: lzh
    script: Hani
    roman: Zhong
    scheme: pinyin
    note: Known only by this personal name; the record id adds 疏勒 for clarity.
    cite:
      - id: shule-zhong-name
        says: The 疏勒 entry records 班超 seizing 兜題 and making 成's nephew 忠 king, and later killing him when he rebelled.
        source: hou-hanshu
        at: 卷八十八 西域傳 疏勒國
        quote: 冬，漢遣軍司馬班超劫縛兜題，而立成之兄子忠為疏勒王。忠後反畔，超擊斬之。
