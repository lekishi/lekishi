    lang: lzh
    script: Hani
    roman: Dengzhou
    scheme: pinyin
    cite:
      - id: dengzhou-name
        says: The diary records reaching 登州 and lodging at its 開元寺.
        source: nitto-guho-junrei-gyoki
        at: 卷二 開成五年三月二日
        quote: 到登州入開元寺宿。
