# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Muza, crowded with Arab ship-owners and seamen trading to the far-side coast and to Barygaza;
  gifts go to the king Charibael and the chief Cholaebus.
types: [exchange]
part_of: [periplus-voyage]
date:
  value: 58..62
  mode: window
  calendar: julian
  as_written: no date; the text speaks of the present
  cite:
    - id: muza-market-time
      says:
        The Periplus describes this as present at the time of the voyage it was written from, which
        it does not date; Schoff puts that voyage between the summers of 58 and 62 CE.
      basis: interpretation
      attributed_to: W. H. Schoff (1912)
      sources:
        - source: periplus-erythraean-sea
          at: 21–24
        - source: schoff-periplus
          at: Date and Authorship of the Periplus
places:
  - place: muza
    role: site
  - place: saphar
    role: context
participants:
  - actor: charibael
    role: host
  - actor: cholaebus
    role: host
cite:
  - id: muza-market-account
    says: The Periplus says Muza is crowded with Arab ship-owners and seafaring men and busy with commerce.
    source: periplus-erythraean-sea
    at: 21–24
    quote:
      And the whole place is crowded with Arab ship-owners and seafaring men, and is busy with the
      affairs of commerce
