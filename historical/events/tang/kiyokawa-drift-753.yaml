# yaml-language-server: $schema=../../schema/event.schema.json
summary: On the return voyage 藤原清河's ship is driven by contrary winds to 驩州 on Tang's southern
  frontier; the notice records that he alone escaped and remained in Tang.
types: [journey]
date:
  value: 753..754
  mode: window
  calendar: regnal
  as_written: 廻日遭逆風漂著唐國南邊驩州（寶龜十年二月乙亥 贈位記事）
  cite:
    - id: kiyokawa-drift-time
      says:
        The chronicle's 寶龜十年二月乙亥 notice records that on the return 藤原清河's ship was driven to 驩州 on
        Tang's southern frontier and that he alone escaped.
      source: shoku-nihongi
      at: 卷第卅五 寶龜十年二月乙亥
      quote: 勝寳五年。爲大使入唐。廻日遭逆風漂著唐國南邊驩州。時遇土人。及合船被害。清河僅以身免。遂留唐國。不得歸朝。
places:
  - place: huanzhou
    role: site
participants:
  - actor: fujiwara-no-kiyokawa
    role: leader
notes: The notice does not state a day or month for the drift, so the event is an occurrence window
  over the return years rather than an instant; it must not be animated as continuous activity or
  anchored at a midpoint. The notice was made in 779, about twenty-five years after the voyage.
cites:
  places:
    - id: kiyokawa-drift-place
      says: The notice names 驩州 on Tang's southern frontier as the place the ship was driven to.
      source: shoku-nihongi
      at: 卷第卅五 寶龜十年二月乙亥
