summary:
  麹文泰 sends the 葉護可汗 silk, fruit and a letter commending 玄奘 as his brother and asking for horses
  and escorts through the western countries; the khagan reads the letters at 素葉城 and does as asked.
types: [diplomacy]
from: qu-wentai
to: yabghu-khagan
date:
  value: 629..630
  mode: window
  calendar: chinese_lunisolar
  as_written: 並書稱：法師者是奴弟
cite:
  - id: gaochang-turks-letters-basis
    says: The biography quotes the king's letter to the 葉護可汗.
    source: cien-zhuan
    at: 卷一（法師者是奴弟）
    quote: 法師者是奴弟，欲求法於婆羅門國
