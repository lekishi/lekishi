notes: >-
  Used for the chapter's absolute chronology (Smith's "Chronology of the Maurya Period",
  which counts the consecration as regnal year 1 in 269 BCE and calls the Indian dates "merely
  approximate"), for the location and description of the inscribed rocks and pillars (chapter
  III), for the identifications of Tosali, Samāpā and Suvarṇagiri, and for Smith's retellings of
  the Ceylon chronicles (chapter VI, from the Dīpavaṃsa and Mahāvaṃsa) and of the Aśokāvadāna
  (chapter VII), which Smith relates "simply as legends". Wikisource revisions read: chapter I
  6170321 (the chronology), II 6170316, III 6170320, VI 6170335, VII 6170341.
