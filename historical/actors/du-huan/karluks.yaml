summary: 葛羅祿 (葛邏祿), the Turkic people whose troops, in the mirror's account, turned against the Tang army during the five-day standoff at 恆羅斯城 in 751 and attacked it with 大食.
types: [community]
names:
  - form: 葛羅祿
    lang: lzh
    script: Hani
    roman: Geluolu
    scheme: pinyin
    cite:
      - id: karluks-name
        says: The mirror records the 葛羅祿 contingent defecting and attacking the Tang army together with 大食.
        source: zizhi-tongjian
        at: 卷二一六 唐紀三十二 天寶十載（葛羅祿部衆叛）
        quote: 相持五日，葛羅祿部衆叛，與大食夾攻唐軍
  - form: 葛邏祿
    lang: lzh
    script: Hani
    note: The spelling the mirror uses elsewhere (卷二一五, 卷二一六 天寶十二載).
    cite:
      - id: karluks-variant
        says: The mirror spells the name 葛邏祿 in its other notices of the people.
        source: zizhi-tongjian
        at: 卷二一五 唐紀三十一 天寶元年（突厥拔悉蜜、回紇、葛邏祿三部）
