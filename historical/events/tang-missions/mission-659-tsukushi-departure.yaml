summary: The ships leave 筑紫大津之浦 for the crossing.
types: [journey]
date:
  value: 659-08-11
  calendar: chinese_lunisolar
  as_written: 八月十一日
  cite:
    - id: mission-659-tsukushi-time
      says: 伊吉連博德書 dates the departure from 筑紫大津之浦 to the eleventh day of the eighth month.
      source: nihon-shoki
      at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
      quote: 八月十一日，發自筑紫大津之浦。
places:
  - place: hakata
    role: start
    note: 博德 names 筑紫大津之浦. The record takes it as the harbour later called 博多大津, an
      identification the place record cites to early-modern commentaries, not to the chronicle.
participants:
  - actor: sakaibe-no-iwashiki
    role: leader
  - actor: tsumori-no-kisa
    role: leader
notes:
  On the 13th they reach an unnamed island off southern Paekche (嶋名毋分明) and on the 14th leave it
  together for the open sea; the island is not identified, so it has no event of its own.
