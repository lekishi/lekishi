# yaml-language-server: $schema=../schema/chapter.schema.json
title: 秦始皇's tours of the empire, 220–210 BCE
summary:
  From 220 BCE to 210 BCE, the ten years after unification, 始皇 toured his empire five times. He went west to 隴西, made
  the 封 sacrifice on 泰山, set up inscribed stones along the eastern sea, sent 徐巿 to look for the
  immortals, and died on the road at 沙丘, where 趙高, 胡亥 and 李斯 forged his will.
window: 220 BCE..210 BCE
story:
  summary:
    "The five tours of the 秦始皇本紀: the west in 220, the great eastern tour of 219 to 泰山, 瑯邪 and
    湘山, 之罘 and the ambush at 博狼沙 in 218, 碣石 and the north in 215, and the last tour of
    211–210 to 會稽 and 之罘 that ended with his death at 沙丘 and the cortege's return to 咸陽."
  span: 220 BCE..210 BCE
  coverage:
    "The tours as the 史記's 秦始皇本紀 records them, with its own order of places. Excluded: the
    texts of the inscriptions, which the record names but does not reproduce; the court events
    between the tours; the 留侯世家's account of the 博狼沙 attack. 雞頭山, 回中, 梁父, 雲夢, 丹陽 and
    江乘 have no position, so those legs cannot be drawn. Display anchors sit at modern places of the
    same name and assert no historical site."
  notes:
    "Step order is presentation order and follows the annals. Qin years began in the tenth month,
    so the last tour set out late in 211 BCE. Within each year the annals give few months, and the
    events of the last tour share a wide window between the eleventh month and the seventh."
  steps:
    - west-tour-220: Through 隴西 and 北地, 220 BCE
    - yishan-stele-219: A stone on 鄒嶧山 and a debate with the 魯 scholars, 219 BCE
    - taishan-feng-219: The 封 on 泰山 and the 禪 at 梁父
    - chengshan-zhifu-219: East along the sea to 成山 and 之罘
    - langya-terrace-219: Three months at 瑯邪 and the 瑯邪臺
    - xu-fu-voyage-219: 徐巿 sails to find the immortals
    - pengcheng-tripod-219: Diving for the 周 tripod at 彭城
    - xiangshan-storm-219: The storm at 湘山 and the return by 武關
    - bolangsha-attack-218: Ambushed at 博狼沙, 218 BCE
    - zhifu-stele-218: Inscriptions on 之罘, home through 上黨
    - jieshi-215: 碣石 and the search for immortals, 215 BCE
    - northern-border-215: Along the northern frontier to 上郡
    - last-tour-departure-211: The last tour sets out with 李斯 and 胡亥, late 211 BCE
    - yunmeng-210: 雲夢 and the sacrifice to 舜
    - qiantang-crossing-210: Down the 江 to 錢唐
    - kuaiji-stele-210: The last inscription, on 會稽
    - coast-north-210: Back north by 吳 and 江乘 to 瑯邪
    - great-fish-210: The great fish at 之罘
    - pingyuan-illness-210: Taken ill at 平原津
    - shihuang-death-210: Death at 沙丘, 10 September 210 BCE
    - shaqiu-plot-210: The forged edict at 沙丘
    - cortege-return-210: The cortege returns by 九原 and the 直道 to 咸陽
