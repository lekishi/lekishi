# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Hammurabi defeats the army of Elam. King and Hall read the formulas of his thirtieth year as
  recording both the defeat of the Elamite army and the overthrow of Rim-Sin; the Catholic Encyclopedia
  puts only the defeat of Elam in that year.
types: [occurrence]
part_of: [hammurabi-reign]
date:
  value: 1792 BCE..1750 BCE
  mode: window
  calendar: regnal
  as_written: the thirtieth year of his reign, by its date-formula
  cite:
    - says: The Louvre dates Hammurabi's reign, and the stele, to -1792/-1750, the modern middle chronology.
      basis: interpretation
      attributed_to: Musée du Louvre
      source: louvre-code-of-hammurabi
      at: "caption: Code de Hammurabi, -1792 / -1750"
participants:
  - actor: hammurabi
    role: leader
  - actor: first-dynasty-of-babylon
    role: participant
  - actor: elam
    role: participant
cite:
  - says:
      King and Hall say the formulas of the thirtieth year record that he defeated the Elamite army
      and overthrew Rim-Sin.
    basis: interpretation
    attributed_to: L. W. King and H. R. Hall (1906)
    source: king-hall-history
    at: chapter V (Elam and Babylon)
    quote:
      the thirtieth year of his reign, when it is recorded in the formulas that he defeated the Elamite
      army and overthrew Rim-Sin
  - says:
      The Catholic Encyclopedia says that in his thirtieth year Hammurabi defeated the army of Kudur-Lagamar
      (?), king of Elam, and so won Babylonia's independence.
    role: supporting
    basis: interpretation
    attributed_to: C. L. Souvay, Catholic Encyclopedia (1910)
    source: catholic-encyclopedia
    at: Hammurabi (Charles L. Souvay)
    quote:
      In the thirtieth year of his reign, Hammurabi defeated the army of Kudur-Lagamar (?), King of
      Elam, thereby winning Babylonia‘s independence
notes:
  "No place is recorded: neither source says where the battle was fought. The text dates the event
  by the year-name of Hammurabi's thirtieth year. No cited source converts that year to a BCE year, so
  the date is the reign's window in the middle chronology the Louvre uses; a regnal calendar with a cited
  epoch would narrow it to one year. The year depends on the chronology, which the reign records as a
  dispute."
