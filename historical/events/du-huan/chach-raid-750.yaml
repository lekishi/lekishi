# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  "高仙芝 feigns a peace with 石國, then attacks it, carries off its king and people and kills the old
  and weak, taking a great haul of 瑟瑟, gold, horses and goods for himself. The mirror enters the raid
  under the twelfth month of 天寶九載 (750); 李嗣業's biography in 舊唐書 puts the campaign in 十載."
types: [campaign]
date:
  value: 750-12
  calendar: chinese_lunisolar
  as_written: 天寶九載十二月（資治通鑑）; 九載（舊唐書 高仙芝傳、新唐書 高仙芝傳）; 十載（舊唐書 李嗣業傳）
  cite:
    - id: chach-raid-time
      says: The mirror enters 高仙芝's feigned peace and raid on 石國 among the notices of the twelfth month of 天寶九載.
      source: zizhi-tongjian
      at: 卷二一六 唐紀三十二 天寶九載十二月（安西四鎭節度使髙仙芝偽與石國約和）
      quote: 安西四鎭節度使髙仙芝偽與石國約和，引兵襲之，虜其王及部衆以歸，悉殺其老弱。
    - id: chach-raid-jiu
      says: 高仙芝's biography in 舊唐書 records the campaign against 石國 and the capture of its king in 九載.
      role: supporting
      source: jiu-tangshu
      at: 卷一〇四 高仙芝傳（九載，將兵討石國）
      quote: 九載，將兵討石國，平之，獲其國王以歸。
    - id: chach-raid-li-siye
      says: 李嗣業's biography in 舊唐書 puts his part in the conquest of 石國 in 十載.
      role: conflicting
      source: jiu-tangshu
      at: 卷一〇九 李嗣業傳（十載，又從平石國）
      quote: 十載，又從平石國，及破九國胡並背叛突騎施
places:
  - place: chach
    role: site
participants:
  - actor: gao-xianzhi
    role: leader
  - actor: li-siye
    role: participant
    cite:
      - id: chach-raid-li-siye-part
        says: 李嗣業's biography says he took part in the conquest of 石國.
        source: jiu-tangshu
        at: 卷一〇九 李嗣業傳（十載，又從平石國）
  - actor: chebishi
    role: subject
  - actor: shi-state
    role: subject
notes:
  "The mirror's month is the month heading the notice stands under. Three of the four accounts give
  天寶九載; 李嗣業's biography gives 十載, perhaps counting to the presentation of the captives early in
  十載. The chapter publishes the mirror's month and keeps the biography's year as conflicting."
dispute:
  status: disputed
  summary:
    The mirror and both 高仙芝 biographies give 天寶九載; 李嗣業's biography in 舊唐書 gives 十載. The
    chapter publishes 天寶九載十二月 and keeps 十載 as a conflicting claim.
