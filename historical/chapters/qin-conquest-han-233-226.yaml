# yaml-language-server: $schema=../schema/chapter.schema.json
title: The end of the state of Han
summary: In 233 BCE the king of Han offered his submission to Qin; by 230 BCE Qin had taken the
  state, and in 226 BCE its former capital 新鄭 revolted. Follow 韓非's embassy and disputed death, the
  cession of 南陽, and the making of the 潁川 commandery.
window: 233 BCE..226 BCE
story:
  summary: "The end of the state of Han under Qin, 233–226 BCE: the submission and embassy, the
    detention and death of 韓非, the cession of 南陽, the annexation and the 潁川 commandery, and the
    revolt of the former capital."
  span: 233 BCE..226 BCE
  coverage: "Episode window 233–226 BCE: the Han king's submission and 韓非's embassy, the detention and
    death at 雲陽, the cession of 南陽, the 230 BCE annexation and the 潁川 commandery, and the 226 BCE
    revolt of 新鄭. Excluded: the other notices of the cited years (the 233 BCE Zhao campaign, the
    annals' 230 BCE earthquake, 華陽太后, and famine notices, and the 226 BCE 昌平君徙於郢), the 246 BCE 鄭國
    canal, the 227–226 BCE Yan campaign and 荊軻's attempt, earlier Qin–Han wars, and every later Qin
    conquest. No route, campaign path, or territory is drawn, and no place carries an asserted
    coordinate. Label positions only: 新鄭, 雲陽, and the 潁川 commandery carry label anchors at the
    places the cited sources record or identify (see the places' records), and 南陽 stays without a
    position because the entries state no extent or seat and the name covers two regions in the
    cited historical geography."
  notes: "Step order is presentation order, not a claim that one event caused another; the
    relationships appear beside the events they summarize rather than after them. The death is
    disputed and is presented as disputed. Label anchors assert no historical coordinate and 南陽 has
    none: the fixture never places an event at a site a source does not support. This fixture is a
    comparison scenario, not a launch chapter, and no release decision has been taken for it."
  steps:
    - han-submission-233: The Han king's submission and 韓非's embassy, 233 BCE
    - han-qin-submission: The submission request to Qin
    - hanfei-death-233: 韓非 is detained and dies at 雲陽, 233 BCE — a disputed account
    - han-nanyang-cession-231: Han cedes 南陽 and Qin receives it, 231 BCE
    - han-conquest-230: 內史騰 takes Han and makes the 潁川 commandery, 230 BCE
    - han-annexation-yingchuan: Han's land becomes the 潁川 commandery
    - qin-han-conflict: Qin's pressure on Han, 233–230 BCE
    - han-nanyang-cession: The cession of 南陽 as a change of boundaries
    - xinzheng-revolt-226: 新鄭, the former capital, revolts, 226 BCE
