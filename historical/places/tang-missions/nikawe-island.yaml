summary:
  爾加委, the island in the southern sea where 坂合部石布's ship was driven in 659 and most of its people
  were killed.
types: [landform]
names:
  - form: 爾加委
    lang: ja
    script: Hani
    roman: Nikawe
    scheme: hepburn
    cite:
      - id: nikawe-island-name
        says: 伊吉博德's account names the island 爾加委.
        source: nihon-shoki
        at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
        quote: 飄到南海之嶋。嶋名爾加委。
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      No modern identification of 爾加委 is sourced, so no coordinates are asserted; a stop here breaks
      a journey's line.
    cite:
      - id: nikawe-island-location
        says: The text names the place but the record asserts no coordinates for it.
        source: nihon-shoki
        at: 卷第廿六 齊明天皇五年七月戊寅 注 伊吉連博德書
