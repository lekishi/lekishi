notes:
  The entry on the city of 鹽城 in 江蘇省 says a 鹽瀆縣 was set up there in the Han and renamed 鹽城縣
  early in the fifth century, and that the city was made a municipality in 1983. It is a modern
  reference identification, not a source statement of the Tang period.
