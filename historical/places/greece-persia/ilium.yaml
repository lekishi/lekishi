summary:
  Ilium, the city on the site of Troy, where Alexander sacrificed to the Trojan Athena after crossing
  the Hellespont in 334 BCE.
types: [settlement, religious_site]
names:
  - form: Ἴλιος
    lang: grc
    script: Grek
    roman: Ilium
    scheme: other
    note: The Greek form as the gazetteer records it; the reading aid is the form in the cited translation.
    cite:
      - id: ilium-greek-name
        says: Pleiades records the ancient Greek name Ἴλιος for this place.
        source: pleiades
        at: place 550595, name /places/550595/alios, dump 2026-10-21
      - id: ilium-name
        says: Arrian records the report that Alexander went up to Ilium and sacrificed to Athena.
        source: arrian-anabasis
        at: I.11
        quote: It is also said that he went up to Ilium and offered sacrifice to the Trojan Athena
        role: supporting
  - form: Ilium
    lang: en
    script: Latn
    role: alternate
    note: The form in the cited English translation.
    claim: ilium-name
at:
