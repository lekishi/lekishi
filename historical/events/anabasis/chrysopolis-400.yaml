# yaml-language-server: $schema=../../schema/event.schema.json
summary: From Calpe the army marches through Bithynia to Chrysopolis on the Bosporus, opposite Byzantium.
types: [journey]
part_of: [cyrus-expedition-401]
date:
  value: 400 BCE
  mode: window
  calendar: julian
  as_written: on the sixth day reached Chrysopolis
  cite:
    - id: chrysopolis-400-time
      says:
        Grote dates the crossing to Byzantium to October or November 400 BCE; the march to Chrysopolis
        comes just before it.
      basis: interpretation
      attributed_to: George Grote
      sources:
        - source: grote-history-of-greece
          at: vol. IX, ch. LXX
          quote: in the first half of February, the time of Xenophon’s visit
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            and ultimately brought them across the Bosphorus of Thrace to Byzantium, in October or November,
            400 B.C.
    - id: chrysopolis-400-text
      says: Xenophon records the arrival at Chrysopolis.
      source: xenophon-anabasis
      at: VI.6
      quote: and on the sixth day reached Chrysopolis in Chalcedonia .
      role: supporting
places:
  - place: kalpe
    role: start
  - place: chrysopolis
    role: end
participants:
  - actor: cyreans
    role: participant
