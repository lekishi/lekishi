# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  At Issi, the last city of Cilicia, Cyrus's fleet joins the army, bringing Peloponnesian ships
  under a Lacedaemonian admiral and Cheirisophus with seven hundred hoplites.
types: [occurrence]
part_of: [cyrus-expedition-401]
date:
  value: 401 BCE
  mode: window
  calendar: julian
  as_written: to Issi, the last city in Cilicia
  cite:
    - id: issus-fleet-401-time
      says:
        Grote dates the start of the march from Sardis to about March or April 401 BCE and the battle
        of Kunaxa to about September or October of the same year; the stage falls between them.
      basis: conventional
      convention: Xenophon's stages and halts on the standard chronology of the Anabasis
      sources:
        - source: xenophon-anabasis
          at: I.4
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote: was commenced about March or April in the year 401 B.C.
        - source: grote-history-of-greece
          at: vol. IX, ch. LXIX
          quote:
            It was about six months afterwards, in the month of September or October of the same year,
            that the battle of Kunaxa was fought
    - id: issus-fleet-401-text
      says: Xenophon records the army reaching Issi.
      source: xenophon-anabasis
      at: I.4
      quote: and from the Psarus he marched a single stage--five parasangs--to Issi, the last city in Cilicia.
      role: supporting
places:
  - place: issus
    role: site
participants:
  - actor: cyrus-the-younger
    role: leader
  - actor: cheirisophus
    role: participant
  - actor: cyreans
    role: participant
cites:
  summary:
    - id: issus-fleet-401-ships
      says: Xenophon records thirty-five Peloponnesian ships under a Lacedaemonian admiral.
      source: xenophon-anabasis
      at: I.4
      quote:
        There were thirty-five ships from Peloponnesus, with the Lacedaemonian admiral Pythagoras on
        board.
    - id: issus-fleet-401-cheirisophus
      says: Xenophon records Cheirisophus arriving with the fleet.
      source: xenophon-anabasis
      at: I.4
      quote: There was a third officer on board the fleet, the Lacedaemonian Cheirisophus
      role: supporting
