# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  Rome, the city on the Tiber. In the tradition Livy tells, Romulus fortified the Palatine first,
  and the city grew hill by hill under its seven kings; it was the capital of the Roman state under
  the kings, the Republic and the Empire, and later the city of the popes, from which Stephen II set
  out on 14 October 753.
types: [capital, settlement]
names:
  - form: Roma
    lang: la
    script: Latn
    cite:
      - id: rome-name
        says: The life names the city Roma, the Romana urbs from which the pope set out.
        source: liber-pontificalis
        at: Et dum haec agerentur, coniunxit Roma Iohannis, imperialis silentiarius
      - id: rome-name-livy
        says: Livy names the city Roma, which grew on the ruins of Alba under Tullus Hostilius.
        role: supporting
        source: livy
        at: "1.30.1"
        quote: "Roma interim crescit Albae ruinis."
at:
  - interpretation: approximate_point
    precision: locality
    point: [12.4828, 41.8931]
    notes:
      Placed at the coordinate Wikidata records for Rome (Q220), the modern locality identified with
      the place the sources name. It marks the city as a whole, not a building or the founding site,
      which the Palatine record carries.
    cite:
      - id: rome-point
        says: The point is the coordinate Wikidata records for Rome; the identification with the place the sources name is editorial.
        source: wikidata
        at: Q220 (P625), revision 2556161741
      - id: rome-location
        says:
          Pleiades gives a representative point for ancient Roma near the Forum Romanum, with its
          location precision recorded as "related".
        role: supporting
        basis: interpretation
        attributed_to: Pleiades
        source: pleiades
        at: place 423025 (reprLatLong), dump 2026-10-21
modern:
  - form: Roma
    lang: it
    script: Latn
    note: Modern city, recorded for orientation.
external_ids:
  - system: wikidata
    id: Q220
    url: https://www.wikidata.org/wiki/Q220
    license: CC0-1.0
  - system: pleiades
    id: "423025"
notes:
  Shared by every chapter set in or acting from Rome. The record is the city; the Roman state is a
  separate actor in each period (the kings, the Republic, the Empire).
