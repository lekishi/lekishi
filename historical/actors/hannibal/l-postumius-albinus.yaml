# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  Lucius Postumius Albinus, consul-elect for 215 BCE, destroyed with his army in the Litana forest
  by the Boii in 216 BCE.
types: [person]
names:
  - form: L. Postumius
    lang: la
    script: Latn
    cite:
      - id: l-postumius-albinus-name-livy
        says: Livy records the news that L. Postumius, consul-elect, and his army were destroyed in
          Gaul.
        source: livy
        at: "23.24.6"
        quote: L. Postumium consulem designatum in Gallia ipsum atque exercitum deletos
notes: The cognomen Albinus is the conventional form.
