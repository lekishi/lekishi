# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  The Lake of the Amorites, which Sayce identifies with the lake of Homs, by whose waters the Hittite
  ambush fell on the Egyptian army at Kadesh.
types: [landform]
names:
  - form: the Lake of the Amorites
    lang: en
    script: Latn
    cite:
      - id: lake-of-homs-name
        says: Sayce places the attack by the waters of the Lake of the Amorites, the modern Lake of Homs.
        source: sayce-hittites
        at: "ch. II: Kadesh, the ambush"
        quote:
          The whole host was concealed in ambush on the north-west side of Kadesh. Suddenly they arose
          and fell upon the terrified Egyptians by the waters of the Lake of the Amorites, the modern Lake
          of Homs.
at:
  - interpretation: unknown
    precision: unspecified
    notes:
      The lake Sayce means lies on the Orontes south-west of Homs, impounded by a dam that Pleiades
      records as unnamed (place 671952). Whether the lake existed in this form in the Bronze Age is not
      settled by the sources read here, so the record asserts no coordinate.
    cite:
      - id: lake-of-homs-unlocated
        says: Sayce names the lake without describing its extent.
        source: sayce-hittites
        at: "ch. II: Kadesh, the ambush"
