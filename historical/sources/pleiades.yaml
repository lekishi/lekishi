title: Pleiades, a gazetteer of past places
edition: Pleiades daily data dump of 2026-10-21 (pleiades-places-20261021.csv.gz and
  pleiades-names-20261021.csv.gz from atlantides.org); each citation names the place id, the
  field read, and the dump date
