# yaml-language-server: $schema=../../schema/event.schema.json
summary: >-
  Confucius goes back from 楚 to 衛, where many of his disciples serve 出公. Asked what he would do first
  if given the government, he says: set the names right. This is the 孔子世家's account; the table and
  the 衛 house bring him from 陳 in 485 BCE instead.
types: [occurrence]
date:
  value: 489 BCE
  mode: window
  calendar: chinese_lunisolar
  as_written: 魯哀公六年
  cite:
    - id: kongzi-returns-wey-date-489
      says: The 孔子世家 puts the return to 衛 in 魯哀公's sixth year, 489 BCE.
      source: shiji-chunqiu
      at: 卷四十七 孔子世家（是歲也，孔子年六十三，而魯哀公六年也）
      quote: 於是孔子自楚反乎衞。是歲也，孔子年六十三，而魯哀公六年也。
places:
  - place: wey-diqiu
    role: site
    note: The capital of the state the text names; the text names only the state.
participants:
  - actor: kongzi
    role: leader
  - actor: zi-lu
    role: participant
  - actor: wey-state
    role: host
dispute:
  status: disputed
  summary: >-
    The 孔子世家 brings Confucius back to 衛 from 楚 in 489 BCE; the table and the 衛 house bring him from 陳
    in 485 BCE (`kongzi-returns-wey-485`). They are rival accounts of the same last return, not two
    returns.
cite:
  - id: kongzi-returns-wey-basis
    says: The 孔子世家 records his return from 楚 to 衛.
    source: shiji-chunqiu
    at: 卷四十七 孔子世家（於是孔子自楚反乎衞）
    quote: 於是孔子自楚反乎衞。
  - id: kongzi-returns-wey-from-chen
    says: >-
      The table and the 衛 house bring Confucius to 衛 from 陳 in 出公's eighth year, 485 BCE, not from 楚 in
      489 BCE.
    role: conflicting
    source: shiji-chunqiu
    at: 卷三十七 衛康叔世家 出公（孔子自陳入衞）
    quote: 孔子自陳入衞。
