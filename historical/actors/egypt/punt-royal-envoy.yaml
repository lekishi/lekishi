# yaml-language-server: $schema=../../schema/actor.schema.json
summary:
  The royal envoy Hatshepsut put in command of the five galleys, who landed in Punt with eight
  soldiers and an officer. Maspero does not name him.
types: [person]
names:
  - form: the royal envoy
    lang: en
    script: Latn
    note: Unnamed in the source read here.
    cite:
      - id: punt-royal-envoy-name
        says: Maspero says the vessels were put under the command of a royal envoy.
        source: maspero-history-of-egypt
        at: "vol. IV, ch. III: the fleet"
        quote:
          Hâtshopsîtû chose out five well-built galleys, and manned them with picked crews. She caused
          them to be laden with such merchandise as would be most attractive to the barbarians, and placing
          the vessels under the command of a royal envoy
roles:
  - role: envoy
notes:
  Other translations of the reliefs name the commander; this record will take that name when a source
  for it is read.
