# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Hammurabi becomes king of Babylon, succeeding his father Sin-muballit. His first year is named
  for his accession.
types: [occurrence]
part_of: [hammurabi-reign]
date:
  value: 1792 BCE..1750 BCE
  mode: window
  calendar: regnal
  as_written: the year in which Hammurabi became king (year 1)
  cite:
    - says: The Louvre dates Hammurabi's reign, and the stele, to -1792/-1750, the modern middle chronology.
      basis: interpretation
      attributed_to: Musée du Louvre
      source: louvre-code-of-hammurabi
      at: "caption: Code de Hammurabi, -1792 / -1750"
places:
  - place: babylon
    role: site
participants:
  - actor: hammurabi
    role: subject
  - actor: sin-muballit
    role: other
    note: His father and predecessor.
cite:
  - says: The Hastings dictionary gives the first year-name of the reign.
    source: hastings-dictionary-bible
    at: Assyria and Babylonia, Chronology, (a) Year-names
    quote: the year in which Hammurabi became king
  - says: The prologue calls Hammurabi the mighty son of Sin-muballit.
    source: king-code-of-hammurabi
    at: prologue
    quote: the mighty son of Sin-muballit
    role: supporting
notes:
  The text dates the event by the year-name of Hammurabi's first year. No cited source converts that
  year to a BCE year, so the date is the reign's window in the middle chronology the Louvre uses; a regnal
  calendar with a cited epoch would narrow it to one year. The year depends on the chronology, which the
  reign records as a dispute.
