notes:
  The city's report on the 南门遗址, part of the 扬州城遗址 (隋—宋), a national key protected site. It
  reports that the 1986 review and the 2007 excavation by the 扬州唐城考古工作队 established that the
  south gate of the Tang 羅城 and of the later cities stood at the 南门, under the modern old city. It
  reports a modern archaeological identification, not a source statement of the eighth century.
  Locators count the report's sections.
