# yaml-language-server: $schema=../../schema/place.schema.json
summary:
  難波, the Naniwa area, named in the 東征傳 as the place 鑒眞's party reached on the first day of
  the second month of 天平勝寶六年 (754) on the way from 大宰府 to the capital.
types: [settlement]
names:
  - form: 難波
    lang: ja
    script: Hani
    roman: Naniwa
    scheme: hepburn
    cite:
      - id: naniwa-name
        says: The biography names 難波 as the place the party reached on 天平勝寶六年二月一日.
        source: toseiden
        at: 天平勝寶六年甲午 二月一日到難波
at:
  - interpretation: approximate_point
    precision: region
    point: [135.52327778, 34.68065194]
    notes:
      A region-level placement at the 難波宮跡, the site of the palace at 難波 rebuilt from 726 and in
      use in the period. The biography names 難波, not the palace, so the point stands for the area
      and asserts no landing, lodging, or building.
    cite:
      - id: naniwa-identification
        says:
          The 難波宮跡 at 大阪市中央区法円坂 holds two palaces confirmed by excavation from 1961, the later
          one built from 726 (神亀3年). The point is the palace site's modern coordinate from Wikidata
          (CC0), placed to stand for the 難波 area.
        basis: interpretation
        attributed_to: 大阪観光局 (Osaka Convention & Tourism Bureau)
        sources:
          - source: osaka-info-naniwa-palace
            at: 難波宮跡公園
          - source: wikidata
            at: Q3608523 (P625), revision 2516927439
modern:
  - form: 大阪市
    lang: ja
    script: Hani
    note: Modern city recorded for orientation; the 難波宮跡 lies in its 中央区.
notes:
  The place is recorded because the 東征傳 names it on a dated leg of 鑒眞's journey. The point stands
  for the 難波 area at its palace site, at region precision; no site-level identification of where
  the party arrived is asserted.
