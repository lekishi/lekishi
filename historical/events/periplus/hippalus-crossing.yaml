# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  The pilot Hippalus learns to sail straight across the open ocean to India on the south-west wind,
  which comes to bear his name, and the coasting voyage gives way to the direct crossing.
types: [occurrence]
date:
  value: 41..58
  mode: window
  calendar: julian
  as_written:
    '"about 47 A. D." (Vincent); "not long before the author of the Periplus made his voyage"
    (Schoff)'
  cite:
    - id: hippalus-time
      says:
        Schoff reports Vincent's date of about 47 CE, reasoned from Pliny's story of the freedman under
        Claudius, whose reign began in 41, and says the discovery came not long before the Periplus; the
        window runs from 41 to Schoff's earliest date for the voyage.
      basis: interpretation
      attributed_to: W. Vincent, as reported by W. H. Schoff (1912)
      source: schoff-periplus
      at: Date and Authorship of the Periplus
      quote:
        Hippalus’ discovery of the sea-route to India, described in § 57, is fixed by Vincent at about
        47 A. D.
places:
  - place: cana
    role: start
    note: The Periplus says ships now start direct from Cana or from the Cape of Spices.
  - place: muziris
    role: end
    note: Damirica, of which Muziris is the leading market; the Periplus names no single port.
participants:
  - actor: hippalus
    role: leader
cite:
  - id: hippalus-account
    says:
      The Periplus says Hippalus first discovered how to lay his course straight across the ocean, and
      the south-west wind is called by his name.
    source: periplus-erythraean-sea
    at: "57"
    quote:
      and this southwest wind is called Hippalus, from the name of him who first discovered the passage
      across.
notes:
  Muziris stands for Damirica as the crossing's end so that the line can be drawn; the Periplus says
  only that ships bound for Damirica throw the ship's head off the wind.
