# yaml-language-server: $schema=../../schema/event.schema.json
summary: "In 227 BCE the king sent 王翦 and 辛勝 against Yan. Yan and 代 sent out their armies, and the annals record Qin breaking Yan west of the 易水; the comprehensive mirror says Qin fought the Yan and 代 armies there and routed them."
types: [campaign]
date:
  value: "227 BCE"
  mode: window
  calendar: chinese_lunisolar
  as_written: "二十年（秦軍破燕易水之西）; 始皇帝二十年（戰於易水之西）"
  cite:
    - says: "The annals record the generals sent, the Yan and 代 armies, and Qin breaking Yan west of the 易水 in 二十年 (227 BCE)."
      source: shiji
      at: "卷六 秦始皇本紀 二十年（秦軍破燕易水之西）"
      quote: "而使王翦、辛勝攻燕。燕、代發兵擊秦軍，秦軍破燕易水之西。"
    - says: "The comprehensive mirror records the battle with the Yan and 代 armies west of the 易水."
      role: supporting
      source: zizhi-tongjian-qin-ji-2
      at: "卷七 秦紀二 始皇帝二十年（戰於易水之西）"
      quote: "與燕師、代師戰於易水之西，大破之。"
places:
  - place: yishui
    role: site
    note: "West of the river, in both accounts; no battlefield is asserted."
participants:
  - actor: wang-jian
    role: leader
  - actor: xin-sheng
    role: leader
  - actor: yan-state
    role: subject
  - actor: dai-state
    role: participant
    note: "Sent its army with Yan's."
