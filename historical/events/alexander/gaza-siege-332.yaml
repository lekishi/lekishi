# yaml-language-server: $schema=../../schema/event.schema.json
summary:
  Batis, the eunuch commanding Gaza, refuses to submit; Alexander raises a mound around the city
  on its hill and takes it by storm.
types: [occurrence]
part_of: [alexander-campaigns-334]
date:
  value: 332 BCE..331 BCE
  mode: window
  calendar: julian
  as_written: SIEGE OF GAZA
  cite:
    - id: gaza-siege-332-time
      says:
        Chinnock dates the fall of Tyre to the end of July or beginning of August 332 BCE and the arrival
        at Thapsacus to June–July 331 BCE; this stage lies between.
      basis: interpretation
      attributed_to: E. J. Chinnock
      sources:
        - source: arrian-anabasis
          at: II.24, note 331
          quote: The end of July and beginning of August B.C. 332.
        - source: arrian-anabasis
          at: III.7, note 381
          quote: June-July, B.C. 331.
    - id: gaza-siege-332-text
      says: Arrian records Batis refusing to submit.
      source: arrian-anabasis
      at: II.25
      quote:
        but a certain eunuch, named Batis, who was in possession of the city of Gaza, paid no heed
        to him
      role: supporting
places:
  - place: gaza
    role: site
participants:
  - actor: alexander-the-great
    role: leader
cites:
  places:
    - id: gaza-siege-332-place
      says: Arrian describes Gaza on its mound.
      source: arrian-anabasis
      at: II.26
      quote:
        The city of Gaza was large, and had been built upon a lofty mound, around which a strong wall
        had been carried.
