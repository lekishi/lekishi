# yaml-language-server: $schema=../../schema/relationship.schema.json
summary:
  Hanno's fleet and the Lixitae stay together some time as friends by the river Lixus, and the
  Lixitae give the fleet the interpreters it relies on for the rest of the voyage.
types: [contact]
from: hanno
to: lixitae
directionality: mutual
causality: not_asserted
date:
  value: 570 BCE..470 BCE
  mode: window
  calendar: julian
  as_written: ἐμείναμεν ἄχρι τινός, φίλοι γενόμενοι
  cite:
    - id: hanno-lixitae-time
      says:
        The account dates the stay no more closely than the undated voyage, whose window the cited
        commentators set between about 570 and 470 BCE.
      basis: interpretation
      attributed_to: W. H. Schoff (1913)
      sources:
        - source: hanno-periplus
          at: "6"
        - source: schoff-hanno
          at: Carthaginian Chronology
cite:
  - id: hanno-lixitae-friendship
    says: The account says the fleet stayed some time with the Lixitae, becoming friends, and took
      interpreters from them.
    sources:
      - source: hanno-periplus
        at: "6"
        quote: παρ᾽ οἷς ἐμείναμεν ἄχρι τινός, φίλοι γενόμενοι.
      - source: hanno-periplus
        at: "8"
        quote: Λαβόντες δὲ παρ᾽ αὐτῶν ἑρμηνέας
notes:
  The interpreters reappear at sections 11, 14 and 18, where they cannot understand the Aithiopes'
  speech, name the Horn of the West, and name the Gorillae. The contact is the voyage's one
  friendly exchange.
