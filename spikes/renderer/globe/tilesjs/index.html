<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Cinzel:wght@600&display=swap">
<style>
  html,body{margin:0;height:100%;background:#0b1016;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;pointer-events:none}
  .lbl b{display:block;font:500 15px "Noto Serif JP","Hiragino Mincho ProN","IPAGothic",serif;color:#f3ead7;text-shadow:0 0 3px #0b1114,0 0 6px #0b1114,0 1px 0 #0b1114}
  .lbl i{display:block;font:600 8.5px "Cinzel",serif;letter-spacing:.16em;color:#b9af9c;font-style:normal;text-shadow:0 0 3px #0b1114,0 0 5px #0b1114}
  .lbl::after{content:"";display:block;width:1px;height:14px;margin:2px auto 0;background:rgba(243,234,215,.7)}
  .lbl.sel b{color:#f1cf7a}
  .lbl.realm{transform:translate(-50%,-50%)} .lbl.realm b{font-size:22px;letter-spacing:.35em;font-weight:700;opacity:.9} .lbl.realm i{font-size:10px;letter-spacing:.4em} .lbl.realm::after{display:none}
  .lbl.sea{transform:translate(-50%,-50%)} .lbl.sea b{font-size:13px;letter-spacing:.3em;color:#eaf4f7;opacity:.85} .lbl.sea i{color:#cfe0e6;letter-spacing:.3em} .lbl.sea::after{display:none}
  .lbl.region{transform:translate(-50%,-50%)} .lbl.region b{font-size:13px;letter-spacing:.2em} .lbl.region::after{display:none}
  #stats{position:absolute;left:10px;top:10px;background:rgba(10,14,18,.8);color:#f3ead7;font:11px/1.5 ui-monospace,monospace;padding:8px 10px;border-radius:4px;border:1px solid rgba(210,169,79,.4);white-space:pre}
  #credit{position:absolute;right:8px;bottom:6px;color:rgba(243,234,215,.6);font:10px system-ui,sans-serif;pointer-events:none}
</style>
<canvas id="c"></canvas>
<div id="labels"></div>

}}</script>
