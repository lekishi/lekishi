notes: 'A 1910 reference work. The "Hammurabi" entry, by Charles L. Souvay (vol. 7), lists the
  datings of Hammurabi''s reign proposed by the king lists and by six scholars of its day, none of
  them the modern middle chronology, and summarizes his conquests by regnal year. Its datings and
  its identification of Hammurabi with the Amraphel of Genesis 14 are cited as the author''s
  interpretation.'
