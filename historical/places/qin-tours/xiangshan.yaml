summary: 湘山, whose shrine 始皇 reached by river in 219 BCE; angered by a storm, he had three thousand convicts strip the hill of its trees. The label anchor sits at the modern 君山島 in 洞庭湖; it asserts no historical site.
types: [landform]
names:
  - form: 湘山
    lang: lzh
    script: Hani
    roman: Xiangshan
    scheme: pinyin
    cite:
      - id: xiangshan-name
        says: The annals record 始皇 sailing the river to the 湘山 shrine.
        source: shiji
        at: 卷六 秦始皇本紀 二十八年（至湘山祠）
        quote: 浮江，至湘山祠
at:
